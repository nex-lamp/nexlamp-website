<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b3355" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="680" height="620" fill="url(#bg)"/>
  <rect width="680" height="620" fill="url(#grid)" opacity="0.55"/>

  <text x="34" y="46" fill="#7ec27e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" letter-spacing="2">同一句「缓开缓灭」，慢动作里是三条不同的曲线</text>
  <text x="34" y="70" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">手机 240fps 拍一次开、一次关，回放就知道是哪一条</text>
  <line x1="34" y1="84" x2="646" y2="84" stroke="#1b3355" stroke-width="1"/>

  <!-- 卡1 真平滑 -->
  <rect x="34" y="104" width="196" height="266" rx="12" fill="#101f38" stroke="#2f5a3c" stroke-width="1.4"/>
  <text x="52" y="132" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">01 真平滑</text>
  <line x1="52" y1="142" x2="212" y2="142" stroke="#1f3a5c" stroke-width="1"/>
  <line x1="62" y1="330" x2="204" y2="330" stroke="#1b3355" stroke-width="1"/>
  <line x1="62" y1="160" x2="62" y2="330" stroke="#1b3355" stroke-width="1"/>
  <path d="M62 172 H96 Q118 172 128 240 Q136 300 168 322 H204" fill="none" stroke="#7ec27e" stroke-width="2.6" filter="url(#glow)"/>
  <text x="52" y="356" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="12">亮度沿曲线走，尾巴收得干净</text>
  <text x="52" y="378" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">曲线在驱动固件里，位深够</text>
  <text x="52" y="398" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">两头都有收口，断网照走</text>

  <!-- 卡2 开机跳最亮 -->
  <rect x="242" y="104" width="196" height="266" rx="12" fill="#101f38" stroke="#26456e" stroke-width="1.2"/>
  <text x="260" y="132" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">02 先跳最亮再回落</text>
  <line x1="260" y1="142" x2="420" y2="142" stroke="#1f3a5c" stroke-width="1"/>
  <line x1="270" y1="330" x2="412" y2="330" stroke="#1b3355" stroke-width="1"/>
  <line x1="270" y1="160" x2="270" y2="330" stroke="#1b3355" stroke-width="1"/>
  <path d="M270 322 V168 H300 V232 H412" fill="none" stroke="#e8b26a" stroke-width="2.6" filter="url(#glow)"/>
  <text x="260" y="356" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="12">通电瞬间全亮一下，再回设定值</text>
  <text x="260" y="378" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">MCU 复位后 IO 默认高电平</text>
  <text x="260" y="398" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">main 第一行没清零占空比</text>

  <!-- 卡3 断崖 -->
  <rect x="450" y="104" width="196" height="266" rx="12" fill="#101f38" stroke="#5a3c3c" stroke-width="1.4"/>
  <text x="468" y="132" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">03 缓灭到一半断崖</text>
  <line x1="468" y1="142" x2="628" y2="142" stroke="#1f3a5c" stroke-width="1"/>
  <line x1="478" y1="330" x2="620" y2="330" stroke="#1b3355" stroke-width="1"/>
  <line x1="478" y1="160" x2="478" y2="330" stroke="#1b3355" stroke-width="1"/>
  <path d="M478 172 H512 L520 236 H556 V322 H620" fill="none" stroke="#e07a5f" stroke-width="2.6" filter="url(#glow)"/>
  <text x="468" y="356" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="12">走到中途直接切黑，台阶不见</text>
  <text x="468" y="378" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">可调下限就在中段，下面没档位</text>
  <text x="468" y="398" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">或位深不够，低区已归零</text>

  <!-- 底部结论 -->
  <rect x="34" y="398" width="612" height="76" rx="10" fill="#132743" stroke="#26456e" stroke-width="1"/>
  <text x="52" y="426" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700">同一个卖点，三种板子</text>
  <text x="52" y="452" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="12.5">缓不缓，看的不是灯珠，是驱动板上那三件事：上电状态、Gamma 位深、最低亮度死区</text>

  <line x1="34" y1="496" x2="646" y2="496" stroke="#1b3355" stroke-width="1"/>
  <text x="34" y="524" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">横轴＝时间　纵轴＝亮度　曲线为示意，不代表具体产品实测值</text>
  <text x="34" y="552" fill="#5e7896" font-family="Microsoft YaHei, sans-serif" font-size="11">NEXLAMP · 灯具与驱动电源技术笔记</text>
</svg>
