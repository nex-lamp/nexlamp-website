<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b30"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="glowBad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4757"/>
      <stop offset="1" stop-color="#ff6b81"/>
    </linearGradient>
    <linearGradient id="glowGood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ed573"/>
      <stop offset="1" stop-color="#7bed9f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#1b2f4e" stroke-width="1" opacity="0.5">
    <path d="M0 60H960M0 120H960M0 180H960M0 240H960M0 300H960M0 360H960M0 420H960M0 480H960"/>
    <path d="M80 0V540M160 0V540M240 0V540M320 0V540M400 0V540M480 0V540M560 0V540M640 0V540M720 0V540M800 0V540M880 0V540"/>
  </g>
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.35">
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="380" x2="960" y2="380"/>
  </g>

  <!-- title -->
  <text x="480" y="42" text-anchor="middle" fill="#e2f3ff" font-size="26" font-weight="700" letter-spacing="2">纹波对比：驱动输出的"稳"与"抖"</text>
  <text x="480" y="66" text-anchor="middle" fill="#7ea6c8" font-size="14">LED 是电流驱动器件 —— 电流抖，光就闪</text>

  <!-- ===== BAD driver panel ===== -->
  <rect x="40" y="95" width="880" height="130" rx="12" fill="#131f35" stroke="#ff4757" stroke-opacity="0.35"/>
  <circle cx="75" cy="126" r="4" fill="#ff4757" filter="url(#glow)"/>
  <text x="90" y="131" fill="#ff6b81" font-size="17" font-weight="700">劣质驱动 · 满载纹波高</text>
  <text x="740" y="131" text-anchor="end" fill="#ff4757" font-size="15" font-family="Consolas,monospace">ripple &gt; 30%</text>
  <!-- jitter waveform -->
  <polyline points="80,195 140,160 200,190 260,158 320,192 380,160 440,192 500,158 560,192 620,160 680,190 740,160 800,192 860,158 900,190"
            fill="none" stroke="url(#glowBad)" stroke-width="3" filter="url(#soft)"/>
  <g fill="#ff6b81" font-size="12" font-family="Consolas,monospace">
    <text x="160" y="235" text-anchor="middle" opacity="0.85">电流起伏大</text>
  </g>

  <!-- ===== BAD dimming note ===== -->
  <rect x="40" y="238" width="880" height="52" rx="10" fill="#1a1530" stroke="#ffa502" stroke-opacity="0.4"/>
  <text x="60" y="262" fill="#ffa502" font-size="15" font-weight="700">⚠ 调光至 10% 亮度：PWM 频率过低 + 纹波放大</text>
  <text x="60" y="280" fill="#c9a46a" font-size="13">→ 摄像头一拍全是滚动条纹 · 眼睛虽看不见，视觉疲劳真实存在</text>

  <!-- ===== GOOD driver panel ===== -->
  <rect x="40" y="310" width="880" height="130" rx="12" fill="#10251f" stroke="#2ed573" stroke-opacity="0.35"/>
  <circle cx="75" cy="341" r="4" fill="#2ed573" filter="url(#glow)"/>
  <text x="90" y="346" fill="#7bed9f" font-size="17" font-weight="700">优质驱动 · 满载纹波低</text>
  <text x="740" y="346" text-anchor="end" fill="#2ed573" font-size="15" font-family="Consolas,monospace">ripple &lt;= 5%</text>
  <!-- smooth waveform -->
  <polyline points="80,430 150,412 220,418 290,410 360,416 430,410 500,417 570,410 640,416 710,411 780,417 860,411 900,416"
            fill="none" stroke="url(#glowGood)" stroke-width="3" filter="url(#soft)"/>

  <!-- footer badges -->
  <rect x="40" y="462" width="200" height="44" rx="8" fill="#12203a"/>
  <text x="60" y="480" fill="#7ea6c8" font-size="12">判断标准</text>
  <text x="60" y="497" fill="#e2f3ff" font-size="14" font-weight="700">波动深度 ≤ 5%</text>

  <rect x="260" y="462" width="220" height="44" rx="8" fill="#12203a"/>
  <text x="280" y="480" fill="#7ea6c8" font-size="12">快速自测</text>
  <text x="280" y="497" fill="#e2f3ff" font-size="14" font-weight="700">手机拍视频看条纹</text>

  <rect x="500" y="462" width="420" height="44" rx="8" fill="#12203a"/>
  <text x="520" y="480" fill="#7ea6c8" font-size="12">要点</text>
  <text x="520" y="497" fill="#e2f3ff" font-size="14" font-weight="700">只报"满载无频闪"、不敢报低亮度档的，直接 pass</text>
</svg>
