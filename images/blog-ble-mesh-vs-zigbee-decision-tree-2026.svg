<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f2a4a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad2)"/>

  <!-- Grid -->
  <g stroke="#1a3a5a" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="50" x2="680" y2="50"/>
    <line x1="0" y1="100" x2="680" y2="100"/>
    <line x1="0" y1="150" x2="680" y2="150"/>
    <line x1="0" y1="200" x2="680" y2="200"/>
    <line x1="0" y1="250" x2="680" y2="250"/>
    <line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="350" x2="680" y2="350"/>
  </g>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" fill="#4a9eff" font-family="Arial,sans-serif" font-size="15" font-weight="bold" filter="url(#glow2)">智能照明协议选型决策树</text>

  <!-- Root node -->
  <rect x="270" y="50" width="140" height="36" rx="18" fill="#1a3a6a" stroke="#4a9eff" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="340" y="73" text-anchor="middle" fill="#4a9eff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">你的智能灯有多少盏？</text>

  <!-- Left branch: ≤30 -->
  <path d="M 280 86 L 200 120 L 140 120" fill="none" stroke="#4a9eff" stroke-width="1.5" opacity="0.6"/>
  <text x="220" y="112" text-anchor="middle" fill="#8ab4f8" font-family="Arial,sans-serif" font-size="11">≤30盏</text>

  <rect x="70" y="120" width="140" height="36" rx="18" fill="#1a3a6a" stroke="#4a9eff" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="140" y="143" text-anchor="middle" fill="#4a9eff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">房屋面积多大？</text>

  <!-- Left-left: <60㎡ -->
  <path d="M 100 156 L 60 195 L 40 195" fill="none" stroke="#4a9eff" stroke-width="1.5" opacity="0.6"/>
  <text x="70" y="188" text-anchor="middle" fill="#8ab4f8" font-family="Arial,sans-serif" font-size="10">&lt;60㎡</text>

  <rect x="10" y="200" width="120" height="30" rx="15" fill="#1a4a3a" stroke="#4ade80" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="70" y="220" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">蓝牙Mesh ✅</text>
  <text x="70" y="245" text-anchor="middle" fill="#6acf80" font-family="Arial,sans-serif" font-size="9">省网关，配网方便</text>

  <!-- Left-right: >60㎡ -->
  <path d="M 180 156 L 220 195 L 240 195" fill="none" stroke="#4a9eff" stroke-width="1.5" opacity="0.6"/>
  <text x="210" y="188" text-anchor="middle" fill="#8ab4f8" font-family="Arial,sans-serif" font-size="10">&gt;60㎡</text>

  <rect x="170" y="200" width="120" height="30" rx="15" fill="#1a4a3a" stroke="#4ade80" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="230" y="220" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Zigbee ✅</text>
  <text x="230" y="245" text-anchor="middle" fill="#6acf80" font-family="Arial,sans-serif" font-size="9">设备少但面积大，需中继</text>

  <!-- Right branch: >30 -->
  <path d="M 400 86 L 480 120 L 540 120" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>
  <text x="460" y="112" text-anchor="middle" fill="#ff8888" font-family="Arial,sans-serif" font-size="11">&gt;30盏</text>

  <rect x="470" y="120" width="140" height="36" rx="18" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="540" y="143" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="12" font-weight="bold">是否有跨楼层？</text>

  <!-- Right-left: single floor -->
  <path d="M 500 156 L 460 195 L 420 195" fill="none" stroke="#4a9eff" stroke-width="1.5" opacity="0.6"/>
  <text x="470" y="188" text-anchor="middle" fill="#8ab4f8" font-family="Arial,sans-serif" font-size="10">单层</text>

  <rect x="360" y="200" width="120" height="30" rx="15" fill="#1a4a3a" stroke="#4ade80" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="420" y="220" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Zigbee ✅</text>
  <text x="420" y="245" text-anchor="middle" fill="#6acf80" font-family="Arial,sans-serif" font-size="9">Mesh稳定，延迟低</text>

  <!-- Right-right: multi-floor -->
  <path d="M 580 156 L 620 195 L 640 195" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>
  <text x="610" y="188" text-anchor="middle" fill="#ff8888" font-family="Arial,sans-serif" font-size="10">复式/别墅</text>

  <rect x="540" y="200" width="130" height="30" rx="15" fill="#1a4a3a" stroke="#4ade80" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="605" y="220" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Zigbee必须 ✅</text>
  <text x="605" y="245" text-anchor="middle" fill="#6acf80" font-family="Arial,sans-serif" font-size="9">跨楼层信号接力不可替代</text>

  <!-- Mixed architecture box -->
  <rect x="190" y="280" width="300" height="60" rx="10" fill="#1a2a4a" stroke="#7a8aff" stroke-width="1" stroke-dasharray="4,2" filter="url(#glow2)"/>
  <text x="340" y="300" text-anchor="middle" fill="#7a8aff" font-family="Arial,sans-serif" font-size="11" font-weight="bold">⭐ 混合架构（120㎡+ / 30-50设备）</text>
  <text x="340" y="318" text-anchor="middle" fill="#8a9acf" font-family="Arial,sans-serif" font-size="10">蓝牙Mesh管传感器/无线面板 + Zigbee管灯具/核心节点</text>
  <text x="340" y="332" text-anchor="middle" fill="#6a7a9f" font-family="Arial,sans-serif" font-size="9">通过双协议网关桥接联动</text>

  <!-- Connect mixed to both sides -->
  <path d="M 230 275 L 230 270 L 340 280" fill="none" stroke="#7a8aff" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
  <path d="M 450 275 L 450 270 L 340 280" fill="none" stroke="#7a8aff" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- Bottom legend -->
  <rect x="20" y="360" width="14" height="14" rx="3" fill="#1a4a3a" stroke="#4ade80" stroke-width="1"/>
  <text x="40" y="372" fill="#6acf80" font-family="Arial,sans-serif" font-size="9">推荐方案</text>
  <rect x="140" y="360" width="14" height="14" rx="3" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="160" y="372" fill="#cf8080" font-family="Arial,sans-serif" font-size="9">关键判断点</text>

  <text x="340" y="372" text-anchor="middle" fill="#4a6a8a" font-family="Arial,sans-serif" font-size="9">NEXLAMP | 涂鸦Zigbee智能照明 | www.nexlamp.com</text>
</svg>
