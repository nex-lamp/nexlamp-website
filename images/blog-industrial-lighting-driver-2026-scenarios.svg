<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0L0 0L0 20" fill="none" stroke="#1a2d4d" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="420" fill="#0a1628"/>
  <rect width="680" height="420" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="30" y="20" width="620" height="36" rx="6" fill="#111d33" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="50" cy="38" r="5" fill="#ff5f56"/>
  <circle cx="68" cy="38" r="5" fill="#ffbd2e"/>
  <circle cx="86" cy="38" r="5" fill="#27c93f"/>
  <text x="340" y="43" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="14" font-weight="500">工业场景 vs 家居场景：驱动要求对比</text>

  <!-- Industrial side -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="290" height="300" rx="10" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="40" rx="10" fill="#1e4d6b" opacity="0.4"/>
    <text x="145" y="26" text-anchor="middle" fill="#5ab4e6" font-family="monospace" font-size="14" font-weight="500">工业场景</text>

    <text x="20" y="70" fill="#c8ddf0" font-family="monospace" font-size="11">• 24小时或长时段运行</text>
    <text x="20" y="95" fill="#c8ddf0" font-family="monospace" font-size="11">• 顶部温度 50℃~70℃</text>
    <text x="20" y="120" fill="#c8ddf0" font-family="monospace" font-size="11">• 粉尘 / 油污 / 盐雾</text>
    <text x="20" y="145" fill="#c8ddf0" font-family="monospace" font-size="11">• 电网波动 &amp; 雷击浪涌</text>
    <text x="20" y="170" fill="#c8ddf0" font-family="monospace" font-size="11">• 更换成本高、停产损失大</text>

    <line x1="20" y1="195" x2="270" y2="195" stroke="#1e4d6b" stroke-width="1"/>
    <text x="20" y="220" fill="#7ec27e" font-family="monospace" font-size="11" font-weight="500">驱动要求：</text>
    <text x="20" y="245" fill="#a0c4e8" font-family="monospace" font-size="10">IP65+ · 宽温域 · 高效率</text>
    <text x="20" y="265" fill="#a0c4e8" font-family="monospace" font-size="10">多重保护 · 5年质保</text>
    <text x="20" y="285" fill="#e6a845" font-family="monospace" font-size="10">本质是电力设备</text>
  </g>

  <!-- Home side -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="290" height="300" rx="10" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="40" rx="10" fill="#1e4d6b" opacity="0.4"/>
    <text x="145" y="26" text-anchor="middle" fill="#9b7ed8" font-family="monospace" font-size="14" font-weight="500">家居场景</text>

    <text x="20" y="70" fill="#c8ddf0" font-family="monospace" font-size="11">• 每天运行 3-6 小时</text>
    <text x="20" y="95" fill="#c8ddf0" font-family="monospace" font-size="11">• 室温环境 20℃~28℃</text>
    <text x="20" y="120" fill="#c8ddf0" font-family="monospace" font-size="11">• 灰尘可控、无腐蚀</text>
    <text x="20" y="145" fill="#c8ddf0" font-family="monospace" font-size="11">• 市电相对稳定</text>
    <text x="20" y="170" fill="#c8ddf0" font-family="monospace" font-size="11">• 更换方便、成本低</text>

    <line x1="20" y1="195" x2="270" y2="195" stroke="#1e4d6b" stroke-width="1"/>
    <text x="20" y="220" fill="#7ec27e" font-family="monospace" font-size="11" font-weight="500">驱动要求：</text>
    <text x="20" y="245" fill="#a0c4e8" font-family="monospace" font-size="10">IP20 · 标准温域 · 基础效率</text>
    <text x="20" y="265" fill="#a0c4e8" font-family="monospace" font-size="10">基本保护 · 2-3年质保</text>
    <text x="20" y="285" fill="#9b7ed8" font-family="monospace" font-size="10">本质是消费电器</text>
  </g>

  <!-- Center VS badge -->
  <circle cx="340" cy="230" r="28" fill="#0d1f3a" stroke="#7ec27e" stroke-width="2" filter="url(#glow)"/>
  <text x="340" y="238" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="14" font-weight="700">VS</text>
</svg>