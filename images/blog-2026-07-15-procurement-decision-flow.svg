<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">采购应对策略决策流程</text>
  <text x="400" y="55" text-anchor="middle" fill="#708090" font-size="12">涨价潮中该不该买？怎么买？</text>

  <!-- Start node -->
  <g filter="url(#glow2)">
    <rect x="300" y="75" width="200" height="45" rx="22" fill="#1a3a5a" stroke="#4a9eff" stroke-width="2"/>
    <text x="400" y="103" text-anchor="middle" fill="#4a9eff" font-size="14" font-weight="bold">有采购需求？</text>
  </g>

  <!-- Arrow down -->
  <path d="M 400 120 L 400 145" stroke="#4a9eff" stroke-width="2" fill="none"/>

  <!-- Decision 1: In progress? -->
  <g filter="url(#glow2)">
    <polygon points="400,145 530,195 400,245 270,195" fill="#1a2a4a" stroke="#ffa552" stroke-width="2"/>
    <text x="400" y="190" text-anchor="middle" fill="#ffa552" font-size="13" font-weight="bold">项目在建</text>
    <text x="400" y="208" text-anchor="middle" fill="#ffa552" font-size="13" font-weight="bold">或近期采购？</text>
  </g>

  <!-- Left branch: Yes -->
  <path d="M 270 195 L 150 195 L 150 225" stroke="#50c878" stroke-width="2" fill="none"/>
  <text x="210" y="185" text-anchor="middle" fill="#50c878" font-size="11" font-weight="bold">是</text>

  <g filter="url(#glow2)">
    <rect x="40" y="225" width="220" height="80" rx="8" fill="#0d2a1a" stroke="#50c878" stroke-width="2"/>
    <text x="150" y="250" text-anchor="middle" fill="#50c878" font-size="13" font-weight="bold">策略1：立即锁单</text>
    <text x="150" y="270" text-anchor="middle" fill="#a0d8a0" font-size="11">签长约 + 锁量协议</text>
    <text x="150" y="288" text-anchor="middle" fill="#a0d8a0" font-size="11">提前4-8周下单保供</text>
  </g>

  <!-- Right branch: No -->
  <path d="M 530 195 L 650 195 L 650 225" stroke="#4a9eff" stroke-width="2" fill="none"/>
  <text x="590" y="185" text-anchor="middle" fill="#4a9eff" font-size="11" font-weight="bold">否</text>

  <g filter="url(#glow2)">
    <rect x="540" y="225" width="220" height="80" rx="8" fill="#0d1f3a" stroke="#4a9eff" stroke-width="2"/>
    <text x="650" y="250" text-anchor="middle" fill="#4a9eff" font-size="13" font-weight="bold">策略2：观望比价</text>
    <text x="650" y="270" text-anchor="middle" fill="#a0c4ff" font-size="11">备选2-3家供应商</text>
    <text x="650" y="288" text-anchor="middle" fill="#a0c4ff" font-size="11">关注国产替代方案</text>
  </g>

  <!-- Arrow down from both -->
  <path d="M 150 305 L 150 335" stroke="#708090" stroke-width="2" fill="none"/>
  <path d="M 650 305 L 650 335" stroke="#708090" stroke-width="2" fill="none"/>

  <!-- Decision 2: Driver selection -->
  <g filter="url(#glow2)">
    <polygon points="400,335 520,375 400,415 280,375" fill="#1a2a4a" stroke="#ffd93d" stroke-width="2"/>
    <text x="400" y="372" text-anchor="middle" fill="#ffd93d" font-size="12" font-weight="bold">选驱动时</text>
    <text x="400" y="388" text-anchor="middle" fill="#ffd93d" font-size="12" font-weight="bold">检查3件事</text>
  </g>

  <path d="M 150 335 L 280 375" stroke="#708090" stroke-width="1.5" fill="none" stroke-dasharray="4"/>
  <path d="M 650 335 L 520 375" stroke="#708090" stroke-width="1.5" fill="none" stroke-dasharray="4"/>

  <!-- Three check items -->
  <g>
    <rect x="30" y="425" width="230" height="60" rx="6" fill="#0d1f3a" stroke="#50c878" stroke-width="1.5"/>
    <circle cx="50" cy="445" r="8" fill="#50c878"/>
    <text x="50" y="449" text-anchor="middle" fill="#0a1628" font-size="11" font-weight="bold">1</text>
    <text x="68" y="448" fill="#e0e0e0" font-size="12" font-weight="bold">功率留余量 110%</text>
    <text x="68" y="465" fill="#708090" font-size="10">满载=短命，高温环境拉到120%</text>
    <text x="68" y="478" fill="#708090" font-size="10">坏1颗驱动 &gt; 多花10%采购费</text>
  </g>

  <g>
    <rect x="285" y="425" width="230" height="60" rx="6" fill="#0d1f3a" stroke="#4a9eff" stroke-width="1.5"/>
    <circle cx="305" cy="445" r="8" fill="#4a9eff"/>
    <text x="305" y="449" text-anchor="middle" fill="#0a1628" font-size="11" font-weight="bold">2</text>
    <text x="323" y="448" fill="#e0e0e0" font-size="12" font-weight="bold">确认EMC认证</text>
    <text x="323" y="465" fill="#708090" font-size="10">EN 55015 / GB/T 17743</text>
    <text x="323" y="478" fill="#708090" font-size="10">无EMC=可能干扰Zigbee掉线</text>
  </g>

  <g>
    <rect x="540" y="425" width="230" height="60" rx="6" fill="#0d1f3a" stroke="#ffa552" stroke-width="1.5"/>
    <circle cx="560" cy="445" r="8" fill="#ffa552"/>
    <text x="560" y="449" text-anchor="middle" fill="#0a1628" font-size="11" font-weight="bold">3</text>
    <text x="578" y="448" fill="#e0e0e0" font-size="12" font-weight="bold">索要调价函原件</text>
    <text x="578" y="465" fill="#708090" font-size="10">看涨幅理由是否提原材料</text>
    <text x="578" y="478" fill="#708090" font-size="10">只涨不说明=可能虚涨</text>
  </g>

  <!-- Connecting lines to check items -->
  <path d="M 400 415 L 145 425" stroke="#50c878" stroke-width="1" fill="none" stroke-dasharray="3"/>
  <path d="M 400 415 L 400 425" stroke="#4a9eff" stroke-width="1" fill="none" stroke-dasharray="3"/>
  <path d="M 400 415 L 655 425" stroke="#ffa552" stroke-width="1" fill="none" stroke-dasharray="3"/>
</svg>
