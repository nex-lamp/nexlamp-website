<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2340"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#8b2252"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4dff88"/>
      <stop offset="100%" stop-color="#0d4d2b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="680" height="380" fill="url(#bgGrad)"/>
  <rect width="680" height="380" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="16" font-weight="bold" filter="url(#glow)">传统主灯 vs 无主灯设计 — 照明逻辑对比</text>
  
  <!-- Left: Traditional -->
  <rect x="30" y="55" width="290" height="300" rx="8" fill="#0d1f3c" stroke="#1a3a5c" stroke-width="1"/>
  <text x="175" y="80" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">❌ 传统主灯方案</text>
  
  <!-- Room outline -->
  <rect x="60" y="95" width="230" height="180" rx="4" fill="none" stroke="#2a4a6c" stroke-width="1" stroke-dasharray="4"/>
  <!-- Single big light -->
  <circle cx="175" cy="185" r="30" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
  <circle cx="175" cy="185" r="20" fill="#ff6b6b" opacity="0.15"/>
  <circle cx="175" cy="185" r="6" fill="#ff6b6b" opacity="0.8"/>
  <text x="175" y="243" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="9" opacity="0.7">一盏灯照亮全屋</text>
  
  <!-- Labels -->
  <text x="70" y="295" fill="#5a7a9c" font-family="monospace" font-size="10">• 亮度不均，角落偏暗</text>
  <text x="70" y="312" fill="#5a7a9c" font-family="monospace" font-size="10">• 无层次感</text>
  <text x="70" y="329" fill="#5a7a9c" font-family="monospace" font-size="10">• 一个开关全控</text>
  <text x="70" y="346" fill="#5a7a9c" font-family="monospace" font-size="10">• 不可分区调光</text>

  <!-- Arrow -->
  <text x="330" y="210" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="24" filter="url(#glow)">→</text>
  
  <!-- Right: No Main Light -->
  <rect x="360" y="55" width="290" height="300" rx="8" fill="#0d1f3c" stroke="#1a3a5c" stroke-width="1"/>
  <text x="505" y="80" text-anchor="middle" fill="#4dff88" font-family="monospace" font-size="13" font-weight="bold">✅ 无主灯方案</text>
  
  <rect x="390" y="95" width="230" height="180" rx="4" fill="none" stroke="#2a4a6c" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Multiple distributed lights -->
  <circle cx="420" cy="120" r="8" fill="none" stroke="#4dff88" stroke-width="1.5"/>
  <circle cx="420" cy="120" r="3" fill="#4dff88" opacity="0.9"/>
  <circle cx="505" cy="120" r="8" fill="none" stroke="#4dff88" stroke-width="1.5"/>
  <circle cx="505" cy="120" r="3" fill="#4dff88" opacity="0.9"/>
  <circle cx="590" cy="120" r="8" fill="none" stroke="#4dff88" stroke-width="1.5"/>
  <circle cx="590" cy="120" r="3" fill="#4dff88" opacity="0.9"/>
  
  <circle cx="420" cy="190" r="8" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="420" cy="190" r="3" fill="#4da6ff" opacity="0.9"/>
  <circle cx="590" cy="190" r="8" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="590" cy="190" r="3" fill="#4da6ff" opacity="0.9"/>
  
  <!-- Spot lights on wall -->
  <rect x="395" y="235" width="15" height="3" rx="1" fill="#ffaa00" opacity="0.8"/>
  <rect x="435" y="235" width="15" height="3" rx="1" fill="#ffaa00" opacity="0.8"/>
  <rect x="475" y="235" width="15" height="3" rx="1" fill="#ffaa00" opacity="0.8"/>
  
  <!-- LED strip at top -->
  <line x1="395" y1="100" x2="615" y2="100" stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>
  
  <text x="505" y="270" text-anchor="middle" fill="#5a7a9c" font-family="monospace" font-size="8" opacity="0.7">筒灯 · 射灯 · 灯带 · 分区控制</text>
  
  <text x="400" y="295" fill="#5a7a9c" font-family="monospace" font-size="10">• 分区照明，明暗有层次</text>
  <text x="400" y="312" fill="#5a7a9c" font-family="monospace" font-size="10">• 重点突出，氛围感强</text>
  <text x="400" y="329" fill="#5a7a9c" font-family="monospace" font-size="10">• 场景联动一键切换</text>
  <text x="400" y="346" fill="#5a7a9c" font-family="monospace" font-size="10">• Zigbee/涂鸦智能调光</text>

  <!-- Footer -->
  <text x="340" y="375" text-anchor="middle" fill="#2a4a6c" font-family="monospace" font-size="9">nexlamp.com — 涂鸦Zigbee智能照明解决方案</text>
</svg>