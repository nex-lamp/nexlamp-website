<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#06121f"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2940" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="880" height="580" fill="url(#bg)"/>
  <rect width="880" height="580" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="440" y="40" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#7ec27e" text-anchor="middle">🔧 LED筒灯"变暗"排查与延寿决策树</text>
  <text x="440" y="65" font-family="Consolas, monospace" font-size="13" fill="#88aabb" text-anchor="middle">从症状判断 → 真凶定位 → 方案选择</text>

  <!-- 开始节点 -->
  <rect x="370" y="100" width="140" height="50" rx="25" fill="#1a3a4f" stroke="#7ec27e" stroke-width="2"/>
  <text x="440" y="125" font-family="Consolas, monospace" font-size="14" fill="#7ec27e" text-anchor="middle" font-weight="bold">筒灯变暗？</text>
  <text x="440" y="142" font-family="Consolas, monospace" font-size="11" fill="#aac8dd" text-anchor="middle">使用年限？亮度差？</text>

  <!-- 连线 -->
  <line x1="440" y1="150" x2="440" y2="180" stroke="#7ec27e" stroke-width="2"/>

  <!-- 判断1：使用年限 -->
  <polygon points="440,180 540,210 440,240 340,210" fill="#1a3a4f" stroke="#ffaa44" stroke-width="2"/>
  <text x="440" y="208" font-family="Consolas, monospace" font-size="12" fill="#ffaa44" text-anchor="middle" font-weight="bold">用多久？</text>
  <text x="440" y="222" font-family="Consolas, monospace" font-size="10" fill="#aac8dd" text-anchor="middle">≤1年 → 可能质量问题</text>
  <text x="440" y="234" font-family="Consolas, monospace" font-size="10" fill="#aac8dd" text-anchor="middle">&gt;2年 → 电容衰减</text>

  <line x1="340" y1="210" x2="240" y2="210" stroke="#7ec27e" stroke-width="2"/>
  <line x1="540" y1="210" x2="640" y2="210" stroke="#7ec27e" stroke-width="2"/>

  <!-- 左分支：≤1年 质量问题 -->
  <rect x="100" y="180" width="140" height="60" rx="8" fill="#2a1a1a" stroke="#ff6b35" stroke-width="2"/>
  <text x="170" y="205" font-family="Consolas, monospace" font-size="12" fill="#ff6b35" text-anchor="middle" font-weight="bold">品牌/质量问题</text>
  <text x="170" y="222" font-family="Consolas, monospace" font-size="10" fill="#aac8dd" text-anchor="middle">杂牌电容/劣质灯珠</text>

  <!-- 右分支：>2年 电容 -->
  <rect x="600" y="180" width="140" height="60" rx="8" fill="#1a2a1a" stroke="#7ec27e" stroke-width="2"/>
  <text x="670" y="205" font-family="Consolas, monospace" font-size="12" fill="#7ec27e" text-anchor="middle" font-weight="bold">电解电容衰减</text>
  <text x="670" y="222" font-family="Consolas, monospace" font-size="10" fill="#aac8dd" text-anchor="middle">85°C环境 + 封闭</text>

  <!-- 继续向下的判定 -->
  <line x1="670" y1="240" x2="670" y2="290" stroke="#7ec27e" stroke-width="2"/>
  <rect x="595" y="290" width="150" height="50" rx="8" fill="#1a3a4f" stroke="#88ccff" stroke-width="2"/>
  <text x="670" y="312" font-family="Consolas, monospace" font-size="11" fill="#88ccff" text-anchor="middle" font-weight="bold">拆灯检查驱动</text>
  <text x="670" y="328" font-family="Consolas, monospace" font-size="10" fill="#aac8dd" text-anchor="middle">看电容品牌+鼓包？</text>

  <line x1="670" y1="340" x2="670" y2="380" stroke="#7ec27e" stroke-width="2"/>

  <!-- 3 种处理方案 -->
  <rect x="430" y="380" width="200" height="55" rx="8" fill="#1a2a1a" stroke="#7ec27e" stroke-width="2"/>
  <text x="530" y="402" font-family="Consolas, monospace" font-size="12" fill="#7ec27e" text-anchor="middle" font-weight="bold">方案1：整套换新 🏆</text>
  <text x="530" y="420" font-family="Consolas, monospace" font-size="10" fill="#aac8dd" text-anchor="middle">NEXLAMP智能驱动+5年质保</text>

  <rect x="640" y="380" width="200" height="55" rx="8" fill="#1a3a4f" stroke="#88ccff" stroke-width="2"/>
  <text x="740" y="402" font-family="Consolas, monospace" font-size="12" fill="#88ccff" text-anchor="middle" font-weight="bold">方案2：只换驱动 ⭐</text>
  <text x="740" y="420" font-family="Consolas, monospace" font-size="10" fill="#aac8dd" text-anchor="middle">省80%成本/15分钟搞定</text>

  <rect x="220" y="380" width="200" height="55" rx="8" fill="#2a221a" stroke="#ffaa44" stroke-width="2"/>
  <text x="320" y="402" font-family="Consolas, monospace" font-size="12" fill="#ffaa44" text-anchor="middle" font-weight="bold">方案3：换灯+驱动</text>
  <text x="320" y="420" font-family="Consolas, monospace" font-size="10" fill="#aac8dd" text-anchor="middle">灯珠黑化/光斑变形</text>

  <line x1="670" y1="380" x2="530" y2="380" stroke="#7ec27e" stroke-width="2"/>
  <line x1="670" y1="380" x2="320" y2="380" stroke="#7ec27e" stroke-width="2"/>

  <!-- 三选购关键 反问 -->
  <rect x="100" y="470" width="680" height="80" rx="8" fill="#1a2940" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="440" y="495" font-family="Consolas, monospace" font-size="13" fill="#7ec27e" text-anchor="middle" font-weight="bold">买灯前3个反问</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#aac8dd">
    <text x="115" y="515">❶ 驱动是隔离还是非隔离？</text>
    <text x="335" y="515">❷ 电解电容用什么牌子？耐温多少？</text>
    <text x="565" y="515">❸ 满载1小时外壳最高多少°C？</text>
    <text x="180" y="540" fill="#ffaa44">⚠️ 答案含糊→换品牌</text>
    <text x="430" y="540" fill="#7ec27e">✅ 105°C日系电容 + ≤85°C外壳 = OK</text>
  </g>

</svg>
