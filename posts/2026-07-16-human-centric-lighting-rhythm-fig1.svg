<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9a44"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="coolLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#87ceeb"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9a44"/>
      <stop offset="25%" stop-color="#ffd93d"/>
      <stop offset="50%" stop-color="#87ceeb"/>
      <stop offset="75%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff9a44"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g stroke="#2a3a5a" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="80" x2="100" y2="420"/>
    <line x1="200" y1="80" x2="200" y2="420"/>
    <line x1="300" y1="80" x2="300" y2="420"/>
    <line x1="400" y1="80" x2="400" y2="420"/>
    <line x1="500" y1="80" x2="500" y2="420"/>
    <line x1="600" y1="80" x2="600" y2="420"/>
    <line x1="700" y1="80" x2="700" y2="420"/>
    <line x1="80" y1="120" x2="720" y2="120"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="240" x2="720" y2="240"/>
    <line x1="80" y1="300" x2="720" y2="300"/>
    <line x1="80" y1="360" x2="720" y2="360"/>
  </g>

  <!-- Title -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#e0e8f0" text-anchor="middle">24-Hour Circadian Light Curve</text>

  <!-- Y-axis labels -->
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="end">6500K</text>
  <text x="70" y="185" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="end">4500K</text>
  <text x="70" y="305" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="end">2700K</text>
  <text x="70" y="425" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="end">0K</text>

  <!-- X-axis labels -->
  <text x="100" y="445" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="middle">6:00</text>
  <text x="200" y="445" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="middle">9:00</text>
  <text x="300" y="445" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="middle">12:00</text>
  <text x="400" y="445" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="middle">15:00</text>
  <text x="500" y="445" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="middle">18:00</text>
  <text x="600" y="445" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="middle">21:00</text>
  <text x="700" y="445" font-family="Arial, sans-serif" font-size="11" fill="#7a8aaa" text-anchor="middle">24:00</text>

  <!-- Axis lines -->
  <line x1="80" y1="80" x2="80" y2="420" stroke="#4a6a8a" stroke-width="1.5"/>
  <line x1="80" y1="420" x2="720" y2="420" stroke="#4a6a8a" stroke-width="1.5"/>

  <!-- Area under curve -->
  <path d="M 100,350 Q 150,200 200,140 Q 250,100 300,90 Q 350,85 400,100 Q 450,120 500,160 Q 550,220 600,300 Q 650,380 700,350 L 700,420 L 100,420 Z" fill="url(#curveGrad)" opacity="0.15"/>

  <!-- Main curve -->
  <path d="M 100,350 Q 150,200 200,140 Q 250,100 300,90 Q 350,85 400,100 Q 450,120 500,160 Q 550,220 600,300 Q 650,380 700,350" fill="none" stroke="url(#curveGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Key points -->
  <circle cx="100" cy="350" r="8" fill="#ff9a44" filter="url(#glow)"/>
  <circle cx="300" cy="90" r="8" fill="#87ceeb" filter="url(#glow)"/>
  <circle cx="700" cy="350" r="8" fill="#ff9a44" filter="url(#glow)"/>

  <!-- Point labels -->
  <text x="100" y="375" font-family="Arial, sans-serif" font-size="12" fill="#ff9a44" text-anchor="middle" font-weight="bold">6AM</text>
  <text x="100" y="390" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">2700K</text>

  <text x="300" y="70" font-family="Arial, sans-serif" font-size="12" fill="#87ceeb" text-anchor="middle" font-weight="bold">NOON</text>
  <text x="300" y="55" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">6500K</text>

  <text x="700" y="375" font-family="Arial, sans-serif" font-size="12" fill="#ff9a44" text-anchor="middle" font-weight="bold">12PM</text>
  <text x="700" y="390" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">2700K</text>

  <!-- Warm / Cool labels -->
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="13" fill="#ff9a44" font-weight="bold">WARM</text>
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="10" fill="#cc8855">Sunrise</text>

  <text x="550" y="180" font-family="Arial, sans-serif" font-size="13" fill="#ff9a44" font-weight="bold">WARM</text>
  <text x="550" y="195" font-family="Arial, sans-serif" font-size="10" fill="#cc8855">Sunset</text>

  <text x="350" y="115" font-family="Arial, sans-serif" font-size="13" fill="#87ceeb" font-weight="bold">COOL</text>
  <text x="350" y="130" font-family="Arial, sans-serif" font-size="10" fill="#6699cc">Midday</text>

  <!-- Bottom annotation -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="11" fill="#5a7a9a" text-anchor="middle">Natural daylight follows this curve. Human-Centric Lighting replicates it indoors.</text>
</svg>
