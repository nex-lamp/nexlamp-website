  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#e0e6f0">LED 调光三种方式对比</text>
  <text x="400" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#7a8a9a">Why your smart light flickers: PWM frequency is the real cause</text>

