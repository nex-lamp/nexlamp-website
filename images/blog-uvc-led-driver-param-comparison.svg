<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="uvbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b59ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6c3fc7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="visbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0078a8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="400" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#2d5a8e" stroke-width="0.5">
    <line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="113" y1="0" x2="113" y2="400"/>
    <line x1="226" y1="0" x2="226" y2="400"/>
    <line x1="340" y1="0" x2="340" y2="400"/>
    <line x1="453" y1="0" x2="453" y2="400"/>
    <line x1="566" y1="0" x2="566" y2="400"/>
  </g>
  <text x="340" y="35" text-anchor="middle" fill="#e8e8e8" font-family="monospace" font-size="16" font-weight="bold">UV-C LED vs 可见光LED：驱动参数全景对比</text>
  <line x1="80" y1="50" x2="600" y2="50" stroke="#1a3a5c" stroke-width="1"/>

  <text x="140" y="80" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="11">WPE 电光效率</text>
  <rect x="80" y="95" width="120" height="22" fill="url(#visbar)" rx="3"/>
  <text x="210" y="110" fill="#00d4ff" font-family="monospace" font-size="12" font-weight="bold">30-40%</text>
  <rect x="80" y="125" width="30" height="22" fill="url(#uvbar)" rx="3"/>
  <text x="120" y="140" fill="#9b59ff" font-family="monospace" font-size="12" font-weight="bold">3-10%</text>
  <text x="215" y="140" fill="#6a7d99" font-family="monospace" font-size="10">1/4</text>

  <text x="140" y="170" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="11">恒流精度</text>
  <rect x="80" y="185" width="60" height="22" fill="url(#visbar)" rx="3"/>
  <text x="150" y="200" fill="#00d4ff" font-family="monospace" font-size="12" font-weight="bold">±3%</text>
  <rect x="80" y="215" width="180" height="22" fill="url(#uvbar)" rx="3"/>
  <text x="270" y="230" fill="#9b59ff" font-family="monospace" font-size="12" font-weight="bold">±1%</text>
  <text x="305" y="230" fill="#6a7d99" font-family="monospace" font-size="10">3x</text>

  <text x="140" y="260" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="11">结温红线</text>
  <rect x="80" y="275" width="250" height="22" fill="url(#visbar)" rx="3"/>
  <text x="340" y="290" fill="#00d4ff" font-family="monospace" font-size="12" font-weight="bold">125°C</text>
  <rect x="80" y="305" width="100" height="22" fill="url(#uvbar)" rx="3"/>
  <text x="190" y="320" fill="#9b59ff" font-family="monospace" font-size="12" font-weight="bold">50°C</text>
  <text x="225" y="320" fill="#6a7d99" font-family="monospace" font-size="10">1/2.5</text>

  <text x="140" y="350" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="11">L70寿命</text>
  <rect x="80" y="365" width="125" height="22" fill="url(#visbar)" rx="3" filter="url(#glow1)"/>
  <text x="215" y="380" fill="#00d4ff" font-family="monospace" font-size="12" font-weight="bold">50,000h+</text>
  <rect x="80" y="395" width="50" height="5" fill="url(#uvbar)" rx="2" opacity="0.8"/>

  <g transform="translate(380, 70)">
    <text x="0" y="0" fill="#e8e8e8" font-family="monospace" font-size="11" font-weight="bold">驱动设计差异</text>
    <text x="0" y="25" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; 高压低压补偿 (6-7V Vf)</text>
    <text x="0" y="45" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; 电流降额20-40% → L70 x4</text>
    <text x="0" y="65" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; NTC热反馈 + 自适应调流</text>
    <text x="0" y="85" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; IEC 62471 光生物安全</text>
    <text x="0" y="105" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; IoT剂量监测上云</text>
    <text x="0" y="125" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; AlN陶瓷基板 热阻&lt;8K/W</text>
    <text x="0" y="145" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; PWM峰值电流管理</text>
    <text x="0" y="165" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; 人体存在互锁毫秒切断</text>
    <text x="0" y="185" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; 石英玻璃共晶封装</text>
    <text x="0" y="205" fill="#6a7d99" font-family="monospace" font-size="10">&#9656; 14段直接AC驱动拓扑</text>
  </g>

  <rect x="370" y="285" width="280" height="95" fill="none" stroke="#1a3a5c" stroke-width="1" rx="6"/>
  <text x="510" y="305" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11" font-weight="bold">2027 水俣公约禁汞令</text>
  <text x="510" y="325" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="10">UVC LED市场</text>
  <text x="390" y="345" fill="#9b59ff" font-family="monospace" font-size="14" font-weight="bold">$1.8B</text>
  <text x="440" y="345" fill="#6a7d99" font-family="monospace" font-size="10">2026</text>
  <text x="490" y="345" fill="#6a7d99" font-family="monospace" font-size="12">→</text>
  <text x="520" y="345" fill="#9b59ff" font-family="monospace" font-size="14" font-weight="bold">$11.1B</text>
  <text x="580" y="345" fill="#6a7d99" font-family="monospace" font-size="10">2035</text>
  <text x="510" y="370" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" font-weight="bold">CAGR 22.4%</text>

  <text x="340" y="395" text-anchor="middle" fill="#3d5a80" font-family="monospace" font-size="8">NEXLAMP // UV-C LED Driver Challenges // 2026-08-20</text>
</svg>
