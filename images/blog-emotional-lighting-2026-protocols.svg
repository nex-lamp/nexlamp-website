<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%">
  <title>情绪照明协议对比</title>
  <desc>对比涂鸦Zigbee、米家BLE Mesh、DALI-2 DT8、0-10V四种协议在情绪照明中的适用性</desc>
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d4d" stroke-width="0.5"/>
    </pattern>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="480" fill="#0a1628"/>
  <rect width="680" height="480" fill="url(#grid2)"/>
  <text x="340" y="44" text-anchor="middle" fill="#e8f4ff" font-size="20" font-family="Microsoft YaHei, sans-serif" font-weight="500">情绪照明协议怎么选？</text>
  <text x="340" y="74" text-anchor="middle" fill="#7a9cc6" font-size="13" font-family="Microsoft YaHei, sans-serif">不是能连APP就行，要看对色温、彩色、场景的支持深度</text>
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="580" height="300" rx="12" fill="#0d1c33" stroke="#1a3a5c" stroke-width="0.5"/>
    <g transform="translate(20, 20)">
      <text x="0" y="18" fill="#7a9cc6" font-size="13" font-family="Microsoft YaHei, sans-serif" font-weight="500">协议/能力</text>
      <text x="130" y="18" text-anchor="middle" fill="#e8f4ff" font-size="13" font-family="Microsoft YaHei, sans-serif" font-weight="500">涂鸦Zigbee</text>
      <text x="260" y="18" text-anchor="middle" fill="#e8f4ff" font-size="13" font-family="Microsoft YaHei, sans-serif" font-weight="500">米家BLE Mesh</text>
      <text x="390" y="18" text-anchor="middle" fill="#e8f4ff" font-size="13" font-family="Microsoft YaHei, sans-serif" font-weight="500">DALI-2 DT8</text>
      <text x="520" y="18" text-anchor="middle" fill="#e8f4ff" font-size="13" font-family="Microsoft YaHei, sans-serif" font-weight="500">0-10V</text>
    </g>
    <line x1="20" y1="42" x2="560" y2="42" stroke="#1a3a5c" stroke-width="0.5"/>
    <g transform="translate(20, 68)">
      <text x="0" y="0" fill="#7a9cc6" font-size="12" font-family="Microsoft YaHei, sans-serif">色温调节</text>
      <text x="130" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">支持</text>
      <text x="260" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">支持</text>
      <text x="390" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">支持</text>
      <text x="520" y="0" text-anchor="middle" fill="#e89f27" font-size="12" font-family="Microsoft YaHei, sans-serif">不支持</text>
    </g>
    <g transform="translate(20, 108)">
      <text x="0" y="0" fill="#7a9cc6" font-size="12" font-family="Microsoft YaHei, sans-serif">全彩光支持</text>
      <text x="130" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">部分支持</text>
      <text x="260" y="0" text-anchor="middle" fill="#e89f27" font-size="12" font-family="Microsoft YaHei, sans-serif">有限</text>
      <text x="390" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">支持</text>
      <text x="520" y="0" text-anchor="middle" fill="#e24b4a" font-size="12" font-family="Microsoft YaHei, sans-serif">不支持</text>
    </g>
    <g transform="translate(20, 148)">
      <text x="0" y="0" fill="#7a9cc6" font-size="12" font-family="Microsoft YaHei, sans-serif">场景联动</text>
      <text x="130" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">强</text>
      <text x="260" y="0" text-anchor="middle" fill="#e89f27" font-size="12" font-family="Microsoft YaHei, sans-serif">中等</text>
      <text x="390" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">强</text>
      <text x="520" y="0" text-anchor="middle" fill="#e24b4a" font-size="12" font-family="Microsoft YaHei, sans-serif">弱</text>
    </g>
    <g transform="translate(20, 188)">
      <text x="0" y="0" fill="#7a9cc6" font-size="12" font-family="Microsoft YaHei, sans-serif">稳定性</text>
      <text x="130" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">高</text>
      <text x="260" y="0" text-anchor="middle" fill="#e89f27" font-size="12" font-family="Microsoft YaHei, sans-serif">中</text>
      <text x="390" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">高</text>
      <text x="520" y="0" text-anchor="middle" fill="#7ec27e" font-size="12" font-family="Microsoft YaHei, sans-serif">高</text>
    </g>
    <g transform="translate(20, 228)">
      <text x="0" y="0" fill="#7a9cc6" font-size="12" font-family="Microsoft YaHei, sans-serif">适合场景</text>
      <text x="130" y="0" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">全屋/酒店</text>
      <text x="260" y="0" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">家用入门</text>
      <text x="390" y="0" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">商业/办公</text>
      <text x="520" y="0" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">基础调光</text>
    </g>
    <line x1="20" y1="260" x2="560" y2="260" stroke="#1a3a5c" stroke-width="0.5"/>
    <g transform="translate(20, 280)">
      <text x="0" y="0" fill="#e8f4ff" font-size="12" font-family="Microsoft YaHei, sans-serif" font-weight="500">建议：</text>
      <text x="45" y="0" fill="#7a9cc6" font-size="12" font-family="Microsoft YaHei, sans-serif">复杂情绪场景选Zigbee或DALI-2；0-10V只能调亮度，做不了情绪光</text>
    </g>
  </g>
</svg>