<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#121630"/>
    </linearGradient>
    <linearGradient id="attackFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
    <linearGradient id="defenseFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#44ff88"/>
      <stop offset="100%" style="stop-color:#44aaff"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad2)"/>

  <!-- Subtle scanlines -->
  <g opacity="0.05">
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff"/>
    </pattern>
    <rect width="680" height="400" fill="url(#scan)"/>
  </g>

  <!-- Title -->
  <text x="340" y="35" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">OTA攻击链：从固件注入到家庭入侵</text>
  <text x="340" y="52" font-family="monospace" font-size="9" fill="#6688aa" text-anchor="middle">OTA Attack Chain: From Firmware Injection to Home Invasion</text>

  <!-- Attack chain (left side - red) -->
  <g transform="translate(40, 70)">
    <!-- Step 1: Intercept OTA -->
    <rect width="130" height="60" rx="6" fill="#1a0a0a" stroke="#ff3333" stroke-width="2"/>
    <text x="65" y="25" font-family="sans-serif" font-size="11" fill="#ff4444" text-anchor="middle" font-weight="bold">① 拦截OTA</text>
    <text x="65" y="42" font-family="monospace" font-size="8" fill="#ff6666" text-anchor="middle">伪造升级包</text>
    <text x="65" y="54" font-family="monospace" font-size="7" fill="#ff8888" text-anchor="middle">CRC32欺骗</text>
    <line x1="130" y1="30" x2="160" y2="30" stroke="#ff3333" stroke-width="2"/>
    <polygon points="158,24 168,30 158,36" fill="#ff3333"/>

    <!-- Step 2: Inject malicious firmware -->
    <rect x="160" width="130" height="60" rx="6" fill="#1a0a0a" stroke="#ff5555" stroke-width="2"/>
    <text x="225" y="25" font-family="sans-serif" font-size="11" fill="#ff5555" text-anchor="middle" font-weight="bold">② 注入恶意固件</text>
    <text x="225" y="42" font-family="monospace" font-size="8" fill="#ff7777" text-anchor="middle">无签名验证</text>
    <text x="225" y="54" font-family="monospace" font-size="7" fill="#ff9999" text-anchor="middle">直接执行</text>
    <line x1="290" y1="30" x2="320" y2="30" stroke="#ff5555" stroke-width="2"/>
    <polygon points="318,24 328,30 318,36" fill="#ff5555"/>

    <!-- Step 3: Device becomes spy -->
    <rect x="320" width="130" height="60" rx="6" fill="#1a0a0a" stroke="#ff6644" stroke-width="2"/>
    <text x="385" y="25" font-family="sans-serif" font-size="11" fill="#ff6644" text-anchor="middle" font-weight="bold">③ 设备变间谍</text>
    <text x="385" y="42" font-family="monospace" font-size="8" fill="#ff8866" text-anchor="middle">Wi-Fi嗅探</text>
    <text x="385" y="54" font-family="monospace" font-size="7" fill="#ffaa88" text-anchor="middle">窃听/控制</text>
  </g>

  <!-- Divider -->
  <line x1="340" y1="180" x2="340" y2="190" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <text x="340" y="195" font-family="sans-serif" font-size="11" fill="#44aaff" text-anchor="middle" font-weight="bold">↓ 防护方案 ↓</text>

  <!-- Defense chain (bottom - green/blue) -->
  <g transform="translate(40, 210)">
    <!-- Step D1: Signature verification -->
    <rect width="130" height="60" rx="6" fill="#0a1a0a" stroke="#44ff88" stroke-width="2" filter="url(#glow2)"/>
    <text x="65" y="25" font-family="sans-serif" font-size="11" fill="#44ff88" text-anchor="middle" font-weight="bold">✓ 签名验证</text>
    <text x="65" y="42" font-family="monospace" font-size="8" fill="#66ffaa" text-anchor="middle">ECDSA P-256</text>
    <text x="65" y="54" font-family="monospace" font-size="7" fill="#88ffcc" text-anchor="middle">不签名不执行</text>
    <line x1="130" y1="30" x2="160" y2="30" stroke="#44ff88" stroke-width="2"/>
    <polygon points="158,24 168,30 158,36" fill="#44ff88"/>

    <!-- Step D2: Anti-rollback -->
    <rect x="160" width="130" height="60" rx="6" fill="#0a1a0a" stroke="#44aaff" stroke-width="2" filter="url(#glow2)"/>
    <text x="225" y="25" font-family="sans-serif" font-size="11" fill="#44aaff" text-anchor="middle" font-weight="bold">✓ 防回滚</text>
    <text x="225" y="42" font-family="monospace" font-size="8" fill="#66ccff" text-anchor="middle">OTP counter</text>
    <text x="225" y="54" font-family="monospace" font-size="7" fill="#88ddff" text-anchor="middle">版本号单调递增</text>
    <line x1="290" y1="30" x2="320" y2="30" stroke="#44aaff" stroke-width="2"/>
    <polygon points="318,24 328,30 318,36" fill="#44aaff"/>

    <!-- Step D3: Staged OTA -->
    <rect x="320" width="130" height="60" rx="6" fill="#0a1a0a" stroke="#66ddff" stroke-width="2" filter="url(#glow2)"/>
    <text x="385" y="25" font-family="sans-serif" font-size="11" fill="#66ddff" text-anchor="middle" font-weight="bold">✓ 分阶段验证</text>
    <text x="385" y="42" font-family="monospace" font-size="8" fill="#88eeff" text-anchor="middle">下载→校验→切换</text>
    <text x="385" y="54" font-family="monospace" font-size="7" fill="#aaeeff" text-anchor="middle">双Bank Flash</text>
  </g>

  <!-- Risk comparison chart -->
  <g transform="translate(40, 300)">
    <text x="0" y="15" font-family="sans-serif" font-size="10" fill="#aaaaaa">风险等级对比</text>

    <!-- CRC only -->
    <rect x="0" y="25" width="300" height="16" rx="3" fill="#1a0a0a" stroke="#ff3333" stroke-width="1"/>
    <rect x="0" y="25" width="280" height="16" rx="3" fill="#ff3333" opacity="0.7"/>
    <text x="10" y="37" font-family="monospace" font-size="8" fill="#ffffff">仅CRC校验 — 极高危</text>

    <!-- CRC + basic signing -->
    <rect x="0" y="47" width="300" height="16" rx="3" fill="#1a0a0a" stroke="#ffaa00" stroke-width="1"/>
    <rect x="0" y="47" width="160" height="16" rx="3" fill="#ffaa00" opacity="0.5"/>
    <text x="10" y="59" font-family="monospace" font-size="8" fill="#ffffff">CRC+基础签名 — 中危</text>

    <!-- Full security -->
    <rect x="0" y="69" width="300" height="16" rx="3" fill="#0a1a0a" stroke="#44ff88" stroke-width="1"/>
    <rect x="0" y="69" width="30" height="16" rx="3" fill="#44ff88" opacity="0.5"/>
    <text x="10" y="81" font-family="monospace" font-size="8" fill="#ffffff">ECDSA+防回滚+分阶段 — 安全</text>
  </g>

  <!-- Bottom note -->
  <text x="340" y="392" font-family="sans-serif" font-size="8" fill="#6688aa" text-anchor="middle">NEXLAMP | 智能照明安全设计指南 2026</text>
</svg>
