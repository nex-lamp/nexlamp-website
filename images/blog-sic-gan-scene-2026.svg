<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" style="background:#0a0e17">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#141b2d"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7931e"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0090ff"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="680" height="420" fill="url(#bg2)"/>
  
  <text x="340" y="38" text-anchor="middle" fill="#e0e8f0" font-size="20" font-weight="bold" font-family="Arial, sans-serif">LED 驱动电源选型速查：SiC vs GaN 场景决策</text>
  <line x1="80" y1="48" x2="600" y2="48" stroke="#2a3040" stroke-width="1"/>
  
  <!-- Scene 1: Outdoor/Industrial → SiC -->
  <rect x="30" y="68" width="195" height="155" rx="10" fill="#1a1520" stroke="#ff6b3555" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="68" width="195" height="36" rx="10" fill="#ff6b3522"/>
  <rect x="30" y="94" width="195" height="10" fill="#ff6b3522"/>
  <text x="127" y="91" text-anchor="middle" fill="#ff8c5a" font-size="14" font-weight="bold" font-family="Arial, sans-serif">🏭 户外 / 工业照明</text>
  
  <!-- Road Lamp Icon -->
  <rect x="95" y="112" width="60" height="50" rx="6" fill="#1e2638"/>
  <rect x="117" y="118" width="16" height="38" rx="3" fill="#ff6b3544"/>
  <text x="125" y="135" text-anchor="middle" fill="#ff8c5a" font-size="18" font-family="Arial, sans-serif">💡</text>
  
  <text x="55" y="178" fill="#8899aa" font-size="10" font-family="Arial, sans-serif">功率 200W–1000W+</text>
  <text x="55" y="194" fill="#8899aa" font-size="10" font-family="Arial, sans-serif">高温高湿 连续运行</text>
  <text x="55" y="210" fill="#ff8c5a" font-size="11" font-weight="bold" font-family="Arial, sans-serif">👉 选 SiC 碳化硅</text>
  
  <!-- Scene 2: Home/Consumer → GaN -->
  <rect x="243" y="68" width="195" height="155" rx="10" fill="#0d1a28" stroke="#00d4ff55" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="243" y="68" width="195" height="36" rx="10" fill="#00d4ff22"/>
  <rect x="243" y="94" width="195" height="10" fill="#00d4ff22"/>
  <text x="340" y="91" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold" font-family="Arial, sans-serif">🏠 家用 / 消费照明</text>
  
  <!-- Ceiling Light Icon -->
  <rect x="308" y="112" width="60" height="50" rx="6" fill="#1e2638"/>
  <rect x="322" y="116" width="32" height="10" rx="3" fill="#00d4ff33"/>
  <text x="338" y="135" text-anchor="middle" fill="#00d4ff" font-size="18" font-family="Arial, sans-serif">🏮</text>
  
  <text x="268" y="178" fill="#8899aa" font-size="10" font-family="Arial, sans-serif">功率 5W–200W</text>
  <text x="268" y="194" fill="#8899aa" font-size="10" font-family="Arial, sans-serif">超薄设计 智能调光</text>
  <text x="268" y="210" fill="#00d4ff" font-size="11" font-weight="bold" font-family="Arial, sans-serif">👉 选 GaN 氮化镓</text>
  
  <!-- Scene 3: Commercial/Hybrid -->
  <rect x="456" y="68" width="195" height="155" rx="10" fill="#0d1a20" stroke="#00e67655" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="456" y="68" width="195" height="36" rx="10" fill="#00e67622"/>
  <rect x="456" y="94" width="195" height="10" fill="#00e67622"/>
  <text x="553" y="91" text-anchor="middle" fill="#00e676" font-size="14" font-weight="bold" font-family="Arial, sans-serif">🏢 商业 / 办公照明</text>
  
  <!-- Building Icon -->
  <rect x="521" y="112" width="60" height="50" rx="6" fill="#1e2638"/>
  <text x="551" y="135" text-anchor="middle" fill="#00e676" font-size="18" font-family="Arial, sans-serif">🏗️</text>
  
  <text x="481" y="178" fill="#8899aa" font-size="10" font-family="Arial, sans-serif">功率 50W–500W</text>
  <text x="481" y="194" fill="#8899aa" font-size="10" font-family="Arial, sans-serif">长时运行 兼顾体积</text>
  <text x="481" y="210" fill="#00e676" font-size="11" font-weight="bold" font-family="Arial, sans-serif">👉 SiC+GaN 混合方案</text>
  
  <!-- Power spectrum bar -->
  <text x="340" y="248" text-anchor="middle" fill="#e0e8f0" font-size="14" font-weight="bold" font-family="Arial, sans-serif">功率图谱：哪种材料适合你的场景？</text>
  
  <!-- Power range visualization -->
  <rect x="50" y="265" width="580" height="48" rx="8" fill="#1a2030"/>
  
  <!-- Si zone -->
  <rect x="50" y="265" width="160" height="48" rx="8" fill="#55555533"/>
  <text x="130" y="280" text-anchor="middle" fill="#8899aa" font-size="11" font-family="Arial, sans-serif">传统硅 Si</text>
  <text x="130" y="300" text-anchor="middle" fill="#556677" font-size="10" font-family="Arial, sans-serif">&lt; 150W 成本敏感</text>
  
  <!-- GaN zone -->
  <rect x="220" y="265" width="200" height="48" rx="0" fill="#00d4ff22"/>
  <text x="320" y="280" text-anchor="middle" fill="#00d4ff" font-size="11" font-family="Arial, sans-serif">氮化镓 GaN</text>
  <text x="320" y="300" text-anchor="middle" fill="#448899" font-size="10" font-family="Arial, sans-serif">50–300W 高频轻薄</text>
  
  <!-- SiC zone -->
  <rect x="430" y="265" width="200" height="48" rx="8" fill="#ff6b3522"/>
  <text x="530" y="280" text-anchor="middle" fill="#ff8c5a" font-size="11" font-family="Arial, sans-serif">碳化硅 SiC</text>
  <text x="530" y="300" text-anchor="middle" fill="#886644" font-size="10" font-family="Arial, sans-serif">200W+ 高温高压</text>
  
  <!-- Crossover markers -->
  <line x1="215" y1="265" x2="215" y2="315" stroke="#556677" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="215" y="330" text-anchor="middle" fill="#556677" font-size="9" font-family="Arial, sans-serif">~150W</text>
  
  <line x1="425" y1="265" x2="425" y2="315" stroke="#556677" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="425" y="330" text-anchor="middle" fill="#556677" font-size="9" font-family="Arial, sans-serif">~300W</text>
  
  <!-- Bottom guideline -->
  <rect x="50" y="350" width="580" height="55" rx="8" fill="#141b2d" stroke="#2a3040" stroke-width="1"/>
  <text x="340" y="370" text-anchor="middle" fill="#e0e8f0" font-size="12" font-weight="bold" font-family="Arial, sans-serif">💡 一句话选型口诀</text>
  <text x="340" y="393" text-anchor="middle" fill="#8899aa" font-size="12" font-family="Arial, sans-serif">大功率高温 → 选 SiC ｜ 小功率轻薄 → 选 GaN ｜ 中功率长时 → 混合方案</text>
  
  <text x="340" y="416" text-anchor="middle" fill="#445566" font-size="9" font-family="Arial, sans-serif">SiC 和 GaN 不是谁取代谁，而是各取所长的好搭档</text>
</svg>