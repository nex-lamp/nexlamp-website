<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0a1f3a"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#51cf66" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#51cf66" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="400" y="45" text-anchor="middle" fill="#00d4ff" font-size="22" font-weight="bold" filter="url(#glow)">全光谱LED灯选购决策流程</text>
  <line x1="200" y1="55" x2="600" y2="55" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- 开始节点 -->
  <rect x="300" y="75" rx="20" ry="20" width="200" height="40" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" fill="#00d4ff" font-size="15" font-weight="bold">选购全光谱LED灯</text>

  <!-- 箭头1 -->
  <line x1="400" y1="115" x2="400" y2="145" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <defs><marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00d4ff"/></marker></defs>

  <!-- 问题框1 -->
  <polygon points="400,155 530,185 400,215 270,185" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" fill="#ff6b6b" font-size="13">商家提供了</text>
  <text x="400" y="205" text-anchor="middle" fill="#ff6b6b" font-size="13">第三方光谱检测报告？</text>

  <!-- 左分支 NO -->
  <line x1="270" y1="185" x2="140" y2="185" stroke="#ff6b6b" stroke-width="1.5"/>
  <line x1="140" y1="185" x2="140" y2="245" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <defs><marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff6b6b"/></marker></defs>

  <text x="200" y="178" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">否</text>
  <rect x="50" y="250" rx="8" ry="8" width="180" height="42" fill="#ff6b6b" fill-opacity="0.15" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="140" y="268" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">PASS</text>
  <text x="140" y="284" text-anchor="middle" fill="#ff6b6b" font-size="11">无报告 = 假全光谱</text>

  <!-- 右分支 YES -->
  <line x1="530" y1="185" x2="660" y2="185" stroke="#51cf66" stroke-width="1.5"/>
  <line x1="660" y1="185" x2="660" y2="245" stroke="#51cf66" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#51cf66"/></marker></defs>

  <text x="600" y="178" text-anchor="middle" fill="#51cf66" font-size="13" font-weight="bold">是</text>

  <!-- 问题框2 -->
  <polygon points="660,255 790,285 660,315 530,285" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="660" y="288" text-anchor="middle" fill="#ff6b6b" font-size="12">Ra≥95 且</text>
  <text x="660" y="305" text-anchor="middle" fill="#ff6b6b" font-size="12">R9≥90？</text>

  <!-- 左分支 NO -->
  <line x1="530" y1="285" x2="470" y2="285" stroke="#ff6b6b" stroke-width="1.5"/>
  <line x1="470" y1="285" x2="470" y2="350" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <text x="500" y="278" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">否</text>
  <rect x="380" y="355" rx="8" ry="8" width="180" height="42" fill="#ff6b6b" fill-opacity="0.15" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="470" y="373" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">PASS</text>
  <text x="470" y="389" text-anchor="middle" fill="#ff6b6b" font-size="11">低R9 = 伪全光谱</text>

  <!-- 右分支 YES -->
  <line x1="790" y1="285" x2="740" y2="350" stroke="#51cf66" stroke-width="1.5"/>
  <text x="775" y="305" fill="#51cf66" font-size="13" font-weight="bold">是</text>

  <!-- 问题框3 -->
  <polygon points="740,360 870,390 740,420 610,390" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="740" y="393" text-anchor="middle" fill="#ff6b6b" font-size="12">手机摄像头测频闪</text>
  <text x="740" y="410" text-anchor="middle" fill="#ff6b6b" font-size="12">无滚动条纹？</text>

  <!-- NO分支 -->
  <line x1="610" y1="390" x2="610" y2="460" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="660" y="400" fill="#ff6b6b" font-size="13" font-weight="bold">否</text>
  <rect x="520" y="465" rx="8" ry="8" width="180" height="42" fill="#ff6b6b" fill-opacity="0.15" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="610" y="483" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">PASS</text>
  <text x="610" y="499" text-anchor="middle" fill="#ff6b6b" font-size="11">有频闪 = 伤眼</text>

  <!-- YES分支 -->
  <line x1="870" y1="390" x2="790" y2="460" stroke="#51cf66" stroke-width="1.5"/>
  <text x="845" y="400" fill="#51cf66" font-size="13" font-weight="bold">是</text>

  <!-- 最终通过 -->
  <rect x="210" y="470" rx="10" ry="10" width="180" height="55" fill="#51cf66" fill-opacity="0.2" stroke="#51cf66" stroke-width="2.5" filter="url(#glow)"/>
  <text x="300" y="498" text-anchor="middle" fill="#51cf66" font-size="16" font-weight="bold">通关！</text>
  <text x="300" y="516" text-anchor="middle" fill="#51cf66" font-size="11">真全光谱护眼灯</text>

  <!-- 底部说明 -->
  <text x="400" y="570" text-anchor="middle" fill="#5a7a9a" font-size="11">三步甄别法 | 耐利普 Nexlamp 技术团队</text>
</svg>