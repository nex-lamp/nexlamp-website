<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <defs>
    <linearGradient id="bgDr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="pnSW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101f38"/>
      <stop offset="1" stop-color="#142a4a"/>
    </linearGradient>
    <linearGradient id="pnDR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112a22"/>
      <stop offset="1" stop-color="#0f2136"/>
    </linearGradient>
    <filter id="glowDr" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="500" fill="url(#bgDr)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/><line x1="0" y1="480" x2="680" y2="480"/>
    <line x1="85" y1="0" x2="85" y2="500"/><line x1="170" y1="0" x2="170" y2="500"/>
    <line x1="255" y1="0" x2="255" y2="500"/><line x1="340" y1="0" x2="340" y2="500"/>
    <line x1="425" y1="0" x2="425" y2="500"/><line x1="510" y1="0" x2="510" y2="500"/>
    <line x1="595" y1="0" x2="595" y2="500"/>
  </g>

  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="23" font-weight="bold" filter="url(#glowDr)">开关管通断，灯的变化看驱动</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <rect x="34" y="70" width="296" height="234" rx="10" fill="url(#pnSW)" stroke="#6aa9e0" stroke-width="1.5"/>
  <text x="54" y="100" fill="#6aa9e0" font-family="sans-serif" font-size="15" font-weight="bold">智能开关（墙面那块）</text>
  <line x1="54" y1="112" x2="310" y2="112" stroke="#1b3355" stroke-width="1"/>
  <text x="54" y="136" fill="#7ec27e" font-family="sans-serif" font-size="12" font-weight="bold">能做什么</text>
  <text x="54" y="158" fill="#c8d8ea" font-family="sans-serif" font-size="12">通断控制、场景与定时</text>
  <text x="54" y="180" fill="#c8d8ea" font-family="sans-serif" font-size="12">App、语音、无线开关联动</text>
  <line x1="54" y1="198" x2="310" y2="198" stroke="#1b3355" stroke-width="1"/>
  <text x="54" y="222" fill="#e06666" font-family="sans-serif" font-size="12" font-weight="bold">做不到什么</text>
  <text x="54" y="244" fill="#c8d8ea" font-family="sans-serif" font-size="12">改色温、无级调亮度</text>
  <text x="54" y="266" fill="#c8d8ea" font-family="sans-serif" font-size="12">保证低亮度不闪</text>
  <text x="54" y="290" fill="#9db8d9" font-family="sans-serif" font-size="11.5">多数只做通断，少数才有调光版</text>

  <rect x="350" y="70" width="296" height="234" rx="10" fill="url(#pnDR)" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="370" y="100" fill="#7ec27e" font-family="sans-serif" font-size="15" font-weight="bold">驱动电源（在灯具里面）</text>
  <line x1="370" y1="112" x2="626" y2="112" stroke="#1b3355" stroke-width="1"/>
  <text x="370" y="136" fill="#7ec27e" font-family="sans-serif" font-size="12" font-weight="bold">它决定这些</text>
  <text x="370" y="158" fill="#c8d8ea" font-family="sans-serif" font-size="12">色温范围：单色 / 双色 / RGBCW</text>
  <text x="370" y="180" fill="#c8d8ea" font-family="sans-serif" font-size="12">能不能无级调光、最低调到多暗</text>
  <text x="370" y="202" fill="#c8d8ea" font-family="sans-serif" font-size="12">低亮度会不会频闪</text>
  <text x="370" y="224" fill="#c8d8ea" font-family="sans-serif" font-size="12">调光方式与开关/面板是否匹配</text>
  <line x1="370" y1="240" x2="626" y2="240" stroke="#1b3355" stroke-width="1"/>
  <text x="370" y="264" fill="#f0c674" font-family="sans-serif" font-size="12">驱动不支持调光 →</text>
  <text x="370" y="286" fill="#f0c674" font-family="sans-serif" font-size="12">换再贵的面板也只能开和关</text>

  <rect x="34" y="318" width="612" height="152" rx="10" fill="#141d33" stroke="#e06666" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="54" y="346" fill="#e06666" font-family="sans-serif" font-size="14" font-weight="bold">单火开关为什么要盯住灯的功率</text>
  <text x="54" y="372" fill="#c8d8ea" font-family="sans-serif" font-size="12">① 开关关断时，靠一股很小的电流经过灯具回路，给它自己供电</text>
  <text x="54" y="396" fill="#c8d8ea" font-family="sans-serif" font-size="12">② 灯功率越小，这股电流占比越大，微功率 LED 被点亮 → 关灯后微微发亮</text>
  <text x="54" y="420" fill="#c8d8ea" font-family="sans-serif" font-size="12">③ 单火开关普遍有最小负载功率下限，常见 3W 到 5W 起</text>
  <rect x="54" y="432" width="572" height="26" rx="6" fill="#2a1418"/>
  <text x="66" y="450" fill="#e06666" font-family="sans-serif" font-size="12" font-weight="bold">无零线 + 小功率筒灯 / 灯带 / 一个灯位只装一两只小瓦数灯 = 最容易翻车</text>
</svg>
