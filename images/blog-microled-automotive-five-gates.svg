<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2238"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="125" x2="1200" y2="125"/>
  </g>
  <text x="40" y="55" font-size="26" font-weight="700" fill="#7eb6ff">MicroLED上车的5道车规关 · LED驱动电源逐关拆解</text>
  <text x="40" y="85" font-size="14" fill="#94a3b8">每一道关都有具体的数字红线 · 任何一项不达标 → 整车厂拒收</text>

  <g transform="translate(40,140)">
    <rect width="240" height="100" rx="8" fill="url(#gate)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="36" font-size="14" fill="#fef3c7" font-weight="700">第1关</text>
    <text x="20" y="62" font-size="18" fill="#ffffff" font-weight="700">AEC-Q100 魔鬼月考</text>
    <text x="20" y="84" font-size="12" fill="#fde68a">44大类 100+项测试</text>
  </g>
  <text x="300" y="190" font-size="20" fill="#fbbf24" font-weight="700">→</text>
  <g transform="translate(330,140)">
    <rect width="240" height="100" rx="8" fill="url(#gate)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="36" font-size="14" fill="#fef3c7" font-weight="700">第2关</text>
    <text x="20" y="62" font-size="18" fill="#ffffff" font-weight="700">HDR+10倍亮度</text>
    <text x="20" y="84" font-size="12" fill="#fde68a">HUD 10000-15000 cd/m²</text>
  </g>
  <text x="590" y="190" font-size="20" fill="#fbbf24" font-weight="700">→</text>
  <g transform="translate(620,140)">
    <rect width="240" height="100" rx="8" fill="url(#gate)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="36" font-size="14" fill="#fef3c7" font-weight="700">第3关</text>
    <text x="20" y="62" font-size="18" fill="#ffffff" font-weight="700">车规协议栈</text>
    <text x="20" y="84" font-size="12" fill="#fde68a">CAN-FD / 1000BASE-T1</text>
  </g>
  <text x="880" y="190" font-size="20" fill="#fbbf24" font-weight="700">→</text>
  <g transform="translate(910,140)">
    <rect width="240" height="100" rx="8" fill="url(#gate)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="36" font-size="14" fill="#fef3c7" font-weight="700">第4关</text>
    <text x="20" y="62" font-size="18" fill="#ffffff" font-weight="700">功能安全</text>
    <text x="20" y="84" font-size="12" fill="#fde68a">ISO 26262 ASIL-B/C/D</text>
  </g>
  <text x="160" y="290" font-size="22" fill="#fbbf24" font-weight="700">↘</text>
  <text x="450" y="290" font-size="22" fill="#fbbf24" font-weight="700">↓</text>
  <text x="740" y="290" font-size="22" fill="#fbbf24" font-weight="700">↙</text>
  <g transform="translate(420,310)">
    <rect width="360" height="100" rx="8" fill="url(#gate)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="36" font-size="14" fill="#fef3c7" font-weight="700">第5关</text>
    <text x="20" y="62" font-size="18" fill="#ffffff" font-weight="700">15年/24万公里长寿命</text>
    <text x="20" y="84" font-size="12" fill="#fde68a">+150℃结温红线 · 三防漆 · RoHS 3</text>
  </g>

  <g transform="translate(40,460)">
    <rect width="280" height="220" rx="6" fill="#1e293b" stroke="#1e40af" stroke-width="1"/>
    <text x="140" y="34" font-size="16" font-weight="700" fill="#7eb6ff" text-anchor="middle">⏱️ 认证周期</text>
    <text x="20" y="64" font-size="13" fill="#cbd5e1">HTOL  125℃ × 1000小时</text>
    <text x="20" y="86" font-size="13" fill="#cbd5e1">HAST  130℃/85%RH × 96小时</text>
    <text x="20" y="108" font-size="13" fill="#cbd5e1">TMCL  -40/+125℃ × 1000cycle</text>
    <text x="20" y="130" font-size="13" fill="#cbd5e1">HTSL  150℃ × 1000小时</text>
    <text x="20" y="156" font-size="13" font-weight="700" fill="#fbbf24">总计：12-18个月</text>
    <text x="20" y="178" font-size="12" fill="#64748b">（流片→量产车规料号）</text>
    <text x="20" y="200" font-size="11" fill="#64748b">第三方测试：$5-15万/颗</text>
  </g>

  <g transform="translate(340,460)">
    <rect width="280" height="220" rx="6" fill="#1e293b" stroke="#1e40af" stroke-width="1"/>
    <text x="140" y="34" font-size="16" font-weight="700" fill="#7eb6ff" text-anchor="middle">🎯 应用场景</text>
    <text x="20" y="64" font-size="13" fill="#cbd5e1">HUD抬头显示  → Grade 1 ASIL-B</text>
    <text x="20" y="86" font-size="13" fill="#cbd5e1">座舱一体屏    → Grade 2 ASIL-B</text>
    <text x="20" y="108" font-size="13" fill="#cbd5e1">前大灯ADB     → Grade 1 ASIL-C</text>
    <text x="20" y="130" font-size="13" fill="#cbd5e1">转向信号灯    → Grade 1 ASIL-D</text>
    <text x="20" y="156" font-size="13" font-weight="700" fill="#fbbf24">像素级诊断 &gt; 90%</text>
    <text x="20" y="178" font-size="12" fill="#64748b">（开路/短路/温度/亮度异常）</text>
    <text x="20" y="200" font-size="11" fill="#64748b">DTTI &lt; 100ms · 双通道冗余</text>
  </g>

  <g transform="translate(640,460)">
    <rect width="280" height="220" rx="6" fill="#1e293b" stroke="#1e40af" stroke-width="1"/>
    <text x="140" y="34" font-size="16" font-weight="700" fill="#7eb6ff" text-anchor="middle">📡 协议栈</text>
    <text x="20" y="64" font-size="13" fill="#cbd5e1">CAN-FD 5Mbps      车身控制</text>
    <text x="20" y="86" font-size="13" fill="#cbd5e1">CAN-XL 20Mbps     (2026新)</text>
    <text x="20" y="108" font-size="13" fill="#cbd5e1">100BASE-T1 100Mbps 座舱图传</text>
    <text x="20" y="130" font-size="13" fill="#cbd5e1">1000BASE-T1 1Gbps  高速骨干</text>
    <text x="20" y="156" font-size="13" font-weight="700" fill="#fbbf24">10BASE-T1S 新晋车载低速</text>
    <text x="20" y="178" font-size="12" fill="#64748b">SecOC（防CAN注入）</text>
    <text x="20" y="200" font-size="11" fill="#64748b">AutoSAR CP/AP 架构</text>
  </g>

  <g transform="translate(940,460)">
    <rect width="220" height="220" rx="6" fill="#1e293b" stroke="#1e40af" stroke-width="1"/>
    <text x="110" y="34" font-size="16" font-weight="700" fill="#7eb6ff" text-anchor="middle">💰 市场预测</text>
    <text x="20" y="68" font-size="28" fill="#fbbf24" font-weight="700">$1.2亿</text>
    <text x="20" y="90" font-size="12" fill="#94a3b8">2026车载MicroLED</text>
    <text x="20" y="130" font-size="11" fill="#cbd5e1">2030预测</text>
    <text x="20" y="158" font-size="28" fill="#fbbf24" font-weight="700">$48亿</text>
    <text x="20" y="180" font-size="12" fill="#94a3b8">CAGR 110%+</text>
    <text x="20" y="200" font-size="10" fill="#64748b">数据来源：Tanaka/Yole</text>
  </g>
</svg>
