    <text x="72" y="168" text-anchor="end" font-size="8" fill="#475569">10</text>
    <text x="72" y="136" text-anchor="end" font-size="8" fill="#475569">20</text>
    <text x="72" y="104" text-anchor="end" font-size="8" fill="#475569">30</text>
    <text x="72" y="72" text-anchor="end" font-size="8" fill="#475569">40</text>
    <line x1="80" y1="168" x2="860" y2="168" stroke="#1e3a5f" stroke-width="0.3"/>
    <line x1="80" y1="136" x2="860" y2="136" stroke="#1e3a5f" stroke-width="0.3"/>
    <line x1="80" y1="104" x2="860" y2="104" stroke="#1e3a5f" stroke-width="0.3"/>
    <line x1="80" y1="72" x2="860" y2="72" stroke="#1e3a5f" stroke-width="0.3"/>
