<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470">
  <defs>
    <linearGradient id="bgCost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="barBefore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ec27e"/>
      <stop offset="1" stop-color="#a8dc9a"/>
    </linearGradient>
    <linearGradient id="barAfter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c2f3a"/>
      <stop offset="1" stop-color="#e06666"/>
    </linearGradient>
    <filter id="glowCost" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="470" fill="url(#bgCost)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/>
    <line x1="85" y1="0" x2="85" y2="470"/><line x1="170" y1="0" x2="170" y2="470"/>
    <line x1="255" y1="0" x2="255" y2="470"/><line x1="340" y1="0" x2="340" y2="470"/>
    <line x1="425" y1="0" x2="425" y2="470"/><line x1="510" y1="0" x2="510" y2="470"/>
    <line x1="595" y1="0" x2="595" y2="470"/>
  </g>

  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="23" font-weight="bold" filter="url(#glowCost)">同一处点位 · 封槽前后差多少</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <rect x="486" y="60" width="12" height="12" rx="3" fill="url(#barBefore)"/>
  <text x="504" y="70" fill="#9db8d9" font-family="sans-serif" font-size="11.5">封槽前</text>
  <rect x="566" y="60" width="12" height="12" rx="3" fill="url(#barAfter)"/>
  <text x="584" y="70" fill="#9db8d9" font-family="sans-serif" font-size="11.5">封槽后</text>

  <text x="52" y="98" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold">① 零线预留</text>
  <rect x="150" y="88" width="6" height="11" rx="3" fill="url(#barBefore)"/>
  <rect x="150" y="103" width="470" height="11" rx="5" fill="url(#barAfter)"/>
  <text x="628" y="101" fill="#e06666" font-family="sans-serif" font-size="11" text-anchor="end">¥8000-12000</text>

  <text x="52" y="156" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold">② 控制线回底盒</text>
  <rect x="150" y="146" width="6" height="11" rx="3" fill="url(#barBefore)"/>
  <rect x="150" y="161" width="265" height="11" rx="5" fill="url(#barAfter)"/>
  <text x="423" y="159" fill="#e06666" font-family="sans-serif" font-size="11">重走强电</text>

  <text x="52" y="214" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold">③ 底盒深度</text>
  <rect x="150" y="204" width="6" height="11" rx="3" fill="url(#barBefore)"/>
  <rect x="150" y="219" width="215" height="11" rx="5" fill="url(#barAfter)"/>
  <text x="373" y="217" fill="#e06666" font-family="sans-serif" font-size="11">凿墙换盒</text>

  <text x="52" y="272" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold">④ 窗帘盒电源</text>
  <rect x="150" y="262" width="6" height="11" rx="3" fill="url(#barBefore)"/>
  <rect x="150" y="277" width="168" height="11" rx="5" fill="url(#barAfter)"/>
  <text x="326" y="275" fill="#e06666" font-family="sans-serif" font-size="11">破墙取电</text>

  <text x="52" y="330" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold">⑤ 网关插座网口</text>
  <rect x="150" y="320" width="6" height="11" rx="3" fill="url(#barBefore)"/>
  <rect x="150" y="335" width="140" height="11" rx="5" fill="url(#barAfter)"/>
  <text x="298" y="333" fill="#e06666" font-family="sans-serif" font-size="11">明装走线</text>

  <text x="52" y="388" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold">⑥ 超六类网线</text>
  <rect x="150" y="378" width="6" height="11" rx="3" fill="url(#barBefore)"/>
  <rect x="150" y="393" width="118" height="11" rx="5" fill="url(#barAfter)"/>
  <text x="276" y="391" fill="#e06666" font-family="sans-serif" font-size="11">明线或无线</text>

  <rect x="34" y="424" width="612" height="32" rx="8" fill="#152a4a"/>
  <text x="52" y="445" fill="#7ec27e" font-family="sans-serif" font-size="12.5" font-weight="bold">封槽前每一根线都是白菜价，封完之后每一处改动都是砸墙价（条长示意量级）</text>
</svg>
