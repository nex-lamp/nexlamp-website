<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="barGood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ec27e"/>
      <stop offset="100%" stop-color="#5b8c5a"/>
    </linearGradient>
    <linearGradient id="barBad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f85149"/>
      <stop offset="100%" stop-color="#da3633"/>
    </linearGradient>
  </defs>
  <rect width="680" height="360" fill="url(#bg2)"/>
  <text x="340" y="36" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="22" font-weight="700">智能灯待机功耗，差在哪？</text>
  <text x="340" y="62" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">关灯状态下，不同驱动方案的待机功率对比</text>
  <g transform="translate(80, 100)">
    <text x="0" y="20" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">普通非隔离驱动</text>
    <rect x="10" y="0" width="420" height="28" rx="6" fill="url(#barBad)" opacity="0.9"/>
    <text x="440" y="20" fill="#f85149" font-family="system-ui, sans-serif" font-size="13" font-weight="700">~1.5W</text>
    <text x="10" y="46" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">WiFi模组常开 + 驱动静态损耗高</text>
  </g>
  <g transform="translate(80, 170)">
    <text x="0" y="20" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">普通隔离驱动</text>
    <rect x="10" y="0" width="140" height="28" rx="6" fill="#f0883e" opacity="0.9"/>
    <text x="160" y="20" fill="#f0883e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">~0.5W</text>
    <text x="10" y="46" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">隔离设计降低漏电流，但通信模块仍耗电</text>
  </g>
  <g transform="translate(80, 240)">
    <text x="0" y="20" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">低功耗Zigbee方案</text>
    <rect x="10" y="0" width="84" height="28" rx="6" fill="url(#barGood)" opacity="0.9"/>
    <text x="104" y="20" fill="#7ec27e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">~0.3W</text>
    <text x="10" y="46" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">低静态LDO + 深度休眠 + 快速唤醒</text>
  </g>
  <line x1="80" y1="320" x2="600" y2="320" stroke="#30363d" stroke-width="1" stroke-dasharray="4"/>
  <text x="340" y="340" text-anchor="middle" fill="#7ec27e" font-family="system-ui, sans-serif" font-size="12">新国标要求：待机功耗必须合规 · 低功耗方案更稳</text>
</svg>
