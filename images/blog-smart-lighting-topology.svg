<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Consolas','Microsoft YaHei',monospace">
  <defs>
    <linearGradient id="bgF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f1d32"/>
    </linearGradient>
    <filter id="glowF">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridF" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e3a5f" stroke-width="0.25" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="900" height="440" rx="8" fill="url(#bgF)"/>
  <rect width="900" height="440" rx="8" fill="url(#gridF)"/>
  <!-- Title -->
  <rect x="0" y="0" width="900" height="46" fill="#0d1b2a" opacity="0.8"/>
  <rect x="0" y="42" width="900" height="3" fill="#a78bfa" opacity="0.3"/>
  <text x="450" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0" letter-spacing="2">网络拓扑优化方案 · NETWORK TOPOLOGY OPTIMIZATION</text>

  <!-- Bad topology (left) -->
  <rect x="30" y="65" width="410" height="340" rx="6" fill="#0d1b2a" stroke="#ef4444" stroke-width="0.8" opacity="0.5"/>
  <rect x="30" y="65" width="410" height="32" rx="6" fill="#ef4444" opacity="0.12"/>
  <text x="235" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444">❌ 常见错误拓扑</text>

  <!-- Router in corner -->
  <rect x="55" y="115" width="70" height="35" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="0.8"/>
  <text x="90" y="136" text-anchor="middle" font-size="9" fill="#fca5a5">路由器</text>
  <text x="90" y="160" text-anchor="middle" font-size="8" fill="#64748b">（角落位置）</text>

  <!-- Gateway far from router -->
  <rect x="200" y="180" width="70" height="35" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="0.8"/>
  <text x="235" y="201" text-anchor="middle" font-size="9" fill="#fca5a5">网关</text>
  <line x1="125" y1="132" x2="200" y2="195" stroke="#ef4444" stroke-width="0.8" opacity="0.4" stroke-dasharray="4,3"/>
  <text x="163" y="168" text-anchor="middle" font-size="8" fill="#ef4444">信号弱</text>

  <!-- Devices in chain (bad) -->
  <circle cx="320" cy="250" r="12" fill="#1e293b" stroke="#ef4444" stroke-width="0.8"/>
  <text x="320" y="254" text-anchor="middle" font-size="8" fill="#fca5a5">D1</text>
  <circle cx="370" cy="300" r="12" fill="#1e293b" stroke="#ef4444" stroke-width="0.8"/>
  <text x="370" y="304" text-anchor="middle" font-size="8" fill="#fca5a5">D2</text>
  <circle cx="390" cy="360" r="12" fill="#1e293b" stroke="#ef4444" stroke-width="0.8"/>
  <text x="390" y="364" text-anchor="middle" font-size="8" fill="#fca5a5">D3</text>

  <line x1="270" y1="215" x2="312" y2="245" stroke="#ef4444" stroke-width="0.8" opacity="0.4"/>
  <line x1="332" y1="258" x2="362" y2="290" stroke="#ef4444" stroke-width="0.8" opacity="0.4"/>
  <line x1="378" y1="312" x2="388" y2="348" stroke="#ef4444" stroke-width="0.8" opacity="0.4"/>

  <!-- Labels -->
  <text x="235" y="280" text-anchor="middle" font-size="9" fill="#ef4444">3跳Mesh链</text>
  <text x="235" y="300" text-anchor="middle" font-size="9" fill="#94a3b8">每跳增加30-80ms</text>
  <text x="235" y="320" text-anchor="middle" font-size="9" fill="#94a3b8">末端设备延迟>500ms</text>
  <text x="235" y="345" text-anchor="middle" font-size="9" fill="#94a3b8">丢包率高、频繁掉线</text>

  <!-- Divider -->
  <line x1="450" y1="80" x2="450" y2="400" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <text x="450" y="410" text-anchor="middle" font-size="10" fill="#475569">VS</text>

  <!-- Good topology (right) -->
  <rect x="460" y="65" width="410" height="340" rx="6" fill="#0d1b2a" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>
  <rect x="460" y="65" width="410" height="32" rx="6" fill="#34d399" opacity="0.12"/>
  <text x="665" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">✅ 优化后拓扑</text>

  <!-- Router central -->
  <rect x="630" y="130" width="70" height="35" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="665" y="151" text-anchor="middle" font-size="9" fill="#6ee7b7">路由器</text>
  <text x="665" y="175" text-anchor="middle" font-size="8" fill="#64748b">（中心位置）</text>

  <!-- Gateway near router -->
  <rect x="510" y="200" width="70" height="35" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="545" y="221" text-anchor="middle" font-size="9" fill="#6ee7b7">网关A</text>
  <rect x="750" y="200" width="70" height="35" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="785" y="221" text-anchor="middle" font-size="9" fill="#6ee7b7">网关B</text>

  <line x1="630" y1="155" x2="580" y2="200" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  <line x1="700" y1="155" x2="750" y2="200" stroke="#34d399" stroke-width="1" opacity="0.6"/>

  <!-- Devices star topology -->
  <circle cx="490" cy="280" r="10" fill="#1e293b" stroke="#34d399" stroke-width="0.8"/>
  <text x="490" y="284" text-anchor="middle" font-size="7" fill="#6ee7b7">D1</text>
  <circle cx="540" cy="300" r="10" fill="#1e293b" stroke="#34d399" stroke-width="0.8"/>
  <text x="540" y="304" text-anchor="middle" font-size="7" fill="#6ee7b7">D2</text>
  <circle cx="510" cy="330" r="10" fill="#1e293b" stroke="#34d399" stroke-width="0.8"/>
  <text x="510" y="334" text-anchor="middle" font-size="7" fill="#6ee7b7">D3</text>

  <circle cx="770" cy="280" r="10" fill="#1e293b" stroke="#34d399" stroke-width="0.8"/>
  <text x="770" y="284" text-anchor="middle" font-size="7" fill="#6ee7b7">D4</text>
  <circle cx="820" cy="300" r="10" fill="#1e293b" stroke="#34d399" stroke-width="0.8"/>
  <text x="820" y="304" text-anchor="middle" font-size="7" fill="#6ee7b7">D5</text>
  <circle cx="800" cy="340" r="10" fill="#1e293b" stroke="#34d399" stroke-width="0.8"/>
  <text x="800" y="344" text-anchor="middle" font-size="7" fill="#6ee7b7">D6</text>

  <line x1="545" y1="235" x2="500" y2="272" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>
  <line x1="545" y1="235" x2="540" y2="290" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>
  <line x1="545" y1="235" x2="515" y2="320" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>
  <line x1="785" y1="235" x2="772" y2="272" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>
  <line x1="785" y1="235" x2="815" y2="290" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>
  <line x1="785" y1="235" x2="798" y2="330" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>

  <!-- Labels -->
  <text x="665" y="290" text-anchor="middle" font-size="9" fill="#34d399">星形拓扑</text>
  <text x="665" y="310" text-anchor="middle" font-size="9" fill="#94a3b8">每设备≤2跳直达网关</text>
  <text x="665" y="330" text-anchor="middle" font-size="9" fill="#94a3b8">延迟30-80ms稳定</text>
  <text x="665" y="350" text-anchor="middle" font-size="9" fill="#94a3b8">双网关分区，负载均衡</text>

  <!-- Footer -->
  <rect x="0" y="410" width="900" height="30" fill="#0d1b2a" opacity="0.6"/>
  <text x="450" y="428" text-anchor="middle" font-size="9" fill="#475569">Nexlamp · 网络拓扑优化方案对比</text>
</svg>