<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2b45" stroke-width="1"/>
    </pattern>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7ec27e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="640" fill="#0a1628"/>
  <rect width="1080" height="640" fill="url(#grid)"/>

  <text x="60" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="38" font-weight="bold">下单前问清这四句</text>
  <text x="60" y="112" fill="#7c8db0" font-family="sans-serif" font-size="21">异响在出厂那一刻就定了，装到墙上再想改，只有退货一条路</text>

  <!-- card 1 -->
  <rect x="60" y="150" width="460" height="200" rx="10" fill="#101f36" stroke="#2a3f5f"/>
  <rect x="60" y="150" width="6" height="200" rx="3" fill="url(#lg)"/>
  <text x="88" y="188" fill="#22d3ee" font-family="sans-serif" font-size="17" font-weight="bold">问 1</text>
  <text x="88" y="224" fill="#e2e8f0" font-family="sans-serif" font-size="24" font-weight="bold">驱动灌封了吗？</text>
  <text x="88" y="262" fill="#8fa3c0" font-family="sans-serif" font-size="18">环氧或硅胶整体填充，既压住线圈振动，</text>
  <text x="88" y="288" fill="#8fa3c0" font-family="sans-serif" font-size="18">又阻断振动传给灯壳。降噪最有效的一招，</text>
  <text x="88" y="314" fill="#7ec27e" font-family="sans-serif" font-size="18">也是同方案差价最明显的地方。</text>

  <!-- card 2 -->
  <rect x="560" y="150" width="460" height="200" rx="10" fill="#101f36" stroke="#2a3f5f"/>
  <rect x="560" y="150" width="6" height="200" rx="3" fill="url(#lg)"/>
  <text x="588" y="188" fill="#22d3ee" font-family="sans-serif" font-size="17" font-weight="bold">问 2</text>
  <text x="588" y="224" fill="#e2e8f0" font-family="sans-serif" font-size="24" font-weight="bold">用什么调光方式？</text>
  <text x="588" y="262" fill="#8fa3c0" font-family="sans-serif" font-size="18">0-10V、DALI 是模拟或数字调光，天生比</text>
  <text x="588" y="288" fill="#8fa3c0" font-family="sans-serif" font-size="18">可控硅干净。选可控硅，就要问清最低负载</text>
  <text x="588" y="314" fill="#7ec27e" font-family="sans-serif" font-size="18">和兼容调光器清单。</text>

  <!-- card 3 -->
  <rect x="60" y="380" width="460" height="200" rx="10" fill="#101f36" stroke="#2a3f5f"/>
  <rect x="60" y="380" width="6" height="200" rx="3" fill="url(#lg)"/>
  <text x="88" y="418" fill="#22d3ee" font-family="sans-serif" font-size="17" font-weight="bold">问 3</text>
  <text x="88" y="454" fill="#e2e8f0" font-family="sans-serif" font-size="24" font-weight="bold">驱动能单独换吗？</text>
  <text x="88" y="492" fill="#8fa3c0" font-family="sans-serif" font-size="18">一体式灯具驱动坏了只能换整灯；</text>
  <text x="88" y="518" fill="#8fa3c0" font-family="sans-serif" font-size="18">分体式换一只电源就行。</text>
  <text x="88" y="544" fill="#7ec27e" font-family="sans-serif" font-size="18">这一条决定三年后的持有成本。</text>

  <!-- card 4 -->
  <rect x="560" y="380" width="460" height="200" rx="10" fill="#101f36" stroke="#2a3f5f"/>
  <rect x="560" y="380" width="6" height="200" rx="3" fill="url(#lg)"/>
  <text x="588" y="418" fill="#22d3ee" font-family="sans-serif" font-size="17" font-weight="bold">问 4</text>
  <text x="588" y="454" fill="#e2e8f0" font-family="sans-serif" font-size="24" font-weight="bold">灯壳是薄壁拉伸件吗？</text>
  <text x="588" y="492" fill="#8fa3c0" font-family="sans-serif" font-size="18">太薄的铝壳、大面积平板结构最容易共振，</text>
  <text x="588" y="518" fill="#8fa3c0" font-family="sans-serif" font-size="18">同一只驱动装进去就变成音箱。</text>
  <text x="588" y="544" fill="#7ec27e" font-family="sans-serif" font-size="18">有加强筋、壁厚扎实的更安静。</text>

  <text x="1020" y="620" fill="#3b5077" font-family="sans-serif" font-size="15" text-anchor="end">耐利普科技 · 灯具选型清单</text>
</svg>
