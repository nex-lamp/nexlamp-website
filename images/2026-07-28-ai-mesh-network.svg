<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#141830"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00664d"/>
    </radialGradient>
    <radialGradient id="edgeGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#003366"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonEdge">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#8892b0" font-size="14" font-family="sans-serif">去中心化自组网架构 — 每一盏灯都是智能节点</text>

  <!-- Left: Traditional centralized -->
  <rect x="30" y="50" width="340" height="420" rx="10" fill="#1a1f3a" stroke="#2a3050" stroke-width="1"/>
  <text x="200" y="80" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="bold" font-family="sans-serif">❌ 传统集中式架构</text>

  <!-- Central gateway -->
  <circle cx="200" cy="150" r="30" fill="#ff6b3522" stroke="#ff6b35" stroke-width="2"/>
  <text x="200" y="147" text-anchor="middle" fill="#ff6b35" font-size="10" font-weight="bold" font-family="sans-serif">中央</text>
  <text x="200" y="159" text-anchor="middle" fill="#ff6b35" font-size="10" font-weight="bold" font-family="sans-serif">网关</text>

  <!-- Gateway failure -->
  <circle cx="200" cy="150" r="30" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Stars (end nodes) -->
  <circle cx="120" cy="240" r="12" fill="#ff6b3522" stroke="#ff6b35" stroke-width="1.5"/>
  <circle cx="200" cy="260" r="12" fill="#ff6b3522" stroke="#ff6b35" stroke-width="1.5"/>
  <circle cx="280" cy="240" r="12" fill="#ff6b3522" stroke="#ff6b35" stroke-width="1.5"/>
  <circle cx="100" cy="320" r="12" fill="#ff6b3522" stroke="#ff6b35" stroke-width="1.5"/>
  <circle cx="200" cy="340" r="12" fill="#ff6b3522" stroke="#ff6b35" stroke-width="1.5"/>
  <circle cx="300" cy="320" r="12" fill="#ff6b3522" stroke="#ff6b35" stroke-width="1.5"/>

  <!-- Star connections to gateway -->
  <line x1="200" y1="150" x2="120" y2="240" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="150" x2="200" y2="260" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="150" x2="280" y2="240" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="150" x2="100" y2="320" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="150" x2="200" y2="340" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="150" x2="300" y2="320" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>

  <!-- Failure label -->
  <text x="200" y="395" text-anchor="middle" fill="#ff4444" font-size="12" font-family="sans-serif">⚠ 网关故障 → 全系统瘫痪</text>
  <text x="200" y="415" text-anchor="middle" fill="#666" font-size="11" font-family="sans-serif">单点故障 · 需专业布线 · 扩��受限</text>

  <!-- Right: Decentralized Mesh -->
  <rect x="400" y="50" width="370" height="420" rx="10" fill="#1a1f3a" stroke="#2a3050" stroke-width="1"/>

  <!-- Mesh nodes -->
  <circle cx="460" cy="110" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.9"/>
  <text x="460" y="114" text-anchor="middle" fill="#fff" font-size="8" font-family="sans-serif">AI</text>

  <circle cx="530" cy="90" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.7"/>
  <text x="530" y="94" text-anchor="middle" fill="#fff" font-size="8" font-family="sans-serif">AI</text>

  <circle cx="600" cy="110" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.8"/>
  <text x="600" y="114" text-anchor="middle" fill="#fff" font-size="8" font-family="sans-serif">AI</text>

  <circle cx="670" cy="95" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.6"/>
  <text x="670" y="99" text-anchor="middle" fill="#fff" font-size="8" font-family="sans-serif">AI</text>

  <circle cx="490" cy="180" r="18" fill="url(#edgeGrad)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="570" cy="170" r="18" fill="url(#edgeGrad)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="650" cy="185" r="18" fill="url(#edgeGrad)" filter="url(#glow)" opacity="0.6"/>

  <circle cx="440" cy="250" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="520" cy="260" r="18" fill="url(#edgeGrad)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="610" cy="240" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.9"/>
  <circle cx="690" cy="255" r="18" fill="url(#edgeGrad)" filter="url(#glow)" opacity="0.7"/>

  <circle cx="470" cy="330" r="18" fill="url(#edgeGrad)" filter="url(#glow)" opacity="0.6"/>
  <circle cx="560" cy="340" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="640" cy="320" r="18" fill="url(#edgeGrad)" filter="url(#glow)" opacity="0.7"/>

  <circle cx="510" cy="400" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="600" cy="395" r="18" fill="url(#edgeGrad)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="680" cy="400" r="18" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.7"/>

  <!-- Mesh connections -->
  <line x1="460" y1="110" x2="530" y2="90" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="530" y1="90" x2="600" y2="110" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="110" x2="670" y2="95" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="460" y1="110" x2="490" y2="180" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="530" y1="90" x2="570" y2="170" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="110" x2="650" y2="185" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="670" y1="95" x2="650" y2="185" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="490" y1="180" x2="570" y2="170" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="570" y1="170" x2="650" y2="185" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="490" y1="180" x2="440" y2="250" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="570" y1="170" x2="610" y2="240" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="650" y1="185" x2="690" y2="255" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="440" y1="250" x2="520" y2="260" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="520" y1="260" x2="610" y2="240" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="610" y1="240" x2="690" y2="255" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="440" y1="250" x2="470" y2="330" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="520" y1="260" x2="560" y2="340" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="610" y1="240" x2="640" y2="320" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="690" y1="255" x2="640" y2="320" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="470" y1="330" x2="560" y2="340" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="560" y1="340" x2="640" y2="320" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="470" y1="330" x2="510" y2="400" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="560" y1="340" x2="600" y2="395" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="640" y1="320" x2="680" y2="400" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="510" y1="400" x2="600" y2="395" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="395" x2="680" y2="400" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>

  <!-- Legend -->
  <rect x="420" y="60" width="14" height="14" rx="3" fill="url(#nodeGrad)" opacity="0.8"/>
  <text x="438" y="72" fill="#8892b0" font-size="9" font-family="sans-serif">AI计算节点</text>
  <rect x="500" y="60" width="14" height="14" rx="3" fill="url(#edgeGrad)" opacity="0.8"/>
  <text x="518" y="72" fill="#8892b0" font-size="9" font-family="sans-serif">传感器节点</text>

  <!-- Benefit labels -->
  <rect x="420" y="380" width="330" height="65" rx="6" fill="#203a2a" stroke="#00d4aa33" stroke-width="0.5"/>
  <text x="435" y="398" fill="#00d4aa" font-size="11" font-family="sans-serif">✓ 无单点故障：任意节点离线，网络自动重新路由</text>
  <text x="435" y="416" fill="#00d4aa" font-size="11" font-family="sans-serif">✓ 即装即用：免布线 · 免编程 · 免预设地址</text>
  <text x="435" y="434" fill="#00d4aa" font-size="11" font-family="sans-serif">✓ 弹性扩展：支持万级节点，随需增减</text>
</svg>
