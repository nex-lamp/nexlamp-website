<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
  </defs>

  <rect width="680" height="460" fill="url(#bg)"/>
  <rect width="680" height="460" fill="url(#grid)"/>

  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" fill="#64b5f6" font-family="monospace" font-size="16" font-weight="bold">新国标下智能LED灯选购决策流程</text>
  <line x1="100" y1="45" x2="580" y2="45" stroke="#2478C2" stroke-width="1" opacity="0.3"/>

  <!-- Step 1: Start -->
  <rect x="240" y="65" width="200" height="44" rx="22" fill="#1e3a5f" stroke="#2478C2" stroke-width="1.5"/>
  <text x="340" y="93" text-anchor="middle" fill="#90caf9" font-family="monospace" font-size="14" font-weight="bold">🔍 开始选灯</text>

  <!-- Arrow 1 -->
  <line x1="340" y1="109" x2="340" y2="130" stroke="#2478C2" stroke-width="1.5"/>
  <polygon points="340,130 333,123 347,123" fill="#2478C2"/>

  <!-- Step 2: Energy Level -->
  <rect x="200" y="133" width="280" height="56" rx="8" fill="#0d2818" stroke="#22c55e" stroke-width="2"/>
  <text x="340" y="156" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">① 看能效等级</text>
  <text x="340" y="176" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">家用≥2级 | 儿童房/书房=1级</text>

  <!-- Arrow 2 -->
  <line x1="340" y1="189" x2="340" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="340,210 333,203 347,203" fill="#22c55e"/>

  <!-- Step 3: Standby -->
  <rect x="200" y="213" width="280" height="56" rx="8" fill="#0d2818" stroke="#22c55e" stroke-width="2"/>
  <text x="340" y="236" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">② 查待机功耗</text>
  <text x="340" y="256" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">智能灯待机≤0.5W=优秀 | ≤2.5W=合规</text>

  <!-- Arrow 3 -->
  <line x1="340" y1="269" x2="340" y2="290" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="340,290 333,283 347,283" fill="#22c55e"/>

  <!-- Step 4: CRI -->
  <rect x="200" y="293" width="280" height="56" rx="8" fill="#0d2818" stroke="#22c55e" stroke-width="2"/>
  <text x="340" y="316" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">③ 验显色指数</text>
  <text x="340" y="336" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">儿童房≥90 | 客厅≥80 | 走廊≥70</text>

  <!-- Arrow 4 -->
  <line x1="340" y1="349" x2="340" y2="370" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="340,370 333,363 347,363" fill="#22c55e"/>

  <!-- Step 5: Decision Node -->
  <rect x="200" y="373" width="280" height="56" rx="8" fill="#0d2818" stroke="#22c55e" stroke-width="2"/>
  <text x="340" y="396" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">④ 选控制方式</text>
  <text x="340" y="416" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">Zigbee Mesh=大户型 | WiFi=小户型 | BLE=单房间</text>

  <!-- Arrow 5 to End -->
  <line x1="340" y1="429" x2="340" y2="446" stroke="#2478C2" stroke-width="1.5"/>
  <polygon points="340,446 333,439 347,439" fill="#2478C2"/>

  <!-- End -->
  <text x="340" y="462" text-anchor="middle" fill="#90caf9" font-family="monospace" font-size="13">✅ 落地装灯</text>

  <!-- Side note: Right -->
  <rect x="510" y="150" width="145" height="220" rx="6" fill="#1a1a2e" stroke="#555" stroke-width="1" opacity="0.6"/>
  <text x="583" y="175" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11" font-weight="bold">⚠️ 避坑提示</text>
  <line x1="525" y1="185" x2="640" y2="185" stroke="#555" stroke-width="0.5"/>
  <text x="525" y="208" fill="#e55" font-family="monospace" font-size="10">× 只标"高亮"不标lm/W</text>
  <text x="525" y="228" fill="#e55" font-family="monospace" font-size="10">× 智能灯无待机参数</text>
  <text x="525" y="248" fill="#e55" font-family="monospace" font-size="10">× Ra值来源不明</text>
  <text x="525" y="268" fill="#e55" font-family="monospace" font-size="10">× "兼容全部协议"但</text>
  <text x="525" y="284" fill="#e55" font-family="monospace" font-size="10">  无认证标志</text>
  <text x="525" y="310" fill="#aaa" font-family="monospace" font-size="10">√ 标注完整参数</text>
  <text x="525" y="330" fill="#aaa" font-family="monospace" font-size="10">√ 有3C认证号</text>
  <text x="525" y="350" fill="#aaa" font-family="monospace" font-size="10">√ 提供检测报告</text>
</svg>