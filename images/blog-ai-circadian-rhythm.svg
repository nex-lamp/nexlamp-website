<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="morningGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#fff5cc"/>
    </linearGradient>
    <linearGradient id="dayGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="eveningGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <linearGradient id="nightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#8b4513"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="680" height="400" fill="url(#bgGrad2)"/>
  
  <!-- 网格 -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="40" x2="680" y2="40"/><line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="200" x2="680" y2="200"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="280" x2="680" y2="280"/><line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- 标题 -->
  <text x="340" y="35" fill="#00d4ff" font-size="15" font-family="monospace" text-anchor="middle" filter="url(#glow2)">AI CIRCADIAN RHYTHM LIGHTING — 节律照明</text>

  <!-- 时间轴 -->
  <line x1="40" y1="100" x2="640" y2="100" stroke="#2478c2" stroke-width="2" opacity="0.6"/>
  
  <!-- 时间节点 -->
  <!-- 7:00 早晨 -->
  <g transform="translate(80,55)">
    <circle cx="0" cy="45" r="6" fill="#ffd700" filter="url(#glow2)"/>
    <rect x="-30" y="5" width="60" height="35" rx="5" fill="#ffd700" opacity="0.15" stroke="#ffd700" stroke-width="0.8"/>
    <text x="0" y="20" fill="#ffd700" font-size="10" font-family="monospace" text-anchor="middle">7:00 AM</text>
    <text x="0" y="33" fill="#ffd700" font-size="8" font-family="monospace" text-anchor="middle">4000K 自然白</text>
    <text x="0" y="60" fill="#ffd700" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.7">唤醒 · 清醒</text>
    <!-- 太阳图标 -->
    <circle cx="0" cy="-10" r="12" fill="#ffd700" opacity="0.4" filter="url(#softGlow2)"/>
    <circle cx="0" cy="-10" r="8" fill="#ffd700" opacity="0.8"/>
  </g>
  
  <!-- 14:00 下午 -->
  <g transform="translate(210,55)">
    <circle cx="0" cy="45" r="6" fill="#87ceeb" filter="url(#glow2)"/>
    <rect x="-30" y="5" width="60" height="35" rx="5" fill="#87ceeb" opacity="0.15" stroke="#87ceeb" stroke-width="0.8"/>
    <text x="0" y="20" fill="#87ceeb" font-size="10" font-family="monospace" text-anchor="middle">2:00 PM</text>
    <text x="0" y="33" fill="#87ceeb" font-size="8" font-family="monospace" text-anchor="middle">5000K 正白</text>
    <text x="0" y="60" fill="#87ceeb" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.7">专注 · 高效</text>
    <!-- 光标图标 -->
    <rect x="-5" y="-15" width="10" height="10" fill="#87ceeb" opacity="0.5"/>
  </g>
  
  <!-- 18:00 傍晚 -->
  <g transform="translate(360,55)">
    <circle cx="0" cy="45" r="6" fill="#ff8c00" filter="url(#glow2)"/>
    <rect x="-30" y="5" width="60" height="35" rx="5" fill="#ff8c00" opacity="0.15" stroke="#ff8c00" stroke-width="0.8"/>
    <text x="0" y="20" fill="#ff8c00" font-size="10" font-family="monospace" text-anchor="middle">6:00 PM</text>
    <text x="0" y="33" fill="#ff8c00" font-size="8" font-family="monospace" text-anchor="middle">3500K 柔暖</text>
    <text x="0" y="60" fill="#ff8c00" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.7">放松 · 过渡</text>
  </g>
  
  <!-- 20:00 晚间 -->
  <g transform="translate(480,55)">
    <circle cx="0" cy="45" r="6" fill="#ff4500" filter="url(#glow2)"/>
    <rect x="-30" y="5" width="60" height="35" rx="5" fill="#ff4500" opacity="0.15" stroke="#ff4500" stroke-width="0.8"/>
    <text x="0" y="20" fill="#ff4500" font-size="10" font-family="monospace" text-anchor="middle">8:00 PM</text>
    <text x="0" y="33" fill="#ff4500" font-size="8" font-family="monospace" text-anchor="middle">3000K 暖黄</text>
    <text x="0" y="60" fill="#ff4500" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.7">休闲 · 阅读</text>
  </g>
  
  <!-- 22:00 睡前 -->
  <g transform="translate(600,55)">
    <circle cx="0" cy="45" r="6" fill="#8b4513" filter="url(#glow2)"/>
    <rect x="-30" y="5" width="60" height="35" rx="5" fill="#8b4513" opacity="0.15" stroke="#8b4513" stroke-width="0.8"/>
    <text x="0" y="20" fill="#8b4513" font-size="10" font-family="monospace" text-anchor="middle">10:00 PM</text>
    <text x="0" y="33" fill="#8b4513" font-size="8" font-family="monospace" text-anchor="middle">2700K 超暖</text>
    <text x="0" y="60" fill="#8b4513" font-size="8" font-family="monospace" text-anchor="middle" opacity="0.7">助眠 · 褪黑素</text>
  </g>

  <!-- 光谱曲线区域 -->
  <text x="340" y="140" fill="#7ec27e" font-size="12" font-family="monospace" text-anchor="middle">色温动态曲线 (2700K → 5000K → 2700K)</text>
  
  <!-- 曲线 -->
  <path d="M80,220 Q160,160 210,180 Q280,140 340,180 Q400,210 480,240 Q560,270 600,280" 
        fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#glow2)"/>
  
  <!-- 曲线填充 -->
  <path d="M80,220 Q160,160 210,180 Q280,140 340,180 Q400,210 480,240 Q560,270 600,280 L600,300 L80,300 Z" 
        fill="#00d4ff" opacity="0.08"/>

  <!-- 曲线标注 -->
  <text x="80" y="235" fill="#ffd700" font-size="8" font-family="monospace" opacity="0.7">2700K</text>
  <text x="210" y="175" fill="#87ceeb" font-size="8" font-family="monospace" opacity="0.7">5000K</text>
  <text x="600" y="295" fill="#8b4513" font-size="8" font-family="monospace" opacity="0.7">2700K</text>

  <!-- 健康指标区 -->
  <g transform="translate(100,310)">
    <!-- 蓝光指标 -->
    <rect x="0" y="0" width="150" height="30" rx="3" fill="#1a3050" stroke="#2478c2" stroke-width="0.8"/>
    <text x="75" y="18" fill="#2478c2" font-size="9" font-family="monospace" text-anchor="middle">蓝光危害降低 50%+</text>
    
    <!-- 显色指标 -->
    <rect x="170" y="0" width="150" height="30" rx="3" fill="#1a3050" stroke="#7ec27e" stroke-width="0.8"/>
    <text x="245" y="18" fill="#7ec27e" font-size="9" font-family="monospace" text-anchor="middle">全光谱 Ra&amp;ge;95</text>
    
    <!-- 节律指标 -->
    <rect x="340" y="0" width="150" height="30" rx="3" fill="#1a3050" stroke="#ffd700" stroke-width="0.8"/>
    <text x="415" y="18" fill="#ffd700" font-size="9" font-family="monospace" text-anchor="middle">节律色温 2700-5000K</text>
  </g>

  <!-- 底部 -->
  <rect x="120" y="360" width="440" height="30" rx="5" fill="#7ec27e" opacity="0.15" stroke="#7ec27e" stroke-width="1"/>
  <text x="340" y="380" fill="#7ec27e" font-size="11" font-family="monospace" text-anchor="middle" filter="url(#glow2)">健康照明 = 节律管理 + 全光谱 + 低蓝光</text>
</svg>