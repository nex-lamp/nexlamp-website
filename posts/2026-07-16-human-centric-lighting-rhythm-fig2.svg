<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a44"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#87ceeb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#e0e8f0" text-anchor="middle">Dual-Channel LED Driver: Tunable White Architecture</text>

  <!-- Left: Warm LED Module -->
  <rect x="60" y="100" width="200" height="280" rx="12" fill="#1a2030" stroke="#ff9a44" stroke-width="2"/>
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff9a44" text-anchor="middle">WARM LED</text>
  <text x="160" y="150" font-family="Arial, sans-serif" font-size="11" fill="#aaa" text-anchor="middle">2700K - 3500K</text>

  <!-- LED chips visual warm -->
  <rect x="100" y="170" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>
  <rect x="140" y="170" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>
  <rect x="180" y="170" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>
  <rect x="100" y="210" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>
  <rect x="140" y="210" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>
  <rect x="180" y="210" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>
  <rect x="100" y="250" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>
  <rect x="140" y="250" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>
  <rect x="180" y="250" width="30" height="30" rx="4" fill="#ff9a44" filter="url(#glow)"/>

  <!-- Warm current label -->
  <text x="160" y="310" font-family="Arial, sans-serif" font-size="12" fill="#ff9a44" text-anchor="middle">I_warm = 0~700mA</text>
  <text x="160" y="330" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">Channel 1 Output</text>

  <!-- Right: Cool LED Module -->
  <rect x="540" y="100" width="200" height="280" rx="12" fill="#1a2030" stroke="#4a90d9" stroke-width="2"/>
  <text x="640" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a90d9" text-anchor="middle">COOL LED</text>
  <text x="640" y="150" font-family="Arial, sans-serif" font-size="11" fill="#aaa" text-anchor="middle">5000K - 6500K</text>

  <!-- LED chips visual cool -->
  <rect x="580" y="170" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>
  <rect x="620" y="170" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>
  <rect x="660" y="170" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>
  <rect x="580" y="210" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>
  <rect x="620" y="210" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>
  <rect x="660" y="210" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>
  <rect x="580" y="250" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>
  <rect x="620" y="250" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>
  <rect x="660" y="250" width="30" height="30" rx="4" fill="#4a90d9" filter="url(#glow)"/>

  <!-- Cool current label -->
  <text x="640" y="310" font-family="Arial, sans-serif" font-size="12" fill="#4a90d9" text-anchor="middle">I_cool = 0~700mA</text>
  <text x="640" y="330" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">Channel 2 Output</text>

  <!-- Center: Driver IC -->
  <rect x="300" y="140" width="200" height="140" rx="10" fill="#2a3a5a" stroke="#5a8aaa" stroke-width="2"/>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e0e8f0" text-anchor="middle">LED DRIVER IC</text>
  <text x="400" y="190" font-family="Arial, sans-serif" font-size="11" fill="#aaa" text-anchor="middle">Dual-Channel CC</text>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">Accuracy: ±2%</text>
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">Dimming: 0.1%~100%</text>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">DALI-2 DT8 / PWM</text>

  <!-- Connection arrows -->
  <!-- Driver to Warm -->
  <line x1="300" y1="200" x2="260" y2="200" stroke="#ff9a44" stroke-width="2" marker-end="url(#arrowWarm)"/>
  <text x="280" y="195" font-family="Arial, sans-serif" font-size="10" fill="#ff9a44" text-anchor="middle">I₁</text>

  <!-- Driver to Cool -->
  <line x1="500" y1="200" x2="540" y2="200" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowCool)"/>
  <text x="520" y="195" font-family="Arial, sans-serif" font-size="10" fill="#4a90d9" text-anchor="middle">I₂</text>

  <!-- Control input -->
  <line x1="400" y1="140" x2="400" y2="100" stroke="#5a8aaa" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="11" fill="#5a8aaa" text-anchor="middle">DALI-2 / Zigbee / Matter</text>

  <!-- Bottom: Mixed output -->
  <rect x="250" y="420" width="300" height="50" rx="8" fill="#2a2a3a" stroke="#aaa" stroke-width="1"/>
  <text x="400" y="445" font-family="Arial, sans-serif" font-size="13" fill="#e0e8f0" text-anchor="middle" font-weight="bold">MIXED OUTPUT</text>
  <text x="400" y="462" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">CCT = f(I₁, I₂)  |  Lumen = I₁ + I₂</text>

  <!-- Arrows from modules to mixed output -->
  <line x1="160" y1="380" x2="300" y2="420" stroke="#ff9a44" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
  <line x1="640" y1="380" x2="500" y2="420" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>

  <!-- Color temperature scale -->
  <rect x="250" y="360" width="300" height="16" rx="8" fill="url(#warmGrad)" opacity="0.3"/>
  <rect x="250" y="360" width="150" height="16" rx="8" fill="url(#coolGrad)" opacity="0.3"/>
  <text x="250" y="388" font-family="Arial, sans-serif" font-size="9" fill="#ff9a44" text-anchor="start">2700K</text>
  <text x="400" y="388" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">4500K</text>
  <text x="550" y="388" font-family="Arial, sans-serif" font-size="9" fill="#4a90d9" text-anchor="end">6500K</text>
</svg>
