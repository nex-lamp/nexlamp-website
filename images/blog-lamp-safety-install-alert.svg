<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f38"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16263f" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#grid)" opacity="0.55"/>

  <g filter="url(#soft)">
    <rect x="40" y="22" width="820" height="40" rx="8" fill="#0d1f38" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  <circle cx="62" cy="42" r="4.5" fill="#f6ad55" opacity="0.75"/>
  <circle cx="79" cy="42" r="4.5" fill="#4fd1c5" opacity="0.6"/>
  <circle cx="96" cy="42" r="4.5" fill="#2d4a6b"/>
  <text x="116" y="47" fill="#7f9bbb" font-family="Consolas, Microsoft YaHei, monospace" font-size="15">lamp-safety / post-install-signals</text>
  <text x="838" y="47" text-anchor="end" fill="#3d5570" font-family="Consolas, Microsoft YaHei, monospace" font-size="15">5 signals</text>

  <rect x="40" y="78" width="4" height="30" rx="2" fill="#f6ad55"/>
  <text x="56" y="101" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="bold">已经装了：认准停用信号</text>

  <g filter="url(#soft)">
    <rect x="40" y="130" width="500" height="318" rx="10" fill="#0f2035" stroke="#2d4a6b" stroke-width="1.2"/>
  </g>
  <text x="64" y="166" fill="#7f9bbb" font-family="Consolas, Microsoft YaHei, monospace" font-size="15">signal scan / 台灯 · 护眼灯 · 嵌入式</text>
  <rect x="64" y="182" width="452" height="1" fill="#1e3a5f"/>

  <circle cx="74" cy="218" r="5" fill="#fc8181"/>
  <text x="92" y="223" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17">外壳发烫严重</text>
  <text x="512" y="223" text-anchor="end" fill="#fc8181" font-family="Consolas, monospace" font-size="15">STOP</text>

  <circle cx="74" cy="266" r="5" fill="#fc8181"/>
  <text x="92" y="271" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17">持续散发塑料烧焦气味</text>
  <text x="512" y="271" text-anchor="end" fill="#fc8181" font-family="Consolas, monospace" font-size="15">STOP</text>

  <circle cx="74" cy="314" r="5" fill="#f6ad55"/>
  <text x="92" y="319" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17">异响</text>
  <text x="512" y="319" text-anchor="end" fill="#f6ad55" font-family="Consolas, monospace" font-size="15">CHECK</text>

  <circle cx="74" cy="362" r="5" fill="#f6ad55"/>
  <text x="92" y="367" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17">电源线发热</text>
  <text x="512" y="367" text-anchor="end" fill="#f6ad55" font-family="Consolas, monospace" font-size="15">CHECK</text>

  <circle cx="74" cy="410" r="5" fill="#f6ad55"/>
  <text x="92" y="415" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17">光线闪烁异常</text>
  <text x="512" y="415" text-anchor="end" fill="#f6ad55" font-family="Consolas, monospace" font-size="15">CHECK</text>

  <g filter="url(#soft)">
    <rect x="568" y="130" width="292" height="318" rx="10" fill="#0f2035" stroke="#2d4a6b" stroke-width="1.2"/>
  </g>
  <text x="592" y="166" fill="#7f9bbb" font-family="Consolas, Microsoft YaHei, monospace" font-size="15">response / 顺序</text>
  <rect x="592" y="182" width="244" height="1" fill="#1e3a5f"/>

  <rect x="592" y="204" width="36" height="28" rx="6" fill="#fc8181" opacity="0.16"/>
  <text x="610" y="224" text-anchor="middle" fill="#fc8181" font-family="Consolas, monospace" font-size="15" font-weight="bold">1</text>
  <text x="640" y="224" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17">先断电停用</text>

  <rect x="592" y="264" width="36" height="28" rx="6" fill="#f6ad55" opacity="0.16"/>
  <text x="610" y="284" text-anchor="middle" fill="#f6ad55" font-family="Consolas, monospace" font-size="15" font-weight="bold">2</text>
  <text x="640" y="284" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17">别带电拧罩盖拽线</text>

  <rect x="592" y="324" width="36" height="28" rx="6" fill="#4fd1c5" opacity="0.16"/>
  <text x="610" y="344" text-anchor="middle" fill="#4fd1c5" font-family="Consolas, monospace" font-size="15" font-weight="bold">3</text>
  <text x="640" y="344" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17">留凭证走售后</text>

  <rect x="592" y="384" width="244" height="1" fill="#1e3a5f"/>
  <text x="592" y="416" fill="#8fb3cf" font-family="Microsoft YaHei, sans-serif" font-size="14">不是"性能不理想"，</text>
  <text x="592" y="440" fill="#f6ad55" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold">是安全信号。</text>

  <text x="40" y="482" fill="#7f9bbb" font-family="Microsoft YaHei, sans-serif" font-size="15">2026 年 12 月 1 日起，网售灯具纳入 CCC 强制认证管理；门槛抬高，到手这一关仍得自己把住。</text>
</svg>
