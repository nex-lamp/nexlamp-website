      <line x1="0" y1="70" x2="280" y2="70" stroke="#1a2547" stroke-width="1"/>

      <text x="0" y="100" font-family="'PingFang SC',sans-serif" font-size="14" fill="#7ec8e3">PWM 频率</text>
