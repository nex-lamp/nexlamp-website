<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="bar8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e07a5f"/>
      <stop offset="1" stop-color="#7a3a2c"/>
    </linearGradient>
    <linearGradient id="bar12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b26a"/>
      <stop offset="1" stop-color="#6d5230"/>
    </linearGradient>
    <linearGradient id="bar16" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ec27e"/>
      <stop offset="1" stop-color="#2f5a3c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b3355" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="680" height="600" fill="url(#bg)"/>
  <rect width="680" height="600" fill="url(#grid)" opacity="0.55"/>

  <text x="34" y="46" fill="#7ec27e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" letter-spacing="2">人眼不是线性的：Gamma 2.2 把低亮度压到几乎为零</text>
  <text x="34" y="70" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">占空比＝亮度百分比的 2.2 次方，越往下越小得离谱</text>
  <line x1="34" y1="84" x2="646" y2="84" stroke="#1b3355" stroke-width="1"/>

  <!-- 左：Gamma 曲线 -->
  <rect x="34" y="104" width="300" height="228" rx="12" fill="#101f38" stroke="#26456e" stroke-width="1.2"/>
  <line x1="66" y1="300" x2="308" y2="300" stroke="#1b3355" stroke-width="1"/>
  <line x1="66" y1="140" x2="66" y2="300" stroke="#1b3355" stroke-width="1"/>
  <path d="M66 300 Q96 300 120 292 Q170 272 210 226 Q252 176 300 148" fill="none" stroke="#7ec27e" stroke-width="2.6" filter="url(#glow)"/>
  <circle cx="120" cy="292" r="3.6" fill="#e8b26a"/>
  <circle cx="180" cy="252" r="3.6" fill="#e8b26a"/>
  <circle cx="240" cy="190" r="3.6" fill="#e8b26a"/>
  <text x="112" y="318" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="10.5">5%</text>
  <text x="174" y="318" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="10.5">10%</text>
  <text x="232" y="318" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="10.5">30%</text>
  <text x="46" y="132" fill="#5e7896" font-family="Microsoft YaHei, sans-serif" font-size="10.5">占空比</text>
  <text x="286" y="332" fill="#5e7896" font-family="Microsoft YaHei, sans-serif" font-size="10.5">亮度</text>

  <!-- 右：换算清单 -->
  <rect x="346" y="104" width="300" height="228" rx="12" fill="#101f38" stroke="#26456e" stroke-width="1.2"/>
  <text x="366" y="132" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700">同样一条曲线，换算下来</text>
  <line x1="366" y1="144" x2="626" y2="144" stroke="#1f3a5c" stroke-width="1"/>
  <text x="366" y="170" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="12.5">亮度 100%　→　占空比 100%</text>
  <text x="366" y="196" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="12.5">亮度 30%　 →　占空比 7.1%</text>
  <text x="366" y="222" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="12.5">亮度 10%　 →　占空比 0.63%</text>
  <text x="366" y="248" fill="#e8b26a" font-family="Microsoft YaHei, sans-serif" font-size="12.5">亮度 5%　  →　占空比 0.14%</text>
  <text x="366" y="274" fill="#e07a5f" font-family="Microsoft YaHei, sans-serif" font-size="12.5">亮度 1%　  →　占空比 0.004%</text>
  <line x1="366" y1="290" x2="626" y2="290" stroke="#1f3a5c" stroke-width="1"/>
  <text x="366" y="314" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">最后这两行，就是「一调到底就灭」的来源</text>

  <!-- 位深对照 -->
  <text x="34" y="372" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700">同样调到 5%，不同位深手里还剩几级台阶</text>

  <!-- 8位 -->
  <rect x="34" y="388" width="612" height="46" rx="8" fill="#101f38" stroke="#3a2a2a" stroke-width="1"/>
  <text x="52" y="416" fill="#e07a5f" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700">8 位</text>
  <text x="106" y="416" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">256 级</text>
  <rect x="200" y="402" width="6" height="18" fill="url(#bar8)"/>
  <text x="216" y="416" fill="#e07a5f" font-family="Microsoft YaHei, sans-serif" font-size="12">0.35 级 → 归零</text>
  <text x="420" y="416" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="11.5">5% 以下没台阶，慢动作里是断的</text>

  <!-- 12位 -->
  <rect x="34" y="442" width="612" height="46" rx="8" fill="#101f38" stroke="#3a3225" stroke-width="1"/>
  <text x="52" y="470" fill="#e8b26a" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700">12 位</text>
  <text x="106" y="470" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">4096 级</text>
  <rect x="200" y="456" width="90" height="18" rx="2" fill="url(#bar12)"/>
  <text x="300" y="470" fill="#e8b26a" font-family="Microsoft YaHei, sans-serif" font-size="12">约 6 级 → 能走</text>
  <text x="420" y="470" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="11.5">常见天花板：最低做到 5% 上下</text>

  <!-- 16位 -->
  <rect x="34" y="496" width="612" height="46" rx="8" fill="#101f38" stroke="#2f5a3c" stroke-width="1.2"/>
  <text x="52" y="524" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700">16 位</text>
  <text x="106" y="524" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">65536 级</text>
  <rect x="200" y="510" width="230" height="18" rx="2" fill="url(#bar16)"/>
  <text x="440" y="524" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="12">约 92 级</text>
  <text x="520" y="524" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="11.5">受时序与芯片上限约束</text>

  <text x="34" y="572" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="11.5">想把最低压到 1% 以下，主流做法不是堆位深，是在低段单独给一张更密的映射表</text>
</svg>
