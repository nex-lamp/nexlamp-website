    <text x="20" y="68" font-size="9" fill="#64748b">CONTROL</text>
    <text x="140" y="68" font-size="9" fill="#fbbf24" text-anchor="end">MANUAL SWITCH</text>
    <text x="20" y="84" font-size="9" fill="#64748b">DIMMING</text>
    <text x="140" y="84" font-size="9" fill="#fbbf24" text-anchor="end">FIXED 100%</text>
    <text x="20" y="100" font-size="9" fill="#64748b">EFFICIENCY</text>
    <text x="140" y="100" font-size="9" fill="#fbbf24" text-anchor="end">0% SAVINGS</text>
