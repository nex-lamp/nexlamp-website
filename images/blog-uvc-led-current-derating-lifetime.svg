<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="dcbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="1"/>
      <stop offset="100%" stop-color="#008855" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="pwmbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#aa6600" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="420" fill="url(#bg2)"/>
  <g opacity="0.06" stroke="#2d5a8e" stroke-width="0.5">
    <line x1="0" y1="60" x2="680" y2="60"/>
    <line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
  </g>

  <text x="340" y="30" text-anchor="middle" fill="#e8e8e8" font-family="monospace" font-size="15" font-weight="bold">电流降额对UVC LED寿命的影响 (MDPI 2026)</text>
  <text x="340" y="48" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="10">260nm AlGaN UVC LED | Ts=60°C</text>

  <!-- Y axis label -->
  <text x="30" y="100" fill="#8aa0b8" font-family="monospace" font-size="10" transform="rotate(-90,30,100)">L70 寿命 (hours)</text>

  <!-- Chart area background -->
  <rect x="80" y="70" width="500" height="300" fill="none" stroke="#1a3a5c" stroke-width="1"/>

  <!-- Bars: 4 scenarios -->
  <!-- 150mA nominal -->
  <text x="130" y="90" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="10">150mA</text>
  <text x="130" y="102" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="8">额定</text>
  <rect x="100" y="320" width="60" height="50" fill="#ff6b6b" opacity="0.7" rx="3"/>
  <text x="130" y="315" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11" font-weight="bold">~8k h</text>

  <!-- 120mA derate 20% -->
  <text x="240" y="90" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="10">120mA</text>
  <text x="240" y="102" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="8">降额20%</text>
  <rect x="210" y="220" width="60" height="150" fill="url(#pwmbar)" rx="3"/>
  <text x="240" y="215" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="11" font-weight="bold">~18k h</text>
  <text x="240" y="390" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10" font-weight="bold">2.25x</text>

  <!-- 100mA derate 33% -->
  <text x="350" y="90" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10">100mA</text>
  <text x="350" y="102" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="8">降额33%</text>
  <rect x="320" y="170" width="60" height="200" fill="#00d4ff" opacity="0.6" rx="3"/>
  <text x="350" y="165" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">~25k h</text>
  <text x="350" y="390" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10" font-weight="bold">3.1x</text>

  <!-- 90mA derate 40% -->
  <text x="460" y="90" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10">90mA</text>
  <text x="460" y="102" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="8">降额40%</text>
  <rect x="430" y="120" width="60" height="250" fill="url(#dcbar)" rx="3" filter="url(#glow2)"/>
  <text x="460" y="115" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11" font-weight="bold">~32k h</text>
  <text x="460" y="390" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10" font-weight="bold">4.0x</text>

  <!-- Key finding callout -->
  <rect x="520" y="140" width="140" height="90" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="4,2" rx="6"/>
  <text x="590" y="160" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10" font-weight="bold">关键发现</text>
  <text x="528" y="178" fill="#8aa0b8" font-family="monospace" font-size="9">降额20-40%</text>
  <text x="528" y="192" fill="#8aa0b8" font-family="monospace" font-size="9">L70寿命 x4+</text>
  <text x="528" y="206" fill="#8aa0b8" font-family="monospace" font-size="9">累计杀菌能量 x3+</text>
  <text x="528" y="220" fill="#8aa0b8" font-family="monospace" font-size="9">非线性幂律关系</text>

  <!-- X axis -->
  <line x1="80" y1="370" x2="580" y2="370" stroke="#2d5a8e" stroke-width="1"/>
  <text x="340" y="412" text-anchor="middle" fill="#3d5a80" font-family="monospace" font-size="8">Source: MDPI Applied Sciences 16(1) 483, 2026 | NEXLAMP Analysis</text>
</svg>
