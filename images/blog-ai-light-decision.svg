<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%"><stop offset="0%" stop-color="#0d1f3c"/><stop offset="100%" stop-color="#0a1628"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="550" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#1a2a4a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="55" x2="800" y2="55"/><line x1="0" y1="110" x2="800" y2="110"/><line x1="0" y1="165" x2="800" y2="165"/><line x1="0" y1="220" x2="800" y2="220"/><line x1="0" y1="275" x2="800" y2="275"/><line x1="0" y1="330" x2="800" y2="330"/><line x1="0" y1="385" x2="800" y2="385"/><line x1="0" y1="440" x2="800" y2="440"/><line x1="0" y1="495" x2="800" y2="495"/>
    <line x1="200" y1="0" x2="200" y2="550"/><line x1="400" y1="0" x2="400" y2="550"/><line x1="600" y1="0" x2="600" y2="550"/>
  </g>
  <text x="400" y="35" text-anchor="middle" fill="#00d4aa" font-family="monospace" font-size="18" font-weight="bold" filter="url(#glow)">AI氛围灯选购决策流程</text>
  <!-- Start node -->
  <rect x="285" y="65" width="230" height="48" rx="24" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="94" text-anchor="middle" fill="#00d4aa" font-family="monospace" font-size="14" font-weight="bold">START · 选购AI氛围灯</text>
  <!-- Arrow down -->
  <line x1="400" y1="113" x2="400" y2="138" stroke="#5a7aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5a7aaa"/></marker></defs>
  <!-- Q1 -->
  <rect x="260" y="140" width="280" height="48" rx="6" fill="none" stroke="#ff9800" stroke-width="1.5"/>
  <text x="400" y="160" text-anchor="middle" fill="#ff9800" font-family="monospace" font-size="13">Q1: 家里有几盏智能灯？</text>
  <text x="400" y="178" text-anchor="middle" fill="#5a7aaa" font-family="monospace" font-size="10">规划中的也算</text>
  <!-- Branch 1.1 -->
  <line x1="180" y1="188" x2="180" y2="215" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100" y="208" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="10">≤ 3盏</text>
  <!-- Branch 1.2 -->
  <line x1="620" y1="188" x2="620" y2="215" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="208" text-anchor="middle" fill="#00d4aa" font-family="monospace" font-size="10">&gt; 3盏</text>
  <!-- Q2 left -->
  <rect x="45" y="218" width="270" height="48" rx="6" fill="none" stroke="#ff9800" stroke-width="1.5"/>
  <text x="180" y="238" text-anchor="middle" fill="#ff9800" font-family="monospace" font-size="13">Q2: 需要断网后仍能联动？</text>
  <text x="180" y="256" text-anchor="middle" fill="#5a7aaa" font-family="monospace" font-size="10">路由器挂了灯还能场景联动</text>
  <!-- Q2 right -->
  <rect x="485" y="218" width="270" height="48" rx="6" fill="none" stroke="#ff9800" stroke-width="1.5"/>
  <text x="620" y="238" text-anchor="middle" fill="#ff9800" font-family="monospace" font-size="13">Q2: 已有哪个智能音箱？</text>
  <text x="620" y="256" text-anchor="middle" fill="#5a7aaa" font-family="monospace" font-size="10">小爱 / 天猫 / HomePod / 无</text>
  <!-- Results left - Yes -->
  <line x1="100" y1="266" x2="100" y2="295" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="55" y="285" fill="#7ec27e" font-family="monospace" font-size="9">需要→</text>
  <rect x="30" y="298" width="140" height="55" rx="8" fill="#00d4aa" opacity="0.12" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="100" y="320" text-anchor="middle" fill="#00d4aa" font-family="monospace" font-size="12" font-weight="bold">Zigbee 灯</text>
  <text x="100" y="340" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="9">+ 小米/涂鸦网关</text>
  <!-- Results left - No -->
  <line x1="260" y1="266" x2="260" y2="295" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="285" fill="#5a7aaa" font-family="monospace" font-size="9">不需要→</text>
  <rect x="210" y="298" width="140" height="55" rx="8" fill="#7ec27e" opacity="0.12" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="280" y="320" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="12" font-weight="bold">WiFi 灯</text>
  <text x="280" y="340" text-anchor="middle" fill="#5a7aaa" font-family="monospace" font-size="9">或 BLE Mesh 灯</text>
  <!-- Results right -->
  <line x1="530" y1="266" x2="530" y2="295" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="298" width="200" height="55" rx="8" fill="#00d4aa" opacity="0.1" stroke="#00d4aa" stroke-width="1"/>
  <text x="530" y="318" text-anchor="middle" fill="#00d4aa" font-family="monospace" font-size="11">Zigbee 3.0 灯</text>
  <text x="530" y="338" text-anchor="middle" fill="#5a7aaa" font-family="monospace" font-size="9">首选 带网关全屋联动</text>
  <!-- Final checklist -->
  <rect x="80" y="385" width="640" height="145" rx="8" fill="#0a0f1a" opacity="0.9" stroke="#1a2a4a" stroke-width="1"/>
  <text x="400" y="412" text-anchor="middle" fill="#00d4aa" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">✅ 最终检查清单</text>
  <text x="120" y="442" fill="#7ec27e" font-family="monospace" font-size="11">[ ] 驱动标注"无频闪"且有 CE/ETL 认证</text>
  <text x="120" y="462" fill="#7ec27e" font-family="monospace" font-size="11">[ ] 协议匹配使用场景（WiFi ≤3灯 / Zigbee 全屋）</text>
  <text x="120" y="482" fill="#7ec27e" font-family="monospace" font-size="11">[ ] 明确标注兼容语音平台（小米/天猫/HomeKit）</text>
  <text x="120" y="502" fill="#7ec27e" font-family="monospace" font-size="11">[ ] 显色指数 Ra≥90，支持深度调光</text>
  <text x="400" y="522" text-anchor="middle" fill="#5a7aaa" font-family="monospace" font-size="10">驱动 &gt; 协议 &gt; 生态 &gt; 外观 — 按照这个顺序选，买到的灯不会差</text>
</svg>