<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7ec27e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b8c5a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a5a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  <rect width="680" height="400" fill="url(#grid)"/>

  <!-- Title -->
  <text x="340" y="45" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="2">频闪从哪里来？</text>
  <text x="340" y="70" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#8ba3c7">稳定电流 vs 波动电流，决定LED是稳亮还是频闪</text>

  <!-- Left panel: Stable current -->
  <rect x="50" y="100" width="280" height="260" rx="12" fill="#0f2744" stroke="#1a4a7a" stroke-width="1.5" opacity="0.9"/>
  <text x="190" y="130" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#7ec27e">稳定直流驱动</text>

  <!-- Stable wave -->
  <path d="M 80 200 L 260 200" stroke="#7ec27e" stroke-width="3" fill="none" filter="url(#glow)"/>
  <text x="170" y="190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7ec27e">恒定电流输出</text>

  <!-- LED icon stable -->
  <g transform="translate(170, 240)">
    <circle cx="0" cy="0" r="25" fill="#1a3a5c" stroke="#7ec27e" stroke-width="2"/>
    <path d="M -8 -5 L 0 -15 L 8 -5" fill="none" stroke="#7ec27e" stroke-width="2"/>
    <path d="M -8 5 L 0 -5 L 8 5" fill="none" stroke="#7ec27e" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#7ec27e" filter="url(#glow)"/>
  </g>
  <text x="170" y="290" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">LED 持续稳定发光</text>
  <text x="170" y="310" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">人眼舒适，手机拍照无波纹</text>

  <!-- Right panel: Flickering current -->
  <rect x="350" y="100" width="280" height="260" rx="12" fill="#0f2744" stroke="#7a2a2a" stroke-width="1.5" opacity="0.9"/>
  <text x="490" y="130" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#ff6b6b">波动电流驱动</text>

  <!-- Flickering wave -->
  <path d="M 380 200 L 400 200 L 400 170 L 420 170 L 420 230 L 440 230 L 440 170 L 460 170 L 460 230 L 480 230 L 480 170 L 500 170 L 500 230 L 520 230 L 520 200 L 540 200" stroke="#ff6b6b" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <text x="460" y="190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ff6b6b">电流周期性波动</text>

  <!-- LED icon flickering -->
  <g transform="translate(490, 240)">
    <circle cx="0" cy="0" r="25" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="2"/>
    <path d="M -8 -5 L 0 -15 L 8 -5" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <path d="M -8 5 L 0 -5 L 8 5" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#ff6b6b" opacity="0.6" filter="url(#glow)"/>
  </g>
  <text x="490" y="290" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">LED 亮度快速起伏</text>
  <text x="490" y="310" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">手机拍照出现黑色条纹</text>

  <!-- Arrow between panels -->
  <path d="M 340 220 L 350 220" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Bottom note -->
  <text x="340" y="380" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#8ba3c7">驱动电源输出质量，直接决定人眼感受和拍摄效果</text>
</svg>