<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <radialGradient id="glowC" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="620" fill="#0a1628"/>
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.3">
    <path d="M0 80 H1000 M0 160 H1000 M0 240 H1000 M0 320 H1000 M0 400 H1000 M0 480 H1000 M0 560 H1000"/>
    <path d="M100 0 V620 M200 0 V620 M300 0 V620 M400 0 V620 M500 0 V620 M600 0 V620 M700 0 V620 M800 0 V620 M900 0 V620"/>
  </g>
  <circle cx="500" cy="300" r="290" fill="url(#glowC)"/>

  <text x="500" y="52" text-anchor="middle" fill="#e2f3ff" font-size="30" font-weight="bold">用法错了，贵两千也白搭</text>
  <text x="500" y="84" text-anchor="middle" fill="#7dd3fc" font-size="16">关掉主灯只用大路灯，是这类灯最常见的翻车方式</text>

  <!-- contrast bars -->
  <rect x="80" y="112" width="400" height="196" rx="10" fill="#101f33" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="104" y="146" fill="#7dd3fc" font-size="16" font-weight="bold">关主灯 · 只用大路灯</text>
  <rect x="104" y="168" width="352" height="38" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1"/>
  <text x="118" y="193" fill="#fecaca" font-size="14">桌面中心 ≈ 1500 lux</text>
  <rect x="104" y="216" width="26" height="38" rx="4" fill="#450a0a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="140" y="241" fill="#fca5a5" font-size="14">两三米外地板 ≈ 100 lux</text>
  <text x="104" y="288" fill="#f87171" font-size="14" font-weight="bold">低头抬头之间，瞳孔被迫高频收缩</text>

  <rect x="520" y="112" width="400" height="196" rx="10" fill="#0f2a1c" stroke="#4ade80" stroke-width="1.5"/>
  <text x="544" y="146" fill="#4ade80" font-size="16" font-weight="bold">主灯开着 · 大路灯补光</text>
  <rect x="544" y="168" width="120" height="38" rx="4" fill="#166534" stroke="#4ade80" stroke-width="1"/>
  <text x="558" y="193" fill="#bbf7d0" font-size="14">桌面 ≈ 800 lux</text>
  <rect x="544" y="216" width="96" height="38" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="654" y="241" fill="#bbf7d0" font-size="14">地板 ≈ 400 lux</text>
  <text x="544" y="288" fill="#4ade80" font-size="14" font-weight="bold">明暗差拉平，眼睛才不用来回调</text>

  <text x="500" y="342" text-anchor="middle" fill="#e2f3ff" font-size="15" font-weight="bold">大路灯是「补光」，不是「替光」——上光源那一路别关</text>

  <!-- 4 actions -->
  <text x="80" y="392" fill="#7dd3fc" font-size="17" font-weight="bold">下单前四个动作</text>

  <g font-size="14">
    <rect x="80" y="408" width="200" height="96" rx="8" fill="#101f33" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="100" y="436" fill="#22d3ee" font-size="20" font-weight="bold">01</text>
    <text x="100" y="462" fill="#e2f3ff" font-weight="bold">桌子最高档试灯</text>
    <text x="100" y="486" fill="#8fa8bf" font-size="12">抬头不见亮点才算过</text>

    <rect x="296" y="408" width="200" height="96" rx="8" fill="#101f33" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="316" y="436" fill="#22d3ee" font-size="20" font-weight="bold">02</text>
    <text x="316" y="462" fill="#e2f3ff" font-weight="bold">把斜板立起来试</text>
    <text x="316" y="486" fill="#8fa8bf" font-size="12">反射角全变，眩光怼眼睛</text>

    <rect x="512" y="408" width="200" height="96" rx="8" fill="#101f33" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="532" y="436" fill="#22d3ee" font-size="20" font-weight="bold">03</text>
    <text x="532" y="462" fill="#e2f3ff" font-weight="bold">问换灯头多少钱</text>
    <text x="532" y="486" fill="#8fa8bf" font-size="12">换灯盘可能一千五</text>

    <rect x="728" y="408" width="192" height="96" rx="8" fill="#101f33" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="748" y="436" fill="#22d3ee" font-size="20" font-weight="bold">04</text>
    <text x="748" y="462" fill="#e2f3ff" font-weight="bold">截图留证</text>
    <text x="748" y="486" fill="#8fa8bf" font-size="12">「预防近视」话术不合规</text>
  </g>

  <!-- structural warning -->
  <rect x="80" y="524" width="840" height="52" rx="8" fill="#2a1a0d" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="104" y="556" fill="#fde68a" font-size="14">还有一条：机身近 1.8 米、重心偏上。6° 倾斜不倒，15° 有风险 —— 装好一定靠墙或靠柜，别买底座偷轻的。</text>

  <text x="500" y="602" text-anchor="middle" fill="#475569" font-size="12">NEXLAMP · nexlamp.com</text>
</svg>
