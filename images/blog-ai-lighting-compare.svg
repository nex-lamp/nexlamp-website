<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="680" height="400" fill="url(#bg)"/>
  <rect width="680" height="400" fill="url(#grid)"/>

  <!-- Title -->
  <text x="340" y="38" text-anchor="middle" fill="#7ec8e3" font-size="16" font-weight="bold" font-family="sans-serif" filter="url(#glow)">传统智能灯 vs AI主动感知照明</text>
  <line x1="120" y1="48" x2="560" y2="48" stroke="#7ec8e3" stroke-width="0.5" opacity="0.4"/>

  <!-- Left: Traditional -->
  <rect x="30" y="65" width="295" height="320" rx="8" fill="#1a1030" stroke="#ff6b35" stroke-width="1" opacity="0.8"/>
  <text x="177" y="95" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="bold" font-family="sans-serif" filter="url(#glow)">❌ 传统智能灯</text>
  <text x="177" y="115" text-anchor="middle" fill="#6a7a9a" font-size="10" font-family="monospace">"电子遥控器模式"</text>

  <!-- Traditional flow -->
  <rect x="55" y="135" width="245" height="35" rx="4" fill="#2a1a3a" stroke="#ff6b35" stroke-width="0.5" opacity="0.6"/>
  <text x="177" y="157" text-anchor="middle" fill="#cc8844" font-size="11" font-family="sans-serif">🗣 你喊"打开客厅灯"</text>

  <text x="177" y="190" text-anchor="middle" fill="#5a6a8a" font-size="16">↓</text>

  <rect x="55" y="200" width="245" height="35" rx="4" fill="#2a1a3a" stroke="#ff6b35" stroke-width="0.5" opacity="0.6"/>
  <text x="177" y="222" text-anchor="middle" fill="#cc8844" font-size="11" font-family="sans-serif">📱 语音助手识别→执行</text>

  <text x="177" y="255" text-anchor="middle" fill="#5a6a8a" font-size="16">↓</text>

  <rect x="55" y="265" width="245" height="35" rx="4" fill="#2a1a3a" stroke="#ff6b35" stroke-width="0.5" opacity="0.6"/>
  <text x="177" y="287" text-anchor="middle" fill="#cc8844" font-size="11" font-family="sans-serif">💡 灯光切换</text>

  <!-- Traditional pain points -->
  <g transform="translate(55, 315)">
    <text x="0" y="12" fill="#ff6b35" font-size="10" font-family="sans-serif">⚠ 痛点：</text>
    <text x="0" y="28" fill="#7a6a8a" font-size="9" font-family="monospace">· 必须出声或掏手机</text>
    <text x="0" y="42" fill="#7a6a8a" font-size="9" font-family="monospace">· 掉线=全废</text>
    <text x="0" y="56" fill="#7a6a8a" font-size="9" font-family="monospace">· 不会预判你的需求</text>
  </g>

  <!-- Center divider -->
  <text x="340" y="200" text-anchor="middle" fill="#5a6a8a" font-size="20">VS</text>

  <!-- Right: AI -->
  <rect x="355" y="65" width="295" height="320" rx="8" fill="#102830" stroke="#00d4aa" stroke-width="1" opacity="0.8"/>
  <text x="502" y="95" text-anchor="middle" fill="#00d4aa" font-size="14" font-weight="bold" font-family="sans-serif" filter="url(#glow)">✅ AI主动感知照明</text>
  <text x="502" y="115" text-anchor="middle" fill="#6a7a9a" font-size="10" font-family="monospace">"灯主动适应人"</text>

  <!-- AI flow -->
  <rect x="380" y="135" width="245" height="35" rx="4" fill="#1a2a2a" stroke="#00d4aa" stroke-width="0.5" opacity="0.6"/>
  <text x="502" y="157" text-anchor="middle" fill="#44ccaa" font-size="11" font-family="sans-serif">📡 毫米波雷达感知位置</text>

  <text x="502" y="190" text-anchor="middle" fill="#5a6a8a" font-size="16">↓</text>

  <rect x="380" y="200" width="245" height="35" rx="4" fill="#1a2a2a" stroke="#00d4aa" stroke-width="0.5" opacity="0.6"/>
  <text x="502" y="222" text-anchor="middle" fill="#44ccaa" font-size="11" font-family="sans-serif">🧠 AI判断场景&amp;自动决策</text>

  <text x="502" y="255" text-anchor="middle" fill="#5a6a8a" font-size="16">↓</text>

  <rect x="380" y="265" width="245" height="35" rx="4" fill="#1a2a2a" stroke="#00d4aa" stroke-width="0.5" opacity="0.6"/>
  <text x="502" y="287" text-anchor="middle" fill="#44ccaa" font-size="11" font-family="sans-serif">💡 灯光自适应切换</text>

  <!-- AI advantages -->
  <g transform="translate(380, 315)">
    <text x="0" y="12" fill="#00d4aa" font-size="10" font-family="sans-serif">✓ 优势：</text>
    <text x="0" y="28" fill="#5a8a7a" font-size="9" font-family="monospace">· 零操作，走进即亮</text>
    <text x="0" y="42" fill="#5a8a7a" font-size="9" font-family="monospace">· 断网仍可本地运行</text>
    <text x="0" y="56" fill="#5a8a7a" font-size="9" font-family="monospace">· 学习作息，预判需求</text>
  </g>

  <!-- Signal bars bottom -->
  <g transform="translate(230, 385)">
    <text x="0" y="8" fill="#5a6a8a" font-size="8" font-family="monospace">成本高 · 体验差 · 掉线焦虑</text>
  </g>
  <g transform="translate(450, 385)">
    <text x="0" y="8" fill="#5a6a8a" font-size="8" font-family="monospace">百元级 · 零操作 · 稳定可靠</text>
  </g>
</svg>