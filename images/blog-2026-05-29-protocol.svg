<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gradWifi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </linearGradient>
    <linearGradient id="gradZigbee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#008866"/>
    </linearGradient>
    <linearGradient id="gradBLE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
    <linearGradient id="gradMatter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="680" height="420" fill="#0a1628"/>
  <rect width="680" height="420" fill="url(#grid)" opacity="0.3"/>

  <text x="20" y="34" fill="#00ff88" font-family="Courier New,monospace" font-size="12" filter="url(#glow)">┌─ Protocol Comparison ──────────────────────────────────────────────┐</text>
  <text x="20" y="50" fill="#00ff88" font-family="Courier New,monospace" font-size="12" filter="url(#glow)">│  Smart Lighting Communication Protocols                           │</text>

  <!-- WiFi Card -->
  <rect x="30" y="70" width="145" height="200" rx="6" fill="#0d1f3c" stroke="#ff6b35" stroke-width="1.5" opacity="0.9"/>
  <rect x="30" y="70" width="145" height="32" rx="6" fill="url(#gradWifi)" opacity="0.3"/>
  <text x="102" y="91" fill="#ff6b35" font-family="Consolas,monospace" font-size="14" text-anchor="middle" font-weight="bold">WiFi Direct</text>
  <text x="42" y="120" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">📶 2.4GHz 直连</text>
  <text x="42" y="138" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">📱 APP直控</text>
  <line x1="42" y1="148" x2="160" y2="148" stroke="#1a2a4a" stroke-width="0.5"/>
  <text x="42" y="165" fill="#ff6b35" font-family="Arial,sans-serif" font-size="10">⚠ 路由器过载</text>
  <text x="42" y="183" fill="#ff6b35" font-family="Arial,sans-serif" font-size="10">⚠ 信号盲区</text>
  <text x="42" y="201" fill="#ff6b35" font-family="Arial,sans-serif" font-size="10">⚠ 2.4G拥堵</text>
  <line x1="42" y1="211" x2="160" y2="211" stroke="#1a2a4a" stroke-width="0.5"/>
  <text x="42" y="228" fill="#00d4aa" font-family="Arial,sans-serif" font-size="10">✓ 安装简单</text>
  <text x="42" y="246" fill="#00d4aa" font-family="Arial,sans-serif" font-size="10">✓ 无需网关</text>
  <text x="42" y="264" fill="#ff8c55" font-family="Arial,sans-serif" font-size="9">建议：&amp;lt;10个设备</text>

  <!-- Zigbee Card -->
  <rect x="195" y="70" width="145" height="200" rx="6" fill="#0d1f3c" stroke="#00d4aa" stroke-width="2" opacity="0.9"/>
  <rect x="195" y="70" width="145" height="32" rx="6" fill="url(#gradZigbee)" opacity="0.3"/>
  <text x="267" y="91" fill="#00d4aa" font-family="Consolas,monospace" font-size="14" text-anchor="middle" font-weight="bold" filter="url(#glow)">Zigbee ★</text>
  <text x="207" y="120" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">🕸 网状网络</text>
  <text x="207" y="138" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">🏠 网关协调</text>
