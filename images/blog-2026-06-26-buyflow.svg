<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1f3a"/>
    </linearGradient>
    <linearGradient id="stepActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0088aa"/>
    </linearGradient>
    <linearGradient id="stepCheck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#008844"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00e5ff" flood-opacity="0.25"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="10" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="monospace" font-size="22" fill="#00e5ff" font-weight="bold">SMART LIGHT BUYING DECISION FLOW</text>
  <text x="400" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a7a9a">2026智能灯选购决策流程 — 跟着走，不踩坑</text>

  <!-- Step 1: Ra >= 90 -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0d1f3c" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="0" y="0" width="6" height="55" rx="3" fill="url(#stepActive)"/>
    <text x="20" y="22" font-family="monospace" font-size="12" fill="#00e5ff" font-weight="bold">STEP 1</text>
    <text x="20" y="42" font-family="monospace" font-size="13" fill="#fff">Ra ≥ 90 ?</text>
  </g>

  <!-- Step 1 bad arrow -->
  <g transform="translate(220, 107)">
    <path d="M 0 0 L 40 0" stroke="#ff1744" stroke-width="1.5" marker-end="url(#arrowDown)" transform="rotate(0)"/>
    <text x="5" y="-8" font-family="monospace" font-size="8" fill="#ff1744">NO → 淘汰</text>
  </g>

  <!-- Step 1 yes arrow -->
  <g transform="translate(140, 135)">
    <path d="M 0 0 L 0 25" stroke="#00e676" stroke-width="1.5"/>
    <text x="-30" y="18" font-family="monospace" font-size="8" fill="#00e676">YES ↓</text>
  </g>

  <!-- Step 2: Flicker -->
  <g transform="translate(250, 165)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0d1f3c" stroke="#7c4dff" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="6" height="55" rx="3" fill="#7c4dff"/>
    <text x="20" y="22" font-family="monospace" font-size="12" fill="#7c4dff" font-weight="bold">STEP 2</text>
    <text x="20" y="42" font-family="monospace" font-size="13" fill="#fff">频闪 &lt; 5% ?</text>
  </g>

  <!-- Step 2 bad -->
  <g transform="translate(410, 192)">
    <path d="M 0 0 L 35 0" stroke="#ff1744" stroke-width="1.5"/>
    <text x="5" y="-8" font-family="monospace" font-size="8" fill="#ff1744">NO → 淘汰</text>
  </g>

  <!-- Step 2 yes -->
  <g transform="translate(330, 220)">
    <path d="M 0 0 L 0 25" stroke="#00e676" stroke-width="1.5"/>
    <text x="-30" y="18" font-family="monospace" font-size="8" fill="#00e676">YES ↓</text>
  </g>

  <!-- Step 3: SDCM -->
  <g transform="translate(430, 165)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0d1f3c" stroke="#00e676" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="0" y="0" width="6" height="55" rx="3" fill="#00e676"/>
    <text x="20" y="22" font-family="monospace" font-size="12" fill="#00e676" font-weight="bold">STEP 3</text>
    <text x="20" y="42" font-family="monospace" font-size="13" fill="#fff">SDCM ≤ 3 ?</text>
  </g>

  <!-- Step 3 bad -->
  <g transform="translate(590, 192)">
    <path d="M 0 0 L 35 0" stroke="#ff1744" stroke-width="1.5"/>
    <text x="5" y="-8" font-family="monospace" font-size="8" fill="#ff1744">NO → 淘汰</text>
  </g>

  <!-- Step 3 yes -->
  <g transform="translate(510, 220)">
    <path d="M 0 0 L 0 25" stroke="#00e676" stroke-width="1.5"/>
    <text x="-30" y="18" font-family="monospace" font-size="8" fill="#00e676">YES ↓</text>
  </g>

  <!-- Step 4: 驱动PF -->
  <g transform="translate(60, 250)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0d1f3c" stroke="#ff6d00" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="55" rx="3" fill="#ff6d00"/>
    <text x="20" y="22" font-family="monospace" font-size="12" fill="#ff6d00" font-weight="bold">STEP 4</text>
    <text x="20" y="42" font-family="monospace" font-size="13" fill="#fff">PF ≥ 0.9 ?</text>
  </g>

  <!-- Step 4 bad -->
  <g transform="translate(220, 277)">
    <path d="M 0 0 L 35 0" stroke="#ff1744" stroke-width="1.5"/>
    <text x="5" y="-8" font-family="monospace" font-size="8" fill="#ff1744">NO → 淘汰</text>
  </g>

  <!-- Step 4 yes -->
  <g transform="translate(140, 305)">
    <path d="M 0 0 L 0 25" stroke="#00e676" stroke-width="1.5"/>
    <text x="-30" y="18" font-family="monospace" font-size="8" fill="#00e676">YES ↓</text>
  </g>

  <!-- Step 5: 协议 -->
  <g transform="translate(250, 335)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#0d1f3c" stroke="#e040fb" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="0" y="0" width="6" height="55" rx="3" fill="#e040fb"/>
    <text x="20" y="22" font-family="monospace" font-size="12" fill="#e040fb" font-weight="bold">STEP 5</text>
    <text x="20" y="42" font-family="monospace" font-size="13" fill="#fff">Zigbee+Matter ?</text>
  </g>

  <!-- Step 5 bad -->
  <g transform="translate(410, 362)">
    <path d="M 0 0 L 35 0" stroke="#ff6d00" stroke-width="1.5"/>
    <text x="5" y="-8" font-family="monospace" font-size="8" fill="#ff6d00">考虑中 →</text>
  </g>

  <!-- Step 5 yes → PASS -->
  <g transform="translate(330, 390)">
    <path d="M 0 0 L 0 40" stroke="#00e676" stroke-width="2"/>
  </g>

  <!-- Final: PASS -->
  <g transform="translate(250, 435)">
    <rect x="0" y="0" width="300" height="50" rx="25" fill="#0d2a1a" stroke="#00e676" stroke-width="2"/>
    <text x="150" y="20" text-anchor="middle" font-family="monospace" font-size="16" fill="#00e676" font-weight="bold">✅ 5/5 PASS → 值得买</text>
    <text x="150" y="40" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a7a9a">没有短板的灯，才是好灯</text>
  </g>

  <!-- Bottom legend -->
  <g transform="translate(580, 250)">
    <rect x="0" y="0" width="180" height="200" rx="8" fill="#0d1f3c" stroke="#1a2a4a" stroke-width="1"/>
    <text x="90" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a7a9a">淘汰规则</text>
    <text x="15" y="55" font-family="monospace" font-size="10" fill="#ff5252">← 任一不通过 → 不考虑</text>
    <text x="15" y="80" font-family="monospace" font-size="10" fill="#ff6d00">← 协议可放宽</text>
    <line x1="10" y1="95" x2="170" y2="95" stroke="#1a2a4a" stroke-width="0.5"/>
    <text x="90" y="120" text-anchor="middle" font-family="monospace" font-size="10" fill="#00e676">全部通过 = 闭眼入</text>
    <text x="90" y="140" text-anchor="middle" font-family="monospace" font-size="10" fill="#00e5ff">通过4项 = 可考虑</text>
    <text x="90" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff6d00">3项以下 = 绕路走</text>
    <text x="90" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a7a9a">核心底线:</text>
    <text x="90" y="200" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff5252">Ra &amp; 频闪不可妥协</text>
  </g>
</svg>
