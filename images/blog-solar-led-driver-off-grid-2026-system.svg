<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7ec27e"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Terminal window -->
  <rect x="30" y="25" width="840" height="470" rx="8" fill="#0c1d2e" stroke="#2478c2" stroke-width="1.5" opacity="0.9"/>
  <rect x="30" y="25" width="840" height="36" rx="8" fill="#142a42" stroke="#2478c2" stroke-width="1.5"/>
  <circle cx="56" cy="43" r="6" fill="#ff5f56"/>
  <circle cx="78" cy="43" r="6" fill="#ffbd2e"/>
  <circle cx="100" cy="43" r="6" fill="#27c93f"/>
  <text x="450" y="49" font-family="Consolas, monospace" font-size="14" fill="#7ec27e" text-anchor="middle" font-weight="bold">root@nexlamp:~# solar_system --visualize</text>

  <!-- Title -->
  <text x="450" y="100" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold" filter="url(#glow)">太阳能LED照明系统：四大件协同作战</text>

  <!-- Solar panel -->
  <g transform="translate(70, 150)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#142a42" stroke="#f4a261" stroke-width="2" filter="url(#glow)"/>
    <text x="80" y="30" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#f4a261" text-anchor="middle" font-weight="bold">光伏板</text>
    <path d="M20,45 L60,45 L40,105 Z" fill="none" stroke="#f4a261" stroke-width="2"/>
    <path d="M65,45 L105,45 L85,105 Z" fill="none" stroke="#f4a261" stroke-width="2"/>
    <path d="M110,45 L140,45 L130,95 L100,95 Z" fill="none" stroke="#f4a261" stroke-width="2"/>
    <text x="80" y="118" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">白天发电 · 电压波动</text>
  </g>

  <line x1="230" y1="210" x2="270" y2="210" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Battery -->
  <g transform="translate(270, 150)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#142a42" stroke="#7ec27e" stroke-width="2" filter="url(#glow)"/>
    <text x="80" y="30" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7ec27e" text-anchor="middle" font-weight="bold">储能电池</text>
    <rect x="35" y="50" width="90" height="45" rx="4" fill="none" stroke="#7ec27e" stroke-width="2"/>
    <rect x="45" y="42" width="70" height="8" rx="2" fill="#7ec27e"/>
    <text x="80" y="118" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">锂电/铅酸/磷酸铁锂</text>
  </g>

  <line x1="430" y1="210" x2="470" y2="210" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LED Driver -->
  <g transform="translate(470, 150)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#142a42" stroke="#64b5f6" stroke-width="2" filter="url(#glow)"/>
    <text x="80" y="30" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#64b5f6" text-anchor="middle" font-weight="bold">LED驱动电源</text>
    <text x="80" y="58" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">宽压输入 · 恒流输出</text>
    <text x="80" y="80" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">高效率 · 低纹波</text>
    <text x="80" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">防雷防水 · 调光接口</text>
  </g>

  <line x1="630" y1="210" x2="670" y2="210" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LED + Controller -->
  <g transform="translate(670, 150)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#142a42" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
    <text x="80" y="30" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#a78bfa" text-anchor="middle" font-weight="bold">灯具 + 控制器</text>
    <text x="80" y="58" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">光控/时控/人体感应</text>
    <text x="80" y="80" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">0-10V · PWM · DALI</text>
    <text x="80" y="102" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Zigbee · Matter</text>
  </g>

  <!-- Bottom detail cards -->
  <rect x="70" y="310" width="190" height="130" rx="8" fill="#1a3a5c" stroke="#2478c2" stroke-width="1"/>
  <text x="165" y="340" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#f4a261" text-anchor="middle" font-weight="bold">光伏板 → 电池</text>
  <text x="165" y="365" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">需要MPPT/PWM充电管理</text>
  <text x="165" y="385" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">防止过充、过放</text>
  <text x="165" y="405" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">输出电压随光照变化</text>
  <text x="165" y="425" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">12V系统约10V~13V</text>

  <rect x="300" y="310" width="300" height="130" rx="8" fill="#1a3a5c" stroke="#2478c2" stroke-width="1"/>
  <text x="450" y="340" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64b5f6" text-anchor="middle" font-weight="bold">电池 → LED驱动（核心环节）</text>
  <text x="450" y="365" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">输入电压宽：覆盖电池放电全程</text>
  <text x="450" y="385" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">恒流精度：±3%以内为佳</text>
  <text x="450" y="405" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">转换效率：≥90%延长续航</text>
  <text x="450" y="425" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">防护等级：IP66 + 6kV浪涌</text>

  <rect x="640" y="310" width="190" height="130" rx="8" fill="#1a3a5c" stroke="#2478c2" stroke-width="1"/>
  <text x="735" y="340" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="bold">驱动 → 灯具</text>
  <text x="735" y="365" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">稳定恒流输出</text>
  <text x="735" y="385" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">支持分时段调光</text>
  <text x="735" y="405" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">低亮度无频闪</text>
  <text x="735" y="425" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0" text-anchor="middle">协议匹配控制器</text>
</svg>