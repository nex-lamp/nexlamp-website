<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="block1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2478C2"/>
      <stop offset="100%" stop-color="#1a5a9a"/>
    </linearGradient>
    <linearGradient id="block2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E85D3A"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="block3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#D68910"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1a2a45" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="80" x2="200" y2="480"/>
    <line x1="400" y1="80" x2="400" y2="480"/>
    <line x1="600" y1="80" x2="600" y2="480"/>
  </g>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#4AA3E8" font-family="Arial" font-size="20" font-weight="bold" filter="url(#glow)">智能灯"关着"时，电力去哪儿了？</text>

  <!-- Central: Smart Bulb icon -->
  <rect x="310" y="225" width="180" height="80" rx="12" fill="none" stroke="#4AA3E8" stroke-width="2" filter="url(#glow)" opacity="0.6"/>

  <!-- Block 1: Radio Module -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="220" height="100" rx="10" fill="url(#block1)" opacity="0.9"/>
    <text x="160" y="130" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="bold">📡 通信模块</text>
    <text x="160" y="152" text-anchor="middle" fill="#ddeeff" font-family="Arial" font-size="12">Zigbee: 0.1~0.3W</text>
    <text x="160" y="172" text-anchor="middle" fill="#ddeeff" font-family="Arial" font-size="12">Wi-Fi: 0.5~1.5W</text>
    <text x="160" y="192" text-anchor="middle" fill="#aaccee" font-family="Arial" font-size="11">保持联网，随时接收指令</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="270" y1="150" x2="310" y2="230" stroke="#4AA3E8" stroke-width="2" opacity="0.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#4AA3E8"/>
    </marker>
  </defs>

  <!-- Block 2: Driver Aux -->
  <g filter="url(#shadow)">
    <rect x="530" y="100" width="220" height="100" rx="10" fill="url(#block2)" opacity="0.9"/>
    <text x="640" y="130" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="bold">⚡ 驱动辅助电源</text>
    <text x="640" y="152" text-anchor="middle" fill="#ffeedd" font-family="Arial" font-size="12">隔离方案: 0.05~0.15W</text>
    <text x="640" y="172" text-anchor="middle" fill="#ffeedd" font-family="Arial" font-size="12">非隔离/TRIAC: 0.3~2W</text>
    <text x="640" y="192" text-anchor="middle" fill="#ffccaa" font-family="Arial" font-size="11">给MCU &amp; 射频芯片持续供电</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="530" y1="150" x2="490" y2="230" stroke="#E85D3A" stroke-width="2" opacity="0.5" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#E85D3A"/>
    </marker>
  </defs>

  <!-- Block 3: Indicators &amp; Sensors -->
  <g filter="url(#shadow)">
    <rect x="50" y="350" width="220" height="100" rx="10" fill="url(#block3)" opacity="0.9"/>
    <text x="160" y="380" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="bold">🔴 指示灯/传感器</text>
    <text x="160" y="402" text-anchor="middle" fill="#fff8dd" font-family="Arial" font-size="12">状态LED: 0.05~0.2W/个</text>
    <text x="160" y="422" text-anchor="middle" fill="#fff8dd" font-family="Arial" font-size="12">常亮屏控面板: 3~5W</text>
    <text x="160" y="442" text-anchor="middle" fill="#eedd99" font-family="Arial" font-size="11">美观的代价，别小看</text>
  </g>

  <!-- Warning box -->
  <rect x="530" y="340" width="230" height="120" rx="8" fill="#1a0a0a" stroke="#E74C3C" stroke-width="1.5" opacity="0.9"/>
  <text x="645" y="368" text-anchor="middle" fill="#E74C3C" font-family="Arial" font-size="14" font-weight="bold">⚠️ 容易被忽视的坑</text>
  <text x="645" y="392" text-anchor="middle" fill="#ffcccc" font-family="Arial" font-size="11">可控硅兼容电路额外耗电</text>
  <text x="645" y="412" text-anchor="middle" fill="#ffcccc" font-family="Arial" font-size="11">0.5~2W — 比通信模块还高</text>
  <text x="645" y="432" text-anchor="middle" fill="#ffaaaa" font-family="Arial" font-size="11">严重时出现"鬼火"现象</text>
  <text x="645" y="452" text-anchor="middle" fill="#ffaaaa" font-family="Arial" font-size="11">关了灯还有微弱的光</text>

  <!-- Source -->
  <text x="780" y="490" text-anchor="end" fill="#445566" font-family="Arial" font-size="10">NEXLAMP · 智能照明驱动方案</text>
</svg>