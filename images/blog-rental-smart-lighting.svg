      <text x="90" y="12" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="500">成本</text>
      <text x="160" y="12" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="500">难度</text>
      <text x="220" y="12" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="500">适合谁</text>
      <text x="330" y="12" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="500">核心优势</text>
      <text x="520" y="12" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="500">评分</text>
