  <text x="537" y="183" fill="#c084fc" font-family="Arial,sans-serif" font-size="10">✓ 未来标准</text>
  <text x="537" y="201" fill="#ff8c55" font-family="Arial,sans-serif" font-size="10">⚠ 生态早期</text>
  <line x1="537" y1="211" x2="645" y2="211" stroke="#1a2a4a" stroke-width="0.5"/>
  <text x="537" y="228" fill="#ff8c55" font-family="Arial,sans-serif" font-size="10">⚠ 设备少</text>
  <text x="537" y="246" fill="#ff8c55" font-family="Arial,sans-serif" font-size="10">⚠ 兼容差</text>
  <text x="537" y="264" fill="#8899aa" font-family="Arial,sans-serif" font-size="9">观望：2027+</text>

  <text x="20" y="310" fill="#00ff88" font-family="Courier New,monospace" font-size="12" filter="url(#glow)">└────────────────────────────────────────────────────────────────────┘</text>

  <text x="340" y="340" fill="#4da6ff" font-family="Courier New,monospace" font-size="11" text-anchor="middle">QUICK TIP: 中大户首选 Zigbee | WiFi仅限小户型 &amp;lt;10灯 | BLE看生态 | Matter 观望</text>

  <text x="340" y="370" fill="#ff4444" font-family="Consolas,monospace" font-size="12" text-anchor="middle" filter="url(#glowStrong)">▶ 掉线修复口诀：先查电源 → 再看位置 → 固定信道 → 加中继 → 更新固件</text>

  <text x="340" y="400" fill="#556677" font-family="Courier New,monospace" font-size="9" text-anchor="middle">nexlamp.com — Smart Lighting Protocol Guide</text>
</svg>
