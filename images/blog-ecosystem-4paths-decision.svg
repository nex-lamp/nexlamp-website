<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <pattern id="grid3b" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#173252" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>
  <rect width="1200" height="675" fill="url(#grid3b)"/>
  <ellipse cx="600" cy="120" rx="380" ry="110" fill="#a78bfa" opacity="0.10" filter="url(#soft3)"/>

  <text x="64" y="88" fill="#e6f2ff" font-size="38" font-weight="700">四条打通路线，四种代价</text>
  <text x="64" y="128" fill="#7ea6c9" font-size="20">没有免费的互通，只有你能接受的那种代价</text>
  <rect x="64" y="148" width="86" height="4" rx="2" fill="#a78bfa"/>

  <!-- Card A -->
  <rect x="64" y="192" width="250" height="330" rx="16" fill="#0d2136" stroke="#1e4a6e" stroke-width="2"/>
  <rect x="64" y="192" width="250" height="56" rx="16" fill="#123a5c"/>
  <rect x="64" y="224" width="250" height="24" fill="#123a5c"/>
  <text x="189" y="228" fill="#8ee3ff" font-size="21" font-weight="700" text-anchor="middle">A 统一生态</text>
  <text x="88" y="288" fill="#9fc4e0" font-size="17">换灯、只留一个牌子</text>
  <text x="88" y="336" fill="#7ea6c9" font-size="15">成本</text>
  <rect x="88" y="348" width="202" height="12" rx="6" fill="#14304a"/>
  <rect x="88" y="348" width="202" height="12" rx="6" fill="#f87171"/>
  <text x="88" y="392" fill="#f8a5a5" font-size="16">最高</text>
  <text x="88" y="450" fill="#cfe6fa" font-size="16">代价</text>
  <text x="88" y="478" fill="#9fc4e0" font-size="15">灯 + 人工全换</text>
  <text x="88" y="500" fill="#9fc4e0" font-size="15">只适合在装修</text>

  <!-- Card B -->
  <rect x="338" y="192" width="250" height="330" rx="16" fill="#0d2136" stroke="#1e4a6e" stroke-width="2"/>
  <rect x="338" y="192" width="250" height="56" rx="16" fill="#123a5c"/>
  <rect x="338" y="224" width="250" height="24" fill="#123a5c"/>
  <text x="463" y="228" fill="#8ee3ff" font-size="21" font-weight="700" text-anchor="middle">B 网关桥接</text>
  <text x="362" y="288" fill="#9fc4e0" font-size="17">挂到多模网关下</text>
  <text x="362" y="336" fill="#7ea6c9" font-size="15">成本</text>
  <rect x="362" y="348" width="202" height="12" rx="6" fill="#14304a"/>
  <rect x="362" y="348" width="122" height="12" rx="6" fill="#fbbf24"/>
  <text x="362" y="392" fill="#fcd34d" font-size="16">中</text>
  <text x="362" y="450" fill="#cfe6fa" font-size="16">代价</text>
  <text x="362" y="478" fill="#9fc4e0" font-size="15">兼容有上限</text>
  <text x="362" y="500" fill="#9fc4e0" font-size="15">功能常被翻译丢失</text>

  <!-- Card C -->
  <rect x="612" y="192" width="250" height="330" rx="16" fill="#0d2136" stroke="#4c3a86" stroke-width="2"/>
  <rect x="612" y="192" width="250" height="56" rx="16" fill="#2f2458"/>
  <rect x="612" y="224" width="250" height="24" fill="#2f2458"/>
  <text x="737" y="228" fill="#c9b6ff" font-size="21" font-weight="700" text-anchor="middle">C 本地中枢</text>
  <text x="636" y="288" fill="#9fc4e0" font-size="17">HA + 树莓派/NAS</text>
  <text x="636" y="336" fill="#7ea6c9" font-size="15">成本</text>
  <rect x="636" y="348" width="202" height="12" rx="6" fill="#14304a"/>
  <rect x="636" y="348" width="96" height="12" rx="6" fill="#34d399"/>
  <text x="636" y="392" fill="#6ee7b7" font-size="16">硬件几百元</text>
  <text x="636" y="450" fill="#cfe6fa" font-size="16">代价</text>
  <text x="636" y="478" fill="#9fc4e0" font-size="15">门槛最高、要维护</text>
  <text x="636" y="500" fill="#9fc4e0" font-size="15">token 会过期</text>

  <!-- Card D -->
  <rect x="886" y="192" width="250" height="330" rx="16" fill="#0d2136" stroke="#1e4a6e" stroke-width="2"/>
  <rect x="886" y="192" width="250" height="56" rx="16" fill="#123a5c"/>
  <rect x="886" y="224" width="250" height="24" fill="#123a5c"/>
  <text x="1011" y="228" fill="#8ee3ff" font-size="21" font-weight="700" text-anchor="middle">D 物理兜底</text>
  <text x="910" y="288" fill="#9fc4e0" font-size="17">墙上永远留一路开关</text>
  <text x="910" y="336" fill="#7ea6c9" font-size="15">成本</text>
  <rect x="910" y="348" width="202" height="12" rx="6" fill="#14304a"/>
  <rect x="910" y="348" width="40" height="12" rx="6" fill="#38bdf8"/>
  <text x="910" y="392" fill="#7dd3fc" font-size="16">最低</text>
  <text x="910" y="450" fill="#cfe6fa" font-size="16">代价</text>
  <text x="910" y="478" fill="#9fc4e0" font-size="15">不解决 APP 分裂</text>
  <text x="910" y="500" fill="#9fc4e0" font-size="15">但保证灯一定亮</text>

  <!-- decision strip -->
  <rect x="64" y="548" width="1072" height="98" rx="16" fill="#0e2b45" stroke="#2a6c96" stroke-width="1.5"/>
  <text x="100" y="590" fill="#7dd3fc" font-size="19" font-weight="700">怎么选</text>
  <text x="100" y="624" fill="#e6f2ff" font-size="19">没装完 → A　已装两个牌子 → B　要全屋场景 + 断网可用 → C　怕家人摸黑 → 一定做 D</text>

  <text x="1140" y="656" fill="#3f6f96" font-size="15" text-anchor="end">NEXLAMP · 智能照明技术笔记</text>
</svg>
