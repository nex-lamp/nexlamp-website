<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#162a4a"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="680" height="420" fill="url(#bg3)" rx="8"/>
  <!-- 网格 -->
  <g opacity="0.06" stroke="#4fc3f7">
    <line x1="60" y1="60" x2="620" y2="60"/>
    <line x1="60" y1="140" x2="620" y2="140"/>
    <line x1="60" y1="220" x2="620" y2="220"/>
    <line x1="60" y1="300" x2="620" y2="300"/>
  </g>
  <!-- 标题 -->
  <text x="340" y="35" text-anchor="middle" fill="#81d4fa" font-size="16" font-family="sans-serif" font-weight="bold" filter="url(#glow3)">普通LED vs 全光谱LED：光谱对比图</text>
  <!-- 光谱图区域 -->
  <!-- 波长轴 380nm-780nm -->
  <line x1="80" y1="380" x2="600" y2="380" stroke="#c8d8e8" stroke-width="1" opacity="0.4"/>
  <g fill="#81d4fa" font-size="9" font-family="sans-serif" opacity="0.5">
    <text x="80" y="395" text-anchor="middle">380</text>
    <text x="140" y="395" text-anchor="middle">420</text>
    <text x="200" y="395" text-anchor="middle">460</text>
    <text x="260" y="395" text-anchor="middle">500</text>
    <text x="320" y="395" text-anchor="middle">540</text>
    <text x="380" y="395" text-anchor="middle">580</text>
    <text x="440" y="395" text-anchor="middle">620</text>
    <text x="500" y="395" text-anchor="middle">660</text>
    <text x="560" y="395" text-anchor="middle">700</text>
    <text x="600" y="395" text-anchor="middle">780</text>
  </g>
  <text x="340" y="410" text-anchor="middle" fill="#81d4fa" font-size="10" font-family="sans-serif" opacity="0.6">波长 (nm)</text>
  <!-- 普通LED光谱（锯齿状，蓝光尖峰） -->
  <text x="60" y="75" fill="#4fc3f7" font-size="12" font-family="sans-serif" font-weight="bold">普通LED光谱</text>
  <path d="M 80,350 L 100,350 L 120,120 L 140,300 L 160,340 L 180,320 L 200,250 L 220,310 L 240,350 L 260,340 L 280,310 L 300,320 L 320,350 L 340,340 L 360,360 L 380,370 L 400,380 L 420,380 L 440,380 L 460,380 L 480,380 L 500,380 L 520,380 L 540,380 L 560,380 L 580,380 L 600,380" stroke="#4fc3f7" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- 蓝光尖峰标注 -->
  <rect x="105" y="110" width="40" height="25" fill="#4fc3f7" opacity="0.2" rx="2"/>
  <text x="125" y="127" text-anchor="middle" fill="#ff8c42" font-size="9" font-family="sans-serif" font-weight="bold">蓝光尖峰!</text>
  <!-- 红光缺失标注 -->
  <rect x="440" y="370" width="120" height="20" fill="#ff8c42" opacity="0.1" rx="2"/>
  <text x="500" y="383" text-anchor="middle" fill="#ff8c42" font-size="9" font-family="sans-serif">红光波段缺失</text>
  <!-- 全光谱LED光谱（平滑连续） -->
  <text x="60" y="145" fill="#ff8c42" font-size="12" font-family="sans-serif" font-weight="bold">全光谱LED光谱</text>
  <path d="M 80,340 C 100,320 120,160 140,180 C 160,210 180,200 200,160 C 220,150 240,160 260,180 C 280,200 300,220 320,200 C 340,180 360,150 380,170 C 400,190 420,200 440,180 C 460,160 480,140 500,130 C 520,150 540,180 560,220 C 580,280 600,340 600,340" stroke="#ff8c42" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow3)"/>
  <!-- 红光充足标注 -->
  <rect x="440" y="120" width="80" height="20" fill="#ff8c42" opacity="0.2" rx="2"/>
  <text x="480" y="135" text-anchor="middle" fill="#ff8c42" font-size="9" font-family="sans-serif" font-weight="bold">红光充足 ✓</text>
  <!-- 自然阳光光谱（参考线） -->
  <text x="60" y="210" fill="#c8d8e8" font-size="10" font-family="sans-serif" opacity="0.5">自然阳光（参考）</text>
  <path d="M 80,300 C 120,200 160,160 200,140 C 240,150 280,170 320,160 C 360,150 400,170 440,140 C 480,130 520,160 560,200 C 580,250 600,300 600,300" stroke="#c8d8e8" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="4,3"/>
  <!-- 参数对比表 -->
  <rect x="620" y="60" width="50" height="340" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.2"/>
  <!-- 底部品牌 -->
  <text x="340" y="408" text-anchor="middle" fill="#81d4fa" font-size="10" font-family="sans-serif" opacity="0.5">Nexlamp COB系列 · Ra98全光谱 · 光谱连续接近自然光</text>
  <!-- 参数标注箭头 -->
  <line x1="140" y1="180" x2="140" y2="340" stroke="#ff8c42" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="500" y1="130" x2="500" y2="380" stroke="#ff8c42" stroke-width="0.5" opacity="0.3" stroke-dasharray="2,2"/>
  <!-- 色温标签 -->
  <rect x="80" y="55" width="40" height="14" fill="#4fc3f7" opacity="0.15" rx="2"/>
  <text x="100" y="65" text-anchor="middle" fill="#81d4fa" font-size="8" font-family="sans-serif">紫</text>
  <rect x="160" y="55" width="40" height="14" fill="#4fc3f7" opacity="0.15" rx="2"/>
  <text x="180" y="65" text-anchor="middle" fill="#81d4fa" font-size="8" font-family="sans-serif">蓝</text>
  <rect x="260" y="55" width="40" height="14" fill="#81d4fa" opacity="0.15" rx="2"/>
  <text x="280" y="65" text-anchor="middle" fill="#81d4fa" font-size="8" font-family="sans-serif">绿</text>
  <rect x="380" y="55" width="40" height="14" fill="#ffb347" opacity="0.15" rx="2"/>
  <text x="400" y="65" text-anchor="middle" fill="#ffb347" font-size="8" font-family="sans-serif">黄</text>
  <rect x="500" y="55" width="40" height="14" fill="#ff8c42" opacity="0.15" rx="2"/>
  <text x="520" y="65" text-anchor="middle" fill="#ff8c42" font-size="8" font-family="sans-serif">红</text>
</svg>