<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="100%">
  <title>出租屋低成本智能灯光改造方案</title>
  <desc>展示500元预算内出租屋智能灯光改造的完整配置方案</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f1a2a"/>
    </linearGradient>
  </defs>

  <rect width="680" height="450" fill="url(#bgG2)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#4a9eff" stroke-width="0.5">
    <line x1="0" y1="50" x2="680" y2="50"/>
    <line x1="0" y1="110" x2="680" y2="110"/>
    <line x1="0" y1="170" x2="680" y2="170"/>
    <line x1="0" y1="230" x2="680" y2="230"/>
    <line x1="0" y1="290" x2="680" y2="290"/>
    <line x1="0" y1="350" x2="680" y2="350"/>
    <line x1="0" y1="410" x2="680" y2="410"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="220" y1="0" x2="220" y2="450"/>
    <line x1="340" y1="0" x2="340" y2="450"/>
    <line x1="460" y1="0" x2="460" y2="450"/>
    <line x1="580" y1="0" x2="580" y2="450"/>
  </g>

  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" fill="#e0e8f0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="500">出租屋智能灯光改造 — ¥500 方案架构</text>

  <!-- Room layout (simplified) -->
  <g transform="translate(30, 55)">
    <!-- Room outline -->
    <rect x="0" y="0" width="250" height="180" rx="8" fill="none" stroke="#2a4a6a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="125" y="-8" text-anchor="middle" fill="#5a8aaa" font-family="Microsoft YaHei, sans-serif" font-size="11">房间示意</text>

    <!-- Smart downlights -->
    <g transform="translate(40, 40)">
      <ellipse cx="25" cy="15" rx="22" ry="10" fill="#1a3050" stroke="#4a9eff" stroke-width="1.2"/>
      <text x="25" y="19" text-anchor="middle" fill="#7ab8ff" font-family="sans-serif" font-size="9">智能筒灯×3</text>
      <text x="25" y="42" text-anchor="middle" fill="#5a8a5a" font-family="sans-serif" font-size="9">¥180</text>
    </g>
    <g transform="translate(110, 40)">
      <ellipse cx="25" cy="15" rx="22" ry="10" fill="#1a3050" stroke="#4a9eff" stroke-width="1.2"/>
    </g>
    <g transform="translate(180, 40)">
      <ellipse cx="25" cy="15" rx="22" ry="10" fill="#1a3050" stroke="#4a9eff" stroke-width="1.2"/>
    </g>

    <!-- LED strip -->
    <rect x="20" y="110" width="210" height="14" rx="3" fill="#2a1a08" stroke="#efaf5a" stroke-width="1"/>
    <text x="125" y="121" text-anchor="middle" fill="#efaf5a" font-family="sans-serif" font-size="9">LED氛围灯带 2m · ¥80</text>

    <!-- Wireless switch on wall -->
    <rect x="5" y="140" width="35" height="28" rx="4" fill="#0a2a18" stroke="#5dd9a8" stroke-width="1.2"/>
    <text x="22" y="157" text-anchor="middle" fill="#5dd9a8" font-family="sans-serif" font-size="8">无线</text>
    <text x="22" y="168" text-anchor="middle" fill="#3a8a6a" font-family="sans-serif" font-size="7">开关</text>

    <!-- Gateway -->
    <g transform="translate(185, 135)">
