      <text x="10" y="16" fill="#a0c8ff" font-family="Microsoft YaHei, sans-serif" font-size="11">智能筒灯 ×3支</text>
      <text x="10" y="30" fill="#6080a0" font-family="sans-serif" font-size="9">涂鸦Zigbee 恒流驱动</text>
      <text x="140" y="24" fill="#5dd9a8" font-family="monospace" font-size="12" text-anchor="end">¥180</text>

      <!-- Item 2 -->
      <rect x="0" y="42" width="155" height="36" rx="6" fill="#0a1a30" stroke="#2a5080" stroke-width="0.8"/>
      <text x="10" y="58" fill="#a0c8ff" font-family="Microsoft YaHei, sans-serif" font-size="11">无线开关 ×2个</text>
      <text x="10" y="72" fill="#6080a0" font-family="sans-serif" font-size="9">贴墙即用 免布线</text>
      <text x="140" y="64" fill="#5dd9a8" font-family="monospace" font-size="12" text-anchor="end">¥60</text>

      <!-- Item 3 -->
      <rect x="170" y="0" width="155" height="36" rx="6" fill="#0a1a30" stroke="#2a5080" stroke-width="0.8"/>
      <text x="180" y="16" fill="#a0c8ff" font-family="Microsoft YaHei, sans-serif" font-size="11">Zigbee网关 ×1个</text>
      <text x="180" y="30" fill="#6080a0" font-family="sans-serif" font-size="9">多设备接入中枢</text>
      <text x="310" y="24" fill="#5dd9a8" font-family="monospace" font-size="12" text-anchor="end">¥80</text>

      <!-- Item 4 -->
      <rect x="170" y="42" width="155" height="36" rx="6" fill="#0a1a30" stroke="#2a5080" stroke-width="0.8"/>
      <text x="180" y="58" fill="#a0c8ff" font-family="Microsoft YaHei, sans-serif" font-size="11">LED灯带 2米</text>
      <text x="180" y="72" fill="#6080a0" font-family="sans-serif" font-size="9">窗帘盒氛围光</text>
      <text x="310" y="64" fill="#5dd9a8" font-family="monospace" font-size="12" text-anchor="end">¥80</text>

      <!-- Item 5 -->
