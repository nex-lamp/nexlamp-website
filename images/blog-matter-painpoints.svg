  <text x="340" y="32" text-anchor="middle" fill="#ff6644" font-family="monospace" font-size="18" font-weight="bold" filter="url(#glowRed)">Matter 2026 实测三大痛点</text>
  <text x="340" y="50" text-anchor="middle" fill="#554433" font-family="monospace" font-size="11">Top 3 Pain Points in Real-World Deployment</text>
