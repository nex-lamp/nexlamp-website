<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0056b3" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4757" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ed573" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1abc9c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0a1628"/>

  <!-- Grid lines -->
  <g stroke="#1a2a40" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="130" y1="0" x2="130" y2="500"/>
    <line x1="210" y1="0" x2="210" y2="500"/>
    <line x1="290" y1="0" x2="290" y2="500"/>
    <line x1="370" y1="0" x2="370" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="530" y1="0" x2="530" y2="500"/>
    <line x1="610" y1="0" x2="610" y2="500"/>
    <line x1="690" y1="0" x2="690" y2="500"/>
    <line x1="770" y1="0" x2="770" y2="500"/>
  </g>

  <!-- Title bar -->
  <rect x="20" y="18" width="760" height="34" rx="6" fill="#0f2035" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="38" cy="35" r="6" fill="#ff4757"/>
  <circle cx="56" cy="35" r="6" fill="#ffa502"/>
  <circle cx="74" cy="35" r="6" fill="#2ed573"/>
  <text x="400" y="40" font-family="'Courier New', monospace" font-size="14" fill="#00d4ff" text-anchor="middle" filter="url(#glow1)">PWM 调光频率 vs 频闪影响 分析</text>

  <!-- Y-axis label -->
  <text x="25" y="280" font-family="'Courier New', monospace" font-size="10" fill="#4a6080" transform="rotate(-90, 25, 280)">频闪风险等级</text>

  <!-- X-axis label -->
  <text x="420" y="490" font-family="'Courier New', monospace" font-size="11" fill="#4a6080" text-anchor="middle">PWM 频率 (Hz)</text>

  <!-- Chart area -->
  <!-- Risk zones -->
  <rect x="60" y="80" width="140" height="350" fill="#ff4757" fill-opacity="0.08" rx="2"/>
  <rect x="200" y="80" width="140" height="350" fill="#ffa502" fill-opacity="0.08" rx="2"/>
  <rect x="340" y="80" width="150" height="350" fill="#ffdd57" fill-opacity="0.05" rx="2"/>
  <rect x="490" y="80" width="310" height="350" fill="#2ed573" fill-opacity="0.08" rx="2"/>

  <!-- X-axis ticks and labels -->
  <line x1="60" y1="430" x2="800" y2="430" stroke="#2a3a50" stroke-width="1.5"/>
  <text x="130" y="448" font-family="'Courier New', monospace" font-size="10" fill="#8899aa" text-anchor="middle">&lt; 100</text>
  <text x="270" y="448" font-family="'Courier New', monospace" font-size="10" fill="#8899aa" text-anchor="middle">100–500</text>
  <text x="415" y="448" font-family="'Courier New', monospace" font-size="10" fill="#8899aa" text-anchor="middle">500–1000</text>
  <text x="570" y="448" font-family="'Courier New', monospace" font-size="10" fill="#8899aa" text-anchor="middle">1000–3000</text>
  <text x="720" y="448" font-family="'Courier New', monospace" font-size="10" fill="#8899aa" text-anchor="middle">&gt; 3000</text>

  <!-- Y-axis ticks -->
  <line x1="60" y1="80" x2="60" y2="430" stroke="#2a3a50" stroke-width="1.5"/>
  <text x="52" y="90" font-family="'Courier New', monospace" font-size="9" fill="#8899aa" text-anchor="end">极高</text>
  <text x="52" y="175" font-family="'Courier New', monospace" font-size="9" fill="#8899aa" text-anchor="end">高</text>
  <text x="52" y="260" font-family="'Courier New', monospace" font-size="9" fill="#8899aa" text-anchor="end">中</text>
  <text x="52" y="345" font-family="'Courier New', monospace" font-size="9" fill="#8899aa" text-anchor="end">低</text>
  <text x="52" y="430" font-family="'Courier New', monospace" font-size="9" fill="#8899aa" text-anchor="end">无</text>

  <!-- Risk curve (decreasing) -->
  <polyline points="130,90 270,155 415,250 570,370 720,425" stroke="#00d4ff" stroke-width="2.5" fill="none" filter="url(#glow1)"/>
  <!-- Filled area under curve -->
  <polygon points="130,90 270,155 415,250 570,370 720,425 720,430 130,430" fill="#00d4ff" fill-opacity="0.07"/>

  <!-- Zone labels -->
  <rect x="68" y="88" width="120" height="22" rx="3" fill="#ff4757" fill-opacity="0.25"/>
  <text x="128" y="103" font-family="'Courier New', monospace" font-size="11" fill="#ff4757" text-anchor="middle" font-weight="bold">肉眼可见闪烁</text>

  <rect x="208" y="145" width="120" height="22" rx="3" fill="#ffa502" fill-opacity="0.25"/>
  <text x="268" y="160" font-family="'Courier New', monospace" font-size="11" fill="#ffa502" text-anchor="middle" font-weight="bold">部分人可感知</text>

  <rect x="348" y="232" width="120" height="22" rx="3" fill="#ffdd57" fill-opacity="0.25"/>
  <text x="408" y="247" font-family="'Courier New', monospace" font-size="11" fill="#ffdd57" text-anchor="middle" font-weight="bold">基本可接受</text>

  <rect x="498" y="350" width="130" height="22" rx="3" fill="#2ed573" fill-opacity="0.25"/>
  <text x="563" y="365" font-family="'Courier New', monospace" font-size="11" fill="#2ed573" text-anchor="middle" font-weight="bold">优秀 / 推荐</text>

  <rect x="648" y="398" width="130" height="22" rx="3" fill="#2ed573" fill-opacity="0.35"/>
  <text x="713" y="413" font-family="'Courier New', monospace" font-size="11" fill="#2ed573" text-anchor="middle" font-weight="bold">无频闪级别</text>

  <!-- Data points -->
  <circle cx="130" cy="90" r="5" fill="#ff4757" filter="url(#glow1)"/>
  <circle cx="270" cy="155" r="5" fill="#ffa502" filter="url(#glow1)"/>
  <circle cx="415" cy="250" r="5" fill="#ffdd57" filter="url(#glow1)"/>
  <circle cx="570" cy="370" r="5" fill="#2ed573" filter="url(#glow1)"/>
  <circle cx="720" cy="425" r="5" fill="#2ed573" filter="url(#glow1)"/>

  <!-- Recommended line -->
  <line x1="490" y1="80" x2="490" y2="430" stroke="#2ed573" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.7"/>
  <text x="495" y="102" font-family="'Courier New', monospace" font-size="10" fill="#2ed573">推荐起点</text>
  <text x="495" y="114" font-family="'Courier New', monospace" font-size="10" fill="#2ed573">&gt; 1000Hz</text>

  <!-- Footer -->
  <text x="400" y="478" font-family="'Courier New', monospace" font-size="9" fill="#2a3a50" text-anchor="middle">nexlamp.com | Smart Lighting Technology</text>
</svg>
