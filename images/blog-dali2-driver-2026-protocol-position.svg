<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="460" rx="16" fill="#1a1a2e"/>
  <text x="340" y="38" text-anchor="middle" fill="#e0e0e0" font-family="sans-serif" font-size="15" font-weight="500">DALI-2 在智能照明协议栈中的位置</text>

  <!-- 用户层 -->
  <rect x="40" y="60" width="600" height="56" rx="12" fill="#26215C" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="82" text-anchor="middle" fill="#AFA9EC" font-family="sans-serif" font-size="13" font-weight="500">用户交互层</text>
  <text x="340" y="102" text-anchor="middle" fill="#CECBF6" font-family="sans-serif" font-size="11">APP / 语音 / 场景面板 / 智能音箱</text>

  <!-- 连接箭头 -->
  <line x1="340" y1="116" x2="340" y2="140" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 网关层 -->
  <rect x="40" y="140" width="600" height="56" rx="12" fill="#042C53" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="162" text-anchor="middle" fill="#85B7EB" font-family="sans-serif" font-size="13" font-weight="500">网关&amp;桥接层</text>
  <text x="340" y="182" text-anchor="middle" fill="#B5D4F4" font-family="sans-serif" font-size="11">Matter / KNX / Zigbee / BLE Mesh 网关 — 翻译协议信号</text>

  <!-- 连接箭头 -->
  <line x1="340" y1="196" x2="340" y2="220" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- DALI-2核心层 -->
  <rect x="40" y="220" width="600" height="90" rx="12" fill="#04342C" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="340" y="245" text-anchor="middle" fill="#5DCAA5" font-family="sans-serif" font-size="14" font-weight="500">DALI-2 / D4i 协议层（照明专用）</text>

  <!-- DALI-2核心功能 -->
  <g transform="translate(60, 262)">
    <rect x="0" y="0" width="130" height="36" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="65" y="20" text-anchor="middle" fill="#9FE1CB" font-family="sans-serif" font-size="11" font-weight="500">254级精确调光</text>
  </g>
  <g transform="translate(210, 262)">
    <rect x="0" y="0" width="130" height="36" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="65" y="20" text-anchor="middle" fill="#9FE1CB" font-family="sans-serif" font-size="11" font-weight="500">设备地址&amp;分组</text>
  </g>
  <g transform="translate(360, 262)">
    <rect x="0" y="0" width="130" height="36" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="65" y="20" text-anchor="middle" fill="#9FE1CB" font-family="sans-serif" font-size="11" font-weight="500">D4i数据上报</text>
  </g>
  <g transform="translate(510, 262)">
    <rect x="0" y="0" width="130" height="36" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="65" y="20" text-anchor="middle" fill="#9FE1CB" font-family="sans-serif" font-size="11" font-weight="500">故障&amp;状态诊断</text>
  </g>

  <!-- 连接箭头 -->
  <line x1="340" y1="310" x2="340" y2="338" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 硬件层 -->
  <rect x="40" y="338" width="600" height="70" rx="12" fill="#2C2C2A" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="358" text-anchor="middle" fill="#B4B2A9" font-family="sans-serif" font-size="13" font-weight="500">LED 驱动电源硬件层</text>
  <text x="340" y="380" text-anchor="middle" fill="#D3D1C7" font-family="sans-serif" font-size="11">DALI-2 解码芯片 + MCU/DSP + 功率转换电路</text>
  <text x="340" y="396" text-anchor="middle" fill="#888780" font-family="sans-serif" font-size="11">供电 · 调光 · 数据采集 · 远程诊断 = 智能中枢</text>

  <!-- 侧边标注 -->
  <g transform="translate(635, 230)">
    <rect x="0" y="0" width="40" height="80" rx="8" fill="#1D9E75" opacity="0.3"/>
    <text x="20" y="44" text-anchor="middle" fill="#5DCAA5" font-family="sans-serif" font-size="10" font-weight="500">核心</text>
  </g>

  <!-- 底部说明 -->
  <text x="340" y="440" text-anchor="middle" fill="#888780" font-family="sans-serif" font-size="11">底层调光精度由 DALI-2 保证 | 上层交互由 Matter/Zigbee 网关桥接</text>
</svg>