<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="480" fill="url(#bg)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/>
    <line x1="85" y1="0" x2="85" y2="480"/><line x1="170" y1="0" x2="170" y2="480"/>
    <line x1="255" y1="0" x2="255" y2="480"/><line x1="340" y1="0" x2="340" y2="480"/>
    <line x1="425" y1="0" x2="425" y2="480"/><line x1="510" y1="0" x2="510" y2="480"/>
    <line x1="595" y1="0" x2="595" y2="480"/>
  </g>
  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="24" font-weight="bold" filter="url(#glow)">过保智能灯 · 四类高发通病</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <!-- Card 1 电容鼓包 -->
  <rect x="34" y="70" width="300" height="120" rx="10" fill="#12233f" stroke="#7ec27e" stroke-width="1.5"/>
  <rect x="50" y="88" width="64" height="28" rx="6" fill="#7ec27e" opacity="0.15"/>
  <text x="82" y="107" fill="#7ec27e" font-family="sans-serif" font-size="13" text-anchor="middle">通病 1</text>
  <text x="128" y="107" fill="#e8f4e8" font-family="sans-serif" font-size="17" font-weight="bold">电解电容鼓包</text>
  <text x="50" y="136" fill="#9db8d9" font-family="sans-serif" font-size="12.5">症状：灯开几秒后闪几下就灭</text>
  <text x="50" y="158" fill="#9db8d9" font-family="sans-serif" font-size="12.5">病根：驱动里几毛钱的电容老化</text>
  <text x="50" y="180" fill="#f0c674" font-family="sans-serif" font-size="14" font-weight="bold">自救：电容 3-7 元</text>

  <!-- Card 2 开关电流音 -->
  <rect x="346" y="70" width="300" height="120" rx="10" fill="#12233f" stroke="#7ec27e" stroke-width="1.5"/>
  <rect x="362" y="88" width="64" height="28" rx="6" fill="#7ec27e" opacity="0.15"/>
  <text x="394" y="107" fill="#7ec27e" font-family="sans-serif" font-size="13" text-anchor="middle">通病 2</text>
  <text x="440" y="107" fill="#e8f4e8" font-family="sans-serif" font-size="17" font-weight="bold">开关电流音</text>
  <text x="362" y="136" fill="#9db8d9" font-family="sans-serif" font-size="12.5">症状：用两年的开关"滋滋"响</text>
  <text x="362" y="158" fill="#9db8d9" font-family="sans-serif" font-size="12.5">病根：当无线开关用，电容过载烧</text>
  <text x="362" y="180" fill="#f0c674" font-family="sans-serif" font-size="14" font-weight="bold">自救：同款电容几块钱</text>

  <!-- Card 3 顶针 -->
  <rect x="34" y="204" width="300" height="120" rx="10" fill="#12233f" stroke="#5cc8e8" stroke-width="1.5"/>
  <rect x="50" y="222" width="64" height="28" rx="6" fill="#5cc8e8" opacity="0.15"/>
  <text x="82" y="241" fill="#5cc8e8" font-family="sans-serif" font-size="13" text-anchor="middle">通病 3</text>
  <text x="128" y="241" fill="#e8f4e8" font-family="sans-serif" font-size="17" font-weight="bold">挂灯时好时坏</text>
  <text x="50" y="270" fill="#9db8d9" font-family="sans-serif" font-size="12.5">症状：接触不良、莫名离线</text>
  <text x="50" y="292" fill="#9db8d9" font-family="sans-serif" font-size="12.5">病根：底座顶针失去弹性</text>
  <text x="50" y="314" fill="#f0c674" font-family="sans-serif" font-size="14" font-weight="bold">自救：顶针配件几块钱</text>

  <!-- Card 4 驱动/WiFi -->
  <rect x="346" y="204" width="300" height="120" rx="10" fill="#12233f" stroke="#5cc8e8" stroke-width="1.5"/>
  <rect x="362" y="222" width="64" height="28" rx="6" fill="#5cc8e8" opacity="0.15"/>
  <text x="394" y="241" fill="#5cc8e8" font-family="sans-serif" font-size="13" text-anchor="middle">通病 4</text>
  <text x="440" y="241" fill="#e8f4e8" font-family="sans-serif" font-size="17" font-weight="bold">驱动 / WiFi 模块坏</text>
  <text x="362" y="270" fill="#9db8d9" font-family="sans-serif" font-size="12.5">症状：灯完全不亮 / 只能开不能智能</text>
  <text x="362" y="292" fill="#9db8d9" font-family="sans-serif" font-size="12.5">病根：驱动电源到寿命</text>
  <text x="362" y="314" fill="#f0c674" font-family="sans-serif" font-size="14" font-weight="bold">自救：换驱动十几元</text>

  <!-- bottom note -->
  <rect x="34" y="342" width="612" height="106" rx="10" fill="#0d1c33" stroke="#f0c674" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="66" cy="374" r="14" fill="#f0c674" opacity="0.2"/>
  <text x="66" y="379" fill="#f0c674" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">!</text>
  <text x="92" y="379" fill="#e8f4e8" font-family="sans-serif" font-size="15" font-weight="bold">规律：坏的往往不是灯珠，而是驱动电源和控制模块</text>
  <text x="56" y="408" fill="#9db8d9" font-family="sans-serif" font-size="13">LED灯珠标称寿命 5 万小时，驱动里的电解电容才是整灯的寿命短板</text>
  <text x="56" y="432" fill="#7ec27e" font-family="sans-serif" font-size="13" font-weight="bold">拆开发现是驱动的问题 → 这盏灯基本能救</text>
</svg>
