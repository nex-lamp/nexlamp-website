<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <pattern id="grid2" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="680" height="440" fill="url(#bg2)"/>
  <rect width="680" height="440" fill="url(#grid2)"/>
  <text x="40" y="50" fill="#e2e8f0" font-size="24" font-weight="bold">现象 → 病因对照决策表</text>
  <rect x="40" y="62" width="120" height="4" rx="2" fill="#38bdf8"/>

  <!-- table header -->
  <rect x="40" y="84" width="330" height="36" fill="#132a4a"/>
  <rect x="374" y="84" width="266" height="36" fill="#132a4a"/>
  <text x="58" y="108" fill="#7dd3fc" font-size="14" font-weight="bold">故障现象</text>
  <text x="392" y="108" fill="#7dd3fc" font-size="14" font-weight="bold">病因与处理</text>
  <line x1="40" y1="120" x2="640" y2="120" stroke="#38bdf8" stroke-width="1"/>

  <!-- rows -->
  <g font-size="13">
    <rect x="40" y="120" width="600" height="42" fill="#0d1f36"/>
    <text x="58" y="146" fill="#e2e8f0">完全不亮，驱动鼓包/有焦味</text>
    <text x="392" y="146" fill="#f87171" font-weight="bold">驱动烧毁 → 换驱动</text>

    <rect x="40" y="162" width="600" height="42" fill="#112542"/>
    <text x="58" y="188" fill="#e2e8f0">一整排黑、另一排还亮</text>
    <text x="392" y="188" fill="#fbbf24" font-weight="bold">串联灯珠断路 → 短接应急/换灯板</text>

    <rect x="40" y="204" width="600" height="42" fill="#0d1f36"/>
    <text x="58" y="230" fill="#e2e8f0">灯珠局部微亮、闪烁</text>
    <text x="392" y="230" fill="#f87171" font-weight="bold">驱动输出不稳 → 换驱动</text>

    <rect x="40" y="246" width="600" height="42" fill="#112542"/>
    <text x="58" y="272" fill="#e2e8f0">开灯延迟几秒才亮</text>
    <text x="392" y="272" fill="#f87171" font-weight="bold">驱动电容老化 → 尽快换驱动</text>

    <rect x="40" y="288" width="600" height="42" fill="#0d1f36"/>
    <text x="58" y="314" fill="#e2e8f0">时亮时不亮，拍一下就好</text>
    <text x="392" y="314" fill="#34d399" font-weight="bold">端子松动 → 断电拧紧（免费）</text>

    <rect x="40" y="330" width="600" height="42" fill="#112542"/>
    <text x="58" y="356" fill="#e2e8f0">遥控没反应，灯本身能亮</text>
    <text x="392" y="356" fill="#34d399" font-weight="bold">遥控器/分段器 → 换电池或控制器</text>
  </g>

  <!-- scam warning -->
  <rect x="40" y="390" width="600" height="38" rx="8" fill="#2a1420" stroke="#f87171" stroke-width="1.2"/>
  <text x="58" y="414" fill="#fca5a5" font-size="13" font-weight="bold">⚠ 防坑：师傅说"灯珠全烧了换整灯"，先让他指出黑点在哪——指不出来就是小病大修</text>
</svg>
