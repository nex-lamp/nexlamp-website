<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d4a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#0a1628"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- terminal window -->
  <rect x="50" y="40" width="700" height="370" rx="8" fill="#0d1d33" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="50" y="40" width="700" height="32" rx="8" fill="#132945"/>
  <circle cx="74" cy="56" r="6" fill="#ff5f57"/>
  <circle cx="94" cy="56" r="6" fill="#febc2e"/>
  <circle cx="114" cy="56" r="6" fill="#28c840"/>
  <text x="375" y="60" font-family="monospace" font-size="13" fill="#8aa4c8" text-anchor="middle">EPBD_2026_COMPLIANCE_FRAMEWORK.exe</text>
  
  <!-- title -->
  <text x="80" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#e8f4ff">从产品合规到系统合规</text>
  <text x="80" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7a9bc4">EPBD 新规把灯具从孤立硬件变成建筑能源网络的智能节点</text>
  
  <!-- old era -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="220" height="180" rx="6" fill="#0f2138" stroke="#2a4a73" stroke-width="1"/>
    <text x="110" y="30" font-family="monospace" font-size="12" fill="#5a8ab8" text-anchor="middle">&lt; 2026 旧规则 / OLD ERA &gt;</text>
    <rect x="20" y="55" width="180" height="38" rx="4" fill="#1a3658"/>
    <text x="30" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b8d4f0">光效达标</text>
    <rect x="20" y="103" width="180" height="38" rx="4" fill="#1a3658"/>
    <text x="30" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b8d4f0">能效合规</text>
    <rect x="20" y="151" width="180" height="38" rx="4" fill="#1a3658"/>
    <text x="30" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b8d4f0">单一产品检测</text>
  </g>
  
  <!-- arrow -->
  <line x1="320" y1="260" x2="440" y2="260" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrow)" filter="url(#glow)"/>
  <text x="380" y="245" font-family="monospace" font-size="11" fill="#00d4aa" text-anchor="middle">EPBD 全面实施</text>
  <text x="380" y="285" font-family="monospace" font-size="11" fill="#00d4aa" text-anchor="middle">2026.05</text>
  
  <!-- new era -->
  <g transform="translate(460, 170)">
    <rect x="0" y="0" width="240" height="180" rx="6" fill="#0f2138" stroke="#00d4aa" stroke-width="1.5" filter="url(#glow)"/>
    <text x="120" y="30" font-family="monospace" font-size="12" fill="#00d4aa" text-anchor="middle">&gt;= 2026 新规则 / NEW ERA &lt;</text>
    <rect x="20" y="55" width="200" height="30" rx="4" fill="#0a2e26"/>
    <text x="30" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7efce0">自动照明控制系统</text>
    <rect x="20" y="93" width="200" height="30" rx="4" fill="#0a2e26"/>
    <text x="30" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7efce0">楼宇自动化系统 BAS</text>
    <rect x="20" y="131" width="200" height="30" rx="4" fill="#0a2e26"/>
    <text x="30" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7efce0">D4i Gen 2 认证驱动</text>
  </g>
  
  <!-- bottom note -->
  <text x="400" y="390" font-family="monospace" font-size="12" fill="#6b8cb0" text-anchor="middle">核心变化：灯具 = 建筑能源管理网络中的可管理终端节点</text>
</svg>