<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="440" fill="url(#bg3)"/>
  <g opacity="0.06" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="440"/><line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/>
  </g>
  <text x="400" y="38" text-anchor="middle" font-family="monospace" font-size="16" fill="#4fc3f7" filter="url(#glow3)">PROTOCOL EVOLUTION TIMELINE</text>
  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b8dad">智能照明协议演进与融合趋势</text>
  <!-- Timeline line -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#1a3a5c" stroke-width="2"/>
  <!-- DALI 1.0 -->
  <circle cx="100" cy="200" r="8" fill="#ab47bc" stroke="#ce93d8" stroke-width="1"/>
  <line x1="100" y1="192" x2="100" y2="110" stroke="#ab47bc" stroke-width="0.8" opacity="0.5"/>
  <rect x="40" y="80" width="120" height="28" rx="4" fill="rgba(171,71,188,0.12)" stroke="#ab47bc" stroke-width="0.5"/>
  <text x="100" y="99" text-anchor="middle" font-family="monospace" font-size="11" fill="#ce93d8">DALI 1.0</text>
  <text x="100" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#90a4ae">2000</text>
  <text x="100" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b8dad">数字调光起点</text>
  <!-- Zigbee 1.0 -->
  <circle cx="260" cy="200" r="8" fill="#00c853" stroke="#69f0ae" stroke-width="1"/>
  <line x1="260" y1="192" x2="260" y2="110" stroke="#00c853" stroke-width="0.8" opacity="0.5"/>
  <rect x="200" y="80" width="120" height="28" rx="4" fill="rgba(0,200,83,0.12)" stroke="#00c853" stroke-width="0.5"/>
  <text x="260" y="99" text-anchor="middle" font-family="monospace" font-size="11" fill="#69f0ae">Zigbee 1.0</text>
  <text x="260" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#90a4ae">2007</text>
  <text x="260" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b8dad">无线Mesh开端</text>
  <!-- BLE 4.0 -->
  <circle cx="400" cy="200" r="8" fill="#2196f3" stroke="#64b5f6" stroke-width="1"/>
  <line x1="400" y1="192" x2="400" y2="110" stroke="#2196f3" stroke-width="0.8" opacity="0.5"/>
  <rect x="340" y="80" width="120" height="28" rx="4" fill="rgba(33,150,243,0.12)" stroke="#2196f3" stroke-width="0.5"/>
  <text x="400" y="99" text-anchor="middle" font-family="monospace" font-size="11" fill="#64b5f6">BLE 4.0</text>
  <text x="400" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#90a4ae">2012</text>
  <text x="400" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b8dad">低功耗蓝牙</text>
  <!-- DALI-2 + Zigbee 3.0 -->
  <circle cx="530" cy="200" r="10" fill="#ff9800" stroke="#ffb74d" stroke-width="1"/>
  <line x1="530" y1="190" x2="530" y2="110" stroke="#ff9800" stroke-width="0.8" opacity="0.5"/>
  <rect x="460" y="80" width="140" height="28" rx="4" fill="rgba(255,152,0,0.12)" stroke="#ff9800" stroke-width="0.5"/>
  <text x="530" y="99" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffb74d">DALI-2/ZB3.0</text>
  <text x="530" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#90a4ae">2017</text>
  <text x="530" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b8dad">标准化整合</text>
  <!-- Matter -->
  <circle cx="680" cy="200" r="12" fill="#4fc3f7" stroke="#b3e5fc" stroke-width="1.5" filter="url(#glow3)"/>
  <line x1="680" y1="188" x2="680" y2="110" stroke="#4fc3f7" stroke-width="1" opacity="0.6"/>
  <rect x="620" y="78" width="120" height="32" rx="4" fill="rgba(79,195,247,0.15)" stroke="#4fc3f7" stroke-width="0.8"/>
  <text x="680" y="99" text-anchor="middle" font-family="monospace" font-size="12" fill="#4fc3f7" filter="url(#glow3)">Matter</text>
  <text x="680" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#90a4ae">2022+</text>
  <text x="680" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4fc3f7">统一互联时代</text>
  <!-- Convergence arrows -->
  <path d="M260 290 Q400 310 680 210" fill="none" stroke="#4fc3f7" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Bottom insight -->
  <rect x="100" y="310" width="600" height="110" rx="8" fill="rgba(13,31,60,0.8)" stroke="#1a3a5c" stroke-width="0.8"/>
  <text x="400" y="338" text-anchor="middle" font-family="monospace" font-size="12" fill="#4fc3f7" filter="url(#glow3)">FUTURE TREND</text>
  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b0bec5">Matter协议正在统一碎片化的智能家居生态</text>
  <text x="400" y="382" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b0bec5">Zigbee 3.0 设备可无缝迁移至 Matter 网络</text>
  <text x="400" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b8dad">DALI-2 仍是商业照明精准控制的不可替代方案</text>
</svg>