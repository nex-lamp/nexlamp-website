<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Consolas, monospace">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2440"/>
    </linearGradient>
    <linearGradient id="okGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#3db8af"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#7ec27e"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad2)"/>
  <rect width="1200" height="700" fill="url(#grid2)"/>

  <!-- 标题栏 -->
  <rect x="40" y="30" width="1120" height="50" fill="#0d2440" stroke="#4ecdc4" stroke-width="1" rx="4"/>
  <text x="60" y="62" fill="#4ecdc4" font-size="22" font-weight="bold">▎SMART DIMMING DRIVER · 选型决策流程</text>
  <text x="1140" y="62" fill="#7ec27e" font-size="14" text-anchor="end">2026 实战版</text>

  <!-- 决策树根节点 -->
  <rect x="500" y="110" width="200" height="48" fill="#1a3a5c" stroke="#7ec27e" stroke-width="2" rx="6" filter="url(#glow2)"/>
  <text x="600" y="140" fill="#7ec27e" font-size="16" font-weight="bold" text-anchor="middle">你的场景？</text>

  <!-- 三个分支 -->
  <line x1="600" y1="158" x2="200" y2="210" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="600" y1="158" x2="600" y2="210" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="600" y1="158" x2="1000" y2="210" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="180" y="195" fill="#4ecdc4" font-size="12">A</text>
  <text x="580" y="195" fill="#4ecdc4" font-size="12">B</text>
  <text x="980" y="195" fill="#4ecdc4" font-size="12">C</text>

  <!-- 分支A: 家庭无主灯 -->
  <rect x="80" y="210" width="240" height="48" fill="#0d2440" stroke="#4ecdc4" stroke-width="1.5" rx="4"/>
  <text x="200" y="240" fill="#4ecdc4" font-size="14" font-weight="bold" text-anchor="middle">A. 家庭无主灯</text>

  <rect x="100" y="280" width="200" height="38" fill="#1a3a5c" stroke="#7ec27e" rx="4"/>
  <text x="200" y="305" fill="#7ec27e" font-size="13" text-anchor="middle">预算紧？</text>

  <line x1="200" y1="318" x2="120" y2="345" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="200" y1="318" x2="280" y2="345" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="105" y="340" fill="#9bb0c4" font-size="10">否</text>
  <text x="285" y="340" fill="#9bb0c4" font-size="10">是</text>

  <rect x="40" y="345" width="160" height="60" fill="#0d2440" stroke="#4ecdc4" stroke-width="1.5" rx="4"/>
  <text x="120" y="370" fill="#4ecdc4" font-size="13" font-weight="bold" text-anchor="middle">→ 0-10V</text>
  <text x="120" y="390" fill="#7ec27e" font-size="11" text-anchor="middle">EUP20Z-0-10V</text>

  <rect x="220" y="345" width="160" height="60" fill="#0d2440" stroke="#ff6b6b" stroke-width="1.5" rx="4"/>
  <text x="300" y="370" fill="#ff6b6b" font-size="13" font-weight="bold" text-anchor="middle">→ 可控硅</text>
  <text x="300" y="390" fill="#7ec27e" font-size="11" text-anchor="middle">仅过渡用</text>

  <!-- 分支B: 智能联动 -->
  <rect x="480" y="210" width="240" height="48" fill="#0d2440" stroke="#4ecdc4" stroke-width="1.5" rx="4"/>
  <text x="600" y="240" fill="#4ecdc4" font-size="14" font-weight="bold" text-anchor="middle">B. 智能家居联动</text>

  <rect x="500" y="280" width="200" height="38" fill="#1a3a5c" stroke="#7ec27e" rx="4"/>
  <text x="600" y="305" fill="#7ec27e" font-size="13" text-anchor="middle">涂鸦 / 米家 / HomeKit？</text>

  <line x1="600" y1="318" x2="600" y2="345" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="500" y="345" width="200" height="60" fill="#0d2440" stroke="#4ecdc4" stroke-width="1.5" rx="4"/>
  <text x="600" y="370" fill="#4ecdc4" font-size="14" font-weight="bold" text-anchor="middle">→ Zigbee 3.0</text>
  <text x="600" y="390" fill="#7ec27e" font-size="11" text-anchor="middle">EUP20Z-Zigbee + 网关</text>

  <line x1="600" y1="405" x2="600" y2="430" stroke="#7ec27e" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="480" y="430" width="240" height="38" fill="#1a3a5c" stroke="#ffd93d" rx="4"/>
  <text x="600" y="455" fill="#ffd93d" font-size="12" text-anchor="middle">⚠ 必须配 Zigbee 网关</text>

  <!-- 分支C: 豪宅/商业 -->
  <rect x="880" y="210" width="240" height="48" fill="#0d2440" stroke="#4ecdc4" stroke-width="1.5" rx="4"/>
  <text x="1000" y="240" fill="#4ecdc4" font-size="14" font-weight="bold" text-anchor="middle">C. 豪宅 / 商业 / 酒店</text>

  <rect x="900" y="280" width="200" height="38" fill="#1a3a5c" stroke="#7ec27e" rx="4"/>
  <text x="1000" y="305" fill="#7ec27e" font-size="13" text-anchor="middle">需要场景化 / DT8 调色？</text>

  <line x1="1000" y1="318" x2="1000" y2="345" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="900" y="345" width="200" height="60" fill="#0d2440" stroke="#4ecdc4" stroke-width="1.5" rx="4"/>
  <text x="1000" y="370" fill="#4ecdc4" font-size="14" font-weight="bold" text-anchor="middle">→ DALI-2</text>
  <text x="1000" y="390" fill="#7ec27e" font-size="11" text-anchor="middle">EUP40D-DALI</text>

  <line x1="1000" y1="405" x2="1000" y2="430" stroke="#7ec27e" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="880" y="430" width="240" height="38" fill="#1a3a5c" stroke="#ffd93d" rx="4"/>
  <text x="1000" y="455" fill="#ffd93d" font-size="12" text-anchor="middle">⚠ 需 DALI 总线电源 + 编程</text>

  <!-- 底部：3C认证 + 新国标 -->
  <rect x="40" y="510" width="1120" height="160" fill="#0d2440" stroke="#1a3a5c" stroke-width="1" rx="4"/>
  <text x="60" y="540" fill="#7ec27e" font-size="16" font-weight="bold">▎2026 选型必查 4 项</text>

  <rect x="60" y="560" width="240" height="40" fill="#0a1628" stroke="#ff6b6b" stroke-width="1" rx="3"/>
  <text x="180" y="585" fill="#ff6b6b" font-size="13" font-weight="bold" text-anchor="middle">① 3C 认证</text>

  <rect x="320" y="560" width="240" height="40" fill="#0a1628" stroke="#ff6b6b" stroke-width="1" rx="3"/>
  <text x="440" y="585" fill="#ff6b6b" font-size="13" font-weight="bold" text-anchor="middle">② Pst ≤ 1.0 频闪</text>

  <rect x="580" y="560" width="240" height="40" fill="#0a1628" stroke="#ff6b6b" stroke-width="1" rx="3"/>
  <text x="700" y="585" fill="#ff6b6b" font-size="13" font-weight="bold" text-anchor="middle">③ SVM ≤ 1.8 频闪</text>

  <rect x="840" y="560" width="240" height="40" fill="#0a1628" stroke="#ff6b6b" stroke-width="1" rx="3"/>
  <text x="960" y="585" fill="#ff6b6b" font-size="13" font-weight="bold" text-anchor="middle">④ 待机 ≤ 0.5W</text>

  <rect x="60" y="615" width="1080" height="40" fill="#0a1628" stroke="#ffd93d" stroke-width="1" rx="3"/>
  <text x="600" y="640" fill="#ffd93d" font-size="13" text-anchor="middle" font-weight="bold">⚡ GB/T 31831-2025 新国标：以上 4 项不达标 = 工程招标一票否决</text>
</svg>
