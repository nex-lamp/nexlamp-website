    <!-- Circuit-like header -->
    <rect width="230" height="3" fill="url(#amberGlow)" filter="url(#glow)"/>
    <text x="115" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#fbbf24" filter="url(#glow)">TRADITIONAL</text>
    <text x="115" y="42" text-anchor="middle" font-size="10" fill="#94a3b8">传统照明控制</text>
    <!-- Data rows -->
