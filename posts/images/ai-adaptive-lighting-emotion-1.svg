<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#162a4a"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="coolGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="680" height="420" fill="url(#bg1)" rx="8"/>
  <!-- 网格线 -->
  <g opacity="0.08" stroke="#4fc3f7">
    <line x1="0" y1="60" x2="680" y2="60"/>
    <line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
  </g>
  <!-- 标题 -->
  <text x="340" y="38" text-anchor="middle" fill="#81d4fa" font-size="18" font-family="sans-serif" font-weight="bold" filter="url(#glow)">色温 vs 生理节律：一天24小时最优色温曲线</text>
  <!-- 色温曲线 -->
  <path d="M 60,340 C 100,340 120,120 160,120 C 200,120 220,150 260,150 C 300,150 340,180 380,200 C 420,220 460,300 500,340 C 540,360 580,370 620,370" stroke="url(#coolGlow)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <!-- 冷光区域标注 -->
  <rect x="100" y="95" width="180" height="50" fill="#4fc3f7" opacity="0.12" rx="4"/>
  <text x="190" y="105" text-anchor="middle" fill="#81d4fa" font-size="11" font-family="sans-serif">冷白光 5000-6500K</text>
  <text x="190" y="120" text-anchor="middle" fill="#81d4fa" font-size="9" font-family="sans-serif" opacity="0.7">唤醒 · 抑制褪黑素</text>
  <!-- 自然白区域标注 -->
  <rect x="240" y="135" width="160" height="50" fill="#e0e0e0" opacity="0.08" rx="4"/>
  <text x="320" y="145" text-anchor="middle" fill="#c8d8e8" font-size="11" font-family="sans-serif">自然白 4000-5000K</text>
  <text x="320" y="160" text-anchor="middle" fill="#c8d8e8" font-size="9" font-family="sans-serif" opacity="0.7">专注 · 维持效率</text>
  <!-- 暖白区域标注 -->
  <rect x="360" y="175" width="140" height="50" fill="#ffb347" opacity="0.12" rx="4"/>
  <text x="430" y="185" text-anchor="middle" fill="#ffb347" font-size="11" font-family="sans-serif">暖白光 3000-4000K</text>
  <text x="430" y="200" text-anchor="middle" fill="#ffb347" font-size="9" font-family="sans-serif" opacity="0.7">过渡 · 放松身心</text>
  <!-- 暖黄区域标注 -->
  <rect x="480" y="320" width="140" height="50" fill="#ff8c42" opacity="0.12" rx="4"/>
  <text x="550" y="330" text-anchor="middle" fill="#ff8c42" font-size="11" font-family="sans-serif">暖黄光 ≤2700K</text>
  <text x="550" y="345" text-anchor="middle" fill="#ff8c42" font-size="9" font-family="sans-serif" opacity="0.7">助眠 · 促进褪黑素</text>
  <!-- 时间轴 -->
  <line x1="60" y1="390" x2="620" y2="390" stroke="#4fc3f7" stroke-width="1" opacity="0.3"/>
  <g fill="#81d4fa" font-size="10" font-family="sans-serif" opacity="0.6">
    <text x="80" y="405" text-anchor="middle">6:00</text>
    <text x="160" y="405" text-anchor="middle">8:00</text>
    <text x="260" y="405" text-anchor="middle">12:00</text>
    <text x="380" y="405" text-anchor="middle">18:00</text>
    <text x="500" y="405" text-anchor="middle">21:00</text>
    <text x="620" y="405" text-anchor="middle">23:00</text>
  </g>
  <!-- 色温刻度 -->
  <line x1="40" y1="100" x2="40" y2="380" stroke="#4fc3f7" stroke-width="1" opacity="0.3"/>
  <g fill="#81d4fa" font-size="10" font-family="sans-serif" opacity="0.6">
    <text x="35" y="105" text-anchor="end">6500K</text>
    <text x="35" y="155" text-anchor="end">5000K</text>
    <text x="35" y="205" text-anchor="end">4000K</text>
    <text x="35" y="305" text-anchor="end">3000K</text>
    <text x="35" y="375" text-anchor="end">2700K</text>
  </g>
  <!-- 褪黑素曲线（反向） -->
  <path d="M 60,120 C 100,120 160,340 260,340 C 360,340 460,340 500,180 C 540,120 580,120 620,120" stroke="#ff8c42" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="6,3"/>
  <text x="180" y="365" text-anchor="middle" fill="#ff8c42" font-size="10" font-family="sans-serif" opacity="0.6">↓ 褪黑素被抑制</text>
  <text x="550" y="115" text-anchor="middle" fill="#ff8c42" font-size="10" font-family="sans-serif" opacity="0.6">↑ 褪黑素分泌高峰</text>
  <!-- 关键节点 -->
  <circle cx="160" cy="120" r="5" fill="#4fc3f7" filter="url(#glow)"/>
  <circle cx="260" cy="150" r="5" fill="#c8d8e8"/>
  <circle cx="380" cy="200" r="5" fill="#ffb347"/>
  <circle cx="500" cy="340" r="5" fill="#ff8c42" filter="url(#glow)"/>
  <!-- 品牌标识 -->
  <text x="340" y="38" text-anchor="middle" fill="#81d4fa" font-size="18" font-family="sans-serif" font-weight="bold" filter="url(#glow)"/>
</svg>