<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f38"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="400" fill="url(#bg2)"/>
  <!-- grid -->
  <g opacity="0.08" stroke="#3b82f6" stroke-width="0.5">
    <line x1="0" y1="80" x2="680" y2="80"/><line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="240" x2="680" y2="240"/><line x1="0" y1="320" x2="680" y2="320"/>
  </g>
  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="16" font-weight="bold">三种无网关方案技术路线对比</text>
  <!-- Three columns -->
  <!-- Col 1: Zigbee -->
  <rect x="30" y="60" width="195" height="310" rx="8" fill="#0d2541" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  <rect x="30" y="60" width="195" height="35" rx="8" fill="#1e40af" opacity="0.6"/>
  <text x="127" y="83" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="14" font-weight="bold">Zigbee Mesh</text>
  <text x="127" y="115" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10">成熟度: ★★★★★</text>
  <line x1="50" y1="125" x2="205" y2="125" stroke="#334155" stroke-width="0.5"/>
  <text x="45" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">代表: 涂鸦 / Hue / Nexlamp</text>
  <text x="45" y="165" fill="#22c55e" font-family="monospace" font-size="10">最大设备: 250+</text>
  <text x="45" y="185" fill="#22c55e" font-family="monospace" font-size="10">待机功耗: &lt;0.5W</text>
  <text x="45" y="205" fill="#22c55e" font-family="monospace" font-size="10">穿墙: 优秀 (Sub-GHz)</text>
  <text x="45" y="225" fill="#22c55e" font-family="monospace" font-size="10">蓝牙直连: Zigbee 4.0 支持</text>
  <text x="45" y="245" fill="#22c55e" font-family="monospace" font-size="10">断网可用: 是</text>
  <text x="45" y="265" fill="#f59e0b" font-family="monospace" font-size="10">需协调器: 灯泡内置</text>
  <line x1="50" y1="275" x2="205" y2="275" stroke="#334155" stroke-width="0.5"/>
  <text x="45" y="295" fill="#94a3b8" font-family="monospace" font-size="9">2026 Zibgee 4.0 新增</text>
  <text x="45" y="310" fill="#94a3b8" font-family="monospace" font-size="9">SUZI 子GHz + 蓝牙直连</text>
  <text x="45" y="330" fill="#94a3b8" font-family="monospace" font-size="9">完全向下兼容</text>
  <text x="45" y="358" fill="#3b82f6" font-family="monospace" font-size="10" font-weight="bold">推荐: 全屋首选</text>

  <!-- Col 2: BLE Mesh -->
  <rect x="242" y="60" width="195" height="310" rx="8" fill="#0d2541" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
  <rect x="242" y="60" width="195" height="35" rx="8" fill="#7e22ce" opacity="0.6"/>
  <text x="339" y="83" text-anchor="middle" fill="#d8b4fe" font-family="monospace" font-size="14" font-weight="bold">蓝牙 Mesh</text>
  <text x="339" y="115" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10">成熟度: ★★★★☆</text>
  <line x1="262" y1="125" x2="417" y2="125" stroke="#334155" stroke-width="0.5"/>
  <text x="257" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">代表: Casambi / 涂鸦BLE</text>
  <text x="257" y="165" fill="#22c55e" font-family="monospace" font-size="10">最大设备: 100+</text>
  <text x="257" y="185" fill="#22c55e" font-family="monospace" font-size="10">待机功耗: &lt;0.3W</text>
  <text x="257" y="205" fill="#f59e0b" font-family="monospace" font-size="10">穿墙: 一般 (2.4GHz)</text>
  <text x="257" y="225" fill="#22c55e" font-family="monospace" font-size="10">蓝牙直连: 原生支持</text>
  <text x="257" y="245" fill="#22c55e" font-family="monospace" font-size="10">断网可用: 是</text>
  <text x="257" y="265" fill="#22c55e" font-family="monospace" font-size="10">需协调器: 无</text>
  <line x1="262" y1="275" x2="417" y2="275" stroke="#334155" stroke-width="0.5"/>
  <text x="257" y="295" fill="#94a3b8" font-family="monospace" font-size="9">手机直连，零网关</text>
  <text x="257" y="310" fill="#94a3b8" font-family="monospace" font-size="9">大户型需足量中继</text>
  <text x="257" y="330" fill="#94a3b8" font-family="monospace" font-size="9">商用渗透率 40%+</text>
  <text x="257" y="358" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold">推荐: 小户型 / 商用</text>

  <!-- Col 3: Matter/Thread -->
  <rect x="454" y="60" width="195" height="310" rx="8" fill="#0d2541" stroke="#22c55e" stroke-width="1" opacity="0.8"/>
  <rect x="454" y="60" width="195" height="35" rx="8" fill="#15803d" opacity="0.6"/>
  <text x="551" y="83" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="14" font-weight="bold">Matter / Thread</text>
  <text x="551" y="115" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">成熟度: ★★★☆☆</text>
  <line x1="474" y1="125" x2="629" y2="125" stroke="#334155" stroke-width="0.5"/>
  <text x="469" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">代表: Apple / Google / CSA</text>
  <text x="469" y="165" fill="#22c55e" font-family="monospace" font-size="10">最大设备: 250+</text>
  <text x="469" y="185" fill="#f59e0b" font-family="monospace" font-size="10">待机功耗: ~0.5W</text>
  <text x="469" y="205" fill="#f59e0b" font-family="monospace" font-size="10">穿墙: 良好 (Sub-GHz)</text>
  <text x="469" y="225" fill="#22c55e" font-family="monospace" font-size="10">蓝牙直连: Matter 1.4</text>
  <text x="469" y="245" fill="#22c55e" font-family="monospace" font-size="10">断网可用: 是</text>
  <text x="469" y="265" fill="#f59e0b" font-family="monospace" font-size="10">需协调器: Border Router</text>
  <line x1="474" y1="275" x2="629" y2="275" stroke="#334155" stroke-width="0.5"/>
  <text x="469" y="295" fill="#94a3b8" font-family="monospace" font-size="9">跨平台互通最强</text>
  <text x="469" y="310" fill="#94a3b8" font-family="monospace" font-size="9">设备生态增长中</text>
  <text x="469" y="330" fill="#94a3b8" font-family="monospace" font-size="9">价格偏高</text>
  <text x="469" y="358" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">推荐: 未来布局</text>
</svg>
