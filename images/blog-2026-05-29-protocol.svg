  <text x="207" y="165" fill="#00d4aa" font-family="Arial,sans-serif" font-size="10">✓ 自组网自愈</text>
  <text x="207" y="183" fill="#00d4aa" font-family="Arial,sans-serif" font-size="10">✓ 低功耗长距</text>
  <text x="207" y="201" fill="#00d4aa" font-family="Arial,sans-serif" font-size="10">✓ 100+设备</text>
