<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Consolas, Monaco, monospace">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1b30"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00cc66" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#grid1)"/>
  <text x="400" y="40" text-anchor="middle" fill="#5db8e8" font-size="20" font-weight="bold">智能灯控制链路对比：云端依赖 vs 本地 Mesh</text>

  <!-- 左侧：云端依赖链路 (失败) -->
  <g transform="translate(50, 100)">
    <text x="160" y="0" text-anchor="middle" fill="#ff6666" font-size="16" font-weight="bold">☁️ 云端依赖型（WiFi 智能灯）</text>
    <text x="160" y="20" text-anchor="middle" fill="#ffaa66" font-size="11">服务器一崩 = 全屋失灵</text>

    <!-- 节点：手机 -->
    <rect x="10" y="60" width="80" height="50" rx="6" fill="#1a3a5a" stroke="#5db8e8" stroke-width="1.5"/>
    <text x="50" y="90" text-anchor="middle" fill="#5db8e8" font-size="11">📱 手机</text>

    <!-- 节点：互联网 -->
    <rect x="120" y="60" width="80" height="50" rx="6" fill="#1a3a5a" stroke="#5db8e8" stroke-width="1.5"/>
    <text x="160" y="85" text-anchor="middle" fill="#5db8e8" font-size="10">🌐 互联网</text>
    <text x="160" y="98" text-anchor="middle" fill="#5db8e8" font-size="9">不稳定</text>

    <!-- 节点：云端服务器（红色X） -->
    <rect x="230" y="60" width="80" height="50" rx="6" fill="#3a1a1a" stroke="url(#cloudGrad)" stroke-width="2"/>
    <text x="270" y="85" text-anchor="middle" fill="#ff6644" font-size="10">☁️ 云端服务器</text>
    <text x="270" y="100" text-anchor="middle" fill="#ff4444" font-size="11" font-weight="bold">✖ 故障</text>

    <!-- 节点：路由器 -->
    <rect x="10" y="170" width="80" height="50" rx="6" fill="#1a3a5a" stroke="#5db8e8" stroke-width="1.5"/>
    <text x="50" y="200" text-anchor="middle" fill="#5db8e8" font-size="11">📡 WiFi 路由</text>

    <!-- 节点：灯泡（灰） -->
    <rect x="120" y="170" width="80" height="50" rx="6" fill="#2a2a2a" stroke="#666666" stroke-width="1.5"/>
    <text x="160" y="200" text-anchor="middle" fill="#888888" font-size="11">💡 灯泡</text>
    <text x="160" y="215" text-anchor="middle" fill="#ff4444" font-size="9">失灵</text>

    <!-- 节点：App -->
    <rect x="230" y="170" width="80" height="50" rx="6" fill="#1a3a5a" stroke="#5db8e8" stroke-width="1.5"/>
    <text x="270" y="200" text-anchor="middle" fill="#5db8e8" font-size="10">🎙️ 语音助手</text>

    <!-- 箭头 -->
    <path d="M 90 85 L 120 85" stroke="#5db8e8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 200 85 L 230 85" stroke="#5db8e8" stroke-width="1.5" fill="none"/>
    <path d="M 270 110 L 270 170" stroke="#ff6644" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <path d="M 50 110 L 50 170" stroke="#5db8e8" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <path d="M 90 195 L 120 195" stroke="#666666" stroke-width="1.5" fill="none"/>
    <path d="M 230 195 L 270 195" stroke="#666666" stroke-width="1.5" fill="none"/>

    <text x="160" y="270" text-anchor="middle" fill="#ff6644" font-size="13" font-weight="bold">链路 5 跳，任何 1 跳挂 = 全部失灵</text>
    <text x="160" y="290" text-anchor="middle" fill="#ffaa66" font-size="11">2026.6.29 美的云端故障 4 天，10 万+用户受害</text>
    <text x="160" y="310" text-anchor="middle" fill="#ffaa66" font-size="11">WiFi 智能灯同理——服务器崩 = 你连开关都用不了</text>
  </g>

  <!-- 分隔线 -->
  <line x1="400" y1="100" x2="400" y2="430" stroke="#5db8e8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- 右侧：本地Mesh (成功) -->
  <g transform="translate(420, 100)">
    <text x="170" y="0" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold">🕸️ 本地 Mesh 型（Zigbee / 涂鸦）</text>
    <text x="170" y="20" text-anchor="middle" fill="#88ffaa" font-size="11">断云照常用，网关本地执行场景</text>

    <!-- 节点：手机/开关 -->
    <rect x="20" y="60" width="80" height="50" rx="6" fill="#1a3a3a" stroke="#00ff88" stroke-width="1.5"/>
    <text x="60" y="90" text-anchor="middle" fill="#88ffcc" font-size="11">📱 开关/手机</text>

    <!-- 节点：Zigbee 网关（本地） -->
    <rect x="140" y="60" width="100" height="50" rx="6" fill="#0a3a2a" stroke="#00ff88" stroke-width="2"/>
    <text x="190" y="85" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">🛡️ Zigbee 网关</text>
    <text x="190" y="100" text-anchor="middle" fill="#88ffaa" font-size="9">本地存储场景</text>

    <!-- 节点：云端（虚线，断开） -->
    <rect x="20" y="170" width="80" height="50" rx="6" fill="#2a2a2a" stroke="#666666" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="60" y="195" text-anchor="middle" fill="#888888" font-size="10">☁️ 云端</text>
    <text x="60" y="210" text-anchor="middle" fill="#666666" font-size="9">断开无影响</text>

    <!-- 灯泡群（Mesh） -->
    <circle cx="200" cy="180" r="15" fill="#1a3a2a" stroke="#00ff88" stroke-width="1.5"/>
    <text x="200" y="185" text-anchor="middle" fill="#88ffcc" font-size="11">💡</text>
    <circle cx="260" cy="160" r="15" fill="#1a3a2a" stroke="#00ff88" stroke-width="1.5"/>
    <text x="260" y="165" text-anchor="middle" fill="#88ffcc" font-size="11">💡</text>
    <circle cx="260" cy="210" r="15" fill="#1a3a2a" stroke="#00ff88" stroke-width="1.5"/>
    <text x="260" y="215" text-anchor="middle" fill="#88ffcc" font-size="11">💡</text>
    <circle cx="320" cy="185" r="15" fill="#1a3a2a" stroke="#00ff88" stroke-width="1.5"/>
    <text x="320" y="190" text-anchor="middle" fill="#88ffcc" font-size="11">💡</text>

    <!-- Mesh 连接线 -->
    <line x1="200" y1="180" x2="260" y2="160" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
    <line x1="200" y1="180" x2="260" y2="210" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
    <line x1="260" y1="160" x2="320" y2="185" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
    <line x1="260" y1="210" x2="320" y2="185" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
    <line x1="190" y1="110" x2="200" y2="165" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="100" y1="85" x2="140" y2="85" stroke="#00ff88" stroke-width="1.5"/>

    <!-- 无线开关直接控灯 -->
    <path d="M 60 110 L 200 165" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>

    <text x="170" y="270" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="bold">云端是"锦上添花"而非"唯一通道"</text>
    <text x="170" y="290" text-anchor="middle" fill="#88ffaa" font-size="11">灯泡互相中继自愈网，单点故障不影响其他</text>
    <text x="170" y="310" text-anchor="middle" fill="#88ffaa" font-size="11">网关本地存储场景，离线照常执行</text>
  </g>

  <!-- 底部结论 -->
  <rect x="50" y="450" width="700" height="40" rx="4" fill="#0a2a3a" stroke="#5db8e8" stroke-width="1"/>
  <text x="400" y="475" text-anchor="middle" fill="#5db8e8" font-size="14" font-weight="bold">结论：选智能灯，先问一句"它能断网用吗？"</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#5db8e8"/>
    </marker>
  </defs>
</svg>
