<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Circadian curve - S shaped -->
  <path d="M 100,350 C 200,350 250,350 300,300 S 400,100 500,100 S 600,300 700,350" fill="none" stroke="url(#warmGlow)" stroke-width="3" filter="url(#glow)"/>
  <!-- Fill area under curve -->
  <path d="M 100,350 C 200,350 250,350 300,300 S 400,100 500,100 S 600,300 700,350 L 700,380 L 100,380 Z" fill="url(#warmGlow)" opacity="0.08"/>
  <!-- Time markers -->
  <g fill="#94a3b8" font-family="monospace" font-size="10" opacity="0.7">
    <text x="100" y="400" text-anchor="middle">6:00</text>
    <text x="200" y="400" text-anchor="middle">8:00</text>
    <text x="300" y="400" text-anchor="middle">10:00</text>
    <text x="400" y="400" text-anchor="middle">12:00</text>
    <text x="500" y="400" text-anchor="middle">14:00</text>
    <text x="600" y="400" text-anchor="middle">17:00</text>
    <text x="700" y="400" text-anchor="middle">21:00</text>
  </g>
  <!-- Y axis labels -->
  <g fill="#94a3b8" font-family="monospace" font-size="9" opacity="0.5">
    <text x="70" y="355" text-anchor="end">2700K</text>
    <text x="70" y="230" text-anchor="end">4000K</text>
    <text x="70" y="105" text-anchor="end">6500K</text>
  </g>
  <!-- Key points with labels -->
  <!-- Morning wake -->
  <circle cx="200" cy="330" r="6" fill="#facc15" filter="url(#glow)"/>
  <rect x="140" y="280" width="120" height="35" rx="4" fill="#0d2137" stroke="#facc15" stroke-width="1" opacity="0.9"/>
  <text x="200" y="295" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="8">晨起唤醒</text>
  <text x="200" y="308" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="7" opacity="0.7">4000K · 渐亮</text>
  <!-- Peak focus -->
  <circle cx="400" cy="120" r="6" fill="#60a5fa" filter="url(#glow)"/>
  <rect x="340" y="75" width="120" height="35" rx="4" fill="#0d2137" stroke="#60a5fa" stroke-width="1" opacity="0.9"/>
  <text x="400" y="90" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="8">高效专注</text>
  <text x="400" y="103" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="7" opacity="0.7">6500K · 高照度</text>
  <!-- Evening relax -->
  <circle cx="600" cy="280" r="6" fill="#ff8c42" filter="url(#glow)"/>
  <rect x="540" y="240" width="120" height="35" rx="4" fill="#0d2137" stroke="#ff8c42" stroke-width="1" opacity="0.9"/>
  <text x="600" y="255" text-anchor="middle" fill="#ff8c42" font-family="monospace" font-size="8">晚间放松</text>
  <text x="600" y="268" text-anchor="middle" fill="#ff8c42" font-family="monospace" font-size="7" opacity="0.7">3000K · 渐暗</text>
  <!-- Melatonin curve (dashed) -->
  <path d="M 100,200 C 200,180 300,280 400,320 S 600,120 700,160" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="720" y="155" fill="#a78bfa" font-family="monospace" font-size="8" opacity="0.6">褪黑素</text>
  <!-- Sun/Moon icons -->
  <circle cx="200" cy="50" r="12" fill="#facc15" opacity="0.4" filter="url(#softGlow)"/>
  <circle cx="200" cy="50" r="8" fill="#facc15" opacity="0.6"/>
  <circle cx="680" cy="50" r="10" fill="#94a3b8" opacity="0.3"/>
  <circle cx="680" cy="50" r="7" fill="#c4b5fd" opacity="0.4"/>
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12" opacity="0.9">节律照明 · 昼夜色温曲线</text>
  <text x="400" y="440" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" opacity="0.5">CIRCADIAN RHYTHM LIGHTING</text>
</svg>