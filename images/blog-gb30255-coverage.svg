<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2478C2"/>
      <stop offset="100%" stop-color="#1a5a9a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="680" height="420" fill="url(#bg)"/>
  <rect width="680" height="420" fill="url(#grid)"/>

  <!-- Title -->
  <text x="340" y="38" text-anchor="middle" fill="#64b5f6" font-family="monospace" font-size="16" font-weight="bold">GB 30255-2026 覆盖范围对比</text>
  <line x1="120" y1="48" x2="560" y2="48" stroke="#2478C2" stroke-width="1" opacity="0.3"/>

  <!-- Old Standard Box -->
  <rect x="40" y="70" width="280" height="310" rx="8" fill="#1a1a2e" stroke="#555" stroke-width="1" opacity="0.7"/>
  <rect x="40" y="70" width="280" height="34" rx="8" fill="#333" opacity="0.8"/>
  <text x="180" y="92" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">GB 30255-2019（旧版）</text>

  <text x="60" y="128" fill="#888" font-family="monospace" font-size="12">✅ 普通LED筒灯</text>
  <text x="60" y="152" fill="#888" font-family="monospace" font-size="12">✅ 部分定向LED灯</text>
  <text x="60" y="176" fill="#888" font-family="monospace" font-size="12">✅ 光束角 &gt;60° 筒灯</text>

  <line x1="60" y1="192" x2="300" y2="192" stroke="#444" stroke-width="0.5"/>

  <text x="60" y="216" fill="#e55" font-family="monospace" font-size="12">❌ 智能灯（调光/调色）</text>
  <text x="60" y="240" fill="#e55" font-family="monospace" font-size="12">❌ 高天棚灯</text>
  <text x="60" y="264" fill="#e55" font-family="monospace" font-size="12">❌ 替换型双端LED灯管</text>
  <text x="60" y="288" fill="#e55" font-family="monospace" font-size="12">❌ 无待机功耗要求</text>

  <text x="180" y="340" text-anchor="middle" fill="#666" font-family="monospace" font-size="11">覆盖约 40% 室内灯具</text>

  <!-- Arrow -->
  <polygon points="330,220 355,210 355,230" fill="#2478C2" opacity="0.6"/>
  <line x1="355" y1="220" x2="355" y2="220" stroke="#2478C2" stroke-width="2" opacity="0.3"/>

  <!-- New Standard Box -->
  <rect x="360" y="70" width="280" height="310" rx="8" fill="#0d2818" stroke="#22c55e" stroke-width="2" opacity="0.9"/>
  <rect x="360" y="70" width="280" height="34" rx="8" fill="#14522d" opacity="0.9"/>
  <text x="500" y="92" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">GB 30255-2026（新版）</text>

  <text x="380" y="128" fill="#4ade80" font-family="monospace" font-size="12">✅ 普通LED筒灯</text>
  <text x="380" y="152" fill="#4ade80" font-family="monospace" font-size="12">✅ 定向/非定向LED灯</text>
  <text x="380" y="176" fill="#4ade80" font-family="monospace" font-size="12" filter="url(#glow)">⭐ 智能灯首次纳入（调光/WiFi/Zigbee）</text>
  <text x="380" y="200" fill="#4ade80" font-family="monospace" font-size="12">✅ 光束角 ≥24° 全部筒灯</text>
  <text x="380" y="224" fill="#4ade80" font-family="monospace" font-size="12">✅ LED高天棚灯（工厂/仓库）</text>
  <text x="380" y="248" fill="#4ade80" font-family="monospace" font-size="12">✅ 替换型双端LED灯管</text>
  <text x="380" y="272" fill="#4ade80" font-family="monospace" font-size="12" filter="url(#glow)">⭐ 待机功耗 ≤2.5W 强制要求</text>
  <text x="380" y="296" fill="#4ade80" font-family="monospace" font-size="12">✅ 高显色产品能效修正</text>

  <text x="500" y="340" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">覆盖约 90% 室内灯具</text>

  <!-- Bottom note -->
  <text x="340" y="400" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">2027年9月1日强制执行 | 3级为市场准入门槛</text>
</svg>