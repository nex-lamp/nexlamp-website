<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a3a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#0a1628"/>
  <rect width="800" height="450" fill="url(#grid1)"/>

  <!-- 标题区 -->
  <rect x="20" y="20" width="760" height="50" rx="4" fill="#0d1f35" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="44" cy="45" r="8" fill="#ff5f56"/>
  <circle cx="66" cy="45" r="8" fill="#ffbd2e"/>
  <circle cx="88" cy="45" r="8" fill="#27c93f"/>
  <text x="120" y="51" font-family="'Courier New', monospace" font-size="14" fill="#4fc3f7">
    $ zigbee-diag --scan-network --verbose
  </text>

  <!-- 网络拓扑图标题 -->
  <text x="400" y="110" font-family="'Courier New', monospace" font-size="13" fill="#64b5f6" text-anchor="middle">[ ZIGBEE MESH NETWORK TOPOLOGY ]</text>

  <!-- 网关节点 -->
  <circle cx="400" cy="200" r="32" fill="#0d2744" stroke="#00e5ff" stroke-width="2" filter="url(#glow1)"/>
  <text x="400" y="196" font-family="'Courier New', monospace" font-size="10" fill="#00e5ff" text-anchor="middle">GATEWAY</text>
  <text x="400" y="210" font-family="'Courier New', monospace" font-size="9" fill="#4fc3f7" text-anchor="middle">192.168.1.1</text>

  <!-- 路由器节点 -->
  <circle cx="200" cy="200" r="24" fill="#0d2744" stroke="#69f0ae" stroke-width="2" filter="url(#glow1)"/>
  <text x="200" y="197" font-family="'Courier New', monospace" font-size="9" fill="#69f0ae" text-anchor="middle">ROUTER</text>
  <text x="200" y="209" font-family="'Courier New', monospace" font-size="8" fill="#a5d6a7" text-anchor="middle">BULB-01</text>

  <circle cx="600" cy="200" r="24" fill="#0d2744" stroke="#69f0ae" stroke-width="2" filter="url(#glow1)"/>
  <text x="600" y="197" font-family="'Courier New', monospace" font-size="9" fill="#69f0ae" text-anchor="middle">ROUTER</text>
  <text x="600" y="209" font-family="'Courier New', monospace" font-size="8" fill="#a5d6a7" text-anchor="middle">BULB-03</text>

  <!-- 离线节点 -->
  <circle cx="130" cy="310" r="22" fill="#1a0a0a" stroke="#ff5252" stroke-width="2"/>
  <text x="130" y="307" font-family="'Courier New', monospace" font-size="9" fill="#ff5252" text-anchor="middle">OFFLINE</text>
  <text x="130" y="319" font-family="'Courier New', monospace" font-size="8" fill="#ef9a9a" text-anchor="middle">BULB-02</text>

  <circle cx="320" cy="310" r="22" fill="#0d2744" stroke="#ffb74d" stroke-width="2"/>
  <text x="320" y="307" font-family="'Courier New', monospace" font-size="9" fill="#ffb74d" text-anchor="middle">WEAK</text>
  <text x="320" y="319" font-family="'Courier New', monospace" font-size="8" fill="#ffe0b2" text-anchor="middle">DIMMER-1</text>

  <circle cx="480" cy="310" r="22" fill="#0d2744" stroke="#69f0ae" stroke-width="2" filter="url(#glow1)"/>
  <text x="480" y="307" font-family="'Courier New', monospace" font-size="9" fill="#69f0ae" text-anchor="middle">ONLINE</text>
  <text x="480" y="319" font-family="'Courier New', monospace" font-size="8" fill="#a5d6a7" text-anchor="middle">SWITCH-A</text>

  <circle cx="660" cy="310" r="22" fill="#0d2744" stroke="#69f0ae" stroke-width="2" filter="url(#glow1)"/>
  <text x="660" y="307" font-family="'Courier New', monospace" font-size="9" fill="#69f0ae" text-anchor="middle">ONLINE</text>
  <text x="660" y="319" font-family="'Courier New', monospace" font-size="8" fill="#a5d6a7" text-anchor="middle">SWITCH-B</text>

  <!-- 连接线 -->
  <line x1="368" y1="200" x2="224" y2="200" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.8"/>
  <line x1="432" y1="200" x2="576" y2="200" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.8"/>
  <line x1="184" y1="220" x2="148" y2="292" stroke="#ff5252" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="200" y1="224" x2="296" y2="292" stroke="#ffb74d" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="392" y1="228" x2="448" y2="292" stroke="#69f0ae" stroke-width="1.5" opacity="0.7"/>
  <line x1="584" y1="220" x2="508" y2="292" stroke="#69f0ae" stroke-width="1.5" opacity="0.7"/>
  <line x1="616" y1="220" x2="644" y2="292" stroke="#69f0ae" stroke-width="1.5" opacity="0.7"/>

  <!-- 信号强度图例 -->
  <rect x="30" y="360" width="740" height="70" rx="4" fill="#0d1f35" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>
  <text x="50" y="380" font-family="'Courier New', monospace" font-size="10" fill="#64b5f6">SIGNAL LEGEND:</text>
  <circle cx="180" cy="376" r="7" fill="none" stroke="#69f0ae" stroke-width="2"/>
  <text x="195" y="380" font-family="'Courier New', monospace" font-size="10" fill="#a5d6a7">ONLINE (-60 to -80 dBm)</text>
  <circle cx="420" cy="376" r="7" fill="none" stroke="#ffb74d" stroke-width="2"/>
  <text x="435" y="380" font-family="'Courier New', monospace" font-size="10" fill="#ffe0b2">WEAK (&lt; -90 dBm)</text>
  <circle cx="620" cy="376" r="7" fill="#1a0a0a" stroke="#ff5252" stroke-width="2"/>
  <text x="635" y="380" font-family="'Courier New', monospace" font-size="10" fill="#ef9a9a">OFFLINE</text>
  <text x="50" y="415" font-family="'Courier New', monospace" font-size="10" fill="#546e7a">TIP: Add router-capable bulbs between gateway and offline devices to extend mesh coverage</text>
</svg>
