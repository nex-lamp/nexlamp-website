<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ec27e"/>
      <stop offset="100%" stop-color="#5b8c5a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="340" fill="url(#bg)"/>
  <text x="340" y="36" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">GB 30255-2026 三大核心变化</text>
  <line x1="60" y1="56" x2="620" y2="56" stroke="#30363d" stroke-width="1"/>
  <g transform="translate(60, 90)">
    <rect width="170" height="200" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <circle cx="85" cy="50" r="28" fill="url(#accent)" opacity="0.18"/>
    <text x="85" y="58" text-anchor="middle" fill="#7ec27e" font-family="system-ui, sans-serif" font-size="24" font-weight="700">01</text>
    <text x="85" y="110" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="15" font-weight="600">覆盖范围扩大</text>
    <text x="85" y="140" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">调光、调色、感应</text>
    <text x="85" y="160" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">智能照明首次纳入</text>
  </g>
  <g transform="translate(255, 90)">
    <rect width="170" height="200" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <circle cx="85" cy="50" r="28" fill="url(#accent)" opacity="0.18"/>
    <text x="85" y="58" text-anchor="middle" fill="#7ec27e" font-family="system-ui, sans-serif" font-size="24" font-weight="700">02</text>
    <text x="85" y="110" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="15" font-weight="600">能效指标收紧</text>
    <text x="85" y="140" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">1-3级全面加严</text>
    <text x="85" y="160" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">细分备案防擦边</text>
  </g>
  <g transform="translate(450, 90)">
    <rect width="170" height="200" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <circle cx="85" cy="50" r="28" fill="url(#accent)" opacity="0.18"/>
    <text x="85" y="58" text-anchor="middle" fill="#7ec27e" font-family="system-ui, sans-serif" font-size="24" font-weight="700">03</text>
    <text x="85" y="110" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="15" font-weight="600">新增待机功耗</text>
    <text x="85" y="140" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">关灯≠不耗电</text>
    <text x="85" y="160" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12">驱动设计必须改</text>
  </g>
  <text x="340" y="320" text-anchor="middle" fill="#5b8c5a" font-family="system-ui, sans-serif" font-size="12" filter="url(#glow)">2027-09-01 正式实施 · 25个月过渡期</text>
</svg>
