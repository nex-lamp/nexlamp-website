<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#grad1)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="20" font-weight="bold" filter="url(#glow)">Zigbee RSSI 信号强度与掉线风险关系</text>
  <line x1="200" y1="50" x2="600" y2="50" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>

  <!-- Bar chart area -->
  <!-- Axis -->
  <line x1="80" y1="400" x2="750" y2="400" stroke="#2a3a5a" stroke-width="1"/>
  <line x1="80" y1="90" x2="80" y2="400" stroke="#2a3a5a" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="70" y="105" text-anchor="end" fill="#667788" font-family="monospace" font-size="11">-40 dBm</text>
  <line x1="80" y1="100" x2="750" y2="100" stroke="#1a2a4a" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="70" y="180" text-anchor="end" fill="#667788" font-family="monospace" font-size="11">-60 dBm</text>
  <line x1="80" y1="175" x2="750" y2="175" stroke="#1a2a4a" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="70" y="255" text-anchor="end" fill="#667788" font-family="monospace" font-size="11">-70 dBm</text>
  <line x1="80" y1="250" x2="750" y2="250" stroke="#1a2a4a" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="70" y="330" text-anchor="end" fill="#667788" font-family="monospace" font-size="11">-78 dBm</text>
  <line x1="80" y1="325" x2="750" y2="325" stroke="#1a2a4a" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="70" y="405" text-anchor="end" fill="#667788" font-family="monospace" font-size="11">-90 dBm</text>

  <!-- Bar 1: Excellent -->
  <rect x="120" y="100" width="130" height="300" rx="4" fill="#00ff88" opacity="0.7"/>
  <text x="185" y="85" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="13" font-weight="bold" filter="url(#glow)">优秀</text>
  <text x="185" y="430" text-anchor="middle" fill="#8899bb" font-family="monospace" font-size="12">-40 ~ -60</text>
  <text x="185" y="450" text-anchor="middle" fill="#667788" font-family="monospace" font-size="10">几乎不掉线</text>
  <text x="185" y="468" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">信号强，低延迟</text>

  <!-- Signal bar indicator -->
  <rect x="270" y="175" width="90" height="225" rx="4" fill="#4dff88" opacity="0.5"/>
  <text x="315" y="430" text-anchor="middle" fill="#8899bb" font-family="monospace" font-size="12">-60 ~ -70</text>
  <text x="315" y="450" text-anchor="middle" fill="#667788" font-family="monospace" font-size="10">良好</text>
  <text x="315" y="468" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">偶有延迟</text>

  <!-- Bar 3: Weak -->
  <rect x="380" y="250" width="90" height="150" rx="4" fill="#ffaa00" opacity="0.6"/>
  <text x="425" y="430" text-anchor="middle" fill="#8899bb" font-family="monospace" font-size="12">-70 ~ -78</text>
  <text x="425" y="450" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="10">勉强 ⚠</text>
  <text x="425" y="468" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">间歇掉线</text>

  <!-- Bar 4: Critical -->
  <rect x="490" y="325" width="90" height="75" rx="4" fill="#ff4466" opacity="0.7"/>
  <text x="535" y="430" text-anchor="middle" fill="#8899bb" font-family="monospace" font-size="12">-78 ~ -90</text>
  <text x="535" y="450" text-anchor="middle" fill="#ff4466" font-family="monospace" font-size="10">高危!!</text>
  <text x="535" y="468" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">频繁离线</text>

  <!-- Priority indicators -->
  <!-- Excellent - green check -->
  <circle cx="185" cy="485" r="6" fill="#00ff88" opacity="0.8"/>
  <text x="197" y="489" fill="#00ff88" font-family="monospace" font-size="11">放心使用，无需优化</text>

  <circle cx="480" cy="485" r="4" fill="#ffaa00" opacity="0.8"/>
  <text x="492" y="489" fill="#ffaa00" font-family="monospace" font-size="11">建议加中继或移网关</text>

  <circle cx="760" cy="485" r="4" fill="#ff4466" opacity="0.8"/>
  <text x="772" y="489" fill="#ff4466" font-family="monospace" font-size="11">立即处理</text>

  <!-- Terminal style corner -->
  <text x="760" y="490" text-anchor="end" fill="#334466" font-family="monospace" font-size="9">nexlamp.com</text>
</svg>