<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#1a3a5c" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="800" y2="350"/>
    <line x1="200" y1="0" x2="800" y2="250"/>
    <line x1="0" y1="100" x2="700" y2="450"/>
    <line x1="0" y1="200" x2="600" y2="450"/>
    <line x1="800" y1="0" x2="0" y2="450"/>
    <line x1="700" y1="0" x2="0" y2="350"/>
    <line x1="600" y1="0" x2="0" y2="250"/>
    <line x1="800" y1="100" x2="100" y2="450"/>
    <line x1="800" y1="200" x2="200" y2="450"/>
  </g>
  <!-- Central AI Brain -->
  <circle cx="400" cy="200" r="60" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#glow2)"/>
  <circle cx="400" cy="200" r="45" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  <circle cx="400" cy="200" r="30" fill="#00d4ff" opacity="0.15"/>
  <text x="400" y="195" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14" font-weight="bold">AI</text>
  <text x="400" y="212" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" opacity="0.8">BRAIN</text>
  <!-- Sensor Nodes -->
  <circle cx="200" cy="120" r="20" fill="none" stroke="#ff6b35" stroke-width="1.5" filter="url(#glow)"/>
  <text x="200" y="124" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="8">PIR</text>
  <circle cx="600" cy="120" r="20" fill="none" stroke="#ff6b35" stroke-width="1.5" filter="url(#glow)"/>
  <text x="600" y="124" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="8">LUX</text>
  <circle cx="160" cy="280" r="20" fill="none" stroke="#ff6b35" stroke-width="1.5" filter="url(#glow)"/>
  <text x="160" y="284" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="8">TEMP</text>
  <circle cx="640" cy="280" r="20" fill="none" stroke="#ff6b35" stroke-width="1.5" filter="url(#glow)"/>
  <text x="640" y="284" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="8">HR</text>
  <!-- Connections: Sensors to AI -->
  <line x1="220" y1="120" x2="340" y2="190" stroke="#ff6b35" stroke-width="1" opacity="0.5" stroke-dasharray="4 3"/>
  <line x1="580" y1="120" x2="460" y2="190" stroke="#ff6b35" stroke-width="1" opacity="0.5" stroke-dasharray="4 3"/>
  <line x1="180" y1="280" x2="350" y2="215" stroke="#ff6b35" stroke-width="1" opacity="0.5" stroke-dasharray="4 3"/>
  <line x1="620" y1="280" x2="450" y2="215" stroke="#ff6b35" stroke-width="1" opacity="0.5" stroke-dasharray="4 3"/>
  <!-- Light Output Nodes -->
  <rect x="280" y="340" width="60" height="30" rx="4" fill="none" stroke="#4ade80" stroke-width="1.5" filter="url(#glow)"/>
  <text x="310" y="360" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8">2700K</text>
  <rect x="370" y="340" width="60" height="30" rx="4" fill="none" stroke="#facc15" stroke-width="1.5" filter="url(#glow)"/>
  <text x="400" y="360" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="8">4000K</text>
  <rect x="460" y="340" width="60" height="30" rx="4" fill="none" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow)"/>
  <text x="490" y="360" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="8">6500K</text>
  <!-- Connections: AI to Outputs -->
  <line x1="370" y1="250" x2="310" y2="340" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="260" x2="400" y2="340" stroke="#facc15" stroke-width="1" opacity="0.5"/>
  <line x1="430" y1="250" x2="490" y2="340" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
  <!-- Data flow arrows -->
  <polygon points="340,185 348,189 340,193" fill="#ff6b35" opacity="0.7"/>
  <polygon points="460,185 452,189 460,193" fill="#ff6b35" opacity="0.7"/>
  <!-- Title -->
  <text x="400" y="420" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11" opacity="0.8">场景自适应 · 多传感器融合 · AI决策引擎</text>
  <text x="400" y="440" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" opacity="0.5">SCENE ADAPTIVE LIGHTING</text>
</svg>