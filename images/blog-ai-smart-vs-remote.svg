<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2478c2"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>
  
  <!-- 网格线 -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="40" x2="680" y2="40"/><line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="200" x2="680" y2="200"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="280" x2="680" y2="280"/><line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="40" y1="0" x2="40" y2="400"/><line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="440" y1="0" x2="440" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="520" y1="0" x2="520" y2="400"/><line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- 标题 -->
  <text x="340" y="35" fill="#00d4ff" font-size="16" font-family="monospace" text-anchor="middle" filter="url(#glow)">REMOTE SWITCH vs TRUE SMART LIGHTING</text>

  <!-- 左侧：远程开关 -->
  <g transform="translate(80,70)">
    <!-- 手机图标 -->
    <rect x="30" y="10" width="50" height="80" rx="8" fill="#1a3050" stroke="#ff6b35" stroke-width="1.5"/>
    <rect x="38" y="20" width="34" height="50" fill="#0a1628"/>
    <circle cx="55" cy="78" r="5" fill="#ff6b35" opacity="0.5"/>
    <!-- WiFi信号 -->
    <path d="M55,25 Q55,35 55,40" stroke="#ff6b35" stroke-width="1" fill="none"/>
    <path d="M45,30 Q55,20 65,30" stroke="#ff6b35" stroke-width="1" fill="none"/>
    <path d="M35,25 Q55,15 75,25" stroke="#ff6b35" stroke-width="1" fill="none"/>
    
    <!-- 灯泡 -->
    <ellipse cx="55" cy="120" rx="20" ry="20" fill="#ff6b35" opacity="0.3" filter="url(#softGlow)"/>
    <ellipse cx="55" cy="120" rx="15" ry="15" fill="#ff6b35" opacity="0.6"/>
    <rect x="45" y="135" width="20" height="15" rx="3" fill="#ff6b35" opacity="0.4"/>
    
    <!-- 连接线 -->
    <line x1="55" y1="85" x2="55" y2="105" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- 标签 -->
    <text x="55" y="175" fill="#ff6b35" font-size="11" font-family="monospace" text-anchor="middle">WiFi Remote</text>
    <text x="55" y="190" fill="#ff6b35" font-size="9" font-family="monospace" text-anchor="middle" opacity="0.7">3-5W standby</text>
  </g>

  <!-- 中间分隔线 -->
  <line x1="340" y1="60" x2="340" y2="350" stroke="#2478c2" stroke-width="1" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="340" y="55" fill="#7ec27e" font-size="12" font-family="monospace" text-anchor="middle">VS</text>

  <!-- 右侧：真正智能 -->
  <g transform="translate(420,70)">
    <!-- AI大脑 -->
    <circle cx="55" cy="50" r="25" fill="#0d2137" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
    <text x="55" y="48" fill="#00d4ff" font-size="12" font-family="monospace" text-anchor="middle">AI</text>
    <text x="55" y="62" fill="#00d4ff" font-size="8" font-family="monospace" text-anchor="middle">感知+自适应</text>
    
    <!-- 感知信号 -->
    <path d="M30,50 Q55,30 80,50" stroke="#00d4ff" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M20,50 Q55,20 90,50" stroke="#00d4ff" stroke-width="0.8" fill="none" opacity="0.3"/>
    
    <!-- 网关 -->
    <rect x="25" y="85" width="60" height="30" rx="5" fill="#1a3050" stroke="#2478c2" stroke-width="1.5"/>
    <text x="55" y="105" fill="#2478c2" font-size="9" font-family="monospace" text-anchor="middle">Zigbee GW</text>
    
    <!-- 智能灯 -->
    <ellipse cx="55" cy="140" rx="25" ry="25" fill="#00d4ff" opacity="0.2" filter="url(#softGlow)"/>
    <ellipse cx="55" cy="140" rx="18" ry="18" fill="#00d4ff" opacity="0.4"/>
    <ellipse cx="55" cy="140" rx="12" ry="12" fill="#7ec27e" opacity="0.8"/>
    <rect x="43" y="155" width="24" height="15" rx="3" fill="#2478c2" opacity="0.6"/>
    
    <!-- 连接线 -->
    <line x1="55" y1="75" x2="55" y2="85" stroke="#00d4ff" stroke-width="1.5"/>
    <line x1="55" y1="115" x2="55" y2="125" stroke="#2478c2" stroke-width="1.5"/>
    
    <!-- 标签 -->
    <text x="55" y="190" fill="#00d4ff" font-size="11" font-family="monospace" text-anchor="middle">Zigbee Mesh</text>
    <text x="55" y="205" fill="#00d4ff" font-size="9" font-family="monospace" text-anchor="middle" opacity="0.7">0.1W standby</text>
  </g>

  <!-- 对比数据区 -->
  <g transform="translate(100,250)">
    <!-- 远程开关标签 -->
    <rect x="0" y="0" width="120" height="25" rx="3" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="0.5"/>
    <text x="60" y="17" fill="#ff6b35" font-size="9" font-family="monospace" text-anchor="middle">单灯单控 | 断网失联</text>
    
    <rect x="0" y="30" width="120" height="25" rx="3" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="0.5"/>
    <text x="60" y="47" fill="#ff6b35" font-size="9" font-family="monospace" text-anchor="middle">3档亮度 | 固定色温</text>
    
    <rect x="0" y="60" width="120" height="25" rx="3" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="0.5"/>
    <text x="60" y="77" fill="#ff6b35" font-size="9" font-family="monospace" text-anchor="middle">Ra80 | 可能频闪</text>
  </g>
  
  <g transform="translate(460,250)">
    <!-- 真正智能标签 -->
    <rect x="0" y="0" width="120" height="25" rx="3" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="60" y="17" fill="#00d4ff" font-size="9" font-family="monospace" text-anchor="middle">场景联动 | 本地可控</text>
    
    <rect x="0" y="30" width="120" height="25" rx="3" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="60" y="47" fill="#00d4ff" font-size="9" font-family="monospace" text-anchor="middle">无级调光 | 节律色温</text>
    
    <rect x="0" y="60" width="120" height="25" rx="3" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="60" y="77" fill="#00d4ff" font-size="9" font-family="monospace" text-anchor="middle">Ra95+ | 无频闪</text>
  </g>

  <!-- 底部结论 -->
  <rect x="170" y="355" width="340" height="30" rx="5" fill="#7ec27e" opacity="0.2" stroke="#7ec27e" stroke-width="1"/>
  <text x="340" y="375" fill="#7ec27e" font-size="11" font-family="monospace" text-anchor="middle" filter="url(#glow)">真正智能灯 = 灯懂你 ≠ 你控制灯</text>
</svg>