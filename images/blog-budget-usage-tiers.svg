<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bgTr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="rowTr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101f38"/>
      <stop offset="1" stop-color="#132542"/>
    </linearGradient>
    <filter id="glowTr" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="420" fill="url(#bgTr)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="85" y1="0" x2="85" y2="420"/><line x1="170" y1="0" x2="170" y2="420"/>
    <line x1="255" y1="0" x2="255" y2="420"/><line x1="340" y1="0" x2="340" y2="420"/>
    <line x1="425" y1="0" x2="425" y2="420"/><line x1="510" y1="0" x2="510" y2="420"/>
    <line x1="595" y1="0" x2="595" y2="420"/>
  </g>

  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="23" font-weight="bold" filter="url(#glowTr)">按触发频率分三档，钱花对地方</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <rect x="34" y="62" width="612" height="34" rx="8" fill="#152a4a"/>
  <text x="52" y="84" fill="#9db8d9" font-family="sans-serif" font-size="13" font-weight="bold">档位</text>
  <text x="180" y="84" fill="#9db8d9" font-family="sans-serif" font-size="13" font-weight="bold">该配什么点位</text>
  <text x="410" y="84" fill="#9db8d9" font-family="sans-serif" font-size="13" font-weight="bold">驱动 / 灯具怎么选</text>

  <rect x="34" y="106" width="612" height="70" rx="8" fill="#122a1e" stroke="#7ec27e" stroke-width="1.4"/>
  <text x="52" y="134" fill="#7ec27e" font-family="sans-serif" font-size="15" font-weight="bold">日用档</text>
  <text x="52" y="158" fill="#e8f4e8" font-family="sans-serif" font-size="11.5">一天按好几次</text>
  <text x="180" y="134" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">客厅主灯 ｜ 餐厅</text>
  <text x="180" y="156" fill="#c8d8ea" font-family="sans-serif" font-size="12.5">主卧 ｜ 常用走廊</text>
  <text x="410" y="134" fill="#e8f4e8" font-family="sans-serif" font-size="12">要调光调色，上恒流驱动</text>
  <text x="410" y="156" fill="#9db8d9" font-family="sans-serif" font-size="11.5">驱动必须支持对应调光协议</text>

  <rect x="34" y="186" width="612" height="70" rx="8" fill="url(#rowTr)" stroke="#5cc8e8" stroke-width="1"/>
  <text x="52" y="214" fill="#5cc8e8" font-family="sans-serif" font-size="15" font-weight="bold">保险档</text>
  <text x="52" y="238" fill="#c8d8ea" font-family="sans-serif" font-size="11.5">偶尔进一次场景</text>
  <text x="180" y="214" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">次卧 ｜ 书房 ｜ 玄关</text>
  <text x="180" y="236" fill="#9db8d9" font-family="sans-serif" font-size="11.5">用得不勤，但要联得上</text>
  <text x="410" y="214" fill="#e8f4e8" font-family="sans-serif" font-size="12">智能开关 + 几路调光</text>
  <text x="410" y="236" fill="#9db8d9" font-family="sans-serif" font-size="11.5">够用，不必堆料</text>

  <rect x="34" y="266" width="612" height="70" rx="8" fill="#141d2c" stroke="#6f88a8" stroke-width="1"/>
  <text x="52" y="294" fill="#9db8d9" font-family="sans-serif" font-size="15" font-weight="bold">体验档</text>
  <text x="52" y="318" fill="#6f88a8" font-family="sans-serif" font-size="11.5">一年按不到几次</text>
  <text x="180" y="294" fill="#c8d8ea" font-family="sans-serif" font-size="12.5">储物间 ｜ 阳台 ｜ 客卫</text>
  <text x="180" y="316" fill="#6f88a8" font-family="sans-serif" font-size="11.5">砍掉智能，省下来最实在</text>
  <text x="410" y="294" fill="#c8d8ea" font-family="sans-serif" font-size="12">普通高显灯就够</text>
  <text x="410" y="316" fill="#6f88a8" font-family="sans-serif" font-size="11.5">不必上智能</text>

  <rect x="34" y="348" width="612" height="56" rx="8" fill="#152a4a" stroke="#3d5a80" stroke-width="1"/>
  <text x="52" y="372" fill="#7ec27e" font-family="sans-serif" font-size="12.5" font-weight="bold">两档报价口径（含灯具 + 调光模块 + 施工）</text>
  <text x="52" y="394" fill="#e8f4e8" font-family="sans-serif" font-size="12">全屋调光（三房两厅）：1.8 万 - 3 万　　基础版（原灯 + 智能开关 + 几路调光）：6000 - 8000</text>
</svg>
