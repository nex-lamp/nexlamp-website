<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="460" fill="url(#bg2)"/>
  <!-- Grid -->
  <g opacity="0.06" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="460"/><line x1="400" y1="0" x2="400" y2="460"/>
    <line x1="600" y1="0" x2="600" y2="460"/>
  </g>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="monospace" font-size="16" fill="#4fc3f7" filter="url(#glow2)">SCENARIO SELECTION GUIDE</text>
  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b8dad">不同场景下的协议选择决策树</text>
  <!-- Root node -->
  <rect x="320" y="80" width="160" height="36" rx="6" fill="rgba(79,195,247,0.15)" stroke="#4fc3f7" stroke-width="0.8"/>
  <text x="400" y="103" text-anchor="middle" font-family="monospace" font-size="12" fill="#4fc3f7">你的项目？</text>
  <!-- Left branch: Home -->
  <line x1="360" y1="116" x2="200" y2="146" stroke="#2196f3" stroke-width="1" opacity="0.6"/>
  <text x="270" y="136" font-family="sans-serif" font-size="9" fill="#64b5f6">家用</text>
  <rect x="130" y="146" width="140" height="32" rx="6" fill="rgba(33,150,243,0.12)" stroke="#2196f3" stroke-width="0.8"/>
  <text x="200" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64b5f6">设备数量？</text>
  <!-- Home sub -->
  <line x1="165" y1="178" x2="80" y2="210" stroke="#2196f3" stroke-width="0.8" opacity="0.5"/>
  <text x="110" y="200" font-family="sans-serif" font-size="9" fill="#90caf9">&lt;20个</text>
  <rect x="20" y="210" width="120" height="50" rx="6" fill="rgba(255,152,0,0.12)" stroke="#ff9800" stroke-width="0.8"/>
  <text x="80" y="232" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff9800">Wi-Fi</text>
  <text x="80" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffb74d">简单即插即用</text>
  <line x1="235" y1="178" x2="310" y2="210" stroke="#2196f3" stroke-width="0.8" opacity="0.5"/>
  <text x="285" y="200" font-family="sans-serif" font-size="9" fill="#90caf9">&gt;20个</text>
  <rect x="250" y="210" width="120" height="50" rx="6" fill="rgba(33,150,243,0.15)" stroke="#2196f3" stroke-width="0.8"/>
  <text x="310" y="232" text-anchor="middle" font-family="monospace" font-size="11" fill="#2196f3">BLE Mesh</text>
  <text x="310" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64b5f6">米家/Apple生态</text>
  <!-- Right branch: Commercial -->
  <line x1="440" y1="116" x2="600" y2="146" stroke="#00c853" stroke-width="1" opacity="0.6"/>
  <text x="530" y="136" font-family="sans-serif" font-size="9" fill="#69f0ae">工程</text>
  <rect x="530" y="146" width="140" height="32" rx="6" fill="rgba(0,200,83,0.12)" stroke="#00c853" stroke-width="0.8"/>
  <text x="600" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#69f0ae">精度要求？</text>
  <!-- Commercial sub -->
  <line x1="565" y1="178" x2="490" y2="210" stroke="#00c853" stroke-width="0.8" opacity="0.5"/>
  <text x="515" y="200" font-family="sans-serif" font-size="9" fill="#a5d6a7">调光精度</text>
  <rect x="420" y="210" width="130" height="50" rx="6" fill="rgba(171,71,188,0.15)" stroke="#ab47bc" stroke-width="0.8"/>
  <text x="485" y="232" text-anchor="middle" font-family="monospace" font-size="11" fill="#ab47bc">DALI-2</text>
  <text x="485" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ce93d8">0.1%级精准调光</text>
  <line x1="635" y1="178" x2="700" y2="210" stroke="#00c853" stroke-width="0.8" opacity="0.5"/>
  <text x="685" y="200" font-family="sans-serif" font-size="9" fill="#a5d6a7">规模优先</text>
  <rect x="640" y="210" width="130" height="50" rx="6" fill="rgba(0,200,83,0.15)" stroke="#00c853" stroke-width="0.8"/>
  <text x="705" y="232" text-anchor="middle" font-family="monospace" font-size="11" fill="#00c853">Zigbee</text>
  <text x="705" y="248" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#69f0ae">万级节点部署</text>
  <!-- Bottom: recommendation bar -->
  <rect x="40" y="300" width="720" height="140" rx="10" fill="rgba(13,31,60,0.8)" stroke="#1a3a5c" stroke-width="0.8"/>
  <text x="400" y="326" text-anchor="middle" font-family="monospace" font-size="13" fill="#4fc3f7" filter="url(#glow2)">RECOMMENDATION SUMMARY</text>
  <text x="400" y="346" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b8dad">选型建议速查</text>
  <!-- 4 mini cards -->
  <rect x="60" y="360" width="160" height="60" rx="6" fill="rgba(255,152,0,0.1)" stroke="#ff9800" stroke-width="0.5"/>
  <text x="140" y="382" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff9800">Wi-Fi</text>
  <text x="140" y="400" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">出租屋/临时改造</text>
  <rect x="240" y="360" width="160" height="60" rx="6" fill="rgba(33,150,243,0.1)" stroke="#2196f3" stroke-width="0.5"/>
  <text x="320" y="382" text-anchor="middle" font-family="monospace" font-size="11" fill="#2196f3">BLE Mesh</text>
  <text x="320" y="400" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">家庭全屋智能</text>
  <rect x="420" y="360" width="160" height="60" rx="6" fill="rgba(0,200,83,0.1)" stroke="#00c853" stroke-width="0.5"/>
  <text x="500" y="382" text-anchor="middle" font-family="monospace" font-size="11" fill="#00c853">Zigbee</text>
  <text x="500" y="400" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">酒店/办公大楼</text>
  <rect x="600" y="360" width="160" height="60" rx="6" fill="rgba(171,71,188,0.1)" stroke="#ab47bc" stroke-width="0.5"/>
  <text x="680" y="382" text-anchor="middle" font-family="monospace" font-size="11" fill="#ab47bc">DALI-2</text>
  <text x="680" y="400" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">博物馆/高端商业</text>
</svg>