<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bgTl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="cardTl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101f38"/>
      <stop offset="1" stop-color="#132542"/>
    </linearGradient>
    <filter id="glowTl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="420" fill="url(#bgTl)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="85" y1="0" x2="85" y2="420"/><line x1="170" y1="0" x2="170" y2="420"/>
    <line x1="255" y1="0" x2="255" y2="420"/><line x1="340" y1="0" x2="340" y2="420"/>
    <line x1="425" y1="0" x2="425" y2="420"/><line x1="510" y1="0" x2="510" y2="420"/>
    <line x1="595" y1="0" x2="595" y2="420"/>
  </g>

  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="21" font-weight="bold" filter="url(#glowTl)">灯具 CCC 新版规则 · 时间线</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <rect x="34" y="104" width="190" height="188" rx="10" fill="url(#cardTl)" stroke="#3d5a80" stroke-width="1"/>
  <rect x="34" y="104" width="190" height="4" rx="2" fill="#3d5a80"/>
  <rect x="50" y="122" width="62" height="22" rx="11" fill="#152a4a"/>
  <text x="81" y="137" fill="#9db8d9" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">公告落款</text>
  <text x="50" y="176" fill="#e8f4e8" font-family="sans-serif" font-size="19" font-weight="bold">2026.09.23</text>
  <text x="50" y="204" fill="#7ec27e" font-family="sans-serif" font-size="13" font-weight="bold">认监委 22 号公告</text>
  <line x1="50" y1="220" x2="208" y2="220" stroke="#26456e" stroke-width="1"/>
  <text x="50" y="242" fill="#c8d8ea" font-family="sans-serif" font-size="11.5">CNCA-C10-01:2026 灯具</text>
  <text x="50" y="262" fill="#c8d8ea" font-family="sans-serif" font-size="11.5">CNCA-C10-02:2026 镇流器</text>
  <text x="50" y="282" fill="#8aa5c4" font-family="sans-serif" font-size="11.5">10.08 集中宣贯</text>

  <rect x="245" y="104" width="190" height="188" rx="10" fill="url(#cardTl)" stroke="#c8a04a" stroke-width="1"/>
  <rect x="245" y="104" width="190" height="4" rx="2" fill="#c8a04a"/>
  <rect x="261" y="122" width="62" height="22" rx="11" fill="#2d2716"/>
  <text x="292" y="137" fill="#e0c07a" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">过渡期</text>
  <text x="261" y="176" fill="#e8f4e8" font-family="sans-serif" font-size="19" font-weight="bold">— 2026.12.31</text>
  <text x="261" y="204" fill="#e0c07a" font-family="sans-serif" font-size="13" font-weight="bold">旧版 / 新版任选</text>
  <line x1="261" y1="220" x2="419" y2="220" stroke="#5a4a26" stroke-width="1"/>
  <text x="261" y="242" fill="#c8d8ea" font-family="sans-serif" font-size="11.5">认证机构依委托人意愿</text>
  <text x="261" y="262" fill="#c8d8ea" font-family="sans-serif" font-size="11.5">按旧版或新版开展认证</text>
  <text x="261" y="282" fill="#8aa5c4" font-family="sans-serif" font-size="11.5">想省事可按新版备料</text>

  <rect x="456" y="104" width="190" height="188" rx="10" fill="url(#cardTl)" stroke="#c05a5a" stroke-width="1"/>
  <rect x="456" y="104" width="190" height="4" rx="2" fill="#c05a5a"/>
  <rect x="472" y="122" width="62" height="22" rx="11" fill="#2d1a1a"/>
  <text x="503" y="137" fill="#e89b9b" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">强制执行</text>
  <text x="472" y="176" fill="#e8f4e8" font-family="sans-serif" font-size="19" font-weight="bold">2027.01.01</text>
  <text x="472" y="204" fill="#e89b9b" font-family="sans-serif" font-size="13" font-weight="bold">必须按新版认证</text>
  <line x1="472" y1="220" x2="630" y2="220" stroke="#5a2a2a" stroke-width="1"/>
  <text x="472" y="242" fill="#c8d8ea" font-family="sans-serif" font-size="11.5">新版实施规则正式</text>
  <text x="472" y="262" fill="#c8d8ea" font-family="sans-serif" font-size="11.5">取代旧版开展认证活动</text>
  <text x="472" y="282" fill="#8aa5c4" font-family="sans-serif" font-size="11.5">前三个月是缓冲</text>

  <rect x="34" y="314" width="612" height="74" rx="10" fill="#0f2a1c" stroke="#3f7a52" stroke-width="1"/>
  <text x="56" y="344" fill="#9ee6ac" font-family="sans-serif" font-size="13.5" font-weight="bold" filter="url(#glowTl)">老证书不用专门跑一趟换证</text>
  <text x="56" y="370" fill="#c8d8ea" font-family="sans-serif" font-size="12">继续有效 —— 随「产品变更 / 到期换证」自然过渡到新版规则下的证书</text>
</svg>
