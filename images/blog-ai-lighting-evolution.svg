  <circle cx="42" cy="24" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="60" cy="24" r="5" fill="#22c55e" opacity="0.8"/>
  <!-- Phase markers on left -->
  <text x="32" y="95" font-size="9" fill="#64748b" font-family="Consolas">T₁</text>
  <text x="32" y="220" font-size="9" fill="#64748b" font-family="Consolas">T₂</text>
  <text x="32" y="345" font-size="9" fill="#64748b" font-family="Consolas">T₃</text>
  <!-- Phase 1: Traditional -->
