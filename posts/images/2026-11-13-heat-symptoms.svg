<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2b45" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="720" fill="#0a1628"/>
  <rect width="1080" height="720" fill="url(#grid)"/>

  <text x="60" y="78" fill="#e2e8f0" font-family="sans-serif" font-size="36" font-weight="bold">别摸温度，看症状</text>
  <text x="60" y="118" fill="#7c8db0" font-family="sans-serif" font-size="20">手感不可靠、手上又没有测温枪 —— 这三条出现任意一条，就不是"正常发热"</text>

  <!-- 三张卡片 -->
  <rect x="60" y="152" width="304" height="196" rx="8" fill="#1b1116" stroke="#e05252" stroke-opacity="0.6"/>
  <text x="82" y="196" fill="#e05252" font-family="sans-serif" font-size="26" font-weight="bold">01</text>
  <text x="82" y="232" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">亮几小时后自己灭</text>
  <text x="82" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">凉下来又重新亮</text>
  <line x1="82" y1="276" x2="342" y2="276" stroke="#5c2f36"/>
  <text x="82" y="290" fill="#c9a8ae" font-family="sans-serif" font-size="15">过温保护在打嗝，输出被</text>
  <text x="82" y="312" fill="#c9a8ae" font-family="sans-serif" font-size="15">切断又恢复 —— 最典型的</text>
  <text x="82" y="334" fill="#c9a8ae" font-family="sans-serif" font-size="15">一条，夏天最容易复现</text>

  <rect x="388" y="152" width="304" height="196" rx="8" fill="#231a10" stroke="#e0a052" stroke-opacity="0.6"/>
  <text x="410" y="196" fill="#e0a052" font-family="sans-serif" font-size="26" font-weight="bold">02</text>
  <text x="410" y="232" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">亮度轻微抖动</text>
  <text x="410" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">或者开始高频闪</text>
  <line x1="410" y1="276" x2="670" y2="276" stroke="#5c4426"/>
  <text x="410" y="290" fill="#cbb08a" font-family="sans-serif" font-size="15">降额运行或保护前的征兆，</text>
  <text x="410" y="312" fill="#cbb08a" font-family="sans-serif" font-size="15">手机开 1/100 秒快门对着</text>
  <text x="410" y="334" fill="#cbb08a" font-family="sans-serif" font-size="15">拍，有横纹就说明在抖</text>

  <rect x="716" y="152" width="304" height="196" rx="8" fill="#1b1116" stroke="#e05252" stroke-opacity="0.6"/>
  <text x="738" y="196" fill="#e05252" font-family="sans-serif" font-size="26" font-weight="bold">03</text>
  <text x="738" y="232" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">外壳发黄</text>
  <text x="738" y="258" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">或者闻到焦糊味</text>
  <line x1="738" y1="276" x2="998" y2="276" stroke="#5c2f36"/>
  <text x="738" y="290" fill="#c9a8ae" font-family="sans-serif" font-size="15">塑料已经开始热老化。这</text>
  <text x="738" y="312" fill="#c9a8ae" font-family="sans-serif" font-size="15">一条出现就别再用了，先</text>
  <text x="738" y="334" fill="#c9a8ae" font-family="sans-serif" font-size="15">断电再查它被装在哪</text>

  <!-- 底线 -->
  <rect x="60" y="368" width="960" height="42" rx="6" fill="#0d2137" stroke="#3ddc97" stroke-opacity="0.45"/>
  <text x="540" y="396" fill="#3ddc97" font-family="sans-serif" font-size="16" text-anchor="middle">三条都没有、只是摸着烫 —— 可以先放着观察；器件的余量本来就设计在"手感不舒服"的区间里</text>

  <!-- 六条装法 -->
  <text x="60" y="458" fill="#c8d6e8" font-family="sans-serif" font-size="21" font-weight="bold">已经装完的，还能改这六处</text>

  <g font-family="sans-serif" font-size="17" fill="#c8d6e8">
    <circle cx="74" cy="492" r="4" fill="#22d3ee"/>
    <text x="94" y="498">驱动挪到龙骨或金属面上，别平贴石膏板</text>

    <circle cx="74" cy="528" r="4" fill="#22d3ee"/>
    <text x="94" y="534">周围留出空气，上面不压隔热棉，塞不进就别硬塞</text>

    <circle cx="74" cy="564" r="4" fill="#22d3ee"/>
    <text x="94" y="570">几颗驱动不堆叠，之间留间距</text>

    <circle cx="550" cy="492" r="4" fill="#22d3ee"/>
    <text x="570" y="498">分体式驱动放检修口够得着的位置 —— 要换的是它</text>

    <circle cx="550" cy="528" r="4" fill="#22d3ee"/>
    <text x="570" y="534">功率留 20% 余量，长期满载的温度最高</text>

    <circle cx="550" cy="564" r="4" fill="#22d3ee"/>
    <text x="570" y="570">驱动到灯珠的线控在 0.5 米内，线径不小于 0.5 mm²</text>
  </g>

  <!-- 底注 -->
  <line x1="60" y1="600" x2="1020" y2="600" stroke="#24405f"/>
  <text x="60" y="632" fill="#7c8db0" font-family="sans-serif" font-size="16">铭牌上那行 Tc 是这个指标的出处：额定环境温度下满载运行时，外壳最热点允许达到的上限。</text>
  <text x="60" y="660" fill="#7c8db0" font-family="sans-serif" font-size="16">Tc 75℃、效率 88%、Ta 40℃ —— 这三个数字凑齐，才谈得上"50000 小时"这个寿命。</text>
  <text x="60" y="694" fill="#4d5f7d" font-family="sans-serif" font-size="14">附：IEC 61347-1 对可触及表面另有温度限值，取的是防烫伤与外壳不软化的较小值。</text>
</svg>
