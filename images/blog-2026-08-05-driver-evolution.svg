<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#141a3a"/>
    </linearGradient>
    <linearGradient id="arrow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="arrow3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" font-family="Arial,sans-serif">LED驱动电源技术升级路线图：从"够用"到"超前"</text>

  <!-- Phase 1 -->
  <rect x="40" y="75" width="220" height="120" rx="10" fill="#ff6b35" opacity="0.08" stroke="#ff6b35" stroke-width="1"/>
  <text x="150" y="105" text-anchor="middle" fill="#ff6b35" font-size="16" font-weight="bold" font-family="Arial,sans-serif">1.0 时代</text>
  <text x="150" y="128" text-anchor="middle" fill="#ccddee" font-size="12" font-family="Arial,sans-serif">传统LED驱动</text>
  <text x="150" y="148" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">恒流精度 ±3%</text>
  <text x="150" y="166" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">功率范围 3-400W</text>
  <text x="150" y="184" text-anchor="middle" fill="#667788" font-size="10" font-family="Arial,sans-serif">→ 已成熟，红海竞争</text>

  <!-- Arrow 1 -->
  <rect x="270" y="120" width="60" height="6" rx="3" fill="url(#arrow1)"/>
  <polygon points="335,123 345,113 345,133" fill="#ffaa00"/>

  <!-- Phase 2 -->
  <rect x="290" y="75" width="220" height="120" rx="10" fill="#00d4ff" opacity="0.08" stroke="#00d4ff" stroke-width="1"/>
  <text x="400" y="105" text-anchor="middle" fill="#00d4ff" font-size="16" font-weight="bold" font-family="Arial,sans-serif">2.0 时代（2026-）</text>
  <text x="400" y="128" text-anchor="middle" fill="#ccddee" font-size="12" font-family="Arial,sans-serif">数字化智能驱动</text>
  <text x="400" y="148" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">多协议 / D4i / NFC</text>
  <text x="400" y="166" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">能耗计量 / 远程运维</text>
  <text x="400" y="184" text-anchor="middle" fill="#667788" font-size="10" font-family="Arial,sans-serif">→ 正在进行，差异化窗口</text>

  <!-- Arrow 2 -->
  <rect x="520" y="120" width="60" height="6" rx="3" fill="url(#arrow2)"/>
  <polygon points="585,123 595,113 595,133" fill="#00d4ff"/>

  <!-- Phase 3 -->
  <rect x="540" y="75" width="220" height="120" rx="10" fill="#00e676" opacity="0.08" stroke="#00e676" stroke-width="1"/>
  <text x="650" y="105" text-anchor="middle" fill="#00e676" font-size="16" font-weight="bold" font-family="Arial,sans-serif">3.0 时代（2027+）</text>
  <text x="650" y="128" text-anchor="middle" fill="#ccddee" font-size="12" font-family="Arial,sans-serif">新材料适配驱动</text>
  <text x="650" y="148" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">±1%精密恒流 / kW级</text>
  <text x="650" y="166" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">传感器集成 / 自保护</text>
  <text x="650" y="184" text-anchor="middle" fill="#00e676" font-size="10" font-family="Arial,sans-serif" filter="url(#glow2)">→ 新蓝海，抢先布局！</text>

  <!-- Divider -->
  <rect x="40" y="220" width="720" height="1" fill="#ffffff" opacity="0.1"/>

  <!-- Key Requirements Section -->
  <text x="400" y="255" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-family="Arial,sans-serif">3.0时代驱动电源三大核心技术要求</text>

  <!-- Card 1 -->
  <rect x="50" y="280" width="220" height="95" rx="8" fill="#0d1230" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  <text x="160" y="310" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold" font-family="Arial,sans-serif">超精密恒流</text>
  <text x="160" y="335" text-anchor="middle" fill="#aabbcc" font-size="11" font-family="Arial,sans-serif">精度 ±1% @ 全负载范围</text>
  <text x="160" y="355" text-anchor="middle" fill="#8899aa" font-size="11" font-family="Arial,sans-serif">纹波 &lt; 1% / 软启动 &lt; 100μs</text>

  <!-- Card 2 -->
  <rect x="290" y="280" width="220" height="95" rx="8" fill="#0d1230" stroke="#00e676" stroke-width="1" opacity="0.8"/>
  <text x="400" y="310" text-anchor="middle" fill="#00e676" font-size="14" font-weight="bold" font-family="Arial,sans-serif">kW级大功率</text>
  <text x="400" y="335" text-anchor="middle" fill="#aabbcc" font-size="11" font-family="Arial,sans-serif">PF &gt; 0.98 / THD &lt; 10%</text>
  <text x="400" y="355" text-anchor="middle" fill="#8899aa" font-size="11" font-family="Arial,sans-serif">液冷 + D4i 数据管理</text>

  <!-- Card 3 -->
  <rect x="530" y="280" width="220" height="95" rx="8" fill="#0d1230" stroke="#ffaa00" stroke-width="1" opacity="0.8"/>
  <text x="640" y="310" text-anchor="middle" fill="#ffaa00" font-size="14" font-weight="bold" font-family="Arial,sans-serif">智能守护</text>
  <text x="640" y="335" text-anchor="middle" fill="#aabbcc" font-size="11" font-family="Arial,sans-serif">温湿度监测 + 自动降功</text>
  <text x="640" y="355" text-anchor="middle" fill="#8899aa" font-size="11" font-family="Arial,sans-serif">封装失效预警 / IoT上报</text>

  <!-- Bottom bar -->
  <rect x="120" y="410" width="560" height="50" rx="25" fill="#00d4ff" opacity="0.08" stroke="#00d4ff" stroke-width="1"/>
  <text x="400" y="435" text-anchor="middle" fill="#00d4ff" font-size="13" font-family="Arial,sans-serif">核心结论：谁先适配新材料，谁就掌握下一代驱动电源话语权</text>
  <text x="400" y="452" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">钙钛矿LED 2027 / 透明荧光陶瓷LED 已试点 → 窗口期 12-24个月</text>

  <text x="400" y="490" text-anchor="middle" fill="#556688" font-size="10" font-family="Arial,sans-serif">NEXLAMP Technology · www.nexlamp.com</text>
</svg>