<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7ec27e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b8c5a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6bcf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9f43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.5">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
  </g>
  <text x="400" y="45" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#ffffff">不同智能灯待机功耗实测对比</text>
  <text x="400" y="75" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7ec27e">关灯状态下的真实功率消耗（单位：W）</text>
  <g transform="translate(80,380)">
    <rect x="0" y="0" width="120" height="-15" fill="url(#bar1)" />
    <rect x="0" y="-30" width="120" height="-15" fill="url(#bar1)" opacity="0.7" />
    <text x="60" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">普通LED灯</text>
    <text x="60" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7ec27e">~0W</text>
  </g>
  <g transform="translate(240,380)">
    <rect x="0" y="0" width="120" height="-35" fill="url(#bar2)" />
    <text x="60" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">优质Zigbee</text>
    <text x="60" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a9eff">0.2–0.5W</text>
  </g>
  <g transform="translate(400,380)">
    <rect x="0" y="0" width="120" height="-105" fill="url(#bar3)" />
    <text x="60" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Wi-Fi智能灯</text>
    <text x="60" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff9f43">0.8–1.5W</text>
  </g>
  <g transform="translate(560,380)">
    <rect x="0" y="0" width="120" height="-210" fill="url(#bar4)" />
    <text x="60" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">廉价Wi-Fi方案</text>
    <text x="60" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff6b6b">2–4W</text>
  </g>
  <g transform="translate(80,130)">
    <rect x="0" y="0" width="640" height="80" rx="8" fill="#162b4d" stroke="#7ec27e" stroke-width="1" />
    <text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">关键结论</text>
    <text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a0c4ff">20盏廉价Wi-Fi灯一年待机耗电 ≈ 35度，电费约 17.5 元</text>
    <text x="320" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a0c4ff">20盏优质Zigbee灯一年待机耗电 ≈ 4度，电费约 2 元</text>
  </g>
</svg>