<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f38"/>
    </linearGradient>
    <filter id="glowG3">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridG3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2f4e" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="680" height="430" fill="url(#bgG3)"/>
  <rect width="680" height="430" fill="url(#gridG3)"/>

  <!-- Terminal window header -->
  <rect x="20" y="15" width="640" height="30" rx="5" fill="#162844" stroke="#2a4a6b" stroke-width="1"/>
  <circle cx="38" cy="30" r="5" fill="#e74c3c"/>
  <circle cx="54" cy="30" r="5" fill="#f39c12"/>
  <circle cx="70" cy="30" r="5" fill="#2ecc71"/>
  <text x="340" y="34" font-family="Consolas, monospace" font-size="12" fill="#5a8ab5" text-anchor="middle">$ check --list buying-questions</text>

  <!-- Title -->
  <text x="340" y="72" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#e8e8e8" text-anchor="middle">选购智能照明：问销售 5 个问题</text>

  <!-- Question rows -->
  <!-- Q1 -->
  <rect x="40" y="95" width="600" height="52" rx="8" fill="#101d33" stroke="#2a4a6b" stroke-width="1.2"/>
  <text x="60" y="118" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4a90c8">Q1</text>
  <text x="105" y="118" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e0e8f0">断外网后，实体开关能不能正常开关灯？</text>
  <text x="620" y="118" font-family="Consolas, monospace" font-size="13" fill="#e74c3c" text-anchor="end">不能 → PASS</text>
  <text x="60" y="138" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a7a9a">基础能力：智能可以挂，物理开关必须永远可用</text>

  <!-- Q2 -->
  <rect x="40" y="157" width="600" height="52" rx="8" fill="#101d33" stroke="#2a4a6b" stroke-width="1.2"/>
  <text x="60" y="180" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4a90c8">Q2</text>
  <text x="105" y="180" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e0e8f0">自动化场景存在网关本地，还是云端？</text>
  <text x="620" y="180" font-family="Consolas, monospace" font-size="13" fill="#e74c3c" text-anchor="end">云端 → 慎选</text>
  <text x="60" y="200" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a7a9a">本地场景 = 断网照跑；云端场景 = 断网全停</text>

  <!-- Q3 -->
  <rect x="40" y="219" width="600" height="52" rx="8" fill="#101d33" stroke="#2a4a6b" stroke-width="1.2"/>
  <text x="60" y="242" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4a90c8">Q3</text>
  <text x="105" y="242" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e0e8f0">网关断电重启后，设备需要重新配网吗？</text>
  <text x="620" y="242" font-family="Consolas, monospace" font-size="13" fill="#e74c3c" text-anchor="end">需要 → 灾难</text>
  <text x="60" y="262" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a7a9a">一次停电就要全屋重配的系统，维护成本不可接受</text>

  <!-- Q4 -->
  <rect x="40" y="281" width="600" height="52" rx="8" fill="#101d33" stroke="#2a4a6b" stroke-width="1.2"/>
  <text x="60" y="304" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4a90c8">Q4</text>
  <text x="105" y="304" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e0e8f0">老人小孩不拿手机，能不能正常用灯？</text>
  <text x="620" y="304" font-family="Consolas, monospace" font-size="13" fill="#e74c3c" text-anchor="end">不能 → 伪智能</text>
  <text x="60" y="324" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a7a9a">真正的智能是"家人不用学就会用"</text>

  <!-- Q5 -->
  <rect x="40" y="343" width="600" height="52" rx="8" fill="#101d33" stroke="#2a4a6b" stroke-width="1.2"/>
  <text x="60" y="366" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4a90c8">Q5</text>
  <text x="105" y="366" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e0e8f0">墙面开关是直控负载，还是无线遥控器？</text>
  <text x="620" y="366" font-family="Consolas, monospace" font-size="13" fill="#e74c3c" text-anchor="end">遥控器 → 看网关</text>
  <text x="60" y="386" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a7a9a">贴墙遥控器依赖网关，网关挂掉按键就失效</text>

  <!-- Bottom note -->
  <text x="340" y="420" font-family="Consolas, monospace" font-size="11" fill="#2ecc71" text-anchor="middle">$ verdict: 5 问全过 + 拔路由器实测通过 → 才是真"断网可用" ✓</text>
</svg>
