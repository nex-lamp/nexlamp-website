<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#141a2b"/>
    </linearGradient>
    <linearGradient id="tempGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="420" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="340" y="40" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18" font-weight="bold">智能灯集成化对散热的"挤压效应"</text>
  <text x="340" y="60" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">传感器+通信模组挤占散热空间后，光衰和故障率双双飙升</text>

  <!-- Left: Standalone Light -->
  <rect x="30" y="80" width="290" height="310" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>

  <!-- Light icon -->
  <rect x="120" y="100" width="110" height="70" rx="10" fill="#1e3a2f"/>
  <!-- LEDs -->
  <circle cx="160" cy="135" r="8" fill="#4ade80" filter="url(#glow)"/>
  <circle cx="175" cy="130" r="6" fill="#4ade80" filter="url(#glow)"/>
  <circle cx="190" cy="135" r="5" fill="#4ade80" filter="url(#glow)"/>

  <!-- Driver box -->
  <rect x="135" y="190" width="80" height="55" rx="4" fill="#334155"/>
  <text x="175" y="215" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">驱动电源</text>
  <text x="175" y="230" text-anchor="middle" fill="#4ade80" font-family="Arial, sans-serif" font-size="8">散热充足</text>

  <!-- Arrows for airflow -->
  <path d="M100,215 L130,215" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)" opacity="0.5"/>
  <path d="M220,215 L250,215" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)" opacity="0.5"/>

  <!-- Stats -->
  <rect x="60" y="270" width="230" height="100" rx="4" fill="#0f1724"/>
  <text x="175" y="292" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">独立灯具</text>
  <text x="80" y="314" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">工作温度</text>
  <text x="230" y="314" fill="#4ade80" font-family="Arial, sans-serif" font-size="10" font-weight="bold">55-65°C</text>
  <text x="80" y="334" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">年光衰率</text>
  <text x="230" y="334" fill="#4ade80" font-family="Arial, sans-serif" font-size="10" font-weight="bold">~8%</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">驱动故障率</text>
  <text x="230" y="354" fill="#4ade80" font-family="Arial, sans-serif" font-size="10" font-weight="bold">0.8%</text>

  <!-- Right: Integrated Smart Light -->
  <rect x="360" y="80" width="290" height="310" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>

  <!-- Light icon - packed -->
  <rect x="420" y="100" width="110" height="70" rx="10" fill="#2d1f1f"/>
  <!-- LEDs -->
  <circle cx="460" cy="135" r="8" fill="#f97316" filter="url(#glow)"/>
  <circle cx="475" cy="130" r="6" fill="#f97316" filter="url(#glow)"/>
  <circle cx="490" cy="135" r="5" fill="#f97316" filter="url(#glow)"/>

  <!-- Driver box - cramped -->
  <rect x="425" y="190" width="40" height="55" rx="4" fill="#7f1d1d"/>
  <text x="445" y="225" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="9">驱动</text>

  <!-- Sensor module -->
  <rect x="475" y="190" width="40" height="25" rx="4" fill="#334155"/>
  <text x="495" y="206" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="7">传感器</text>

  <!-- WiFi/Zigbee module -->
  <rect x="475" y="220" width="40" height="25" rx="4" fill="#334155"/>
  <text x="495" y="236" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="7">Zigbee</text>

  <!-- No airflow -->
  <path d="M400,215 L420,215" stroke="#ef4444" stroke-width="1.5" opacity="0.3"/>

  <!-- Stats -->
  <rect x="390" y="270" width="230" height="100" rx="4" fill="#0f1724"/>
  <text x="505" y="292" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">集成智能灯</text>
  <text x="410" y="314" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">工作温度</text>
  <text x="560" y="314" fill="#ef4444" font-family="Arial, sans-serif" font-size="10" font-weight="bold">67-77°C</text>
  <text x="410" y="334" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">年光衰率</text>
  <text x="560" y="334" fill="#ef4444" font-family="Arial, sans-serif" font-size="10" font-weight="bold">~12%</text>
  <text x="410" y="354" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">驱动故障率</text>
  <text x="560" y="354" fill="#ef4444" font-family="Arial, sans-serif" font-size="10" font-weight="bold">3.2%</text>

  <!-- Temperature rise arrow -->
  <text x="340" y="140" text-anchor="middle" fill="#f97316" font-family="Arial, sans-serif" font-size="14" font-weight="bold">↑</text>
  <text x="340" y="155" text-anchor="middle" fill="#f97316" font-family="Arial, sans-serif" font-size="10" font-weight="bold">+8~12°C</text>

  <!-- Bottom insight -->
  <rect x="60" y="395" width="560" height="18" rx="4" fill="#ef4444" opacity="0.1"/>
  <text x="340" y="408" text-anchor="middle" fill="#f87171" font-family="Arial, sans-serif" font-size="10">传感器+通信模组=散热空间压缩→温度+12°C→光衰+50%→故障率×4</text>
</svg>
