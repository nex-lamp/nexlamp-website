<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg-tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <filter id="glow-tree">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid-tree" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="560" fill="url(#bg-tree)"/>
  <rect width="800" height="560" fill="url(#grid-tree)"/>

  <text x="400" y="40" text-anchor="middle" fill="#7ec27e" font-size="22" font-weight="bold" filter="url(#glow-tree)">全屋智能灯选型决策树</text>
  <text x="400" y="65" text-anchor="middle" fill="#8aa8c0" font-size="13">5 步判断你家该选 Wi-Fi 还是 Zigbee</text>

  <!-- Step 1: Number of lights -->
  <g transform="translate(60,100)">
    <rect x="0" y="0" width="240" height="55" fill="#1a2a3a" stroke="#7ec27e" stroke-width="1.5" rx="5"/>
    <text x="120" y="22" text-anchor="middle" fill="#7ec27e" font-size="13" font-weight="bold">Q1. 智能灯数量？</text>
    <text x="120" y="42" text-anchor="middle" fill="#8aa8c0" font-size="11">≤5 个 vs &gt;5 个</text>
  </g>

  <!-- Step 2: House area -->
  <g transform="translate(60,180)">
    <rect x="0" y="0" width="240" height="55" fill="#1a2a3a" stroke="#7ec27e" stroke-width="1.5" rx="5"/>
    <text x="120" y="22" text-anchor="middle" fill="#7ec27e" font-size="13" font-weight="bold">Q2. 房屋面积？</text>
    <text x="120" y="42" text-anchor="middle" fill="#8aa8c0" font-size="11">&lt;80㎡ vs &gt;80㎡ / 复式 / 别墅</text>
  </g>

  <!-- Step 3: Dimming precision -->
  <g transform="translate(60,260)">
    <rect x="0" y="0" width="240" height="55" fill="#1a2a3a" stroke="#7ec27e" stroke-width="1.5" rx="5"/>
    <text x="120" y="22" text-anchor="middle" fill="#7ec27e" font-size="13" font-weight="bold">Q3. 调光精度？</text>
    <text x="120" y="42" text-anchor="middle" fill="#8aa8c0" font-size="11">开关 vs 无级 / 影视墙 / 阅读</text>
  </g>

  <!-- Step 4: Existing ecosystem -->
  <g transform="translate(60,340)">
    <rect x="0" y="0" width="240" height="55" fill="#1a2a3a" stroke="#7ec27e" stroke-width="1.5" rx="5"/>
    <text x="120" y="22" text-anchor="middle" fill="#7ec27e" font-size="13" font-weight="bold">Q4. 现有生态？</text>
    <text x="120" y="42" text-anchor="middle" fill="#8aa8c0" font-size="11">小爱/小度/天猫精灵有 Zigbee 网关</text>
  </g>

  <!-- Step 5: Budget -->
  <g transform="translate(60,420)">
    <rect x="0" y="0" width="240" height="55" fill="#1a2a3a" stroke="#7ec27e" stroke-width="1.5" rx="5"/>
    <text x="120" y="22" text-anchor="middle" fill="#7ec27e" font-size="13" font-weight="bold">Q5. 预算？</text>
    <text x="120" y="42" text-anchor="middle" fill="#8aa8c0" font-size="11">Zigbee 驱动 + 网关 +100~300 元</text>
  </g>

  <!-- Arrows down -->
  <g stroke="#7ec27e" stroke-width="1.5" fill="none">
    <line x1="180" y1="155" x2="180" y2="178" marker-end="url(#arrowhead)"/>
    <line x1="180" y1="235" x2="180" y2="258" marker-end="url(#arrowhead)"/>
    <line x1="180" y1="315" x2="180" y2="338" marker-end="url(#arrowhead)"/>
    <line x1="180" y1="395" x2="180" y2="418" marker-end="url(#arrowhead)"/>
  </g>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7ec27e"/>
    </marker>
  </defs>

  <!-- Decision branches on right side -->
  <!-- Wi-Fi path (less common) -->
  <g transform="translate(360,100)">
    <rect x="0" y="0" width="380" height="55" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1.5" rx="5"/>
    <text x="190" y="22" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">选 Wi-Fi 智能灯</text>
    <text x="190" y="42" text-anchor="middle" fill="#ffb3b3" font-size="11">尝鲜 / 出租屋 / ≤3 个灯 / 短期使用</text>
  </g>

  <!-- Zigbee path (recommended) -->
  <g transform="translate(360,180)">
    <rect x="0" y="0" width="380" height="55" fill="#1a2a1a" stroke="#7ec27e" stroke-width="2" rx="5" filter="url(#glow-tree)"/>
    <text x="190" y="22" text-anchor="middle" fill="#7ec27e" font-size="13" font-weight="bold">✓ 推荐：涂鸦 Zigbee + 3C 驱动</text>
    <text x="190" y="42" text-anchor="middle" fill="#a8e0a8" font-size="11">全屋 ≥5 灯 / 大户型 / 追求调光 / 长期使用</text>
  </g>

  <!-- Hybrid path (best for most) -->
  <g transform="translate(360,260)">
    <rect x="0" y="0" width="380" height="55" fill="#1a2a1a" stroke="#7ec27e" stroke-width="2" rx="5" filter="url(#glow-tree)"/>
    <text x="190" y="22" text-anchor="middle" fill="#7ec27e" font-size="13" font-weight="bold">★ 最佳：3-5 Wi-Fi + 剩余 Zigbee</text>
    <text x="190" y="42" text-anchor="middle" fill="#a8e0a8" font-size="11">主灯 Wi-Fi 尝鲜 + 次卧/餐厅 Zigbee 稳定</text>
  </g>

  <!-- Ecosystem benefit -->
  <g transform="translate(360,340)">
    <rect x="0" y="0" width="380" height="55" fill="#1a2a3a" stroke="#7ec27e" stroke-width="1.5" rx="5"/>
    <text x="190" y="22" text-anchor="middle" fill="#7ec27e" font-size="13" font-weight="bold">已有米家/小度/天猫精灵？</text>
    <text x="190" y="42" text-anchor="middle" fill="#a8e0a8" font-size="11">自带 Zigbee 网关 → 零成本升级</text>
  </g>

  <!-- Final recommendation box -->
  <g transform="translate(360,420)">
    <rect x="0" y="0" width="380" height="100" fill="#1a2a3a" stroke="#7ec27e" stroke-width="2" rx="5" filter="url(#glow-tree)"/>
    <text x="190" y="25" text-anchor="middle" fill="#7ec27e" font-size="14" font-weight="bold">🛒 标准方案（耐利普 NEXLAMP）</text>
    <text x="190" y="48" text-anchor="middle" fill="#a8e0a8" font-size="11">① 涂鸦 Zigbee 3.0 智能驱动（3C 认证）</text>
    <text x="190" y="68" text-anchor="middle" fill="#a8e0a8" font-size="11">② 多模智能网关（信号中继）</text>
    <text x="190" y="88" text-anchor="middle" fill="#a8e0a8" font-size="11">③ 人体/光照传感器（自动化触发）</text>
  </g>

  <!-- Bottom note -->
  <text x="400" y="545" text-anchor="middle" fill="#8aa8c0" font-size="11">NEXLAMP 涂鸦 Zigbee 方案：500+ 全屋项目验证 · 掉线率 &lt; 0.5%</text>
</svg>
