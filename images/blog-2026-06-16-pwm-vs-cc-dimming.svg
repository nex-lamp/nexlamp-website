<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="pwmBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#2196f3"/>
    </linearGradient>
    <linearGradient id="ccBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#8bc34a"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="40" y1="80" x2="760" y2="80"/><line x1="40" y1="160" x2="760" y2="160"/>
    <line x1="40" y1="240" x2="760" y2="240"/><line x1="40" y1="320" x2="760" y2="320"/>
  </g>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">PWM调光 vs 模拟调光：节律照明的关键差异</text>
  <text x="400" y="55" text-anchor="middle" fill="#8899bb" font-size="12">PWM Dimming vs Analog (CC) Dimming for Circadian Lighting</text>
  <!-- PWM Waveform -->
  <g transform="translate(40,75)">
    <text x="0" y="10" fill="#00bcd4" font-size="13" font-weight="bold">PWM 调光</text>
    <text x="0" y="25" fill="#6688aa" font-size="10">频率: 200Hz-1kHz (普通) / 20kHz+ (高品质)</text>
    <!-- PWM waveform - low freq (visible flicker) -->
    <g transform="translate(0,35)">
      <text x="0" y="10" fill="#ff5252" font-size="10">低频PWM (200Hz) — 低亮度下频闪明显</text>
      <polyline points="0,50 0,30 25,30 25,50 50,50 50,30 75,30 75,50 100,50 100,30 125,30 125,50 150,50 150,30 175,30 175,50 200,50 200,30 225,30 225,50 250,50 250,30 275,30 275,50" fill="none" stroke="#ff5252" stroke-width="1.5" opacity="0.7"/>
      <!-- Flicker indicator -->
      <text x="300" y="45" fill="#ff5252" font-size="10">⚠ 频闪</text>
    </g>
    <!-- PWM waveform - high freq -->
    <g transform="translate(380,35)">
      <text x="0" y="10" fill="#00bcd4" font-size="10">高频PWM (20kHz) — 无感知频闪</text>
      <rect x="0" y="30" width="280" height="20" rx="3" fill="#00bcd4" opacity="0.15"/>
      <rect x="0" y="30" width="28" height="20" rx="2" fill="#00bcd4" opacity="0.7"/>
      <rect x="35" y="30" width="28" height="20" rx="2" fill="#00bcd4" opacity="0.7"/>
      <rect x="70" y="30" width="28" height="20" rx="2" fill="#00bcd4" opacity="0.7"/>
      <rect x="105" y="30" width="28" height="20" rx="2" fill="#00bcd4" opacity="0.7"/>
      <rect x="140" y="30" width="28" height="20" rx="2" fill="#00bcd4" opacity="0.7"/>
      <rect x="175" y="30" width="28" height="20" rx="2" fill="#00bcd4" opacity="0.7"/>
      <rect x="210" y="30" width="28" height="20" rx="2" fill="#00bcd4" opacity="0.7"/>
      <rect x="245" y="30" width="28" height="20" rx="2" fill="#00bcd4" opacity="0.7"/>
      <text x="300" y="45" fill="#4caf50" font-size="10">✓ 无频闪</text>
    </g>
  </g>
  <!-- Analog (CC) Dimming -->
  <g transform="translate(40,210)">
    <text x="0" y="10" fill="#4caf50" font-size="13" font-weight="bold">模拟调光 (CC 恒流)</text>
    <text x="0" y="25" fill="#6688aa" font-size="10">连续电流控制 — 0.1%调光深度 — 零频闪</text>
    <!-- Smooth dimming curve -->
    <g transform="translate(0,35)">
      <rect x="0" y="0" width="700" height="60" rx="5" fill="#0d1b2a" stroke="#334466" stroke-width="0.5"/>
      <!-- Dimming levels -->
      <rect x="10" y="5" width="80" height="50" rx="4" fill="#4caf50" opacity="0.9"/>
      <text x="50" y="35" text-anchor="middle" fill="#fff" font-size="10">100%</text>
      <rect x="100" y="5" width="80" height="42" rx="4" fill="#4caf50" opacity="0.72"/>
      <text x="140" y="35" text-anchor="middle" fill="#fff" font-size="10">75%</text>
      <rect x="190" y="5" width="80" height="32" rx="4" fill="#4caf50" opacity="0.55"/>
      <text x="230" y="35" text-anchor="middle" fill="#fff" font-size="10">50%</text>
      <rect x="280" y="5" width="80" height="22" rx="4" fill="#4caf50" opacity="0.38"/>
      <text x="320" y="35" text-anchor="middle" fill="#fff" font-size="10">25%</text>
      <rect x="370" y="5" width="80" height="14" rx="4" fill="#4caf50" opacity="0.22"/>
      <text x="410" y="35" text-anchor="middle" fill="#fff" font-size="10">10%</text>
      <rect x="460" y="5" width="80" height="8" rx="4" fill="#4caf50" opacity="0.12"/>
      <text x="500" y="35" text-anchor="middle" fill="#4caf50" font-size="10">1%</text>
      <rect x="550" y="5" width="80" height="3" rx="2" fill="#4caf50" opacity="0.08"/>
      <text x="590" y="35" text-anchor="middle" fill="#4caf50" font-size="9">0.1%</text>
      <!-- Arrow -->
      <line x1="660" y1="45" x2="660" y2="10" stroke="#4caf50" stroke-width="1" opacity="0.5"/>
      <polygon points="656,12 660,5 664,12" fill="#4caf50" opacity="0.5"/>
      <text x="680" y="30" fill="#4caf50" font-size="9">渐变</text>
    </g>
  </g>
  <!-- Comparison table -->
  <g transform="translate(40,330)">
    <rect x="0" y="0" width="720" height="100" rx="8" fill="#111827" stroke="#334466" stroke-width="1"/>
    <!-- Header -->
    <text x="120" y="22" text-anchor="middle" fill="#8899bb" font-size="11" font-weight="bold">指标</text>
    <text x="340" y="22" text-anchor="middle" fill="#00bcd4" font-size="11" font-weight="bold">普通PWM</text>
    <text x="580" y="22" text-anchor="middle" fill="#4caf50" font-size="11" font-weight="bold">高品质驱动 (PWM 20kHz/CC)</text>
    <line x1="10" y1="30" x2="710" y2="30" stroke="#334466" stroke-width="0.5"/>
    <!-- Rows -->
    <text x="120" y="48" text-anchor="middle" fill="#aabbcc" font-size="10">调光深度</text>
    <text x="340" y="48" text-anchor="middle" fill="#ff5252" font-size="10">5%-10%</text>
    <text x="580" y="48" text-anchor="middle" fill="#4caf50" font-size="10">0.1%</text>
    <text x="120" y="65" text-anchor="middle" fill="#aabbcc" font-size="10">频闪风险</text>
    <text x="340" y="65" text-anchor="middle" fill="#ff5252" font-size="10">低亮度明显</text>
    <text x="580" y="65" text-anchor="middle" fill="#4caf50" font-size="10">零频闪</text>
    <text x="120" y="82" text-anchor="middle" fill="#aabbcc" font-size="10">调光分辨率</text>
    <text x="340" y="82" text-anchor="middle" fill="#ff9800" font-size="10">8位 (256级)</text>
    <text x="580" y="82" text-anchor="middle" fill="#4caf50" font-size="10">16位 (65536级)</text>
    <text x="120" y="96" text-anchor="middle" fill="#aabbcc" font-size="10">节律照明适用</text>
    <text x="340" y="96" text-anchor="middle" fill="#ff5252" font-size="10">勉强</text>
    <text x="580" y="96" text-anchor="middle" fill="#4caf50" font-size="10">✓ 理想</text>
  </g>
  <!-- Footer -->
  <text x="400" y="440" text-anchor="middle" fill="#556688" font-size="10">NEXLAMP — 高频PWM + CC恒流双模驱动，0.1%调光深度实现丝滑渐变</text>
</svg>
