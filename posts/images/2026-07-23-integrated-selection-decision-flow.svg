<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3055" stroke-width="0.5"/>
    </pattern>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="680" height="480" fill="#0a1628"/>
  <rect width="680" height="480" fill="url(#grid3)"/>
  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#e0e0e0" font-weight="bold">一体化智能灯选购决策流程</text>
  <!-- Start node -->
  <rect x="260" y="50" width="160" height="40" fill="#1565c0" rx="8" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="340" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">开始选购一体化智能灯</text>
  <!-- Arrow down -->
  <line x1="340" y1="90" x2="340" y2="110" stroke="#4fc3f7" stroke-width="1.5"/>
  <!-- Decision 1: Isolated driver? -->
  <rect x="230" y="110" width="220" height="55" fill="#1a3055" rx="6" stroke="#ffab40" stroke-width="1.5" filter="url(#glow3)"/>
  <text x="340" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffab40" font-weight="bold">驱动拓扑是隔离式吗？</text>
  <text x="340" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">参数页写"隔离/isolated"?</text>
  <!-- Yes branch -->
  <text x="470" y="130" font-family="sans-serif" font-size="10" fill="#7ec27e">是 ✓</text>
  <line x1="450" y1="137" x2="520" y2="137" stroke="#7ec27e" stroke-width="1"/>
  <!-- No branch -->
  <text x="200" y="130" font-family="sans-serif" font-size="10" fill="#ff7043">否 ✗</text>
  <line x1="230" y1="137" x2="180" y2="137" stroke="#ff7043" stroke-width="1"/>
  <rect x="120" y="125" width="60" height="25" fill="#2a1515" rx="4" stroke="#d32f2f" stroke-width="1"/>
  <text x="150" y="143" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff7043">慎选!</text>
  <!-- Yes continues down -->
  <line x1="340" y1="165" x2="340" y2="185" stroke="#7ec27e" stroke-width="1.5"/>
  <!-- Decision 2: PWM resolution -->
  <rect x="230" y="185" width="220" height="55" fill="#1a3055" rx="6" stroke="#ffab40" stroke-width="1.5"/>
  <text x="340" y="205" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffab40" font-weight="bold">PWM分辨率≥12位?</text>
  <text x="340" y="225" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">4096级调光·1%亮度40步</text>
  <!-- Yes/No labels -->
  <text x="470" y="205" font-family="sans-serif" font-size="10" fill="#7ec27e">≥12位 ✓</text>
  <text x="200" y="205" font-family="sans-serif" font-size="10" fill="#ff7043">≤8位 ✗</text>
  <rect x="120" y="200" width="80" height="25" fill="#2a1515" rx="4" stroke="#d32f2f" stroke-width="1"/>
  <text x="160" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff7043">低亮度必闪!</text>
  <!-- Continue down -->
  <line x1="340" y1="240" x2="340" y2="260" stroke="#7ec27e" stroke-width="1.5"/>
  <!-- Decision 3: EMC certification -->
  <rect x="230" y="260" width="220" height="55" fill="#1a3055" rx="6" stroke="#ffab40" stroke-width="1.5"/>
  <text x="340" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffab40" font-weight="bold">有EMC认证吗?</text>
  <text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">GB/T 17743 / EN 55015</text>
  <!-- Yes/No -->
  <text x="470" y="280" font-family="sans-serif" font-size="10" fill="#7ec27e">有 ✓</text>
  <text x="200" y="280" font-family="sans-serif" font-size="10" fill="#ff7043">只3C ✗</text>
  <rect x="120" y="275" width="80" height="25" fill="#2a1515" rx="4" stroke="#d32f2f" stroke-width="1"/>
  <text x="160" y="293" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff7043">可能干扰Zigbee!</text>
  <!-- Continue down -->
  <line x1="340" y1="315" x2="340" y2="335" stroke="#7ec27e" stroke-width="1.5"/>
  <!-- Decision 4: Temperature data -->
  <rect x="230" y="335" width="220" height="55" fill="#1a3055" rx="6" stroke="#ffab40" stroke-width="1.5"/>
  <text x="340" y="355" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffab40" font-weight="bold">LED温度≤75℃?</text>
  <text x="340" y="375" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">有实测温度数据?</text>
  <!-- Yes/No -->
  <text x="470" y="355" font-family="sans-serif" font-size="10" fill="#7ec27e">≤75℃ ✓</text>
  <text x="200" y="355" font-family="sans-serif" font-size="10" fill="#ff7043">无数据 ✗</text>
  <rect x="120" y="350" width="80" height="25" fill="#2a1515" rx="4" stroke="#d32f2f" stroke-width="1"/>
  <text x="160" y="368" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff7043">寿命打折!</text>
  <!-- Continue down to result -->
  <line x1="340" y1="390" x2="340" y2="420" stroke="#7ec27e" stroke-width="2"/>
  <!-- Pass all 4 checks -->
  <rect x="220" y="420" width="240" height="50" fill="#0d2137" rx="10" stroke="#7ec27e" stroke-width="2" filter="url(#glow3)"/>
  <text x="340" y="443" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7ec27e" font-weight="bold">✓ 4条全过 → 可以选购</text>
  <text x="340" y="462" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#80cbc4">NEXLAMP隔离驱动+Zigbee模块 · 4条全过</text>
</svg>
