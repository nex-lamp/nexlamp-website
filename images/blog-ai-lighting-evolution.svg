    <text x="160" y="163" text-anchor="middle" font-size="8" fill="#fbbf24">10%</text>
    <rect x="180" y="140" width="30" height="60" rx="2" fill="#22d3ee" opacity="0.7"/>
    <text x="195" y="135" text-anchor="middle" font-size="8" fill="#22d3ee">19%</text>
    <rect x="215" y="88" width="30" height="112" rx="2" fill="#a78bfa" opacity="0.8" filter="url(#glow)"/>
    <text x="230" y="83" text-anchor="middle" font-size="8" fill="#a78bfa" font-weight="bold">36%</text>
