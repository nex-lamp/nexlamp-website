  <text x="372" y="246" fill="#ff8c55" font-family="Arial,sans-serif" font-size="10">⚠ 延迟偏高</text>
  <text x="372" y="264" fill="#8899aa" font-family="Arial,sans-serif" font-size="9">适合：米家生态</text>

  <!-- Matter Card -->
  <rect x="525" y="70" width="135" height="200" rx="6" fill="#0d1f3c" stroke="#c084fc" stroke-width="1.5" opacity="0.9"/>
  <rect x="525" y="70" width="135" height="32" rx="6" fill="url(#gradMatter)" opacity="0.3"/>
  <text x="592" y="91" fill="#c084fc" font-family="Consolas,monospace" font-size="14" text-anchor="middle" font-weight="bold">Matter</text>
  <text x="537" y="120" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">🌐 IP原生</text>
  <text x="537" y="138" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">🔗 跨生态</text>
  <line x1="537" y1="148" x2="645" y2="148" stroke="#1a2a4a" stroke-width="0.5"/>
