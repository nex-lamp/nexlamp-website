<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee4444"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa94d"/>
      <stop offset="100%" stop-color="#e8852c"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#e6c200"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69db7c"/>
      <stop offset="100%" stop-color="#40b558"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dabf7"/>
      <stop offset="100%" stop-color="#2b8fd6"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="400" fill="url(#bg1)"/>
  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.5">
    <line x1="80" y1="40" x2="80" y2="340"/>
    <line x1="200" y1="40" x2="200" y2="340"/>
    <line x1="320" y1="40" x2="320" y2="340"/>
    <line x1="440" y1="40" x2="440" y2="340"/>
    <line x1="560" y1="40" x2="560" y2="340"/>
    <line x1="80" y1="340" x2="640" y2="340"/>
    <line x1="80" y1="280" x2="640" y2="280"/>
    <line x1="80" y1="220" x2="640" y2="220"/>
    <line x1="80" y1="160" x2="640" y2="160"/>
    <line x1="80" y1="100" x2="640" y2="100"/>
    <line x1="80" y1="40" x2="640" y2="40"/>
  </g>
  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" fill="#e8eef5" font-size="16" font-weight="bold">电解电容寿命与温度关系（105&#176;C/4000hr基准）</text>
  <!-- Y axis label -->
  <text x="35" y="200" text-anchor="middle" fill="#8aa5c8" font-size="11" transform="rotate(-90,35,200)">寿命（小时）</text>
  <!-- Bars -->
  <g filter="url(#glow1)">
    <rect x="100" y="75" width="70" height="265" fill="url(#bar5)" rx="4"/>
    <text x="135" y="65" text-anchor="middle" fill="#4dabf7" font-size="12" font-weight="bold">64000hr</text>
    <text x="135" y="360" text-anchor="middle" fill="#8aa5c8" font-size="11">65&#176;C</text>
    <text x="135" y="375" text-anchor="middle" fill="#69db7c" font-size="10">~7年</text>
  </g>
  <g filter="url(#glow1)">
    <rect x="220" y="135" width="70" height="205" fill="url(#bar4)" rx="4"/>
    <text x="255" y="125" text-anchor="middle" fill="#69db7c" font-size="12" font-weight="bold">32000hr</text>
    <text x="255" y="360" text-anchor="middle" fill="#8aa5c8" font-size="11">75&#176;C</text>
    <text x="255" y="375" text-anchor="middle" fill="#ffd43b" font-size="10">~3.5年</text>
  </g>
  <g filter="url(#glow1)">
    <rect x="340" y="195" width="70" height="145" fill="url(#bar3)" rx="4"/>
    <text x="375" y="185" text-anchor="middle" fill="#ffd43b" font-size="12" font-weight="bold">16000hr</text>
    <text x="375" y="360" text-anchor="middle" fill="#8aa5c8" font-size="11">85&#176;C</text>
    <text x="375" y="375" text-anchor="middle" fill="#ffa94d" font-size="10">~1.8年</text>
  </g>
  <g filter="url(#glow1)">
    <rect x="460" y="255" width="70" height="85" fill="url(#bar2)" rx="4"/>
    <text x="495" y="245" text-anchor="middle" fill="#ffa94d" font-size="12" font-weight="bold">8000hr</text>
    <text x="495" y="360" text-anchor="middle" fill="#8aa5c8" font-size="11">95&#176;C</text>
    <text x="495" y="375" text-anchor="middle" fill="#ff6b6b" font-size="10">~1年</text>
  </g>
  <g filter="url(#glow1)">
    <rect x="580" y="300" width="50" height="40" fill="url(#bar1)" rx="4"/>
    <text x="605" y="290" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">4000hr</text>
    <text x="605" y="360" text-anchor="middle" fill="#8aa5c8" font-size="11">105&#176;C</text>
    <text x="605" y="375" text-anchor="middle" fill="#ff6b6b" font-size="10">标称值</text>
  </g>
  <!-- Arrow -->
  <path d="M 100 50 L 600 310" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <text x="380" y="50" fill="#ff6b6b" font-size="11" font-weight="bold">每升10&#176;C 寿命减半</text>
  <!-- Bottom note -->
  <text x="340" y="395" text-anchor="middle" fill="#5a7a9e" font-size="10">数据基于阿伦尼乌斯方程估算 | 实际寿命受纹波电流、电容品牌影响</text>
</svg>
