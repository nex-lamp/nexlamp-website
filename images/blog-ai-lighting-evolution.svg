    <rect x="385" y="162" width="30" height="38" rx="2" fill="#fbbf24" opacity="0.7"/>
    <text x="400" y="157" text-anchor="middle" font-size="8" fill="#fbbf24">12%</text>
    <rect x="420" y="126" width="30" height="74" rx="2" fill="#22d3ee" opacity="0.7"/>
    <text x="435" y="121" text-anchor="middle" font-size="8" fill="#22d3ee">23%</text>
    <rect x="455" y="72" width="30" height="128" rx="2" fill="#a78bfa" opacity="0.8" filter="url(#glow)"/>
    <text x="470" y="67" text-anchor="middle" font-size="8" fill="#a78bfa" font-weight="bold">41%</text>
    <!-- Bars - Commercial -->
    <text x="675" y="210" text-anchor="middle" font-size="9" fill="#94a3b8">商业空间</text>
    <rect x="625" y="166" width="30" height="34" rx="2" fill="#fbbf24" opacity="0.7"/>
    <text x="640" y="161" text-anchor="middle" font-size="8" fill="#fbbf24">8%</text>
    <rect x="660" y="146" width="30" height="54" rx="2" fill="#22d3ee" opacity="0.7"/>
    <text x="675" y="141" text-anchor="middle" font-size="8" fill="#22d3ee">17%</text>
    <rect x="695" y="96" width="30" height="104" rx="2" fill="#a78bfa" opacity="0.8" filter="url(#glow)"/>
    <text x="710" y="91" text-anchor="middle" font-size="8" fill="#a78bfa" font-weight="bold">33%</text>
