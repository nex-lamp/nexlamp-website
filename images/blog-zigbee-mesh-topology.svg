<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="480" fill="#0a1628"/>
  <!-- 网格 -->
  <g stroke="#1a2a44" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="560" y1="0" x2="560" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
  </g>
  <!-- 标题 -->
  <rect x="20" y="12" width="420" height="26" rx="4" fill="#0d1f3a" stroke="#00d4ff" stroke-width="1"/>
  <text x="30" y="30" fill="#00d4ff" font-size="13" font-weight="bold">// Zigbee Mesh Network Topology</text>
  <!-- Hub/协调器 -->
  <circle cx="400" cy="240" r="36" fill="#0d2040" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow2)"/>
  <text x="400" y="236" fill="#00d4ff" font-size="10" font-weight="bold" text-anchor="middle">HUB</text>
  <text x="400" y="250" fill="#7be0ff" font-size="9" text-anchor="middle">Coordinator</text>
  <!-- Hub信号环 -->
  <circle cx="400" cy="240" r="55" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- Router节点 - 4个 -->
  <!-- Router 1: 左上 -->
  <circle cx="200" cy="140" r="26" fill="#0a2a1a" stroke="#00ff88" stroke-width="2" filter="url(#glow1)"/>
  <text x="200" y="136" fill="#00ff88" font-size="9" font-weight="bold" text-anchor="middle">灯具A</text>
  <text x="200" y="150" fill="#88ffbb" font-size="8" text-anchor="middle">Router</text>
  <!-- Router 2: 右上 -->
  <circle cx="600" cy="140" r="26" fill="#0a2a1a" stroke="#00ff88" stroke-width="2" filter="url(#glow1)"/>
  <text x="600" y="136" fill="#00ff88" font-size="9" font-weight="bold" text-anchor="middle">插座B</text>
  <text x="600" y="150" fill="#88ffbb" font-size="8" text-anchor="middle">Router</text>
  <!-- Router 3: 左下 -->
  <circle cx="200" cy="340" r="26" fill="#0a2a1a" stroke="#00ff88" stroke-width="2" filter="url(#glow1)"/>
  <text x="200" y="336" fill="#00ff88" font-size="9" font-weight="bold" text-anchor="middle">灯具C</text>
  <text x="200" y="350" fill="#88ffbb" font-size="8" text-anchor="middle">Router</text>
  <!-- Router 4: 右下 -->
  <circle cx="600" cy="340" r="26" fill="#0a2a1a" stroke="#00ff88" stroke-width="2" filter="url(#glow1)"/>
  <text x="600" y="336" fill="#00ff88" font-size="9" font-weight="bold" text-anchor="middle">灯具D</text>
  <text x="600" y="350" fill="#88ffbb" font-size="8" text-anchor="middle">Router</text>
  <!-- End Device节点 -->
  <!-- 传感器1 -->
  <circle cx="100" cy="240" r="18" fill="#1a1a0a" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="100" y="236" fill="#ffaa00" font-size="8" font-weight="bold" text-anchor="middle">传感</text>
  <text x="100" y="248" fill="#ffcc66" font-size="7" text-anchor="middle">End</text>
  <!-- 传感器2 -->
  <circle cx="700" cy="240" r="18" fill="#1a1a0a" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="700" y="236" fill="#ffaa00" font-size="8" font-weight="bold" text-anchor="middle">面板</text>
  <text x="700" y="248" fill="#ffcc66" font-size="7" text-anchor="middle">End</text>
  <!-- 连接线 - Hub到Router -->
  <line x1="373" y1="219" x2="222" y2="161" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.8"/>
  <line x1="427" y1="219" x2="578" y2="161" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.8"/>
  <line x1="373" y1="261" x2="222" y2="319" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.8"/>
  <line x1="427" y1="261" x2="578" y2="319" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.8"/>
  <!-- Router间连接 -->
  <line x1="226" y1="140" x2="574" y2="140" stroke="#00ff88" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <line x1="226" y1="340" x2="574" y2="340" stroke="#00ff88" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <line x1="200" y1="166" x2="200" y2="314" stroke="#00ff88" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <line x1="600" y1="166" x2="600" y2="314" stroke="#00ff88" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <!-- Router到End Device -->
  <line x1="174" y1="140" x2="116" y2="228" stroke="#ffaa00" stroke-width="1" opacity="0.7"/>
  <line x1="626" y1="140" x2="684" y2="228" stroke="#ffaa00" stroke-width="1" opacity="0.7"/>
  <!-- 图例 -->
  <rect x="20" y="430" width="760" height="36" rx="4" fill="#0d1f3a" opacity="0.9"/>
  <circle cx="50" cy="448" r="7" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <text x="63" y="452" fill="#7be0ff" font-size="10">Coordinator (Hub)</text>
  <circle cx="210" cy="448" r="7" fill="none" stroke="#00ff88" stroke-width="2"/>
  <text x="223" y="452" fill="#88ffbb" font-size="10">Router (信号中继)</text>
  <circle cx="380" cy="448" r="7" fill="none" stroke="#ffaa00" stroke-width="2"/>
  <text x="393" y="452" fill="#ffcc66" font-size="10">End Device (终端)</text>
  <line x1="545" y1="448" x2="575" y2="448" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="582" y="452" fill="#7be0ff" font-size="10">信号跳转路径</text>
</svg>
