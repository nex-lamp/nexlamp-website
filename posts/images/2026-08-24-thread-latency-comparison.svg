<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1e3a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3050" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <linearGradient id="barSlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d23f3f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="barMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c97a2a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffa94d" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="barFast" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2d8659" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#51cf66" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="680" height="420" fill="url(#bg)"/>
  <rect width="680" height="420" fill="url(#grid)"/>

  <!-- 标题区 -->
  <text x="40" y="42" fill="#e8f0ff" font-size="20" font-weight="700">三种灯泡延迟实测对比</text>
  <text x="40" y="65" fill="#7ba0d4" font-size="12">RTINGS实验室2026年6月数据 · 本地开关响应时间</text>
  <line x1="40" y1="80" x2="640" y2="80" stroke="#1a3050" stroke-width="1"/>

  <!-- Y轴 -->
  <g stroke="#2a4060" stroke-width="0.8">
    <line x1="80" y1="100" x2="80" y2="350"/>
    <line x1="80" y1="350" x2="640" y2="350"/>
  </g>
  <g fill="#7ba0d4" font-size="11" text-anchor="end">
    <text x="72" y="354">0</text>
    <text x="72" y="304">100ms</text>
    <text x="72" y="254">200ms</text>
    <text x="72" y="204">300ms</text>
    <text x="72" y="154">400ms</text>
  </g>
  <g stroke="#2a4060" stroke-dasharray="2 4" stroke-width="0.5">
    <line x1="80" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="250" x2="640" y2="250"/>
    <line x1="80" y1="200" x2="640" y2="200"/>
    <line x1="80" y1="150" x2="640" y2="150"/>
  </g>

  <!-- Bar1: Wi-Fi 灯泡 280ms (高度从350到140，柱子高210) -->
  <g>
    <rect x="130" y="140" width="100" height="210" rx="4" fill="url(#barSlow)"/>
    <text x="180" y="130" fill="#ff8a8a" font-size="22" font-weight="700" text-anchor="middle" filter="url(#glow)">280ms</text>
    <text x="180" y="375" fill="#e8f0ff" font-size="13" font-weight="600" text-anchor="middle">Wi-Fi 灯泡</text>
    <text x="180" y="395" fill="#7ba0d4" font-size="10" text-anchor="middle">单独连路由器</text>
  </g>

  <!-- Bar2: Thread 单颗 120ms (柱子高150) -->
  <g>
    <rect x="290" y="200" width="100" height="150" rx="4" fill="url(#barMid)"/>
    <text x="340" y="190" fill="#ffd285" font-size="22" font-weight="700" text-anchor="middle" filter="url(#glow)">120ms</text>
    <text x="340" y="375" fill="#e8f0ff" font-size="13" font-weight="600" text-anchor="middle">Thread 单颗</text>
    <text x="340" y="395" fill="#7ba0d4" font-size="10" text-anchor="middle">有边界路由</text>
  </g>

  <!-- Bar3: Mesh全屋 50ms (柱子高63) -->
  <g>
    <rect x="450" y="287" width="100" height="63" rx="4" fill="url(#barFast)"/>
    <text x="500" y="277" fill="#7be495" font-size="22" font-weight="700" text-anchor="middle" filter="url(#glow)">50ms</text>
    <text x="500" y="375" fill="#e8f0ff" font-size="13" font-weight="600" text-anchor="middle">Mesh全屋</text>
    <text x="500" y="395" fill="#7ba0d4" font-size="10" text-anchor="middle">5颗以上互为节点</text>
  </g>

  <!-- 底部时间线 -->
  <g transform="translate(0,0)">
    <line x1="40" y1="408" x2="640" y2="408" stroke="#2a4060" stroke-width="0.5"/>
    <text x="40" y="420" fill="#5a7ba5" font-size="10">NEXLAMP</text>
    <text x="640" y="420" fill="#5a7ba5" font-size="10" text-anchor="end">来源：RTINGS实验室 + 工程师实测</text>
  </g>

  <!-- 装饰发光点 -->
  <circle cx="600" cy="60" r="3" fill="#51cf66">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
