<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="bold">各房间智能照明改造方案推荐</text>
  
  <!-- Bedroom section -->
  <g transform="translate(135,160)">
    <!-- Room outline -->
    <rect x="-90" y="-50" width="180" height="180" rx="10" fill="#0d1a2d" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
    <!-- Bed icon -->
    <rect x="-50" y="20" width="100" height="55" rx="8" fill="none" stroke="#7c4dff" stroke-width="1.5"/>
    <rect x="-50" y="15" width="100" height="15" rx="5" fill="#7c4dff" opacity="0.2" stroke="#7c4dff" stroke-width="1"/>
    <circle cx="-25" cy="23" r="6" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="25" cy="23" r="6" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <!-- Light glow -->
    <circle cx="0" cy="-15" r="20" fill="#ffd700" opacity="0.08" filter="url(#glow3)"/>
    <circle cx="0" cy="-15" r="10" fill="#ffd700" opacity="0.15"/>
    
    <text x="0" y="-30" text-anchor="middle" fill="#00d4ff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">🛏️ 卧室</text>
    <text x="0" y="95" text-anchor="middle" fill="#00e676" font-family="Arial,sans-serif" font-size="11" font-weight="bold">优先级：★★★</text>
    <text x="0" y="112" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="10">无线开关+调光灯泡</text>
    <text x="0" y="127" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="10">渐暗入睡 / 暖光唤醒</text>
    
    <!-- Cost -->
    <rect x="-35" y="133" width="70" height="20" rx="4" fill="#1a3040"/>
    <text x="0" y="148" text-anchor="middle" fill="#ffd700" font-family="Arial,sans-serif" font-size="10">200-400元</text>
  </g>
  
  <!-- Living Room section -->
  <g transform="translate(400,160)">
    <rect x="-90" y="-50" width="180" height="180" rx="10" fill="#0d1a2d" stroke="#7c4dff" stroke-width="1.5" opacity="0.9"/>
    <!-- Sofa icon -->
    <rect x="-55" y="25" width="110" height="35" rx="8" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
    <rect x="-55" y="15" width="25" height="15" rx="5" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <rect x="30" y="15" width="25" height="15" rx="5" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <!-- TV -->
    <rect x="-30" y="-5" width="60" height="15" rx="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <!-- Multiple lights -->
    <circle cx="-40" cy="-20" r="8" fill="#ffd700" opacity="0.12" filter="url(#glow3)"/>
    <circle cx="0" cy="-25" r="10" fill="#ffd700" opacity="0.15" filter="url(#glow3)"/>
    <circle cx="40" cy="-20" r="8" fill="#ffd700" opacity="0.12" filter="url(#glow3)"/>
    
    <text x="0" y="-30" text-anchor="middle" fill="#7c4dff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">🛋️ 客厅</text>
    <text x="0" y="95" text-anchor="middle" fill="#ffa726" font-family="Arial,sans-serif" font-size="11" font-weight="bold">优先级：★★</text>
    <text x="0" y="112" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="10">智能开关多路控制</text>
    <text x="0" y="127" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="10">观影/会客场景切换</text>
    
    <rect x="-35" y="133" width="70" height="20" rx="4" fill="#1a3040"/>
    <text x="0" y="148" text-anchor="middle" fill="#ffd700" font-family="Arial,sans-serif" font-size="10">400-800元</text>
  </g>
  
  <!-- Hallway section -->
  <g transform="translate(665,160)">
    <rect x="-90" y="-50" width="180" height="180" rx="10" fill="#0d1a2d" stroke="#00e676" stroke-width="1.5" opacity="0.9"/>
    <!-- Door frame -->
    <rect x="-20" y="10" width="40" height="55" rx="2" fill="none" stroke="#00e676" stroke-width="1.5"/>
    <line x1="-20" y1="10" x2="-20" y2="65" stroke="#00e676" stroke-width="1.5"/>
    <circle cx="12" cy="40" r="3" fill="#00e676" opacity="0.5"/>
    <!-- Motion sensor icon -->
    <circle cx="0" cy="-10" r="12" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
    <path d="M-5,-10 L0,-14 L5,-10" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
    <line x1="0" y1="-14" x2="0" y2="-6" stroke="#ff6b6b" stroke-width="1.5"/>
    <!-- Sensor waves -->
    <path d="M15,-15 Q22,-10 15,-5" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.5"/>
    <path d="M20,-18 Q30,-10 20,-2" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    
    <text x="0" y="-30" text-anchor="middle" fill="#00e676" font-family="Arial,sans-serif" font-size="14" font-weight="bold">🚶 走廊/玄关</text>
    <text x="0" y="95" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">优先级：★</text>
    <text x="0" y="112" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="10">人体感应+无线开关</text>
    <text x="0" y="127" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="10">人来灯亮 / 人走灯灭</text>
    
    <rect x="-35" y="133" width="70" height="20" rx="4" fill="#1a3040"/>
    <text x="0" y="148" text-anchor="middle" fill="#ffd700" font-family="Arial,sans-serif" font-size="10">100-200元</text>
  </g>
  
  <!-- Renovation order flow -->
  <text x="400" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">推荐改造顺序</text>
  
  <g transform="translate(400,420)">
    <!-- Step 1 -->
    <rect x="-280" y="-15" width="140" height="35" rx="17" fill="#0d1a2d" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="-210" y="7" text-anchor="middle" fill="#00d4ff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">① 卧室先行</text>
    
    <!-- Arrow -->
    <line x1="-135" y1="2" x2="-105" y2="2" stroke="#00d4ff" stroke-width="1.5" marker-end="none"/>
    <polygon points="-105,-3 -95,2 -105,7" fill="#00d4ff"/>
    
    <!-- Step 2 -->
    <rect x="-90" y="-15" width="140" height="35" rx="17" fill="#0d1a2d" stroke="#7c4dff" stroke-width="1.5"/>
    <text x="-20" y="7" text-anchor="middle" fill="#7c4dff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">② 走廊/玄关</text>
    
    <!-- Arrow -->
    <line x1="55" y1="2" x2="85" y2="2" stroke="#7c4dff" stroke-width="1.5"/>
    <polygon points="85,-3 95,2 85,7" fill="#7c4dff"/>
    
    <!-- Step 3 -->
    <rect x="100" y="-15" width="140" height="35" rx="17" fill="#0d1a2d" stroke="#00e676" stroke-width="1.5"/>
    <text x="170" y="7" text-anchor="middle" fill="#00e676" font-family="Arial,sans-serif" font-size="12" font-weight="bold">③ 客厅整合</text>
  </g>
  
  <!-- Total budget -->
  <rect x="250" y="460" width="300" height="30" rx="8" fill="#1a3040" stroke="#ffd700" stroke-width="0.5"/>
  <text x="400" y="480" text-anchor="middle" fill="#ffd700" font-family="Arial,sans-serif" font-size="13">全屋改造预算：800 - 2000 元</text>
</svg>