<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d4a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#0a1628"/>
  <rect width="800" height="500" fill="url(#grid3)"/>
  <!-- Frame -->
  <rect x="30" y="20" width="740" height="460" rx="8" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="30" y="20" width="740" height="32" rx="8" fill="#0d1f35"/>
  <rect x="30" y="44" width="740" height="8" fill="#0d1f35"/>
  <circle cx="50" cy="36" r="5" fill="#ff5f57"/>
  <circle cx="70" cy="36" r="5" fill="#febc2e"/>
  <circle cx="90" cy="36" r="5" fill="#28c840"/>
  <text x="60" y="37" font-family="monospace" font-size="11" fill="#7eb8da" text-anchor="start" dominant-baseline="central">&lt; LED Driver Selection Guide &gt;</text>
  <!-- Title -->
  <text x="400" y="80" font-family="monospace" font-size="15" fill="#00d4ff" text-anchor="middle" filter="url(#glow3)">DRIVER POWER SUPPLY CHECKLIST</text>
  <!-- 3 Key Metrics -->
  <!-- Metric 1 -->
  <rect x="50" y="100" width="220" height="170" rx="6" fill="#0d1f35" stroke="#1e3a5f" stroke-width="1"/>
  <text x="160" y="128" font-family="monospace" font-size="13" fill="#00d4ff" text-anchor="middle" font-weight="bold">01 Ripple Current</text>
  <text x="70" y="152" font-family="monospace" font-size="11" fill="#8899aa">Output current ripple</text>
  <text x="70" y="170" font-family="monospace" font-size="11" fill="#8899aa">determines flicker level.</text>
  <rect x="70" y="185" width="180" height="20" rx="3" fill="#111827"/>
  <rect x="70" y="185" width="126" height="20" rx="3" fill="#28c840" opacity="0.6"/>
  <text x="70" y="199" font-family="monospace" font-size="10" fill="#fff">5%  Target: &lt; 5%</text>
  <!-- Ripple visualization -->
  <polyline points="70,245 90,237 110,250 130,234 150,248 170,236 190,246 210,238 230,245 250,240" fill="none" stroke="#28c840" stroke-width="1.5" filter="url(#glow3)"/>
  <text x="160" y="260" font-family="monospace" font-size="10" fill="#556677" text-anchor="middle">Low ripple = smooth light</text>
  <!-- Metric 2 -->
  <rect x="290" y="100" width="220" height="170" rx="6" fill="#0d1f35" stroke="#1e3a5f" stroke-width="1"/>
  <text x="400" y="128" font-family="monospace" font-size="13" fill="#00d4ff" text-anchor="middle" font-weight="bold">02 Dimming Depth</text>
  <text x="310" y="152" font-family="monospace" font-size="11" fill="#8899aa">How low can you dim</text>
  <text x="310" y="170" font-family="monospace" font-size="11" fill="#8899aa">without color shift?</text>
  <rect x="310" y="185" width="180" height="20" rx="3" fill="#111827"/>
  <rect x="310" y="185" width="9" height="20" rx="3" fill="#febc2e" opacity="0.6"/>
  <text x="310" y="199" font-family="monospace" font-size="10" fill="#fff">1%  Target: &lt; 1%</text>
  <!-- Depth bar -->
  <rect x="310" y="225" width="180" height="10" rx="2" fill="#111827"/>
  <rect x="489" y="225" width="1" height="10" fill="#febc2e" filter="url(#glow3)"/>
  <text x="400" y="250" font-family="monospace" font-size="10" fill="#556677" text-anchor="middle">100% ---------- 1%</text>
  <text x="310" y="260" font-family="monospace" font-size="10" fill="#556677">No color drift at low end</text>
  <!-- Metric 3 -->
  <rect x="530" y="100" width="220" height="170" rx="6" fill="#0d1f35" stroke="#1e3a5f" stroke-width="1"/>
  <text x="640" y="128" font-family="monospace" font-size="13" fill="#00d4ff" text-anchor="middle" font-weight="bold">03 PWM Frequency</text>
  <text x="550" y="152" font-family="monospace" font-size="11" fill="#8899aa">Switching frequency for</text>
  <text x="550" y="170" font-family="monospace" font-size="11" fill="#8899aa">PWM dimming mode.</text>
  <rect x="550" y="185" width="180" height="20" rx="3" fill="#111827"/>
  <rect x="550" y="185" width="180" height="20" rx="3" fill="#ff6b6b" opacity="0.6"/>
  <text x="550" y="199" font-family="monospace" font-size="10" fill="#fff">25kHz  Target: &gt;= 25kHz</text>
  <!-- Freq visualization -->
  <polyline points="550,245 552,225 554,245 556,225 558,245 560,225 562,245 564,225 566,245 568,225 570,245" fill="none" stroke="#ff6b6b" stroke-width="1.2"/>
  <text x="640" y="253" font-family="monospace" font-size="10" fill="#556677" text-anchor="middle">Higher = safer</text>
  <!-- Bottom summary -->
  <rect x="50" y="290" width="700" height="170" rx="6" fill="#0d1f35" stroke="#1e3a5f" stroke-width="1"/>
  <text x="400" y="318" font-family="monospace" font-size="13" fill="#00d4ff" text-anchor="middle" font-weight="bold" filter="url(#glow3)">QUICK BUYING GUIDE</text>
  <line x1="50" y1="328" x2="750" y2="328" stroke="#1e3a5f" stroke-width="0.8"/>
  <!-- Checklist items -->
  <text x="70" y="355" font-family="monospace" font-size="11" fill="#28c840">[ ]</text>
  <text x="90" y="355" font-family="monospace" font-size="11" fill="#ccddee">Look for "analog dimming" or "constant current dimming" label</text>
  <text x="70" y="378" font-family="monospace" font-size="11" fill="#28c840">[ ]</text>
  <text x="90" y="378" font-family="monospace" font-size="11" fill="#ccddee">Check IEEE PAR1789 or IEC TR 61547-1 certification</text>
  <text x="70" y="401" font-family="monospace" font-size="11" fill="#28c840">[ ]</text>
  <text x="90" y="401" font-family="monospace" font-size="11" fill="#ccddee">Test at lowest brightness with phone camera</text>
  <text x="70" y="424" font-family="monospace" font-size="11" fill="#28c840">[ ]</text>
  <text x="90" y="424" font-family="monospace" font-size="11" fill="#ccddee">For PWM: confirm frequency &gt;= 25kHz from spec sheet</text>
  <text x="70" y="447" font-family="monospace" font-size="11" fill="#28c840">[ ]</text>
  <text x="90" y="447" font-family="monospace" font-size="11" fill="#ccddee">Check ripple current &lt; 5% in driver datasheet</text>
</svg>
