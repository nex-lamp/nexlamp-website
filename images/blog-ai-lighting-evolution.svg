    <circle cx="195" cy="55" r="4" fill="#22d3ee" opacity="0.7"/>
    <text x="203" y="59" font-size="8" fill="#94a3b8">智能</text>
    <circle cx="240" cy="55" r="4" fill="#a78bfa" opacity="0.8"/>
    <text x="248" y="59" font-size="8" fill="#94a3b8">AI</text>
