<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="12" fill="url(#bg)"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">AI照明 vs 传统智能照明：核心能力对比</text>
  <text x="400" y="58" text-anchor="middle" font-size="11" fill="#64748b">AI不是取代智能照明，而是在IoT基础上叠加认知和决策能力</text>
  <!-- Table header -->
  <rect x="40" y="75" width="150" height="40" rx="6" fill="#1e293b"/>
  <text x="115" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="white">对比维度</text>
  <rect x="195" y="75" width="280" height="40" rx="6" fill="#3b82f6"/>
  <text x="335" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="white">传统智能照明</text>
  <rect x="480" y="75" width="280" height="40" rx="6" fill="#7c3aed"/>
  <text x="620" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AI照明</text>
  <!-- Row 1 -->
  <rect x="40" y="120" width="150" height="50" rx="0" fill="#f1f5f9"/>
  <text x="115" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">调光策略</text>
  <rect x="195" y="120" width="280" height="50" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="335" y="143" text-anchor="middle" font-size="11" fill="#475569">预设规则触发</text>
  <text x="335" y="160" text-anchor="middle" font-size="9" fill="#94a3b8">定时/场景模式/手动</text>
  <rect x="480" y="120" width="280" height="50" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="143" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="bold">实时自适应调光</text>
  <text x="620" y="160" text-anchor="middle" font-size="9" fill="#a78bfa">环境+行为+偏好融合</text>
  <!-- Row 2 -->
  <rect x="40" y="173" width="150" height="50" fill="#f1f5f9"/>
  <text x="115" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">节能效果</text>
  <rect x="195" y="173" width="280" height="50" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="335" y="196" text-anchor="middle" font-size="11" fill="#475569">10-20% 节能</text>
  <text x="335" y="213" text-anchor="middle" font-size="9" fill="#94a3b8">人走灯灭+定时降亮</text>
  <rect x="480" y="173" width="280" height="50" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="196" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="bold">30-50% 节能</text>
  <text x="620" y="213" text-anchor="middle" font-size="9" fill="#a78bfa">精细调度+预测优化</text>
  <!-- Row 3 -->
  <rect x="40" y="226" width="150" height="50" fill="#f1f5f9"/>
  <text x="115" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">维护方式</text>
  <rect x="195" y="226" width="280" height="50" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="335" y="249" text-anchor="middle" font-size="11" fill="#475569">被动维修</text>
  <text x="335" y="266" text-anchor="middle" font-size="9" fill="#94a3b8">故障后人工排查</text>
  <rect x="480" y="226" width="280" height="50" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="249" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="bold">预测性维护</text>
  <text x="620" y="266" text-anchor="middle" font-size="9" fill="#a78bfa">异常检测+提前告警</text>
  <!-- Row 4 -->
  <rect x="40" y="279" width="150" height="50" fill="#f1f5f9"/>
  <text x="115" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">用户体验</text>
  <rect x="195" y="279" width="280" height="50" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="335" y="302" text-anchor="middle" font-size="11" fill="#475569">主动操作为主</text>
  <text x="335" y="319" text-anchor="middle" font-size="9" fill="#94a3b8">APP/面板/语音指令</text>
  <rect x="480" y="279" width="280" height="50" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="302" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="bold">无感体验</text>
  <text x="620" y="319" text-anchor="middle" font-size="9" fill="#a78bfa">自动适配需求、零操作</text>
  <!-- Row 5 -->
  <rect x="40" y="332" width="150" height="50" fill="#f1f5f9"/>
  <text x="115" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">数据价值</text>
  <rect x="195" y="332" width="280" height="50" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="335" y="355" text-anchor="middle" font-size="11" fill="#475569">基础状态监控</text>
  <text x="335" y="372" text-anchor="middle" font-size="9" fill="#94a3b8">在线/离线/电量</text>
  <rect x="480" y="332" width="280" height="50" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="355" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="bold">深度洞察</text>
  <text x="620" y="372" text-anchor="middle" font-size="9" fill="#a78bfa">行为模式/空间优化/ESG</text>
  <!-- Bottom insight -->
  <rect x="120" y="392" width="560" height="22" rx="11" fill="#7c3aed" opacity="0.1"/>
  <text x="400" y="407" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="bold">💡 关键跃迁：从「人控灯」到「灯懂人」——AI让照明从工具升级为空间智能服务</text>
</svg>