<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff6644" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="480" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g stroke="#1a2f4e" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="400" x2="680" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="340" y1="0" x2="340" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="580" y1="0" x2="580" y2="480"/>
  </g>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">传统联网照明 vs 轻智能照明：信号链路对比</text>

  <!-- ===== Traditional (Top) ===== -->
  <rect x="20" y="50" width="640" height="160" fill="url(#redGlow)" rx="8" stroke="#ff4444" stroke-width="1" stroke-opacity="0.3"/>
  
  <text x="35" y="75" fill="#ff6666" font-size="13" font-weight="bold">传统联网方案（7步链路 · 延迟1.5-3秒）</text>

  <!-- 7 steps -->
  <g font-size="10" fill="#cbd5e1">
    <!-- Step boxes -->
    <rect x="30" y="95" width="70" height="35" fill="#1e293b" stroke="#ff6b6b" stroke-width="1" rx="4"/>
    <text x="65" y="110" text-anchor="middle">麦克风</text>
    <text x="65" y="122" text-anchor="middle" font-size="8" fill="#94a3b8">拾音</text>
    
    <rect x="115" y="95" width="70" height="35" fill="#1e293b" stroke="#ff6b6b" stroke-width="1" rx="4"/>
    <text x="150" y="110" text-anchor="middle">前端处理</text>
    <text x="150" y="122" text-anchor="middle" font-size="8" fill="#94a3b8">本地降噪</text>
    
    <rect x="200" y="95" width="70" height="35" fill="#2d1b1b" stroke="#ff4444" stroke-width="1.5" rx="4" filter="url(#glow)"/>
    <text x="235" y="110" text-anchor="middle" fill="#ff9999">网络上传</text>
    <text x="235" y="122" text-anchor="middle" font-size="8" fill="#ff6b6b">⚠ WiFi依赖</text>
    
    <rect x="285" y="95" width="70" height="35" fill="#2d1b1b" stroke="#ff4444" stroke-width="1.5" rx="4" filter="url(#glow)"/>
    <text x="320" y="110" text-anchor="middle" fill="#ff9999">云端ASR</text>
    <text x="320" y="122" text-anchor="middle" font-size="8" fill="#ff6b6b">⚠ 服务器识别</text>
    
    <rect x="370" y="95" width="70" height="35" fill="#1e293b" stroke="#ff6b6b" stroke-width="1" rx="4"/>
    <text x="405" y="110" text-anchor="middle">语义解析</text>
    <text x="405" y="122" text-anchor="middle" font-size="8" fill="#94a3b8">指令生成</text>
    
    <rect x="455" y="95" width="70" height="35" fill="#2d1b1b" stroke="#ff4444" stroke-width="1.5" rx="4" filter="url(#glow)"/>
    <text x="490" y="110" text-anchor="middle" fill="#ff9999">指令下发</text>
    <text x="490" y="122" text-anchor="middle" font-size="8" fill="#ff6b6b">⚠ 网络返回</text>
    
    <rect x="540" y="95" width="70" height="35" fill="#1e293b" stroke="#ff6b6b" stroke-width="1" rx="4"/>
    <text x="575" y="110" text-anchor="middle">灯具执行</text>
    <text x="575" y="122" text-anchor="middle" font-size="8" fill="#94a3b8">开灯/调光</text>
  </g>

  <!-- Arrows for traditional -->
  <g stroke="#ff6b6b" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="100" y1="112" x2="115" y2="112"/>
    <polygon points="115,112 110,109 110,115" fill="#ff6b6b"/>
    <line x1="185" y1="112" x2="200" y2="112"/>
    <polygon points="200,112 195,109 195,115" fill="#ff6b6b"/>
    <line x1="270" y1="112" x2="285" y2="112"/>
    <polygon points="285,112 280,109 280,115" fill="#ff6b6b"/>
    <line x1="355" y1="112" x2="370" y2="112"/>
    <polygon points="370,112 365,109 365,115" fill="#ff6b6b"/>
    <line x1="440" y1="112" x2="455" y2="112"/>
    <polygon points="455,112 450,109 450,115" fill="#ff6b6b"/>
    <line x1="525" y1="112" x2="540" y2="112"/>
    <polygon points="540,112 535,109 535,115" fill="#ff6b6b"/>
  </g>

  <!-- Cloud icon -->
  <g transform="translate(305, 155)">
    <ellipse cx="25" cy="15" rx="22" ry="10" fill="#1e293b" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
    <text x="25" y="18" text-anchor="middle" font-size="8" fill="#ff9999">☁️ 云端服务器</text>
  </g>

  <!-- Warning labels -->
  <text x="340" y="195" text-anchor="middle" fill="#ff6b6b" font-size="10">⚠ 网络中断 = 全链路瘫痪 · 隐私数据上传云端</text>

  <!-- ===== Lightweight (Bottom) ===== -->
  <rect x="20" y="260" width="640" height="160" fill="url(#greenGlow)" rx="8" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  
  <text x="35" y="285" fill="#4ade80" font-size="13" font-weight="bold">轻智能方案（3步链路 · 延迟0.2-0.3秒）</text>

  <!-- 3 steps -->
  <g font-size="11" fill="#cbd5e1">
    <rect x="80" y="305" width="120" height="45" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5" rx="6" filter="url(#glow)"/>
    <text x="140" y="323" text-anchor="middle" fill="#86efac">麦克风拾音</text>
    <text x="140" y="338" text-anchor="middle" font-size="9" fill="#6ee7b7">本地采集</text>
    
    <rect x="280" y="305" width="120" height="45" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5" rx="6" filter="url(#glow)"/>
    <text x="340" y="323" text-anchor="middle" fill="#86efac">离线芯片识别</text>
    <text x="340" y="338" text-anchor="middle" font-size="9" fill="#6ee7b7">本地AI处理 · 无网络</text>
    
    <rect x="480" y="305" width="120" height="45" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5" rx="6" filter="url(#glow)"/>
    <text x="540" y="323" text-anchor="middle" fill="#86efac">灯具执行</text>
    <text x="540" y="338" text-anchor="middle" font-size="9" fill="#6ee7b7">开灯/调光/色温</text>
  </g>

  <!-- Arrows for lightweight -->
  <g stroke="#4ade80" stroke-width="2" fill="none">
    <line x1="200" y1="327" x2="280" y2="327"/>
    <polygon points="280,327 272,322 272,332" fill="#4ade80"/>
    <line x1="400" y1="327" x2="480" y2="327"/>
    <polygon points="480,327 472,322 472,332" fill="#4ade80"/>
  </g>

  <!-- Chip icon -->
  <g transform="translate(310, 365)">
    <rect x="0" y="0" width="60" height="30" fill="#1a2e1a" stroke="#22c55e" stroke-width="1" rx="4" opacity="0.6"/>
    <text x="30" y="20" text-anchor="middle" font-size="9" fill="#6ee7b7">芯片内置 · 即说即应</text>
  </g>

  <!-- Benefits -->
  <text x="340" y="410" text-anchor="middle" fill="#4ade80" font-size="10">✓ 断网照常工作 · ✓ 隐私不出灯具 · ✓ 老人3分钟上手 · ✓ 0.2秒极速响应</text>

  <!-- Bottom label -->
  <text x="340" y="450" text-anchor="middle" fill="#64748b" font-size="9">数据来源：2026光亚展行业报告 · 深圳写字楼实测案例</text>
</svg>