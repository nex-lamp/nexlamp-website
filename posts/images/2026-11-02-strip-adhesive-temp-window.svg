<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2b45" stroke-width="1"/>
    </pattern>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7ec27e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="720" fill="#0a1628"/>
  <rect width="1080" height="720" fill="url(#grid)"/>
  <text x="60" y="78" fill="#e2e8f0" font-family="sans-serif" font-size="40" font-weight="bold">压敏胶的"温度窗口"</text>
  <text x="60" y="118" fill="#7c8db0" font-family="sans-serif" font-size="22">灯带背胶靠"流动润湿"粘住表面 —— 温度决定它能不能流</text>

  <!-- temperature axis -->
  <line x1="100" y1="560" x2="980" y2="560" stroke="#3b5077" stroke-width="3"/>
  <g font-family="sans-serif" font-size="24" fill="#7c8db0" text-anchor="middle">
    <text x="220" y="600">0℃</text><text x="430" y="600">10℃</text><text x="640" y="600">15~25℃</text><text x="880" y="600">40℃+</text>
  </g>
  <text x="540" y="645" fill="#7c8db0" font-family="sans-serif" font-size="20" text-anchor="middle">施工环境温度</text>

  <!-- zones -->
  <rect x="120" y="200" width="220" height="340" rx="10" fill="#1b2a44" stroke="#e05252" stroke-width="2"/>
  <rect x="370" y="200" width="120" height="340" rx="10" fill="#1b2a44" stroke="#e0a052" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="520" y="200" width="240" height="340" rx="10" fill="#122c3f" stroke="url(#ok)" stroke-width="3" filter="url(#glow)"/>
  <rect x="790" y="200" width="190" height="340" rx="10" fill="#1b2a44" stroke="#e0a052" stroke-width="2"/>

  <g font-family="sans-serif" text-anchor="middle">
    <text x="230" y="245" fill="#e05252" font-size="26" font-weight="bold">玻璃态 ❄</text>
    <text x="230" y="300" fill="#aebadb" font-size="20">胶变硬流不动</text>
    <text x="230" y="335" fill="#aebadb" font-size="20">润湿失败</text>
    <text x="230" y="378" fill="#e07070" font-size="20" font-weight="bold">初期假粘</text>
    <text x="230" y="410" fill="#e07070" font-size="20" font-weight="bold">几天后脱落</text>
    <text x="230" y="470" fill="#7c8db0" font-size="18">最低施工温度</text>
    <text x="230" y="498" fill="#7c8db0" font-size="18">多数背胶 10~15℃</text>

    <text x="430" y="245" fill="#e0a052" font-size="24" font-weight="bold">临界</text>
    <text x="430" y="300" fill="#aebadb" font-size="19">初粘不稳</text>
    <text x="430" y="330" fill="#aebadb" font-size="19">需预热</text>

    <text x="640" y="245" fill="#7ec27e" font-size="26" font-weight="bold">黏弹态 ✦ 最佳</text>
    <text x="640" y="300" fill="#c7e8d0" font-size="20">胶流进表面微观凹凸</text>
    <text x="640" y="335" fill="#c7e8d0" font-size="20">接触面积最大化</text>
    <text x="640" y="378" fill="#7ec27e" font-size="20" font-weight="bold">24~72h 长出真强度</text>
    <text x="640" y="470" fill="#7c8db0" font-size="18">VHB GPL 系列</text>
    <text x="640" y="498" fill="#7c8db0" font-size="18">无霜表面低至 0℃</text>

    <text x="885" y="245" fill="#e0a052" font-size="26" font-weight="bold">软化 ⚠</text>
    <text x="885" y="300" fill="#aebadb" font-size="20">胶体流失</text>
    <text x="885" y="335" fill="#aebadb" font-size="20">加速老化</text>
    <text x="885" y="378" fill="#e0a052" font-size="20" font-weight="bold">别拿热风枪烤胶</text>
  </g>

  <!-- condensation note -->
  <rect x="100" y="90" width="880" height="0" fill="none"/>
  <rect x="100" y="150" width="880" height="36" rx="8" fill="#132c47" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="540" y="175" fill="#9fd8e8" font-family="sans-serif" font-size="20" text-anchor="middle">冬天帮凶：供暖季金属/玻璃表面结露膜，胶碰水膜直接不附着 —— 贴前确认表面干燥</text>
</svg>
