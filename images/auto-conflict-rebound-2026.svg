<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="640" fill="url(#bg)"/>
  <g stroke="#12305a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="107" x2="1080" y2="107"/><line x1="0" y1="214" x2="1080" y2="214"/>
    <line x1="0" y1="321" x2="1080" y2="321"/><line x1="0" y1="428" x2="1080" y2="428"/>
    <line x1="0" y1="535" x2="1080" y2="535"/>
    <line x1="216" y1="0" x2="216" y2="640"/><line x1="432" y1="0" x2="432" y2="640"/>
    <line x1="648" y1="0" x2="648" y2="640"/><line x1="864" y1="0" x2="864" y2="640"/>
  </g>
  <text x="540" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#e8f1ff">为什么手动关灯会被"回弹"</text>
  <text x="540" y="80" text-anchor="middle" font-size="15" fill="#7aa5d8">事件型规则没有记忆：你改的是灯，它记的是"房间有人"</text>

  <rect x="60" y="115" width="215" height="90" rx="10" fill="#101f38" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="167" y="150" text-anchor="middle" font-size="16" fill="#38bdf8" font-weight="bold">传感器上报</text>
  <text x="167" y="180" text-anchor="middle" font-size="13" fill="#cfe0f5">"有人" 事件</text>

  <rect x="325" y="115" width="215" height="90" rx="10" fill="#101f38" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="432" y="150" text-anchor="middle" font-size="16" fill="#60a5fa" font-weight="bold">规则执行</text>
  <text x="432" y="180" text-anchor="middle" font-size="13" fill="#cfe0f5">开灯</text>

  <rect x="590" y="115" width="215" height="90" rx="10" fill="#101f38" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="697" y="150" text-anchor="middle" font-size="16" fill="#a78bfa" font-weight="bold">你手动关灯</text>
  <text x="697" y="180" text-anchor="middle" font-size="13" fill="#cfe0f5">只改了灯的当前状态</text>

  <rect x="855" y="115" width="165" height="90" rx="10" fill="#101f38" stroke="#f87171" stroke-width="1.5"/>
  <text x="937" y="150" text-anchor="middle" font-size="16" fill="#f87171" font-weight="bold">规则判定</text>
  <text x="937" y="180" text-anchor="middle" font-size="13" fill="#e0b8b8">"有人"仍然成立</text>

  <line x1="275" y1="160" x2="315" y2="160" stroke="#5f7ea8" stroke-width="2"/>
  <line x1="540" y1="160" x2="580" y2="160" stroke="#5f7ea8" stroke-width="2"/>
  <line x1="805" y1="160" x2="845" y2="160" stroke="#5f7ea8" stroke-width="2"/>

  <path d="M937 215 L937 265 Q937 285 917 285 L167 285 Q147 285 147 305 L147 315" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 5"/>
  <polygon points="141,311 153,311 147,323" fill="#f87171"/>
  <text x="540" y="277" text-anchor="middle" font-size="14" fill="#f87171">几秒后再上报一次，或云端重连补一次状态同步 → 开灯指令又来了</text>

  <rect x="60" y="335" width="460" height="210" rx="12" fill="#2a1010" stroke="#ef4444" stroke-width="1.5"/>
  <text x="290" y="375" text-anchor="middle" font-size="18" fill="#f87171" font-weight="bold">多条规则一起抢：谁最后执行谁说了算</text>
  <text x="290" y="410" text-anchor="middle" font-size="14" fill="#e0b8b8">人来开灯 · 开门迎宾 · 定时夜灯 · 语音场景</text>
  <text x="290" y="444" text-anchor="middle" font-size="14" fill="#e0b8b8">你关的是灯，它们改的是"应该亮"</text>
  <text x="290" y="490" text-anchor="middle" font-size="15" fill="#fca5a5">错修：换更贵的传感器、反复调灵敏度</text>
  <text x="290" y="520" text-anchor="middle" font-size="13" fill="#c08a8a">规则没变，换什么设备都照样回弹</text>

  <rect x="560" y="335" width="460" height="210" rx="12" fill="#0f2a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="790" y="375" text-anchor="middle" font-size="18" fill="#4ade80" font-weight="bold">正确修法：给手动操作最高优先级</text>
  <text x="790" y="410" text-anchor="middle" font-size="14" fill="#a7d9b8">手动关灯后，锁定 3—10 分钟不许自动化回弹</text>
  <text x="790" y="444" text-anchor="middle" font-size="14" fill="#a7d9b8">触发加栅栏：有人 且 照度低，再套时间窗</text>
  <text x="790" y="490" text-anchor="middle" font-size="15" fill="#86efac">没有锁定功能，就留一个能真正断电的开关</text>
  <text x="790" y="520" text-anchor="middle" font-size="13" fill="#7ba88d">锁定窗口是行业常见做法，不是国家标准</text>

  <text x="540" y="590" text-anchor="middle" font-size="14" fill="#5f7ea8">判断标准：重要闭环留在本地网关，云端只管远程查看、升级和统计</text>
</svg>
