<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow_red">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="460" fill="#0a1628"/>
  <!-- 网格 -->
  <g stroke="#1a2a44" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="80" y1="0" x2="80" y2="460"/>
    <line x1="160" y1="0" x2="160" y2="460"/>
    <line x1="240" y1="0" x2="240" y2="460"/>
    <line x1="320" y1="0" x2="320" y2="460"/>
    <line x1="400" y1="0" x2="400" y2="460"/>
    <line x1="480" y1="0" x2="480" y2="460"/>
    <line x1="560" y1="0" x2="560" y2="460"/>
    <line x1="640" y1="0" x2="640" y2="460"/>
    <line x1="720" y1="0" x2="720" y2="460"/>
  </g>
  <!-- 标题栏 -->
  <rect x="20" y="12" width="520" height="26" rx="4" fill="#0d1f3a" stroke="#00d4ff" stroke-width="1"/>
  <text x="30" y="30" fill="#00d4ff" font-size="13" font-weight="bold">// LED Driver + Zigbee Module Integration Analysis</text>
  <!-- 左侧: 优质驱动 -->
  <rect x="30" y="55" width="340" height="360" rx="8" fill="#0d2040" stroke="#00ff88" stroke-width="1.5"/>
  <rect x="30" y="55" width="340" height="30" rx="8" fill="#00ff88" opacity="0.15"/>
  <text x="200" y="76" fill="#00ff88" font-size="12" font-weight="bold" text-anchor="middle">✓ 优质驱动 (已认证)</text>
  <!-- 驱动内部结构 -->
  <rect x="50" y="100" width="300" height="55" rx="5" fill="#0a1e30" stroke="#1e4060" stroke-width="1"/>
  <text x="200" y="122" fill="#7be0ff" font-size="10" text-anchor="middle">AC/DC 转换模块</text>
  <text x="200" y="138" fill="#4a9fff" font-size="9" text-anchor="middle">输出纹波 &lt; 1% Vout  |  EMC 达标</text>
  <!-- 箭头 -->
  <line x1="200" y1="155" x2="200" y2="175" stroke="#00ff88" stroke-width="2"/>
  <polygon points="195,175 205,175 200,185" fill="#00ff88"/>
  <!-- 驱动输出 -->
  <rect x="50" y="185" width="300" height="55" rx="5" fill="#0a1e30" stroke="#1e4060" stroke-width="1"/>
  <text x="200" y="207" fill="#7be0ff" font-size="10" text-anchor="middle">Zigbee 无线模块</text>
  <text x="200" y="223" fill="#4a9fff" font-size="9" text-anchor="middle">稳定供电  |  RF 发射功率正常</text>
  <!-- 信号 -->
  <line x1="200" y1="240" x2="200" y2="260" stroke="#00ff88" stroke-width="2"/>
  <polygon points="195,260 205,260 200,270" fill="#00ff88"/>
  <!-- 信号发射 -->
  <rect x="50" y="270" width="300" height="50" rx="5" fill="#0a2a1a" stroke="#00ff88" stroke-width="1.5"/>
  <text x="200" y="292" fill="#00ff88" font-size="11" font-weight="bold" text-anchor="middle">Zigbee 信号 ✓ 稳定</text>
  <text x="200" y="308" fill="#88ffbb" font-size="9" text-anchor="middle">覆盖范围 10-15m  |  抗干扰强</text>
  <!-- 信号波形 -->
  <path d="M60,340 Q80,320 100,340 Q120,360 140,340 Q160,320 180,340 Q200,360 220,340 Q240,320 260,340 Q280,360 300,340 Q320,320 340,340 Q360,360 360,340" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- 指标 -->
  <rect x="50" y="360" width="300" height="40" rx="4" fill="#061522"/>
  <text x="60" y="378" fill="#00ff88" font-size="9">纹波: &lt;150mV</text>
  <text x="160" y="378" fill="#00ff88" font-size="9">认证: 涂鸦 + 3C</text>
  <text x="60" y="393" fill="#00ff88" font-size="9">信道切换: 支持</text>
  <text x="160" y="393" fill="#00ff88" font-size="9">稳定时长: 720h+</text>
  <!-- 右侧: 劣质驱动 -->
  <rect x="430" y="55" width="340" height="360" rx="8" fill="#200d0d" stroke="#ff4444" stroke-width="1.5"/>
  <rect x="430" y="55" width="340" height="30" rx="8" fill="#ff4444" opacity="0.15"/>
  <text x="600" y="76" fill="#ff6666" font-size="12" font-weight="bold" text-anchor="middle">✗ 劣质驱动 (无认证)</text>
  <!-- 驱动内部结构 -->
  <rect x="450" y="100" width="300" height="55" rx="5" fill="#2a0d0d" stroke="#4a1010" stroke-width="1"/>
  <text x="600" y="122" fill="#ff9999" font-size="10" text-anchor="middle">AC/DC 转换模块</text>
  <text x="600" y="138" fill="#ff6666" font-size="9" text-anchor="middle">输出纹波 &gt; 15% Vout  |  EMC 超标</text>
  <!-- 噪声可视化 -->
  <path d="M460,112 L470,95 L480,125 L490,88 L500,118 L510,100 L520,122 L530,90 L540,115 L550,95 L560,118 L570,92 L580,120 L590,85 L600,110 L610,95 L620,118 L630,88 L640,122 L650,92 L660,115 L670,95 L680,120 L690,88 L700,112 L710,90 L720,118 L730,85" stroke="#ff4444" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- 箭头 -->
  <line x1="600" y1="155" x2="600" y2="175" stroke="#ff4444" stroke-width="2"/>
  <polygon points="595,175 605,175 600,185" fill="#ff4444"/>
  <!-- 模块受干扰 -->
  <rect x="450" y="185" width="300" height="55" rx="5" fill="#2a0d0d" stroke="#4a1010" stroke-width="1"/>
  <text x="600" y="207" fill="#ff9999" font-size="10" text-anchor="middle">Zigbee 无线模块</text>
  <text x="600" y="223" fill="#ff6666" font-size="9" text-anchor="middle">供电噪声大  |  RF 功率下降40%</text>
  <!-- 信号 -->
  <line x1="600" y1="240" x2="600" y2="260" stroke="#ff4444" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="595,260 605,260 600,270" fill="#ff4444"/>
  <!-- 信号不稳 -->
  <rect x="450" y="270" width="300" height="50" rx="5" fill="#3a0d0d" stroke="#ff4444" stroke-width="1.5" filter="url(#glow_red)"/>
  <text x="600" y="292" fill="#ff4444" font-size="11" font-weight="bold" text-anchor="middle">Zigbee 信号 ✗ 不稳定</text>
  <text x="600" y="308" fill="#ff9999" font-size="9" text-anchor="middle">随机掉线  |  重连失败  |  延迟高</text>
  <!-- 不稳定波形 -->
  <path d="M460,340 Q470,328 480,340 L500,340 Q510,312 520,340 L540,340 Q550,330 560,340 L590,340 Q600,310 610,340 L650,340 Q660,318 670,340 L720,340" stroke="#ff4444" stroke-width="1.5" fill="none" opacity="0.6" stroke-dasharray="6,3"/>
  <!-- 指标 -->
  <rect x="450" y="360" width="300" height="40" rx="4" fill="#1a0606"/>
  <text x="460" y="378" fill="#ff6666" font-size="9">纹波: &gt;2000mV</text>
  <text x="560" y="378" fill="#ff6666" font-size="9">认证: 无</text>
  <text x="460" y="393" fill="#ff6666" font-size="9">掉线频率: 高</text>
  <text x="560" y="393" fill="#ff6666" font-size="9">稳定时长: &lt;48h</text>
  <!-- VS 分隔 -->
  <text x="400" y="240" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle" opacity="0.6">VS</text>
</svg>
