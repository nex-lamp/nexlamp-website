<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b30"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2ed573"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <g stroke="#1b2f4e" stroke-width="1" opacity="0.5">
    <path d="M0 60H960M0 120H960M0 180H960M0 240H960M0 300H960M0 360H960M0 420H960M0 480H960"/>
    <path d="M80 0V540M160 0V540M240 0V540M320 0V540M400 0V540M480 0V540M560 0V540M640 0V540M720 0V540M800 0V540M880 0V540"/>
  </g>

  <text x="480" y="46" text-anchor="middle" fill="#e2f3ff" font-size="26" font-weight="700" letter-spacing="2">买智能灯 · 驱动电源 3 问检查清单</text>

  <!-- terminal window -->
  <rect x="80" y="72" width="800" height="420" rx="14" fill="#0a1524" stroke="#22d3ee" stroke-opacity="0.5"/>
  <!-- title bar -->
  <rect x="80" y="72" width="800" height="42" rx="14" fill="#13233d"/>
  <rect x="80" y="96" width="800" height="18" fill="#13233d"/>
  <circle cx="112" cy="93" r="7" fill="#ff5f57"/>
  <circle cx="140" cy="93" r="7" fill="#febc2e"/>
  <circle cx="168" cy="93" r="7" fill="#28c840"/>
  <text x="480" y="98" text-anchor="middle" fill="#7ea6c8" font-size="14" font-family="Consolas,monospace">nexlamp-driver-check — zsh</text>

  <!-- Q1 -->
  <text x="120" y="150" fill="#22d3ee" font-size="17" font-family="Consolas,monospace">$ ask_sales "波动深度多少？满载和10%亮度分别报"</text>
  <text x="120" y="180" fill="#e2f3ff" font-size="16">答：满载 ≤5%，低亮度 ≤15%  ✅ 通过</text>
  <text x="120" y="206" fill="#ff6b81" font-size="16">支支吾吾 / 只报"无频闪"三个字  ❌ 有坑</text>

  <!-- Q2 -->
  <text x="120" y="248" fill="#22d3ee" font-size="17" font-family="Consolas,monospace">$ ask_sales "恒流精度多少？调光最低到百分之几？"</text>
  <text x="120" y="278" fill="#e2f3ff" font-size="16">答：电流误差 ±3% 以内  ✅ 基本靠谱</text>
  <text x="120" y="304" fill="#ff6b81" font-size="16">答：±5% 或不知道  ❌ 光谱易漂、显色失真</text>

  <!-- Q3 -->
  <text x="120" y="346" fill="#22d3ee" font-size="17" font-family="Consolas,monospace">$ ask_sales "电容规格？标称寿命？质保几年？"</text>
  <text x="120" y="376" fill="#e2f3ff" font-size="16">答：105℃ 电解电容 / 寿命 ≥3万h / 质保3年+ ✅</text>
  <text x="120" y="402" fill="#ff6b81" font-size="16">答：不清楚电容 / 质保1年  ❌ 一年后大概率变暗</text>

  <!-- phone test -->
  <rect x="120" y="420" width="720" height="46" rx="8" fill="url(#acc)" opacity="0.12"/>
  <rect x="120" y="420" width="720" height="46" rx="8" fill="none" stroke="url(#acc)" stroke-width="1.5"/>
  <text x="140" y="449" fill="#9ef0c8" font-size="16" font-weight="700">📱 回家实测：手机相机对准灯，最亮档 + 10%档各拍10秒，无滚动条纹才收货</text>
</svg>
