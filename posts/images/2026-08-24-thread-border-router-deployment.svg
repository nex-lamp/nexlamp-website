<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="-apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1e3a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3050" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <pattern id="floorPlan" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3050" stroke-width="0.3" opacity="0.4"/>
    </pattern>
    <radialGradient id="hubGlow">
      <stop offset="0%" stop-color="#51cf66" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#51cf66" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#51cf66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulbGlow">
      <stop offset="0%" stop-color="#7eb8ff" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#2478c2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2478c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="680" height="480" fill="url(#bg)"/>
  <rect width="680" height="480" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="42" fill="#e8f0ff" font-size="20" font-weight="700">Thread边界路由器部署示意图</text>
  <text x="40" y="65" fill="#7ba0d4" font-size="12">Mesh自动组网 · 2台冗余 · 每颗灯都是路由节点</text>
  <line x1="40" y1="80" x2="640" y2="80" stroke="#1a3050" stroke-width="1"/>

  <!-- 户型平面图 -->
  <g transform="translate(50, 100)">
    <!-- 房间背景 -->
    <rect width="580" height="280" rx="8" fill="url(#floorPlan)" stroke="#2a4060" stroke-width="1.5"/>

    <!-- 房间分割线 -->
    <line x1="200" y1="0" x2="200" y2="280" stroke="#2a4060" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="280" stroke="#2a4060" stroke-width="1"/>
    <line x1="0" y1="140" x2="580" y2="140" stroke="#2a4060" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- 房间标签 -->
    <text x="100" y="25" fill="#7ba0d4" font-size="12" font-weight="600" text-anchor="middle">主卧</text>
    <text x="300" y="25" fill="#7ba0d4" font-size="12" font-weight="600" text-anchor="middle">客厅</text>
    <text x="490" y="25" fill="#7ba0d4" font-size="12" font-weight="600" text-anchor="middle">厨房</text>

    <!-- Wi-Fi路由器（在中央底部，代表网络入口） -->
    <g transform="translate(290, 230)">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#0f1e3a" stroke="#d23f3f" stroke-width="1.5"/>
      <text x="0" y="4" fill="#ff8a8a" font-size="10" font-weight="700" text-anchor="middle">Wi-Fi</text>
      <text x="0" y="26" fill="#5a7ba5" font-size="9" text-anchor="middle">路由器</text>
    </g>

    <!-- 边界路由器1: HomePod mini (主卧) -->
    <g transform="translate(100, 100)">
      <circle r="35" fill="url(#hubGlow)"/>
      <circle r="14" fill="#0a1628" stroke="#51cf66" stroke-width="2"/>
      <text x="0" y="3" fill="#7be495" font-size="9" font-weight="700" text-anchor="middle">边界</text>
      <text x="0" y="13" fill="#7be495" font-size="9" font-weight="700" text-anchor="middle">路由</text>
      <text x="0" y="-50" fill="#e8f0ff" font-size="11" font-weight="600" text-anchor="middle">① HomePod</text>
      <text x="0" y="-37" fill="#7ba0d4" font-size="10" text-anchor="middle">mini · $99</text>
    </g>

    <!-- 边界路由器2: Nest Hub (厨房) -->
    <g transform="translate(490, 100)">
      <circle r="35" fill="url(#hubGlow)"/>
      <circle r="14" fill="#0a1628" stroke="#51cf66" stroke-width="2"/>
      <text x="0" y="3" fill="#7be495" font-size="9" font-weight="700" text-anchor="middle">边界</text>
      <text x="0" y="13" fill="#7be495" font-size="9" font-weight="700" text-anchor="middle">路由</text>
      <text x="0" y="-50" fill="#e8f0ff" font-size="11" font-weight="600" text-anchor="middle">② Nest Hub</text>
      <text x="0" y="-37" fill="#7ba0d4" font-size="10" text-anchor="middle">2代 · $99</text>
    </g>

    <!-- Thread灯泡节点(每颗都自带Mesh路由) -->
    <!-- 主卧 2个 -->
    <g transform="translate(50, 70)">
      <circle r="18" fill="url(#bulbGlow)"/>
      <circle r="5" fill="#7eb8ff"/>
      <text x="0" y="-28" fill="#5a7ba5" font-size="9" text-anchor="middle">灯</text>
    </g>
    <g transform="translate(150, 70)">
      <circle r="18" fill="url(#bulbGlow)"/>
      <circle r="5" fill="#7eb8ff"/>
      <text x="0" y="-28" fill="#5a7ba5" font-size="9" text-anchor="middle">灯</text>
    </g>

    <!-- 客厅 3个 -->
    <g transform="translate(250, 70)">
      <circle r="18" fill="url(#bulbGlow)"/>
      <circle r="5" fill="#7eb8ff"/>
    </g>
    <g transform="translate(300, 110)">
      <circle r="18" fill="url(#bulbGlow)"/>
      <circle r="5" fill="#7eb8ff"/>
    </g>
    <g transform="translate(350, 70)">
      <circle r="18" fill="url(#bulbGlow)"/>
      <circle r="5" fill="#7eb8ff"/>
    </g>

    <!-- 厨房 2个 -->
    <g transform="translate(450, 70)">
      <circle r="18" fill="url(#bulbGlow)"/>
      <circle r="5" fill="#7eb8ff"/>
    </g>
    <g transform="translate(530, 70)">
      <circle r="18" fill="url(#bulbGlow)"/>
      <circle r="5" fill="#7eb8ff"/>
    </g>

    <!-- Mesh连线 (智能灯泡互相联) -->
    <g stroke="#2478c2" stroke-width="1.2" stroke-opacity="0.55" fill="none">
      <line x1="50" y1="70" x2="100" y2="100"/>
      <line x1="150" y1="70" x2="100" y2="100"/>
      <line x1="100" y1="100" x2="250" y2="70"/>
      <line x1="250" y1="70" x2="300" y2="110"/>
      <line x1="300" y1="110" x2="350" y2="70"/>
      <line x1="350" y1="70" x2="450" y2="70"/>
      <line x1="450" y1="70" x2="490" y2="100"/>
      <line x1="530" y1="70" x2="490" y2="100"/>
    </g>

    <!-- 边界路由器到Wi-Fi虚线 -->
    <g stroke="#d23f3f" stroke-width="1" stroke-dasharray="3 4" fill="none" opacity="0.7">
      <line x1="100" y1="100" x2="290" y2="230"/>
      <line x1="490" y1="100" x2="290" y2="230"/>
    </g>
  </g>

  <!-- 底部信息卡 -->
  <g transform="translate(40, 400)">
    <rect width="600" height="60" rx="6" fill="#0f1e3a" stroke="#1a3050" stroke-width="1"/>
    <g transform="translate(20, 18)">
      <circle cx="0" cy="0" r="4" fill="#51cf66"/>
      <text x="14" y="4" fill="#e8f0ff" font-size="12" font-weight="600">2台冗余</text>
      <text x="0" y="22" fill="#7ba0d4" font-size="10">一台故障另一台接管</text>
    </g>
    <g transform="translate(180, 18)">
      <circle cx="0" cy="0" r="4" fill="#7eb8ff"/>
      <text x="14" y="4" fill="#e8f0ff" font-size="12" font-weight="600">每颗灯=路由节点</text>
      <text x="0" y="22" fill="#7ba0d4" font-size="10">7颗灯7个Mesh节点</text>
    </g>
    <g transform="translate(380, 18)">
      <circle cx="0" cy="0" r="4" fill="#ffd285"/>
      <text x="14" y="4" fill="#e8f0ff" font-size="12" font-weight="600">总成本 ≈$158</text>
      <text x="0" y="22" fill="#7ba0d4" font-size="10">边界路由 2台+7颗灯</text>
    </g>
  </g>
</svg>
