<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%"><stop offset="0%" stop-color="#0d1f3c"/><stop offset="100%" stop-color="#0a1628"/></radialGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowStrong"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="680" height="380" fill="url(#bg2)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#4a9eff">
    <line x1="0" y1="76" x2="680" y2="76"/><line x1="0" y1="152" x2="680" y2="152"/>
    <line x1="0" y1="228" x2="680" y2="228"/><line x1="0" y1="304" x2="680" y2="304"/>
  </g>

  <!-- Title -->
  <rect x="0" y="0" width="680" height="40" fill="#0d1a30" opacity="0.9"/>
  <text x="16" y="26" fill="#4a9eff" font-family="Consolas,monospace" font-size="13">[光亚展2026] Matter协议跨平台生态互联</text>

  <!-- Center: Matter Hub -->
  <circle cx="340" cy="200" r="48" fill="#0d1f3c" stroke="#00d4aa" stroke-width="2" opacity="0.9"/>
  <circle cx="340" cy="200" r="42" fill="none" stroke="#00d4aa" stroke-width="0.5" opacity="0.3"/>
  <circle cx="340" cy="200" r="36" fill="none" stroke="#00d4aa" stroke-width="0.5" opacity="0.15"/>
  <text x="340" y="194" fill="#00d4aa" font-family="Consolas,monospace" font-size="15" text-anchor="middle" filter="url(#glow2)">Matter</text>
  <text x="340" y="214" fill="#4a9eff" font-family="Consolas,monospace" font-size="10" text-anchor="middle">统一连接层</text>

  <!-- Platforms -->
  <!-- Apple Home -->
  <rect x="125" y="62" width="130" height="50" rx="8" fill="#0d1f3c" stroke="#555" stroke-width="1"/>
  <text x="190" y="82" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle">🍎 Apple Home</text>
  <text x="190" y="100" fill="#8899aa" font-family="Consolas,monospace" font-size="9" text-anchor="middle">HomeKit</text>
  <line x1="190" y1="112" x2="298" y2="160" stroke="#00d4aa" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Google Home -->
  <rect x="425" y="62" width="130" height="50" rx="8" fill="#0d1f3c" stroke="#555" stroke-width="1"/>
  <text x="490" y="82" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle">🤖 Google Home</text>
  <text x="490" y="100" fill="#8899aa" font-family="Consolas,monospace" font-size="9" text-anchor="middle">Google Assistant</text>
  <line x1="490" y1="112" x2="382" y2="160" stroke="#00d4aa" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Alexa -->
  <rect x="425" y="270" width="130" height="50" rx="8" fill="#0d1f3c" stroke="#555" stroke-width="1"/>
  <text x="490" y="290" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle">🔵 Amazon Alexa</text>
  <text x="490" y="308" fill="#8899aa" font-family="Consolas,monospace" font-size="9" text-anchor="middle">Echo</text>
  <line x1="490" y1="270" x2="382" y2="240" stroke="#00d4aa" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Tuya -->
  <rect x="125" y="270" width="130" height="50" rx="8" fill="#0d1f3c" stroke="#555" stroke-width="1"/>
  <text x="190" y="290" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle">🟢 涂鸦智能</text>
  <text x="190" y="308" fill="#8899aa" font-family="Consolas,monospace" font-size="9" text-anchor="middle">Tuya IoT</text>
  <line x1="190" y1="270" x2="298" y2="240" stroke="#00d4aa" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Bottom: Devices -->
  <rect x="20" y="350" width="640" height="22" rx="4" fill="#0d1a30" opacity="0.8"/>
  <text x="340" y="365" fill="#8899aa" font-family="Microsoft YaHei,sans-serif" font-size="10" text-anchor="middle">筒灯 · 射灯 · 灯带 · 驱动电源 · 传感器 — 只要支持Matter，所有平台统一控制</text>

  <!-- Left annotation -->
  <text x="60" y="180" fill="#ff6b6b" font-family="Microsoft YaHei,sans-serif" font-size="10" filter="url(#glow2)">过去：</text>
  <text x="60" y="196" fill="#8899aa" font-family="Microsoft YaHei,sans-serif" font-size="10">生态封闭</text>
  <text x="60" y="212" fill="#8899aa" font-family="Microsoft YaHei,sans-serif" font-size="10">换品牌=重买</text>

  <!-- Right annotation -->
  <text x="540" y="180" fill="#00d4aa" font-family="Microsoft YaHei,sans-serif" font-size="10" filter="url(#glow2)">现在：</text>
  <text x="540" y="196" fill="#8899aa" font-family="Microsoft YaHei,sans-serif" font-size="10">统一接入</text>
  <text x="540" y="212" fill="#8899aa" font-family="Microsoft YaHei,sans-serif" font-size="10">品牌自由选</text>
</svg>