<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <linearGradient id="bgFc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="cardFc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101f38"/>
      <stop offset="1" stop-color="#132542"/>
    </linearGradient>
    <filter id="glowFc" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="480" fill="url(#bgFc)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/>
    <line x1="85" y1="0" x2="85" y2="480"/><line x1="170" y1="0" x2="170" y2="480"/>
    <line x1="255" y1="0" x2="255" y2="480"/><line x1="340" y1="0" x2="340" y2="480"/>
    <line x1="425" y1="0" x2="425" y2="480"/><line x1="510" y1="0" x2="510" y2="480"/>
    <line x1="595" y1="0" x2="595" y2="480"/>
  </g>

  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="21" font-weight="bold" filter="url(#glowFc)">新版规则改了四处，哪处最花你的钱</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <rect x="34" y="70" width="296" height="172" rx="10" fill="url(#cardFc)" stroke="#3f7a52" stroke-width="1"/>
  <circle cx="60" cy="98" r="14" fill="#1c3b2a" stroke="#7ec27e" stroke-width="1.2"/>
  <text x="60" y="103" fill="#9ee6ac" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  <text x="84" y="103" fill="#e8f4e8" font-family="sans-serif" font-size="14" font-weight="bold">质量保证能力细化</text>
  <text x="52" y="134" fill="#8aa5c4" font-family="sans-serif" font-size="11.5">从「模板化套用」换成具体操作指引</text>
  <line x1="52" y1="148" x2="312" y2="148" stroke="#26456e" stroke-width="1"/>
  <text x="52" y="172" fill="#c8d8ea" font-family="sans-serif" font-size="12">关键工序控制要点写实</text>
  <text x="52" y="196" fill="#c8d8ea" font-family="sans-serif" font-size="12">关键元器件管理要求细化</text>
  <text x="52" y="220" fill="#c8d8ea" font-family="sans-serif" font-size="12">成品检验频次与项目明确</text>

  <rect x="350" y="70" width="296" height="172" rx="10" fill="url(#cardFc)" stroke="#3d6d9a" stroke-width="1"/>
  <circle cx="376" cy="98" r="14" fill="#152a4a" stroke="#5cc8e8" stroke-width="1.2"/>
  <text x="376" y="103" fill="#8ad8ee" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2</text>
  <text x="400" y="103" fill="#e8f4e8" font-family="sans-serif" font-size="14" font-weight="bold">一致性管控加强</text>
  <text x="368" y="134" fill="#8aa5c4" font-family="sans-serif" font-size="11.5">型号多、外观变化快，一直是难点</text>
  <line x1="368" y1="148" x2="628" y2="148" stroke="#26456e" stroke-width="1"/>
  <text x="368" y="172" fill="#c8d8ea" font-family="sans-serif" font-size="12">认证单元划分要求更明确</text>
  <text x="368" y="196" fill="#c8d8ea" font-family="sans-serif" font-size="12">抽样检测按产品类型差异化</text>
  <text x="368" y="220" fill="#c8d8ea" font-family="sans-serif" font-size="12">机构须制定一致性核查方案</text>

  <rect x="34" y="256" width="296" height="172" rx="10" fill="url(#cardFc)" stroke="#8a6a3a" stroke-width="1"/>
  <circle cx="60" cy="284" r="14" fill="#2d2716" stroke="#e0c07a" stroke-width="1.2"/>
  <text x="60" y="289" fill="#e0c07a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3</text>
  <text x="84" y="289" fill="#e8f4e8" font-family="sans-serif" font-size="14" font-weight="bold">证后监督分级管理</text>
  <text x="52" y="320" fill="#8aa5c4" font-family="sans-serif" font-size="11.5">不再对所有企业一个频次</text>
  <line x1="52" y1="334" x2="312" y2="334" stroke="#26456e" stroke-width="1"/>
  <text x="52" y="358" fill="#c8d8ea" font-family="sans-serif" font-size="12">看认证状态与监督历史</text>
  <text x="52" y="382" fill="#c8d8ea" font-family="sans-serif" font-size="12">看产品风险等级</text>
  <text x="52" y="406" fill="#c8d8ea" font-family="sans-serif" font-size="12">高风险加频次，低风险少打扰</text>

  <rect x="350" y="256" width="296" height="172" rx="10" fill="url(#cardFc)" stroke="#8a4a6a" stroke-width="1"/>
  <circle cx="376" cy="284" r="14" fill="#2d1a2a" stroke="#e09bc4" stroke-width="1.2"/>
  <text x="376" y="289" fill="#e09bc4" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4</text>
  <text x="400" y="289" fill="#e8f4e8" font-family="sans-serif" font-size="14" font-weight="bold">认证模式一分为三</text>
  <text x="368" y="320" fill="#8aa5c4" font-family="sans-serif" font-size="11.5">旧版：所有灯具同一种模式</text>
  <line x1="368" y1="334" x2="628" y2="334" stroke="#26456e" stroke-width="1"/>
  <text x="368" y="358" fill="#c8d8ea" font-family="sans-serif" font-size="12">通用灯具</text>
  <text x="368" y="382" fill="#c8d8ea" font-family="sans-serif" font-size="12">大型灯具</text>
  <text x="368" y="406" fill="#c8d8ea" font-family="sans-serif" font-size="12">单批次定制灯具</text>

  <rect x="34" y="440" width="612" height="28" rx="8" fill="#2d1a1a" stroke="#a04a4a" stroke-width="1"/>
  <text x="48" y="459" fill="#e8b8b8" font-family="sans-serif" font-size="12">注意：认证模式不是企业自己挑，要对新版规则的产品分类目录逐项确认</text>
</svg>
