<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0L0 0L0 20" fill="none" stroke="#1a2d4d" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7ec27e"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#0a1628"/>
  <rect width="680" height="520" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="30" y="20" width="620" height="36" rx="6" fill="#111d33" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="50" cy="38" r="5" fill="#ff5f56"/>
  <circle cx="68" cy="38" r="5" fill="#ffbd2e"/>
  <circle cx="86" cy="38" r="5" fill="#27c93f"/>
  <text x="340" y="43" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="14" font-weight="500">工业照明驱动选型决策流程</text>

  <!-- Start -->
  <rect x="240" y="80" width="200" height="45" rx="22" fill="#1e4d6b" stroke="#5ab4e6" stroke-width="2"/>
  <text x="340" y="108" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="500">明确应用场景</text>

  <!-- Arrow -->
  <line x1="340" y1="125" x2="340" y2="150" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Environment box -->
  <rect x="90" y="160" width="500" height="75" rx="8" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1"/>
  <text x="340" y="185" text-anchor="middle" fill="#5ab4e6" font-family="monospace" font-size="12" font-weight="500">环境评估</text>
  <text x="340" y="205" text-anchor="middle" fill="#a0c4e8" font-family="monospace" font-size="10">温度范围 · 湿度 · 粉尘/盐雾 · 腐蚀等级 · 运行时长</text>
  <text x="340" y="222" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="10">→ 决定IP等级、防腐等级、工作温度范围</text>

  <!-- Arrow -->
  <line x1="340" y1="235" x2="340" y2="260" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Electrical box -->
  <rect x="90" y="270" width="500" height="75" rx="8" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1"/>
  <text x="340" y="295" text-anchor="middle" fill="#e6a845" font-family="monospace" font-size="12" font-weight="500">电气参数匹配</text>
  <text x="340" y="315" text-anchor="middle" fill="#a0c4e8" font-family="monospace" font-size="10">输入电压 · 输出功率 · 负载电流 · 调光协议 · PF/THD</text>
  <text x="340" y="332" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="10">→ 决定效率曲线、调光接口、功率余量</text>

  <!-- Arrow -->
  <line x1="340" y1="345" x2="340" y2="370" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Protection box -->
  <rect x="90" y="380" width="500" height="75" rx="8" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1"/>
  <text x="340" y="405" text-anchor="middle" fill="#9b7ed8" font-family="monospace" font-size="12" font-weight="500">可靠性与认证核验</text>
  <text x="340" y="425" text-anchor="middle" fill="#a0c4e8" font-family="monospace" font-size="10">保护功能 · 浪涌等级 · 认证覆盖 · 质保年限 · 供应商稳定性</text>
  <text x="340" y="442" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="10">→ 决定长期持有成本和运维风险</text>

  <!-- Side notes -->
  <rect x="30" y="470" width="300" height="35" rx="6" fill="#1e4d6b" opacity="0.3" stroke="#1e4d6b" stroke-width="1"/>
  <text x="180" y="492" text-anchor="middle" fill="#a0c4e8" font-family="monospace" font-size="10">⚠ 留足余量：按实际负载70%-80%选型</text>

  <rect x="350" y="470" width="300" height="35" rx="6" fill="#1e4d6b" opacity="0.3" stroke="#1e4d6b" stroke-width="1"/>
  <text x="500" y="492" text-anchor="middle" fill="#a0c4e8" font-family="monospace" font-size="10">✓ 现场实测：高温工况跑72小时再批量</text>
</svg>