    <text x="115" y="238" fill="#00e5ff" font-size="20" font-weight="bold">01 延迟</text>
    <text x="115" y="265" fill="#c8dcf5" font-size="14">按了开关灯慢半拍，指令绕云端</text>
    <text x="115" y="288" fill="#5a8fd0" font-size="13">root_cause: cloud_roundtrip</text>
  </g>
  <g>
    <rect x="460" y="205" width="345" height="100" rx="8" fill="#0f2647" stroke="#ffb84d" stroke-width="1.2" opacity="0.9"/>
    <text x="480" y="238" fill="#ffb84d" font-size="20" font-weight="bold">02 老人不会用</text>
    <text x="480" y="265" fill="#c8dcf5" font-size="14">轻触/长按/双击，爸妈当成考试</text>
    <text x="480" y="288" fill="#5a8fd0" font-size="13">root_cause: no_fallback_switch</text>
  </g>
  <g>
