<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="ledGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="signalGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ff6b35" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="photoGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="400" fill="url(#bg)"/>
  <rect width="680" height="400" fill="url(#grid)"/>
  <text x="340" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Li-Fi原理:LED调制 = 数据 + 光</text>
  <text x="340" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#7fa8d4">纳秒级亮灭切换 · 人眼无感 · 光电探测器精确读取</text>

  <!-- LED灯具 -->
  <g transform="translate(80,120)">
    <rect x="-50" y="0" width="100" height="50" rx="6" fill="#1a2a4a" stroke="#3a5a8a" stroke-width="2"/>
    <circle cx="-25" cy="25" r="12" fill="url(#ledGlow)" filter="url(#glow)"/>
    <circle cx="0" cy="25" r="12" fill="url(#ledGlow)" filter="url(#glow)"/>
    <circle cx="25" cy="25" r="12" fill="url(#ledGlow)" filter="url(#glow)"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffd700">LED灯具</text>
    <text x="0" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7fa8d4">恒流 + 高速调制</text>
  </g>

  <!-- 调制信号流 -->
  <g>
    <!-- 二进制位流 -->
    <text x="200" y="105" font-family="Arial,sans-serif" font-size="11" fill="#7fa8d4">数据位流</text>
    <g transform="translate(200,115)">
      <rect x="0" y="0" width="20" height="14" fill="#ff6b35"/>
      <rect x="20" y="0" width="20" height="14" fill="#1a2a4a"/>
      <rect x="40" y="0" width="20" height="14" fill="#ff6b35"/>
      <rect x="60" y="0" width="20" height="14" fill="#ff6b35"/>
      <rect x="80" y="0" width="20" height="14" fill="#1a2a4a"/>
      <rect x="100" y="0" width="20" height="14" fill="#1a2a4a"/>
      <rect x="120" y="0" width="20" height="14" fill="#ff6b35"/>
      <text x="70" y="28" text-anchor="middle" font-family="monospace" font-size="12" fill="#ff6b35">1 0 1 1 0 0 1</text>
    </g>

    <!-- OFDM调制示意 -->
    <g transform="translate(200,180)">
      <path d="M0,15 Q20,0 40,15 T80,15 T120,15 T160,15 T200,15 T240,15 T280,15" stroke="url(#signalGlow)" stroke-width="2.5" fill="none" filter="url(#glow)"/>
      <text x="140" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7fa8d4">OFDM调制载波 → 光波</text>
    </g>
  </g>

  <!-- 光波传播 -->
  <g>
    <line x1="200" y1="225" x2="500" y2="225" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
    <g transform="translate(230,225)">
      <path d="M0,-3 L0,3 M6,-5 L6,5 M12,-4 L12,4 M18,-3 L18,3 M24,-5 L24,5 M30,-4 L30,4 M36,-3 L36,3 M42,-5 L42,5 M48,-4 L48,4 M54,-3 L54,3 M60,-5 L60,5 M66,-4 L66,4 M72,-3 L72,3 M78,-5 L78,5 M84,-4 L84,4 M90,-3 L90,3 M96,-5 L96,5" stroke="#ffd700" stroke-width="1.5" opacity="0.7"/>
    </g>
    <text x="350" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#ffd700">红外光(人眼不可见)·200-800THz</text>
    <text x="350" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#7fa8d4">直线传播 · 不穿墙 · 物理级安全</text>
  </g>

  <!-- 光电探测器+终端 -->
  <g transform="translate(540,120)">
    <rect x="-30" y="0" width="60" height="50" rx="4" fill="#0d1f3c" stroke="#00d4aa" stroke-width="2"/>
    <circle cx="0" cy="25" r="14" fill="url(#photoGlow)" filter="url(#glow)"/>
    <circle cx="0" cy="25" r="6" fill="#ffffff"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#00d4aa">光电探测器</text>
    <text x="0" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7fa8d4">解调 → 协议栈</text>

    <rect x="-25" y="115" width="50" height="30" rx="3" fill="#0d1f3c" stroke="#3a5a8a" stroke-width="1.5"/>
    <text x="0" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#ffffff">手机/PC</text>
  </g>

  <!-- 关键指标 -->
  <g transform="translate(60,310)">
    <rect x="0" y="0" width="170" height="70" rx="6" fill="#0d1f3c" stroke="#ff6b35" stroke-width="1.5" opacity="0.85"/>
    <text x="85" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7fa8d4">理论速率</text>
    <text x="85" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ff6b35">10 Gbps</text>
    <text x="85" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#7fa8d4">pureLiFi MWC 2026演示</text>
  </g>
  <g transform="translate(255,310)">
    <rect x="0" y="0" width="170" height="70" rx="6" fill="#0d1f3c" stroke="#00d4aa" stroke-width="1.5" opacity="0.85"/>
    <text x="85" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7fa8d4">频谱宽度</text>
    <text x="85" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#00d4aa">1000×</text>
    <text x="85" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#7fa8d4">vs Wi-Fi,免费免许可</text>
  </g>
  <g transform="translate(450,310)">
    <rect x="0" y="0" width="170" height="70" rx="6" fill="#0d1f3c" stroke="#ffd700" stroke-width="1.5" opacity="0.85"/>
    <text x="85" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7fa8d4">安全等级</text>
    <text x="85" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffd700">物理级</text>
    <text x="85" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#7fa8d4">光不穿墙=不泄露</text>
  </g>
</svg>
