<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e0e8f0" font-family="Consolas, monospace" font-size="18" font-weight="bold">6&#31181;&#35843;&#20809;&#21327;&#35758;&#23545;&#27604;&#22270;</text>
  <text x="400" y="55" text-anchor="middle" fill="#5a8ab5" font-family="Consolas, monospace" font-size="11">Dimming Protocol Comparison Matrix</text>
  <!-- Column headers -->
  <g fill="#5a8ab5" font-family="Consolas, monospace" font-size="11" text-anchor="middle">
    <text x="120" y="85">&#21327;&#35758;</text>
    <text x="260" y="85">&#35843;&#20809;&#25928;&#26524;</text>
    <text x="400" y="85">&#24067;&#32447;&#38590;&#24230;</text>
    <text x="540" y="85">&#25104;&#26412;</text>
    <text x="680" y="85">&#36866;&#29992;&#22330;&#26223;</text>
  </g>
  <line x1="30" y1="95" x2="770" y2="95" stroke="#1a3050" stroke-width="1"/>
  <!-- TRIAC -->
  <g font-family="Consolas, monospace" font-size="11" fill="#c0d0e0">
    <text x="120" y="120" text-anchor="middle" fill="#ff6b6b">&#21487;&#25511;&#30789; TRIAC</text>
    <text x="260" y="120" text-anchor="middle">&#9733;&#9734;&#9734;</text>
    <text x="400" y="120" text-anchor="middle" fill="#4ecca3">&#26368;&#31616;&#21333;</text>
    <text x="540" y="120" text-anchor="middle" fill="#4ecca3">&#20302;</text>
    <text x="680" y="120" text-anchor="middle">&#32769;&#25151;&#25913;&#36896;</text>
  </g>
  <rect x="30" y="130" width="740" height="2" fill="#1a3050" opacity="0.5"/>
  <!-- 0-10V -->
  <g font-family="Consolas, monospace" font-size="11" fill="#c0d0e0">
    <text x="120" y="155" text-anchor="middle" fill="#ffd93d">0-10V</text>
    <text x="260" y="155" text-anchor="middle">&#9733;&#9733;&#9734;</text>
    <text x="400" y="155" text-anchor="middle" fill="#ffd93d">&#20013;&#31561;</text>
    <text x="540" y="155" text-anchor="middle" fill="#ffd93d">&#20013;</text>
    <text x="680" y="155" text-anchor="middle">&#21150;&#20844;/&#21830;&#19994;</text>
  </g>
  <rect x="30" y="165" width="740" height="2" fill="#1a3050" opacity="0.5"/>
  <!-- PWM -->
  <g font-family="Consolas, monospace" font-size="11" fill="#c0d0e0">
    <text x="120" y="190" text-anchor="middle" fill="#ffd93d">PWM</text>
    <text x="260" y="190" text-anchor="middle">&#9733;&#9733;&#9734;</text>
    <text x="400" y="190" text-anchor="middle" fill="#ffd93d">&#20013;&#31561;</text>
    <text x="540" y="190" text-anchor="middle" fill="#ffd93d">&#20013;</text>
    <text x="680" y="190" text-anchor="middle">&#26893;&#29289;&#28783;/&#33310;&#21488;</text>
  </g>
  <rect x="30" y="200" width="740" height="2" fill="#1a3050" opacity="0.5"/>
