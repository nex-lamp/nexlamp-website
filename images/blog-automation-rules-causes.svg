<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="470" fill="url(#bg1)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/>
    <line x1="85" y1="0" x2="85" y2="470"/><line x1="170" y1="0" x2="170" y2="470"/>
    <line x1="255" y1="0" x2="255" y2="470"/><line x1="340" y1="0" x2="340" y2="470"/>
    <line x1="425" y1="0" x2="425" y2="470"/><line x1="510" y1="0" x2="510" y2="470"/>
    <line x1="595" y1="0" x2="595" y2="470"/>
  </g>
  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="23" font-weight="bold" filter="url(#glow1)">邪修联动 · 三类翻车根因</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <rect x="34" y="66" width="612" height="40" rx="8" fill="#152a4a"/>
  <text x="52" y="92" fill="#9db8d9" font-family="sans-serif" font-size="13" font-weight="bold">根因</text>
  <text x="286" y="92" fill="#9db8d9" font-family="sans-serif" font-size="13" font-weight="bold">典型症状</text>
  <text x="472" y="92" fill="#9db8d9" font-family="sans-serif" font-size="13" font-weight="bold">修法</text>

  <rect x="34" y="114" width="612" height="86" rx="8" fill="#101f38" stroke="#3d5a80" stroke-width="1"/>
  <text x="52" y="150" fill="#e8f4e8" font-family="sans-serif" font-size="14.5" font-weight="bold">① 把"移动"当"有人"</text>
  <text x="52" y="174" fill="#6f88a8" font-family="sans-serif" font-size="11.5">PIR 只认动的人</text>
  <text x="286" y="150" fill="#e06666" font-family="sans-serif" font-size="13">人静灯灭、起身就亮</text>
  <text x="286" y="174" fill="#6f88a8" font-family="sans-serif" font-size="11.5">半夜翻身触发夜灯</text>
  <text x="472" y="150" fill="#9db8d9" font-family="sans-serif" font-size="13">换毫米波存在传感器</text>
  <text x="472" y="174" fill="#6f88a8" font-family="sans-serif" font-size="11.5">不让单传感器独立判定</text>

  <rect x="34" y="208" width="612" height="86" rx="8" fill="#101f38" stroke="#5cc8e8" stroke-width="1"/>
  <text x="52" y="244" fill="#e8f4e8" font-family="sans-serif" font-size="14.5" font-weight="bold">② 触发链路太长</text>
  <text x="52" y="268" fill="#6f88a8" font-family="sans-serif" font-size="11.5">延迟叠出来的</text>
  <text x="286" y="244" fill="#e06666" font-family="sans-serif" font-size="13">"设了没反应"</text>
  <text x="286" y="268" fill="#e06666" font-family="sans-serif" font-size="13">"怎么自己动了"</text>
  <text x="472" y="244" fill="#9db8d9" font-family="sans-serif" font-size="13">关键联动走本地执行</text>
  <text x="472" y="268" fill="#6f88a8" font-family="sans-serif" font-size="11.5">减少跨协议跳转</text>

  <rect x="34" y="302" width="612" height="86" rx="8" fill="#12233f" stroke="#e06666" stroke-width="1.5"/>
  <text x="52" y="338" fill="#e8f4e8" font-family="sans-serif" font-size="14.5" font-weight="bold">③ 套娃联动</text>
  <text x="52" y="362" fill="#6f88a8" font-family="sans-serif" font-size="11.5">自动化触发自动化</text>
  <text x="286" y="338" fill="#e06666" font-family="sans-serif" font-size="13">全屋爆亮 + 警报轰鸣</text>
  <text x="286" y="362" fill="#6f88a8" font-family="sans-serif" font-size="11.5">一次误报放大成全屋事故</text>
  <text x="472" y="338" fill="#9db8d9" font-family="sans-serif" font-size="13">拆层级</text>
  <text x="472" y="362" fill="#6f88a8" font-family="sans-serif" font-size="11.5">安防动作不做零容错设计</text>

  <rect x="34" y="400" width="612" height="52" rx="10" fill="#0d1c33" stroke="#f0c674" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="54" y="423" fill="#f0c674" font-family="sans-serif" font-size="13.5" font-weight="bold">结论：全屋智能出问题，极少是设备坏了</text>
  <text x="54" y="443" fill="#9db8d9" font-family="sans-serif" font-size="12.5">绝大多数是"联动建错了" —— 先查规则，再怀疑硬件</text>
</svg>
