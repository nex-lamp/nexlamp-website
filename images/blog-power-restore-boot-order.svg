<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f38"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16263f" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="lineA" gradientUnits="userSpaceOnUse" x1="190" y1="225" x2="852" y2="225">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0.55"/>
    </linearGradient>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fd1c5"/>
    </marker>
    <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f6ad55"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#grid)" opacity="0.55"/>

  <!-- 终端窗口条 -->
  <g filter="url(#soft)">
    <rect x="40" y="22" width="820" height="40" rx="8" fill="#0d1f38" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  <circle cx="62" cy="42" r="4.5" fill="#f6ad55" opacity="0.75"/>
  <circle cx="79" cy="42" r="4.5" fill="#4fd1c5" opacity="0.6"/>
  <circle cx="96" cy="42" r="4.5" fill="#2d4a6b"/>
  <text x="116" y="47" fill="#7f9bbb" font-family="Consolas, Microsoft YaHei, monospace" font-size="15" letter-spacing="0.5">power-restore / boot-order</text>
  <text x="838" y="47" text-anchor="end" fill="#3d5570" font-family="Consolas, Microsoft YaHei, monospace" font-size="15">timeline</text>

  <!-- 标题 -->
  <rect x="40" y="78" width="4" height="30" rx="2" fill="#4fd1c5"/>
  <text x="56" y="101" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="bold">复电启动顺序</text>
  <text x="56" y="129" fill="#f6ad55" font-family="Microsoft YaHei, sans-serif" font-size="17">第一下，发生在自动化上线之前</text>

  <!-- 时间刻度装饰 -->
  <line x1="190" y1="156" x2="850" y2="156" stroke="#1e3a5f" stroke-width="1"/>
  <g stroke="#1e3a5f" stroke-width="1">
    <line x1="250" y1="151" x2="250" y2="156"/>
    <line x1="310" y1="151" x2="310" y2="156"/>
    <line x1="370" y1="151" x2="370" y2="156"/>
    <line x1="430" y1="151" x2="430" y2="156"/>
    <line x1="490" y1="151" x2="490" y2="156"/>
    <line x1="550" y1="151" x2="550" y2="156"/>
    <line x1="610" y1="151" x2="610" y2="156"/>
    <line x1="670" y1="151" x2="670" y2="156"/>
    <line x1="730" y1="151" x2="730" y2="156"/>
    <line x1="790" y1="151" x2="790" y2="156"/>
  </g>

  <!-- 时间列 -->
  <text x="105" y="231" text-anchor="middle" fill="#4fd1c5" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold">0 秒</text>
  <text x="105" y="321" text-anchor="middle" fill="#7f9bbb" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold">数分钟</text>
  <text x="105" y="401" text-anchor="middle" fill="#f6ad55" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">网关就绪后</text>

  <!-- 轨道 A -->
  <line x1="190" y1="225" x2="842" y2="225" stroke="url(#lineA)" stroke-width="3" marker-end="url(#arwC)"/>
  <circle cx="190" cy="225" r="5" fill="#4fd1c5" opacity="0.7"/>
  <circle cx="250" cy="225" r="9" fill="#f6ad55" filter="url(#glow)"/>
  <circle cx="250" cy="225" r="3.5" fill="#0a1628"/>
  <circle cx="390" cy="225" r="6" fill="#4fd1c5"/>
  <circle cx="540" cy="225" r="6" fill="#4fd1c5"/>
  <circle cx="680" cy="225" r="6" fill="#4fd1c5"/>

  <!-- 第一下 pill -->
  <line x1="250" y1="206" x2="250" y2="216" stroke="#f6ad55" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="210" y="174" width="80" height="30" rx="15" fill="#f6ad55" fill-opacity="0.12" stroke="#f6ad55" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="250" y="195" text-anchor="middle" fill="#f6ad55" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">第一下</text>

  <!-- 轨道 A 标签 -->
  <text x="168" y="258" fill="#8fb3cc" font-family="Microsoft YaHei, sans-serif" font-size="16">市电恢复</text>
  <text x="390" y="258" text-anchor="middle" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="16">灯立刻上电</text>
  <text x="540" y="258" text-anchor="middle" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="16">读本地参数</text>
  <text x="680" y="258" text-anchor="middle" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="16">决定亮 / 灭</text>

  <!-- 轨道 B -->
  <line x1="190" y1="315" x2="694" y2="315" stroke="#4fd1c5" stroke-opacity="0.42" stroke-width="2.5" stroke-dasharray="9,7" marker-end="url(#arwC)"/>
  <circle cx="190" cy="315" r="5" fill="#4fd1c5" opacity="0.6"/>
  <circle cx="340" cy="315" r="6" fill="#4fd1c5" opacity="0.85"/>
  <circle cx="520" cy="315" r="4" fill="#4fd1c5" opacity="0.5"/>
  <text x="340" y="291" text-anchor="middle" fill="#9fc4d8" font-family="Microsoft YaHei, sans-serif" font-size="16">路由器 / 网关重启</text>

  <!-- 轨道 C -->
  <line x1="190" y1="395" x2="698" y2="395" stroke="#2d4a6b" stroke-width="2" stroke-dasharray="2,8"/>
  <line x1="700" y1="395" x2="842" y2="395" stroke="#f6ad55" stroke-width="3" marker-end="url(#arwA)"/>
  <circle cx="700" cy="395" r="8" fill="#f6ad55" filter="url(#glow)"/>
  <circle cx="700" cy="395" r="3" fill="#0a1628"/>
  <circle cx="800" cy="395" r="5" fill="#f6ad55"/>
  <text x="700" y="368" text-anchor="middle" fill="#f6ad55" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">网关就绪</text>
  <text x="800" y="368" text-anchor="middle" fill="#f6ad55" font-family="Microsoft YaHei, sans-serif" font-size="16">自动化才上线</text>

  <!-- 关键空档带 -->
  <line x1="250" y1="225" x2="250" y2="442" stroke="#f6ad55" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,5"/>
  <line x1="800" y1="395" x2="800" y2="442" stroke="#f6ad55" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4,5"/>
  <rect x="250" y="442" width="550" height="46" rx="6" fill="#f6ad55" fill-opacity="0.07" stroke="#f6ad55" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="525" y="471" text-anchor="middle" fill="#f6ad55" font-family="Microsoft YaHei, sans-serif" font-size="16">第一下 → 自动化上线：这中间只能事后补救</text>

  <!-- 页脚 -->
  <text x="850" y="507" text-anchor="end" fill="#3d5570" font-family="Microsoft YaHei, sans-serif" font-size="15">示意时间轴 · 非精确比例</text>
</svg>
