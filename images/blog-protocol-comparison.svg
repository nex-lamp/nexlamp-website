<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4fc3f7" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Grid -->
  <g opacity="0.08" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-family="monospace" font-size="18" fill="#4fc3f7" filter="url(#glow1)">PROTOCOL COMPARISON MATRIX</text>
  <text x="400" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b8dad">四大智能照明协议核心参数对比</text>
  <!-- Zigbee -->
  <rect x="40" y="90" width="170" height="370" rx="8" fill="rgba(0,200,83,0.08)" stroke="#00c853" stroke-width="0.8"/>
  <text x="125" y="118" text-anchor="middle" font-family="monospace" font-size="16" fill="#00c853" filter="url(#glow1)">Zigbee</text>
  <text x="125" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4caf50">IEEE 802.15.4</text>
  <text x="60" y="170" font-family="sans-serif" font-size="11" fill="#b0bec5">频率: 2.4GHz</text>
  <text x="60" y="192" font-family="sans-serif" font-size="11" fill="#b0bec5">速率: 250kbps</text>
  <text x="60" y="214" font-family="sans-serif" font-size="11" fill="#b0bec5">距离: 10-100m</text>
  <text x="60" y="236" font-family="sans-serif" font-size="11" fill="#b0bec5">节点: 65535+</text>
  <text x="60" y="258" font-family="sans-serif" font-size="11" fill="#b0bec5">功耗: 极低</text>
  <text x="60" y="290" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ Mesh自组网</text>
  <text x="60" y="310" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 大规模部署</text>
  <text x="60" y="330" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 低功耗稳定</text>
  <text x="60" y="360" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 需要网关</text>
  <text x="60" y="380" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 协议碎片化</text>
  <text x="60" y="400" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 开发门槛高</text>
  <rect x="60" y="420" width="130" height="24" rx="4" fill="rgba(0,200,83,0.2)"/>
  <text x="125" y="436" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#69f0ae">适用: 工程项目</text>
  <!-- BLE Mesh -->
  <rect x="230" y="90" width="170" height="370" rx="8" fill="rgba(33,150,243,0.08)" stroke="#2196f3" stroke-width="0.8"/>
  <text x="315" y="118" text-anchor="middle" font-family="monospace" font-size="16" fill="#2196f3" filter="url(#glow1)">BLE Mesh</text>
  <text x="315" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64b5f6">Bluetooth 5.0+</text>
  <text x="250" y="170" font-family="sans-serif" font-size="11" fill="#b0bec5">频率: 2.4GHz</text>
  <text x="250" y="192" font-family="sans-serif" font-size="11" fill="#b0bec5">速率: 1-2Mbps</text>
  <text x="250" y="214" font-family="sans-serif" font-size="11" fill="#b0bec5">距离: 10-50m</text>
  <text x="250" y="236" font-family="sans-serif" font-size="11" fill="#b0bec5">节点: 32767</text>
  <text x="250" y="258" font-family="sans-serif" font-size="11" fill="#b0bec5">功耗: 低</text>
  <text x="250" y="290" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 手机直连</text>
  <text x="250" y="310" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 生态丰富</text>
  <text x="250" y="330" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 部署简单</text>
  <text x="250" y="360" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 节点数受限</text>
  <text x="250" y="380" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 功耗&gt;Zigbee</text>
  <text x="250" y="400" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 延迟略高</text>
  <rect x="250" y="420" width="130" height="24" rx="4" fill="rgba(33,150,243,0.2)"/>
  <text x="315" y="436" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64b5f6">适用: 家用照明</text>
  <!-- Wi-Fi -->
  <rect x="420" y="90" width="170" height="370" rx="8" fill="rgba(255,152,0,0.08)" stroke="#ff9800" stroke-width="0.8"/>
  <text x="505" y="118" text-anchor="middle" font-family="monospace" font-size="16" fill="#ff9800" filter="url(#glow1)">Wi-Fi</text>
  <text x="505" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffb74d">IEEE 802.11</text>
  <text x="440" y="170" font-family="sans-serif" font-size="11" fill="#b0bec5">频率: 2.4/5GHz</text>
  <text x="440" y="192" font-family="sans-serif" font-size="11" fill="#b0bec5">速率: 54-600Mbps</text>
  <text x="440" y="214" font-family="sans-serif" font-size="11" fill="#b0bec5">距离: 10-30m</text>
  <text x="440" y="236" font-family="sans-serif" font-size="11" fill="#b0bec5">节点: 20-30</text>
  <text x="440" y="258" font-family="sans-serif" font-size="11" fill="#b0bec5">功耗: 高</text>
  <text x="440" y="290" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 无需网关</text>
  <text x="440" y="310" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 带宽高</text>
  <text x="440" y="330" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 互联网直连</text>
  <text x="440" y="360" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 功耗过高</text>
  <text x="440" y="380" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 节点数极少</text>
  <text x="440" y="400" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 路由器瓶颈</text>
  <rect x="440" y="420" width="130" height="24" rx="4" fill="rgba(255,152,0,0.2)"/>
  <text x="505" y="436" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffb74d">适用: 少量设备</text>
  <!-- DALI -->
  <rect x="610" y="90" width="150" height="370" rx="8" fill="rgba(171,71,188,0.08)" stroke="#ab47bc" stroke-width="0.8"/>
  <text x="685" y="118" text-anchor="middle" font-family="monospace" font-size="16" fill="#ab47bc" filter="url(#glow1)">DALI-2</text>
  <text x="685" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ce93d8">IEC 62386</text>
  <text x="625" y="170" font-family="sans-serif" font-size="11" fill="#b0bec5">总线: 有线</text>
  <text x="625" y="192" font-family="sans-serif" font-size="11" fill="#b0bec5">速率: 1200bps</text>
  <text x="625" y="214" font-family="sans-serif" font-size="11" fill="#b0bec5">距离: 300m</text>
  <text x="625" y="236" font-family="sans-serif" font-size="11" fill="#b0bec5">节点: 64/组</text>
  <text x="625" y="258" font-family="sans-serif" font-size="11" fill="#b0bec5">功耗: 极低</text>
  <text x="625" y="290" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 精准调光</text>
  <text x="625" y="310" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 标准化高</text>
  <text x="625" y="330" font-family="sans-serif" font-size="11" fill="#69f0ae">✓ 可靠性极强</text>
  <text x="625" y="360" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 布线复杂</text>
  <text x="625" y="380" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 成本较高</text>
  <text x="625" y="400" font-family="sans-serif" font-size="11" fill="#ff5252">✗ 仅照明控制</text>
  <rect x="625" y="420" width="120" height="24" rx="4" fill="rgba(171,71,188,0.2)"/>
  <text x="685" y="436" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ce93d8">适用: 商业照明</text>
</svg>