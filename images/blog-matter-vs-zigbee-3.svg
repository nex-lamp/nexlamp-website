<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="Consolas, 'Microsoft YaHei', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1f3d"/>
    </linearGradient>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a3050" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="680" height="520" fill="url(#bgGrad)"/>
  <rect width="680" height="520" fill="url(#grid)"/>

  <!-- Title -->
  <text x="340" y="38" text-anchor="middle" fill="#e0f7fa" font-size="18" font-weight="bold">智能照明协议选型决策流程图</text>
  <text x="340" y="58" text-anchor="middle" fill="#4f8fb0" font-size="11" font-family="'Microsoft YaHei', sans-serif">2026年 &amp;#8226; 回答装修时最常问的 5 个决策问题</text>

  <!-- START -->
  <rect x="265" y="75" width="150" height="32" rx="16" fill="#ff6b6b" opacity="0.9" filter="url(#glowGreen)"/>
  <text x="340" y="96" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">开始选型</text>

  <!-- Q1: Budget -->
  <line x1="340" y1="107" x2="340" y2="125" stroke="#4f8fb0" stroke-width="1.5"/>
  <polygon points="335,125 345,125 340,133" fill="#4f8fb0"/>

  <rect x="170" y="138" width="340" height="28" rx="6" fill="#1a2a40" stroke="#2a5070" stroke-width="1"/>
  <text x="340" y="157" text-anchor="middle" fill="#8ab0d0" font-size="11" font-family="'Microsoft YaHei', sans-serif">Q1: 全屋智能照明预算 &lt; ¥3000？</text>

  <!-- YES branch -->
  <line x1="250" y1="166" x2="160" y2="200" stroke="#06d6a0" stroke-width="1.5"/>
  <rect x="135" y="175" width="50" height="20" rx="4" fill="#06d6a0" opacity="0.3"/>
  <text x="160" y="190" text-anchor="middle" fill="#06d6a0" font-size="10" font-weight="bold">YES</text>

  <rect x="70" y="198" width="150" height="40" rx="8" fill="url(#zigbeeGrad)" opacity="0.2" stroke="#00b4d8" stroke-width="1.5" filter="url(#glowBlue)"/>
  <text x="145" y="220" text-anchor="middle" fill="#00b4d8" font-size="13" font-weight="bold">选 Zigbee</text>
  <text x="145" y="234" text-anchor="middle" fill="#48cae4" font-size="9" font-family="'Microsoft YaHei', sans-serif">涂鸦射灯30-50元/个</text>

  <!-- NO branch Q2 -->
  <line x1="430" y1="166" x2="520" y2="200" stroke="#ff6b6b" stroke-width="1.5"/>
  <rect x="455" y="175" width="50" height="20" rx="4" fill="#ff6b6b" opacity="0.3"/>
  <text x="480" y="190" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="bold">NO</text>

  <rect x="430" y="198" width="200" height="28" rx="6" fill="#1a2a40" stroke="#2a5070" stroke-width="1"/>
  <text x="530" y="217" text-anchor="middle" fill="#8ab0d0" font-size="11" font-family="'Microsoft YaHei', sans-serif">Q2: 主力使用Apple HomeKit？</text>

  <!-- Q2 YES -->
  <line x1="515" y1="226" x2="480" y2="260" stroke="#06d6a0" stroke-width="1.5"/>
  <rect x="488" y="235" width="40" height="18" rx="4" fill="#06d6a0" opacity="0.3"/>
  <text x="508" y="248" text-anchor="middle" fill="#06d6a0" font-size="9" font-weight="bold">YES</text>

  <rect x="395" y="258" width="140" height="32" rx="8" fill="#1a1020" stroke="#ff6b6b" stroke-width="1.5" filter="url(#glowGreen)"/>
  <text x="465" y="278" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">选 Matter</text>

  <!-- Q2 NO Q3 -->
  <line x1="545" y1="226" x2="580" y2="260" stroke="#ff6b6b" stroke-width="1.5"/>
  <rect x="558" y="235" width="40" height="18" rx="4" fill="#ff6b6b" opacity="0.3"/>
  <text x="578" y="248" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">NO</text>

  <rect x="510" y="258" width="160" height="28" rx="6" fill="#1a2a40" stroke="#2a5070" stroke-width="1"/>
  <text x="590" y="277" text-anchor="middle" fill="#8ab0d0" font-size="11" font-family="'Microsoft YaHei', sans-serif">Q3: 需要跨平台控制？</text>

  <!-- Q3 YES -->
  <line x1="580" y1="286" x2="550" y2="320" stroke="#06d6a0" stroke-width="1.5"/>
  <rect x="558" y="295" width="40" height="18" rx="4" fill="#06d6a0" opacity="0.3"/>
  <text x="578" y="308" text-anchor="middle" fill="#06d6a0" font-size="9" font-weight="bold">YES</text>

  <rect x="470" y="318" width="130" height="32" rx="8" fill="#1a1020" stroke="#ff6b6b" stroke-width="1.5" filter="url(#glowGreen)"/>
  <text x="535" y="338" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">选 Matter</text>

  <!-- Q3 NO Q4 -->
  <line x1="610" y1="286" x2="580" y2="360" stroke="#ff6b6b" stroke-width="1.5"/>
  <rect x="588" y="310" width="40" height="18" rx="4" fill="#ff6b6b" opacity="0.3"/>
  <text x="608" y="323" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">NO</text>

  <rect x="485" y="358" width="180" height="28" rx="6" fill="#1a2a40" stroke="#2a5070" stroke-width="1"/>
  <text x="575" y="377" text-anchor="middle" fill="#8ab0d0" font-size="11" font-family="'Microsoft YaHei', sans-serif">Q4: 愿意接受调试折腾？</text>

  <!-- Q4 YES -->
  <line x1="565" y1="386" x2="520" y2="425" stroke="#06d6a0" stroke-width="1.5"/>
  <rect x="536" y="395" width="40" height="18" rx="4" fill="#06d6a0" opacity="0.3"/>
  <text x="556" y="408" text-anchor="middle" fill="#06d6a0" font-size="9" font-weight="bold">YES</text>

  <rect x="440" y="423" width="130" height="32" rx="8" fill="#1a1020" stroke="#ff6b6b" stroke-width="1.5" filter="url(#glowGreen)"/>
  <text x="505" y="443" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">选 Matter</text>

  <!-- Q4 NO -->
  <line x1="590" y1="386" x2="620" y2="425" stroke="#ff6b6b" stroke-width="1.5"/>
  <rect x="600" y="395" width="40" height="18" rx="4" fill="#ff6b6b" opacity="0.3"/>
  <text x="620" y="408" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">NO</text>

  <line x1="620" y1="423" x2="560" y2="425" stroke="#ff6b6b" stroke-width="1"/>

  <!-- DECISION: Zigbee + Matter Gateway -->
  <rect x="130" y="440" width="420" height="55" rx="12" fill="url(#zigbeeGrad)" opacity="0.15" stroke="#00b4d8" stroke-width="2" filter="url(#glowBlue)"/>
  <text x="340" y="463" text-anchor="middle" fill="#00b4d8" font-size="14" font-weight="bold">&#x2705; 选 Zigbee + Matter双模网关</text>
  <text x="340" y="485" text-anchor="middle" fill="#48cae4" font-size="10" font-family="'Microsoft YaHei', sans-serif">灯具用Zigbee (便宜成熟) + 网关支持Matter Bridge (未来可升级) = 最优解</text>

  <!-- Return arrows -->
  <line x1="145" y1="238" x2="145" y2="440" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="465" y1="290" x2="465" y2="440" stroke="#ff6b6b" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="535" y1="350" x2="505" y2="440" stroke="#06d6a0" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3"/>
</svg>