<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#111d35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="520" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#4a9eff">
    <line x1="0" y1="40" x2="680" y2="40"/><line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="200" x2="680" y2="200"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="280" x2="680" y2="280"/><line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="360" x2="680" y2="360"/><line x1="0" y1="400" x2="680" y2="400"/>
    <line x1="0" y1="440" x2="680" y2="440"/><line x1="0" y1="480" x2="680" y2="480"/>
  </g>

  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" font-family="monospace" font-size="18" fill="#00d4aa" filter="url(#glow)" font-weight="bold">2026年智能照明协议选型决策树</text>

  <!-- Root Node -->
  <rect x="215" y="58" width="250" height="42" rx="21" fill="#0a1a2f" stroke="#00d4aa" stroke-width="2" filter="url(#glow)"/>
  <text x="340" y="84" text-anchor="middle" font-family="monospace" font-size="13" fill="#00d4aa" font-weight="bold">你的预算范围？</text>

  <!-- Branch lines from root -->
  <line x1="270" y1="100" x2="130" y2="165" stroke="#4a9eff" stroke-width="1.5"/>
  <line x1="410" y1="100" x2="550" y2="165" stroke="#ff6b35" stroke-width="1.5"/>

  <!-- Left branch: Budget limited -->
  <text x="105" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a9eff">全屋 ≤2000元</text>

  <rect x="30" y="165" width="200" height="46" rx="8" fill="#0a1528" stroke="#4a9eff" stroke-width="2" filter="url(#glow)"/>
  <text x="130" y="186" text-anchor="middle" font-family="monospace" font-size="12" fill="#4a9eff" font-weight="bold">选 Zigbee 全方案</text>
  <text x="130" y="204" text-anchor="middle" font-family="monospace" font-size="9" fill="#7799cc">网关+筒射灯+灯带 ~1500元</text>

  <!-- Left sub-branch: 是否要跨生态 -->
  <line x1="130" y1="211" x2="130" y2="255" stroke="#4a9eff" stroke-width="1"/>

  <text x="55" y="245" text-anchor="middle" font-family="monospace" font-size="9" fill="#5a8899">要跨生态？</text>

  <rect x="20" y="255" width="105" height="40" rx="6" fill="#0a1018" stroke="#008866" stroke-width="1.5"/>
  <text x="72" y="273" text-anchor="middle" font-family="monospace" font-size="10" fill="#00d4aa">买Matter桥接网关</text>
  <text x="72" y="289" text-anchor="middle" font-family="monospace" font-size="8" fill="#779999">涂鸦/绿米2026款</text>

  <rect x="135" y="255" width="105" height="40" rx="6" fill="#0a1018" stroke="#555" stroke-width="1"/>
  <text x="187" y="273" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">标准Zigbee网关</text>
  <text x="187" y="289" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">涂鸦App控制即可</text>

  <!-- Right branch: Budget sufficient -->
  <text x="590" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff6b35">全屋 &gt;5000元</text>

  <rect x="440" y="165" width="220" height="46" rx="8" fill="#1a0f0a" stroke="#ff6b35" stroke-width="2" filter="url(#glow)"/>
  <text x="550" y="186" text-anchor="middle" font-family="monospace" font-size="12" fill="#ff6b35" font-weight="bold">混合方案</text>
  <text x="550" y="204" text-anchor="middle" font-family="monospace" font-size="9" fill="#cc8866">Matter直连 + Zigbee桥接</text>

  <!-- Right sub-branch -->
  <line x1="500" y1="211" x2="460" y2="255" stroke="#ff6b35" stroke-width="1"/>
  <line x1="600" y1="211" x2="640" y2="255" stroke="#ff6b35" stroke-width="1"/>

  <rect x="380" y="255" width="160" height="50" rx="6" fill="#0a1018" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="460" y="273" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a9eff">核心照明</text>
  <text x="460" y="289" text-anchor="middle" font-family="monospace" font-size="9" fill="#7799cc">Matter over Thread筒灯</text>
  <text x="460" y="302" text-anchor="middle" font-family="monospace" font-size="9" fill="#5577aa">120-200元/盏</text>

  <rect x="555" y="255" width="110" height="50" rx="6" fill="#0a1018" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="610" y="273" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff6b35">辅助照明</text>
  <text x="610" y="289" text-anchor="middle" font-family="monospace" font-size="9" fill="#cc8866">Zigbee射灯+灯带</text>
  <text x="610" y="302" text-anchor="middle" font-family="monospace" font-size="9" fill="#996655">50-80元/盏</text>

  <!-- Bottom summary section -->
  <rect x="30" y="340" width="620" height="105" rx="8" fill="#0d1f3c" stroke="#00d4aa" stroke-width="1" opacity="0.8"/>
  <text x="50" y="366" font-family="monospace" font-size="13" fill="#00d4aa" font-weight="bold">核心原则</text>
  <text x="50" y="390" font-family="monospace" font-size="11" fill="#88aa99">1. 筒灯/射灯 → Zigbee（成本低、选品多、稳定性好）</text>
  <text x="50" y="410" font-family="monospace" font-size="11" fill="#88aa99">2. 网关 → 必选支持 Matter Bridge 的（涂鸦/绿米/小米 2026款）</text>
  <text x="50" y="430" font-family="monospace" font-size="11" fill="#88aa99">3. 拒绝仅支持"某个App"的封闭智能灯，必须支持标准协议</text>

  <!-- Warning box -->
  <rect x="30" y="458" width="620" height="48" rx="6" fill="#1a0a0a" stroke="#ff4444" stroke-width="1.5"/>
  <text x="340" y="478" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff6666">⚠ 最亏的选择：买不支持标准协议的"伪智能灯" + 不买Matter桥接网关 = 被锁在生态孤岛</text>
  <text x="340" y="496" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff4444">记住：决定照明体验的不是协议，而是光源品质（Ra、色温、频闪）和驱动电源质量</text>
</svg>