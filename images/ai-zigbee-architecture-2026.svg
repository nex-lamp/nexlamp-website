<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg3)"/>
  <!-- Grid dots -->
  <g fill="#1a3a5c" opacity="0.4">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/>
    <circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/><circle cx="700" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/>
    <circle cx="400" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="600" cy="200" r="1.5"/><circle cx="700" cy="200" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/>
    <circle cx="400" cy="300" r="1.5"/><circle cx="500" cy="300" r="1.5"/><circle cx="600" cy="300" r="1.5"/><circle cx="700" cy="300" r="1.5"/>
  </g>
  <!-- Zigbee Gateway (center) -->
  <rect x="340" y="160" width="120" height="70" rx="8" fill="#0d2137" stroke="#00d4ff" stroke-width="2" filter="url(#glow2)"/>
  <text x="400" y="190" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">Zigbee</text>
  <text x="400" y="210" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" opacity="0.7">Gateway</text>
  <!-- Signal rings from gateway -->
  <circle cx="400" cy="195" r="90" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.2"/>
  <circle cx="400" cy="195" r="140" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <!-- Cloud AI (top) -->
  <ellipse cx="400" cy="50" rx="60" ry="25" fill="#0d2137" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
  <text x="400" y="55" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10">Cloud AI</text>
  <!-- Cloud to Gateway -->
  <line x1="400" y1="75" x2="400" y2="160" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.6"/>
  <text x="420" y="120" fill="#a78bfa" font-family="monospace" font-size="7" opacity="0.5">策略下发</text>
  <!-- Light nodes - left cluster -->
  <g filter="url(#glow)">
    <circle cx="150" cy="130" r="15" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="150" y="134" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="7">💡</text>
    <circle cx="120" cy="200" r="15" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="120" y="204" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="7">💡</text>
    <circle cx="180" cy="260" r="15" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="180" y="264" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="7">💡</text>
  </g>
  <!-- Light nodes - right cluster -->
  <g filter="url(#glow)">
    <circle cx="650" cy="130" r="15" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="650" y="134" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="7">💡</text>
    <circle cx="680" cy="200" r="15" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="680" y="204" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="7">💡</text>
    <circle cx="620" cy="260" r="15" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="620" y="264" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="7">💡</text>
  </g>
  <!-- Sensor nodes - bottom -->
  <circle cx="250" cy="340" r="12" fill="none" stroke="#ff6b35" stroke-width="1.5" filter="url(#glow)"/>
  <text x="250" y="344" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="7">S</text>
  <circle cx="400" cy="360" r="12" fill="none" stroke="#ff6b35" stroke-width="1.5" filter="url(#glow)"/>
  <text x="400" y="364" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="7">S</text>
  <circle cx="550" cy="340" r="12" fill="none" stroke="#ff6b35" stroke-width="1.5" filter="url(#glow)"/>
  <text x="550" y="344" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="7">S</text>
  <!-- Zigbee mesh connections -->
  <line x1="165" y1="130" x2="340" y2="180" stroke="#4ade80" stroke-width="0.8" opacity="0.4"/>
  <line x1="135" y1="200" x2="340" y2="195" stroke="#4ade80" stroke-width="0.8" opacity="0.4"/>
  <line x1="195" y1="260" x2="340" y2="215" stroke="#4ade80" stroke-width="0.8" opacity="0.4"/>
  <line x1="635" y1="130" x2="460" y2="180" stroke="#4ade80" stroke-width="0.8" opacity="0.4"/>
  <line x1="665" y1="200" x2="460" y2="195" stroke="#4ade80" stroke-width="0.8" opacity="0.4"/>
  <line x1="605" y1="260" x2="460" y2="215" stroke="#4ade80" stroke-width="0.8" opacity="0.4"/>
  <!-- Mesh interconnections (lights talk to each other) -->
  <line x1="165" y1="130" x2="135" y2="200" stroke="#4ade80" stroke-width="0.5" opacity="0.25"/>
  <line x1="135" y1="200" x2="195" y2="260" stroke="#4ade80" stroke-width="0.5" opacity="0.25"/>
  <line x1="635" y1="130" x2="665" y2="200" stroke="#4ade80" stroke-width="0.5" opacity="0.25"/>
  <line x1="665" y1="200" x2="605" y2="260" stroke="#4ade80" stroke-width="0.5" opacity="0.25"/>
  <!-- Sensor to gateway -->
  <line x1="262" y1="335" x2="350" y2="230" stroke="#ff6b35" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 2"/>
  <line x1="400" y1="348" x2="400" y2="230" stroke="#ff6b35" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 2"/>
  <line x1="538" y1="335" x2="450" y2="230" stroke="#ff6b35" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 2"/>
  <!-- Labels -->
  <text x="150" y="110" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8" opacity="0.6">筒灯组</text>
  <text x="650" y="110" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="8" opacity="0.6">射灯组</text>
  <text x="250" y="370" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="7" opacity="0.5">人体</text>
  <text x="400" y="390" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="7" opacity="0.5">光照度</text>
  <text x="550" y="370" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="7" opacity="0.5">温湿度</text>
  <!-- Architecture label -->
  <rect x="150" y="420" width="500" height="20" rx="3" fill="#0d2137" stroke="#1a3a5c" stroke-width="0.5"/>
  <text x="400" y="434" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="9" opacity="0.7">云端AI推理 + 本地Zigbee执行 · Mesh自组网 · 超低功耗</text>
  <text x="400" y="20" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" opacity="0.5">AI + ZIGBEE ARCHITECTURE</text>
</svg>