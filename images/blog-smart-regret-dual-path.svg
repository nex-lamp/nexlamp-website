<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#12305a" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#28c840" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#0a1628"/>
  <rect width="900" height="620" fill="url(#grid2)"/>
  <text x="450" y="60" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">双保险架构：断网也能开灯，爸妈也会用</text>
  <text x="450" y="90" text-anchor="middle" fill="#5a8fd0" font-size="15">Zigbee 本地执行 + 物理开关兜底</text>

  <!-- left path: smart path -->
  <rect x="70" y="120" width="200" height="70" rx="10" fill="#0f2647" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="170" y="150" text-anchor="middle" fill="#00e5ff" font-size="16" font-weight="bold">无线开关 / APP</text>
  <text x="170" y="175" text-anchor="middle" fill="#7fb8ff" font-size="13">场景 · 调光 · 远程</text>

  <rect x="330" y="120" width="220" height="70" rx="10" fill="#0f2647" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="440" y="150" text-anchor="middle" fill="#00e5ff" font-size="16" font-weight="bold">Zigbee 网关</text>
  <text x="440" y="175" text-anchor="middle" fill="#7fb8ff" font-size="13">本地闭环 · 断网不失效</text>

  <rect x="610" y="120" width="220" height="70" rx="10" fill="#0f2647" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="720" y="150" text-anchor="middle" fill="#00e5ff" font-size="16" font-weight="bold">智能灯具</text>
  <text x="720" y="175" text-anchor="middle" fill="#7fb8ff" font-size="13">秒级响应 · 无频闪驱动</text>

  <line x1="270" y1="155" x2="325" y2="155" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="155" x2="605" y2="155" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="115" text-anchor="middle" fill="#28c840" font-size="13" font-weight="bold">✓ 指令在网关本地完成，不走云</text>

  <!-- Matter bridge extension -->
  <rect x="330" y="230" width="220" height="56" rx="10" fill="#1a1040" stroke="#7c6cff" stroke-width="1.3"/>
  <text x="440" y="254" text-anchor="middle" fill="#a89bff" font-size="14" font-weight="bold">Matter Bridge 翻译层</text>
  <text x="440" y="274" text-anchor="middle" fill="#7f6fd0" font-size="12">苹果家庭 / Google Home 互通</text>
  <line x1="440" y1="190" x2="440" y2="225" stroke="#7c6cff" stroke-width="1.6" stroke-dasharray="5,4"/>

  <!-- right path: fallback -->
  <rect x="330" y="330" width="220" height="70" rx="10" fill="#0f2a20" stroke="#28c840" stroke-width="1.5"/>
  <text x="440" y="360" text-anchor="middle" fill="#28c840" font-size="16" font-weight="bold">物理墙壁开关</text>
  <text x="440" y="385" text-anchor="middle" fill="#8fd9a0" font-size="13">一键开灯 · 零学习成本</text>

  <rect x="610" y="330" width="220" height="70" rx="10" fill="#0f2a20" stroke="#28c840" stroke-width="1.5"/>
  <text x="720" y="360" text-anchor="middle" fill="#28c840" font-size="16" font-weight="bold">灯具直接点亮</text>
  <text x="720" y="385" text-anchor="middle" fill="#8fd9a0" font-size="13">不依赖APP · 不依赖网络</text>
  <line x1="550" y1="365" x2="605" y2="365" stroke="#28c840" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="440" y="425" text-anchor="middle" fill="#ffb84d" font-size="14" font-weight="bold">老人房 · 客房 · 起夜动线：物理开关是底线</text>

  <!-- room allocation table -->
  <rect x="70" y="460" width="760" height="120" rx="10" fill="#0d1f3c" stroke="#1e4a8a" stroke-width="1.2"/>
  <line x1="70" y1="500" x2="830" y2="500" stroke="#1e4a8a" stroke-width="1"/>
  <text x="320" y="486" text-anchor="middle" fill="#7fb8ff" font-size="14" font-weight="bold">房间</text>
  <text x="620" y="486" text-anchor="middle" fill="#7fb8ff" font-size="14" font-weight="bold">推荐配置</text>
  <line x1="330" y1="500" x2="330" y2="580" stroke="#1e4a8a" stroke-width="1"/>
  <text x="320" y="525" text-anchor="middle" fill="#c8dcf5" font-size="14">爸妈房 / 客房</text>
  <text x="620" y="525" text-anchor="middle" fill="#c8dcf5" font-size="14">普通开关 + 兼容型驱动，不做复杂场景</text>
  <text x="320" y="560" text-anchor="middle" fill="#c8dcf5" font-size="14">客厅 / 卧室</text>
  <text x="620" y="560" text-anchor="middle" fill="#c8dcf5" font-size="14">Zigbee 智能 + 无线贴墙开关 + 物理开关兜底</text>
  <text x="450" y="605" text-anchor="middle" fill="#3a6ea8" font-size="12">NEXLAMP · 智能不该让人迁就它 · nexlamp.com</text>
</svg>
