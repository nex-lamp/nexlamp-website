<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3055" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="barGradBad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="680" height="420" fill="#0a1628"/>
  <rect width="680" height="420" fill="url(#grid1)"/>
  <!-- Title -->
  <text x="340" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#e0e0e0" font-weight="bold">灯具电器一体化 vs 独立驱动：关键参数对比</text>
  <!-- Divider -->
  <line x1="340" y1="60" x2="340" y2="390" stroke="#2478c2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Left column header -->
  <text x="170" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4fc3f7" font-weight="bold">独立驱动灯具</text>
  <rect x="90" y="60" width="180" height="18" fill="#1565c0" opacity="0.3" rx="4"/>
  <!-- Right column header -->
  <text x="510" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ff7043" font-weight="bold">一体化集成灯具</text>
  <rect x="430" y="60" width="180" height="18" fill="#c62828" opacity="0.3" rx="4"/>
  <!-- Row 1: LED工作温度 -->
  <text x="20" y="110" font-family="sans-serif" font-size="12" fill="#b0bec5">LED工作温度</text>
  <rect x="90" y="96" width="180" height="20" fill="url(#barGrad)" rx="3"/>
  <text x="180" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">65℃</text>
  <rect x="430" y="96" width="220" height="20" fill="url(#barGradBad)" rx="3"/>
  <text x="550" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">73-77℃ (+8~12℃)</text>
  <!-- Row 2: 年光衰率 -->
  <text x="20" y="148" font-family="sans-serif" font-size="12" fill="#b0bec5">年光衰率</text>
  <rect x="90" y="134" width="110" height="20" fill="url(#barGrad)" rx="3"/>
  <text x="145" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">8%</text>
  <rect x="430" y="134" width="165" height="20" fill="url(#barGradBad)" rx="3"/>
  <text x="512" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">12% (↑50%)</text>
  <!-- Row 3: 驱动芯片故障率 -->
  <text x="20" y="186" font-family="sans-serif" font-size="12" fill="#b0bec5">驱动芯片故障率</text>
  <rect x="90" y="172" width="40" height="20" fill="url(#barGrad)" rx="3"/>
  <text x="110" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">0.8%</text>
  <rect x="430" y="172" width="160" height="20" fill="url(#barGradBad)" rx="3"/>
  <text x="510" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">3.2% (↑4倍)</text>
  <!-- Row 4: 3年后亮度保留 -->
  <text x="20" y="224" font-family="sans-serif" font-size="12" fill="#b0bec5">3年后亮度保留</text>
  <rect x="90" y="210" width="150" height="20" fill="url(#barGrad)" rx="3"/>
  <text x="165" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">76%</text>
  <rect x="430" y="210" width="125" height="20" fill="url(#barGradBad)" rx="3"/>
  <text x="492" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">64%</text>
  <!-- Architecture diagrams -->
  <!-- Left: standalone -->
  <rect x="50" y="270" width="260" height="130" fill="#0d2137" stroke="#2478c2" stroke-width="1" rx="8"/>
  <text x="180" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4fc3f7">独立架构：各模块独立散热</text>
  <rect x="70" y="300" width="70" height="40" fill="#1565c0" opacity="0.5" rx="4" stroke="#4fc3f7" stroke-width="0.5"/>
  <text x="105" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e0e0e0">LED光源</text>
  <text x="105" y="335" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#80cbc4">独立腔体</text>
  <rect x="170" y="300" width="70" height="40" fill="#1565c0" opacity="0.5" rx="4" stroke="#4fc3f7" stroke-width="0.5"/>
  <text x="205" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e0e0e0">隔离驱动</text>
  <text x="205" y="335" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#80cbc4">独立散热</text>
  <rect x="270" y="300" width="30" height="40" fill="#1565c0" opacity="0.5" rx="4" stroke="#4fc3f7" stroke-width="0.5"/>
  <text x="285" y="318" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#e0e0e0">Zig</text>
  <text x="285" y="330" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#80cbc4">模块</text>
  <!-- arrows between modules -->
  <line x1="140" y1="320" x2="170" y2="320" stroke="#4fc3f7" stroke-width="1" marker-end="none"/>
  <line x1="240" y1="320" x2="270" y2="320" stroke="#4fc3f7" stroke-width="1"/>
  <!-- Temperature indicator -->
  <text x="180" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#80cbc4">温度可控 · 供电稳定 · 纹波低</text>
  <!-- Right: integrated -->
  <rect x="400" y="270" width="260" height="130" fill="#1a0a0a" stroke="#d32f2f" stroke-width="1" rx="8"/>
  <text x="530" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff7043">集成架构：所有模块共用腔体</text>
  <rect x="415" y="300" width="235" height="50" fill="#2a1515" rx="4" stroke="#ff7043" stroke-width="0.5"/>
  <rect x="420" y="305" width="60" height="35" fill="#4a2020" rx="3" stroke="#ff7043" stroke-width="0.5"/>
  <text x="450" y="325" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffcdd2">LED</text>
  <rect x="490" y="305" width="75" height="35" fill="#4a2020" rx="3" stroke="#ff7043" stroke-width="0.5"/>
  <text x="527" y="325" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffcdd2">驱动+芯片</text>
  <rect x="575" y="305" width="65" height="35" fill="#4a2020" rx="3" stroke="#ff7043" stroke-width="0.5"/>
  <text x="607" y="325" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffcdd2">Zigbee</text>
  <!-- Heat arrow -->
  <text x="530" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ff7043">散热压缩 · 温度叠加 · 纹波叠加</text>
  <!-- Heat icon -->
  <path d="M460,355 L470,355 L465,347 L475,355 L465,355 L465,362 Z" fill="#ff5722" opacity="0.7"/>
</svg>
