<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <filter id="g2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid2" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b3355" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="680" height="620" fill="url(#bg2)"/>
  <rect width="680" height="620" fill="url(#grid2)" opacity="0.55"/>

  <text x="34" y="46" fill="#7ec27e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" letter-spacing="2">四条路，动的墙不一样</text>
  <line x1="34" y1="58" x2="646" y2="58" stroke="#1b3355" stroke-width="1"/>

  <!-- 表头 -->
  <text x="40" y="88" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">方案</text>
  <text x="200" y="88" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">动不动墙</text>
  <text x="330" y="88" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">单点成本</text>
  <text x="470" y="88" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">最大短板</text>
  <line x1="34" y1="98" x2="646" y2="98" stroke="#26456e" stroke-width="1"/>

  <!-- 行1 智能灯泡 -->
  <rect x="34" y="106" width="612" height="86" rx="10" fill="#101f38" stroke="#26456e" stroke-width="1"/>
  <rect x="34" y="106" width="7" height="86" rx="3" fill="#7ec27e"/>
  <text x="52" y="136" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">智能灯泡</text>
  <text x="52" y="160" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">换灯泡，不动墙</text>
  <text x="200" y="146" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="13">不动墙</text>
  <text x="330" y="146" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="13">30~60 元</text>
  <text x="470" y="136" fill="#e09bc4" font-family="Microsoft YaHei, sans-serif" font-size="13">怕墙开关断电</text>
  <text x="470" y="158" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">一按就离线</text>

  <!-- 行2 智能开关 -->
  <rect x="34" y="202" width="612" height="86" rx="10" fill="#101f38" stroke="#26456e" stroke-width="1"/>
  <rect x="34" y="202" width="7" height="86" rx="3" fill="#5cc8e8"/>
  <text x="52" y="232" fill="#8ad8ee" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">智能开关 + 普通灯</text>
  <text x="52" y="256" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">动墙里的线路</text>
  <text x="200" y="242" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="13">动墙里线路</text>
  <text x="330" y="242" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="13">50~130 元</text>
  <text x="470" y="232" fill="#e09bc4" font-family="Microsoft YaHei, sans-serif" font-size="13">分单火 / 零火</text>
  <text x="470" y="254" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">买错装不上</text>

  <!-- 行3 无线贴墙开关 -->
  <rect x="34" y="298" width="612" height="86" rx="10" fill="#101f38" stroke="#26456e" stroke-width="1"/>
  <rect x="34" y="298" width="7" height="86" rx="3" fill="#c8a04a"/>
  <text x="52" y="328" fill="#e2c07a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">无线贴墙开关</text>
  <text x="52" y="352" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">只贴胶，不用接线</text>
  <text x="200" y="338" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="13">只贴胶</text>
  <text x="330" y="338" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="13">30~60 元</text>
  <text x="470" y="328" fill="#e09bc4" font-family="Microsoft YaHei, sans-serif" font-size="13">要换电池</text>
  <text x="470" y="350" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">还得有网关带着</text>

  <!-- 行4 凌动开关 -->
  <rect x="34" y="394" width="612" height="86" rx="10" fill="#12253f" stroke="#3f7a52" stroke-width="1.6"/>
  <rect x="34" y="394" width="7" height="86" rx="3" fill="#7ec27e"/>
  <text x="52" y="424" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">凌动开关 + 智能灯</text>
  <text x="52" y="448" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">标准解：灯永远在线</text>
  <text x="200" y="434" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="13">动墙里线路</text>
  <text x="330" y="434" fill="#c8d8ea" font-family="Microsoft YaHei, sans-serif" font-size="13">面板贵一些</text>
  <text x="470" y="424" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="13">必须和智能灯配套</text>
  <text x="470" y="446" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">弹簧规格有讲究</text>

  <!-- 底部提示 -->
  <rect x="34" y="500" width="612" height="96" rx="12" fill="rgba(126,194,126,0.10)" stroke="#3f7a52" stroke-width="1.2"/>
  <text x="54" y="530" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">租房 / 不动墙 → 智能灯泡 + 上电状态设置</text>
  <text x="54" y="556" fill="#9ee6ac" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">要调光、要长期在线 → 智能灯 + 凌动开关</text>
  <text x="54" y="582" fill="#8aa5c4" font-family="Microsoft YaHei, sans-serif" font-size="12">别把"智能灯"和"智能开关"当成一个东西买两遍</text>
</svg>
