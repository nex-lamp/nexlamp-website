<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ec27e"/>
      <stop offset="100%" stop-color="#5b8c5a"/>
    </linearGradient>
  </defs>
  <rect width="680" height="300" fill="url(#bg3)"/>
  <text x="340" y="36" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="22" font-weight="700">GB 30255-2026 合规时间线</text>
  <line x1="80" y1="160" x2="600" y2="160" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="160" x2="600" y2="160" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <g transform="translate(80, 160)">
    <circle cx="0" cy="0" r="10" fill="#7ec27e"/>
    <text x="0" y="40" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2026.03</text>
    <text x="0" y="60" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">标准发布</text>
  </g>
  <g transform="translate(520, 160)">
    <circle cx="0" cy="0" r="10" fill="#7ec27e"/>
    <text x="0" y="40" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2027.09</text>
    <text x="0" y="60" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">正式实施</text>
  </g>
  <g transform="translate(600, 160)">
    <circle cx="0" cy="0" r="10" fill="#5b8c5a"/>
    <text x="0" y="40" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2029.09</text>
    <text x="0" y="60" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">缓冲期结束</text>
  </g>
  <text x="340" y="255" text-anchor="middle" fill="#7ec27e" font-family="system-ui, sans-serif" font-size="12">2027年9月前出厂的产品，可延迟至2029年9月加施新版能效标识</text>
  <text x="340" y="280" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">建议：2026-2027年完成产品摸底测试与驱动升级</text>
</svg>
