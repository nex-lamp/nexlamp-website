  <text x="372" y="275" fill="#8899aa" font-family="Microsoft YaHei,sans-serif" font-size="11">✓ 全光谱LED成本降40% → 百元级普及</text>
  <text x="372" y="295" fill="#8899aa" font-family="Microsoft YaHei,sans-serif" font-size="11">✓ Ra98+可调色温 → 模拟自然光节律</text>
