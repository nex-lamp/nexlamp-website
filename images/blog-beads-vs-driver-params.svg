<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid3" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="680" height="400" fill="url(#bg3)"/>
  <rect width="680" height="400" fill="url(#grid3)"/>
  <text x="40" y="50" fill="#e2e8f0" font-size="24" font-weight="bold">自己换驱动：三个参数必须对上</text>
  <rect x="40" y="62" width="120" height="4" rx="2" fill="url(#glow3)"/>
  <text x="40" y="86" fill="#94a3b8" font-size="13">同规格驱动十几到几十块，买错轻则不亮，重则烧灯珠</text>

  <!-- param 1 -->
  <rect x="40" y="106" width="190" height="120" rx="10" fill="#112542" stroke="#34d399" stroke-width="1.2"/>
  <text x="58" y="136" fill="#34d399" font-size="15" font-weight="bold">① 输出电流/电压</text>
  <text x="58" y="162" fill="#94a3b8" font-size="12">原驱动印着输出规格</text>
  <text x="58" y="180" fill="#7dd3fc" font-size="13" font-family="Consolas, monospace">如 300mA±5% / 24V</text>
  <text x="58" y="206" fill="#fbbf24" font-size="11">宁可小电流，别大电流</text>

  <!-- param 2 -->
  <rect x="245" y="106" width="190" height="120" rx="10" fill="#112542" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="263" y="136" fill="#38bdf8" font-size="15" font-weight="bold">② 功率匹配</text>
  <text x="263" y="162" fill="#94a3b8" font-size="12">输出功率 ≥ 灯板功率</text>
  <text x="263" y="180" fill="#94a3b8" font-size="12">略大即可，不是越大越好</text>
  <rect x="263" y="194" width="90" height="16" rx="8" fill="#1e3a5f"/>
  <rect x="263" y="194" width="76" height="16" rx="8" fill="#38bdf8" opacity="0.7"/>
  <text x="360" y="206" fill="#7dd3fc" font-size="11">刚好够用</text>

  <!-- param 3 -->
  <rect x="450" y="106" width="190" height="120" rx="10" fill="#112542" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="468" y="136" fill="#fbbf24" font-size="15" font-weight="bold">③ 认准3C认证</text>
  <text x="468" y="162" fill="#94a3b8" font-size="12">驱动是3C强制认证目录</text>
  <text x="468" y="180" fill="#94a3b8" font-size="12">杂牌无认证=漏电风险</text>
  <text x="468" y="206" fill="#fbbf24" font-size="11">另查外形尺寸塞得进驱动仓</text>

  <!-- bottom compare -->
  <rect x="40" y="246" width="290" height="120" rx="10" fill="#0d2436" stroke="#34d399" stroke-width="1"/>
  <text x="58" y="276" fill="#34d399" font-size="14" font-weight="bold">✔ 好驱动</text>
  <text x="58" y="302" fill="#cbd5e1" font-size="12">3C认证 + 过载/短路保护</text>
  <text x="58" y="324" fill="#cbd5e1" font-size="12">大厂电解电容（耐高温105℃）</text>
  <text x="58" y="346" fill="#cbd5e1" font-size="12">坏了可单独换，不用报废整灯</text>

  <rect x="350" y="246" width="290" height="120" rx="10" fill="#2a1420" stroke="#f87171" stroke-width="1"/>
  <text x="368" y="276" fill="#f87171" font-size="14" font-weight="bold">✘ 烂驱动</text>
  <text x="368" y="302" fill="#cbd5e1" font-size="12">无认证、无保护电路</text>
  <text x="368" y="324" fill="#cbd5e1" font-size="12">劣质电容两年鼓包</text>
  <text x="368" y="346" fill="#cbd5e1" font-size="12">输出纹波大→灯珠频闪+光衰快</text>

  <!-- middle vs -->
  <circle cx="340" cy="306" r="20" fill="#0a1628" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="312" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">VS</text>
</svg>
