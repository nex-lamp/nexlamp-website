<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a44" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="18" font-weight="bold" filter="url(#glow)">Traditional 220V AC vs PoE Lighting Architecture</text>

  <!-- Traditional System -->
  <rect x="25" y="60" width="360" height="420" rx="8" fill="#0d1a2d" stroke="#ff6b35" stroke-width="1" stroke-dasharray="4"/>
  <text x="205" y="85" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="13" font-weight="bold" filter="url(#glow)">&#x1F4A1; Traditional 220V AC System</text>

  <!-- Power path - Traditional -->
  <rect x="60" y="105" width="110" height="45" rx="6" fill="#1a2a44" stroke="#ff6b35" stroke-width="1"/>
  <text x="115" y="123" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">AC Mains</text>
  <text x="115" y="139" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="10">220V/50Hz</text>

  <line x1="170" y1="127" x2="210" y2="127" stroke="#ff6b35" stroke-width="2"/>
  <text x="190" y="120" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">power</text>

  <rect x="210" y="105" width="130" height="45" rx="6" fill="#1a2a44" stroke="#ff6b35" stroke-width="1"/>
  <text x="275" y="123" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">Distribution Box</text>
  <text x="275" y="139" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="10">MCB + wiring</text>

  <line x1="340" y1="127" x2="370" y2="127" stroke="#ff6b35" stroke-width="2"/>

  <rect x="180" y="170" width="180" height="55" rx="6" fill="#1a2a44" stroke="#ff6b35" stroke-width="1"/>
  <text x="270" y="190" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">LED Driver (AC-DC)</text>
  <text x="270" y="207" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="10">Rectifier + PFC + DC-DC</text>
  <text x="270" y="220" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">&#x26A1; High voltage risk</text>

  <line x1="270" y1="225" x2="270" y2="250" stroke="#ff6b35" stroke-width="2"/>
  <line x1="270" y1="250" x2="120" y2="250" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3"/>
  <line x1="270" y1="250" x2="420" y2="250" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3"/>

  <!-- Traditional luminaires -->
  <rect x="45" y="260" width="75" height="45" rx="5" fill="#151e30" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="82" y="278" text-anchor="middle" fill="#cc9966" font-family="monospace" font-size="10">Luminaire</text>
  <text x="82" y="294" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">LED panel</text>

  <rect x="155" y="260" width="75" height="45" rx="5" fill="#151e30" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="192" y="278" text-anchor="middle" fill="#cc9966" font-family="monospace" font-size="10">Luminaire</text>
  <text x="192" y="294" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">LED downlight</text>

  <rect x="265" y="260" width="75" height="45" rx="5" fill="#151e30" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="302" y="278" text-anchor="middle" fill="#cc9966" font-family="monospace" font-size="10">Luminaire</text>
  <text x="302" y="294" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">LED strip</text>

  <!-- Separate control - Traditional -->
  <rect x="45" y="330" width="290" height="70" rx="6" fill="#1a1520" stroke="#9944ff" stroke-width="1" stroke-dasharray="4"/>
  <text x="190" y="350" text-anchor="middle" fill="#9944ff" font-family="monospace" font-size="11" font-weight="bold">Separate Control System</text>
  <text x="190" y="367" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="10">DALI Bus / Zigbee Gateway / 0-10V wiring</text>
  <text x="190" y="385" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">Extra cabling + commissioning cost</text>

  <!-- Traditional Cost -->
  <rect x="45" y="415" width="290" height="40" rx="6" fill="#1a1520" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="190" y="436" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">Power cable + control cable = 2x wiring cost</text>

  <!-- Divider -->
  <line x1="400" y1="60" x2="400" y2="460" stroke="#1a2a44" stroke-width="2"/>

  <!-- PoE System -->
  <rect x="415" y="60" width="360" height="420" rx="8" fill="#0d1a2d" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4"/>
  <text x="595" y="85" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="13" font-weight="bold" filter="url(#glow)">&#x1F310; PoE Lighting System</text>

  <!-- PoE Switch -->
  <rect x="445" y="105" width="130" height="55" rx="6" fill="#0d2a1d" stroke="#00ff88" stroke-width="1"/>
  <text x="510" y="123" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glow)">PoE Switch</text>
  <text x="510" y="140" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="10">802.3bt 90W/port</text>
  <text x="510" y="154" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">&#x1F4E1; Data + Power</text>

  <!-- Ethernet cables -->
  <line x1="575" y1="132" x2="630" y2="132" stroke="#00ff88" stroke-width="2"/>
  <line x1="575" y1="132" x2="510" y2="200" stroke="#00ff88" stroke-width="2"/>
  <line x1="575" y1="132" x2="700" y2="200" stroke="#00ff88" stroke-width="2"/>
  <line x1="575" y1="132" x2="400" y2="200" stroke="#00ff88" stroke-width="2"/>

  <text x="640" y="125" fill="#00ff88" font-family="monospace" font-size="9">Cat6a</text>
  <text x="585" y="170" fill="#00ff88" font-family="monospace" font-size="9">Cat6a</text>
  <text x="670" y="170" fill="#00ff88" font-family="monospace" font-size="9">Cat6a</text>
  <text x="460" y="170" fill="#00ff88" font-family="monospace" font-size="9">Cat6a</text>

  <!-- PoE Luminaires with integrated driver -->
  <rect x="450" y="208" width="100" height="75" rx="6" fill="#0d2a1d" stroke="#00d4ff" stroke-width="1"/>
  <text x="500" y="228" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">PoE Luminaire</text>
  <text x="500" y="244" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="9">DC-DC Driver</text>
  <text x="500" y="258" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9">&#x1F4E1; Ethernet PHY</text>
  <text x="500" y="274" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">Occupancy sensor</text>

  <rect x="580" y="208" width="100" height="75" rx="6" fill="#0d2a1d" stroke="#00d4ff" stroke-width="1"/>
  <text x="630" y="228" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">PoE Luminaire</text>
  <text x="630" y="244" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="9">DC-DC Driver</text>
  <text x="630" y="258" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9">&#x1F4E1; Ethernet PHY</text>
  <text x="630" y="274" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">Daylight sensor</text>

  <rect x="710" y="208" width="45" height="75" rx="6" fill="#0d2a1d" stroke="#00d4ff" stroke-width="1"/>
  <text x="732" y="228" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" font-weight="bold">PoE</text>
  <text x="732" y="244" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="8">Driver</text>
  <text x="732" y="258" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="8">PHY</text>
  <text x="732" y="274" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="8">Sensor</text>

  <!-- Data &amp; Control - PoE -->
  <rect x="445" y="310" width="300" height="70" rx="6" fill="#0d2a1d" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4"/>
  <text x="595" y="332" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold" filter="url(#glow)">Unified Data &amp; Control (IP-based)</text>
  <text x="595" y="350" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10">BMS / Cloud / AI Analytics via Ethernet</text>
  <text x="595" y="368" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">Energy &#x2022; Occupancy &#x2022; Faults &#x2022; OTA updates</text>

  <!-- PoE Cost -->
  <rect x="445" y="395" width="300" height="40" rx="6" fill="#0d2a1d" stroke="#00d4ff" stroke-width="0.5"/>
  <text x="595" y="417" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11">One Cat6a cable = Power + Data + Control</text>

  <!-- Bottom comparison bar -->
  <rect x="60" y="465" width="300" height="26" rx="4" fill="#1a1520"/>
  <text x="210" y="482" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">&#x274C; 3 systems, 2 wiring teams, 1 electrician</text>

  <rect x="440" y="465" width="300" height="26" rx="4" fill="#0d2a1d"/>
  <text x="590" y="482" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11">&#x2705; 1 system, 1 IT team, 0 electrician</text>
</svg>