<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d4a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="520" fill="#0a1628"/>
  <rect width="800" height="520" fill="url(#grid2)"/>
  
  <!-- terminal window -->
  <rect x="50" y="30" width="700" height="460" rx="8" fill="#0d1d33" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="50" y="30" width="700" height="32" rx="8" fill="#132945"/>
  <circle cx="74" cy="46" r="6" fill="#ff5f57"/>
  <circle cx="94" cy="46" r="6" fill="#febc2e"/>
  <circle cx="114" cy="46" r="6" fill="#28c840"/>
  <text x="400" y="50" font-family="monospace" font-size="13" fill="#8aa4c8" text-anchor="middle">D4i_GEN2_vs_TRADITIONAL_DALI.compare</text>
  
  <!-- title -->
  <text x="400" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#e8f4ff" text-anchor="middle">D4i Gen 2 不只是高级版 DALI</text>
  <text x="400" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7a9bc4" text-anchor="middle">从"调光协议"升级为"带通信和感知能力的智能电源"</text>
  
  <!-- table header -->
  <rect x="90" y="150" width="200" height="44" rx="4" fill="#1a3658" stroke="#2a4a73" stroke-width="1"/>
  <text x="190" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8f4ff" text-anchor="middle">能力维度</text>
  <rect x="300" y="150" width="185" height="44" rx="4" fill="#1a3658" stroke="#2a4a73" stroke-width="1"/>
  <text x="392" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#b8d4f0" text-anchor="middle">传统 DALI</text>
  <rect x="495" y="150" width="215" height="44" rx="4" fill="#0a2e26" stroke="#00d4aa" stroke-width="1" filter="url(#glow2)"/>
  <text x="602" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#7efce0" text-anchor="middle">D4i Gen 2</text>
  
  <!-- rows -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <rect x="90" y="202" width="200" height="40" rx="3" fill="#0f2138"/>
    <text x="105" y="227" fill="#b8d4f0">数字调光</text>
    <rect x="300" y="202" width="185" height="40" rx="3" fill="#0f2138"/>
    <text x="392" y="227" fill="#8aa4c8" text-anchor="middle">支持</text>
    <rect x="495" y="202" width="215" height="40" rx="3" fill="#0f2138" stroke="#00d4aa" stroke-width="0.5"/>
    <text x="602" y="227" fill="#7efce0" text-anchor="middle">支持</text>
    
    <rect x="90" y="248" width="200" height="40" rx="3" fill="#0f2138"/>
    <text x="105" y="273" fill="#b8d4f0">单灯寻址</text>
    <rect x="300" y="248" width="185" height="40" rx="3" fill="#0f2138"/>
    <text x="392" y="273" fill="#8aa4c8" text-anchor="middle">支持</text>
    <rect x="495" y="248" width="215" height="40" rx="3" fill="#0f2138" stroke="#00d4aa" stroke-width="0.5"/>
    <text x="602" y="273" fill="#7efce0" text-anchor="middle">支持</text>
    
    <rect x="90" y="294" width="200" height="40" rx="3" fill="#0f2138"/>
    <text x="105" y="319" fill="#b8d4f0">能耗计量</text>
    <rect x="300" y="294" width="185" height="40" rx="3" fill="#0f2138"/>
    <text x="392" y="319" fill="#d85a5a" text-anchor="middle">不支持</text>
    <rect x="495" y="294" width="215" height="40" rx="3" fill="#0f2138" stroke="#00d4aa" stroke-width="0.5"/>
    <text x="602" y="319" fill="#7efce0" text-anchor="middle">强制支持</text>
    
    <rect x="90" y="340" width="200" height="40" rx="3" fill="#0f2138"/>
    <text x="105" y="365" fill="#b8d4f0">故障诊断上报</text>
    <rect x="300" y="340" width="185" height="40" rx="3" fill="#0f2138"/>
    <text x="392" y="365" fill="#d8a55a" text-anchor="middle">有限</text>
    <rect x="495" y="340" width="215" height="40" rx="3" fill="#0f2138" stroke="#00d4aa" stroke-width="0.5"/>
    <text x="602" y="365" fill="#7efce0" text-anchor="middle">完整支持</text>
    
    <rect x="90" y="386" width="200" height="40" rx="3" fill="#0f2138"/>
    <text x="105" y="411" fill="#b8d4f0">传感器辅助供电</text>
    <rect x="300" y="386" width="185" height="40" rx="3" fill="#0f2138"/>
    <text x="392" y="411" fill="#d85a5a" text-anchor="middle">不支持</text>
    <rect x="495" y="386" width="215" height="40" rx="3" fill="#0f2138" stroke="#00d4aa" stroke-width="0.5"/>
    <text x="602" y="411" fill="#7efce0" text-anchor="middle">支持</text>
    
    <rect x="90" y="432" width="200" height="40" rx="3" fill="#0f2138"/>
    <text x="105" y="457" fill="#b8d4f0">独立安装/可插拔端子</text>
    <rect x="300" y="432" width="185" height="40" rx="3" fill="#0f2138"/>
    <text x="392" y="457" fill="#d8a55a" text-anchor="middle">非强制</text>
    <rect x="495" y="432" width="215" height="40" rx="3" fill="#0f2138" stroke="#00d4aa" stroke-width="0.5"/>
    <text x="602" y="457" fill="#7efce0" text-anchor="middle">强制要求</text>
  </g>
</svg>