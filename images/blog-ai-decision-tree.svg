<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gradHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2478C2"/><stop offset="100%" stop-color="#7ec27e"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2478C2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7ec27e"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#0a1628"/>
  <rect width="800" height="520" fill="url(#grid)"/>

  <text x="400" y="35" text-anchor="middle" fill="url(#gradHeader)" font-family="'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" filter="url(#glow)">2026年AI智能照明选购决策流程</text>
  <line x1="80" y1="48" x2="720" y2="48" stroke="#2478C2" stroke-width="1" opacity="0.5"/>

  <!-- Start node -->
  <rect x="310" y="65" width="180" height="40" rx="20" fill="#1a3a5a" stroke="#2478C2" stroke-width="1.5"/>
  <text x="400" y="90" text-anchor="middle" fill="#fff" font-family="'Microsoft YaHei', sans-serif" font-size="12">装修/改造智能照明</text>

  <!-- Q1: Budget -->
  <line x1="400" y1="105" x2="400" y2="125" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <polygon points="390,115 400,125 410,115" fill="#7ec27e"/>

  <rect x="270" y="125" width="260" height="36" rx="6" fill="#0d1f35" stroke="#7ec27e" stroke-width="0.8"/>
  <text x="400" y="148" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="11">Q1: 预算是否充足？(&gt;2000元/房间)</text>

  <!-- Branch: Low budget -->
  <line x1="270" y1="143" x2="100" y2="190" stroke="#5a7a9a" stroke-width="1"/>
  <text x="165" y="163" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="8">预算有限</text>

  <rect x="28" y="190" width="160" height="55" rx="6" fill="#0d1f35" stroke="#5a7a9a" stroke-width="0.8"/>
  <text x="108" y="210" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="10">先做基础Zigbee</text>
  <text x="108" y="228" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="7">网关+双色温灯+红外传感器</text>
  <text x="108" y="240" text-anchor="middle" fill="#2478C2" font-family="monospace" font-size="7">≈800元起  |  后续可升级AI</text>

  <!-- Branch: High budget -->
  <line x1="530" y1="143" x2="700" y2="190" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="630" y="163" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="8">预算充足</text>

  <rect x="612" y="190" width="160" height="70" rx="6" fill="#0d1f35" stroke="#2478C2" stroke-width="1"/>
  <text x="692" y="210" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="10">一步到位AI方案</text>
  <text x="692" y="225" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="7">有线网关+毫米波雷达</text>
  <text x="692" y="240" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="7">+双色温全屋灯具</text>
  <text x="692" y="255" text-anchor="middle" fill="#2478C2" font-family="monospace" font-size="7">≈2000元/房间</text>

  <!-- Q2: Priority -->
  <line x1="692" y1="260" x2="692" y2="285" stroke="#2478C2" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="560" y="285" width="240" height="36" rx="6" fill="#0d1f35" stroke="#7ec27e" stroke-width="0.8"/>
  <text x="680" y="308" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="11">Q2: 最看重什么能力？</text>

  <!-- Sub branches -->
  <line x1="590" y1="303" x2="480" y2="355" stroke="#5a7a9a" stroke-width="1"/>
  <text x="520" y="330" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="8">健康节律</text>

  <rect x="390" y="355" width="180" height="50" rx="6" fill="#0d1f35" stroke="#7ec27e" stroke-width="0.8"/>
  <text x="480" y="373" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="10">HCL人因照明方案</text>
  <text x="480" y="392" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="7">双色温驱动 + HCL网关</text>

  <line x1="680" y1="303" x2="680" y2="355" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="700" y="330" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="8">自动化</text>

  <rect x="590" y="355" width="180" height="50" rx="6" fill="#0d1f35" stroke="#7ec27e" stroke-width="1"/>
  <text x="680" y="373" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="10">AI自适应控制方案</text>
  <text x="680" y="392" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="7">毫米波雷达 + AI学习引擎</text>

  <line x1="770" y1="303" x2="740" y2="370" stroke="#5a7a9a" stroke-width="1"/>

  <!-- Q3: Ecosystem -->
  <rect x="100" y="270" width="260" height="36" rx="6" fill="#0d1f35" stroke="#2478C2" stroke-width="0.8"/>
  <text x="230" y="293" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="11">Q3: 用什么智能家居生态？</text>

  <line x1="230" y1="306" x2="130" y2="355" stroke="#5a7a9a" stroke-width="1"/>
  <text x="165" y="330" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="7">Apple</text>

  <rect x="55" y="355" width="150" height="35" rx="6" fill="#0d1f35" stroke="#5a7a9a" stroke-width="0.8"/>
  <text x="130" y="377" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="10">Matter认证灯具</text>

  <line x1="230" y1="306" x2="230" y2="355" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="250" y="330" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="8">涂鸦/米家</text>

  <rect x="155" y="355" width="150" height="35" rx="6" fill="#0d1f35" stroke="#7ec27e" stroke-width="1"/>
  <text x="230" y="377" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="10">Zigbee双色温方案</text>

  <line x1="230" y1="306" x2="330" y2="355" stroke="#5a7a9a" stroke-width="1"/>
  <text x="295" y="330" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="7">华为</text>

  <rect x="255" y="355" width="150" height="35" rx="6" fill="#0d1f35" stroke="#5a7a9a" stroke-width="0.8"/>
  <text x="330" y="377" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="10">鸿蒙生态灯具</text>

  <!-- Bottom: Final advice -->
  <rect x="60" y="430" width="680" height="65" rx="8" fill="#0d1f35" stroke="#2478C2" stroke-width="0.8"/>
  <text x="400" y="452" text-anchor="middle" fill="#7ec27e" font-family="'Microsoft YaHei', sans-serif" font-size="12" filter="url(#glow)">核心原则：协议 &gt; 生态 &gt; AI功能 &gt; 品牌</text>
  <text x="400" y="472" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="9">选 Zigbee 3.0 标准协议设备  |  有线网关  |  双色温驱动  |  传感器预留86底盒</text>
  <text x="400" y="488" text-anchor="middle" fill="#5a7a9a" font-family="monospace" font-size="8">先跑通HCL 再上AI  |  不被生态锁定  |  不买"AI"标签溢价产品</text>
</svg>