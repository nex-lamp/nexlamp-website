<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/><stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg2)"/>
  <g stroke="#12294a" stroke-width="1">
    <path d="M0 120H1080M0 400H1080M0 700H1080M0 1000H1080M0 1300H1080"/>
    <path d="M180 0V1440M360 0V1440M540 0V1440M720 0V1440M900 0V1440"/>
  </g>
  <text x="540" y="110" text-anchor="middle" fill="#7ec8ff" font-size="58" font-weight="bold">按场景选，一句话够用</text>
  <text x="540" y="165" text-anchor="middle" fill="#5a7ba6" font-size="28">先定系统 → 再定品牌 → 最后定型号</text>

  <!-- Scene 1 -->
  <rect x="70" y="220" width="940" height="250" rx="20" fill="#0d1b30" stroke="#3a5a86" stroke-width="2"/>
  <text x="110" y="285" fill="#7ec8ff" font-size="32" font-weight="bold">场景一 · 单独一盏灯，不参与联动</text>
  <text x="110" y="340" fill="#c8d6ea" font-size="26">次卧、储物间这类"亮就行"的位置</text>
  <rect x="740" y="255" width="230" height="66" rx="14" fill="#132741" stroke="#7ec8ff" stroke-width="2"/>
  <text x="855" y="298" text-anchor="middle" fill="#7ec8ff" font-size="30" font-weight="bold">选 WiFi 版</text>
  <text x="110" y="400" fill="#5a7ba6" font-size="24">省一个网关钱，不必为 Mesh 付溢价</text>

  <!-- Scene 2 -->
  <rect x="70" y="500" width="940" height="250" rx="20" fill="#0d1b30" stroke="#3fd08a" stroke-width="2"/>
  <text x="110" y="565" fill="#6fe3ab" font-size="32" font-weight="bold">场景二 · 要做全屋智能</text>
  <text x="110" y="620" fill="#c8d6ea" font-size="26">灯光要参与自动化、要被断电再恢复</text>
  <rect x="640" y="535" width="330" height="66" rx="14" fill="#132741" stroke="#3fd08a" stroke-width="2" filter="url(#glow2)"/>
  <text x="805" y="578" text-anchor="middle" fill="#6fe3ab" font-size="30" font-weight="bold">蓝牙 Mesh 2.0 + 中枢网关</text>
  <text x="110" y="680" fill="#5a7ba6" font-size="24">1.0 不能靠固件升到 2.0，只能换硬件——装吊顶前认准 2.0</text>

  <!-- Scene 3 -->
  <rect x="70" y="780" width="940" height="250" rx="20" fill="#0d1b30" stroke="#e0a855" stroke-width="2"/>
  <text x="110" y="845" fill="#ffcc7a" font-size="32" font-weight="bold">场景三 · 警惕"Pro 网关墙"</text>
  <text x="110" y="900" fill="#c8d6ea" font-size="26">同品牌部分款式要用专用网关，不接通用 Mesh 生态</text>
  <rect x="110" y="930" width="860" height="70" rx="14" fill="#132741" stroke="#e0a855"/>
  <text x="540" y="975" text-anchor="middle" fill="#ffcc7a" font-size="26">下单只问一句："这只灯用什么网关？"答不上"蓝牙 Mesh 2.0"＝专用线</text>

  <!-- Bottom banner -->
  <rect x="70" y="1080" width="940" height="220" rx="20" fill="#0a1424" stroke="#3a5a86"/>
  <text x="540" y="1140" text-anchor="middle" fill="#7ec8ff" font-size="30" font-weight="bold">反着来的基本要返工</text>
  <text x="540" y="1200" text-anchor="middle" fill="#c8d6ea" font-size="26">灯本身看的是光：显色 · 防眩 · 色温</text>
  <text x="540" y="1252" text-anchor="middle" fill="#c8d6ea" font-size="26">它聪不聪明，看的是协议那一栏</text>
</svg>
