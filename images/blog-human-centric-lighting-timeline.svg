<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b9bd5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7ec8e3" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7043" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e64a19" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b9bd5"/>
      <stop offset="0.3" stop-color="#7ec8e3"/>
      <stop offset="0.6" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#ff7043"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="400" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1a2a4a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="170" y1="0" x2="170" y2="400"/>
    <line x1="340" y1="0" x2="340" y2="400"/>
    <line x1="510" y1="0" x2="510" y2="400"/>
  </g>

  <!-- Title -->
  <text x="340" y="40" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="18" font-weight="bold">一日四时 · 人因照明色温节律</text>

  <!-- Timeline curve -->
  <path d="M60,320 Q170,200 280,180 Q340,170 340,120 Q340,170 400,180 Q510,200 620,320" stroke="url(#lineGrad)" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Glow dots on curve -->
  <circle cx="110" cy="270" r="5" fill="#5b9bd5" filter="url(#blur2)"/>
  <circle cx="225" cy="205" r="5" fill="#7ec8e3" filter="url(#blur2)"/>
  <circle cx="340" cy="120" r="7" fill="#ffffff" filter="url(#blur1)" opacity="0.6"/>
  <circle cx="455" cy="205" r="5" fill="#ffe082" filter="url(#blur2)"/>
  <circle cx="570" cy="270" r="5" fill="#ff7043" filter="url(#blur2)"/>

  <!-- Phase 1: Morning 6-8AM -->
  <rect x="30" y="270" width="140" height="70" rx="6" fill="#0d1f3c" stroke="#5b9bd5" stroke-width="1" opacity="0.9"/>
  <text x="100" y="292" text-anchor="middle" fill="#5b9bd5" font-family="monospace" font-size="11" font-weight="bold">🌅 06:00-08:00</text>
  <text x="100" y="308" text-anchor="middle" fill="#b0c8e0" font-family="monospace" font-size="12">5000-6500K 冷白</text>
  <text x="100" y="324" text-anchor="middle" fill="#6688aa" font-family="monospace" font-size="10">高蓝光 · 唤醒身体</text>

  <!-- Phase 2: Day 9-16 -->
  <rect x="190" y="180" width="140" height="70" rx="6" fill="#0d1f3c" stroke="#7ec8e3" stroke-width="1" opacity="0.9"/>
  <text x="260" y="202" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="11" font-weight="bold">☀ 09:00-16:00</text>
  <text x="260" y="218" text-anchor="middle" fill="#b0c8e0" font-family="monospace" font-size="12">4000-5000K 自然白</text>
  <text x="260" y="234" text-anchor="middle" fill="#6688aa" font-family="monospace" font-size="10">维持警觉 · 高效工作</text>

  <!-- Phase 3: Evening 17-19 -->
  <rect x="380" y="180" width="140" height="70" rx="6" fill="#0d1f3c" stroke="#ffe082" stroke-width="1" opacity="0.9"/>
  <text x="450" y="202" text-anchor="middle" fill="#ffe082" font-family="monospace" font-size="11" font-weight="bold">🌄 17:00-19:00</text>
  <text x="450" y="218" text-anchor="middle" fill="#b0c8e0" font-family="monospace" font-size="12">3000-4000K 暖白</text>
  <text x="450" y="234" text-anchor="middle" fill="#6688aa" font-family="monospace" font-size="10">降低蓝光 · 过渡准备</text>

  <!-- Phase 4: Night 20-22 -->
  <rect x="510" y="270" width="140" height="70" rx="6" fill="#0d1f3c" stroke="#ff7043" stroke-width="1" opacity="0.9"/>
  <text x="580" y="292" text-anchor="middle" fill="#ff7043" font-family="monospace" font-size="11" font-weight="bold">🌙 20:00-22:00</text>
  <text x="580" y="308" text-anchor="middle" fill="#b0c8e0" font-family="monospace" font-size="12">2200-2700K 暖黄</text>
  <text x="580" y="324" text-anchor="middle" fill="#6688aa" font-family="monospace" font-size="10">最低蓝光 · 促褪黑素</text>

  <!-- Bottom note -->
  <text x="340" y="390" text-anchor="middle" fill="#445566" font-family="monospace" font-size="10">▲ 不能只调亮度不调色温 — 5000K 再暗也抑制褪黑素</text>
</svg>