<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00aa55"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc66ff"/>
      <stop offset="100%" stop-color="#6633cc"/>
    </linearGradient>
  </defs>
  <rect width="680" height="480" fill="#0a1628"/>
  <rect width="680" height="480" fill="url(#grid)" opacity="0.5"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="680" height="36" fill="#0d1f3c" rx="0"/>
  <circle cx="16" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="32" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="48" cy="18" r="5" fill="#27c93f"/>
  <text x="340" y="23" text-anchor="middle" fill="#8899aa" font-family="Consolas,monospace" font-size="11">智能家居协议选择决策树</text>

  <!-- Start Node -->
  <rect x="265" y="55" width="150" height="36" rx="18" fill="url(#gBlue)" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
  <text x="340" y="78" text-anchor="middle" fill="#00d4ff" font-family="sans-serif" font-size="13" font-weight="bold">开始选择协议</text>

  <!-- Arrow Start -> Q1 -->
  <line x1="340" y1="91" x2="340" y2="110" stroke="#00d4ff" stroke-width="1.5"/>
  <polygon points="335,108 340,118 345,108" fill="#00d4ff"/>

  <!-- Q1 -->
  <polygon points="340,118 470,150 340,182 210,150" fill="#0d1f3c" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="340" y="145" text-anchor="middle" fill="#00d4ff" font-family="sans-serif" font-size="11">设备数量?</text>
  <text x="340" y="162" text-anchor="middle" fill="#6688aa" font-family="sans-serif" font-size="9">&gt;10个</text>

  <!-- Left Arrow: <=5 -->
  <line x1="210" y1="150" x2="120" y2="150" stroke="#00ff88" stroke-width="1.5"/>
  <text x="160" y="143" text-anchor="middle" fill="#00ff88" font-family="sans-serif" font-size="9">&lt;=5个</text>

  <!-- WiFi Box -->
  <rect x="60" y="135" width="100" height="30" rx="8" fill="url(#gGreen)" opacity="0.15" stroke="#00ff88" stroke-width="1"/>
  <text x="110" y="154" text-anchor="middle" fill="#00ff88" font-family="sans-serif" font-size="12" font-weight="bold">WiFi 直连</text>
  <text x="110" y="180" text-anchor="middle" fill="#6688aa" font-family="sans-serif" font-size="8">无需网关</text>

  <!-- Right Arrow: >10 -->
  <line x1="470" y1="150" x2="530" y2="150" stroke="#ff9900" stroke-width="1.5"/>
  <text x="500" y="143" text-anchor="middle" fill="#ff9900" font-family="sans-serif" font-size="9">&gt;10个</text>

  <!-- Q2 户型 -->
  <polygon points="530,150 620,180 620,210 530,240 440,210 440,180" fill="#0d1f3c" stroke="#ff9900" stroke-width="1.5"/>
  <text x="530" y="190" text-anchor="middle" fill="#ff9900" font-family="sans-serif" font-size="11">户型大小?</text>
  <text x="530" y="208" text-anchor="middle" fill="#6688aa" font-family="sans-serif" font-size="9">80-120㎡</text>

  <!-- Q3 预算 -->
  <line x1="530" y1="240" x2="530" y2="275" stroke="#ff9900" stroke-width="1.5"/>
  <polygon points="530,275 620,305 620,335 530,365 440,335 440,305" fill="#0d1f3c" stroke="#cc66ff" stroke-width="1.5"/>
  <text x="530" y="316" text-anchor="middle" fill="#cc66ff" font-family="sans-serif" font-size="11">预算+是否尝鲜?</text>
  <text x="530" y="334" text-anchor="middle" fill="#6688aa" font-family="sans-serif" font-size="9">性价比优先</text>

  <!-- Left: Zigbee -->
  <line x1="440" y1="320" x2="340" y2="320" stroke="#ff9900" stroke-width="1.5"/>
  <text x="390" y="313" text-anchor="middle" fill="#ff9900" font-family="sans-serif" font-size="9">性价比</text>
  <rect x="265" y="305" width="120" height="30" rx="8" fill="url(#gOrange)" opacity="0.15" stroke="#ff9900" stroke-width="1"/>
  <text x="325" y="324" text-anchor="middle" fill="#ff9900" font-family="sans-serif" font-size="12" font-weight="bold">Zigbee 3.0</text>
  <text x="325" y="350" text-anchor="middle" fill="#6688aa" font-family="sans-serif" font-size="8">全屋智能首选</text>

  <!-- Right: Matter -->
  <text x="590" y="313" text-anchor="middle" fill="#cc66ff" font-family="sans-serif" font-size="9">尝鲜派</text>
  <rect x="545" y="305" width="120" height="30" rx="8" fill="url(#gPurple)" opacity="0.15" stroke="#cc66ff" stroke-width="1"/>
  <text x="605" y="324" text-anchor="middle" fill="#cc66ff" font-family="sans-serif" font-size="12" font-weight="bold">Matter+Thread</text>
  <text x="605" y="350" text-anchor="middle" fill="#6688aa" font-family="sans-serif" font-size="8">未来兼容性</text>

  <!-- Bottom section: Protocol comparison -->
  <rect x="20" y="390" width="640" height="75" rx="8" fill="#0d1f3c" opacity="0.8" stroke="#1a2a4a" stroke-width="1"/>
  <text x="340" y="412" text-anchor="middle" fill="#6688aa" font-family="sans-serif" font-size="10">协议能力对比</text>
  <!-- Mini bars -->
  <text x="40" y="436" fill="#00d4ff" font-family="sans-serif" font-size="8">Zigbee</text>
  <rect x="90" y="428" width="100" height="8" rx="2" fill="#00d4ff" opacity="0.6"/>
  <text x="200" y="436" fill="#00ff88" font-family="sans-serif" font-size="8">WiFi</text>
  <rect x="230" y="428" width="60" height="8" rx="2" fill="#00ff88" opacity="0.6"/>
  <text x="300" y="436" fill="#ff9900" font-family="sans-serif" font-size="8">蓝牙Mesh</text>
  <rect x="360" y="428" width="75" height="8" rx="2" fill="#ff9900" opacity="0.6"/>
  <text x="445" y="436" fill="#cc66ff" font-family="sans-serif" font-size="8">Matter</text>
  <rect x="490" y="428" width="55" height="8" rx="2" fill="#cc66ff" opacity="0.6"/>
  <text x="565" y="436" fill="#6688aa" font-family="sans-serif" font-size="8">设备数量承载能力 →</text>
</svg>