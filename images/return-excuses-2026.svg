<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="640" fill="url(#bg1)"/>
  <g stroke="#12305a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="1080" y2="80"/><line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/><line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/><line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="560" x2="1080" y2="560"/>
    <line x1="135" y1="0" x2="135" y2="640"/><line x1="270" y1="0" x2="270" y2="640"/>
    <line x1="405" y1="0" x2="405" y2="640"/><line x1="540" y1="0" x2="540" y2="640"/>
    <line x1="675" y1="0" x2="675" y2="640"/><line x1="810" y1="0" x2="810" y2="640"/>
    <line x1="945" y1="0" x2="945" y2="640"/>
  </g>
  <text x="540" y="56" text-anchor="middle" font-size="30" font-weight="bold" fill="#e8f1ff">商家三句拒退话术 × 法律真实边界</text>
  <text x="540" y="84" text-anchor="middle" font-size="15" fill="#7aa5d8">质量问题退货 ≠ 七日无理由退货 · 两套规则别混着听</text>

  <!-- 卡片1 -->
  <g>
    <rect x="40" y="120" width="320" height="240" rx="14" fill="#101f38" stroke="#f87171" stroke-width="1.5"/>
    <text x="200" y="158" text-anchor="middle" font-size="18" fill="#f87171" font-weight="bold">"安装后不支持退"</text>
    <line x1="70" y1="176" x2="330" y2="176" stroke="#f87171" stroke-width="1" opacity="0.4"/>
    <text x="200" y="212" text-anchor="middle" font-size="14" fill="#9db8dd">把质量问题</text>
    <text x="200" y="236" text-anchor="middle" font-size="14" fill="#9db8dd">捆进"无理由退货"的限制里说</text>
    <rect x="60" y="262" width="280" height="80" rx="8" fill="#0c2b22" stroke="#34d399" stroke-width="1.2"/>
    <text x="200" y="290" text-anchor="middle" font-size="14" fill="#34d399" font-weight="bold">《消法》第24条：三包</text>
    <text x="200" y="316" text-anchor="middle" font-size="13" fill="#a7d9c0">不以七天为限 · 7日后仍可修/换/退</text>
  </g>

  <!-- 卡片2 -->
  <g>
    <rect x="380" y="120" width="320" height="240" rx="14" fill="#101f38" stroke="#f87171" stroke-width="1.5"/>
    <text x="540" y="158" text-anchor="middle" font-size="18" fill="#f87171" font-weight="bold">"已拆封不退"</text>
    <line x1="410" y1="176" x2="670" y2="176" stroke="#f87171" stroke-width="1" opacity="0.4"/>
    <text x="540" y="212" text-anchor="middle" font-size="14" fill="#9db8dd">开箱通电验货本身</text>
    <text x="540" y="236" text-anchor="middle" font-size="14" fill="#9db8dd">就是查验的一部分</text>
    <rect x="400" y="262" width="280" height="80" rx="8" fill="#0c2b22" stroke="#34d399" stroke-width="1.2"/>
    <text x="540" y="290" text-anchor="middle" font-size="14" fill="#34d399" font-weight="bold">中消协口径</text>
    <text x="540" y="316" text-anchor="middle" font-size="13" fill="#a7d9c0">查验开箱·合理调试 不影响"完好"</text>
  </g>

  <!-- 卡片3 -->
  <g>
    <rect x="720" y="120" width="320" height="240" rx="14" fill="#101f38" stroke="#f87171" stroke-width="1.5"/>
    <text x="880" y="158" text-anchor="middle" font-size="18" fill="#f87171" font-weight="bold">"超过七天不能退"</text>
    <line x1="750" y1="176" x2="1010" y2="176" stroke="#f87171" stroke-width="1" opacity="0.4"/>
    <text x="880" y="212" text-anchor="middle" font-size="14" fill="#9db8dd">七天管的是</text>
    <text x="880" y="236" text-anchor="middle" font-size="14" fill="#9db8dd">"没有理由"的退货</text>
    <rect x="740" y="262" width="280" height="80" rx="8" fill="#0c2b22" stroke="#34d399" stroke-width="1.2"/>
    <text x="880" y="290" text-anchor="middle" font-size="14" fill="#34d399" font-weight="bold">质量问题适用三包</text>
    <text x="880" y="316" text-anchor="middle" font-size="13" fill="#a7d9c0">无法正常使用 依法仍可解除合同退货</text>
  </g>

  <!-- 底部硬牌 -->
  <rect x="120" y="400" width="840" height="180" rx="14" fill="#0e1830" stroke="#38bdf8" stroke-width="2" filter="url(#glow1)"/>
  <text x="540" y="446" text-anchor="middle" font-size="17" fill="#38bdf8" font-weight="bold">最硬的一张牌 ·《消法》第23条第3款</text>
  <text x="540" y="486" text-anchor="middle" font-size="16" fill="#e8f1ff">机动车、计算机、电视机、空调器、洗衣机等耐用商品</text>
  <text x="540" y="514" text-anchor="middle" font-size="16" fill="#e8f1ff">六个月内发现瑕疵发生争议 → 由经营者承担举证责任</text>
  <text x="540" y="552" text-anchor="middle" font-size="14" fill="#7aa5d8">不需要你证明"出厂就有毛病"——商家得证明自己没问题</text>
</svg>
