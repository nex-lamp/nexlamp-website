<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="500" fill="url(#bg2)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/><line x1="0" y1="480" x2="680" y2="480"/>
    <line x1="85" y1="0" x2="85" y2="500"/><line x1="170" y1="0" x2="170" y2="500"/>
    <line x1="255" y1="0" x2="255" y2="500"/><line x1="340" y1="0" x2="340" y2="500"/>
    <line x1="425" y1="0" x2="425" y2="500"/><line x1="510" y1="0" x2="510" y2="500"/>
    <line x1="595" y1="0" x2="595" y2="500"/>
  </g>
  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="23" font-weight="bold" filter="url(#glow2)">人感灯翻车 · 6 个真实坑</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <!-- 坑1 -->
  <rect x="34" y="66" width="300" height="112" rx="10" fill="#12233f" stroke="#5cc8e8" stroke-width="1.5"/>
  <rect x="50" y="82" width="58" height="26" rx="6" fill="#5cc8e8" opacity="0.15"/>
  <text x="79" y="100" fill="#5cc8e8" font-family="sans-serif" font-size="12.5" text-anchor="middle">坑 1</text>
  <text x="118" y="100" fill="#e8f4e8" font-family="sans-serif" font-size="15.5" font-weight="bold">人没走，灯先灭</text>
  <text x="50" y="128" fill="#9db8d9" font-family="sans-serif" font-size="12">沙发靠背高过 1.2m、吊顶金属</text>
  <text x="50" y="147" fill="#9db8d9" font-family="sans-serif" font-size="12">支架反射、空调气流 = 探测盲区</text>
  <text x="50" y="168" fill="#f0c674" font-family="sans-serif" font-size="12.5" font-weight="bold">单传感器有效率仅约 68%</text>

  <!-- 坑2 -->
  <rect x="346" y="66" width="300" height="112" rx="10" fill="#12233f" stroke="#5cc8e8" stroke-width="1.5"/>
  <rect x="362" y="82" width="58" height="26" rx="6" fill="#5cc8e8" opacity="0.15"/>
  <text x="391" y="100" fill="#5cc8e8" font-family="sans-serif" font-size="12.5" text-anchor="middle">坑 2</text>
  <text x="430" y="100" fill="#e8f4e8" font-family="sans-serif" font-size="15.5" font-weight="bold">人走了，灯还亮着</text>
  <text x="362" y="128" fill="#9db8d9" font-family="sans-serif" font-size="12">换气扇微动、浴室流水、宠物走动</text>
  <text x="362" y="147" fill="#9db8d9" font-family="sans-serif" font-size="12">被存在式雷达判成"有人"</text>
  <text x="362" y="168" fill="#f0c674" font-family="sans-serif" font-size="12.5" font-weight="bold">是物理局限，不是故障</text>

  <!-- 坑3 -->
  <rect x="34" y="188" width="300" height="112" rx="10" fill="#12233f" stroke="#e06666" stroke-width="1.5"/>
  <rect x="50" y="204" width="58" height="26" rx="6" fill="#e06666" opacity="0.15"/>
  <text x="79" y="222" fill="#e06666" font-family="sans-serif" font-size="12.5" text-anchor="middle">坑 3</text>
  <text x="118" y="222" fill="#e8f4e8" font-family="sans-serif" font-size="15.5" font-weight="bold">半夜自己亮</text>
  <text x="50" y="250" fill="#9db8d9" font-family="sans-serif" font-size="12">微波对墙体玻璃有穿透性，门口</text>
  <text x="50" y="269" fill="#9db8d9" font-family="sans-serif" font-size="12">脚步、窗外车灯都可能被算进来</text>
  <text x="50" y="290" fill="#f0c674" font-family="sans-serif" font-size="12.5" font-weight="bold">先确认探测范围是否越界</text>

  <!-- 坑4 -->
  <rect x="346" y="188" width="300" height="112" rx="10" fill="#12233f" stroke="#e06666" stroke-width="1.5"/>
  <rect x="362" y="204" width="58" height="26" rx="6" fill="#e06666" opacity="0.15"/>
  <text x="391" y="222" fill="#e06666" font-family="sans-serif" font-size="12.5" text-anchor="middle">坑 4</text>
  <text x="430" y="222" fill="#e8f4e8" font-family="sans-serif" font-size="15.5" font-weight="bold">灵敏度与延时打架</text>
  <text x="362" y="250" fill="#9db8d9" font-family="sans-serif" font-size="12">调高就频繁误亮，调低该亮不亮</text>
  <text x="362" y="269" fill="#9db8d9" font-family="sans-serif" font-size="12">因为顺序调反了：先定延时必翻车</text>
  <text x="362" y="290" fill="#f0c674" font-family="sans-serif" font-size="12.5" font-weight="bold">顺序：先压灵敏度，再定延时</text>

  <!-- 坑5 -->
  <rect x="34" y="310" width="300" height="112" rx="10" fill="#12233f" stroke="#c9a0ff" stroke-width="1.5"/>
  <rect x="50" y="326" width="58" height="26" rx="6" fill="#c9a0ff" opacity="0.15"/>
  <text x="79" y="344" fill="#c9a0ff" font-family="sans-serif" font-size="12.5" text-anchor="middle">坑 5</text>
  <text x="118" y="344" fill="#e8f4e8" font-family="sans-serif" font-size="15.5" font-weight="bold">联动逻辑被绑架</text>
  <text x="50" y="372" fill="#9db8d9" font-family="sans-serif" font-size="12">关掉人感上报 → 自动化失效</text>
  <text x="50" y="391" fill="#9db8d9" font-family="sans-serif" font-size="12">开着 → "有人一定开灯，关都关不掉"</text>
  <text x="50" y="412" fill="#f0c674" font-family="sans-serif" font-size="12.5" font-weight="bold">让传感器只上报，自动化自己写</text>

  <!-- 坑6 -->
  <rect x="346" y="310" width="300" height="112" rx="10" fill="#12233f" stroke="#c9a0ff" stroke-width="1.5"/>
  <rect x="362" y="326" width="58" height="26" rx="6" fill="#c9a0ff" opacity="0.15"/>
  <text x="391" y="344" fill="#c9a0ff" font-family="sans-serif" font-size="12.5" text-anchor="middle">坑 6</text>
  <text x="430" y="344" fill="#e8f4e8" font-family="sans-serif" font-size="15.5" font-weight="bold">夜间误亮打断睡眠</text>
  <text x="362" y="372" fill="#9db8d9" font-family="sans-serif" font-size="12">照度阈值贴着设（100/98lux）</text>
  <text x="362" y="391" fill="#9db8d9" font-family="sans-serif" font-size="12">云层一遮就反复启停、抖动不断</text>
  <text x="362" y="412" fill="#f0c674" font-family="sans-serif" font-size="12.5" font-weight="bold">开启 = 实测 ×1.2、关闭 ×0.8</text>

  <!-- bottom -->
  <rect x="34" y="436" width="612" height="50" rx="10" fill="#0d1c33" stroke="#7ec27e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="54" y="458" fill="#7ec27e" font-family="sans-serif" font-size="13.5" font-weight="bold">判断口诀：该亮不亮 → 找盲区；不该亮偏亮 → 降灵敏度；亮灭频繁 → 拉大阈值差</text>
  <text x="54" y="477" fill="#9db8d9" font-family="sans-serif" font-size="12.5">传感器彻底失效的典型表现是"怎么动都不亮"，那才是硬件坏了</text>
</svg>
