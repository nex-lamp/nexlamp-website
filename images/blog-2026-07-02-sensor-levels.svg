<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#162b4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1f38;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7ec27e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b8c5a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6bcf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9f43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#bgGrad)" />
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>
  <text x="400" y="45" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#ffffff">AI智能灯的传感器层级</text>
  <text x="400" y="75" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7ec27e">从\"能感应\"到\"能看懂\"，差距比想象中大</text>

  <!-- PIR Card -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="210" height="280" rx="12" fill="url(#cardGrad)" stroke="#ff9f43" stroke-width="2" />
    <circle cx="105" cy="55" r="32" fill="#ff9f43" opacity="0.15" />
    <path d="M90 45 L120 45 L120 75 L90 75 Z" fill="none" stroke="#ff9f43" stroke-width="3" />
    <path d="M105 45 L105 30 M105 75 L105 90 M90 60 L75 60 M120 60 L135 60" stroke="#ff9f43" stroke-width="2" />
    <text x="105" y="115" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="bold" fill="#ff9f43">红外 PIR</text>
    <text x="105" y="145" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff">检测热量变化</text>
    <text x="105" y="175" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a0c4ff">只能感知\"动没动\"</text>
    <text x="105" y="205" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a0c4ff">静止易误判</text>
    <text x="105" y="245" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#ff6b6b">伪智能重灾区</text>
  </g>

  <!-- Radar Card -->
  <g transform="translate(295,120)">
    <rect x="0" y="0" width="210" height="280" rx="12" fill="url(#cardGrad)" stroke="#4a9eff" stroke-width="2" filter="url(#glow)" />
    <circle cx="105" cy="55" r="32" fill="#4a9eff" opacity="0.15" />
    <circle cx="105" cy="55" r="18" fill="none" stroke="#4a9eff" stroke-width="2" />
    <circle cx="105" cy="55" r="28" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.6" />
    <path d="M105 20 L105 30 M105 80 L105 90 M70 55 L80 55 M130 55 L140 55" stroke="#4a9eff" stroke-width="2" />
    <text x="105" y="115" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="bold" fill="#4a9eff">毫米波雷达</text>
    <text x="105" y="145" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff">检测微动与存在</text>
    <text x="105" y="175" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a0c4ff">静坐也能识别</text>
    <text x="105" y="205" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a0c4ff">可判断位置/人数</text>
    <text x="105" y="245" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#7ec27e">当前最实用</text>
  </g>

  <!-- Ambient Card -->
  <g transform="translate(530,120)">
    <rect x="0" y="0" width="210" height="280" rx="12" fill="url(#cardGrad)" stroke="#7ec27e" stroke-width="2" />
    <circle cx="105" cy="55" r="32" fill="#7ec27e" opacity="0.15" />
    <circle cx="105" cy="55" r="16" fill="#7ec27e" opacity="0.8" />
    <path d="M105 25 L105 35 M105 75 L105 85 M75 55 L85 55 M125 55 L135 55" stroke="#7ec27e" stroke-width="2" />
    <text x="105" y="115" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="bold" fill="#7ec27e">环境光传感器</text>
    <text x="105" y="145" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ffffff">感知亮度与色温</text>
    <text x="105" y="175" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a0c4ff">自动跟随自然光</text>
    <text x="105" y="205" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#a0c4ff">节律照明基础</text>
    <text x="105" y="245" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#7ec27e">健康加分项</text>
  </g>

  <g transform="translate(60,430)">
    <rect x="0" y="0" width="680" height="60" rx="8" fill="#162b4d" stroke="#4a9eff" stroke-width="1" />
    <text x="340" y="25" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ffffff" font-weight="bold">关键结论</text>
    <text x="340" y="48" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a0c4ff">只有PIR的\"AI灯\"本质还是感应灯，雷达+环境光才是当前真智能的起步配置</text>
  </g>
</svg>