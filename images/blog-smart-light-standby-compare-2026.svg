<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="barZigbee" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2478C2"/>
      <stop offset="100%" stop-color="#4AA3E8"/>
    </linearGradient>
    <linearGradient id="barWiFi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E85D3A"/>
      <stop offset="100%" stop-color="#FF7B5A"/>
    </linearGradient>
    <linearGradient id="barBLE" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#58D68D"/>
    </linearGradient>
    <linearGradient id="barLowWiFi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1a2a45" stroke-width="0.5" opacity="0.5">
    <line x1="150" y1="50" x2="150" y2="440"/>
    <line x1="250" y1="50" x2="250" y2="440"/>
    <line x1="350" y1="50" x2="350" y2="440"/>
    <line x1="450" y1="50" x2="450" y2="440"/>
    <line x1="550" y1="50" x2="550" y2="440"/>
    <line x1="650" y1="50" x2="650" y2="440"/>
    <line x1="750" y1="50" x2="750" y2="440"/>
    <line x1="80" y1="100" x2="780" y2="100"/>
    <line x1="80" y1="170" x2="780" y2="170"/>
    <line x1="80" y1="240" x2="780" y2="240"/>
    <line x1="80" y1="310" x2="780" y2="310"/>
    <line x1="80" y1="380" x2="780" y2="380"/>
  </g>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#4AA3E8" font-family="Arial" font-size="20" font-weight="bold" filter="url(#glow)">智能灯待机功耗对比 · 不同协议差20倍</text>

  <!-- Y Axis Label -->
  <text x="30" y="270" text-anchor="middle" fill="#8899aa" font-family="Arial" font-size="12" transform="rotate(-90,30,270)">待机功耗 (W)  ← 越低越省电</text>

  <!-- Y Axis Lines &amp; Labels -->
  <g fill="#8899aa" font-family="Arial" font-size="11" text-anchor="end">
    <text x="75" y="384">0W</text>
    <text x="75" y="316">0.5W</text>
    <text x="75" y="248">1.0W</text>
    <text x="75" y="180">1.5W</text>
    <text x="75" y="112">2.0W</text>
  </g>

  <!-- GB 30255-2026 limit line -->
  <line x1="80" y1="178" x2="770" y2="178" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8"/>
  <text x="770" y="173" text-anchor="end" fill="#F39C12" font-family="Arial" font-size="11" font-weight="bold">GB 30255-2026 上限 1.5W</text>

  <!-- Bars -->
  <!-- Zigbee: 0.3W avg = height ~61px from 380 -->
  <rect x="120" y="319" width="80" height="61" rx="4" fill="url(#barZigbee)" opacity="0.9"/>
  <text x="160" y="312" text-anchor="middle" fill="#4AA3E8" font-family="Arial" font-size="13" font-weight="bold">0.3W</text>

  <!-- BLE Mesh: 0.4W avg = height ~82px -->
  <rect x="280" y="298" width="80" height="82" rx="4" fill="url(#barBLE)" opacity="0.9"/>
  <text x="320" y="291" text-anchor="middle" fill="#2ECC71" font-family="Arial" font-size="13" font-weight="bold">0.4W</text>

  <!-- WiFi (quality): 1.0W avg = height ~204px -->
  <rect x="440" y="176" width="80" height="204" rx="4" fill="url(#barWiFi)" opacity="0.9"/>
  <text x="480" y="169" text-anchor="middle" fill="#FF7B5A" font-family="Arial" font-size="13" font-weight="bold">1.0W</text>

  <!-- WiFi (low-cost): 3.0W -->
  <rect x="600" y="58" width="80" height="322" rx="4" fill="url(#barLowWiFi)" opacity="0.85"/>
  <text x="640" y="51" text-anchor="middle" fill="#E74C3C" font-family="Arial" font-size="13" font-weight="bold">3.0W</text>

  <!-- Bar Labels -->
  <g fill="#ccddee" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="160" y="410">Zigbee</text>
    <text x="320" y="410">蓝牙Mesh</text>
    <text x="480" y="410">Wi-Fi(优质)</text>
    <text x="640" y="410">Wi-Fi(低价)</text>
  </g>

  <!-- Footer with annual cost for 20 bulbs -->
  <g fill="#667788" font-family="Arial" font-size="11" text-anchor="middle">
    <text x="160" y="432">20灯≈ ¥21/年</text>
    <text x="320" y="432">20灯≈ ¥28/年</text>
    <text x="480" y="432">20灯≈ ¥84/年</text>
    <text x="640" y="432">20灯≈ ¥210/年</text>
  </g>

  <!-- Source -->
  <text x="780" y="490" text-anchor="end" fill="#445566" font-family="Arial" font-size="10">数据来源: IEA 4E Standby Power &amp; 多品牌实测</text>
</svg>