    <script>
    (function() {
      var archiveEl = document.getElementById('archive-list');
      if (!archiveEl) return;

      // Format date for display
      function formatDate(dateStr) {
        var d = new Date(dateStr);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      // Get category display name
      var categoryNames = {
        'selection': '选型指南',
        'protocol': '协议解析',
        'troubleshooting': '维护指南',
        'certification': '认证合规',
        'comparison': '技术对比',
        'architecture': '系统设计',
        'iot': '物联网应用'
      };

      function getCategoryName(cat) {
        return categoryNames[cat] || cat;
      }

      // Group posts by year-month
      function groupByMonth(posts) {
        var groups = [];
        var currentKey = '';
        var currentPosts = [];

        posts.forEach(function(post) {
          var d = new Date(post.date);
          var key = d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
          if (key !== currentKey) {
            if (currentPosts.length > 0) {
              groups.push({ key: currentKey, posts: currentPosts });
            }
            currentKey = key;
            currentPosts = [];
          }
          currentPosts.push(post);
        });

        if (currentPosts.length > 0) {
          groups.push({ key: currentKey, posts: currentPosts });
        }

        return groups;
      }

      // Update JSON-LD structured data for AI crawlers
      function updateStructuredData(posts) {
        var scriptEl = document.getElementById('archive-structured-data');
        if (!scriptEl) return;

        var items = posts.map(function(post, index) {
          return {
            "@type": "ListItem",
            "position": index + 1,
            "name": post.title,
            "url": "https://www.nexlamp.com/dist/blog/" + post.slug + ".html"
          };
        });

        var data = {
          "@context": "https://schema.org",
          "@type": "ItemList",
          "name": "耐利普科技技术文章归档",
          "description": "LED驱动电源与智能照明技术全部文章索引",
          "url": "https://www.nexlamp.com/blog-archive.html",
          "numberOfItems": posts.length,
          "itemListElement": items
        };

        scriptEl.textContent = JSON.stringify(data);
      }

      // Fetch and render
      fetch('dist/blog/index.json')
        .then(function(res) { return res.json(); })
        .then(function(posts) {
          if (!posts || posts.length === 0) {
            archiveEl.innerHTML = '<p>暂无文章</p>';
            return;
          }

          // Update structured data for AI crawlers
          updateStructuredData(posts);

          var groups = groupByMonth(posts);
          var html = '';

          groups.forEach(function(group) {
            html += '<div class="archive-group">';
            html += '  <h2 class="archive-group-title">' + group.key + '</h2>';
            html += '  <ul class="archive-group-list">';

            group.posts.forEach(function(post) {
              var catName = getCategoryName(post.category);
              html += '<li class="archive-item">';
              html += '  <a href="dist/blog/' + post.slug + '.html" class="archive-item-link">';
              html += '    <span class="archive-item-date">' + formatDate(post.date) + '</span>';
              html += '    <span class="archive-item-title">' + post.title + '</span>';
              html += '    <span class="archive-item-cat">' + catName + '</span>';
              html += '  </a>';
              html += '</li>';
            });

            html += '  </ul>';
            html += '</div>';
          });

          // Add a link back to paginated blog
          html += '<div class="archive-back">';
          html += '  <a href="blog.html" class="link-more">返回技术文章</a>';
          html += '</div>';

          archiveEl.innerHTML = html;
        })
        .catch(function(err) {
          console.error('Failed to load blog index:', err);
          archiveEl.innerHTML = '<p>文章加载失败，请刷新页面重试。</p>';
        });
    })();
    </script>
