  <!-- Budget breakdown -->
  <g transform="translate(310, 55)">
    <rect x="0" y="0" width="340" height="180" rx="10" fill="#0d1f38" stroke="#1a3a5c" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="32" rx="10" fill="#142a45"/>
    <rect x="0" y="22" width="340" height="10" fill="#142a45"/>
    <text x="170" y="22" text-anchor="middle" fill="#ffd93d" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="500">💰 预算明细 ¥500</text>

    <!-- Items -->
    <g transform="translate(15, 42)">
