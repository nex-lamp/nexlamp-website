<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1f3a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="32" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#7ec8e3" text-anchor="middle" font-weight="bold">节律照明落地三阶梯：从零成本到专业级</text>

  <!-- ===== Tier 1: 入门手动 ===== -->
  <rect x="30" y="55" width="235" height="360" rx="10" fill="#111d33" stroke="#5a8a9a" stroke-width="1" filter="url(#shadow)"/>
  <rect x="30" y="55" width="235" height="36" rx="10" fill="#5a8a9a" opacity="0.3"/>
  <text x="147" y="78" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#7ec8e3" text-anchor="middle" font-weight="bold">🟢 入门 · 手动方案</text>

  <text x="147" y="115" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffc857" text-anchor="middle" font-weight="bold">💰 预算: ¥0 ~ ¥200</text>
  <text x="147" y="138" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7ec27e" text-anchor="middle">适用场景: 先改善卧室</text>

  <line x1="50" y1="155" x2="245" y2="155" stroke="#1a3050" stroke-width="0.5"/>

  <text x="50" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7ec8e3" font-weight="bold">做法</text>
  <text x="50" y="200" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 白天: 4000K主灯全开</text>
  <text x="50" y="218" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 傍晚: 换2700K台灯/落地灯</text>
  <text x="50" y="236" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 睡前1h: 只开暖光阅读灯</text>
  <text x="50" y="254" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 手机开夜览/护眼模式</text>

  <text x="50" y="285" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7ec8e3" font-weight="bold">效果</text>
  <text x="50" y="305" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">入睡速度改善 ~20%</text>
  <text x="50" y="323" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">需要手动切换，靠习惯维持</text>

  <text x="50" y="358" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#ff6b35">⚠ 注意：只调暗不调暖=无效</text>
  <text x="50" y="378" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">5000K灯开10%亮度仍含大量蓝光</text>

  <!-- ===== Tier 2: 智能调光调色 ===== -->
  <rect x="282" y="55" width="235" height="360" rx="10" fill="#111d33" stroke="#ffc857" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="282" y="55" width="235" height="36" rx="10" fill="#ffc857" opacity="0.15"/>
  <text x="400" y="78" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#ffc857" text-anchor="middle" font-weight="bold">⭐ 进阶 · 智能自动化</text>

  <text x="400" y="115" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffc857" text-anchor="middle" font-weight="bold">💰 预算: ¥800 ~ ¥2000/房间</text>
  <text x="400" y="138" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7ec27e" text-anchor="middle">适用场景: 无主灯设计 · 装修中</text>

  <line x1="302" y1="155" x2="497" y2="155" stroke="#1a3050" stroke-width="0.5"/>

  <text x="302" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffc857" font-weight="bold">做法</text>
  <text x="302" y="200" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 涂鸦Zigbee双色温筒灯/射灯</text>
  <text x="302" y="218" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• Zigbee网关 + 自动化规则</text>
  <text x="302" y="236" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 07:00 → 80%亮度 5000K</text>
  <text x="302" y="254" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 20:00 → 30%亮度 2700K</text>
  <text x="302" y="272" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 全自动 · 无需手动干预</text>

  <text x="302" y="305" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffc857" font-weight="bold">效果</text>
  <text x="302" y="325" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">入睡时间缩短 15-30min</text>
  <text x="302" y="343" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">深度睡眠增加 10-15%</text>
  <text x="302" y="361" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">眼疲劳减少 ~60%</text>

  <text x="302" y="378" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#7ec27e">✅ 推荐：性价比最高方案</text>

  <!-- ===== Tier 3: Professional ===== -->
  <rect x="534" y="55" width="235" height="360" rx="10" fill="#111d33" stroke="#4a90d9" stroke-width="1" filter="url(#shadow)"/>
  <rect x="534" y="55" width="235" height="36" rx="10" fill="#4a90d9" opacity="0.1"/>
  <text x="652" y="78" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4a90d9" text-anchor="middle" font-weight="bold">🏗 专业 · DALI-2 系统</text>

  <text x="652" y="115" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffc857" text-anchor="middle" font-weight="bold">💰 预算: ¥5000+/房间</text>
  <text x="652" y="138" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#7ec27e" text-anchor="middle">适用: 大平层 · 别墅 · 商业</text>

  <line x1="554" y1="155" x2="749" y2="155" stroke="#1a3050" stroke-width="0.5"/>

  <text x="554" y="178" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#4a90d9" font-weight="bold">做法</text>
  <text x="554" y="200" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• DALI-2驱动 + KNX控制器</text>
  <text x="554" y="218" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 天文时钟 · 自动日出日落曲线</text>
  <text x="554" y="236" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 每灯独立地址 · 256级灰度</text>
  <text x="554" y="254" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 故障自诊断+能耗监控</text>
  <text x="554" y="272" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">• 联动电动窗帘+HVAC</text>

  <text x="554" y="305" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#4a90d9" font-weight="bold">效果</text>
  <text x="554" y="325" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">CBRE实测: 生产率+12%</text>
  <text x="554" y="343" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">71%用户更精力充沛</text>
  <text x="554" y="361" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a">WELL v2 认证级标准</text>
  <text x="554" y="378" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#7ec27e">✅ 适合公建/自建豪宅</text>

  <!-- Bottom bar -->
  <rect x="30" y="430" width="740" height="50" rx="8" fill="#0d1a2d" stroke="#1a3050" stroke-width="1"/>
  <text x="400" y="454" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffc857" text-anchor="middle">💡 建议：从卧室先开始 · 花800元换套双色温筒灯 → 比你花3000元买床垫更值</text>
  <text x="400" y="472" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#5a8a9a" text-anchor="middle">床垫解决不了「大脑觉得现在是中午」的问题，灯可以</text>
</svg>