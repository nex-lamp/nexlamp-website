<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="680" height="400" fill="url(#bgGrad)"/>
  <rect width="680" height="400" fill="url(#grid)"/>

  <text x="340" y="40" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="2">显色指数决定质感</text>
  <text x="340" y="68" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#8ba3c7">同样是白墙，Ra80 和 Ra98 的灯光下完全不同</text>

  <!-- Left panel: Ra80 -->
  <rect x="50" y="100" width="280" height="260" rx="12" fill="#0f2744" stroke="#7a2a2a" stroke-width="1.5" opacity="0.9"/>
  <text x="190" y="130" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#ff6b6b">Ra80 普通灯光</text>

  <g transform="translate(190, 200)">
    <circle cx="-40" cy="0" r="25" fill="#3a2a1a" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
    <text x="-40" y="5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#ffffff">🍎</text>

    <circle cx="40" cy="0" r="25" fill="#2a3a1a" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
    <text x="40" y="5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#ffffff">🌿</text>
  </g>

  <text x="190" y="260" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">颜色发灰，层次弱</text>
  <text x="190" y="280" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">墙面容易显廉价</text>
  <text x="190" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ff6b6b" font-weight="bold">翻车感明显</text>

  <!-- Right panel: Ra98 -->
  <rect x="350" y="100" width="280" height="260" rx="12" fill="#0f2744" stroke="#1a4a7a" stroke-width="1.5" opacity="0.9"/>
  <text x="490" y="130" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#7ec27e">Ra98 高显色灯光</text>

  <g transform="translate(490, 200)">
    <circle cx="-40" cy="0" r="25" fill="#5a1a1a" stroke="#7ec27e" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    <text x="-40" y="5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#ffffff">🍎</text>

    <circle cx="40" cy="0" r="25" fill="#1a5a1a" stroke="#7ec27e" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    <text x="40" y="5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#ffffff">🌿</text>
  </g>

  <text x="490" y="260" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">颜色饱满，层次强</text>
  <text x="490" y="280" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">墙面有质感，高级感</text>
  <text x="490" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#7ec27e" font-weight="bold">翻车概率低</text>

  <!-- Bottom checklist -->
  <rect x="50" y="340" width="580" height="45" rx="8" fill="#0f2744" stroke="#1a4a7a" stroke-width="1.5" opacity="0.9"/>
  <text x="340" y="358" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ffffff">建议：餐厅/阅读/化妆区 Ra≥95，同一空间色温种类不超过两种</text>
  <text x="340" y="375" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">优先同一品牌同批次采购，避免色差</text>
</svg>