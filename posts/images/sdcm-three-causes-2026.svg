<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="620" fill="#0a1628"/>
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.3">
    <path d="M0 90 H1000 M0 180 H1000 M0 270 H1000 M0 360 H1000 M0 450 H1000 M0 540 H1000"/>
    <path d="M125 0 V620 M250 0 V620 M375 0 V620 M500 0 V620 M625 0 V620 M750 0 V620 M875 0 V620"/>
  </g>
  <text x="500" y="54" text-anchor="middle" fill="#e2f3ff" font-size="30" font-weight="bold">同一批灯颜色"花"了——三个病根</text>
  <text x="500" y="86" text-anchor="middle" fill="#7dd3fc" font-size="16">钱都省在你看不见的地方，标称色温一样 ≠ 看起来一样</text>

  <!-- cause 1 -->
  <g>
    <rect x="40" y="120" width="286" height="300" rx="14" fill="#0f2036" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="72" cy="158" r="18" fill="#22d3ee" opacity="0.15"/>
    <text x="72" y="165" text-anchor="middle" fill="#22d3ee" font-size="18" font-weight="bold">1</text>
    <text x="102" y="166" fill="#e2f3ff" font-size="19" font-weight="bold">芯片没分好 bin</text>
    <text x="66" y="212" fill="#9fb6cc" font-size="14.5">同一晶圆切下的芯片，波长亮度</text>
    <text x="66" y="236" fill="#9fb6cc" font-size="14.5">天然有差异。正规厂做"分bin"：</text>
    <text x="66" y="260" fill="#9fb6cc" font-size="14.5">颜色相近的归同档再封装</text>
    <rect x="66" y="290" width="234" height="44" rx="8" fill="#164e63" opacity="0.6"/>
    <text x="183" y="318" text-anchor="middle" fill="#67e8f9" font-size="14.5">分bin越细成本越高</text>
    <rect x="66" y="346" width="234" height="52" rx="8" fill="#3f1d1d" stroke="#f87171" opacity="0.85"/>
    <text x="183" y="368" text-anchor="middle" fill="#fca5a5" font-size="14">低价方案不分bin / 粗分bin</text>
    <text x="183" y="388" text-anchor="middle" fill="#fca5a5" font-size="14">单灯合格，装一起就"花"</text>
  </g>

  <!-- cause 2 -->
  <g>
    <rect x="357" y="120" width="286" height="300" rx="14" fill="#0f2036" stroke="#4ade80" stroke-width="1.5"/>
    <circle cx="389" cy="158" r="18" fill="#4ade80" opacity="0.15"/>
    <text x="389" y="165" text-anchor="middle" fill="#4ade80" font-size="18" font-weight="bold">2</text>
    <text x="419" y="166" fill="#e2f3ff" font-size="19" font-weight="bold">驱动把色偏放大</text>
    <text x="383" y="212" fill="#9fb6cc" font-size="14.5">LED 色温随电流漂移。恒流精度</text>
    <text x="383" y="236" fill="#9fb6cc" font-size="14.5">差的驱动输出波动大，同批灯具</text>
    <text x="383" y="260" fill="#9fb6cc" font-size="14.5">之间的色偏被进一步放大</text>
    <rect x="383" y="290" width="234" height="44" rx="8" fill="#14532d" opacity="0.6"/>
    <text x="500" y="318" text-anchor="middle" fill="#86efac" font-size="14.5">灯珠bin分得再好，也会被拉出圈</text>
    <rect x="383" y="346" width="234" height="52" rx="8" fill="#14532d" stroke="#4ade80" opacity="0.9"/>
    <text x="500" y="368" text-anchor="middle" fill="#86efac" font-size="14">最隐蔽的一环 · 不是光源的锅</text>
    <text x="500" y="388" text-anchor="middle" fill="#86efac" font-size="14">驱动在里面占一份</text>
  </g>

  <!-- cause 3 -->
  <g>
    <rect x="674" y="120" width="286" height="300" rx="14" fill="#0f2036" stroke="#facc15" stroke-width="1.5"/>
    <circle cx="706" cy="158" r="18" fill="#facc15" opacity="0.15"/>
    <text x="706" y="165" text-anchor="middle" fill="#facc15" font-size="18" font-weight="bold">3</text>
    <text x="736" y="166" fill="#e2f3ff" font-size="19" font-weight="bold">混光曲线不一致</text>
    <text x="700" y="212" fill="#9fb6cc" font-size="14.5">双色温智能灯靠暖白冷白两组芯</text>
    <text x="700" y="236" fill="#9fb6cc" font-size="14.5">片按比例混光。两批灯的混光调</text>
    <text x="700" y="260" fill="#9fb6cc" font-size="14.5">校曲线不一致，同设4000K也偏色</text>
    <rect x="700" y="290" width="234" height="44" rx="8" fill="#713f12" opacity="0.6"/>
    <text x="817" y="318" text-anchor="middle" fill="#fde047" font-size="14.5">标称一样 · 设定一样 · 颜色照样不齐</text>
    <rect x="700" y="346" width="234" height="52" rx="8" fill="#3f1d1d" stroke="#fb923c" opacity="0.85"/>
    <text x="817" y="368" text-anchor="middle" fill="#fdba74" font-size="14">另：透镜设计差 → 中心暖边缘冷</text>
    <text x="817" y="388" text-anchor="middle" fill="#fdba74" font-size="14">单灯检测测不出，需成像色度计</text>
  </g>

  <!-- bottom bar -->
  <rect x="40" y="448" width="920" height="76" rx="12" fill="#0f2036" stroke="#1e3a5f"/>
  <text x="500" y="480" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="bold">下单时怎么防</text>
  <text x="500" y="508" text-anchor="middle" fill="#e2f3ff" font-size="15">问客服"色容差几步" · 全屋同品牌同系列 · 双色温灯全屋同款 · 驱动光源配套调校</text>
  <text x="500" y="580" text-anchor="middle" fill="#64748b" font-size="14">国标管单灯底线，SDCM 管多灯并排的一致性</text>
</svg>
