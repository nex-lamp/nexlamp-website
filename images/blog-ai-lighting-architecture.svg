<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <linearGradient id="sensor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="action" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="12" fill="url(#bg)"/>
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">AI照明系统架构：感知→决策→执行</text>
  <!-- Layer 1: Perception -->
  <rect x="40" y="70" width="720" height="110" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
  <rect x="40" y="70" width="8" height="110" rx="4" fill="url(#sensor)"/>
  <text x="80" y="95" font-size="14" font-weight="bold" fill="#92400e">感知层 Sensing</text>
  <!-- Sensor boxes -->
  <rect x="80" y="108" width="120" height="55" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="140" y="133" text-anchor="middle" font-size="11" fill="#92400e">光照传感器</text>
  <text x="140" y="150" text-anchor="middle" font-size="9" fill="#b45309">环境亮度/色温</text>
  <rect x="220" y="108" width="120" height="55" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="280" y="133" text-anchor="middle" font-size="11" fill="#92400e">人体感应</text>
  <text x="280" y="150" text-anchor="middle" font-size="9" fill="#b45309">PIR/毫米波</text>
  <rect x="360" y="108" width="120" height="55" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="420" y="133" text-anchor="middle" font-size="11" fill="#92400e">温湿度传感</text>
  <text x="420" y="150" text-anchor="middle" font-size="9" fill="#b45309">热舒适度数据</text>
  <rect x="500" y="108" width="120" height="55" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="560" y="133" text-anchor="middle" font-size="11" fill="#92400e">能耗计量</text>
  <text x="560" y="150" text-anchor="middle" font-size="9" fill="#b45309">实时功率/电量</text>
  <rect x="640" y="108" width="100" height="55" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="690" y="133" text-anchor="middle" font-size="11" fill="#92400e">日程数据</text>
  <text x="690" y="150" text-anchor="middle" font-size="9" fill="#b45309">时间/日历</text>
  <!-- Arrow down -->
  <path d="M400,180 L400,210" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <polygon points="394,208 400,222 406,208" fill="#7c3aed"/>
  <!-- Layer 2: AI Decision -->
  <rect x="120" y="225" width="560" height="130" rx="12" fill="white" stroke="#7c3aed" stroke-width="2.5" opacity="0.95"/>
  <rect x="120" y="225" width="8" height="130" rx="4" fill="url(#ai)"/>
  <text x="160" y="252" font-size="14" font-weight="bold" fill="#5b21b6">决策层 AI Engine</text>
  <!-- AI core -->
  <rect x="160" y="265" width="150" height="70" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="235" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">场景识别</text>
  <text x="235" y="310" text-anchor="middle" font-size="9" fill="#7c3aed">会议/办公/休息/离开</text>
  <text x="235" y="325" text-anchor="middle" font-size="9" fill="#7c3aed">实时场景分类</text>
  <rect x="330" y="265" width="150" height="70" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="405" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">策略优化</text>
  <text x="405" y="310" text-anchor="middle" font-size="9" fill="#7c3aed">强化学习/遗传算法</text>
  <text x="405" y="325" text-anchor="middle" font-size="9" fill="#7c3aed">多目标寻优</text>
  <rect x="500" y="265" width="150" height="70" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="575" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">预测决策</text>
  <text x="575" y="310" text-anchor="middle" font-size="9" fill="#7c3aed">时序预测/异常检测</text>
  <text x="575" y="325" text-anchor="middle" font-size="9" fill="#7c3aed">故障预警</text>
  <!-- Arrow down -->
  <polygon points="394,353 400,367 406,353" fill="#10b981"/>
  <!-- Layer 3: Action -->
  <rect x="40" y="375" width="720" height="95" rx="10" fill="white" stroke="#10b981" stroke-width="2" opacity="0.9"/>
  <rect x="40" y="375" width="8" height="95" rx="4" fill="url(#action)"/>
  <text x="80" y="400" font-size="14" font-weight="bold" fill="#065f46">执行层 Action</text>
  <rect x="80" y="412" width="140" height="45" rx="8" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
  <text x="150" y="433" text-anchor="middle" font-size="11" fill="#065f46">PWM/DALI调光</text>
  <text x="150" y="448" text-anchor="middle" font-size="9" fill="#059669">亮度/色温输出</text>
  <rect x="240" y="412" width="140" height="45" rx="8" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
  <text x="310" y="433" text-anchor="middle" font-size="11" fill="#065f46">场景切换</text>
  <text x="310" y="448" text-anchor="middle" font-size="9" fill="#059669">一键模式切换</text>
  <rect x="400" y="412" width="140" height="45" rx="8" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
  <text x="470" y="433" text-anchor="middle" font-size="11" fill="#065f46">告警推送</text>
  <text x="470" y="448" text-anchor="middle" font-size="9" fill="#059669">异常/维护通知</text>
  <rect x="560" y="412" width="170" height="45" rx="8" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
  <text x="645" y="433" text-anchor="middle" font-size="11" fill="#065f46">数据报告生成</text>
  <text x="645" y="448" text-anchor="middle" font-size="9" fill="#059669">能耗/健康度分析</text>
  <!-- Feedback loop -->
  <path d="M760,290 Q780,290 780,200 Q780,125 740,125" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="742,120 732,125 742,130" fill="#94a3b8"/>
  <text x="790" y="210" font-size="9" fill="#94a3b8" transform="rotate(-90,790,210)">反馈闭环</text>
</svg>