<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0L0 0L0 20" fill="none" stroke="#1a2d4d" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="420" fill="#0a1628"/>
  <rect width="680" height="420" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="30" y="20" width="620" height="36" rx="6" fill="#111d33" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="50" cy="38" r="5" fill="#ff5f56"/>
  <circle cx="68" cy="38" r="5" fill="#ffbd2e"/>
  <circle cx="86" cy="38" r="5" fill="#27c93f"/>
  <text x="340" y="43" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="14" font-weight="500">LED驱动电源安全三大支柱</text>

  <!-- Pillar 1: Electrical Safety -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="170" height="280" rx="10" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1.5"/>
    <rect x="10" y="10" width="150" height="30" rx="5" fill="#1e4d6b" opacity="0.3"/>
    <text x="85" y="30" text-anchor="middle" fill="#5ab4e6" font-family="monospace" font-size="12" font-weight="500">01 电气安全</text>
    <line x1="15" y1="55" x2="155" y2="55" stroke="#1e4d6b" stroke-width="0.5"/>

    <text x="15" y="80" fill="#a0c4e8" font-family="monospace" font-size="11">耐压测试 3750V</text>
    <rect x="15" y="88" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="88" width="130" height="6" rx="3" fill="#5ab4e6" opacity="0.7"/>

    <text x="15" y="115" fill="#a0c4e8" font-family="monospace" font-size="11">绝缘电阻 &gt; 2MΩ</text>
    <rect x="15" y="123" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="123" width="125" height="6" rx="3" fill="#5ab4e6" opacity="0.7"/>

    <text x="15" y="150" fill="#a0c4e8" font-family="monospace" font-size="11">泄漏电流 &lt; 0.25mA</text>
    <rect x="15" y="158" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="158" width="135" height="6" rx="3" fill="#5ab4e6" opacity="0.7"/>

    <text x="15" y="190" fill="#7ec27e" font-family="monospace" font-size="11" filter="url(#glow)">核心目标</text>
    <text x="15" y="210" fill="#c8ddf0" font-family="monospace" font-size="11">防触电、防短路</text>
    <text x="15" y="228" fill="#c8ddf0" font-family="monospace" font-size="11">防电弧起火</text>

    <circle cx="85" cy="260" r="20" fill="none" stroke="#5ab4e6" stroke-width="2" opacity="0.5"/>
    <path d="M75 260L82 267L95 253" fill="none" stroke="#5ab4e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pillar 2: EMC -->
  <g transform="translate(255, 90)">
    <rect x="0" y="0" width="170" height="280" rx="10" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1.5"/>
    <rect x="10" y="10" width="150" height="30" rx="5" fill="#1e4d6b" opacity="0.3"/>
    <text x="85" y="30" text-anchor="middle" fill="#e6a845" font-family="monospace" font-size="12" font-weight="500">02 电磁兼容</text>
    <line x1="15" y1="55" x2="155" y2="55" stroke="#1e4d6b" stroke-width="0.5"/>

    <text x="15" y="80" fill="#a0c4e8" font-family="monospace" font-size="11">传导骚扰 EN55015</text>
    <rect x="15" y="88" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="88" width="120" height="6" rx="3" fill="#e6a845" opacity="0.7"/>

    <text x="15" y="115" fill="#a0c4e8" font-family="monospace" font-size="11">辐射骚扰 CISPR 15</text>
    <rect x="15" y="123" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="123" width="115" height="6" rx="3" fill="#e6a845" opacity="0.7"/>

    <text x="15" y="150" fill="#a0c4e8" font-family="monospace" font-size="11">谐波电流 IEC61000-3-2</text>
    <rect x="15" y="158" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="158" width="128" height="6" rx="3" fill="#e6a845" opacity="0.7"/>

    <text x="15" y="190" fill="#7ec27e" font-family="monospace" font-size="11" filter="url(#glow)">核心目标</text>
    <text x="15" y="210" fill="#c8ddf0" font-family="monospace" font-size="11">不干扰其他设备</text>
    <text x="15" y="228" fill="#c8ddf0" font-family="monospace" font-size="11">自身抗干扰稳定</text>

    <circle cx="85" cy="260" r="20" fill="none" stroke="#e6a845" stroke-width="2" opacity="0.5"/>
    <path d="M75 260L82 267L95 253" fill="none" stroke="#e6a845" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pillar 3: Material Flame Retardant -->
  <g transform="translate(450, 90)">
    <rect x="0" y="0" width="170" height="280" rx="10" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1.5"/>
    <rect x="10" y="10" width="150" height="30" rx="5" fill="#1e4d6b" opacity="0.3"/>
    <text x="85" y="30" text-anchor="middle" fill="#e85d5d" font-family="monospace" font-size="12" font-weight="500">03 材料阻燃</text>
    <line x1="15" y1="55" x2="155" y2="55" stroke="#1e4d6b" stroke-width="0.5"/>

    <text x="15" y="80" fill="#a0c4e8" font-family="monospace" font-size="11">外壳阻燃 V-1级</text>
    <rect x="15" y="88" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="88" width="132" height="6" rx="3" fill="#e85d5d" opacity="0.7"/>

    <text x="15" y="115" fill="#a0c4e8" font-family="monospace" font-size="11">PCB基材 94V-0</text>
    <rect x="15" y="123" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="123" width="138" height="6" rx="3" fill="#e85d5d" opacity="0.7"/>

    <text x="15" y="150" fill="#a0c4e8" font-family="monospace" font-size="11">变压器骨架 耐温130℃</text>
    <rect x="15" y="158" width="140" height="6" rx="3" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="0.5"/>
    <rect x="15" y="158" width="130" height="6" rx="3" fill="#e85d5d" opacity="0.7"/>

    <text x="15" y="190" fill="#7ec27e" font-family="monospace" font-size="11" filter="url(#glow)">核心目标</text>
    <text x="15" y="210" fill="#c8ddf0" font-family="monospace" font-size="11">内部故障不自燃</text>
    <text x="15" y="228" fill="#c8ddf0" font-family="monospace" font-size="11">点燃后30秒内自熄</text>

    <circle cx="85" cy="260" r="20" fill="none" stroke="#e85d5d" stroke-width="2" opacity="0.5"/>
    <path d="M75 260L82 267L95 253" fill="none" stroke="#e85d5d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom note -->
  <text x="340" y="405" text-anchor="middle" fill="#5a7090" font-family="monospace" font-size="10">NEXLAMP | 耐利普科技 | CCC认证驱动电源供应商</text>
</svg>