<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14263e" stroke-width="1"/>
    </pattern>
    <linearGradient id="bgs3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/><stop offset="1" stop-color="#0d1c31"/>
    </linearGradient>
    <filter id="g3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="760" fill="url(#bgs3)"/>
  <rect width="1080" height="760" fill="url(#grid3)"/>

  <text x="60" y="72" fill="#7ec8ff" font-size="42" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三步自查，两句话问客服</text>
  <text x="60" y="112" fill="#5a7ba6" font-size="21" font-family="'PingFang SC','Microsoft YaHei',sans-serif">已经装完的先定位，还在选灯的直接照着问</text>

  <!-- Step 1 -->
  <rect x="52" y="146" width="976" height="118" rx="16" fill="#0d1b30" stroke="#3fd08a" stroke-width="1.6"/>
  <circle cx="112" cy="205" r="34" fill="#132741" stroke="#3fd08a" stroke-width="2" filter="url(#g3)"/>
  <text x="112" y="217" text-anchor="middle" fill="#6fe3ab" font-size="32" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1</text>
  <text x="172" y="186" fill="#6fe3ab" font-size="25" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分回路断电</text>
  <text x="172" y="222" fill="#c8d6ea" font-size="19" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关掉怀疑的那一路灯，看音响底噪、触摸失灵、误跳是否同时消失。</text>
  <text x="172" y="248" fill="#8fb3d9" font-size="18" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同时消失 → 问题就在这一路，不用怀疑设备。</text>

  <!-- Step 2 -->
  <rect x="52" y="284" width="976" height="118" rx="16" fill="#0d1b30" stroke="#3fd08a" stroke-width="1.6"/>
  <circle cx="112" cy="343" r="34" fill="#132741" stroke="#3fd08a" stroke-width="2" filter="url(#g3)"/>
  <text x="112" y="355" text-anchor="middle" fill="#6fe3ab" font-size="32" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2</text>
  <text x="172" y="324" fill="#6fe3ab" font-size="25" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数灯</text>
  <text x="172" y="360" fill="#c8d6ea" font-size="19" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个回路挂 20 只以上 5W～12W 的无 PFC 小灯，风险明显上升。</text>
  <text x="172" y="386" fill="#8fb3d9" font-size="18" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分摊到两三个回路就能缓解，不用换灯。</text>

  <!-- Step 3 -->
  <rect x="52" y="422" width="976" height="118" rx="16" fill="#0d1b30" stroke="#3fd08a" stroke-width="1.6"/>
  <circle cx="112" cy="481" r="34" fill="#132741" stroke="#3fd08a" stroke-width="2" filter="url(#g3)"/>
  <text x="112" y="493" text-anchor="middle" fill="#6fe3ab" font-size="32" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3</text>
  <text x="172" y="462" fill="#6fe3ab" font-size="25" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">让电工测两项</text>
  <text x="172" y="498" fill="#c8d6ea" font-size="19" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钳形表卡中性线电流，接近甚至超过相线电流是典型征兆。</text>
  <text x="172" y="524" fill="#8fb3d9" font-size="18" font-family="'PingFang SC','Microsoft YaHei',sans-serif">再看该回路端子温度。两项都不用拆灯。</text>

  <!-- Question cards -->
  <text x="60" y="592" fill="#8fb3d9" font-size="21" font-family="'PingFang SC','Microsoft YaHei',sans-serif">买灯时别只问显指和色温，多问这两句</text>

  <rect x="52" y="612" width="478" height="108" rx="14" fill="#122741" stroke="#3a7bd5" stroke-width="1.6"/>
  <text x="76" y="648" fill="#7ec8ff" font-size="18" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Q1　驱动功率因数多少？有没有有源 PFC？</text>
  <text x="76" y="678" fill="#c8d6ea" font-size="16" font-family="'PingFang SC','Microsoft YaHei',sans-serif">PF ≥ 0.9 才算做得认真，0.5 左右基本就是没做。</text>
  <text x="76" y="704" fill="#8fb3d9" font-size="15" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但要留意：PF 高不等于谐波低，RC 滤波也能把 PF 抬上去。</text>

  <rect x="550" y="612" width="478" height="108" rx="14" fill="#122741" stroke="#3a7bd5" stroke-width="1.6"/>
  <text x="574" y="648" fill="#7ec8ff" font-size="18" font-weight="bold" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Q2　有没有谐波电流检测报告？</text>
  <text x="574" y="678" fill="#c8d6ea" font-size="16" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按 GB 17625.1—2022 做的，工程灯具基本都有。</text>
  <text x="574" y="704" fill="#8fb3d9" font-size="15" font-family="'PingFang SC','Microsoft YaHei',sans-serif">家用小功率能拿出来的不多 —— 这本身就是个信号。</text>
</svg>
