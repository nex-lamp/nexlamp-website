<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f2a4a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g stroke="#1a3a5a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="50" x2="680" y2="50"/>
    <line x1="0" y1="100" x2="680" y2="100"/>
    <line x1="0" y1="150" x2="680" y2="150"/>
    <line x1="0" y1="200" x2="680" y2="200"/>
    <line x1="0" y1="250" x2="680" y2="250"/>
    <line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="350" x2="680" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- Divider -->
  <line x1="340" y1="40" x2="340" y2="380" stroke="#2a5a8a" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Left side: BLE Mesh (Broadcast / Flooding) -->
  <text x="170" y="35" text-anchor="middle" fill="#4a9eff" font-family="Arial,sans-serif" font-size="16" font-weight="bold" filter="url(#glow)">蓝牙Mesh: 泛洪广播</text>

  <!-- BLE Mesh nodes - all broadcasting to all neighbors -->
  <!-- Node positions (left half) -->
  <g filter="url(#glow)">
    <!-- Broadcast lines (chaotic, many lines) -->
    <line x1="90" y1="110" x2="170" y2="110" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="90" y1="110" x2="130" y2="160" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="90" y1="110" x2="90" y2="200" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="90" y1="110" x2="170" y2="200" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="90" y1="110" x2="130" y2="250" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>

    <line x1="170" y1="110" x2="130" y2="160" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="170" y1="110" x2="90" y2="200" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="170" y1="110" x2="170" y2="200" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="170" y1="110" x2="130" y2="250" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="170" y1="110" x2="90" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.2"/>

    <line x1="130" y1="160" x2="90" y2="200" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="130" y1="160" x2="170" y2="200" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="130" y1="160" x2="130" y2="250" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="130" y1="160" x2="90" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="130" y1="160" x2="170" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>

    <line x1="90" y1="200" x2="170" y2="200" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="90" y1="200" x2="130" y2="250" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="90" y1="200" x2="90" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="90" y1="200" x2="170" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>

    <line x1="170" y1="200" x2="130" y2="250" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="170" y1="200" x2="90" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="170" y1="200" x2="170" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>

    <line x1="130" y1="250" x2="90" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
    <line x1="130" y1="250" x2="170" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>

    <line x1="90" y1="290" x2="170" y2="290" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- BLE Mesh nodes -->
  <g>
    <circle cx="90" cy="110" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
    <circle cx="170" cy="110" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
    <circle cx="130" cy="160" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
    <circle cx="90" cy="200" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
    <circle cx="170" cy="200" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
    <circle cx="130" cy="250" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
    <circle cx="90" cy="290" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
    <circle cx="170" cy="290" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- BLE labels -->
  <text x="130" y="335" text-anchor="middle" fill="#8ab4f8" font-family="Arial,sans-serif" font-size="11">每条指令广播N次 → 信道拥堵</text>
  <text x="130" y="352" text-anchor="middle" fill="#6a8abf" font-family="Arial,sans-serif" font-size="10">30+设备后延迟飙升</text>

  <!-- Right side: Zigbee (Routing / Mesh) -->
  <text x="510" y="35" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="16" font-weight="bold" filter="url(#glow)">Zigbee: 分级路由</text>

  <!-- Zigbee routing - optimized path -->
  <g filter="url(#glow)">
    <!-- Gateway -->
    <rect x="440" y="100" width="28" height="28" rx="4" fill="#4ade80" opacity="0.9"/>
    <text x="454" y="118" text-anchor="middle" fill="#0a1628" font-family="Arial,sans-serif" font-size="9" font-weight="bold">GW</text>

    <!-- Optimized routing paths (clean, minimal) -->
    <line x1="468" y1="114" x2="500" y2="114" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="468" y1="114" x2="480" y2="160" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="500" y1="114" x2="540" y2="114" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="500" y1="114" x2="480" y2="160" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <line x1="540" y1="114" x2="580" y2="114" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="480" y1="160" x2="540" y2="160" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="540" y1="160" x2="580" y2="114" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <line x1="480" y1="160" x2="460" y2="210" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="540" y1="160" x2="520" y2="210" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="540" y1="160" x2="580" y2="210" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="460" y1="210" x2="520" y2="210" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="520" y1="210" x2="580" y2="210" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="460" y1="210" x2="490" y2="260" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="520" y1="210" x2="490" y2="260" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <line x1="580" y1="210" x2="560" y2="260" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="490" y1="260" x2="560" y2="260" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="560" y1="260" x2="530" y2="300" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Zigbee nodes -->
  <g>
    <circle cx="500" cy="114" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="540" cy="114" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="580" cy="114" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="480" cy="160" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="540" cy="160" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="460" cy="210" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="520" cy="210" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="580" cy="210" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="490" cy="260" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="560" cy="260" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
    <circle cx="530" cy="300" r="12" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- Zigbee labels -->
  <text x="510" y="335" text-anchor="middle" fill="#8af0a0" font-family="Arial,sans-serif" font-size="11">路由表精准转发 → 信道高效</text>
  <text x="510" y="352" text-anchor="middle" fill="#6acf80" font-family="Arial,sans-serif" font-size="10">100+设备依然流畅</text>

  <!-- Title bar -->
  <rect x="0" y="380" width="680" height="20" fill="#0a1628"/>
  <text x="340" y="394" text-anchor="middle" fill="#4a6a8a" font-family="Arial,sans-serif" font-size="9">NEXLAMP | 涂鸦Zigbee智能照明 | www.nexlamp.com</text>
</svg>
