<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3055" stroke-width="0.5"/>
    </pattern>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="680" height="400" fill="#0a1628"/>
  <rect width="680" height="400" fill="url(#grid2)"/>
  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#e0e0e0" font-weight="bold">协议兼容性问题：为什么"智能"变"智障"</text>
  <text x="340" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78909c">毫米波雷达与调光驱动协议匹配率仅60%</text>
  <!-- Scene: mmWave radar sends command -->
  <rect x="30" y="80" width="140" height="70" fill="#0d2137" stroke="#7ec27e" stroke-width="1.5" rx="8"/>
  <text x="100" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7ec27e" font-weight="bold">毫米波雷达</text>
  <text x="100" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">检测到有人</text>
  <text x="100" y="140" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7ec27e">→ Zigbee集群报文</text>
  <!-- Arrow with label -->
  <line x1="170" y1="115" x2="270" y2="115" stroke="#ffab40" stroke-width="2"/>
  <text x="220" y="108" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffab40">协议不匹配!</text>
  <!-- Protocol converter box -->
  <rect x="270" y="85" width="130" height="60" fill="#2a1a0a" stroke="#ff7043" stroke-width="1.5" rx="6" filter="url(#glow2)"/>
  <text x="335" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ff7043" font-weight="bold">协议转换器</text>
  <text x="335" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">Zigbee → DALI</text>
  <text x="335" y="140" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ff7043">+15%成本 +200ms延迟</text>
  <!-- Arrow to driver -->
  <line x1="400" y1="115" x2="470" y2="115" stroke="#4fc3f7" stroke-width="2"/>
  <!-- DALI driver -->
  <rect x="470" y="80" width="140" height="70" fill="#0d2137" stroke="#4fc3f7" stroke-width="1.5" rx="8"/>
  <text x="540" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4fc3f7" font-weight="bold">DALI调光驱动</text>
  <text x="540" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b0bec5">收到调光指令</text>
  <text x="540" y="140" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#4fc3f7">→ 调节输出电流</text>
  <!-- Impact summary box -->
  <rect x="40" y="180" width="600" height="80" fill="#1a0a0a" stroke="#d32f2f" stroke-width="1" rx="8"/>
  <text x="340" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ff7043" font-weight="bold">协议不匹配的3大后果</text>
  <!-- 3 consequence cards -->
  <rect x="55" y="218" width="175" height="35" fill="#2a1515" rx="4" stroke="#ff7043" stroke-width="0.5"/>
  <text x="142" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffcdd2">成本↑15% 转换器额外费用</text>
  <rect x="240" y="218" width="175" height="35" fill="#2a1515" rx="4" stroke="#ff7043" stroke-width="0.5"/>
  <text x="327" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffcdd2">延迟↑200-500ms 体验卡顿</text>
  <rect x="425" y="218" width="175" height="35" fill="#2a1515" rx="4" stroke="#ff7043" stroke-width="0.5"/>
  <text x="512" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffcdd2">转换器故障=整灯失联</text>
  <!-- Solution section -->
  <rect x="40" y="290" width="600" height="100" fill="#0d2137" stroke="#7ec27e" stroke-width="1.5" rx="8"/>
  <text x="340" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7ec27e" font-weight="bold">正确方案：统一协议栈，零转换</text>
  <!-- Solution flow -->
  <rect x="80" y="330" width="120" height="40" fill="#1a3055" stroke="#7ec27e" stroke-width="1" rx="6"/>
  <text x="140" y="355" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7ec27e">Zigbee模块</text>
  <line x1="200" y1="350" x2="260" y2="350" stroke="#7ec27e" stroke-width="1.5"/>
  <rect x="260" y="330" width="120" height="40" fill="#1a3055" stroke="#7ec27e" stroke-width="1" rx="6"/>
  <text x="320" y="355" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7ec27e">隔离驱动</text>
  <line x1="380" y1="350" x2="440" y2="350" stroke="#7ec27e" stroke-width="1.5"/>
  <rect x="440" y="330" width="160" height="40" fill="#1a3055" stroke="#7ec27e" stroke-width="1" rx="6"/>
  <text x="520" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7ec27e">Zigbee调光直连</text>
  <text x="520" y="365" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#80cbc4">零转换 · 零延迟 · 零额外成本</text>
  <!-- No converter needed label -->
  <text x="340" y="382" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7ec27e">NEXLAMP: Zigbee模块&amp;隔离驱动原生集成，无需协议转换器</text>
</svg>
