<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glowSmall">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="450" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1a2a4a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="75" x2="680" y2="75"/>
    <line x1="0" y1="150" x2="680" y2="150"/>
    <line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="375" x2="680" y2="375"/>
    <line x1="170" y1="0" x2="170" y2="450"/>
    <line x1="340" y1="0" x2="340" y2="450"/>
    <line x1="510" y1="0" x2="510" y2="450"/>
  </g>

  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="16" font-weight="bold">光生物学：你的眼睛如何"看"时间</text>

  <!-- LEFT: Blue light path (Morning) -->
  <g>
    <!-- Light source -->
    <circle cx="130" cy="100" r="25" fill="none" stroke="#5b9bd5" stroke-width="2" opacity="0.6"/>
    <circle cx="130" cy="100" r="15" fill="#5b9bd5" opacity="0.3"/>
    <circle cx="130" cy="100" r="8" fill="#7ec8e3" filter="url(#glow)"/>
    <text x="130" y="140" text-anchor="middle" fill="#5b9bd5" font-family="monospace" font-size="11">5000K+ 冷白光源</text>
    <text x="130" y="155" text-anchor="middle" fill="#446688" font-family="monospace" font-size="9">(~480nm 蓝光)</text>

    <!-- Arrow -->
    <line x1="155" y1="100" x2="190" y2="100" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Eye -->
    <ellipse cx="220" cy="100" rx="35" ry="22" fill="none" stroke="#6688aa" stroke-width="1.5"/>
    <circle cx="220" cy="100" r="10" fill="#0a1628" stroke="#445566" stroke-width="1"/>
    <circle cx="220" cy="100" r="5" fill="#1a3040"/>

    <!-- ipRGC -->
    <text x="270" y="95" fill="#7ec8e3" font-family="monospace" font-size="9">ipRGC</text>
    <text x="270" y="108" fill="#446688" font-family="monospace" font-size="8">感光细胞</text>
    <line x1="255" y1="100" x2="300" y2="100" stroke="#7ec8e3" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- SCN -->
    <rect x="305" y="75" width="100" height="50" rx="6" fill="#0d1f3c" stroke="#5b9bd5" stroke-width="1"/>
    <text x="355" y="98" text-anchor="middle" fill="#5b9bd5" font-family="monospace" font-size="10">视交叉上核</text>
    <text x="355" y="113" text-anchor="middle" fill="#446688" font-family="monospace" font-size="8">(SCN · 主时钟)</text>

    <!-- Signal -->
    <line x1="405" y1="100" x2="440" y2="100" stroke="#7ec8e3" stroke-width="1.5"/>

    <!-- Pineal gland -->
    <rect x="445" y="82" width="90" height="36" rx="6" fill="#0d1f3c" stroke="#ff4444" stroke-width="1"/>
    <text x="490" y="105" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10">松果体</text>

    <!-- Arrow down -->
    <line x1="490" y1="118" x2="490" y2="155" stroke="#ff4444" stroke-width="1.5"/>

    <!-- Melatonin suppressed -->
    <rect x="440" y="155" width="100" height="30" rx="6" fill="#0d1f3c" stroke="#ff4444" stroke-width="1" opacity="0.7"/>
    <text x="490" y="175" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="11">褪黑素 ↓ 被抑制</text>

    <!-- Result -->
    <text x="490" y="210" text-anchor="middle" fill="#5b9bd5" font-family="monospace" font-size="11" font-weight="bold">→ 清醒 · 警觉</text>
  </g>

  <!-- RIGHT: Warm light path (Night) -->
  <g>
    <!-- Light source -->
    <circle cx="130" cy="310" r="25" fill="none" stroke="#ff7043" stroke-width="2" opacity="0.6"/>
    <circle cx="130" cy="310" r="15" fill="#ff7043" opacity="0.2"/>
    <circle cx="130" cy="310" r="8" fill="#ffa970" filter="url(#glow)"/>
    <text x="130" y="350" text-anchor="middle" fill="#ff7043" font-family="monospace" font-size="11">2700K 暖黄光源</text>
    <text x="130" y="365" text-anchor="middle" fill="#886644" font-family="monospace" font-size="9">(极低蓝光)</text>

    <!-- Arrow -->
    <line x1="155" y1="310" x2="190" y2="310" stroke="#ff7043" stroke-width="2"/>

    <!-- Eye -->
    <ellipse cx="220" cy="310" rx="35" ry="22" fill="none" stroke="#886644" stroke-width="1.5"/>
    <circle cx="220" cy="310" r="10" fill="#0a1628" stroke="#445566" stroke-width="1"/>
    <circle cx="220" cy="310" r="5" fill="#1a3040"/>

    <!-- ipRGC - no signal -->
    <text x="270" y="305" fill="#665544" font-family="monospace" font-size="9">ipRGC</text>
    <text x="270" y="318" fill="#443322" font-family="monospace" font-size="8">无蓝光触发</text>
    <line x1="255" y1="310" x2="300" y2="310" stroke="#665544" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

    <!-- SCN -->
    <rect x="305" y="285" width="100" height="50" rx="6" fill="#0d1f3c" stroke="#445566" stroke-width="1"/>
    <text x="355" y="308" text-anchor="middle" fill="#886644" font-family="monospace" font-size="10">视交叉上核</text>
    <text x="355" y="323" text-anchor="middle" fill="#554433" font-family="monospace" font-size="8">(SCN · "该睡了")</text>

    <!-- Pineal gland - active -->
    <rect x="445" y="292" width="90" height="36" rx="6" fill="#0d1f3c" stroke="#44dd44" stroke-width="1"/>
    <text x="490" y="315" text-anchor="middle" fill="#44dd44" font-family="monospace" font-size="10">松果体 · 激活</text>

    <!-- Arrow down -->
    <line x1="490" y1="328" x2="490" y2="365" stroke="#44dd44" stroke-width="1.5"/>

    <!-- Melatonin released -->
    <rect x="440" y="365" width="100" height="30" rx="6" fill="#0d1f3c" stroke="#44dd44" stroke-width="1" opacity="0.7"/>
    <text x="490" y="385" text-anchor="middle" fill="#66ee66" font-family="monospace" font-size="11">褪黑素 ↑ 大量分泌</text>

    <!-- Result -->
    <text x="490" y="420" text-anchor="middle" fill="#44dd44" font-family="monospace" font-size="11" font-weight="bold">→ 困倦 · 入睡</text>
  </g>

  <!-- Separator -->
  <line x1="40" y1="230" x2="640" y2="230" stroke="#1a2a4a" stroke-width="1"/>
  <text x="60" y="248" fill="#334455" font-family="monospace" font-size="10">白天: 蓝光刺激 ipRGC → SCN → 抑制褪黑素 = 清醒状态</text>
  <text x="60" y="268" fill="#334455" font-family="monospace" font-size="10">夜晚: 无蓝光 → ipRGC休眠 → SCN切换 → 松果体释放褪黑素 = 入睡准备</text>

  <!-- KEY warning -->
  <text x="340" y="445" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="10" font-weight="bold">⚠ 晚上调暗5000K灯没用！蓝光波长不变，褪黑素照样被抑制。必须降色温 + 降亮度。</text>
</svg>