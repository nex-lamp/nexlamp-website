<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="zoneG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" fill="#0a1628"/>
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.28">
    <path d="M0 80 H1000 M0 160 H1000 M0 240 H1000 M0 320 H1000 M0 400 H1000 M0 480 H1000 M0 560 H1000"/>
    <path d="M100 0 V620 M200 0 V620 M300 0 V620 M400 0 V620 M500 0 V620 M600 0 V620 M700 0 V620 M800 0 V620 M900 0 V620"/>
  </g>

  <text x="48" y="58" fill="#e2e8f0" font-size="26" font-weight="700">买前五问 + 收货三测</text>
  <text x="48" y="86" fill="#64748b" font-size="14">IP 数字只看两位，结构和分区才决定浴室灯能活多久</text>

  <!-- 左：分区示意 -->
  <g>
    <rect x="48" y="112" width="404" height="252" fill="#0d1e35" stroke="#1e3a5f" rx="8"/>
    <text x="68" y="140" fill="#94a3b8" font-size="13">浴室分区（GB/T 16895.13）</text>

    <!-- 淋浴区 -->
    <rect x="90" y="166" width="110" height="150" fill="url(#zoneG)" stroke="#f87171" stroke-opacity="0.5" stroke-dasharray="4 3"/>
    <circle cx="145" cy="196" r="7" fill="#f87171"/>
    <path d="M145 203 V226" stroke="#f87171" stroke-width="2"/>
    <text x="108" y="252" fill="#fca5a5" font-size="12">0 区 IPX7</text>
    <text x="108" y="272" fill="#fca5a5" font-size="12">1 区 IPX4+</text>

    <!-- 2区 -->
    <rect x="230" y="166" width="90" height="150" fill="#13253f" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="246" y="252" fill="#67e8f9" font-size="12">2 区</text>
    <text x="246" y="272" fill="#67e8f9" font-size="12">IPX4+</text>
    <text x="240" y="292" fill="#64748b" font-size="11">镜前灯</text>

    <!-- 区外 -->
    <rect x="340" y="166" width="82" height="150" fill="#0f1f35" stroke="#334155"/>
    <text x="352" y="252" fill="#94a3b8" font-size="12">2 区外</text>
    <text x="352" y="272" fill="#94a3b8" font-size="12">常规即可</text>

    <text x="68" y="344" fill="#fdba74" font-size="12">喷头正上方：IP44 只是刚够，建议直接上 IP65</text>
  </g>

  <!-- 右：五问 -->
  <g>
    <rect x="472" y="112" width="480" height="252" fill="#0d1e35" stroke="#1e3a5f" rx="8"/>
    <text x="496" y="140" fill="#94a3b8" font-size="13">下单前问客服这五句（答不上来就换一家）</text>

    <text x="496" y="172" fill="#22d3ee" font-size="12">01</text>
    <text x="524" y="172" fill="#e2e8f0" font-size="13">驱动防护怎么做的，开放板还是灌胶/独立防水壳？</text>

    <text x="496" y="200" fill="#22d3ee" font-size="12">02</text>
    <text x="524" y="200" fill="#e2e8f0" font-size="13">外壳是开孔散热，还是全封闭铝材导热？</text>

    <text x="496" y="228" fill="#22d3ee" font-size="12">03</text>
    <text x="524" y="228" fill="#e2e8f0" font-size="13">灯罩是亚克力还是 PC，有没有抗 UV 处理？</text>

    <text x="496" y="256" fill="#22d3ee" font-size="12">04</text>
    <text x="524" y="256" fill="#e2e8f0" font-size="13">密封圈是硅胶还是普通橡胶？</text>

    <text x="496" y="284" fill="#22d3ee" font-size="12">05</text>
    <text x="524" y="284" fill="#e2e8f0" font-size="13">装淋浴喷头正上方，你们建议哪个防护等级？</text>

    <path d="M496 302 H928" stroke="#1e3a5f" stroke-width="1"/>
    <text x="496" y="326" fill="#fbbf24" font-size="12">五问里只要有一问答不出来，说明他自己没做过结构验证。</text>
    <text x="496" y="348" fill="#64748b" font-size="12">不要问"防不防水"，这个词不是标准术语，问不出真东西。</text>
  </g>

  <!-- 底部：三测 -->
  <g>
    <rect x="48" y="388" width="904" height="176" fill="#101e33" stroke="#1e3a5f" rx="8"/>
    <text x="76" y="420" fill="#e2e8f0" font-size="15" font-weight="600">收货后三个动作，两分钟能做完</text>

    <g>
      <rect x="76" y="440" width="272" height="100" fill="#0d1e35" stroke="#1e3a5f" rx="6"/>
      <text x="94" y="468" fill="#22d3ee" font-size="13" font-weight="700">测一 · 滴水</text>
      <text x="94" y="494" fill="#e2e8f0" font-size="12">罩面滴水，摊平滑落 = 涂层有效</text>
      <text x="94" y="516" fill="#f87171" font-size="12">聚成珠 = 没做或已失效</text>
    </g>

    <g>
      <rect x="366" y="440" width="272" height="100" fill="#0d1e35" stroke="#1e3a5f" rx="6"/>
      <text x="384" y="468" fill="#22d3ee" font-size="13" font-weight="700">测二 · 按边</text>
      <text x="384" y="494" fill="#e2e8f0" font-size="12">沿灯罩边缘按一圈</text>
      <text x="384" y="516" fill="#f87171" font-size="12">能按出缝 = 密封不到位</text>
    </g>

    <g>
      <rect x="656" y="440" width="272" height="100" fill="#0d1e35" stroke="#1e3a5f" rx="6"/>
      <text x="674" y="468" fill="#22d3ee" font-size="13" font-weight="700">测三 · 开腔</text>
      <text x="674" y="494" fill="#e2e8f0" font-size="12">看驱动板是否灌胶、外壳是否开孔</text>
      <text x="674" y="516" fill="#4ade80" font-size="12">这条最准，也最少人做</text>
    </g>
  </g>

  <text x="952" y="604" fill="#334155" font-size="11" text-anchor="end">NEXLAMP · 浴室照明选型</text>
</svg>
