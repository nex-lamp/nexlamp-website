<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="500" fill="url(#bgGrad)"/>
  <rect width="680" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="340" y="45" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="2">3分钟频闪排查流程</text>
  <text x="340" y="70" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#8ba3c7">不用专业设备，按这个顺序找原因</text>

  <!-- Step 1 -->
  <rect x="240" y="100" width="200" height="70" rx="10" fill="#1a3a5c" stroke="#7ec27e" stroke-width="2" filter="url(#glow)"/>
  <text x="340" y="125" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Step 1：手机摄像头检测</text>
  <text x="340" y="145" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">对准灯光，看屏幕有无条纹</text>
  <text x="340" y="160" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">条纹越粗，频闪越严重</text>

  <!-- Arrow down -->
  <path d="M 340 175 L 340 195" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrowdown)"/>

  <!-- Step 2 -->
  <rect x="240" y="200" width="200" height="70" rx="10" fill="#1a3a5c" stroke="#7ec27e" stroke-width="2" filter="url(#glow)"/>
  <text x="340" y="225" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Step 2：低亮度观察</text>
  <text x="340" y="245" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">调到10%-20%亮度，盯30秒</text>
  <text x="340" y="260" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">眼睛发酸说明低亮度频闪</text>

  <!-- Arrow down -->
  <path d="M 340 275 L 340 295" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrowdown)"/>

  <!-- Step 3 -->
  <rect x="240" y="300" width="200" height="70" rx="10" fill="#1a3a5c" stroke="#7ec27e" stroke-width="2" filter="url(#glow)"/>
  <text x="340" y="325" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Step 3：换驱动/调光器对比</text>
  <text x="340" y="345" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">换一个好点的驱动或调光开关</text>
  <text x="340" y="360" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ba3c7">不闪了就能定位问题源头</text>

  <!-- Arrow split -->
  <path d="M 340 375 L 340 395" stroke="#7ec27e" stroke-width="2"/>
  <path d="M 340 395 L 180 395" stroke="#7ec27e" stroke-width="2"/>
  <path d="M 340 395 L 500 395" stroke="#7ec27e" stroke-width="2"/>
  <path d="M 180 395 L 180 415" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrowdown)"/>
  <path d="M 500 395 L 500 415" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrowdown)"/>

  <!-- Result left -->
  <rect x="80" y="420" width="200" height="60" rx="10" fill="#2a1a3a" stroke="#ff6b6b" stroke-width="2"/>
  <text x="180" y="445" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ff6b6b">换调光器后不闪</text>
  <text x="180" y="465" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">问题在调光开关</text>

  <!-- Result right -->
  <rect x="400" y="420" width="200" height="60" rx="10" fill="#1a3a2a" stroke="#7ec27e" stroke-width="2"/>
  <text x="500" y="445" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#7ec27e">换驱动后不闪</text>
  <text x="500" y="465" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">问题在驱动电源</text>

  <defs>
    <marker id="arrowdown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#7ec27e"/>
    </marker>
  </defs>

  <!-- Bottom note -->
  <text x="340" y="490" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#8ba3c7">定位清楚问题，再决定是换驱动还是换调光器，避免盲目投入</text>
</svg>