<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2038"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16263f" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fd1c5"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#grid)" opacity="0.7"/>
  <text x="52" y="62" fill="#e8f4ff" font-family="sans-serif" font-size="30" font-weight="bold">调光三段链路：哪一段没对上，灯就闪给你看</text>
  <text x="52" y="95" fill="#7fa6c8" font-family="sans-serif" font-size="17">面板输出 → 驱动能力 → 灯珠一致性；换灯带通常解决不了协议问题</text>

  <rect x="52" y="140" width="220" height="170" rx="12" fill="#10233c" stroke="#2f6f8f" stroke-width="2"/>
  <text x="72" y="176" fill="#4fd1c5" font-family="sans-serif" font-size="22" font-weight="bold">01 面板 / 控制器</text>
  <text x="72" y="212" fill="#d9e8f5" font-family="sans-serif" font-size="17">可控硅 · 0-10V</text>
  <text x="72" y="240" fill="#d9e8f5" font-family="sans-serif" font-size="17">DALI · PWM</text>
  <text x="72" y="278" fill="#7fa6c8" font-family="sans-serif" font-size="15">先确认输出的是哪一种</text>

  <rect x="340" y="140" width="220" height="170" rx="12" fill="#10233c" stroke="#4fd1c5" stroke-width="2" filter="url(#glow)"/>
  <text x="360" y="176" fill="#4fd1c5" font-family="sans-serif" font-size="22" font-weight="bold">02 驱动</text>
  <text x="360" y="212" fill="#d9e8f5" font-family="sans-serif" font-size="17">铭牌看调光方式</text>
  <text x="360" y="240" fill="#d9e8f5" font-family="sans-serif" font-size="17">最低负载 · 最低亮度</text>
  <text x="360" y="278" fill="#7fa6c8" font-family="sans-serif" font-size="15">调光曲线 · 频闪深度</text>

  <rect x="628" y="140" width="220" height="170" rx="12" fill="#10233c" stroke="#2f6f8f" stroke-width="2"/>
  <text x="648" y="176" fill="#4fd1c5" font-family="sans-serif" font-size="22" font-weight="bold">03 灯珠 / 灯具</text>
  <text x="648" y="212" fill="#d9e8f5" font-family="sans-serif" font-size="17">Ra ≥ 90 · R9 &gt; 50</text>
  <text x="648" y="240" fill="#d9e8f5" font-family="sans-serif" font-size="17">同空间 SDCM 一致</text>
  <text x="648" y="278" fill="#7fa6c8" font-family="sans-serif" font-size="15">双色温要两路输出</text>

  <line x1="276" y1="225" x2="334" y2="225" stroke="#4fd1c5" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="564" y1="225" x2="622" y2="225" stroke="#4fd1c5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="52" y="350" width="796" height="120" rx="12" fill="#0d1b2e" stroke="#24415e" stroke-width="1.5"/>
  <text x="76" y="386" fill="#f6ad55" font-family="sans-serif" font-size="20" font-weight="bold">最暗闪 / 跳档：先查协议，再查驱动最低负载</text>
  <text x="76" y="420" fill="#c7d8e8" font-family="sans-serif" font-size="17">可控硅调光器配非对应驱动 → 闪烁、范围窄、甚至不亮</text>
  <text x="76" y="452" fill="#c7d8e8" font-family="sans-serif" font-size="17">靠调低电压变暗 → 偏离额定工作点，效率下降、发热增加</text>
</svg>
