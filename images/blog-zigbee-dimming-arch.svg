<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0a1628"/>

  <!-- Grid -->
  <g stroke="#1a2a40" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="560" y1="0" x2="560" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
  </g>

  <!-- Title bar -->
  <rect x="20" y="15" width="760" height="34" rx="6" fill="#0f2035" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="38" cy="32" r="6" fill="#ff4757"/>
  <circle cx="56" cy="32" r="6" fill="#ffa502"/>
  <circle cx="74" cy="32" r="6" fill="#2ed573"/>
  <text x="400" y="37" font-family="'Courier New', monospace" font-size="14" fill="#00d4ff" text-anchor="middle" filter="url(#glow4)">Zigbee 智能调光系统架构</text>

  <!-- Internet cloud (top right) -->
  <ellipse cx="680" cy="80" rx="60" ry="28" fill="#0f2035" stroke="#3a5a80" stroke-width="1.5"/>
  <text x="680" y="77" font-family="'Courier New', monospace" font-size="10" fill="#4a8ab0" text-anchor="middle">云端</text>
  <text x="680" y="90" font-family="'Courier New', monospace" font-size="10" fill="#4a8ab0" text-anchor="middle">涂鸦 / 米家</text>

  <!-- Phone (top right) -->
  <rect x="730" y="160" width="44" height="72" rx="6" fill="#0f2035" stroke="#2ed573" stroke-width="1.5"/>
  <rect x="735" y="168" width="34" height="50" rx="2" fill="#0a2040"/>
  <text x="752" y="232" font-family="'Courier New', monospace" font-size="8" fill="#2ed573" text-anchor="middle">APP</text>
  <text x="752" y="193" font-family="'Courier New', monospace" font-size="8" fill="#2ed573" text-anchor="middle" filter="url(#glow4)">手机</text>

  <!-- Connection phone to cloud -->
  <line x1="752" y1="160" x2="710" y2="108" stroke="#2ed573" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Connection cloud to hub -->
  <line x1="635" y1="90" x2="455" y2="245" stroke="#4a8ab0" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Hub center -->
  <circle cx="400" cy="255" r="55" fill="url(#hub-glow)"/>
  <circle cx="400" cy="255" r="38" fill="#0f2035" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow4)"/>
  <text x="400" y="250" font-family="'Courier New', monospace" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold" filter="url(#glow4)">Zigbee</text>
  <text x="400" y="265" font-family="'Courier New', monospace" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">Hub</text>

  <!-- Mesh connections (dashed radio waves) -->
  <circle cx="400" cy="255" r="70" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="3,5" stroke-opacity="0.3"/>
  <circle cx="400" cy="255" r="95" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="3,5" stroke-opacity="0.2"/>
  <circle cx="400" cy="255" r="120" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="3,5" stroke-opacity="0.12"/>

  <!-- Light node 1 (top left) -->
  <line x1="400" y1="255" x2="160" y2="130" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="160" cy="130" r="28" fill="#0f2035" stroke="#ffa502" stroke-width="2" filter="url(#glow4)"/>
  <circle cx="160" cy="118" r="10" fill="#ffa502" fill-opacity="0.9" filter="url(#glow4)"/>
  <text x="160" y="138" font-family="'Courier New', monospace" font-size="9" fill="#ffa502" text-anchor="middle">筒灯</text>
  <text x="160" y="150" font-family="'Courier New', monospace" font-size="8" fill="#4a6080" text-anchor="middle">NEX3-95TD</text>

  <!-- Light node 2 (top) -->
  <line x1="400" y1="255" x2="320" y2="110" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="320" cy="110" r="28" fill="#0f2035" stroke="#ffa502" stroke-width="2" filter="url(#glow4)"/>
  <circle cx="320" cy="98" r="10" fill="#ffa502" fill-opacity="0.9" filter="url(#glow4)"/>
  <text x="320" y="118" font-family="'Courier New', monospace" font-size="9" fill="#ffa502" text-anchor="middle">射灯</text>
  <text x="320" y="130" font-family="'Courier New', monospace" font-size="8" fill="#4a6080" text-anchor="middle">NEX4-75SD</text>

  <!-- Light node 3 (top right) -->
  <line x1="400" y1="255" x2="480" y2="110" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="480" cy="110" r="28" fill="#0f2035" stroke="#ffa502" stroke-width="2" filter="url(#glow4)"/>
  <circle cx="480" cy="98" r="10" fill="#ffa502" fill-opacity="0.9" filter="url(#glow4)"/>
  <text x="480" y="118" font-family="'Courier New', monospace" font-size="9" fill="#ffa502" text-anchor="middle">吊灯</text>
  <text x="480" y="130" font-family="'Courier New', monospace" font-size="8" fill="#4a6080" text-anchor="middle">0-10V驱动</text>

  <!-- Light node 4 (left) -->
  <line x1="400" y1="255" x2="200" y2="300" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="200" cy="300" r="28" fill="#0f2035" stroke="#a29bfe" stroke-width="2" filter="url(#glow4)"/>
  <text x="200" y="294" font-family="'Courier New', monospace" font-size="9" fill="#a29bfe" text-anchor="middle">传感器</text>
  <text x="200" y="307" font-family="'Courier New', monospace" font-size="8" fill="#4a6080" text-anchor="middle">人体感应</text>

  <!-- Light node 5 (bottom left) -->
  <line x1="400" y1="255" x2="240" y2="395" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="240" cy="395" r="28" fill="#0f2035" stroke="#2ed573" stroke-width="2" filter="url(#glow4)"/>
  <text x="240" y="389" font-family="'Courier New', monospace" font-size="9" fill="#2ed573" text-anchor="middle">开关面板</text>
  <text x="240" y="402" font-family="'Courier New', monospace" font-size="8" fill="#4a6080" text-anchor="middle">Zigbee开关</text>

  <!-- Light node 6 (bottom right) -->
  <line x1="400" y1="255" x2="570" y2="390" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="570" cy="390" r="28" fill="#0f2035" stroke="#ffa502" stroke-width="2" filter="url(#glow4)"/>
  <circle cx="570" cy="378" r="10" fill="#ffa502" fill-opacity="0.9" filter="url(#glow4)"/>
  <text x="570" y="398" font-family="'Courier New', monospace" font-size="9" fill="#ffa502" text-anchor="middle">灯带</text>
  <text x="570" y="410" font-family="'Courier New', monospace" font-size="8" fill="#4a6080" text-anchor="middle">RGBWW</text>

  <!-- Light node 7 (right) -->
  <line x1="400" y1="255" x2="590" y2="255" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <circle cx="617" cy="255" r="28" fill="#0f2035" stroke="#ff4757" stroke-width="2" filter="url(#glow4)"/>
  <text x="617" y="249" font-family="'Courier New', monospace" font-size="9" fill="#ff4757" text-anchor="middle">路由器</text>
  <text x="617" y="262" font-family="'Courier New', monospace" font-size="8" fill="#4a6080" text-anchor="middle">中继设备</text>

  <!-- Mesh indicator text -->
  <text x="65" y="255" font-family="'Courier New', monospace" font-size="10" fill="#3a5a80" text-anchor="middle">Mesh</text>
  <text x="65" y="268" font-family="'Courier New', monospace" font-size="10" fill="#3a5a80" text-anchor="middle">自组网</text>
  <text x="65" y="281" font-family="'Courier New', monospace" font-size="10" fill="#3a5a80" text-anchor="middle">自愈合</text>

  <!-- Signal protocol label -->
  <rect x="430" y="165" width="120" height="26" rx="4" fill="#0f2035" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="490" y="183" font-family="'Courier New', monospace" font-size="10" fill="#00d4ff" text-anchor="middle">2.4GHz Zigbee</text>

  <!-- Footer -->
  <text x="400" y="465" font-family="'Courier New', monospace" font-size="9" fill="#2a3a50" text-anchor="middle">nexlamp.com | Smart Lighting Technology</text>
</svg>
