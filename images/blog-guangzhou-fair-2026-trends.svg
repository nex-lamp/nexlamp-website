  <!-- Bottom bar -->
  <rect x="20" y="398" width="640" height="14" rx="3" fill="#0d1a30" opacity="0.7"/>
  <text x="340" y="409" fill="#4a9eff" font-family="Consolas,monospace" font-size="9" text-anchor="middle">技术驱动 → 价值驱动 | 行业成熟信号：稳定性 &amp; 易用性 &gt; 参数表 | Nexlamp 2026</text>
