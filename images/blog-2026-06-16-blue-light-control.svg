<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="specLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="20%" stop-color="#2196f3"/>
      <stop offset="45%" stop-color="#4caf50"/>
      <stop offset="60%" stop-color="#ffeb3b"/>
      <stop offset="80%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f44336"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">蓝光控制：低色温 ≠ 低蓝光</text>
  <text x="400" y="55" text-anchor="middle" fill="#8899bb" font-size="12">Blue Light Control: Low CCT Does Not Mean Low Blue Light</text>
  <!-- Spectrum chart -->
  <g transform="translate(60,70)">
    <!-- Axes -->
    <line x1="0" y1="200" x2="680" y2="200" stroke="#445566" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="#445566" stroke-width="1"/>
    <!-- Wavelength labels -->
    <text x="0" y="218" text-anchor="middle" fill="#6688aa" font-size="9">380</text>
    <text x="97" y="218" text-anchor="middle" fill="#6688aa" font-size="9">430</text>
    <text x="194" y="218" text-anchor="middle" fill="#6688aa" font-size="9">480</text>
    <text x="291" y="218" text-anchor="middle" fill="#6688aa" font-size="9">530</text>
    <text x="388" y="218" text-anchor="middle" fill="#6688aa" font-size="9">580</text>
    <text x="485" y="218" text-anchor="middle" fill="#6688aa" font-size="9">630</text>
    <text x="582" y="218" text-anchor="middle" fill="#6688aa" font-size="9">680</text>
    <text x="680" y="218" text-anchor="middle" fill="#6688aa" font-size="9">730nm</text>
    <text x="340" y="238" text-anchor="middle" fill="#8899bb" font-size="10">波长 (nm)</text>
    <!-- Blue light danger zone -->
    <rect x="30" y="0" width="120" height="200" rx="0" fill="#2196f3" opacity="0.06"/>
    <text x="90" y="15" text-anchor="middle" fill="#2196f3" font-size="9" opacity="0.6">蓝光区域</text>
    <!-- Spectrum 1: Dual-channel dimming (just reduces brightness, blue peak remains) -->
    <text x="0" y="-8" fill="#ff5252" font-size="11" font-weight="bold">❌ 双通道调暗冷白 = 蓝光比例未降</text>
    <path d="M 0,200 L 20,195 L 40,180 L 55,60 L 70,180 L 90,190 L 120,185 L 160,175 L 200,170 L 240,165 L 280,155 L 320,145 L 360,135 L 400,130 L 440,125 L 480,140 L 520,155 L 560,170 L 600,185 L 640,195 L 680,200" fill="none" stroke="#ff5252" stroke-width="2" opacity="0.8"/>
    <!-- Blue peak annotation -->
    <line x1="55" y1="60" x2="55" y2="40" stroke="#ff5252" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="55" y="35" text-anchor="middle" fill="#ff5252" font-size="9">450nm</text>
    <text x="55" y="48" text-anchor="middle" fill="#ff5252" font-size="8">蓝光峰值仍在!</text>
    <!-- Fill under curve -->
    <path d="M 0,200 L 20,195 L 40,180 L 55,60 L 70,180 L 90,190 L 120,185 L 160,175 L 200,170 L 240,165 L 280,155 L 320,145 L 360,135 L 400,130 L 440,125 L 480,140 L 520,155 L 560,170 L 600,185 L 640,195 L 680,200 Z" fill="#ff5252" opacity="0.08"/>
  </g>
  <!-- Spectrum 2: 3-channel with amber -->
  <g transform="translate(60,290)">
    <text x="0" y="-5" fill="#4caf50" font-size="11" font-weight="bold">✓ 三通道 + 琥珀LED = 真正降低蓝光比例</text>
    <!-- Axes -->
    <line x1="0" y1="120" x2="680" y2="120" stroke="#445566" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="#445566" stroke-width="1"/>
    <!-- Blue light zone reduced -->
    <rect x="30" y="0" width="120" height="120" rx="0" fill="#4caf50" opacity="0.04"/>
    <!-- 3-channel spectrum -->
    <path d="M 0,120 L 20,118 L 40,112 L 55,95 L 70,110 L 90,115 L 120,112 L 160,105 L 200,95 L 240,80 L 280,65 L 320,55 L 340,45 L 360,38 L 400,30 L 440,35 L 480,55 L 520,75 L 560,95 L 600,110 L 640,118 L 680,120" fill="none" stroke="#4caf50" stroke-width="2" opacity="0.8"/>
    <!-- Fill -->
    <path d="M 0,120 L 20,118 L 40,112 L 55,95 L 70,110 L 90,115 L 120,112 L 160,105 L 200,95 L 240,80 L 280,65 L 320,55 L 340,45 L 360,38 L 400,30 L 440,35 L 480,55 L 520,75 L 560,95 L 600,110 L 640,118 L 680,120 Z" fill="#4caf50" opacity="0.1"/>
    <!-- Amber peak annotation -->
    <line x1="400" y1="30" x2="400" y2="12" stroke="#ffc107" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="400" y="8" text-anchor="middle" fill="#ffc107" font-size="9">610nm 琥珀补偿</text>
    <!-- Blue reduced annotation -->
    <text x="55" y="88" text-anchor="middle" fill="#4caf50" font-size="8">蓝光↓</text>
  </g>
  <!-- Legend box -->
  <g transform="translate(520,75)">
    <rect x="0" y="0" width="200" height="110" rx="8" fill="#111827" stroke="#334466" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">关键结论</text>
    <line x1="10" y1="28" x2="190" y2="28" stroke="#334466" stroke-width="0.5"/>
    <circle cx="20" cy="45" r="5" fill="#ff5252"/>
    <text x="32" y="49" fill="#aabbcc" font-size="10">双通道仅调亮度</text>
    <circle cx="20" cy="68" r="5" fill="#4caf50"/>
    <text x="32" y="72" fill="#aabbcc" font-size="10">三通道+琥珀真正控蓝光</text>
    <text x="100" y="95" text-anchor="middle" fill="#ffc107" font-size="10">节律照明核心在驱动</text>
  </g>
  <!-- Footer -->
  <text x="400" y="440" text-anchor="middle" fill="#556688" font-size="10">NEXLAMP — 三通道独立恒流驱动，从光谱层面实现真正的蓝光控制</text>
</svg>
