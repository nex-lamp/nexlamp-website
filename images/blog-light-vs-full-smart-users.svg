<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Consolas','Microsoft YaHei',monospace">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f1d32"/>
    </linearGradient>
    <filter id="glowB">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridB" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e3a5f" stroke-width="0.25" opacity="0.4"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="900" height="520" rx="8" fill="url(#bgB)"/>
  <rect width="900" height="520" rx="8" fill="url(#gridB)"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="46" fill="#0d1b2a" opacity="0.8"/>
  <rect x="0" y="42" width="900" height="3" fill="#a78bfa" opacity="0.3"/>
  <text x="450" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0" letter-spacing="2">适用人群与场景映射 · USER SCENARIO MATRIX</text>

  <!-- Row 1: 租房青年 -->
  <rect x="30" y="65" width="840" height="100" rx="6" fill="#0d1b2a" stroke="#22d3ee" stroke-width="0.8" opacity="0.5"/>
  <!-- Avatar circle -->
  <circle cx="80" cy="115" r="28" fill="none" stroke="#22d3ee" stroke-width="1.5" filter="url(#glowB)" opacity="0.7"/>
  <text x="80" y="112" text-anchor="middle" font-size="18" fill="#22d3ee">🏠</text>
  <text x="80" y="128" text-anchor="middle" font-size="8" fill="#94a3b8">RENT</text>
  <!-- Info -->
  <text x="125" y="90" font-size="13" font-weight="bold" fill="#22d3ee">租房青年</text>
  <text x="125" y="110" font-size="10" fill="#94a3b8">场景：小户型/临时住所 · 预算：500-2000元 · 决策周期：1天</text>
  <!-- Tags -->
  <rect x="125" y="120" width="70" height="18" rx="9" fill="#22d3ee" opacity="0.15"/>
  <text x="160" y="133" text-anchor="middle" font-size="9" fill="#22d3ee">即插即用</text>
  <rect x="205" y="120" width="70" height="18" rx="9" fill="#22d3ee" opacity="0.15"/>
  <text x="240" y="133" text-anchor="middle" font-size="9" fill="#22d3ee">可迁移</text>
  <rect x="285" y="120" width="85" height="18" rx="9" fill="#22d3ee" opacity="0.15"/>
  <text x="327" y="133" text-anchor="middle" font-size="9" fill="#22d3ee">无需施工</text>
  <!-- Recommendation -->
  <rect x="680" y="88" width="175" height="40" rx="4" fill="#22d3ee" opacity="0.1" stroke="#22d3ee" stroke-width="0.8"/>
  <text x="767" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">推荐：轻智能 ★★★★★</text>
  <text x="767" y="122" text-anchor="middle" font-size="9" fill="#64748b">全屋智能 ★☆☆☆☆</text>

  <!-- Row 2: 新房装修 -->
  <rect x="30" y="180" width="840" height="100" rx="6" fill="#0d1b2a" stroke="#a78bfa" stroke-width="0.8" opacity="0.5"/>
  <circle cx="80" cy="230" r="28" fill="none" stroke="#a78bfa" stroke-width="1.5" filter="url(#glowB)" opacity="0.7"/>
  <text x="80" y="227" text-anchor="middle" font-size="18" fill="#a78bfa">🏡</text>
  <text x="80" y="243" text-anchor="middle" font-size="8" fill="#94a3b8">NEW</text>
  <text x="125" y="205" font-size="13" font-weight="bold" fill="#a78bfa">新房装修业主</text>
  <text x="125" y="225" font-size="10" fill="#94a3b8">场景：自住房/长期居住 · 预算：1-5万元 · 决策周期：1-3月</text>
  <rect x="125" y="235" width="70" height="18" rx="9" fill="#a78bfa" opacity="0.15"/>
  <text x="160" y="248" text-anchor="middle" font-size="9" fill="#a78bfa">场景联动</text>
  <rect x="205" y="235" width="70" height="18" rx="9" fill="#a78bfa" opacity="0.15"/>
  <text x="240" y="248" text-anchor="middle" font-size="9" fill="#a78bfa">品质生活</text>
  <rect x="285" y="235" width="85" height="18" rx="9" fill="#a78bfa" opacity="0.15"/>
  <text x="327" y="248" text-anchor="middle" font-size="9" fill="#a78bfa">一步到位</text>
  <rect x="680" y="203" width="175" height="40" rx="4" fill="#a78bfa" opacity="0.1" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="767" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#a78bfa">推荐：全屋智能 ★★★★★</text>
  <text x="767" y="237" text-anchor="middle" font-size="9" fill="#64748b">轻智能 ★★★☆☆</text>

  <!-- Row 3: 科技爱好者 -->
  <rect x="30" y="295" width="840" height="100" rx="6" fill="#0d1b2a" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>
  <circle cx="80" cy="345" r="28" fill="none" stroke="#34d399" stroke-width="1.5" filter="url(#glowB)" opacity="0.7"/>
  <text x="80" y="342" text-anchor="middle" font-size="18" fill="#34d399">⚡</text>
  <text x="80" y="358" text-anchor="middle" font-size="8" fill="#94a3b8">GEEK</text>
  <text x="125" y="320" font-size="13" font-weight="bold" fill="#34d399">科技爱好者/DIY玩家</text>
  <text x="125" y="340" font-size="10" fill="#94a3b8">场景：极客改造/技术探索 · 预算：灵活 · 决策周期：持续迭代</text>
  <rect x="125" y="350" width="70" height="18" rx="9" fill="#34d399" opacity="0.15"/>
  <text x="160" y="363" text-anchor="middle" font-size="9" fill="#34d399">可定制</text>
  <rect x="205" y="350" width="70" height="18" rx="9" fill="#34d399" opacity="0.15"/>
  <text x="240" y="363" text-anchor="middle" font-size="9" fill="#34d399">开源兼容</text>
  <rect x="285" y="350" width="85" height="18" rx="9" fill="#34d399" opacity="0.15"/>
  <text x="327" y="363" text-anchor="middle" font-size="9" fill="#34d399">逐步扩展</text>
  <rect x="680" y="318" width="175" height="40" rx="4" fill="#34d399" opacity="0.1" stroke="#34d399" stroke-width="0.8"/>
  <text x="767" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#34d399">推荐：轻智能起步</text>
  <text x="767" y="352" text-anchor="middle" font-size="9" fill="#34d399">渐进升级全屋 ★★★★☆</text>

  <!-- Row 4: 商业空间 -->
  <rect x="30" y="410" width="840" height="100" rx="6" fill="#0d1b2a" stroke="#fb923c" stroke-width="0.8" opacity="0.5"/>
  <circle cx="80" cy="460" r="28" fill="none" stroke="#fb923c" stroke-width="1.5" filter="url(#glowB)" opacity="0.7"/>
  <text x="80" y="457" text-anchor="middle" font-size="18" fill="#fb923c">🏢</text>
  <text x="80" y="473" text-anchor="middle" font-size="8" fill="#94a3b8">BIZ</text>
  <text x="125" y="435" font-size="13" font-weight="bold" fill="#fb923c">酒店/办公商业空间</text>
  <text x="125" y="455" font-size="10" fill="#94a3b8">场景：批量管理/节能合规 · 预算：5万+ · 决策周期：3-6月</text>
  <rect x="125" y="465" width="70" height="18" rx="9" fill="#fb923c" opacity="0.15"/>
  <text x="160" y="478" text-anchor="middle" font-size="9" fill="#fb923c">集中管控</text>
  <rect x="205" y="465" width="70" height="18" rx="9" fill="#fb923c" opacity="0.15"/>
  <text x="240" y="478" text-anchor="middle" font-size="9" fill="#fb923c">节能合规</text>
  <rect x="285" y="465" width="85" height="18" rx="9" fill="#fb923c" opacity="0.15"/>
  <text x="327" y="478" text-anchor="middle" font-size="9" fill="#fb923c">运维可管</text>
  <rect x="680" y="433" width="175" height="40" rx="4" fill="#fb923c" opacity="0.1" stroke="#fb923c" stroke-width="0.8"/>
  <text x="767" y="451" text-anchor="middle" font-size="11" font-weight="bold" fill="#fb923c">推荐：全屋智能 ★★★★★</text>
  <text x="767" y="467" text-anchor="middle" font-size="9" fill="#64748b">轻智能 ★★☆☆☆</text>

  <!-- Footer -->
  <rect x="0" y="490" width="900" height="30" fill="#0d1b2a" opacity="0.6"/>
  <text x="450" y="508" text-anchor="middle" font-size="9" fill="#475569">Nexlamp · 适用人群场景矩阵</text>
</svg>