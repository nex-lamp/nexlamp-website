<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="900" height="520" fill="url(#bgGrad2)"/>
  <rect width="900" height="520" fill="url(#grid2)"/>

  <!-- Terminal window -->
  <rect x="30" y="25" width="840" height="470" rx="8" fill="#0c1d2e" stroke="#2478c2" stroke-width="1.5" opacity="0.9"/>
  <rect x="30" y="25" width="840" height="36" rx="8" fill="#142a42" stroke="#2478c2" stroke-width="1.5"/>
  <circle cx="56" cy="43" r="6" fill="#ff5f56"/>
  <circle cx="78" cy="43" r="6" fill="#ffbd2e"/>
  <circle cx="100" cy="43" r="6" fill="#27c93f"/>
  <text x="450" y="49" font-family="Consolas, monospace" font-size="14" fill="#7ec27e" text-anchor="middle" font-weight="bold">root@nexlamp:~# solar_driver --checklist</text>

  <!-- Title -->
  <text x="450" y="100" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold" filter="url(#glow2)">太阳能LED驱动选型：5个硬指标</text>

  <!-- Checklist items -->
  <g transform="translate(70, 130)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="370" height="70" rx="8" fill="#142a42" stroke="#f4a261" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="30" cy="35" r="14" fill="#f4a261"/>
    <text x="30" y="40" font-family="Consolas, monospace" font-size="14" fill="#0a1628" text-anchor="middle" font-weight="bold">1</text>
    <text x="60" y="25" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#f4a261" font-weight="bold">输入电压范围足够宽</text>
    <text x="60" y="45" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">最低输入 &lt; 电池放电截止电压，留10%余量</text>
    <text x="60" y="62" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">12V系统需覆盖10V~13V以上</text>

    <!-- Item 2 -->
    <rect x="0" y="85" width="370" height="70" rx="8" fill="#142a42" stroke="#7ec27e" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="30" cy="120" r="14" fill="#7ec27e"/>
    <text x="30" y="125" font-family="Consolas, monospace" font-size="14" fill="#0a1628" text-anchor="middle" font-weight="bold">2</text>
    <text x="60" y="110" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#7ec27e" font-weight="bold">真恒流输出，不是恒压</text>
    <text x="60" y="130" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">恒流精度±3%以内，电流波动影响光衰</text>
    <text x="60" y="147" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">1%-100%调光无频闪</text>

    <!-- Item 3 -->
    <rect x="0" y="170" width="370" height="70" rx="8" fill="#142a42" stroke="#64b5f6" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="30" cy="205" r="14" fill="#64b5f6"/>
    <text x="30" y="210" font-family="Consolas, monospace" font-size="14" fill="#0a1628" text-anchor="middle" font-weight="bold">3</text>
    <text x="60" y="195" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#64b5f6" font-weight="bold">效率直接决定续航</text>
    <text x="60" y="215" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">大功率路灯建议≥90%，小功率≥85%</text>
    <text x="60" y="232" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">效率从85%提到93%，续航多约10%</text>

    <!-- Item 4 -->
    <rect x="0" y="255" width="370" height="70" rx="8" fill="#142a42" stroke="#a78bfa" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="30" cy="290" r="14" fill="#a78bfa"/>
    <text x="30" y="295" font-family="Consolas, monospace" font-size="14" fill="#0a1628" text-anchor="middle" font-weight="bold">4</text>
    <text x="60" y="280" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#a78bfa" font-weight="bold">防护等级是户外生死线</text>
    <text x="60" y="300" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">防水IP66/IP67，防雷6kV/4kV起</text>
    <text x="60" y="317" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">工作温度-40℃~+70℃</text>

    <!-- Item 5 -->
    <rect x="0" y="340" width="370" height="70" rx="8" fill="#142a42" stroke="#ff6b6b" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="30" cy="375" r="14" fill="#ff6b6b"/>
    <text x="30" y="380" font-family="Consolas, monospace" font-size="14" fill="#0a1628" text-anchor="middle" font-weight="bold">5</text>
    <text x="60" y="365" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#ff6b6b" font-weight="bold">调光协议匹配控制器</text>
    <text x="60" y="385" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">0-10V/PWM/DALI/D4i/Zigbee/Matter</text>
    <text x="60" y="402" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#e0e0e0">分时段调光是智慧路灯刚需</text>
  </g>

  <!-- Right radar chart -->
  <g transform="translate(540, 160)">
    <!-- Radar background -->
    <polygon points="180,20 330,110 270,290 90,290 30,110" fill="none" stroke="#1a3a5c" stroke-width="1"/>
    <polygon points="180,55 292,120 250,245 110,245 68,120" fill="none" stroke="#1a3a5c" stroke-width="1"/>
    <polygon points="180,90 255,130 230,200 130,200 105,130" fill="none" stroke="#1a3a5c" stroke-width="1"/>
    <line x1="180" y1="20" x2="180" y2="290" stroke="#1a3a5c" stroke-width="1"/>
    <line x1="330" y1="110" x2="30" y2="110" stroke="#1a3a5c" stroke-width="1"/>
    <line x1="270" y1="290" x2="90" y2="20" stroke="#1a3a5c" stroke-width="1"/>
    <line x1="90" y1="290" x2="270" y2="20" stroke="#1a3a5c" stroke-width="1"/>
    <line x1="30" y1="110" x2="330" y2="110" stroke="#1a3a5c" stroke-width="1"/>

    <!-- Data polygon -->
    <polygon points="180,40 305,115 255,260 105,260 55,115" fill="#7ec27e" fill-opacity="0.25" stroke="#7ec27e" stroke-width="2" filter="url(#glow2)"/>

    <!-- Labels -->
    <text x="180" y="12" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#f4a261" text-anchor="middle" font-weight="bold">宽压输入</text>
    <text x="345" y="115" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#7ec27e" text-anchor="start" font-weight="bold">恒流精度</text>
    <text x="285" y="310" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#64b5f6" text-anchor="middle" font-weight="bold">高效率</text>
    <text x="75" y="310" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="bold">防护等级</text>
    <text x="15" y="115" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#ff6b6b" text-anchor="end" font-weight="bold">调光协议</text>
  </g>

  <!-- Bottom summary -->
  <rect x="480" y="340" width="340" height="130" rx="8" fill="#1a3a5c" stroke="#2478c2" stroke-width="1"/>
  <text x="650" y="370" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">选型口诀</text>
  <text x="650" y="400" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="middle">宽压恒流是底线，效率防护不能省</text>
  <text x="650" y="425" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="middle">协议匹配控制器，户外先看IP防雷</text>
  <text x="650" y="450" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#7ec27e" text-anchor="middle">离网系统每一瓦都值钱</text>
</svg>