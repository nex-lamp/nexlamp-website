<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102039"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14294a"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <filter id="glowA" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="520" fill="url(#bgA)"/>
  <g stroke="#1b3355" stroke-width="1" opacity="0.65">
    <line x1="0" y1="65" x2="680" y2="65"/><line x1="0" y1="130" x2="680" y2="130"/>
    <line x1="0" y1="195" x2="680" y2="195"/><line x1="0" y1="260" x2="680" y2="260"/>
    <line x1="0" y1="325" x2="680" y2="325"/><line x1="0" y1="390" x2="680" y2="390"/>
    <line x1="0" y1="455" x2="680" y2="455"/>
    <line x1="136" y1="0" x2="136" y2="520"/><line x1="272" y1="0" x2="272" y2="520"/>
    <line x1="408" y1="0" x2="408" y2="520"/><line x1="544" y1="0" x2="544" y2="520"/>
  </g>

  <text x="34" y="42" fill="#66d9ef" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" filter="url(#glowA)">两条路线：传感器塞进灯里，还是单独买</text>
  <text x="34" y="66" fill="#7d94b5" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">"感知人"和"照亮人"本来就是两个模块，合不合，是买法问题</text>

  <rect x="34" y="88" width="288" height="52" rx="8" fill="url(#cardL)" stroke="#2e5c8a"/>
  <text x="52" y="112" fill="#e8f1fb" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700">A · 集成"人在灯"</text>
  <text x="52" y="132" fill="#8fb3d9" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">灯体里自带雷达/红外 + 灯控</text>

  <rect x="358" y="88" width="288" height="52" rx="8" fill="url(#cardR)" stroke="#2e5c8a"/>
  <text x="376" y="112" fill="#e8f1fb" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700">B · 普通灯 + 独立传感器</text>
  <text x="376" y="132" fill="#8fb3d9" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">传感器单买，逻辑自己写</text>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5">
    <text x="34" y="182" fill="#7d94b5" font-size="12.5">对比项</text>
    <text x="34" y="228" fill="#7d94b5" font-size="12.5">网关 / 联网</text>
    <text x="34" y="274" fill="#7d94b5" font-size="12.5">感应位置</text>
    <text x="34" y="320" fill="#7d94b5" font-size="12.5">联动逻辑</text>
    <text x="34" y="366" fill="#7d94b5" font-size="12.5">坏一个</text>
    <text x="34" y="412" fill="#7d94b5" font-size="12.5">过保之后</text>
    <text x="34" y="458" fill="#7d94b5" font-size="12.5">总成本</text>

    <text x="150" y="182" fill="#66d9ef" font-size="13" font-weight="700">集成"人在灯"</text>
    <text x="150" y="228" fill="#cfe2f5">少一层，靠灯自己的模组</text>
    <text x="150" y="274" fill="#cfe2f5">跟着灯走，位置由灯定</text>
    <text x="150" y="320" fill="#ffb86c">被灯固件绑住，多靠自带</text>
    <text x="150" y="366" fill="#ffb86c">多一个坏点，可能整灯返修</text>
    <text x="150" y="412" fill="#ffb86c">下架 = 没有配件通道</text>
    <text x="150" y="458" fill="#cfe2f5">灯价里已含，看溢价</text>

    <text x="474" y="182" fill="#a6e3a1" font-size="13" font-weight="700">普通灯 + 独立传感器</text>
    <text x="474" y="228" fill="#cfe2f5">多一台设备、一次配对</text>
    <text x="474" y="274" fill="#a6e3a1">自己挑位置，能挪能换</text>
    <text x="474" y="320" fill="#a6e3a1">条件更自由，可自己写</text>
    <text x="474" y="366" fill="#a6e3a1">坏哪个换哪个</text>
    <text x="474" y="412" fill="#a6e3a1">传感器单独换，灯照用</text>
    <text x="474" y="458" fill="#cfe2f5">灯便宜 + 传感器单算</text>
  </g>

  <line x1="34" y1="196" x2="646" y2="196" stroke="#20405f" stroke-width="1"/>
  <line x1="34" y1="242" x2="646" y2="242" stroke="#16304a" stroke-width="1"/>
  <line x1="34" y1="288" x2="646" y2="288" stroke="#16304a" stroke-width="1"/>
  <line x1="34" y1="334" x2="646" y2="334" stroke="#16304a" stroke-width="1"/>
  <line x1="34" y1="380" x2="646" y2="380" stroke="#16304a" stroke-width="1"/>
  <line x1="34" y1="426" x2="646" y2="426" stroke="#16304a" stroke-width="1"/>
  <line x1="34" y1="472" x2="646" y2="472" stroke="#20405f" stroke-width="1"/>

  <rect x="34" y="484" width="612" height="26" rx="6" fill="#0b2036" stroke="#2b5a86"/>
  <text x="46" y="502" fill="#8fd6c8" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">真正想清楚的是两件事：感应位置能不能自由，坏了以后能不能只换一个。</text>
</svg>
