<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2478C2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2478C2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec27e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7ec27e" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="420" fill="url(#bgGrad)"/>
  
  <!-- Grid -->
  <g stroke="#1a2a4a" stroke-width="0.3" opacity="0.5">
    <line x1="0" y1="70" x2="680" y2="70"/><line x1="0" y1="140" x2="680" y2="140"/>
    <line x1="0" y1="210" x2="680" y2="210"/><line x1="0" y1="280" x2="680" y2="280"/>
    <line x1="0" y1="350" x2="680" y2="350"/>
    <line x1="170" y1="0" x2="170" y2="420"/><line x1="340" y1="0" x2="340" y2="420"/>
    <line x1="510" y1="0" x2="510" y2="420"/>
  </g>

  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" filter="url(#neon)">智能开关 vs 智能灯：核心差异对比</text>
  <line x1="140" y1="48" x2="540" y2="48" stroke="#2478C2" stroke-width="1" opacity="0.6"/>

  <!-- Left Panel: Smart Switch -->
  <rect x="30" y="70" width="295" height="160" rx="8" fill="#0d1b33" stroke="#2478C2" stroke-width="1" opacity="0.9"/>
  <rect x="30" y="70" width="295" height="30" rx="8" fill="#2478C2" opacity="0.15"/>
  <text x="177" y="90" text-anchor="middle" fill="#2478C2" font-family="monospace" font-size="14" font-weight="bold" filter="url(#neon)">⚡ 智能开关方案</text>

  <!-- Switch icon area -->
  <rect x="50" y="110" width="60" height="50" rx="5" fill="#1a2a4a" stroke="#2478C2" stroke-width="0.8"/>
  <text x="80" y="130" text-anchor="middle" fill="#2478C2" font-family="monospace" font-size="9">ON/OFF</text>
  <text x="80" y="148" text-anchor="middle" fill="#4478a2" font-family="monospace" font-size="7">Zigbee</text>

  <!-- Arrow -->
  <line x1="115" y1="135" x2="145" y2="135" stroke="#2478C2" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2478C2"/></marker></defs>

  <!-- Bulb icon area -->
  <rect x="150" y="110" width="50" height="50" rx="5" fill="#1a2a4a" stroke="#666" stroke-width="0.8"/>
  <text x="175" y="130" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">普通</text>
  <text x="175" y="148" text-anchor="middle" fill="#666" font-family="monospace" font-size="7">LED灯</text>

  <text x="50" y="185" fill="#aabbcc" font-family="monospace" font-size="10">✓ 开关永远在线，关了还能控</text>
  <text x="50" y="203" fill="#aabbcc" font-family="monospace" font-size="10">✓ 老人小孩无学习成本</text>
  <text x="50" y="221" fill="#886644" font-family="monospace" font-size="10">✗ 不能调亮度/色温</text>

  <!-- Right Panel: Smart Bulb -->
  <rect x="355" y="70" width="295" height="160" rx="8" fill="#0d1b33" stroke="#7ec27e" stroke-width="1" opacity="0.9"/>
  <rect x="355" y="70" width="295" height="30" rx="8" fill="#7ec27e" opacity="0.15"/>
  <text x="502" y="90" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="14" font-weight="bold" filter="url(#neon)">💡 智能灯方案</text>

  <!-- Switch icon area -->
  <rect x="375" y="110" width="50" height="50" rx="5" fill="#1a2a4a" stroke="#666" stroke-width="0.8"/>
  <text x="400" y="130" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">普通</text>
  <text x="400" y="148" text-anchor="middle" fill="#666" font-family="monospace" font-size="7">开关</text>

  <!-- Arrow -->
  <line x1="430" y1="135" x2="460" y2="135" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7ec27e"/></marker></defs>

  <!-- Bulb icon area -->
  <rect x="465" y="110" width="60" height="50" rx="5" fill="#1a2a4a" stroke="#7ec27e" stroke-width="0.8"/>
  <text x="495" y="128" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="8">智能灯</text>
  <text x="495" y="148" text-anchor="middle" fill="#4478a2" font-family="monospace" font-size="7">Zigbee</text>

  <text x="375" y="185" fill="#aabbcc" font-family="monospace" font-size="10">✓ 亮度/色温任意调节</text>
  <text x="375" y="203" fill="#aabbcc" font-family="monospace" font-size="10">✓ 场景模式丰富</text>
  <text x="375" y="221" fill="#886644" font-family="monospace" font-size="10">✗ 关开关就离线！</text>

  <!-- Bottom: Room Recommendations -->
  <rect x="30" y="250" width="620" height="155" rx="8" fill="#0d1b33" stroke="#1a3a5a" stroke-width="1"/>
  <text x="340" y="275" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">🏠 各房间推荐方案</text>

  <!-- Room cards -->
  <!-- Living Room -->
  <rect x="45" y="290" width="110" height="55" rx="5" fill="#1a2540" stroke="#2478C2" stroke-width="0.8"/>
  <text x="100" y="310" text-anchor="middle" fill="#2478C2" font-family="monospace" font-size="11" font-weight="bold">客厅</text>
  <text x="100" y="330" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="9">智能灯+场景面板</text>

  <!-- Bedroom -->
  <rect x="168" y="290" width="110" height="55" rx="5" fill="#1a2540" stroke="#7ec27e" stroke-width="0.8"/>
  <text x="223" y="310" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="11" font-weight="bold">卧室</text>
  <text x="223" y="330" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="9">智能灯+普通开关</text>

  <!-- Kitchen -->
  <rect x="291" y="290" width="110" height="55" rx="5" fill="#1a2540" stroke="#cc8833" stroke-width="0.8"/>
  <text x="346" y="310" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="11" font-weight="bold">厨房/卫生间</text>
  <text x="346" y="330" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="9">智能开关+普通灯</text>

  <!-- Entryway -->
  <rect x="414" y="290" width="110" height="55" rx="5" fill="#1a2540" stroke="#8866cc" stroke-width="0.8"/>
  <text x="469" y="310" text-anchor="middle" fill="#8866cc" font-family="monospace" font-size="11" font-weight="bold">玄关/走廊</text>
  <text x="469" y="330" text-anchor="middle" fill="#8866cc" font-family="monospace" font-size="9">智能开关+传感器</text>

  <!-- Warning -->
  <rect x="537" y="290" width="100" height="55" rx="5" fill="#331a1a" stroke="#cc3333" stroke-width="0.8"/>
  <text x="587" y="310" text-anchor="middle" fill="#cc3333" font-family="monospace" font-size="11" font-weight="bold">⚠ 踩坑提醒</text>
  <text x="587" y="330" text-anchor="middle" fill="#cc6666" font-family="monospace" font-size="8">同一条线路</text>
  <text x="587" y="342" text-anchor="middle" fill="#cc6666" font-family="monospace" font-size="8">别叠罗汉！</text>

  <!-- Footer -->
  <text x="340" y="410" text-anchor="middle" fill="#3a5a7a" font-family="monospace" font-size="9">NEXLAMP 耐利普科技 | www.nexlamp.com</text>
</svg>