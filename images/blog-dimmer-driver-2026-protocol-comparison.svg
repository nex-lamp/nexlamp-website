    <text x="120" y="225" text-anchor="middle" fill="#6bcf7f">DALI</text>
    <text x="260" y="225" text-anchor="middle">&#9733;&#9733;&#9733;</text>
    <text x="400" y="225" text-anchor="middle" fill="#ff6b6b">&#22797;&#26434;</text>
    <text x="540" y="225" text-anchor="middle" fill="#ff6b6b">&#39640;</text>
    <text x="680" y="225" text-anchor="middle">&#21338;&#29289;&#39302;/&#39640;&#31471;</text>
  </g>
  <rect x="30" y="235" width="740" height="2" fill="#1a3050" opacity="0.5"/>
  <!-- Zigbee -->
  <g font-family="Consolas, monospace" font-size="11" fill="#c0d0e0">
    <text x="120" y="260" text-anchor="middle" fill="#6bcf7f">Zigbee</text>
    <text x="260" y="260" text-anchor="middle">&#9733;&#9733;&#9734;</text>
    <text x="400" y="260" text-anchor="middle" fill="#4ecca3">&#20813;&#24067;&#32447;</text>
    <text x="540" y="260" text-anchor="middle" fill="#ffd93d">&#20013;</text>
    <text x="680" y="260" text-anchor="middle">&#26234;&#33021;&#23478;&#23621;</text>
  </g>
  <rect x="30" y="270" width="740" height="2" fill="#1a3050" opacity="0.5"/>
  <!-- Matter -->
  <g font-family="Consolas, monospace" font-size="11" fill="#c0d0e0">
    <text x="120" y="295" text-anchor="middle" fill="#a78bfa">Matter</text>
    <text x="260" y="295" text-anchor="middle">&#9733;&#9733;&#9734;</text>
    <text x="400" y="295" text-anchor="middle" fill="#4ecca3">&#20813;&#24067;&#32447;</text>
    <text x="540" y="295" text-anchor="middle" fill="#ffd93d">&#20013;&#39640;</text>
    <text x="680" y="295" text-anchor="middle">&#36328;&#21697;&#29260;&#26234;&#33021;</text>
  </g>
  <!-- Highlight box around best picks -->
  <rect x="80" y="245" width="80" height="30" fill="none" stroke="#6bcf7f" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6" filter="url(#glow)"/>
  <rect x="80" y="280" width="80" height="30" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6" filter="url(#glow)"/>
  <!-- Bottom terminal window -->
  <rect x="50" y="340" width="700" height="130" rx="8" fill="#0d1f3a" stroke="#1a3050" stroke-width="1"/>
  <circle cx="70" cy="358" r="5" fill="#ff5f56"/>
  <circle cx="88" cy="358" r="5" fill="#ffbd2e"/>
  <circle cx="106" cy="358" r="5" fill="#27c93f"/>
  <text x="400" y="362" text-anchor="middle" fill="#5a8ab5" font-family="Consolas, monospace" font-size="10">dimming-protocol-selector.sh</text>
  <text x="70" y="390" fill="#4ecca3" font-family="Consolas, monospace" font-size="11">$ ./select --scenario</text>
  <text x="70" y="410" fill="#c0d0e0" font-family="Consolas, monospace" font-size="11">  &#62; &#26032;&#35013;&#39033;&#30446; &#8594; Zigbee / DALI (&#26080;&#32447;/&#39640;&#21697;)</text>
  <text x="70" y="428" fill="#c0d0e0" font-family="Consolas, monospace" font-size="11">  &#62; &#26087;&#25151;&#25913;&#36896; &#8594; &#22810;&#27169;&#24577;&#20999;&#30456; (&#20813;&#25286;&#22681;)</text>
  <text x="70" y="446" fill="#c0d0e0" font-family="Consolas, monospace" font-size="11">  &#62; &#21830;&#19994;&#39033;&#30446; &#8594; DALI DT8 &#21452;&#36335; (&#30465;&#35774;&#22791;)</text>
  <text x="70" y="462" fill="#ffd93d" font-family="Consolas, monospace" font-size="11">&#9888; &#36873;&#22411;&#24517;&#27979; 5%&#20302;&#20142;&#24230;&#34920;&#29616;</text>
</svg>
