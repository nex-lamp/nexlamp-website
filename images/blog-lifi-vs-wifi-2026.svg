<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2942" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="radioWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7043" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#0a1628"/>
  <rect width="800" height="500" fill="url(#grid1)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="40" fill="#0d1e35"/>
  <text x="20" y="26" fill="#5b8c5a" font-family="Consolas, monospace" font-size="14">Li-Fi vs Wi-Fi: 数据传输原理对比</text>
  <circle cx="770" cy="20" r="5" fill="#f44336"/>
  <circle cx="755" cy="20" r="5" fill="#FFA726"/>
  <circle cx="740" cy="20" r="5" fill="#4CAF50"/>

  <!-- LEFT: Li-Fi -->
  <rect x="30" y="60" width="340" height="410" rx="12" fill="#0d1e35" stroke="#4FC3F7" stroke-width="1" opacity="0.9"/>
  <text x="200" y="90" text-anchor="middle" fill="#4FC3F7" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Li-Fi 可见光通信</text>

  <!-- LED ceiling lamp -->
  <rect x="140" y="110" width="120" height="12" rx="6" fill="#4FC3F7" filter="url(#glow1)"/>
  <text x="200" y="140" text-anchor="middle" fill="#8899aa" font-family="Arial" font-size="11">LED灯泡 (380-780nm)</text>

  <!-- Light beam with data -->
  <polygon points="160,122 240,122 280,270 120,270" fill="url(#lightBeam)"/>
  <!-- Binary data in light beam -->
  <text x="200" y="180" text-anchor="middle" fill="#4FC3F7" font-family="Consolas, monospace" font-size="16" opacity="0.9">1 0 1 1 0 1 0 0</text>
  <text x="200" y="210" text-anchor="middle" fill="#4FC3F7" font-family="Consolas, monospace" font-size="16" opacity="0.7">1 1 0 0 1 0 1 1</text>
  <text x="200" y="240" text-anchor="middle" fill="#4FC3F7" font-family="Consolas, monospace" font-size="16" opacity="0.5">0 1 1 0 1 1 0 1</text>

  <!-- Device -->
  <rect x="130" y="280" width="140" height="60" rx="8" fill="#162338" stroke="#4FC3F7" stroke-width="1.5"/>
  <text x="200" y="315" text-anchor="middle" fill="#4FC3F7" font-family="Arial" font-size="14">📱 接收设备</text>
  <text x="200" y="335" text-anchor="middle" fill="#667788" font-family="Arial" font-size="10">光电探测器</text>

  <!-- Key metrics -->
  <text x="50" y="380" fill="#8899aa" font-family="Arial" font-size="12">理论速率: <tspan fill="#4FC3F7" font-weight="bold">10 Gbps+</tspan></text>
  <text x="50" y="400" fill="#8899aa" font-family="Arial" font-size="12">频谱: <tspan fill="#4FC3F7" font-weight="bold">免费, 无限带宽</tspan></text>
  <text x="50" y="420" fill="#8899aa" font-family="Arial" font-size="12">电磁干扰: <tspan fill="#4FC3F7" font-weight="bold">零</tspan></text>
  <text x="50" y="440" fill="#8899aa" font-family="Arial" font-size="12">安全性: <tspan fill="#4FC3F7" font-weight="bold">光照即覆盖</tspan></text>
  <text x="50" y="460" fill="#8899aa" font-family="Arial" font-size="12">穿墙: <tspan fill="#f44336" font-weight="bold">不能</tspan></text>

  <!-- RIGHT: Wi-Fi -->
  <rect x="430" y="60" width="340" height="410" rx="12" fill="#0d1e35" stroke="#FF7043" stroke-width="1" opacity="0.9"/>
  <text x="600" y="90" text-anchor="middle" fill="#FF7043" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Wi-Fi 射频通信</text>

  <!-- Router -->
  <rect x="540" y="110" width="120" height="30" rx="6" fill="#FF7043" opacity="0.8"/>
  <text x="600" y="155" text-anchor="middle" fill="#8899aa" font-family="Arial" font-size="11">路由器 (2.4/5GHz)</text>

  <!-- Radio waves -->
  <path d="M 600 140 Q 520 200 600 260" stroke="#FF7043" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 600 140 Q 480 200 600 260" stroke="#FF7043" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 600 140 Q 680 200 600 260" stroke="#FF7043" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 600 140 Q 720 200 600 260" stroke="#FF7043" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Radio data -->
  <text x="600" y="200" text-anchor="middle" fill="#FF7043" font-family="Consolas, monospace" font-size="14" opacity="0.7">~~~ RF 信号 ~~~</text>
  <text x="600" y="230" text-anchor="middle" fill="#FF7043" font-family="Consolas, monospace" font-size="14" opacity="0.5">可穿墙 · 可被截获</text>

  <!-- Device -->
  <rect x="530" y="280" width="140" height="60" rx="8" fill="#162338" stroke="#FF7043" stroke-width="1.5"/>
  <text x="600" y="315" text-anchor="middle" fill="#FF7043" font-family="Arial" font-size="14">📱 接收设备</text>
  <text x="600" y="335" text-anchor="middle" fill="#667788" font-family="Arial" font-size="10">射频天线</text>

  <!-- Key metrics -->
  <text x="450" y="380" fill="#8899aa" font-family="Arial" font-size="12">理论速率: <tspan fill="#FF7043" font-weight="bold">1.2-9.6 Gbps</tspan></text>
  <text x="450" y="400" fill="#8899aa" font-family="Arial" font-size="12">频谱: <tspan fill="#FF7043" font-weight="bold">需授权, 拥挤</tspan></text>
  <text x="450" y="420" fill="#8899aa" font-family="Arial" font-size="12">电磁干扰: <tspan fill="#f44336" font-weight="bold">有</tspan></text>
  <text x="450" y="440" fill="#8899aa" font-family="Arial" font-size="12">安全性: <tspan fill="#FFA726" font-weight="bold">可被截获</tspan></text>
  <text x="450" y="460" fill="#8899aa" font-family="Arial" font-size="12">穿墙: <tspan fill="#4CAF50" font-weight="bold">1-2堵墙</tspan></text>
</svg>