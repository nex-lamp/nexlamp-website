<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow3">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="680" height="400" fill="url(#bgGrad3)"/>
  
  <!-- 网格 -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="40" x2="680" y2="40"/><line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="200" x2="680" y2="200"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="280" x2="680" y2="280"/><line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- 标题 -->
  <text x="340" y="30" fill="#00d4ff" font-size="14" font-family="monospace" text-anchor="middle" filter="url(#glow3)">SMART LIGHTING PURCHASE CHECKLIST — 选购决策树</text>

  <!-- 决策树起始 -->
  <rect x="260" y="50" width="160" height="35" rx="8" fill="#7ec27e" opacity="0.2" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="340" y="72" fill="#7ec27e" font-size="12" font-family="monospace" text-anchor="middle">准备买智能灯？</text>

  <!-- 连接线 -->
  <line x1="340" y1="85" x2="340" y2="105" stroke="#7ec27e" stroke-width="1.5"/>

  <!-- 第一层判断 -->
  <text x="340" y="115" fill="#00d4ff" font-size="10" font-family="monospace" text-anchor="middle">看协议</text>
  <line x1="340" y1="120" x2="160" y2="140" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="340" y1="120" x2="520" y2="140" stroke="#00d4ff" stroke-width="1.5"/>

  <!-- 左：Zigbee/Matter -->
  <rect x="60" y="140" width="200" height="30" rx="5" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1.2"/>
  <text x="160" y="160" fill="#00d4ff" font-size="10" font-family="monospace" text-anchor="middle">Zigbee/Matter ✅ 继续</text>
  
  <!-- 右：WiFi -->
  <rect x="420" y="140" width="200" height="30" rx="5" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="1.2"/>
  <text x="520" y="160" fill="#ff6b35" font-size="10" font-family="monospace" text-anchor="middle">WiFi ❌ 不适合全屋</text>

  <!-- Zigbee路径继续 -->
  <line x1="160" y1="170" x2="160" y2="195" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="160" y="205" fill="#00d4ff" font-size="10" font-family="monospace" text-anchor="middle">看调光</text>
  <line x1="160" y1="210" x2="80" y2="230" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="160" y1="210" x2="240" y2="230" stroke="#00d4ff" stroke-width="1.5"/>

  <!-- 无级调光 -->
  <rect x="20" y="230" width="120" height="28" rx="4" fill="#7ec27e" opacity="0.15" stroke="#7ec27e" stroke-width="1"/>
  <text x="80" y="248" fill="#7ec27e" font-size="9" font-family="monospace" text-anchor="middle">无级调光 ✅</text>
  
  <!-- 多档 -->
  <rect x="180" y="230" width="120" height="28" rx="4" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="1"/>
  <text x="240" y="248" fill="#ff6b35" font-size="9" font-family="monospace" text-anchor="middle">3档亮度 ❌</text>

  <!-- 无级调光继续 -->
  <line x1="80" y1="258" x2="80" y2="280" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="80" y="290" fill="#7ec27e" font-size="10" font-family="monospace" text-anchor="middle">看色温</text>
  <line x1="80" y1="295" x2="30" y2="315" stroke="#7ec27e" stroke-width="1.5"/>
  <line x1="80" y1="295" x2="130" y2="315" stroke="#7ec27e" stroke-width="1.5"/>

  <!-- 动态色温 -->
  <rect x="0" y="315" width="110" height="25" rx="3" fill="#7ec27e" opacity="0.15" stroke="#7ec27e" stroke-width="0.8"/>
  <text x="55" y="332" fill="#7ec27e" font-size="8" font-family="monospace" text-anchor="middle">2700-5000K ✅</text>
  
  <!-- 冷暖两档 -->
  <rect x="100" y="315" width="110" height="25" rx="3" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="0.8"/>
  <text x="155" y="332" fill="#ff6b35" font-size="8" font-family="monospace" text-anchor="middle">冷暖两档 ❌</text>

  <!-- 动态色温继续到Ra -->
  <line x1="55" y1="340" x2="55" y2="360" stroke="#7ec27e" stroke-width="1"/>
  <text x="55" y="375" fill="#7ec27e" font-size="8" font-family="monospace" text-anchor="middle">Ra&amp;ge;95 ✅</text>
  <text x="55" y="392" fill="#7ec27e" font-size="7" font-family="monospace" text-anchor="middle" opacity="0.7">待机&amp;le;0.5W ✅</text>

  <!-- 右侧补充信息区 -->
  <g transform="translate(400,220)">
    <!-- 协议对比表 -->
    <rect x="0" y="0" width="260" height="140" rx="5" fill="#0d2137" stroke="#2478c2" stroke-width="1"/>
    <text x="130" y="20" fill="#00d4ff" font-size="10" font-family="monospace" text-anchor="middle">协议对比速查</text>
    
    <!-- 表头 -->
    <line x1="5" y1="28" x2="255" y2="28" stroke="#2478c2" stroke-width="0.5"/>
    <text x="50" y="40" fill="#2478c2" font-size="8" font-family="monospace" text-anchor="middle">指标</text>
    <text x="130" y="40" fill="#7ec27e" font-size="8" font-family="monospace" text-anchor="middle">Zigbee</text>
    <text x="210" y="40" fill="#ff6b35" font-size="8" font-family="monospace" text-anchor="middle">WiFi</text>
    
    <!-- 数据行 -->
    <text x="50" y="58" fill="#1a3050" font-size="7" font-family="monospace" text-anchor="middle" opacity="0.8">待机功耗</text>
    <text x="130" y="58" fill="#7ec27e" font-size="7" font-family="monospace" text-anchor="middle">0.1W</text>
    <text x="210" y="58" fill="#ff6b35" font-size="7" font-family="monospace" text-anchor="middle">3-5W</text>
    
    <text x="50" y="73" fill="#1a3050" font-size="7" font-family="monospace" text-anchor="middle" opacity="0.8">断网控制</text>
    <text x="130" y="73" fill="#7ec27e" font-size="7" font-family="monospace" text-anchor="middle">本地可用</text>
    <text x="210" y="73" fill="#ff6b35" font-size="7" font-family="monospace" text-anchor="middle">失联</text>
    
    <text x="50" y="88" fill="#1a3050" font-size="7" font-family="monospace" text-anchor="middle" opacity="0.8">组网能力</text>
    <text x="130" y="88" fill="#7ec27e" font-size="7" font-family="monospace" text-anchor="middle">Mesh 200+</text>
    <text x="210" y="88" fill="#ff6b35" font-size="7" font-family="monospace" text-anchor="middle">单灯单控</text>
    
    <text x="50" y="103" fill="#1a3050" font-size="7" font-family="monospace" text-anchor="middle" opacity="0.8">频闪风险</text>
    <text x="130" y="103" fill="#7ec27e" font-size="7" font-family="monospace" text-anchor="middle">恒流无闪</text>
    <text x="210" y="103" fill="#ff6b35" font-size="7" font-family="monospace" text-anchor="middle">可能频闪</text>
    
    <text x="50" y="118" fill="#1a3050" font-size="7" font-family="monospace" text-anchor="middle" opacity="0.8">新国标合规</text>
    <text x="130" y="118" fill="#7ec27e" font-size="7" font-family="monospace" text-anchor="middle">✅ 合规</text>
    <text x="210" y="118" fill="#ff6b35" font-size="7" font-family="monospace" text-anchor="middle">⚠️ 存疑</text>
    
    <text x="50" y="133" fill="#1a3050" font-size="7" font-family="monospace" text-anchor="middle" opacity="0.8">总评</text>
    <text x="130" y="133" fill="#7ec27e" font-size="8" font-family="monospace" text-anchor="middle">首选</text>
    <text x="210" y="133" fill="#ff6b35" font-size="8" font-family="monospace" text-anchor="middle">尝鲜</text>
  </g>

  <!-- 底部结论 -->
  <rect x="200" y="358" width="280" height="35" rx="5" fill="#7ec27e" opacity="0.2" stroke="#7ec27e" stroke-width="1"/>
  <text x="340" y="380" fill="#7ec27e" font-size="11" font-family="monospace" text-anchor="middle" filter="url(#glow3)">协议→调光→色温→Ra→待机 五步选灯</text>
</svg>