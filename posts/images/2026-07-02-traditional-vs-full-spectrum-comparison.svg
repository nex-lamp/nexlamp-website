<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="680" height="400" fill="url(#bg2)"/>
  <!-- Grid dots -->
  <g opacity="0.06" fill="#4CAF50">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/><circle cx="200" cy="50" r="2"/><circle cx="250" cy="50" r="2"/><circle cx="300" cy="50" r="2"/><circle cx="350" cy="50" r="2"/><circle cx="400" cy="50" r="2"/><circle cx="450" cy="50" r="2"/><circle cx="500" cy="50" r="2"/><circle cx="550" cy="50" r="2"/><circle cx="600" cy="50" r="2"/><circle cx="650" cy="50" r="2"/>
    <circle cx="50" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="150" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="250" cy="100" r="2"/><circle cx="300" cy="100" r="2"/><circle cx="350" cy="100" r="2"/><circle cx="400" cy="100" r="2"/><circle cx="450" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="550" cy="100" r="2"/><circle cx="600" cy="100" r="2"/><circle cx="650" cy="100" r="2"/>
  </g>
  <!-- Title -->
  <text x="340" y="30" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">传统LED vs 全光谱LED 对比</text>
  <text x="340" y="50" fill="#7ec27e" font-size="11" text-anchor="middle" font-family="Arial,sans-serif">光谱质量决定视觉舒适度与健康</text>
  <!-- Two columns -->
  <!-- Traditional LED -->
  <rect x="30" y="70" width="310" height="310" rx="8" fill="#0d1f3c" stroke="#ff6b35" stroke-width="1.5" opacity="0.9"/>
  <text x="185" y="95" fill="#ff6b35" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">⚠ 传统LED</text>
  <!-- Spectrum illustration: jagged peaks -->
  <g transform="translate(50,110)">
    <rect x="0" y="0" width="270" height="80" rx="4" fill="#1a1a2e"/>
    <!-- Spectrum curve - jagged with blue peak -->
    <path d="M0,70 L20,65 L40,60 L60,55 L80,15 L100,10 L120,20 L140,50 L160,55 L180,60 L200,65 L220,68 L240,70 L260,70 L270,70" stroke="#ff6b35" stroke-width="2" fill="none" opacity="0.8"/>
    <!-- Blue peak label -->
    <text x="95" y="45" fill="#ff6b35" font-size="9" font-family="Arial,sans-serif">蓝光尖峰</text>
    <!-- X axis -->
    <line x1="0" y1="70" x2="270" y2="70" stroke="#555" stroke-width="0.5"/>
    <text x="135" y="78" fill="#666" font-size="8" text-anchor="middle" font-family="Arial,sans-serif">波长 380-780nm</text>
  </g>
  <!-- Stats -->
  <g transform="translate(50, 200)">
    <text x="0" y="0" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">Ra 显色指数</text>
    <text x="230" y="0" fill="#ff6b35" font-size="14" font-weight="bold" font-family="Arial,sans-serif">80</text>
    <text x="0" y="25" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">R9 红色显色</text>
    <text x="230" y="25" fill="#ff6b35" font-size="14" font-weight="bold" font-family="Arial,sans-serif">&lt;20 ❌</text>
    <text x="0" y="50" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">蓝光风险</text>
    <text x="230" y="50" fill="#ff6b35" font-size="14" font-weight="bold" font-family="Arial,sans-serif">高 ⚠</text>
    <text x="0" y="75" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">频闪风险</text>
    <text x="230" y="75" fill="#ff6b35" font-size="14" font-weight="bold" font-family="Arial,sans-serif">高 ⚠</text>
    <text x="0" y="100" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">新国标合规</text>
    <text x="230" y="100" fill="#ff6b35" font-size="14" font-weight="bold" font-family="Arial,sans-serif">不合格 ❌</text>
  </g>
  <!-- Full Spectrum LED -->
  <rect x="340" y="70" width="310" height="310" rx="8" fill="#0d1f3c" stroke="#7ec27e" stroke-width="1.5" opacity="0.9"/>
  <text x="495" y="95" fill="#7ec27e" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">✅ 全光谱LED</text>
  <!-- Spectrum illustration: smooth continuous -->
  <g transform="translate(360,110)">
    <rect x="0" y="0" width="270" height="80" rx="4" fill="#1a1a2e"/>
    <!-- Spectrum curve - smooth continuous -->
    <path d="M0,70 L10,65 L20,60 L30,55 L40,48 L50,42 L60,38 L70,35 L80,33 L90,32 L100,33 L110,35 L120,38 L130,42 L140,48 L150,52 L160,56 L170,60 L180,63 L190,65 L200,67 L210,68 L220,69 L230,70 L240,70 L250,70 L260,70 L270,70" stroke="#7ec27e" stroke-width="2" fill="none" filter="url(#glow2)"/>
    <!-- Label -->
    <text x="135" y="45" fill="#7ec27e" font-size="9" font-family="Arial,sans-serif">连续光谱·模拟太阳光</text>
    <line x1="0" y1="70" x2="270" y2="70" stroke="#555" stroke-width="0.5"/>
    <text x="135" y="78" fill="#666" font-size="8" text-anchor="middle" font-family="Arial,sans-serif">波长 380-780nm</text>
  </g>
  <!-- Stats -->
  <g transform="translate(360, 200)">
    <text x="0" y="0" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">Ra 显色指数</text>
    <text x="230" y="0" fill="#7ec27e" font-size="14" font-weight="bold" font-family="Arial,sans-serif">90-98 ✅</text>
    <text x="0" y="25" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">R9 红色显色</text>
    <text x="230" y="25" fill="#7ec27e" font-size="14" font-weight="bold" font-family="Arial,sans-serif">≥60 ✅</text>
    <text x="0" y="50" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">蓝光风险</text>
    <text x="230" y="50" fill="#7ec27e" font-size="14" font-weight="bold" font-family="Arial,sans-serif">低 ✅</text>
    <text x="0" y="75" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">频闪风险</text>
    <text x="230" y="75" fill="#7ec27e" font-size="14" font-weight="bold" font-family="Arial,sans-serif">极低 ✅</text>
    <text x="0" y="100" fill="#aaaaaa" font-size="12" font-family="Arial,sans-serif">新国标合规</text>
    <text x="230" y="100" fill="#7ec27e" font-size="14" font-weight="bold" font-family="Arial,sans-serif">完全合规 ✅</text>
  </g>
  <!-- Footer -->
  <text x="340" y="388" fill="#666666" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">NEXLAMP | www.nexlamp.com | Ra≥90-98 全光谱智能照明</text>
</svg>