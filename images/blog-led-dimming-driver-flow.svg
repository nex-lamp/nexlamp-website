<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="480" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.3" opacity="0.25">
    <line x1="0" y1="30" x2="680" y2="30"/><line x1="0" y1="60" x2="680" y2="60"/>
    <line x1="0" y1="90" x2="680" y2="90"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="150" x2="680" y2="150"/><line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="210" x2="680" y2="210"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="270" x2="680" y2="270"/><line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="330" x2="680" y2="330"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="390" x2="680" y2="390"/><line x1="0" y1="420" x2="680" y2="420"/>
    <line x1="0" y1="450" x2="680" y2="450"/>
  </g>

  <!-- Title -->
  <rect x="20" y="12" width="640" height="34" rx="5" fill="#0d1f35" stroke="#1a4a7a" stroke-width="1"/>
  <text x="40" y="34" fill="#00d4ff" font-size="14" font-family="monospace" font-weight="bold">六种LED调光方式工作流程对比 &gt; Dimming Methods Workflow</text>

  <!-- Row 1: 开关调光 + 可控硅 -->
  <!-- Box 1: 开关调光 -->
  <rect x="20" y="60" width="300" height="95" rx="6" fill="#0f1f38" stroke="#555" stroke-width="1"/>
  <rect x="20" y="60" width="300" height="24" rx="6" fill="#1a3a5a"/>
  <rect x="20" y="72" width="300" height="12" fill="#1a3a5a"/>
  <text x="35" y="78" fill="#aaa" font-size="11" font-family="monospace" font-weight="bold">1. 开关调光 (Switch Dimming)</text>
  <text x="240" y="78" fill="#555" font-size="9" font-family="monospace" text-anchor="end">最简单方案</text>

  <rect x="35" y="92" width="55" height="30" rx="4" fill="#162d50" stroke="#555" stroke-width="0.5"/>
  <text x="62" y="111" fill="#888" font-size="9" font-family="monospace" text-anchor="middle">220V AC</text>

  <text x="95" y="111" fill="#00d4ff" font-size="16" font-family="monospace">→</text>

  <rect x="105" y="92" width="55" height="30" rx="4" fill="#1a2a1a" stroke="#555" stroke-width="0.5"/>
  <text x="132" y="110" fill="#aaa" font-size="9" font-family="monospace" text-anchor="middle">开关</text>

  <text x="165" y="111" fill="#00d4ff" font-size="16" font-family="monospace">→</text>

  <rect x="175" y="92" width="55" height="30" rx="4" fill="#162d50" stroke="#555" stroke-width="0.5"/>
  <text x="202" y="110" fill="#aaa" font-size="9" font-family="monospace" text-anchor="middle">驱动</text>

  <text x="235" y="111" fill="#00d4ff" font-size="16" font-family="monospace">→</text>

  <rect x="245" y="96" width="20" height="20" rx="10" fill="#555" stroke="#aaa" stroke-width="0.5"/>
  <text x="312" y="111" fill="#888" font-size="8" font-family="monospace">仅开/关</text>

  <text x="35" y="148" fill="#5a7a9a" font-size="8" font-family="monospace">适用: 基础照明  |  2线制  |  无调光功能</text>

  <!-- Box 2: 可控硅 -->
  <rect x="340" y="60" width="320" height="95" rx="6" fill="#0f1f38" stroke="#ffaa00" stroke-width="1"/>
  <rect x="340" y="60" width="320" height="24" rx="6" fill="#2a2000"/>
  <rect x="340" y="72" width="320" height="12" fill="#2a2000"/>
  <text x="355" y="78" fill="#ffaa00" font-size="11" font-family="monospace" font-weight="bold">2. 可控硅调光 (Triac Dimming)</text>
  <text x="620" y="78" fill="#886600" font-size="9" font-family="monospace" text-anchor="end">老房神器</text>

  <rect x="355" y="92" width="55" height="30" rx="4" fill="#162d50" stroke="#ffaa00" stroke-width="0.5"/>
  <text x="382" y="111" fill="#ffaa00" font-size="9" font-family="monospace" text-anchor="middle">220V AC</text>

  <text x="415" y="111" fill="#ffaa00" font-size="16" font-family="monospace">→</text>

  <rect x="425" y="92" width="55" height="30" rx="4" fill="#2a2000" stroke="#ffaa00" stroke-width="0.5"/>
  <text x="452" y="110" fill="#ffaa00" font-size="9" font-family="monospace" text-anchor="middle">调光器</text>

  <text x="485" y="111" fill="#ffaa00" font-size="16" font-family="monospace">→</text>

  <rect x="495" y="92" width="55" height="30" rx="4" fill="#2a2000" stroke="#ffaa00" stroke-width="0.5"/>
  <text x="522" y="110" fill="#ffaa00" font-size="9" font-family="monospace" text-anchor="middle">驱动</text>

  <text x="555" y="111" fill="#ffaa00" font-size="16" font-family="monospace">→</text>

  <rect x="565" y="96" width="20" height="20" rx="10" fill="#ffaa00" stroke="#ffcc44" stroke-width="0.5" filter="url(#glow)"/>

  <text x="355" y="148" fill="#886600" font-size="8" font-family="monospace">适用: 老房改造  |  2线制  |  兼容Lutron/Leviton</text>

  <!-- Row 2: 0-10V + DALI -->
  <rect x="20" y="175" width="300" height="95" rx="6" fill="#0f1f38" stroke="#00ff88" stroke-width="1"/>
  <rect x="20" y="175" width="300" height="24" rx="6" fill="#0a2a1a"/>
  <rect x="20" y="187" width="300" height="12" fill="#0a2a1a"/>
  <text x="35" y="193" fill="#00ff88" font-size="11" font-family="monospace" font-weight="bold">3. 0-10V调光 (Analog Dimming)</text>
  <text x="280" y="193" fill="#0a5a3a" font-size="9" font-family="monospace" text-anchor="end">商业首选</text>

  <rect x="35" y="207" width="48" height="28" rx="4" fill="#162d50" stroke="#00ff88" stroke-width="0.5"/>
  <text x="59" y="225" fill="#00ff88" font-size="8" font-family="monospace" text-anchor="middle">220V</text>

  <text x="88" y="225" fill="#00ff88" font-size="14" font-family="monospace">→</text>

  <rect x="98" y="207" width="52" height="28" rx="4" fill="#0a2a1a" stroke="#00ff88" stroke-width="0.5"/>
  <text x="124" y="225" fill="#00ff88" font-size="8" font-family="monospace" text-anchor="middle">调光器</text>

  <text x="160" y="218" fill="#00ff88" font-size="14" font-family="monospace">→</text>
  <text x="155" y="235" fill="#0a5a3a" font-size="9" font-family="monospace">0-10V信号</text>

  <rect x="180" y="207" width="48" height="28" rx="4" fill="#0a2a1a" stroke="#00ff88" stroke-width="0.5"/>
  <text x="204" y="225" fill="#00ff88" font-size="8" font-family="monospace" text-anchor="middle">驱动</text>

  <text x="233" y="225" fill="#00ff88" font-size="14" font-family="monospace">→</text>

  <rect x="243" y="211" width="18" height="18" rx="9" fill="#00ff88" stroke="#44ffaa" stroke-width="0.5" filter="url(#glow)"/>

  <text x="35" y="262" fill="#0a5a3a" font-size="8" font-family="monospace">适用: 办公楼/停车场  |  4线制  |  300m距离  |  0-100%线性</text>

  <!-- Box 4: DALI-2 -->
  <rect x="340" y="175" width="320" height="95" rx="6" fill="#0f1f38" stroke="#7b2fff" stroke-width="1"/>
  <rect x="340" y="175" width="320" height="24" rx="6" fill="#1a0a3a"/>
  <rect x="340" y="187" width="320" height="12" fill="#1a0a3a"/>
  <text x="355" y="193" fill="#7b2fff" font-size="11" font-family="monospace" font-weight="bold">4. DALI-2调光 (Digital Addressable)</text>
  <text x="610" y="193" fill="#3a1a5a" font-size="9" font-family="monospace" text-anchor="end">高端之选</text>

  <rect x="355" y="207" width="48" height="28" rx="4" fill="#162d50" stroke="#7b2fff" stroke-width="0.5"/>
  <text x="379" y="225" fill="#7b2fff" font-size="8" font-family="monospace" text-anchor="middle">220V</text>

  <text x="408" y="225" fill="#7b2fff" font-size="14" font-family="monospace">→</text>

  <rect x="418" y="207" width="52" height="28" rx="4" fill="#1a0a3a" stroke="#7b2fff" stroke-width="0.5"/>
  <text x="444" y="225" fill="#7b2fff" font-size="8" font-family="monospace" text-anchor="middle">主机</text>

  <text x="480" y="218" fill="#7b2fff" font-size="14" font-family="monospace">→</text>
  <text x="475" y="235" fill="#3a1a5a" font-size="9" font-family="monospace">DALI总线</text>

  <rect x="500" y="207" width="48" height="28" rx="4" fill="#1a0a3a" stroke="#7b2fff" stroke-width="0.5"/>
  <text x="524" y="225" fill="#7b2fff" font-size="8" font-family="monospace" text-anchor="middle">驱动</text>

  <text x="553" y="225" fill="#7b2fff" font-size="14" font-family="monospace">→</text>

  <rect x="563" y="211" width="18" height="18" rx="9" fill="#7b2fff" stroke="#aa66ff" stroke-width="0.5" filter="url(#glow)"/>
  <text x="592" y="240" fill="#3a1a5a" font-size="7" font-family="monospace">单灯可控</text>

  <text x="355" y="262" fill="#3a1a5a" font-size="8" font-family="monospace">适用: 博物馆/酒店  |  5线制  |  64地址/回路  |  0.1%深度</text>

  <!-- Row 3: Zigbee + BLE Mesh -->
  <rect x="20" y="290" width="300" height="105" rx="6" fill="#0f1f38" stroke="#00aaff" stroke-width="1"/>
  <rect x="20" y="290" width="300" height="24" rx="6" fill="#0a1a3a"/>
  <rect x="20" y="302" width="300" height="12" fill="#0a1a3a"/>
  <text x="35" y="308" fill="#00aaff" font-size="11" font-family="monospace" font-weight="bold">5. 涂鸦Zigbee调光 (Wireless Smart)</text>
  <text x="270" y="308" fill="#0a3a6a" font-size="9" font-family="monospace" text-anchor="end">全屋智能</text>

  <rect x="35" y="322" width="42" height="28" rx="4" fill="#162d50" stroke="#00aaff" stroke-width="0.5"/>
  <text x="56" y="340" fill="#00aaff" font-size="8" font-family="monospace" text-anchor="middle">220V</text>

  <text x="82" y="340" fill="#00aaff" font-size="14" font-family="monospace">→</text>

  <rect x="92" y="322" width="50" height="28" rx="4" fill="#0a1a3a" stroke="#00aaff" stroke-width="0.5"/>
  <text x="117" y="340" fill="#00aaff" font-size="8" font-family="monospace" text-anchor="middle">Zigbee</text>

  <text x="152" y="333" fill="#00aaff" font-size="14" font-family="monospace">→</text>
  <text x="148" y="350" fill="#0a3a6a" font-size="8" font-family="monospace">无线信号</text>

  <rect x="175" y="322" width="50" height="28" rx="4" fill="#0a1a3a" stroke="#00aaff" stroke-width="0.5"/>
  <text x="200" y="340" fill="#00aaff" font-size="8" font-family="monospace" text-anchor="middle">网关</text>

  <text x="235" y="333" fill="#00aaff" font-size="14" font-family="monospace">→</text>
  <text x="230" y="350" fill="#0a3a6a" font-size="8" font-family="monospace">WiFi</text>

  <rect x="260" y="326" width="18" height="18" rx="9" fill="#00aaff" stroke="#44ccff" stroke-width="0.5" filter="url(#glow)"/>

  <text x="35" y="380" fill="#0a3a6a" font-size="8" font-family="monospace">适用: 全屋智能  |  2线制  |  Mesh组网  |  Alexa/Google</text>
  <text x="35" y="393" fill="#0a3a6a" font-size="8" font-family="monospace">特点: 场景联动+语音控制+远程操控  |  推荐涂鸦Zigbee 3.0方案</text>

  <!-- Box 6: BLE Mesh -->
  <rect x="340" y="290" width="320" height="105" rx="6" fill="#0f1f38" stroke="#44ccff" stroke-width="1"/>
  <rect x="340" y="290" width="320" height="24" rx="6" fill="#0a2a3a"/>
  <rect x="340" y="302" width="320" height="12" fill="#0a2a3a"/>
  <text x="355" y="308" fill="#44ccff" font-size="11" font-family="monospace" font-weight="bold">6. 蓝牙Mesh调光 (BLE Mesh)</text>
  <text x="610" y="308" fill="#1a5a7a" font-size="9" font-family="monospace" text-anchor="end">米家生态</text>

  <rect x="355" y="322" width="42" height="28" rx="4" fill="#162d50" stroke="#44ccff" stroke-width="0.5"/>
  <text x="376" y="340" fill="#44ccff" font-size="8" font-family="monospace" text-anchor="middle">220V</text>

  <text x="402" y="340" fill="#44ccff" font-size="14" font-family="monospace">→</text>

  <rect x="412" y="322" width="50" height="28" rx="4" fill="#0a2a3a" stroke="#44ccff" stroke-width="0.5"/>
  <text x="437" y="340" fill="#44ccff" font-size="8" font-family="monospace" text-anchor="middle">BLE</text>

  <text x="472" y="333" fill="#44ccff" font-size="14" font-family="monospace">→</text>
  <text x="468" y="350" fill="#1a5a7a" font-size="8" font-family="monospace">蓝牙</text>

  <rect x="495" y="322" width="50" height="28" rx="4" fill="#0a2a3a" stroke="#44ccff" stroke-width="0.5"/>
  <text x="520" y="340" fill="#44ccff" font-size="8" font-family="monospace" text-anchor="middle">网关</text>

  <text x="555" y="333" fill="#44ccff" font-size="14" font-family="monospace">→</text>
  <text x="550" y="350" fill="#1a5a7a" font-size="8" font-family="monospace">WiFi</text>

  <rect x="580" y="326" width="18" height="18" rx="9" fill="#44ccff" stroke="#88ddff" stroke-width="0.5" filter="url(#glow)"/>

  <text x="355" y="380" fill="#1a5a7a" font-size="8" font-family="monospace">适用: 米家生态  |  2线制  |  30m Mesh  |  小户型</text>
  <text x="355" y="393" fill="#1a5a7a" font-size="8" font-family="monospace">特点: 米家APP直连+小爱同学  |  成本低  |  Mesh距离有限</text>

  <!-- Comparison bar at bottom -->
  <rect x="20" y="410" width="640" height="55" rx="6" fill="#0d1f35" stroke="#1a4a7a" stroke-width="1"/>
  <text x="100" y="432" fill="#555" font-size="9" font-family="monospace">开关</text>
  <rect x="115" y="424" width="10" height="10" rx="2" fill="#555"/>
  <text x="155" y="432" fill="#ffaa00" font-size="9" font-family="monospace">可控硅</text>
  <rect x="185" y="424" width="10" height="10" rx="2" fill="#ffaa00"/>
  <text x="225" y="432" fill="#00ff88" font-size="9" font-family="monospace">0-10V</text>
  <rect x="255" y="424" width="10" height="10" rx="2" fill="#00ff88"/>
  <text x="295" y="432" fill="#7b2fff" font-size="9" font-family="monospace">DALI-2</text>
  <rect x="330" y="424" width="10" height="10" rx="2" fill="#7b2fff"/>
  <text x="375" y="432" fill="#00aaff" font-size="9" font-family="monospace">Zigbee</text>
  <rect x="415" y="424" width="10" height="10" rx="2" fill="#00aaff"/>
  <text x="455" y="432" fill="#44ccff" font-size="9" font-family="monospace">BLE Mesh</text>
  <rect x="505" y="424" width="10" height="10" rx="2" fill="#44ccff"/>

  <text x="340" y="455" fill="#8ab4f8" font-size="9" font-family="monospace" text-anchor="middle">接线复杂度: 2线 → 4线 → 5线  |  控制能力: 开关 → 分组 → 单灯  |  成本: 开关 → 可控硅 → 无线 → DALI</text>

  <!-- Terminal dots -->
  <rect x="645" y="5" width="8" height="8" rx="1" fill="#ff5555"/>
  <rect x="657" y="5" width="8" height="8" rx="1" fill="#ffaa00"/>
  <rect x="669" y="5" width="8" height="8" rx="1" fill="#00ff88"/>
</svg>