<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a44"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#87ceeb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#e0e8f0" text-anchor="middle">HCL Applications: Bedroom, Office, Hospital</text>

  <!-- Scene 1: Bedroom -->
  <rect x="40" y="70" width="230" height="380" rx="12" fill="#1a2030" stroke="#2a3a5a" stroke-width="1.5"/>
  <text x="155" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff9a44" text-anchor="middle">BEDROOM</text>
  <text x="155" y="120" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">Wake-up & Sleep Aid</text>

  <!-- Bed icon -->
  <rect x="80" y="150" width="150" height="60" rx="6" fill="#2a2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <rect x="80" y="150" width="40" height="60" rx="6" fill="#3a3a4a" stroke="#3a4a5a" stroke-width="1"/>
  <rect x="90" y="160" width="20" height="12" rx="2" fill="#ff9a44" opacity="0.6" filter="url(#glow)"/>
  <rect x="90" y="180" width="20" height="12" rx="2" fill="#ff9a44" opacity="0.6" filter="url(#glow)"/>
  <!-- Person -->
  <circle cx="145" cy="175" r="10" fill="#5a6a7a"/>
  <rect x="135" y="185" width="20" height="22" rx="4" fill="#5a6a7a"/>
  <!-- Light above -->
  <circle cx="155" cy="140" r="14" fill="#ff9a44" opacity="0.8" filter="url(#glow)"/>
  <line x1="155" y1="126" x2="155" y2="110" stroke="#aaa" stroke-width="1"/>

  <!-- Bedroom schedule -->
  <text x="155" y="240" font-family="Arial, sans-serif" font-size="11" fill="#e0e8f0" text-anchor="middle" font-weight="bold">Daily Schedule</text>
  <rect x="60" y="255" width="190" height="22" rx="4" fill="#ff9a44" opacity="0.15"/>
  <text x="70" y="270" font-family="Arial, sans-serif" font-size="10" fill="#ff9a44" text-anchor="start">7:00 AM</text>
  <text x="130" y="270" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ Sunrise 3000K</text>

  <rect x="60" y="285" width="190" height="22" rx="4" fill="#87ceeb" opacity="0.15"/>
  <text x="70" y="300" font-family="Arial, sans-serif" font-size="10" fill="#87ceeb" text-anchor="start">9:00 AM</text>
  <text x="130" y="300" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ Daylight 5000K</text>

  <rect x="60" y="315" width="190" height="22" rx="4" fill="#ff9a44" opacity="0.15"/>
  <text x="70" y="330" font-family="Arial, sans-serif" font-size="10" fill="#ff9a44" text-anchor="start">10:00 PM</text>
  <text x="140" y="330" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ Warm 2700K</text>

  <text x="155" y="365" font-family="Arial, sans-serif" font-size="10" fill="#5a8aaa" text-anchor="middle">Sleep quality ↑ 15%</text>

  <!-- Scene 2: Office -->
  <rect x="285" y="70" width="230" height="380" rx="12" fill="#1a2030" stroke="#2a3a5a" stroke-width="1.5"/>
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a90d9" text-anchor="middle">OFFICE</text>
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">Focus & Fatigue Control</text>

  <!-- Desk icon -->
  <rect x="320" y="150" width="120" height="50" rx="4" fill="#2a2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <rect x="330" y="140" width="25" height="20" rx="2" fill="#4a90d9" opacity="0.6" filter="url(#glow)"/>
  <!-- Chair -->
  <rect x="360" y="200" width="40" height="25" rx="4" fill="#3a4a5a"/>
  <rect x="375" y="175" width="10" height="25" rx="2" fill="#3a4a5a"/>
  <!-- Light panels -->
  <rect x="310" y="130" width="50" height="8" rx="2" fill="#4a90d9" opacity="0.7" filter="url(#glow)"/>
  <rect x="380" y="130" width="50" height="8" rx="2" fill="#4a90d9" opacity="0.7" filter="url(#glow)"/>

  <!-- Office schedule -->
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="11" fill="#e0e8f0" text-anchor="middle" font-weight="bold">Daily Schedule</text>
  <rect x="305" y="255" width="190" height="22" rx="4" fill="#87ceeb" opacity="0.15"/>
  <text x="315" y="270" font-family="Arial, sans-serif" font-size="10" fill="#87ceeb" text-anchor="start">9:00 AM</text>
  <text x="375" y="270" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ 5000K Focus</text>

  <rect x="305" y="285" width="190" height="22" rx="4" fill="#ffd93d" opacity="0.15"/>
  <text x="315" y="300" font-family="Arial, sans-serif" font-size="10" fill="#ffd93d" text-anchor="start">2:00 PM</text>
  <text x="375" y="300" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ 4000K Balanced</text>

  <rect x="305" y="315" width="190" height="22" rx="4" fill="#ff9a44" opacity="0.15"/>
  <text x="315" y="330" font-family="Arial, sans-serif" font-size="10" fill="#ff9a44" text-anchor="start">8:00 PM</text>
  <text x="380" y="330" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ 3000K Wind-down</text>

  <text x="400" y="365" font-family="Arial, sans-serif" font-size="10" fill="#5a8aaa" text-anchor="middle">Visual fatigue ↓ 20%</text>

  <!-- Scene 3: Hospital -->
  <rect x="530" y="70" width="230" height="380" rx="12" fill="#1a2030" stroke="#2a3a5a" stroke-width="1.5"/>
  <text x="645" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5a8aaa" text-anchor="middle">HOSPITAL</text>
  <text x="645" y="120" font-family="Arial, sans-serif" font-size="10" fill="#aaa" text-anchor="middle">Circadian Rhythm Recovery</text>

  <!-- Bed icon -->
  <rect x="570" y="150" width="150" height="60" rx="6" fill="#2a2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <rect x="570" y="150" width="40" height="60" rx="6" fill="#3a3a4a" stroke="#3a4a5a" stroke-width="1"/>
  <!-- Patient -->
  <circle cx="635" cy="175" r="8" fill="#5a8aaa"/>
  <rect x="627" y="183" width="16" height="18" rx="3" fill="#5a8aaa"/>
  <!-- Medical light -->
  <circle cx="645" cy="140" r="12" fill="#87ceeb" opacity="0.6" filter="url(#glow)"/>
  <line x1="645" y1="128" x2="645" y2="110" stroke="#aaa" stroke-width="1"/>
  <!-- Medical cross -->
  <rect x="720" y="100" width="16" height="6" rx="2" fill="#5a8aaa"/>
  <rect x="725" y="95" width="6" height="16" rx="2" fill="#5a8aaa"/>

  <!-- Hospital schedule -->
  <text x="645" y="240" font-family="Arial, sans-serif" font-size="11" fill="#e0e8f0" text-anchor="middle" font-weight="bold">Daily Schedule</text>
  <rect x="550" y="255" width="190" height="22" rx="4" fill="#87ceeb" opacity="0.15"/>
  <text x="560" y="270" font-family="Arial, sans-serif" font-size="10" fill="#87ceeb" text-anchor="start">7:00 AM</text>
  <text x="620" y="270" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ Daylight 4000K</text>

  <rect x="550" y="285" width="190" height="22" rx="4" fill="#ffd93d" opacity="0.15"/>
  <text x="560" y="300" font-family="Arial, sans-serif" font-size="10" fill="#ffd93d" text-anchor="start">12:00 PM</text>
  <text x="625" y="300" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ Neutral 3500K</text>

  <rect x="550" y="315" width="190" height="22" rx="4" fill="#ff9a44" opacity="0.15"/>
  <text x="560" y="330" font-family="Arial, sans-serif" font-size="10" fill="#ff9a44" text-anchor="start">9:00 PM</text>
  <text x="620" y="330" font-family="Arial, sans-serif" font-size="10" fill="#ccc" text-anchor="start">→ Rest 2700K</text>

  <text x="645" y="365" font-family="Arial, sans-serif" font-size="10" fill="#5a8aaa" text-anchor="middle">Recovery rhythm ↑</text>

  <!-- Bottom connecting line -->
  <line x1="155" y1="400" x2="400" y2="400" stroke="#3a4a5a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="400" x2="645" y2="400" stroke="#3a4a5a" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="155" cy="400" r="4" fill="#ff9a44"/>
  <circle cx="400" cy="400" r="4" fill="#4a90d9"/>
  <circle cx="645" cy="400" r="4" fill="#5a8aaa"/>

  <!-- Bottom annotation -->
  <text x="400" y="475" font-family="Arial, sans-serif" font-size="10" fill="#5a7a9a" text-anchor="middle">HCL adapts color temperature and brightness to each environment's unique needs.</text>
</svg>
