<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" style="font-family: 'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#050b15"/>
    </linearGradient>
    <linearGradient id="mcuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7ec27e"/>
      <stop offset="100%" style="stop-color:#5b8c5a"/>
    </linearGradient>
    <linearGradient id="chGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="50%" style="stop-color:#9933ff"/>
      <stop offset="100%" style="stop-color:#3366ff"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2942" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7ec27e"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <rect width="1200" height="750" fill="url(#grid2)"/>

  <!-- 标题 -->
  <text x="600" y="55" text-anchor="middle" fill="#7ec27e" font-size="26" font-weight="bold" letter-spacing="2">MULTI-CHANNEL LED DRIVER ARCHITECTURE</text>
  <text x="600" y="85" text-anchor="middle" fill="#9ab0c9" font-size="14" letter-spacing="3">6通道恒流驱动 / 16-bit PWM / DALI-2 DT8 + Matter / Thread</text>

  <!-- 顶层: 协议输入 -->
  <g transform="translate(150, 140)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="#1a2942" stroke="#3366ff" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#9ab0c9" font-size="11" letter-spacing="1">SMART HOME PROTOCOL</text>
    <text x="110" y="52" text-anchor="middle" fill="#7ec27e" font-size="16" font-weight="bold">DALI-2 DT8 / Matter</text>
  </g>
  <g transform="translate(490, 140)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="#1a2942" stroke="#3366ff" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#9ab0c9" font-size="11" letter-spacing="1">WIRELESS MESH</text>
    <text x="110" y="52" text-anchor="middle" fill="#7ec27e" font-size="16" font-weight="bold">Zigbee 3.0 / Thread</text>
  </g>
  <g transform="translate(830, 140)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="#1a2942" stroke="#3366ff" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#9ab0c9" font-size="11" letter-spacing="1">VOICE / AI</text>
    <text x="110" y="52" text-anchor="middle" fill="#7ec27e" font-size="16" font-weight="bold">小度 / 小爱 / Alexa</text>
  </g>

  <!-- 箭头向下 -->
  <line x1="260" y1="210" x2="600" y2="270" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="600" y1="210" x2="600" y2="270" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="940" y1="210" x2="600" y2="270" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 中间: MCU核心 -->
  <g transform="translate(450, 280)">
    <rect x="0" y="0" width="300" height="100" rx="10" fill="url(#mcuGrad)" filter="url(#glow2)" opacity="0.9"/>
    <text x="150" y="35" text-anchor="middle" fill="#0a1628" font-size="13" font-weight="bold" letter-spacing="2">MCU / DSP CONTROLLER</text>
    <text x="150" y="62" text-anchor="middle" fill="#0a1628" font-size="20" font-weight="bold">16-bit PWM × 6 CH</text>
    <text x="150" y="85" text-anchor="middle" fill="#0a1628" font-size="11">4kHz+ frequency / 65,536 levels</text>
  </g>

  <!-- 6通道输出 -->
  <g transform="translate(80, 450)">
    <text x="0" y="-15" fill="#9ab0c9" font-size="12" letter-spacing="2">OUTPUT STAGES (恒流输出级)</text>
    <line x1="600" y1="0" x2="600" y2="-30" stroke="#7ec27e" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 通道 1-6 -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="160" height="120" rx="6" fill="#1a2942" stroke="#ff3366" stroke-width="1.5"/>
      <circle cx="80" cy="30" r="14" fill="#ff3366" filter="url(#glow2)"/>
      <text x="80" y="60" text-anchor="middle" fill="#ff7799" font-size="14" font-weight="bold">CH1: R</text>
      <text x="80" y="80" text-anchor="middle" fill="#9ab0c9" font-size="10">700mA</text>
      <text x="80" y="98" text-anchor="middle" fill="#9ab0c9" font-size="10">Ra≥95</text>
      <text x="80" y="115" text-anchor="middle" fill="#7ec27e" font-size="9">暖红 2200K</text>
    </g>
    <g transform="translate(190, 10)">
      <rect x="0" y="0" width="160" height="120" rx="6" fill="#1a2942" stroke="#ffaa00" stroke-width="1.5"/>
      <circle cx="80" cy="30" r="14" fill="#ffaa00" filter="url(#glow2)"/>
      <text x="80" y="60" text-anchor="middle" fill="#ffcc44" font-size="14" font-weight="bold">CH2: A</text>
      <text x="80" y="80" text-anchor="middle" fill="#9ab0c9" font-size="10">700mA</text>
      <text x="80" y="98" text-anchor="middle" fill="#9ab0c9" font-size="10">琥珀色</text>
      <text x="80" y="115" text-anchor="middle" fill="#7ec27e" font-size="9">夕阳/烛光</text>
    </g>
    <g transform="translate(380, 10)">
      <rect x="0" y="0" width="160" height="120" rx="6" fill="#1a2942" stroke="#ccff33" stroke-width="1.5"/>
      <circle cx="80" cy="30" r="14" fill="#ccff33" filter="url(#glow2)"/>
      <text x="80" y="60" text-anchor="middle" fill="#ddff66" font-size="14" font-weight="bold">CH3: W</text>
      <text x="80" y="80" text-anchor="middle" fill="#9ab0c9" font-size="10">700mA</text>
      <text x="80" y="98" text-anchor="middle" fill="#9ab0c9" font-size="10">暖白 2700K</text>
      <text x="80" y="115" text-anchor="middle" fill="#7ec27e" font-size="9">独立白光通道</text>
    </g>
    <g transform="translate(570, 10)">
      <rect x="0" y="0" width="160" height="120" rx="6" fill="#1a2942" stroke="#66ccff" stroke-width="1.5"/>
      <circle cx="80" cy="30" r="14" fill="#66ccff" filter="url(#glow2)"/>
      <text x="80" y="60" text-anchor="middle" fill="#88ddff" font-size="14" font-weight="bold">CH4: WW</text>
      <text x="80" y="80" text-anchor="middle" fill="#9ab0c9" font-size="10">700mA</text>
      <text x="80" y="98" text-anchor="middle" fill="#9ab0c9" font-size="10">冷白 6500K</text>
      <text x="80" y="115" text-anchor="middle" fill="#7ec27e" font-size="9">日间补光</text>
    </g>
    <g transform="translate(760, 10)">
      <rect x="0" y="0" width="160" height="120" rx="6" fill="#1a2942" stroke="#3366ff" stroke-width="1.5"/>
      <circle cx="80" cy="30" r="14" fill="#3366ff" filter="url(#glow2)"/>
      <text x="80" y="60" text-anchor="middle" fill="#6699ff" font-size="14" font-weight="bold">CH5: B</text>
      <text x="80" y="80" text-anchor="middle" fill="#9ab0c9" font-size="10">700mA</text>
      <text x="80" y="98" text-anchor="middle" fill="#9ab0c9" font-size="10">深蓝 450nm</text>
      <text x="80" y="115" text-anchor="middle" fill="#7ec27e" font-size="9">海蓝/星空</text>
    </g>
    <g transform="translate(950, 10)">
      <rect x="0" y="0" width="160" height="120" rx="6" fill="#1a2942" stroke="#9933ff" stroke-width="1.5"/>
      <circle cx="80" cy="30" r="14" fill="#9933ff" filter="url(#glow2)"/>
      <text x="80" y="60" text-anchor="middle" fill="#bb66ff" font-size="14" font-weight="bold">CH6: P</text>
      <text x="80" y="80" text-anchor="middle" fill="#9ab0c9" font-size="10">700mA</text>
      <text x="80" y="98" text-anchor="middle" fill="#9ab0c9" font-size="10">紫光 410nm</text>
      <text x="80" y="115" text-anchor="middle" fill="#7ec27e" font-size="9">极光/植物</text>
    </g>
  </g>

  <!-- 底部规格表 -->
  <g transform="translate(150, 640)">
    <rect x="0" y="0" width="900" height="80" rx="8" fill="#0e1d33" stroke="#7ec27e" stroke-width="1"/>
    <text x="20" y="22" fill="#7ec27e" font-size="12" font-weight="bold" letter-spacing="1">关键技术指标 / KEY SPECS</text>

    <g transform="translate(20, 35)">
      <text x="0" y="15" fill="#9ab0c9" font-size="10">通道数</text>
      <text x="0" y="32" fill="#7ec27e" font-size="14" font-weight="bold">≥6 独立</text>
    </g>
    <g transform="translate(170, 35)">
      <text x="0" y="15" fill="#9ab0c9" font-size="10">电流精度</text>
      <text x="0" y="32" fill="#7ec27e" font-size="14" font-weight="bold">±3%</text>
    </g>
    <g transform="translate(320, 35)">
      <text x="0" y="15" fill="#9ab0c9" font-size="10">调光灰度</text>
      <text x="0" y="32" fill="#7ec27e" font-size="14" font-weight="bold">16-bit / 65k级</text>
    </g>
    <g transform="translate(490, 35)">
      <text x="0" y="15" fill="#9ab0c9" font-size="10">PWM频率</text>
      <text x="0" y="32" fill="#7ec27e" font-size="14" font-weight="bold">≥4kHz</text>
    </g>
    <g transform="translate(640, 35)">
      <text x="0" y="15" fill="#9ab0c9" font-size="10">待机功耗</text>
      <text x="0" y="32" fill="#7ec27e" font-size="14" font-weight="bold">&lt; 0.5W</text>
    </g>
    <g transform="translate(790, 35)">
      <text x="0" y="15" fill="#9ab0c9" font-size="10">效率</text>
      <text x="0" y="32" fill="#7ec27e" font-size="14" font-weight="bold">≥88%</text>
    </g>
  </g>

  <!-- 角标 -->
  <text x="30" y="725" fill="#5a7090" font-size="10" letter-spacing="1">NEXLAMP / Smart Lighting Tech / 2026.07</text>
  <text x="1170" y="725" text-anchor="end" fill="#5a7090" font-size="10" letter-spacing="1">FIG.02 / 3</text>
</svg>
