<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="400" fill="url(#bg3)"/>
  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="200" x2="680" y2="200"/>
    <line x1="340" y1="0" x2="340" y2="400"/>
  </g>
  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" fill="#e8eef5" font-size="16" font-weight="bold">驱动电源选购与维护决策流程</text>
  <!-- Start node -->
  <g filter="url(#glow3)">
    <rect x="270" y="50" width="140" height="40" fill="#162238" stroke="#4dabf7" stroke-width="2" rx="20"/>
    <text x="340" y="75" text-anchor="middle" fill="#4dabf7" font-size="13" font-weight="bold">开始选购驱动电源</text>
  </g>
  <!-- Arrow down -->
  <line x1="340" y1="90" x2="340" y2="110" stroke="#4dabf7" stroke-width="2"/>
  <!-- Decision 1 -->
  <g filter="url(#glow3)">
    <polygon points="340,110 460,155 340,200 220,155" fill="#162238" stroke="#ffd43b" stroke-width="2"/>
    <text x="340" y="150" text-anchor="middle" fill="#ffd43b" font-size="11" font-weight="bold">电容规格?</text>
    <text x="340" y="168" text-anchor="middle" fill="#8aa5c8" font-size="9">105&#176;C/?hr</text>
  </g>
  <!-- Left branch: 4000hr -->
  <line x1="220" y1="155" x2="140" y2="155" stroke="#ff6b6b" stroke-width="2"/>
  <text x="180" y="148" text-anchor="middle" fill="#ff6b6b" font-size="9">4000hr</text>
  <g filter="url(#glow3)">
    <rect x="50" y="140" width="90" height="35" fill="#2a1520" stroke="#ff6b6b" stroke-width="2" rx="6"/>
    <text x="95" y="162" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="bold">普通驱动</text>
    <text x="95" y="172" text-anchor="middle" fill="#ff6b6b" font-size="8">寿命1-2年</text>
  </g>
  <!-- Right branch: 10000hr+ -->
  <line x1="460" y1="155" x2="540" y2="155" stroke="#69db7c" stroke-width="2"/>
  <text x="500" y="148" text-anchor="middle" fill="#69db7c" font-size="9">10000hr+</text>
  <g filter="url(#glow3)">
    <rect x="540" y="140" width="100" height="35" fill="#102818" stroke="#69db7c" stroke-width="2" rx="6"/>
    <text x="590" y="162" text-anchor="middle" fill="#69db7c" font-size="10" font-weight="bold">长寿命驱动</text>
    <text x="590" y="172" text-anchor="middle" fill="#69db7c" font-size="8">寿命5年+</text>
  </g>
  <!-- Arrow down from diamond -->
  <line x1="340" y1="200" x2="340" y2="220" stroke="#4dabf7" stroke-width="2"/>
  <!-- Decision 2 -->
  <g filter="url(#glow3)">
    <polygon points="340,220 460,265 340,310 220,265" fill="#162238" stroke="#ffa94d" stroke-width="2"/>
    <text x="340" y="260" text-anchor="middle" fill="#ffa94d" font-size="11" font-weight="bold">安装位置?</text>
    <text x="340" y="278" text-anchor="middle" fill="#8aa5c8" font-size="9">是否可达</text>
  </g>
  <!-- Left: Hidden -->
  <line x1="220" y1="265" x2="140" y2="265" stroke="#ff6b6b" stroke-width="2"/>
  <text x="180" y="258" text-anchor="middle" fill="#ff6b6b" font-size="9">吊顶封死</text>
  <g filter="url(#glow3)">
    <rect x="40" y="250" width="100" height="35" fill="#2a1520" stroke="#ff6b6b" stroke-width="2" rx="6"/>
    <text x="90" y="267" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">维护噩梦</text>
    <text x="90" y="278" text-anchor="middle" fill="#ff6b6b" font-size="8">维修费300-800</text>
  </g>
  <!-- Right: Accessible -->
  <line x1="460" y1="265" x2="540" y2="265" stroke="#69db7c" stroke-width="2"/>
  <text x="500" y="258" text-anchor="middle" fill="#69db7c" font-size="9">预留检修口</text>
  <g filter="url(#glow3)">
    <rect x="540" y="250" width="100" height="35" fill="#102818" stroke="#69db7c" stroke-width="2" rx="6"/>
    <text x="590" y="267" text-anchor="middle" fill="#69db7c" font-size="9" font-weight="bold">维护友好</text>
    <text x="590" y="278" text-anchor="middle" fill="#69db7c" font-size="8">换驱动80块</text>
  </g>
  <!-- Arrow down -->
  <line x1="340" y1="310" x2="340" y2="330" stroke="#4dabf7" stroke-width="2"/>
  <!-- Final box -->
  <g filter="url(#glow3)">
    <rect x="200" y="330" width="280" height="50" fill="#0d2a1a" stroke="#69db7c" stroke-width="2" rx="8"/>
    <text x="340" y="352" text-anchor="middle" fill="#69db7c" font-size="12" font-weight="bold">推荐方案</text>
    <text x="340" y="370" text-anchor="middle" fill="#8aa5c8" font-size="10">长寿命电容 + 集中放置 + 预留检修口 + 宽压设计</text>
  </g>
</svg>
