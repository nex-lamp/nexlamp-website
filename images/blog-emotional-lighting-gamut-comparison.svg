<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" style="font-family: 'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#050b15"/>
    </linearGradient>
    <linearGradient id="gradNarrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3366;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#33ff66;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#3366ff;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="gradWide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.7"/>
      <stop offset="25%" style="stop-color:#ff3366;stop-opacity:0.7"/>
      <stop offset="50%" style="stop-color:#9933ff;stop-opacity:0.7"/>
      <stop offset="75%" style="stop-color:#3366ff;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#33ccff;stop-opacity:0.7"/>
    </linearGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2942" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg1)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="600" y="55" text-anchor="middle" fill="#7ec27e" font-size="26" font-weight="bold" letter-spacing="2">COLOR GAMUT COMPARISON: NARROW vs FULL SPECTRUM</text>
  <text x="600" y="85" text-anchor="middle" fill="#9ab0c9" font-size="14" letter-spacing="3">CIE 1931 / 淡彩光 vs 全彩光 色域覆盖率</text>

  <!-- 左半区: 淡彩光 -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="450" height="500" rx="12" fill="#0e1d33" stroke="#ff5577" stroke-width="2" opacity="0.95"/>
    <text x="225" y="35" text-anchor="middle" fill="#ff7799" font-size="20" font-weight="bold">淡彩光 / RGB 三通道</text>
    <text x="225" y="58" text-anchor="middle" fill="#9ab0c9" font-size="12">色域覆盖率 ~35% / NTSC</text>

    <!-- CIE chromaticity简化马蹄形 -->
    <g transform="translate(225, 290)">
      <!-- 外圈马蹄形背景 -->
      <path d="M -180 80 Q -180 -150 0 -150 Q 180 -150 180 80 L 160 80 Q 160 -130 0 -130 Q -160 -130 -160 80 Z"
            fill="none" stroke="#3a557a" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

      <!-- RGB三角形 (小) -->
      <polygon points="0,-130 160,80 -160,80" fill="url(#gradNarrow)" stroke="#ff5577" stroke-width="2" filter="url(#glow1)"/>
      <text x="0" y="-145" text-anchor="middle" fill="#ff3366" font-size="14" font-weight="bold">R</text>
      <text x="170" y="100" text-anchor="middle" fill="#33ff66" font-size="14" font-weight="bold">G</text>
      <text x="-170" y="100" text-anchor="middle" fill="#3366ff" font-size="14" font-weight="bold">B</text>

      <!-- 中性点 -->
      <circle cx="0" cy="30" r="3" fill="#ffffff"/>
      <text x="8" y="34" fill="#9ab0c9" font-size="10">D65</text>
    </g>

    <!-- 数据标签 -->
    <g transform="translate(30, 420)">
      <rect x="0" y="0" width="390" height="60" rx="6" fill="#1a2942" stroke="#ff5577" stroke-width="0.5"/>
      <text x="15" y="22" fill="#9ab0c9" font-size="11">色域三角</text>
      <text x="120" y="22" fill="#ff7799" font-size="14" font-weight="bold">35% NTSC</text>
      <text x="15" y="46" fill="#9ab0c9" font-size="11">过渡灰度 / 色彩断层</text>
      <text x="180" y="46" fill="#ff7799" font-size="14" font-weight="bold">8-bit / 256级</text>
    </g>
  </g>

  <!-- 中间VS -->
  <g transform="translate(600, 380)">
    <circle cx="0" cy="0" r="38" fill="#7ec27e" filter="url(#glow1)"/>
    <text x="0" y="8" text-anchor="middle" fill="#0a1628" font-size="22" font-weight="bold">VS</text>
  </g>

  <!-- 右半区: 全彩光 -->
  <g transform="translate(630, 140)">
    <rect x="0" y="0" width="450" height="500" rx="12" fill="#0e1d33" stroke="#7ec27e" stroke-width="2" opacity="0.95"/>
    <text x="225" y="35" text-anchor="middle" fill="#7ec27e" font-size="20" font-weight="bold">全彩光 / RGBWAF 多通道</text>
    <text x="225" y="58" text-anchor="middle" fill="#9ab0c9" font-size="12">色域覆盖率 >90% / NTSC</text>

    <!-- CIE chromaticity简化马蹄形 -->
    <g transform="translate(225, 290)">
      <!-- 外圈马蹄形背景 -->
      <path d="M -180 80 Q -180 -150 0 -150 Q 180 -150 180 80 L 160 80 Q 160 -130 0 -130 Q -160 -130 -160 80 Z"
            fill="none" stroke="#3a557a" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

      <!-- 多通道色域 (大六边形) -->
      <polygon points="0,-150 130,-70 170,30 100,110 -100,110 -170,30 -130,-70" fill="url(#gradWide)" stroke="#7ec27e" stroke-width="2.5" filter="url(#glow1)"/>

      <!-- 顶点标注 -->
      <text x="0" y="-160" text-anchor="middle" fill="#ff6b35" font-size="13" font-weight="bold">R+A</text>
      <text x="138" y="-72" text-anchor="middle" fill="#ff3366" font-size="13" font-weight="bold">R</text>
      <text x="180" y="34" text-anchor="middle" fill="#9933ff" font-size="13" font-weight="bold">M</text>
      <text x="108" y="124" text-anchor="middle" fill="#3366ff" font-size="13" font-weight="bold">B</text>
      <text x="-108" y="124" text-anchor="middle" fill="#33ccff" font-size="13" font-weight="bold">C</text>
      <text x="-180" y="34" text-anchor="middle" fill="#66ff99" font-size="13" font-weight="bold">G</text>
      <text x="-138" y="-72" text-anchor="middle" fill="#ccff33" font-size="13" font-weight="bold">Y</text>

      <!-- 中性点 -->
      <circle cx="0" cy="30" r="3" fill="#ffffff"/>
      <text x="8" y="34" fill="#9ab0c9" font-size="10">D65</text>
    </g>

    <!-- 数据标签 -->
    <g transform="translate(30, 420)">
      <rect x="0" y="0" width="390" height="60" rx="6" fill="#1a2942" stroke="#7ec27e" stroke-width="0.5"/>
      <text x="15" y="22" fill="#9ab0c9" font-size="11">色域多边形</text>
      <text x="135" y="22" fill="#7ec27e" font-size="14" font-weight="bold">90%+ NTSC</text>
      <text x="15" y="46" fill="#9ab0c9" font-size="11">过渡灰度 / 色彩平滑</text>
      <text x="195" y="46" fill="#7ec27e" font-size="14" font-weight="bold">16-bit / 65536级</text>
    </g>
  </g>

  <!-- 底部总结 -->
  <g transform="translate(600, 680)">
    <rect x="-460" y="0" width="920" height="50" rx="8" fill="#0e1d33" stroke="#7ec27e" stroke-width="1"/>
    <text x="0" y="20" text-anchor="middle" fill="#7ec27e" font-size="14" font-weight="bold">结论：全彩光 = 全光谱 + 全色域 + 全过渡</text>
    <text x="0" y="40" text-anchor="middle" fill="#9ab0c9" font-size="12">"全彩"≠"RGB" / 至少5-6通道独立可控 + 16-bit灰度 + 4kHz+ PWM</text>
  </g>

  <!-- 角标 -->
  <text x="30" y="725" fill="#5a7090" font-size="10" letter-spacing="1">NEXLAMP / Smart Lighting Tech / 2026.07</text>
  <text x="1170" y="725" text-anchor="end" fill="#5a7090" font-size="10" letter-spacing="1">FIG.01 / 3</text>
</svg>
