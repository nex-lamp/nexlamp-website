<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#5cc8e8"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="url(#bg3)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/>
    <line x1="85" y1="0" x2="85" y2="470"/><line x1="170" y1="0" x2="170" y2="470"/>
    <line x1="255" y1="0" x2="255" y2="470"/><line x1="340" y1="0" x2="340" y2="470"/>
    <line x1="425" y1="0" x2="425" y2="470"/><line x1="510" y1="0" x2="510" y2="470"/>
    <line x1="595" y1="0" x2="595" y2="470"/>
  </g>
  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="23" font-weight="bold" filter="url(#glow3)">一条联动，要走完 4 道才会亮灯</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <!-- chain -->
  <rect x="30" y="86" width="128" height="68" rx="10" fill="#101f38" stroke="#3d5a80" stroke-width="1.2"/>
  <text x="94" y="118" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">传感器检测</text>
  <text x="94" y="138" fill="#6f88a8" font-family="sans-serif" font-size="11" text-anchor="middle">+0.1~0.5s</text>

  <rect x="186" y="86" width="128" height="68" rx="10" fill="#101f38" stroke="#3d5a80" stroke-width="1.2"/>
  <text x="250" y="118" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">无线上报</text>
  <text x="250" y="138" fill="#6f88a8" font-family="sans-serif" font-size="11" text-anchor="middle">穿墙/信道争抢</text>

  <rect x="342" y="86" width="128" height="68" rx="10" fill="#12233f" stroke="#f0c674" stroke-width="1.4"/>
  <text x="406" y="118" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">网关/云端运算</text>
  <text x="406" y="138" fill="#f0c674" font-family="sans-serif" font-size="11" text-anchor="middle">排队 + 匹配规则</text>

  <rect x="498" y="86" width="150" height="68" rx="10" fill="#101f38" stroke="#3d5a80" stroke-width="1.2"/>
  <text x="573" y="118" fill="#e8f4e8" font-family="sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">下发指令给执行设备</text>
  <text x="573" y="138" fill="#6f88a8" font-family="sans-serif" font-size="11" text-anchor="middle">+固件响应滞后</text>

  <g stroke="#5cc8e8" stroke-width="2" marker-end="url(#arrow3)">
    <line x1="158" y1="120" x2="182" y2="120"/>
    <line x1="314" y1="120" x2="338" y2="120"/>
    <line x1="470" y1="120" x2="494" y2="120"/>
  </g>

  <rect x="30" y="170" width="618" height="40" rx="8" fill="#0d1c33" stroke="#e06666" stroke-width="1.2"/>
  <text x="50" y="195" fill="#e06666" font-family="sans-serif" font-size="13.5" font-weight="bold">每一道都可能叠加延迟 → 从几百毫秒到好几秒</text>
  <text x="430" y="195" fill="#9db8d9" font-family="sans-serif" font-size="12.5">跨品牌再多一道协议转换</text>

  <!-- symptom -->
  <rect x="30" y="224" width="300" height="70" rx="10" fill="#101f38" stroke="#3d5a80" stroke-width="1"/>
  <text x="50" y="250" fill="#e06666" font-family="sans-serif" font-size="13.5" font-weight="bold">"设了没反应"</text>
  <text x="50" y="274" fill="#9db8d9" font-family="sans-serif" font-size="12">链路当时负载高、排队久</text>

  <rect x="348" y="224" width="300" height="70" rx="10" fill="#101f38" stroke="#3d5a80" stroke-width="1"/>
  <text x="368" y="250" fill="#e06666" font-family="sans-serif" font-size="13.5" font-weight="bold">"怎么自己动了"</text>
  <text x="368" y="274" fill="#9db8d9" font-family="sans-serif" font-size="12">物理环境抖动，单条件被误触发</text>

  <!-- fix -->
  <rect x="30" y="308" width="618" height="142" rx="10" fill="#0d1c33" stroke="#7ec27e" stroke-width="1.5"/>
  <text x="50" y="334" fill="#7ec27e" font-family="sans-serif" font-size="14.5" font-weight="bold">解法：加时间窗 + 状态复核（1~3 分钟）</text>

  <rect x="50" y="348" width="180" height="86" rx="8" fill="#12233f" stroke="#5cc8e8" stroke-width="1"/>
  <text x="140" y="374" fill="#e8f4e8" font-family="sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">✕ 反例 · 立即执行</text>
  <text x="140" y="398" fill="#9db8d9" font-family="sans-serif" font-size="11.5" text-anchor="middle">开窗 → 马上关空调</text>
  <text x="140" y="418" fill="#e06666" font-family="sans-serif" font-size="11.5" text-anchor="middle">换气 10 秒，空调关了</text>

  <rect x="252" y="348" width="180" height="86" rx="8" fill="#12233f" stroke="#7ec27e" stroke-width="1.2"/>
  <text x="342" y="374" fill="#e8f4e8" font-family="sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">✓ 正解 · 带时间窗</text>
  <text x="342" y="398" fill="#9db8d9" font-family="sans-serif" font-size="11.5" text-anchor="middle">开窗持续 5 分钟</text>
  <text x="342" y="418" fill="#7ec27e" font-family="sans-serif" font-size="11.5" text-anchor="middle">再关空调，误触发被滤掉</text>

  <rect x="446" y="348" width="182" height="86" rx="8" fill="#12233f" stroke="#5cc8e8" stroke-width="1"/>
  <text x="537" y="374" fill="#e8f4e8" font-family="sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">✓ 再加状态复核</text>
  <text x="537" y="398" fill="#9db8d9" font-family="sans-serif" font-size="11.5" text-anchor="middle">判断传感器信号</text>
  <text x="537" y="418" fill="#5cc8e8" font-family="sans-serif" font-size="11.5" text-anchor="middle">是否真代表用户意图</text>
</svg>
