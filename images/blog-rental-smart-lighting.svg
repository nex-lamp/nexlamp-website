  <g transform="translate(30, 255)">
    <rect x="0" y="0" width="620" height="175" rx="10" fill="#0d1f38" stroke="#1a3a5c" stroke-width="1"/>
    <rect x="0" y="0" width="620" height="32" rx="10" fill="#142a45"/>
    <rect x="0" y="22" width="620" height="10" fill="#142a45"/>
    <text x="310" y="22" text-anchor="middle" fill="#4a9eff" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="500">六种方案对比总览</text>

