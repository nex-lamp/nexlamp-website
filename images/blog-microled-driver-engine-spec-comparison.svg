    <text x="1000" y="395" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#a9b3c9">⬇ 5-50 mA/通道 · ±0.5%</text>
    <text x="1000" y="415" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#a9b3c9">PWM ≥ 4 kHz (扫描 7680 Hz)</text>

