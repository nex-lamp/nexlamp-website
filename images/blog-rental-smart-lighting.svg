      <text x="10" y="100" fill="#a0c8ff" font-family="Microsoft YaHei, sans-serif" font-size="11">安装辅料+工具</text>
      <text x="10" y="114" fill="#6080a0" font-family="sans-serif" font-size="9">螺丝/胶带/螺丝刀</text>
      <text x="140" y="106" fill="#5dd9a8" font-family="monospace" font-size="12" text-anchor="end">¥100</text>

      <!-- Total -->
      <rect x="170" y="84" width="155" height="36" rx="6" fill="#1a2a15" stroke="#5a9a30" stroke-width="1.2"/>
      <text x="180" y="100" fill="#ffd93d" font-family="Microsoft YaHei, sans-serif" font-size="11" font-weight="500">合计</text>
      <text x="310" y="106" fill="#5dd9a8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">¥500</text>
    </g>

    <!-- Key benefits -->
    <g transform="translate(15, 138)">
      <text x="0" y="12" fill="#5dd9a8" font-family="Microsoft YaHei, sans-serif" font-size="10">✓ 免改电路 ✓ 搬家带走 ✓ 手机+语音双控 ✓ 场景联动</text>
