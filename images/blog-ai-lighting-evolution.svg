  <!-- Footer -->
  <text x="450" y="468" text-anchor="middle" font-size="8" fill="#334155" font-family="Consolas">FIGURE 1 · LIGHTING TECHNOLOGY EVOLUTION &amp; ENERGY ANALYSIS · NEXLAMP TECH © 2026</text>
</svg>