<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0d2137" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bgGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0d2137" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="barZigbee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#0088aa"/>
    </linearGradient>
    <linearGradient id="barWifi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#cc4400"/>
    </linearGradient>
    <linearGradient id="barBle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b61ff"/><stop offset="100%" stop-color="#4a30cc"/>
    </linearGradient>
    <linearGradient id="barMatter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e676"/><stop offset="100%" stop-color="#009944"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="480" fill="url(#bgGlow)"/>
  <rect width="680" height="480" fill="url(#grid)"/>

  <!-- Title -->
  <text x="340" y="42" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="20" font-weight="bold" filter="url(#glow)">Smart Lighting Protocol Comparison 2026</text>
  <line x1="60" y1="55" x2="620" y2="55" stroke="#00d4ff" stroke-width="0.5" opacity="0.4"/>

  <!-- Protocol Cards -->
  <!-- Zigbee -->
  <rect x="40" y="75" width="135" height="160" rx="6" fill="#0a1a2e" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
  <rect x="40" y="75" width="135" height="32" rx="6" fill="url(#barZigbee)" opacity="0.3"/>
  <text x="107" y="96" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">Zigbee</text>
  <text x="55" y="125" fill="#8899aa" font-family="monospace" font-size="10">延迟 30-100ms</text>
  <text x="55" y="143" fill="#8899aa" font-family="monospace" font-size="10">64+ 设备/网关</text>
  <text x="55" y="161" fill="#8899aa" font-family="monospace" font-size="10">自组 Mesh 网络</text>
  <text x="55" y="179" fill="#8899aa" font-family="monospace" font-size="10">需要网关</text>
  <text x="55" y="197" fill="#8899aa" font-family="monospace" font-size="10">断网本地运行</text>
  <text x="107" y="220" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">全屋首选</text>

  <!-- WiFi -->
  <rect x="195" y="75" width="135" height="160" rx="6" fill="#0a1a2e" stroke="#ff6b35" stroke-width="1" opacity="0.9"/>
  <rect x="195" y="75" width="135" height="32" rx="6" fill="url(#barWifi)" opacity="0.3"/>
  <text x="262" y="96" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">WiFi</text>
  <text x="210" y="125" fill="#8899aa" font-family="monospace" font-size="10">延迟 50-500ms</text>
  <text x="210" y="143" fill="#8899aa" font-family="monospace" font-size="10">5-15 设备/路由</text>
  <text x="210" y="161" fill="#8899aa" font-family="monospace" font-size="10">星型网络</text>
  <text x="210" y="179" fill="#8899aa" font-family="monospace" font-size="10">无需网关</text>
  <text x="210" y="197" fill="#8899aa" font-family="monospace" font-size="10">断网无法控制</text>
  <text x="262" y="220" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">小户型备用</text>

  <!-- BLE Mesh -->
  <rect x="350" y="75" width="135" height="160" rx="6" fill="#0a1a2e" stroke="#7b61ff" stroke-width="1" opacity="0.9"/>
  <rect x="350" y="75" width="135" height="32" rx="6" fill="url(#barBle)" opacity="0.3"/>
  <text x="417" y="96" text-anchor="middle" fill="#7b61ff" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">BLE Mesh</text>
  <text x="365" y="125" fill="#8899aa" font-family="monospace" font-size="10">延迟 80-300ms</text>
  <text x="365" y="143" fill="#8899aa" font-family="monospace" font-size="10">32 设备/组</text>
  <text x="365" y="161" fill="#8899aa" font-family="monospace" font-size="10">泛洪 Mesh</text>
  <text x="365" y="179" fill="#8899aa" font-family="monospace" font-size="10">手机直连</text>
  <text x="365" y="197" fill="#8899aa" font-family="monospace" font-size="10">距离受限</text>
  <text x="417" y="220" text-anchor="middle" fill="#7b61ff" font-family="monospace" font-size="11">单房间用</text>

  <!-- Matter -->
  <rect x="505" y="75" width="135" height="160" rx="6" fill="#0a1a2e" stroke="#00e676" stroke-width="1" opacity="0.9"/>
  <rect x="505" y="75" width="135" height="32" rx="6" fill="url(#barMatter)" opacity="0.3"/>
  <text x="572" y="96" text-anchor="middle" fill="#00e676" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">Matter</text>
  <text x="520" y="125" fill="#8899aa" font-family="monospace" font-size="10">跨平台标准</text>
  <text x="520" y="143" fill="#8899aa" font-family="monospace" font-size="10">统一控制</text>
  <text x="520" y="161" fill="#8899aa" font-family="monospace" font-size="10">基于 Thread</text>
  <text x="520" y="179" fill="#8899aa" font-family="monospace" font-size="10">生态未成熟</text>
  <text x="520" y="197" fill="#8899aa" font-family="monospace" font-size="10">设备种类少</text>
  <text x="572" y="220" text-anchor="middle" fill="#00e676" font-family="monospace" font-size="11">未来趋势</text>

  <!-- Decision Flow -->
  <text x="340" y="270" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="15" font-weight="bold" filter="url(#glow)">Decision Flow</text>
  <line x1="60" y1="280" x2="620" y2="280" stroke="#00d4ff" stroke-width="0.5" opacity="0.4"/>

  <!-- Flowchart -->
  <rect x="260" y="295" width="160" height="36" rx="18" fill="#0a1a2e" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="340" y="318" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="13" filter="url(#glow)">全屋智能？</text>

  <!-- Yes branch -->
  <line x1="420" y1="313" x2="510" y2="313" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="510" y1="313" x2="510" y2="350" stroke="#00d4ff" stroke-width="1.5"/>
  <rect x="430" y="288" width="80" height="22" rx="4" fill="#0a1a2e" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="470" y="303" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10">是</text>

  <rect x="450" y="350" width="130" height="36" rx="6" fill="#0a1a2e" stroke="#00d4ff" stroke-width="2"/>
  <text x="515" y="373" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="13" filter="url(#glow)">Zigbee 网关</text>

  <!-- No branch -->
  <line x1="260" y1="313" x2="170" y2="313" stroke="#ff6b35" stroke-width="1.5"/>
  <line x1="170" y1="313" x2="170" y2="350" stroke="#ff6b35" stroke-width="1.5"/>
  <rect x="240" y="288" width="30" height="22" rx="4" fill="#0a1a2e" stroke="#ff6b35" stroke-width="0.8"/>
  <text x="255" y="303" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="10">否</text>

  <rect x="100" y="350" width="130" height="36" rx="6" fill="#0a1a2e" stroke="#ff6b35" stroke-width="2"/>
  <text x="165" y="373" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="13">WiFi/BLE</text>

  <!-- Key metrics row -->
  <rect x="40" y="410" width="600" height="55" rx="6" fill="#0a1a2e" stroke="#0d2137" stroke-width="1"/>
  <text x="60" y="435" fill="#8899aa" font-family="monospace" font-size="10">关键指标</text>
  <text x="160" y="435" fill="#00d4ff" font-family="monospace" font-size="10" filter="url(#glow)">延迟 &lt;100ms</text>
  <text x="310" y="435" fill="#00d4ff" font-family="monospace" font-size="10" filter="url(#glow)">设备 &gt;50</text>
  <text x="460" y="435" fill="#00d4ff" font-family="monospace" font-size="10" filter="url(#glow)">断网可用</text>
  <text x="60" y="455" fill="#556677" font-family="monospace" font-size="9">Zigbee: 全屋最佳 | Matter: 未来趋势 (2027+) | 当前建议: Zigbee</text>
</svg>