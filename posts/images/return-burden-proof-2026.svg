<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="600" fill="url(#bg2)"/>
  <g stroke="#12305a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="75" x2="1080" y2="75"/><line x1="0" y1="150" x2="1080" y2="150"/>
    <line x1="0" y1="225" x2="1080" y2="225"/><line x1="0" y1="300" x2="1080" y2="300"/>
    <line x1="0" y1="375" x2="1080" y2="375"/><line x1="0" y1="450" x2="1080" y2="450"/>
    <line x1="0" y1="525" x2="1080" y2="525"/>
    <line x1="180" y1="0" x2="180" y2="600"/><line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
  </g>
  <text x="540" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#e8f1ff">灯装完半年内出问题，举证责任在谁？</text>
  <text x="540" y="82" text-anchor="middle" font-size="15" fill="#7aa5d8">《消费者权益保护法》第23条第3款 · 六个月举证责任倒置</text>

  <!-- 左：6个月内 -->
  <g>
    <rect x="60" y="130" width="450" height="330" rx="14" fill="#0e1830" stroke="#34d399" stroke-width="2"/>
    <rect x="60" y="130" width="450" height="56" rx="14" fill="#0c2b22"/>
    <text x="285" y="166" text-anchor="middle" font-size="19" fill="#34d399" font-weight="bold">收货后 6 个月内</text>
    <text x="285" y="228" text-anchor="middle" font-size="16" fill="#e8f1ff">谁发现问题：消费者</text>
    <text x="285" y="272" text-anchor="middle" font-size="17" fill="#34d399" font-weight="bold">谁举证：经营者（商家）</text>
    <line x1="110" y1="300" x2="460" y2="300" stroke="#1e4d7a" stroke-width="1"/>
    <text x="285" y="338" text-anchor="middle" font-size="14" fill="#9db8dd">商家要证明：商品无质量瑕疵</text>
    <text x="285" y="372" text-anchor="middle" font-size="14" fill="#9db8dd">争议不是"是不是安装弄坏的"</text>
    <text x="285" y="424" text-anchor="middle" font-size="15" fill="#fbbf24" font-weight="bold">你的成本：报修 + 留证据</text>
  </g>

  <!-- 右：6个月后 -->
  <g>
    <rect x="570" y="130" width="450" height="330" rx="14" fill="#101828" stroke="#f87171" stroke-width="2"/>
    <rect x="570" y="130" width="450" height="56" rx="14" fill="#2b1215"/>
    <text x="795" y="166" text-anchor="middle" font-size="19" fill="#f87171" font-weight="bold">收货 6 个月之后</text>
    <text x="795" y="228" text-anchor="middle" font-size="16" fill="#e8f1ff">谁发现问题：消费者</text>
    <text x="795" y="272" text-anchor="middle" font-size="17" fill="#f87171" font-weight="bold">谁举证：消费者自己</text>
    <line x1="620" y1="300" x2="970" y2="300" stroke="#1e4d7a" stroke-width="1"/>
    <text x="795" y="338" text-anchor="middle" font-size="14" fill="#9db8dd">要证明：出厂即有毛病</text>
    <text x="795" y="372" text-anchor="middle" font-size="14" fill="#9db8dd">难度回到自己身上（仍可主张三包）</text>
    <text x="795" y="424" text-anchor="middle" font-size="15" fill="#fbbf24" font-weight="bold">策略：异常别拖 · 早报修早留记录</text>
  </g>

  <!-- 中间箭头 -->
  <g>
    <line x1="515" y1="295" x2="565" y2="295" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="565,287 581,295 565,303" fill="#38bdf8"/>
    <text x="540" y="500" text-anchor="middle" font-size="15" fill="#38bdf8" font-weight="bold">灯属于电器耐用商品，"等耐用"条款可主张</text>
    <text x="540" y="536" text-anchor="middle" font-size="13" fill="#7aa5d8">实务要点：投诉与诉讼中主动引用第23条第3款，举证负担推回商家</text>
  </g>
</svg>
