<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c42" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffa552" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffe66d" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">LED驱动芯片涨价传导链</text>
  <text x="400" y="55" text-anchor="middle" fill="#708090" font-size="12">2026年成本风暴如何从上游传导到终端</text>

  <!-- Layer 1: Raw Materials -->
  <g filter="url(#glow)">
    <rect x="30" y="80" width="160" height="60" rx="8" fill="url(#redGrad)" stroke="#ff4444" stroke-width="1.5"/>
    <text x="110" y="105" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">原材料端</text>
    <text x="110" y="125" text-anchor="middle" fill="#fff0f0" font-size="11">银价 +170% | 金价 +70%</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 190 110 L 230 110" stroke="#ff4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="210" y="100" text-anchor="middle" fill="#ff6b6b" font-size="10">成本推动</text>

  <!-- Layer 2: Wafer -->
  <g filter="url(#glow)">
    <rect x="230" y="80" width="160" height="60" rx="8" fill="url(#redGrad)" stroke="#ff4444" stroke-width="1.5"/>
    <text x="310" y="105" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">晶圆代工</text>
    <text x="310" y="125" text-anchor="middle" fill="#fff0f0" font-size="11">AI挤占产能 +15%-25%</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 390 110 L 430 110" stroke="#ff8c42" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- Layer 3: Driver Chip -->
  <g filter="url(#glow)">
    <rect x="430" y="80" width="160" height="60" rx="8" fill="url(#orangeGrad)" stroke="#ff8c42" stroke-width="1.5"/>
    <text x="510" y="105" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">驱动芯片</text>
    <text x="510" y="125" text-anchor="middle" fill="#fff5e6" font-size="11">涨价 30%-80%</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 590 110 L 630 110" stroke="#ffd93d" stroke-width="2" fill="none" marker-end="url(#arrowYellow)"/>

  <!-- Layer 4: Driver Power -->
  <g filter="url(#glow)">
    <rect x="630" y="80" width="150" height="60" rx="8" fill="url(#yellowGrad)" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="705" y="105" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="bold">驱动电源</text>
    <text x="705" y="125" text-anchor="middle" fill="#3a3a4e" font-size="11">涨价 5%-15%</text>
  </g>

  <!-- Downward arrow to lamps -->
  <path d="M 705 140 L 705 180" stroke="#ffd93d" stroke-width="2" fill="none" marker-end="url(#arrowYellow)"/>

  <!-- Layer 5: Smart Lamps -->
  <g filter="url(#glow)">
    <rect x="580" y="180" width="200" height="60" rx="8" fill="#2a4a6a" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="680" y="205" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">智能灯具成品</text>
    <text x="680" y="225" text-anchor="middle" fill="#a0c4ff" font-size="11">涨价 3%-10%</text>
  </g>

  <!-- Key Stats Panel -->
  <g>
    <rect x="30" y="180" width="520" height="280" rx="10" fill="#0d1f3a" stroke="#1a3050" stroke-width="1"/>
    <text x="50" y="210" fill="#4a9eff" font-size="14" font-weight="bold">关键数据</text>

    <!-- Stat 1 -->
    <circle cx="60" cy="245" r="5" fill="#ff4444"/>
    <text x="75" y="249" fill="#e0e0e0" font-size="13">银浆占LED封装成本 &gt;30%</text>
    <text x="75" y="265" fill="#708090" font-size="11">银价同比涨幅 170%</text>

    <!-- Stat 2 -->
    <circle cx="60" cy="295" r="5" fill="#ff8c42"/>
    <text x="75" y="299" fill="#e0e0e0" font-size="13">晶圆产能占比 30% → 15%</text>
    <text x="75" y="315" fill="#708090" font-size="11">AI CoWoS需求较2024年增长170%</text>

    <!-- Stat 3 -->
    <circle cx="60" cy="345" r="5" fill="#ffd93d"/>
    <text x="75" y="349" fill="#e0e0e0" font-size="13">80+家企业发布调价通知</text>
    <text x="75" y="365" fill="#708090" font-size="11">交期 4周 → 6-8周，现货溢价50%-100%</text>

    <!-- Stat 4 -->
    <circle cx="60" cy="395" r="5" fill="#4a9eff"/>
    <text x="75" y="399" fill="#e0e0e0" font-size="13">智能驱动(Zigbee/BLE)涨幅 8%-12%</text>
    <text x="75" y="415" fill="#708090" font-size="11">芯片成本占比更高，传导更快</text>

    <!-- Stat 5 -->
    <circle cx="60" cy="440" r="5" fill="#50c878"/>
    <text x="75" y="444" fill="#e0e0e0" font-size="13">缺货预计持续至 2027年Q1</text>
  </g>

  <!-- Bottom note -->
  <text x="400" y="480" text-anchor="middle" fill="#506070" font-size="10">数据来源：集邦咨询 / 摩根士丹利 / 企业调价函 | NEXLAMP整理</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#ff4444"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#ff8c42"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#ffd93d"/>
    </marker>
  </defs>
</svg>
