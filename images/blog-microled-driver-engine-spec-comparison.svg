<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#061634"/>
    </linearGradient>
    <linearGradient id="ledGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="microGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#0033cc"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- 网格 -->
  <g stroke="#1a2547" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="650" x2="1200" y2="650"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="60" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#ffffff">芯片尺寸缩小100倍 驱动通道翻30倍</text>
  <text x="600" y="95" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7ec8e3">MicroLED 量产拐点下 LED驱动的"小与多"</text>

  <!-- 左侧传统LED -->
  <g>
    <text x="200" y="160" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#ffd700">传统 LED</text>
    <text x="200" y="185" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14" fill="#a9b3c9">边长 0.2-1 mm · 8 通道/驱动</text>

    <!-- LED图标 -->
    <rect x="100" y="230" width="200" height="200" fill="none" stroke="#ffd700" stroke-width="2" rx="10"/>
    <circle cx="200" cy="280" r="22" fill="url(#ledGrad)" filter="url(#glow)"/>
    <circle cx="200" cy="280" r="40" fill="url(#glowGrad)"/>

    <text x="200" y="360" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#a9b3c9">⬇ 200 mA · ±3%</text>
    <text x="200" y="380" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#a9b3c9">PWM ≤ 1 kHz</text>

    <!-- 数据 -->
    <g transform="translate(60,450)">
      <text x="0" y="0" font-family="'PingFang SC',sans-serif" font-size="14" fill="#7ec8e3">单板通道数</text>
      <text x="280" y="0" text-anchor="end" font-family="'Courier New',monospace" font-size="20" font-weight="700" fill="#ffd700">8 路</text>
      <line x1="0" y1="20" x2="280" y2="20" stroke="#1a2547" stroke-width="1"/>

      <text x="0" y="50" font-family="'PingFang SC',sans-serif" font-size="14" fill="#7ec8e3">电流精度</text>
      <text x="280" y="50" text-anchor="end" font-family="'Courier New',monospace" font-size="20" font-weight="700" fill="#ffd700">±3%</text>
      <line x1="0" y1="70" x2="280" y2="70" stroke="#1a2547" stroke-width="1"/>

      <text x="0" y="100" font-family="'PingFang SC',sans-serif" font-size="14" fill="#7ec8e3">PWM 频率</text>
      <text x="280" y="100" text-anchor="end" font-family="'Courier New',monospace" font-size="20" font-weight="700" fill="#ffd700">≤ 1 kHz</text>
      <line x1="0" y1="120" x2="280" y2="120" stroke="#1a2547" stroke-width="1"/>

      <text x="0" y="150" font-family="'PingFang SC',sans-serif" font-size="14" fill="#7ec8e3">刷新率</text>
      <text x="280" y="150" text-anchor="end" font-family="'Courier New',monospace" font-size="20" font-weight="700" fill="#ffd700">60 Hz</text>
    </g>
  </g>

  <!-- 中间箭头 + 升级标签 -->
  <g transform="translate(420,330)">
    <line x1="0" y1="50" x2="180" y2="50" stroke="#00ffff" stroke-width="3" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#00ffff"/>
      </marker>
    </defs>
    <rect x="40" y="0" width="100" height="34" rx="17" fill="#00ffff" opacity="0.15"/>
    <text x="90" y="22" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#00ffff">20-100× 升级</text>
    <text x="90" y="100" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#a9b3c9">光引擎化</text>
    <text x="90" y="118" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#a9b3c9">芯片级集成</text>
  </g>

  <!-- 右侧MicroLED -->
  <g>
    <text x="1000" y="160" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#00ffff">MicroLED</text>
    <text x="1000" y="185" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14" fill="#a9b3c9">边长 ≤ 10 μm · 48 通道起/驱动</text>

    <rect x="850" y="230" width="300" height="200" fill="none" stroke="#00ffff" stroke-width="2" rx="10"/>

    <!-- MicroLED阵列 -->
    <g transform="translate(880,255)">
      <g fill="url(#microGrad)" filter="url(#glow)">
        <rect x="0" y="0" width="6" height="6"/>
