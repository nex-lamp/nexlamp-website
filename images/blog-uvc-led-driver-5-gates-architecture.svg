<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3a5c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="420" fill="url(#bg3)"/>
  <g opacity="0.06" stroke="#2d5a8e" stroke-width="0.5">
    <line x1="0" y1="60" x2="680" y2="60"/>
    <line x1="0" y1="140" x2="680" y2="140"/>
    <line x1="0" y1="220" x2="680" y2="220"/>
    <line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="380" x2="680" y2="380"/>
    <line x1="113" y1="0" x2="113" y2="420"/>
    <line x1="226" y1="0" x2="226" y2="420"/>
    <line x1="340" y1="0" x2="340" y2="420"/>
    <line x1="453" y1="0" x2="453" y2="420"/>
    <line x1="566" y1="0" x2="566" y2="420"/>
  </g>

  <text x="340" y="30" text-anchor="middle" fill="#e8e8e8" font-family="monospace" font-size="15" font-weight="bold">UVC LED杀菌驱动系统架构图</text>
  <text x="340" y="48" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="10">5道关 = 效率 + 电流 + 热 + 安全 + 智能</text>

  <!-- Center: UVC LED Engine -->
  <circle cx="340" cy="220" r="45" fill="url(#node)" stroke="#9b59ff" stroke-width="2" filter="url(#glow3)"/>
  <text x="340" y="215" text-anchor="middle" fill="#9b59ff" font-family="monospace" font-size="11" font-weight="bold">UVC LED</text>
  <text x="340" y="230" text-anchor="middle" fill="#9b59ff" font-family="monospace" font-size="9">265nm</text>
  <text x="340" y="245" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="8">AlGaN</text>

  <!-- Gate 1: Efficiency (top) -->
  <rect x="280" y="70" width="120" height="50" fill="none" stroke="#ff6b6b" stroke-width="1.5" rx="6"/>
  <text x="340" y="88" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="10" font-weight="bold">GATE 1: 效率</text>
  <text x="340" y="102" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">WPE 3-10%</text>
  <text x="340" y="114" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">14段AC驱动 95%</text>
  <line x1="340" y1="120" x2="340" y2="175" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Gate 2: Current (top-right) -->
  <rect x="470" y="100" width="120" height="50" fill="none" stroke="#ffaa00" stroke-width="1.5" rx="6"/>
  <text x="530" y="118" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="10" font-weight="bold">GATE 2: 电流</text>
  <text x="530" y="132" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">±1% 恒流精度</text>
  <text x="530" y="144" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">降额20% → x4寿命</text>
  <line x1="470" y1="140" x2="385" y2="200" stroke="#ffaa00" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Gate 3: Thermal (right) -->
  <rect x="470" y="195" width="120" height="50" fill="none" stroke="#00d4ff" stroke-width="1.5" rx="6"/>
  <text x="530" y="213" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" font-weight="bold">GATE 3: 热关</text>
  <text x="530" y="227" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">结温&lt;50°C</text>
  <text x="530" y="239" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">AlN基板 + NTC</text>
  <line x1="470" y1="220" x2="385" y2="220" stroke="#00d4ff" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Gate 4: Safety (bottom) -->
  <rect x="280" y="320" width="120" height="50" fill="none" stroke="#ff4444" stroke-width="1.5" rx="6"/>
  <text x="340" y="338" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10" font-weight="bold">GATE 4: 安全</text>
  <text x="340" y="352" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">IEC 62471 RG3</text>
  <text x="340" y="364" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">互锁 + 剂量监测</text>
  <line x1="340" y1="320" x2="340" y2="265" stroke="#ff4444" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Gate 5: Smart (left) -->
  <rect x="90" y="195" width="120" height="50" fill="none" stroke="#00ff88" stroke-width="1.5" rx="6"/>
  <text x="150" y="213" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10" font-weight="bold">GATE 5: 智能</text>
  <text x="150" y="227" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">IoT 18%→增长</text>
  <text x="150" y="239" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="8">AI剂量上云</text>
  <line x1="210" y1="220" x2="295" y2="220" stroke="#00ff88" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Input sources (top-left corner) -->
  <text x="30" y="75" fill="#8aa0b8" font-family="monospace" font-size="9">INPUT</text>
  <text x="30" y="92" fill="#6a7d99" font-family="monospace" font-size="8">AC 220V</text>
  <text x="30" y="106" fill="#6a7d99" font-family="monospace" font-size="8">or DC 24/36V</text>
  <line x1="30" y1="115" x2="30" y2="195" stroke="#2d5a8e" stroke-width="1"/>
  <line x1="30" y1="195" x2="90" y2="220" stroke="#2d5a8e" stroke-width="1" opacity="0.5"/>

  <!-- Output (bottom-right) -->
  <text x="650" y="320" text-anchor="end" fill="#8aa0b8" font-family="monospace" font-size="9">OUTPUT</text>
  <text x="650" y="337" text-anchor="end" fill="#6a7d99" font-family="monospace" font-size="8">265nm UV-C</text>
  <text x="650" y="351" text-anchor="end" fill="#6a7d99" font-family="monospace" font-size="8">100-200mW</text>
  <line x1="650" y1="310" x2="650" y2="245" stroke="#2d5a8e" stroke-width="1"/>
  <line x1="650" y1="245" x2="590" y2="220" stroke="#2d5a8e" stroke-width="1" opacity="0.5"/>

  <!-- Sensors (bottom-left) -->
  <rect x="90" y="320" width="120" height="50" fill="none" stroke="#6a7d99" stroke-width="1" stroke-dasharray="2,2" rx="6"/>
  <text x="150" y="338" text-anchor="middle" fill="#8aa0b8" font-family="monospace" font-size="9" font-weight="bold">SENSORS</text>
  <text x="150" y="352" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="8">PIR人体感应</text>
  <text x="150" y="364" text-anchor="middle" fill="#6a7d99" font-family="monospace" font-size="8">UV剂量计</text>
  <line x1="150" y1="320" x2="210" y2="245" stroke="#6a7d99" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>
  <line x1="210" y1="245" x2="295" y2="245" stroke="#6a7d99" stroke-width="1" stroke-dasharray="2,2" opacity="0.3"/>

  <text x="340" y="408" text-anchor="middle" fill="#3d5a80" font-family="monospace" font-size="8">NEXLAMP // UV-C LED Driver System Architecture // 2026-08-20</text>
</svg>
