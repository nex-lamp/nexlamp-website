<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="stepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="600" fill="#0a1628"/>
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.3">
    <path d="M0 80 H1000 M0 160 H1000 M0 240 H1000 M0 320 H1000 M0 400 H1000 M0 480 H1000 M0 560 H1000"/>
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600 M800 0 V600 M900 0 V600"/>
  </g>

  <text x="48" y="58" fill="#e2e8f0" font-size="26" font-weight="700">不用仪器，三步锁定驱动</text>
  <text x="48" y="86" fill="#64748b" font-size="14">顺序不能颠倒：先分冷热态，再排除开关，最后才拆驱动</text>

  <!-- Step 1 -->
  <g>
    <rect x="48" y="112" width="288" height="196" rx="8" fill="#0d1e35" stroke="#1e3a5f"/>
    <circle cx="76" cy="140" r="14" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8"/>
    <text x="76" y="145" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="100" y="145" fill="#e2e8f0" font-size="15" font-weight="700">断电量时</text>
    <text x="72" y="180" fill="#cbd5e1" font-size="13">关灯静置 30 分钟以上再开，掐表</text>
    <text x="72" y="206" fill="#cbd5e1" font-size="13">关掉立刻再开一次，再掐表</text>
    <rect x="72" y="222" width="240" height="1" fill="#1e3a5f"/>
    <text x="72" y="248" fill="#94a3b8" font-size="12">判据</text>
    <text x="72" y="272" fill="#22c55e" font-size="13">冷态慢 + 热态秒亮 = 电容</text>
    <text x="72" y="294" fill="#64748b" font-size="11">两次一样慢 → 转第 2 步</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="356" y="112" width="288" height="196" rx="8" fill="#0d1e35" stroke="#1e3a5f"/>
    <circle cx="384" cy="140" r="14" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8"/>
    <text x="384" y="145" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="408" y="145" fill="#e2e8f0" font-size="15" font-weight="700">换开关试一次</text>
    <text x="380" y="180" fill="#cbd5e1" font-size="13">临时接到普通机械开关上</text>
    <text x="380" y="206" fill="#cbd5e1" font-size="13">（或直接短接开关两端）</text>
    <rect x="380" y="222" width="240" height="1" fill="#1e3a5f"/>
    <text x="380" y="248" fill="#94a3b8" font-size="12">判据</text>
    <text x="380" y="272" fill="#a78bfa" font-size="13">现象消失 = 开关漏电流</text>
    <text x="380" y="294" fill="#64748b" font-size="11">现象不变 → 转第 3 步</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="664" y="112" width="288" height="196" rx="8" fill="#0d1e35" stroke="#1e3a5f"/>
    <circle cx="692" cy="140" r="14" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8"/>
    <text x="692" y="145" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="716" y="145" fill="#e2e8f0" font-size="15" font-weight="700">断电看驱动</text>
    <text x="688" y="180" fill="#cbd5e1" font-size="13">外壳鼓包 / 变形 / 发黄</text>
    <text x="688" y="206" fill="#cbd5e1" font-size="13">电容顶部鼓顶、底部渗液</text>
    <rect x="688" y="222" width="240" height="1" fill="#1e3a5f"/>
    <text x="688" y="248" fill="#94a3b8" font-size="12">判据</text>
    <text x="688" y="272" fill="#f97316" font-size="13">见鼓包 = 直接换，不用测</text>
    <text x="688" y="294" fill="#64748b" font-size="11">铭牌超 5 年 → 别修，换</text>
  </g>

  <!-- 鼓包示意 -->
  <g>
    <rect x="48" y="326" width="430" height="216" rx="8" fill="#081525" stroke="#1e3a5f"/>
    <text x="72" y="354" fill="#94a3b8" font-size="13">电容顶部形状对照</text>

    <!-- 正常 -->
    <g>
      <rect x="86" y="402" width="110" height="60" rx="4" fill="#1e293b" stroke="#475569"/>
      <rect x="86" y="394" width="110" height="10" rx="3" fill="#64748b"/>
      <path d="M86 394 Q141 386 196 394" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <circle cx="120" cy="470" r="0" fill="none"/>
      <text x="141" y="492" fill="#22c55e" font-size="12" text-anchor="middle">正常：顶面平</text>
    </g>

    <!-- 鼓包 -->
    <g>
      <rect x="266" y="402" width="110" height="60" rx="4" fill="#1e293b" stroke="#7f1d1d"/>
      <path d="M266 402 Q321 362 376 402" fill="#3f1d1d" stroke="#f43f5e" stroke-width="2.5"/>
      <text x="321" y="424" fill="#fca5a5" font-size="10" text-anchor="middle">鼓顶</text>
      <text x="321" y="492" fill="#f43f5e" font-size="12" text-anchor="middle">鼓包：必须换</text>
    </g>

    <!-- 渗液 -->
    <g>
      <rect x="86" y="516" width="110" height="4" rx="2" fill="#7f1d1d"/>
      <text x="86" y="546" fill="#64748b" font-size="10">底部有褐色渗液或白色结晶 → 已失效</text>
    </g>
  </g>

  <!-- 右侧：五参数 -->
  <g>
    <rect x="500" y="326" width="452" height="216" rx="8" fill="#0d1e35" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="524" y="354" fill="#7dd3fc" font-size="14" font-weight="700">换驱动必须对上的五个参数</text>

    <g font-size="13">
      <rect x="524" y="368" width="200" height="30" rx="15" fill="#0f2740" stroke="#1e3a5f"/>
      <text x="544" y="388" fill="#cbd5e1">① 输出电流（mA）</text>
      <rect x="740" y="368" width="188" height="30" rx="15" fill="#0f2740" stroke="#1e3a5f"/>
      <text x="760" y="388" fill="#cbd5e1">② 输出电压范围</text>

      <rect x="524" y="410" width="200" height="30" rx="15" fill="#0f2740" stroke="#1e3a5f"/>
      <text x="544" y="430" fill="#cbd5e1">③ 功率留 10–20%</text>
      <rect x="740" y="410" width="188" height="30" rx="15" fill="#0f2740" stroke="#1e3a5f"/>
      <text x="760" y="430" fill="#cbd5e1">④ 3C / CQC 认证</text>

      <rect x="524" y="452" width="404" height="30" rx="15" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="544" y="472" fill="#7dd3fc">⑤ 电容耐温 105℃（宽温型 -40 ~ 105℃）</text>
    </g>

    <text x="524" y="506" fill="#64748b" font-size="12">电流买大一号 → 灯珠过热、光衰加快；电压范围不覆盖 → 低亮档起不来</text>
    <text x="524" y="528" fill="#22c55e" font-size="12">同样参数下优先选灌胶驱动：胶体绝缘兼导热，电容温度低一截</text>
  </g>
</svg>
