<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1f35"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="680" height="480" fill="url(#bgGrad3)"/>
  <rect width="680" height="480" fill="url(#grid3)"/>

  <!-- Terminal window -->
  <rect x="30" y="30" width="620" height="420" rx="12" fill="#0f2744" stroke="#1e4a75" stroke-width="1.5"/>
  <rect x="30" y="30" width="620" height="44" rx="12" fill="#16365a"/>
  <circle cx="58" cy="52" r="7" fill="#ff5f57"/>
  <circle cx="82" cy="52" r="7" fill="#febc2e"/>
  <circle cx="106" cy="52" r="7" fill="#28c840"/>
  <text x="340" y="58" font-family="Consolas, monospace" font-size="14" fill="#8ab4c7" text-anchor="middle">failure-diagnosis.log</text>

  <!-- Title -->
  <text x="340" y="110" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#7ee787" text-anchor="middle" filter="url(#glow3)">灯带翻车诊断流程</text>
  <text x="340" y="138" font-family="Consolas, monospace" font-size="12" fill="#5b8c5a" text-anchor="middle">// 先查驱动，再查灯带</text>

  <!-- Central driver -->
  <rect x="280" y="170" width="120" height="70" rx="8" fill="#1e4a75" stroke="#7ee787" stroke-width="2"/>
  <text x="340" y="200" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">双色温驱动</text>
  <text x="340" y="222" font-family="Consolas, monospace" font-size="11" fill="#7ee787" text-anchor="middle">Tunable White Driver</text>

  <!-- Failure 1: top left -->
  <rect x="60" y="160" width="180" height="90" rx="8" fill="#0d1f35" stroke="#ff8a65" stroke-width="1.5"/>
  <text x="150" y="185" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ff8a65" text-anchor="middle">色温漂移</text>
  <text x="150" y="208" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#c7d4e0" text-anchor="middle">APP 3000K，实际偏蓝</text>
  <text x="150" y="228" font-family="Consolas, monospace" font-size="10" fill="#8ab4c7" text-anchor="middle">&gt; check voltage accuracy</text>
  <line x1="240" y1="205" x2="280" y2="205" stroke="#ff8a65" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Failure 2: top right -->
  <rect x="440" y="160" width="180" height="90" rx="8" fill="#0d1f35" stroke="#ffd700" stroke-width="1.5"/>
  <text x="530" y="185" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ffd700" text-anchor="middle">低亮频闪</text>
  <text x="530" y="208" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#c7d4e0" text-anchor="middle">10%以下开始闪烁</text>
  <text x="530" y="228" font-family="Consolas, monospace" font-size="10" fill="#8ab4c7" text-anchor="middle">&gt; check PWM frequency</text>
  <line x1="440" y1="205" x2="400" y2="205" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Failure 3: bottom left -->
  <rect x="60" y="290" width="180" height="90" rx="8" fill="#0d1f35" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="150" y="315" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#4fc3f7" text-anchor="middle">白光不可调色温</text>
  <text x="150" y="338" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#c7d4e0" text-anchor="middle">RGBCW只识别RGB</text>
  <text x="150" y="358" font-family="Consolas, monospace" font-size="10" fill="#8ab4c7" text-anchor="middle">&gt; check channel count</text>
  <line x1="240" y1="335" x2="300" y2="240" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Failure 4: bottom right -->
  <rect x="440" y="290" width="180" height="90" rx="8" fill="#0d1f35" stroke="#7ee787" stroke-width="1.5"/>
  <text x="530" y="315" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">末端偏冷</text>
  <text x="530" y="338" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#c7d4e0" text-anchor="middle">长灯带远端发蓝</text>
  <text x="530" y="358" font-family="Consolas, monospace" font-size="10" fill="#8ab4c7" text-anchor="middle">&gt; check voltage drop</text>
  <line x1="440" y1="335" x2="380" y2="240" stroke="#7ee787" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Solution box -->
  <rect x="100" y="405" width="480" height="28" rx="6" fill="#16365a" opacity="0.9"/>
  <text x="340" y="424" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">诊断口诀：电压不稳看精度，低亮闪烁看频率，调不了色温看通道，末端偏冷看压降</text>

  <text x="640" y="465" font-family="Arial, sans-serif" font-size="10" fill="#3a6a8a" text-anchor="end">NEXLAMP TECHNOLOGY</text>
</svg>