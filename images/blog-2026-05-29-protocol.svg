  <text x="207" y="264" fill="#00d4aa" font-family="Arial,sans-serif" font-size="9">推荐：10~100+设备</text>

  <!-- BLE Mesh Card -->
  <rect x="360" y="70" width="145" height="200" rx="6" fill="#0d1f3c" stroke="#4da6ff" stroke-width="1.5" opacity="0.9"/>
  <rect x="360" y="70" width="145" height="32" rx="6" fill="url(#gradBLE)" opacity="0.3"/>
