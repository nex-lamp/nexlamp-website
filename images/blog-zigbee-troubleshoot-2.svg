<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a3a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#0a1628"/>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <!-- 标题栏 -->
  <rect x="20" y="20" width="760" height="50" rx="4" fill="#0d1f35" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="44" cy="45" r="8" fill="#ff5f56"/>
  <circle cx="66" cy="45" r="8" fill="#ffbd2e"/>
  <circle cx="88" cy="45" r="8" fill="#27c93f"/>
  <text x="120" y="51" font-family="'Courier New', monospace" font-size="14" fill="#4fc3f7">
    $ zigbee-fix --interference-check --channel-scan
  </text>

  <!-- 标题 -->
  <text x="400" y="100" font-family="'Courier New', monospace" font-size="13" fill="#64b5f6" text-anchor="middle">[ 2.4GHz INTERFERENCE MAP - CHANNEL CONFLICT ANALYSIS ]</text>

  <!-- 频道干扰条形图 -->
  <!-- Y轴标签 -->
  <text x="55" y="135" font-family="'Courier New', monospace" font-size="10" fill="#546e7a">RSSI(dBm)</text>
  <line x1="80" y1="130" x2="80" y2="340" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="80" y1="340" x2="750" y2="340" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Y轴刻度 -->
  <text x="55" y="145" font-family="'Courier New', monospace" font-size="9" fill="#546e7a">-40</text>
  <line x1="78" y1="143" x2="750" y2="143" stroke="#1e3a5f" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="55" y="195" font-family="'Courier New', monospace" font-size="9" fill="#546e7a">-60</text>
  <line x1="78" y1="193" x2="750" y2="193" stroke="#1e3a5f" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="55" y="245" font-family="'Courier New', monospace" font-size="9" fill="#546e7a">-80</text>
  <line x1="78" y1="243" x2="750" y2="243" stroke="#1e3a5f" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="55" y="295" font-family="'Courier New', monospace" font-size="9" fill="#546e7a">-100</text>
  <line x1="78" y1="293" x2="750" y2="293" stroke="#1e3a5f" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- WiFi 信道 1 - 强干扰 -->
  <rect x="100" y="153" width="55" height="187" fill="#ff5252" opacity="0.3" rx="2"/>
  <rect x="100" y="143" width="55" height="10" fill="#ff5252" opacity="0.8" rx="2" filter="url(#glow2)"/>
  <text x="127" y="355" font-family="'Courier New', monospace" font-size="9" fill="#ef9a9a" text-anchor="middle">WiFi CH1</text>
  <text x="127" y="367" font-family="'Courier New', monospace" font-size="8" fill="#ff5252" text-anchor="middle">-40dBm!</text>

  <!-- WiFi 信道 6 - 中度干扰 -->
  <rect x="270" y="193" width="55" height="147" fill="#ffb74d" opacity="0.3" rx="2"/>
  <rect x="270" y="183" width="55" height="10" fill="#ffb74d" opacity="0.8" rx="2"/>
  <text x="297" y="355" font-family="'Courier New', monospace" font-size="9" fill="#ffe0b2" text-anchor="middle">WiFi CH6</text>
  <text x="297" y="367" font-family="'Courier New', monospace" font-size="8" fill="#ffb74d" text-anchor="middle">-60dBm</text>

  <!-- Zigbee CH11 (2405MHz) - 与WiFi CH1重叠！ -->
  <rect x="150" y="193" width="40" height="147" fill="#ff5252" opacity="0.4" rx="2"/>
  <rect x="150" y="183" width="40" height="10" fill="#ff5252" rx="2" filter="url(#glow2)"/>
  <text x="170" y="355" font-family="'Courier New', monospace" font-size="9" fill="#ff5252" text-anchor="middle">ZB CH11</text>
  <text x="170" y="367" font-family="'Courier New', monospace" font-size="8" fill="#ef9a9a" text-anchor="middle">CONFLICT!</text>

  <!-- Zigbee CH15 - 轻微干扰 -->
  <rect x="390" y="253" width="40" height="87" fill="#ffb74d" opacity="0.4" rx="2"/>
  <rect x="390" y="243" width="40" height="10" fill="#ffb74d" rx="2"/>
  <text x="410" y="355" font-family="'Courier New', monospace" font-size="9" fill="#ffb74d" text-anchor="middle">ZB CH15</text>
  <text x="410" y="367" font-family="'Courier New', monospace" font-size="8" fill="#ffe0b2" text-anchor="middle">MARGINAL</text>

  <!-- Zigbee CH25 - 推荐，无干扰 -->
  <rect x="580" y="243" width="40" height="97" fill="#69f0ae" opacity="0.3" rx="2"/>
  <rect x="580" y="233" width="40" height="10" fill="#69f0ae" rx="2" filter="url(#glow2)"/>
  <text x="600" y="355" font-family="'Courier New', monospace" font-size="9" fill="#69f0ae" text-anchor="middle">ZB CH25</text>
  <text x="600" y="367" font-family="'Courier New', monospace" font-size="8" fill="#a5d6a7" text-anchor="middle">RECOMMEND</text>

  <!-- WiFi CH11 - 无干扰区域 -->
  <rect x="680" y="293" width="45" height="47" fill="#546e7a" opacity="0.2" rx="2"/>
  <rect x="680" y="283" width="45" height="10" fill="#546e7a" rx="2"/>
  <text x="702" y="355" font-family="'Courier New', monospace" font-size="9" fill="#78909c" text-anchor="middle">WiFi CH11</text>
  <text x="702" y="367" font-family="'Courier New', monospace" font-size="8" fill="#546e7a" text-anchor="middle">-100dBm</text>

  <!-- 结论框 -->
  <rect x="30" y="390" width="740" height="45" rx="4" fill="#0d1f35" stroke="#1e3a5f" stroke-width="1"/>
  <text x="50" y="410" font-family="'Courier New', monospace" font-size="10" fill="#ff5252">
    [WARN] Zigbee CH11 overlaps with WiFi 2.4GHz CH1 -- RSSI collision detected!
  </text>
  <text x="50" y="428" font-family="'Courier New', monospace" font-size="10" fill="#69f0ae">
    [FIX]  Switch Zigbee to CH25 (2475MHz) or CH26 to avoid WiFi 1/6/11 interference bands
  </text>
</svg>
