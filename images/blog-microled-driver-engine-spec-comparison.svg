    <line x1="100" y1="0" x2="1100" y2="0" stroke="#1a2547" stroke-width="1"/>
    <text x="600" y="35" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#ffffff">MicroLED 把 LED 驱动从"功率盒"推向"光引擎芯片"</text>
    <text x="600" y="58" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13" fill="#7ec8e3">数据来源：华灿光电 8 月 4 日答投资者 · 觉远创智柳州基地月产 10 万套 · 三安鄂州 2 万片/月 · 聚积科技 48 通道</text>
