<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d2038"/>
    </linearGradient>
    <linearGradient id="glow6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#0099ff"/>
    </linearGradient>
    <filter id="f6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="beam" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bg6)"/>
  <g stroke="#1a3a5c" stroke-width="1" opacity="0.4">
    <line x1="0" y1="93" x2="800" y2="93"/><line x1="0" y1="186" x2="800" y2="186"/>
    <line x1="0" y1="279" x2="800" y2="279"/><line x1="0" y1="372" x2="800" y2="372"/>
    <line x1="0" y1="465" x2="800" y2="465"/>
    <line x1="114" y1="0" x2="114" y2="560"/><line x1="228" y1="0" x2="228" y2="560"/>
    <line x1="342" y1="0" x2="342" y2="560"/><line x1="456" y1="0" x2="456" y2="560"/>
    <line x1="570" y1="0" x2="570" y2="560"/><line x1="684" y1="0" x2="684" y2="560"/>
  </g>
  <rect x="0" y="0" width="800" height="60" fill="#071020" opacity="0.9"/>
  <circle cx="36" cy="30" r="6" fill="#ff5f57"/><circle cx="56" cy="30" r="6" fill="#febc2e"/><circle cx="76" cy="30" r="6" fill="#28c840"/>
  <text x="400" y="38" text-anchor="middle" fill="#e8f4ff" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">光束角怎么选：一支射灯的3种性格</text>
  <line x1="200" y1="50" x2="600" y2="50" stroke="url(#glow6)" stroke-width="2" filter="url(#f6)"/>

  <!-- 24° narrow -->
  <g filter="url(#f6)">
    <circle cx="175" cy="120" r="10" fill="#ffe9b0"/>
  </g>
  <polygon points="175,128 125,340 225,340" fill="url(#beam)"/>
  <rect x="115" y="340" width="120" height="8" rx="3" fill="#3a5a7a"/>
  <text x="175" y="378" text-anchor="middle" fill="#e8f4ff" font-family="Consolas, monospace" font-size="17" font-weight="bold">24°</text>
  <text x="175" y="404" text-anchor="middle" fill="#7dffd4" font-family="Microsoft YaHei, sans-serif" font-size="15">重点照明</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#8ab4d8">
    <text x="175" y="430" text-anchor="middle">餐桌 · 茶几 · 装饰画</text>
    <text x="175" y="452" text-anchor="middle">光斑小而锐 · 突出主体</text>
  </g>

  <!-- 36° medium -->
  <g filter="url(#f6)">
    <circle cx="400" cy="120" r="10" fill="#ffe9b0"/>
  </g>
  <polygon points="400,128 310,340 490,340" fill="url(#beam)"/>
  <rect x="310" y="340" width="180" height="8" rx="3" fill="#3a5a7a"/>
  <text x="400" y="378" text-anchor="middle" fill="#e8f4ff" font-family="Consolas, monospace" font-size="17" font-weight="bold">36°+</text>
  <text x="400" y="404" text-anchor="middle" fill="#7dffd4" font-family="Microsoft YaHei, sans-serif" font-size="15">环境照明</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#8ab4d8">
    <text x="400" y="430" text-anchor="middle">过道 · 玄关 · 基础补光</text>
    <text x="400" y="452" text-anchor="middle">光斑柔 · 过渡自然不晃眼</text>
  </g>

  <!-- 38° wall wash -->
  <g filter="url(#f6)">
    <circle cx="625" cy="120" r="10" fill="#ffe9b0"/>
  </g>
  <polygon points="625,128 545,330 640,330 640,340 705,340" fill="url(#beam)"/>
  <rect x="545" y="330" width="160" height="70" fill="none" stroke="#3a5a7a" stroke-width="1.5"/>
  <line x1="555" y1="340" x2="555" y2="390" stroke="#00d4aa" stroke-width="2" opacity="0.7"/>
  <line x1="585" y1="340" x2="585" y2="390" stroke="#00d4aa" stroke-width="2" opacity="0.5"/>
  <line x1="615" y1="340" x2="615" y2="390" stroke="#00d4aa" stroke-width="2" opacity="0.4"/>
  <text x="625" y="378" text-anchor="middle" fill="#e8f4ff" font-family="Consolas, monospace" font-size="17" font-weight="bold"> </text>
  <text x="625" y="424" text-anchor="middle" fill="#7dffd4" font-family="Microsoft YaHei, sans-serif" font-size="15">洗墙照明</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#8ab4d8">
    <text x="625" y="450" text-anchor="middle">离墙30-40cm · 均匀刷亮墙面</text>
  </g>

  <!-- warning strip -->
  <g filter="url(#f6)">
    <rect x="90" y="490" width="620" height="46" rx="10" fill="#2d1a1a" stroke="#ff7b7b" stroke-width="1.5"/>
  </g>
  <text x="400" y="510" text-anchor="middle" fill="#ff9f9f" font-family="Microsoft YaHei, sans-serif" font-size="14.5" font-weight="bold">⚠ 浅杯裸光源 + 光束角选窄装太高 = "装了不敢开"的重灾区</text>
  <text x="400" y="529" text-anchor="middle" fill="#c98a8a" font-family="Microsoft YaHei, sans-serif" font-size="12">坐着平视看不到灯珠（UGR&lt;19 为佳）· 射灯占比不超过总数一半</text>
</svg>
