<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3a"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="cloudGrad" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#4d9aff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1a3a5f" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="mcuGrad" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <rect width="800" height="500" fill="url(#grid2)"/>

  <!-- 标题 -->
  <text x="400" y="38" text-anchor="middle" fill="#e8f4ff" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">OTA 升级流程：从云端推送到每盏路灯</text>
  <text x="400" y="60" text-anchor="middle" fill="#7e9bb8" font-family="Microsoft YaHei, sans-serif" font-size="12">一键推送 4万盏路灯升级只需45分钟</text>

  <!-- 云端平台 -->
  <g transform="translate(280,90)">
    <ellipse cx="120" cy="40" rx="120" ry="36" fill="url(#cloudGrad)" stroke="#4d9aff" stroke-width="1.5"/>
    <text x="120" y="32" text-anchor="middle" fill="#cce6ff" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold">路灯运维云平台</text>
    <text x="120" y="52" text-anchor="middle" fill="#7e9bb8" font-family="Microsoft YaHei, sans-serif" font-size="10">Cloud &amp; Centralized Management</text>
  </g>

  <!-- 固件发布按钮 -->
  <g transform="translate(630,100)">
    <rect width="130" height="50" rx="6" fill="#1a3a5f" stroke="#4d9aff" stroke-width="1.5"/>
    <text x="65" y="22" text-anchor="middle" fill="#cce6ff" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold">运维点推送</text>
    <text x="65" y="40" text-anchor="middle" fill="#7e9bb8" font-family="Microsoft YaHei, sans-serif" font-size="9">v2.1.8 firmware</text>
  </g>

  <!-- 阶段线（虚线时间轴） -->
  <line x1="100" y1="180" x2="700" y2="180" stroke="#4d9aff" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="100" cy="180" r="6" fill="#0a1628" stroke="#4d9aff" stroke-width="2"/>
  <circle cx="280" cy="180" r="6" fill="#0a1628" stroke="#4d9aff" stroke-width="2"/>
  <circle cx="460" cy="180" r="6" fill="#0a1628" stroke="#4d9aff" stroke-width="2"/>
  <circle cx="640" cy="180" r="6" fill="#0a1628" stroke="#4d9aff" stroke-width="2"/>

  <!-- 阶段 1：推送 -->
  <g transform="translate(60,210)">
    <rect width="160" height="120" rx="8" fill="#0d2238" stroke="#4d9aff" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" fill="#4d9aff"/>
    <text x="20" y="25" text-anchor="middle" fill="#0a1628" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold">1</text>
    <text x="45" y="24" fill="#cce6ff" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold">云端推送</text>
    <text x="12" y="58" fill="#a8c5e8" font-family="Microsoft YaHei, sans-serif" font-size="11">• 选定目标片区</text>
    <text x="12" y="78" fill="#a8c5e8" font-family="Microsoft YaHei, sans-serif" font-size="11">• 校验固件签名</text>
    <text x="12" y="98" fill="#a8c5e8" font-family="Microsoft YaHei, sans-serif" font-size="11">• 设定调度时间</text>
  </g>

  <!-- 阶段 2：下发 -->
  <g transform="translate(240,210)">
    <rect width="160" height="120" rx="8" fill="#0d2238" stroke="#4d9aff" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" fill="#4d9aff"/>
    <text x="20" y="25" text-anchor="middle" fill="#0a1628" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold">2</text>
    <text x="45" y="24" fill="#cce6ff" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold">基站下发</text>
    <text x="12" y="58" fill="#a8c5e8" font-family="Microsoft YaHei, sans-serif" font-size="11">• NB-IoT/HPLC 广播</text>
    <text x="12" y="78" fill="#a8c5e8" font-family="Microsoft YaHei, sans-serif" font-size="11">• 边缘网关中继</text>
    <text x="12" y="98" fill="#a8c5e8" font-family="Microsoft YaHei, sans-serif" font-size="11">• 加密TLS 1.3 链路</text>
  </g>

  <!-- 阶段 3：边缘刷写 -->
  <g transform="translate(420,210)">
    <rect width="160" height="120" rx="8" fill="#0d2238" stroke="#ffd166" stroke-width="2"/>
    <circle cx="20" cy="20" r="14" fill="#ffd166"/>
    <text x="20" y="25" text-anchor="middle" fill="#0a1628" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold">3</text>
    <text x="45" y="24" fill="#ffd166" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold">本地刷写</text>
    <text x="12" y="58" fill="#fff1cc" font-family="Microsoft YaHei, sans-serif" font-size="11">• 双Bank分区存储</text>
    <text x="12" y="78" fill="#fff1cc" font-family="Microsoft YaHei, sans-serif" font-size="11">• 签名验证后写入</text>
    <text x="12" y="98" fill="#fff1cc" font-family="Microsoft YaHei, sans-serif" font-size="11">• 失败自动回滚</text>
  </g>

  <!-- 阶段 4：上报 -->
  <g transform="translate(600,210)">
    <rect width="160" height="120" rx="8" fill="#0d2238" stroke="#4caf72" stroke-width="2"/>
    <circle cx="20" cy="20" r="14" fill="#4caf72"/>
    <text x="20" y="25" text-anchor="middle" fill="#0a1628" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold">4</text>
    <text x="45" y="24" fill="#bdf5d0" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold">完成上报</text>
    <text x="12" y="58" fill="#bdf5d0" font-family="Microsoft YaHei, sans-serif" font-size="11">• 状态回传云端</text>
    <text x="12" y="78" fill="#bdf5d0" font-family="Microsoft YaHei, sans-serif" font-size="11">• 失败盏数 / 重试</text>
    <text x="12" y="98" fill="#bdf5d0" font-family="Microsoft YaHei, sans-serif" font-size="11">• 升级日志归档</text>
  </g>

  <!-- 路灯阵列示意（底部） -->
  <g transform="translate(100,365)">
    <rect width="600" height="100" rx="8" fill="#0d2238" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
    <text x="300" y="22" text-anchor="middle" fill="#7e9bb8" font-family="Microsoft YaHei, sans-serif" font-size="11">4万盏路灯 · 同步升级</text>

    <!-- 灯阵列 -->
    <g transform="translate(40,40)">
      <g>
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(20,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(40,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(60,0)">
        <rect width="14" height="20" rx="2" fill="#7df4a0"/>
        <rect x="5" y="-3" width="4" height="3" fill="#7df4a0"/>
      </g>
      <g transform="translate(80,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(100,0)">
        <rect width="14" height="20" rx="2" fill="#ff9966"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ff9966"/>
      </g>
      <g transform="translate(120,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(140,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(160,0)">
        <rect width="14" height="20" rx="2" fill="#7df4a0"/>
        <rect x="5" y="-3" width="4" height="3" fill="#7df4a0"/>
      </g>
      <g transform="translate(180,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(200,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(220,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(240,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(260,0)">
        <rect width="14" height="20" rx="2" fill="#7df4a0"/>
        <rect x="5" y="-3" width="4" height="3" fill="#7df4a0"/>
      </g>
      <g transform="translate(280,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>
      <g transform="translate(300,0)">
        <rect width="14" height="20" rx="2" fill="#ffd166"/>
        <rect x="5" y="-3" width="4" height="3" fill="#ffd166"/>
      </g>

      <text x="-30" y="14" fill="#7e9bb8" font-family="Microsoft YaHei, sans-serif" font-size="9">#1</text>
      <text x="335" y="14" fill="#7e9bb8" font-family="Microsoft YaHei, sans-serif" font-size="9">#32</text>
    </g>

    <!-- 颜色图例 -->
    <g transform="translate(40,75)" fill="#cce6ff" font-family="Microsoft YaHei, sans-serif" font-size="10">
      <rect width="10" height="10" rx="1" fill="#7df4a0"/>
      <text x="14" y="9">已升级</text>
      <rect x="80" width="10" height="10" rx="1" fill="#ffd166"/>
      <text x="94" y="9">升级中</text>
      <rect x="160" width="10" height="10" rx="1" fill="#ff9966"/>
      <text x="174" y="9">重试中</text>
    </g>
  </g>

  <text x="400" y="485" text-anchor="middle" fill="#5e7e9e" font-family="Microsoft YaHei, sans-serif" font-size="10">图2：OTA四阶段流程 · 整体升级耗时 45min（杭州4万盏实测）</text>
</svg>
