<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect x="0" y="0" width="680" height="320" fill="#1a1a2e" rx="0"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" fill="#e0e0ff" font-family="sans-serif" font-size="16" font-weight="500">中小照明厂AI落地三步走</text>

  <!-- Step 1 -->
  <rect x="40" y="55" width="180" height="200" rx="12" fill="#16213e" stroke="#ff9f43" stroke-width="1.5"/>
  <circle cx="130" cy="85" r="20" fill="#ff9f43" stroke="none"/>
  <text x="130" y="91" text-anchor="middle" fill="#1a1a2e" font-family="sans-serif" font-size="16" font-weight="500">1</text>
  <text x="130" y="125" text-anchor="middle" fill="#ff9f43" font-family="sans-serif" font-size="14" font-weight="500">数据积累</text>
  <text x="130" y="148" text-anchor="middle" fill="#ccaa88" font-family="sans-serif" font-size="11">收集能耗曲线</text>
  <text x="130" y="165" text-anchor="middle" fill="#ccaa88" font-family="sans-serif" font-size="11">传感器触发频率</text>
  <text x="130" y="182" text-anchor="middle" fill="#ccaa88" font-family="sans-serif" font-size="11">用户手动调节记录</text>
  <text x="130" y="210" text-anchor="middle" fill="#aa8866" font-family="sans-serif" font-size="11">周期: 现在就开始</text>
  <text x="130" y="227" text-anchor="middle" fill="#aa8866" font-family="sans-serif" font-size="11">工具: Excel即可</text>

  <!-- Arrow -->
  <line x1="230" y1="155" x2="260" y2="155" stroke="#556677" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="280" y="55" width="180" height="200" rx="12" fill="#16213e" stroke="#4a9eff" stroke-width="1.5"/>
  <circle cx="370" cy="85" r="20" fill="#4a9eff" stroke="none"/>
  <text x="370" y="91" text-anchor="middle" fill="#1a1a2e" font-family="sans-serif" font-size="16" font-weight="500">2</text>
  <text x="370" y="125" text-anchor="middle" fill="#4a9eff" font-family="sans-serif" font-size="14" font-weight="500">规则引擎过渡</text>
  <text x="370" y="148" text-anchor="middle" fill="#aaccff" font-family="sans-serif" font-size="11">统计型自动规则</text>
  <text x="370" y="165" text-anchor="middle" fill="#aaccff" font-family="sans-serif" font-size="11">连续三天调高亮度</text>
  <text x="370" y="182" text-anchor="middle" fill="#aaccff" font-family="sans-serif" font-size="11">自动上调默认场景</text>
  <text x="370" y="210" text-anchor="middle" fill="#7799cc" font-family="sans-serif" font-size="11">周期: 6-12个月</text>
  <text x="370" y="227" text-anchor="middle" fill="#7799cc" font-family="sans-serif" font-size="11">产出: 标注数据集</text>

  <!-- Arrow -->
  <line x1="470" y1="155" x2="500" y2="155" stroke="#556677" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="520" y="55" width="130" height="200" rx="12" fill="#16213e" stroke="#00d4aa" stroke-width="1.5"/>
  <circle cx="585" cy="85" r="20" fill="#00d4aa" stroke="none"/>
  <text x="585" y="91" text-anchor="middle" fill="#1a1a2e" font-family="sans-serif" font-size="16" font-weight="500">3</text>
  <text x="585" y="125" text-anchor="middle" fill="#00d4aa" font-family="sans-serif" font-size="14" font-weight="500">轻量AI</text>
  <text x="585" y="148" text-anchor="middle" fill="#88ddcc" font-family="sans-serif" font-size="11">单一场景切入</text>
  <text x="585" y="165" text-anchor="middle" fill="#88ddcc" font-family="sans-serif" font-size="11">约束框架保障</text>
  <text x="585" y="182" text-anchor="middle" fill="#88ddcc" font-family="sans-serif" font-size="11">安全可控输出</text>
  <text x="585" y="210" text-anchor="middle" fill="#66bb99" font-family="sans-serif" font-size="11">周期: 12-24月</text>
  <text x="585" y="227" text-anchor="middle" fill="#66bb99" font-family="sans-serif" font-size="11">目标: 验证扩展</text>

  <!-- Bottom timeline -->
  <line x1="130" y1="275" x2="585" y2="275" stroke="#334455" stroke-width="2"/>
  <circle cx="130" cy="275" r="5" fill="#ff9f43"/>
  <circle cx="370" cy="275" r="5" fill="#4a9eff"/>
  <circle cx="585" cy="275" r="5" fill="#00d4aa"/>
  <text x="130" y="295" text-anchor="middle" fill="#aa8866" font-family="sans-serif" font-size="11">现在</text>
  <text x="370" y="295" text-anchor="middle" fill="#7799cc" font-family="sans-serif" font-size="11">6-12个月</text>
  <text x="585" y="295" text-anchor="middle" fill="#66bb99" font-family="sans-serif" font-size="11">1-2年</text>

  <!-- Bottom note -->
  <text x="340" y="315" text-anchor="middle" fill="#445566" font-family="sans-serif" font-size="11">关键原则：小步快跑，单点验证，再扩展 · 不要一上来就做"全屋AI大脑"</text>
</svg>