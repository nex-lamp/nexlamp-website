    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
  </g>
  <text x="400" y="45" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#ffffff">智能灯待机时，电都去哪儿了？</text>
  <text x="400" y="75" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7ec27e">关灯不等于断电，三个模块仍在持续耗电</text>
  <g transform="translate(100,160)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#0f2744" stroke="#7ec27e" stroke-width="2" />
    <circle cx="90" cy="35" r="22" fill="#1e3a5f" stroke="#7ec27e" stroke-width="2" />
    <path d="M78 35 L85 35 L85 28 L95 28 L95 35 L102 35 L102 42 L95 42 L95 49 L85 49 L85 42 L78 42 Z" fill="#7ec27e" />
    <text x="90" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">无线通信模块</text>
    <text x="90" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a0c4ff">Zigbee 0.1–0.3W</text>
  </g>
  <g transform="translate(310,160)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#0f2744" stroke="#5b8c5a" stroke-width="2" />
    <rect x="55" y="15" width="70" height="40" rx="4" fill="#1e3a5f" stroke="#5b8c5a" stroke-width="2" />
    <text x="90" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7ec27e">220V → DC</text>
    <text x="90" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">LED驱动电源</text>
    <text x="90" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a0c4ff">辅助电源损耗</text>
  </g>
  <g transform="translate(520,160)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#0f2744" stroke="#c9a227" stroke-width="2" />
    <circle cx="90" cy="35" r="18" fill="#c9a227" opacity="0.3" filter="url(#blur)" />
    <circle cx="90" cy="35" r="8" fill="#c9a227" />
    <text x="90" y="80" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="bold">指示灯/传感器</text>
    <text x="90" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a0c4ff">常亮指示 + 雷达</text>
  </g>
  <g>
    <path d="M190 270 L190 320 L610 320 L610 270" fill="none" stroke="#7ec27e" stroke-width="2" marker-end="url(#arrow)" />
    <polygon points="610,270 605,282 615,282" fill="#7ec27e" />
  </g>
  <g transform="translate(260,350)">
    <rect x="0" y="0" width="280" height="70" rx="8" fill="#162b4d" stroke="#7ec27e" stroke-width="2" />
    <text x="140" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">总待机功耗 = 三者之和</text>
    <text x="140" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7ec27e">优质方案可控制在 0.3W 以内</text>
