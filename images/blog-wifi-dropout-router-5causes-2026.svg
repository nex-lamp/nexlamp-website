<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f38"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a3350" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <!-- 终端窗口 -->
  <rect x="60" y="50" width="1080" height="600" rx="12" fill="#0c1a2e" stroke="#2a4a6e" stroke-width="2"/>
  <rect x="60" y="50" width="1080" height="48" rx="12" fill="#12253f"/>
  <circle cx="95" cy="74" r="8" fill="#ff5f57"/>
  <circle cx="122" cy="74" r="8" fill="#febc2e"/>
  <circle cx="149" cy="74" r="8" fill="#28c840"/>
  <text x="600" y="80" text-anchor="middle" fill="#7ea8d8" font-size="17">~/diagnose $ ./wifi-light-dropout-check.sh</text>
  <text x="90" y="140" fill="#4df08a" font-size="22" filter="url(#glow)">[诊断结果] 智能灯掉线 · 5大路由器病根</text>
  <!-- 条目1 -->
  <rect x="90" y="165" width="1020" height="82" rx="8" fill="#122741" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="115" y="200" fill="#ff6b6b" font-size="24" font-weight="bold" filter="url(#glow)">1</text>
  <text x="150" y="202" fill="#e8f1fa" font-size="22" font-weight="bold">双频合一未关闭</text>
  <text x="150" y="232" fill="#8fb3d9" font-size="17">路由器自动把灯往5G踹 → 灯反复重连</text>
  <rect x="930" y="180" width="150" height="36" rx="18" fill="#3a1a24" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="1005" y="204" text-anchor="middle" fill="#ff8a8a" font-size="17" font-weight="bold">高频 ★★★★★</text>
  <!-- 条目2 -->
  <rect x="90" y="257" width="1020" height="82" rx="8" fill="#122741" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="115" y="292" fill="#ffb84d" font-size="24" font-weight="bold" filter="url(#glow)">2</text>
  <text x="150" y="294" fill="#e8f1fa" font-size="22" font-weight="bold">信道"自动" + 40MHz频宽</text>
  <text x="150" y="324" fill="#8fb3d9" font-size="17">邻居路由器一多就撞车 → 手动固定 1/6/11 + 20MHz</text>
  <rect x="930" y="272" width="150" height="36" rx="18" fill="#3a2e1a" stroke="#ffb84d" stroke-width="1.5"/>
  <text x="1005" y="296" text-anchor="middle" fill="#ffd08a" font-size="17" font-weight="bold">高频 ★★★★</text>
  <!-- 条目3 -->
  <rect x="90" y="349" width="1020" height="82" rx="8" fill="#122741" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="115" y="384" fill="#4dc3ff" font-size="24" font-weight="bold" filter="url(#glow)">3</text>
  <text x="150" y="386" fill="#e8f1fa" font-size="22" font-weight="bold">DHCP租期过短</text>
  <text x="150" y="416" fill="#8fb3d9" font-size="17">租期1-2小时一到期就掉 → 调24h+ 绑静态IP</text>
  <rect x="930" y="364" width="150" height="36" rx="18" fill="#1a2c3a" stroke="#4dc3ff" stroke-width="1.5"/>
  <text x="1005" y="388" text-anchor="middle" fill="#8ad8ff" font-size="17" font-weight="bold">隐匿 ★★★</text>
  <!-- 条目4 -->
  <rect x="90" y="441" width="1020" height="82" rx="8" fill="#122741" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="115" y="476" fill="#b98aff" font-size="24" font-weight="bold" filter="url(#glow)">4</text>
  <text x="150" y="478" fill="#e8f1fa" font-size="22" font-weight="bold">带机量超限（2.4G稳定约25台）</text>
  <text x="150" y="508" fill="#8fb3d9" font-size="17">超载先踢智能灯 → 专网隔离 / 访客网络分流</text>
  <rect x="930" y="456" width="150" height="36" rx="18" fill="#281a3a" stroke="#b98aff" stroke-width="1.5"/>
  <text x="1005" y="480" text-anchor="middle" fill="#d0b0ff" font-size="17" font-weight="bold">设备多 ★★★★</text>
  <!-- 条目5 -->
  <rect x="90" y="533" width="1020" height="82" rx="8" fill="#122741" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="115" y="568" fill="#4df08a" font-size="24" font-weight="bold" filter="url(#glow)">5</text>
  <text x="150" y="570" fill="#e8f1fa" font-size="22" font-weight="bold">网关塞弱电箱 / Zigbee信道撞WiFi</text>
  <text x="150" y="600" fill="#8fb3d9" font-size="17">金属箱=信号罩 → 居中开放位 · Zigbee改15+信道</text>
  <rect x="930" y="548" width="150" height="36" rx="18" fill="#1a3a28" stroke="#4df08a" stroke-width="1.5"/>
  <text x="1005" y="572" text-anchor="middle" fill="#8affb8" font-size="17" font-weight="bold">全屋类 ★★★</text>
  <text x="90" y="646" fill="#4df08a" font-size="19" filter="url(#glow)">conclusion: 灯多路由器扛不住 → 先做减法（分频/专网/错信道），再换硬件_</text>
</svg>
