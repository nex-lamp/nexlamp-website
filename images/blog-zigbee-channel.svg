<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowText"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="zigzag" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#7b61ff"/></linearGradient>
    <linearGradient id="wifigrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#ff3d00"/></linearGradient>
  </defs>
  <rect width="680" height="420" fill="#0a1628"/>
  <!-- Grid -->
  <g stroke="#162240" stroke-width="0.5">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="420"/><line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
  </g>
  <!-- Title -->
  <text x="40" y="40" fill="#00d4ff" font-family="monospace" font-size="16" filter="url(#glowText)">┌─ Zigbee vs WiFi 信道冲突图 ──────────────────────────────────┐</text>
  <text x="40" y="410" fill="#00d4ff" font-family="monospace" font-size="14" filter="url(#glowText)">└─ nexLAMP.com ────────────────────────────────────────────────────────┘</text>
  <!-- Axis labels -->
  <text x="80" y="105" fill="#5a7a9a" font-family="monospace" font-size="12">2.4GHz</text>
  <text x="80" y="125" fill="#5a7a9a" font-family="monospace" font-size="11">频段</text>
  <!-- Frequency axis -->
  <line x1="120" y1="110" x2="640" y2="110" stroke="#5a7a9a" stroke-width="1"/>
  <text x="130" y="102" fill="#3a5a7a" font-family="monospace" font-size="9">2405</text>
  <text x="245" y="102" fill="#3a5a7a" font-family="monospace" font-size="9">2425</text>
  <text x="360" y="102" fill="#3a5a7a" font-family="monospace" font-size="9">2445</text>
  <text x="475" y="102" fill="#3a5a7a" font-family="monospace" font-size="9">2465</text>
  <text x="590" y="102" fill="#3a5a7a" font-family="monospace" font-size="9">2480 MHz</text>
  <!-- WiFi Channel 1 bar -->
  <rect x="130" y="130" width="110" height="28" rx="4" fill="#ff6b35" opacity="0.85"/>
  <text x="185" y="148" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">WiFi CH 1 (2412)</text>
  <!-- WiFi Channel 6 bar -->
  <rect x="290" y="170" width="110" height="28" rx="4" fill="#ff6b35" opacity="0.85"/>
  <text x="345" y="188" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">WiFi CH 6 (2437)</text>
  <!-- WiFi Channel 11 bar -->
  <rect x="470" y="130" width="110" height="28" rx="4" fill="#ff6b35" opacity="0.85"/>
  <text x="525" y="148" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">WiFi CH 11 (2462)</text>
  <!-- Zigbee channels -->
  <rect x="132" y="220" width="65" height="24" rx="4" fill="url(#zigzag)" opacity="0.9" filter="url(#glow)"/>
  <text x="164" y="236" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">ZB 11-14</text>
  <rect x="280" y="260" width="65" height="24" rx="4" fill="url(#zigzag)" opacity="0.9" filter="url(#glow)"/>
  <text x="312" y="276" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">ZB 16-19</text>
  <rect x="465" y="220" width="65" height="24" rx="4" fill="url(#zigzag)" opacity="0.9" filter="url(#glow)"/>
  <text x="497" y="236" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">ZB 20-23</text>
  <!-- Safe channels -->
  <rect x="500" y="310" width="65" height="24" rx="4" fill="#00e676" opacity="0.3" stroke="#00e676" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="532" y="326" fill="#00e676" font-family="monospace" font-size="9" text-anchor="middle">✓ ZB 25</text>
  <!-- Annotation -->
  <text x="130" y="360" fill="#ff8a65" font-family="monospace" font-size="12">⚠ 默认家用WiFi占CH 6/11，Zigbee 15/20/25受干扰最严重</text>
  <text x="130" y="385" fill="#00e676" font-family="monospace" font-size="12">✓ Zigbee 25/26 是最干净信道（2480MHz附近WiFi不覆盖）</text>
</svg>