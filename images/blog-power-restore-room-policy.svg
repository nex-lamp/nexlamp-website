<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f38"/>
    </linearGradient>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16263f" stroke-width="1"/>
    </pattern>
    <filter id="glow3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft3" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg3)"/>
  <rect width="900" height="520" fill="url(#grid3)" opacity="0.55"/>

  <!-- 终端窗口条 -->
  <g filter="url(#soft3)">
    <rect x="40" y="22" width="820" height="40" rx="8" fill="#0d1f38" stroke="#1e3a5f" stroke-width="1"/>
  </g>
  <circle cx="62" cy="42" r="4.5" fill="#f6ad55" opacity="0.75"/>
  <circle cx="79" cy="42" r="4.5" fill="#4fd1c5" opacity="0.6"/>
  <circle cx="96" cy="42" r="4.5" fill="#2d4a6b"/>
  <text x="116" y="47" fill="#7f9bbb" font-family="Consolas, Microsoft YaHei, monospace" font-size="15" letter-spacing="0.5">power-restore / room-policy</text>
  <text x="838" y="47" text-anchor="end" fill="#3d5570" font-family="Consolas, Microsoft YaHei, monospace" font-size="15">floorplan</text>

  <!-- 标题 -->
  <rect x="40" y="78" width="4" height="30" rx="2" fill="#4fd1c5"/>
  <text x="56" y="101" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="bold">房间分区策略</text>
  <text x="56" y="129" fill="#7f9bbb" font-family="Microsoft YaHei, sans-serif" font-size="16">四类空间，各给一种来电方式</text>

  <!-- 房屋轮廓（俯视） -->
  <rect x="60" y="150" width="780" height="310" rx="4" fill="#0b1a2e" fill-opacity="0.6" stroke="#2d4a6b" stroke-width="2"/>
  <line x1="450" y1="150" x2="450" y2="460" stroke="#2d4a6b" stroke-width="1.5"/>
  <line x1="60" y1="305" x2="840" y2="305" stroke="#2d4a6b" stroke-width="1.5"/>

  <!-- 区 A：卧室 / 儿童房 -->
  <rect x="60" y="150" width="390" height="155" fill="#64748b" fill-opacity="0.07"/>
  <rect x="60" y="150" width="390" height="3" fill="#64748b" fill-opacity="0.8"/>
  <text x="88" y="202" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="bold">卧室 / 儿童房</text>
  <rect x="88" y="218" width="112" height="34" rx="17" fill="#64748b" fill-opacity="0.16" stroke="#7f9bbb" stroke-opacity="0.65" stroke-width="1.2"/>
  <text x="144" y="241" text-anchor="middle" fill="#b6c6d6" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">来电关闭</text>
  <!-- 床图标 -->
  <g transform="translate(405,224)" opacity="0.6">
    <rect x="-26" y="-14" width="4.5" height="30" rx="2" fill="#9fb2c6"/>
    <rect x="-21.5" y="-2" width="47" height="9" rx="3" fill="none" stroke="#9fb2c6" stroke-width="2.2"/>
    <rect x="-16" y="-12" width="15" height="7" rx="3" fill="#9fb2c6" opacity="0.85"/>
    <line x1="20" y1="7" x2="20" y2="15" stroke="#9fb2c6" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 区 B：走道 / 楼梯 -->
  <rect x="450" y="150" width="390" height="155" fill="#4fd1c5" fill-opacity="0.06"/>
  <rect x="450" y="150" width="390" height="3" fill="#4fd1c5" fill-opacity="0.85"/>
  <text x="478" y="202" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="bold">走道 / 楼梯</text>
  <rect x="478" y="218" width="112" height="34" rx="17" fill="#4fd1c5" fill-opacity="0.12" stroke="#4fd1c5" stroke-opacity="0.7" stroke-width="1.2"/>
  <text x="534" y="241" text-anchor="middle" fill="#4fd1c5" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">上一状态</text>
  <!-- 阶梯图标 -->
  <g transform="translate(795,222)" opacity="0.55">
    <path d="M -26 16 L -26 4 L -13 4 L -13 -6 L 0 -6 L 0 -16 L 26 -16" fill="none" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 区 C：户外 / 入口 -->
  <rect x="60" y="305" width="390" height="155" fill="#f6ad55" fill-opacity="0.06"/>
  <rect x="60" y="305" width="390" height="3" fill="#f6ad55" fill-opacity="0.85"/>
  <text x="88" y="357" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="bold">户外 / 入口</text>
  <rect x="88" y="373" width="112" height="34" rx="17" fill="#f6ad55" fill-opacity="0.12" stroke="#f6ad55" stroke-opacity="0.75" stroke-width="1.2"/>
  <text x="144" y="396" text-anchor="middle" fill="#f6ad55" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">来电开启</text>
  <!-- 门 + 箭头图标 -->
  <g transform="translate(405,377)" opacity="0.55">
    <rect x="-24" y="-18" width="20" height="36" rx="2" fill="none" stroke="#f6ad55" stroke-width="1.8"/>
    <line x1="4" y1="0" x2="26" y2="0" stroke="#f6ad55" stroke-width="2" stroke-linecap="round"/>
    <path d="M 19 -6 L 26 0 L 19 6" fill="none" stroke="#f6ad55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 区 D：加热类插座 -->
  <rect x="450" y="305" width="390" height="155" fill="#e15b5b" fill-opacity="0.06"/>
  <rect x="450" y="305" width="390" height="3" fill="#e15b5b" fill-opacity="0.85"/>
  <text x="478" y="357" fill="#e2e8f0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="bold">加热类插座</text>
  <rect x="478" y="373" width="148" height="34" rx="17" fill="#e15b5b" fill-opacity="0.14" stroke="#e15b5b" stroke-opacity="0.8" stroke-width="1.4"/>
  <text x="552" y="396" text-anchor="middle" fill="#ef8b8b" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">必须来电关闭</text>
  <!-- 插座图标 -->
  <g transform="translate(795,377)" opacity="0.6">
    <rect x="-20" y="-20" width="40" height="40" rx="7" fill="none" stroke="#e15b5b" stroke-width="1.9"/>
    <rect x="-9" y="-9" width="5" height="11" rx="2.5" fill="#e15b5b"/>
    <rect x="4" y="-9" width="5" height="11" rx="2.5" fill="#e15b5b"/>
    <circle cx="0" cy="10" r="2.4" fill="#e15b5b"/>
  </g>

  <!-- 底部流程 -->
  <line x1="60" y1="472" x2="840" y2="472" stroke="#16263f" stroke-width="1"/>
  <text x="450" y="500" text-anchor="middle" fill="#7f9bbb" font-family="Microsoft YaHei, sans-serif" font-size="16" letter-spacing="1">拉总闸 → 合闸 → 逐屋核对</text>
</svg>
