<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2340"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="680" height="420" fill="url(#bgGrad)"/>
  <rect width="680" height="420" fill="url(#grid)"/>
  
  <text x="340" y="28" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">无主灯三区布局法 — 基础照明 + 重点照明 + 氛围照明</text>

  <!-- Room diagram -->
  <rect x="30" y="45" width="400" height="360" rx="6" fill="#0d1f3c" stroke="#1a3a5c" stroke-width="1"/>
  
  <!-- Wall labels -->
  <text x="50" y="65" fill="#3a5a7c" font-family="monospace" font-size="9">电视背景墙</text>
  <text x="370" y="390" fill="#3a5a7c" font-family="monospace" font-size="9">沙发背景墙</text>
  
  <!-- Zone 1: Basic lighting (ceiling distributed) -->
  <text x="230" y="85" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="11" font-weight="bold">① 基础照明区&apos;筒灯均匀分布</text>
  
  <circle cx="100" cy="130" r="7" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="100" cy="130" r="2.5" fill="#4da6ff" opacity="0.9"/>
  <circle cx="180" cy="130" r="7" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="180" cy="130" r="2.5" fill="#4da6ff" opacity="0.9"/>
  <circle cx="260" cy="130" r="7" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="260" cy="130" r="2.5" fill="#4da6ff" opacity="0.9"/>
  <circle cx="340" cy="130" r="7" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="340" cy="130" r="2.5" fill="#4da6ff" opacity="0.9"/>
  
  <circle cx="140" cy="200" r="7" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="140" cy="200" r="2.5" fill="#4da6ff" opacity="0.9"/>
  <circle cx="230" cy="200" r="7" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="230" cy="200" r="2.5" fill="#4da6ff" opacity="0.9"/>
  <circle cx="320" cy="200" r="7" fill="none" stroke="#4da6ff" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="2.5" fill="#4da6ff" opacity="0.9"/>

  <text x="230" y="225" text-anchor="middle" fill="#2a4a6c" font-family="monospace" font-size="8">间距1.2~1.5m | 离墙50~70cm</text>
  
  <!-- Zone 2: Accent lighting (wall washers) -->
  <text x="230" y="250" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="11" font-weight="bold">② 重点照明区&apos;射灯精准打光 15°-24°</text>
  
  <rect x="55" y="265" width="220" height="4" rx="2" fill="#ffaa00" opacity="0.3"/>
  <rect x="55" y="265" width="80" height="4" rx="2" fill="#ffaa00" opacity="0.6"/>
  <rect x="65" y="260" width="6" height="12" rx="2" fill="#ffaa00" opacity="0.9"/>
  <rect x="145" y="260" width="6" height="12" rx="2" fill="#ffaa00" opacity="0.9"/>
  
  <!-- Zone 3: Ambient lighting -->
  <text x="230" y="295" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11" font-weight="bold">③ 氛围照明区&apos;灯带间接光 见光不见灯</text>
  
  <line x1="55" y1="310" x2="405" y2="310" stroke="#ff6b6b" stroke-width="3" opacity="0.4"/>
  <line x1="55" y1="310" x2="120" y2="310" stroke="#ff6b6b" stroke-width="3" opacity="0.8"/>
  <line x1="200" y1="310" x2="350" y2="310" stroke="#ff6b6b" stroke-width="3" opacity="0.8"/>
  
  <text x="130" y="340" fill="#3a5a7c" font-family="monospace" font-size="8">天花边吊藏灯带</text>
  <text x="250" y="340" fill="#3a5a7c" font-family="monospace" font-size="8">电视柜底部暗光</text>

  <!-- Right: Legend &amp; Specs -->
  <rect x="450" y="45" width="210" height="360" rx="6" fill="#0d1f3c" stroke="#1a3a5c" stroke-width="1"/>
  
  <text x="555" y="70" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="12" font-weight="bold">关键参数速查</text>
  
  <line x1="465" y1="80" x2="645" y2="80" stroke="#1a3a5c" stroke-width="1"/>
  
  <text x="465" y="100" fill="#5a7a9c" font-family="monospace" font-size="10" font-weight="bold">基础照明 | 筒灯</text>
  <text x="465" y="116" fill="#3a5a7c" font-family="monospace" font-size="9">• 光束角 90°-120°</text>
  <text x="465" y="132" fill="#3a5a7c" font-family="monospace" font-size="9">• 间距 1.2~1.5m</text>
  <text x="465" y="148" fill="#3a5a7c" font-family="monospace" font-size="9">• 离墙 50~70cm</text>
  <text x="465" y="164" fill="#3a5a7c" font-family="monospace" font-size="9">• Ra ≥ 90</text>
  
  <line x1="465" y1="175" x2="645" y2="175" stroke="#1a3a5c" stroke-width="0.5"/>
  
  <text x="465" y="195" fill="#ffaa00" font-family="monospace" font-size="10" font-weight="bold">重点照明 | 射灯</text>
  <text x="465" y="211" fill="#3a5a7c" font-family="monospace" font-size="9">• 光束角 15°-50°</text>
  <text x="465" y="227" fill="#3a5a7c" font-family="monospace" font-size="9">• 洗墙用 24°</text>
  <text x="465" y="243" fill="#3a5a7c" font-family="monospace" font-size="9">• 重点打光 15°</text>
  <text x="465" y="259" fill="#3a5a7c" font-family="monospace" font-size="9">• Ra ≥ 95（推荐98）</text>
  
  <line x1="465" y1="270" x2="645" y2="270" stroke="#1a3a5c" stroke-width="0.5"/>
  
  <text x="465" y="290" fill="#ff6b6b" font-family="monospace" font-size="10" font-weight="bold">氛围照明 | 灯带</text>
  <text x="465" y="306" fill="#3a5a7c" font-family="monospace" font-size="9">• COB灯带无光斑</text>
  <text x="465" y="322" fill="#3a5a7c" font-family="monospace" font-size="9">• 功率 10-14W/m</text>
  <text x="465" y="338" fill="#3a5a7c" font-family="monospace" font-size="9">• 预埋变压器空间</text>
  
  <line x1="465" y1="350" x2="645" y2="350" stroke="#1a3a5c" stroke-width="0.5"/>
  
  <text x="465" y="368" fill="#4dff88" font-family="monospace" font-size="10" font-weight="bold">控制 | 涂鸦Zigbee</text>
  <text x="465" y="384" fill="#3a5a7c" font-family="monospace" font-size="9">• 分区分组独立调光</text>
  <text x="465" y="400" fill="#3a5a7c" font-family="monospace" font-size="9">• 场景面板/手机/语音</text>

  <text x="340" y="418" text-anchor="middle" fill="#2a4a6c" font-family="monospace" font-size="8">nexlamp.com — 全部接入涂鸦Zigbee网关，场景一键切换</text>
</svg>