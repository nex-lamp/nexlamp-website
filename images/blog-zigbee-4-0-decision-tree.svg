<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <g stroke="#152040" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
  </g>

  <text x="400" y="35" text-anchor="middle" fill="#00d4aa" font-family="monospace" font-size="18" font-weight="bold" filter="url(#glow)">2026年智能灯协议选型决策树</text>

  <!-- Root -->
  <rect x="275" y="60" width="250" height="36" rx="6" fill="#0d1f3c" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="400" y="83" text-anchor="middle" fill="#00d4aa" font-family="monospace" font-size="13">你家已有Zigbee设备在用？</text>

  <!-- Yes branch -->
  <line x1="320" y1="96" x2="180" y2="130" stroke="#4da6ff" stroke-width="1"/>
  <text x="255" y="118" fill="#4da6ff" font-family="monospace" font-size="10">是 ✓</text>
  <rect x="80" y="130" width="200" height="36" rx="6" fill="url(#btnBlue)" stroke="#4da6ff" stroke-width="1"/>
  <text x="180" y="153" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="12">继续用Zigbee，升级双模网关</text>

  <!-- No branch -->
  <line x1="480" y1="96" x2="560" y2="130" stroke="#f0a050" stroke-width="1"/>
  <text x="515" y="118" fill="#f0a050" font-family="monospace" font-size="10">否 ✗</text>
  <rect x="460" y="130" width="200" height="36" rx="6" fill="#0d1f3c" stroke="#f0a050" stroke-width="1"/>
  <text x="560" y="153" text-anchor="middle" fill="#f0a050" font-family="monospace" font-size="12">你是Apple生态为主？</text>

  <!-- Apple yes -->
  <line x1="510" y1="166" x2="420" y2="200" stroke="#4da6ff" stroke-width="1"/>
  <text x="475" y="188" fill="#4da6ff" font-family="monospace" font-size="10">是 ✓</text>
  <rect x="310" y="200" width="220" height="36" rx="6" fill="url(#btnBlue)" stroke="#4da6ff" stroke-width="1"/>
  <text x="420" y="223" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="12">Matter/Thread优先</text>

  <!-- Apple no -->
  <line x1="610" y1="166" x2="660" y2="200" stroke="#f0a050" stroke-width="1"/>
  <text x="630" y="188" fill="#f0a050" font-family="monospace" font-size="10">否 ✗</text>
  <rect x="550" y="200" width="220" height="36" rx="6" fill="#0d1f3c" stroke="#f0a050" stroke-width="1"/>
  <text x="660" y="223" text-anchor="middle" fill="#f0a050" font-family="monospace" font-size="12">预算有限？(&lt;3000元)</text>

  <!-- Budget yes -->
  <line x1="610" y1="236" x2="510" y2="270" stroke="#4da6ff" stroke-width="1"/>
  <text x="570" y="258" fill="#4da6ff" font-family="monospace" font-size="10">是 ✓</text>
  <rect x="400" y="270" width="220" height="36" rx="6" fill="url(#btnBlue)" stroke="#4da6ff" stroke-width="1"/>
  <text x="510" y="293" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="12">Zigbee 3.0/4.0</text>

  <!-- Budget no -->
  <line x1="710" y1="236" x2="710" y2="270" stroke="#f0a050" stroke-width="1"/>
  <rect x="610" y="270" width="160" height="36" rx="6" fill="#0d1f3c" stroke="#f0a050" stroke-width="1"/>
  <text x="690" y="293" text-anchor="middle" fill="#f0a050" font-family="monospace" font-size="12">需要跨平台？</text>

  <!-- Cross platform yes -->
  <line x1="660" y1="306" x2="580" y2="340" stroke="#4da6ff" stroke-width="1"/>
  <rect x="460" y="340" width="240" height="36" rx="6" fill="url(#btnBlue)" stroke="#4da6ff" stroke-width="1"/>
  <text x="580" y="363" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="12">Matter + Zigbee双模方案</text>

  <!-- Cross platform no -->
  <line x1="740" y1="306" x2="740" y2="340" stroke="#f0a050" stroke-width="1"/>
  <rect x="620" y="340" width="160" height="36" rx="6" fill="url(#btnBlue)" stroke="#4da6ff" stroke-width="1"/>
  <text x="700" y="363" text-anchor="middle" fill="#4da6ff" font-family="monospace" font-size="12">Zigbee 4.0</text>

  <!-- Recommendation boxes -->
  <rect x="80" y="400" width="640" height="85" rx="8" fill="#0d1f3c" stroke="#2a3d5a" stroke-width="0.5"/>
  <text x="400" y="425" text-anchor="middle" fill="#8899bb" font-family="monospace" font-size="12">设备类型推荐</text>
  <text x="160" y="450" fill="#00d4aa" font-family="monospace" font-size="11">筒灯/射灯 → Zigbee</text>
  <text x="365" y="450" fill="#4da6ff" font-family="monospace" font-size="11">传感器 → Thread/Matter</text>
  <text x="580" y="450" fill="#f0a050" font-family="monospace" font-size="11">开关/灯带 → Zigbee</text>
  <text x="220" y="472" fill="#8899bb" font-family="monospace" font-size="10">性价比最高，生态最成熟</text>
  <text x="420" y="472" fill="#8899bb" font-family="monospace" font-size="10">延迟更低，电池续航更优</text>
  <text x="640" y="472" fill="#667788" font-family="monospace" font-size="10">规格多样，选择丰富</text>
</svg>
