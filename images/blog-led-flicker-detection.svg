<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2744" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1f3d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="420" fill="url(#bgGrad)"/>
  <rect width="680" height="420" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="680" height="36" fill="#111b30" rx="0"/>
  <circle cx="18" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="5" fill="#27ca40"/>
  <text x="340" y="23" text-anchor="middle" fill="#5c8db5" font-size="12" font-family="monospace">📱 手机检测LED频闪 — 快门速度 1/1000s</text>

  <!-- Center: Phone screen showing flicker -->
  <rect x="220" y="60" width="240" height="320" rx="20" fill="#1a1a2e" stroke="#2a3a5e" stroke-width="2"/>
  <rect x="235" y="75" width="210" height="280" rx="4" fill="#0d0d1a"/>

  <!-- LED light source rendered on phone screen -->
  <circle cx="340" cy="140" r="45" fill="#2a4a7f" opacity="0.3"/>
  <circle cx="340" cy="140" r="35" fill="#3a6abf" opacity="0.5"/>
  <circle cx="340" cy="140" r="22" fill="#5a9aef" opacity="0.8"/>
  <circle cx="340" cy="140" r="10" fill="#c0e0ff" filter="url(#glow)"/>

  <!-- Flicker bars on screen -->
  <rect x="235" y="110" width="210" height="6" fill="#ff4466" opacity="0.7"/>
  <rect x="235" y="130" width="210" height="6" fill="#ff4466" opacity="0.7"/>
  <rect x="235" y="150" width="210" height="6" fill="#ff4466" opacity="0.7"/>
  <rect x="235" y="170" width="210" height="6" fill="#ff4466" opacity="0.7"/>

  <!-- Warning label on phone -->
  <text x="340" y="235" text-anchor="middle" fill="#ff4466" font-size="13" font-family="monospace" font-weight="bold">⚠ 检测到频闪条纹</text>

  <!-- Phone bottom bar -->
  <rect x="280" y="330" width="120" height="4" rx="2" fill="#2a3a5e"/>

  <!-- Left: real light source -->
  <circle cx="110" cy="180" r="25" fill="#3a6abf" opacity="0.15"/>
  <circle cx="110" cy="180" r="18" fill="#5a9aef" opacity="0.4"/>
  <circle cx="110" cy="180" r="9" fill="#a0d0ff" opacity="0.7"/>
  <line x1="82" y1="160" x2="45" y2="140" stroke="#5a9aef" stroke-width="0.5" opacity="0.4"/>
  <text x="110" y="222" text-anchor="middle" fill="#5c8db5" font-size="10" font-family="monospace">被测LED灯具</text>

  <!-- Right: flicker waveform -->
  <rect x="490" y="80" width="160" height="140" rx="4" fill="#0d0d1a" stroke="#2a3a5e" stroke-width="1"/>
  <text x="570" y="100" text-anchor="middle" fill="#4a7aaf" font-size="9" font-family="monospace">频闪波形 (100Hz)</text>
  <polyline points="500,200 510,130 520,200 530,130 540,200 550,130 560,200 570,130 580,200 590,130 600,200 610,130 620,200 630,130 640,200" fill="none" stroke="#ff6644" stroke-width="2" filter="url(#glow)"/>
  <line x1="495" y1="200" x2="645" y2="200" stroke="#2a3a5e" stroke-width="0.5"/>

  <!-- Bottom: stats panel -->
  <rect x="40" y="270" width="600" height="80" rx="6" fill="#0d1220" stroke="#2a3a5e" stroke-width="1"/>
  <text x="60" y="298" text-anchor="start" fill="#4a7aaf" font-size="11" font-family="monospace">检测结果</text>
  <line x1="60" y1="305" x2="620" y2="305" stroke="#1a2744" stroke-width="0.5"/>

  <text x="80" y="330" fill="#ff6644" font-size="12" font-family="monospace" font-weight="bold">频闪百分比: 32%  (高风险 — IEEE 1789)</text>
  <text x="420" y="330" fill="#7a8a9a" font-size="11" font-family="monospace">调制深度: 45% | 频率: 100Hz</text>
</svg>