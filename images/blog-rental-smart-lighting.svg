    <!-- Row 2: Normal switch + smart bulb -->
    <g transform="translate(10, 82)">
      <text x="0" y="14" fill="#ff7070" font-family="Microsoft YaHei, sans-serif" font-size="10">②普通开关+智能灯</text>
      <text x="90" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">¥50-150/个</text>
      <text x="160" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">★☆☆</text>
      <text x="220" y="14" fill="#a0b8c0" font-family="Microsoft YaHei, sans-serif" font-size="9">已买智能灯的</text>
      <text x="330" y="14" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="9">❌ 关灯即离线的翻车区</text>
      <rect x="520" y="3" width="70" height="16" rx="8" fill="#3a1515" stroke="#8a3030" stroke-width="0.8"/>
      <text x="555" y="15" text-anchor="middle" fill="#ff7070" font-family="sans-serif" font-size="9">⚠ 踩坑</text>
