<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Consolas','Microsoft YaHei',monospace">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f1d32"/>
    </linearGradient>
    <filter id="glowD">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridD" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e3a5f" stroke-width="0.25" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="900" height="500" rx="8" fill="url(#bgD)"/>
  <rect width="900" height="500" rx="8" fill="url(#gridD)"/>
  <!-- Title -->
  <rect x="0" y="0" width="900" height="46" fill="#0d1b2a" opacity="0.8"/>
  <rect x="0" y="42" width="900" height="3" fill="#ef4444" opacity="0.3"/>
  <text x="450" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0" letter-spacing="2">延迟瓶颈定位 · LATENCY BOTTLENECK ANALYSIS</text>

  <!-- Pipeline: Cloud → Gateway → Device -->
  <!-- Cloud -->
  <rect x="50" y="80" width="200" height="160" rx="6" fill="#0d1b2a" stroke="#ef4444" stroke-width="1" opacity="0.6"/>
  <rect x="50" y="80" width="200" height="32" rx="6" fill="#ef4444" opacity="0.15"/>
  <text x="150" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444">☁ 云端服务器</text>
  <text x="70" y="130" font-size="10" fill="#94a3b8">APP指令上传</text>
  <rect x="70" y="138" width="160" height="14" rx="3" fill="#1e293b"/>
  <rect x="70" y="138" width="120" height="14" rx="3" fill="#ef4444" opacity="0.4"/>
  <text x="150" y="149" text-anchor="middle" font-size="9" fill="#fca5a5">300-800ms 典型延迟</text>
  <text x="70" y="170" font-size="10" fill="#94a3b8">云端场景解析</text>
  <rect x="70" y="178" width="160" height="14" rx="3" fill="#1e293b"/>
  <rect x="70" y="178" width="80" height="14" rx="3" fill="#f59e0b" opacity="0.4"/>
  <text x="150" y="189" text-anchor="middle" font-size="9" fill="#fcd34d">100-300ms 解析耗时</text>
  <text x="70" y="215" font-size="9" fill="#64748b">⚠ 依赖外网质量</text>
  <text x="70" y="230" font-size="9" fill="#64748b">⚠ 服务器负载波动</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="160" x2="310" y2="160" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <polygon points="308,155 318,160 308,165" fill="#ef4444" opacity="0.6"/>
  <text x="280" y="152" text-anchor="middle" font-size="8" fill="#64748b">下行</text>

  <!-- Gateway -->
  <rect x="320" y="80" width="240" height="160" rx="6" fill="#0d1b2a" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <rect x="320" y="80" width="240" height="32" rx="6" fill="#22d3ee" opacity="0.15"/>
  <text x="440" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">📡 网关/中枢</text>
  <text x="340" y="130" font-size="10" fill="#94a3b8">协议转换（云→Zigbee/BLE）</text>
  <rect x="340" y="138" width="200" height="14" rx="3" fill="#1e293b"/>
  <rect x="340" y="138" width="40" height="14" rx="3" fill="#22d3ee" opacity="0.4"/>
  <text x="440" y="149" text-anchor="middle" font-size="9" fill="#67e8f9">20-80ms 转发延迟</text>
  <text x="340" y="170" font-size="10" fill="#94a3b8">本地场景执行</text>
  <rect x="340" y="178" width="200" height="14" rx="3" fill="#1e293b"/>
  <rect x="340" y="178" width="20" height="14" rx="3" fill="#34d399" opacity="0.5"/>
  <text x="440" y="189" text-anchor="middle" font-size="9" fill="#6ee7b7">5-20ms 本地联动</text>
  <text x="340" y="215" font-size="9" fill="#34d399">✓ 本地执行可绕过云端</text>
  <text x="340" y="230" font-size="9" fill="#64748b">⚠ 网关性能决定上限</text>

  <!-- Arrow 2 -->
  <line x1="560" y1="160" x2="620" y2="160" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <polygon points="618,155 628,160 618,165" fill="#22d3ee" opacity="0.6"/>
  <text x="590" y="152" text-anchor="middle" font-size="8" fill="#64748b">无线</text>

  <!-- Device -->
  <rect x="630" y="80" width="220" height="160" rx="6" fill="#0d1b2a" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
  <rect x="630" y="80" width="220" height="32" rx="6" fill="#a78bfa" opacity="0.15"/>
  <text x="740" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#a78bfa">💡 终端设备</text>
  <text x="650" y="130" font-size="10" fill="#94a3b8">指令接收与执行</text>
  <rect x="650" y="138" width="180" height="14" rx="3" fill="#1e293b"/>
  <rect x="650" y="138" width="25" height="14" rx="3" fill="#a78bfa" opacity="0.4"/>
  <text x="740" y="149" text-anchor="middle" font-size="9" fill="#c4b5fd">10-50ms 执行延迟</text>
  <text x="650" y="170" font-size="10" fill="#94a3b8">状态回传</text>
  <rect x="650" y="178" width="180" height="14" rx="3" fill="#1e293b"/>
  <rect x="650" y="178" width="60" height="14" rx="3" fill="#a78bfa" opacity="0.4"/>
  <text x="740" y="189" text-anchor="middle" font-size="9" fill="#c4b5fd">50-200ms 状态上报</text>
  <text x="650" y="215" font-size="9" fill="#64748b">⚠ 信号强度影响</text>
  <text x="650" y="230" font-size="9" fill="#64748b">⚠ 固件版本差异</text>

  <!-- Total latency comparison -->
  <rect x="50" y="270" width="800" height="80" rx="6" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="0.8"/>
  <text x="70" y="295" font-size="12" font-weight="bold" fill="#e2e8f0">端到端延迟对比</text>
  <line x1="70" y1="302" x2="830" y2="302" stroke="#1e3a5f" stroke-width="0.5"/>
  <!-- Bad: Cloud path -->
  <text x="70" y="322" font-size="10" fill="#ef4444">❌ 纯云端路径：</text>
  <text x="200" y="322" font-size="10" fill="#fca5a5">APP → 云 → 网关 → 设备 → 回传 = 500ms~2s+</text>
  <!-- Good: Local path -->
  <text x="70" y="342" font-size="10" fill="#34d399">✅ 本地联动路径：</text>
  <text x="200" y="342" font-size="10" fill="#6ee7b7">传感器 → 网关本地决策 → 设备执行 = 30~100ms</text>

  <!-- Optimization tips -->
  <rect x="50" y="370" width="800" height="110" rx="6" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="0.8"/>
  <text x="70" y="395" font-size="12" font-weight="bold" fill="#e2e8f0">关键优化策略</text>
  <line x1="70" y1="402" x2="830" y2="402" stroke="#1e3a5f" stroke-width="0.5"/>
  <!-- 3 columns -->
  <text x="90" y="422" font-size="11" font-weight="bold" fill="#ef4444">1. 网络优化</text>
  <text x="90" y="440" font-size="9" fill="#94a3b8">• 路由器选Wi-Fi 6</text>
  <text x="90" y="455" font-size="9" fill="#94a3b8">• 2.4G信道避干扰</text>
  <text x="90" y="470" font-size="9" fill="#94a3b8">• Mesh组网全覆盖</text>

  <text x="340" y="422" font-size="11" font-weight="bold" fill="#22d3ee">2. 网关优化</text>
  <text x="340" y="440" font-size="9" fill="#94a3b8">• 启用本地场景执行</text>
  <text x="340" y="455" font-size="9" fill="#94a3b8">• 网关放中央位置</text>
  <text x="340" y="470" font-size="9" fill="#94a3b8">• 固件保持最新</text>

  <text x="590" y="422" font-size="11" font-weight="bold" fill="#a78bfa">3. 设备优化</text>
  <text x="590" y="440" font-size="9" fill="#94a3b8">• 减少中继跳数</text>
  <text x="590" y="455" font-size="9" fill="#94a3b8">• 合理分配设备数量</text>
  <text x="590" y="470" font-size="9" fill="#94a3b8">• 定期OTA升级固件</text>

  <!-- Footer -->
  <rect x="0" y="480" width="900" height="20" fill="#0d1b2a" opacity="0.6"/>
  <text x="450" y="495" text-anchor="middle" font-size="9" fill="#475569">Nexlamp · 智能照明延迟瓶颈分析</text>
</svg>