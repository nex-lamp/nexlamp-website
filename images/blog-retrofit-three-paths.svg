<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2038"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16263f" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <rect width="900" height="520" fill="url(#grid)" opacity="0.7"/>
  <text x="52" y="62" fill="#e8f4ff" font-family="sans-serif" font-size="30" font-weight="bold">三条路：换驱动 / 加模块 / 换整灯</text>
  <text x="52" y="95" fill="#7fa6c8" font-family="sans-serif" font-size="17">整屋改造预算区间为原文口径，不是单灯价格</text>

  <rect x="52" y="130" width="252" height="300" rx="14" fill="#10233c" stroke="#4fd1c5" stroke-width="2.5" filter="url(#glow)"/>
  <text x="74" y="170" fill="#4fd1c5" font-family="sans-serif" font-size="24" font-weight="bold">A 换驱动</text>
  <text x="74" y="210" fill="#d9e8f5" font-family="sans-serif" font-size="17">保留灯体，腔体装得下</text>
  <text x="74" y="238" fill="#d9e8f5" font-family="sans-serif" font-size="17">新驱动与灯珠参数匹配</text>
  <text x="74" y="278" fill="#f6ad55" font-family="sans-serif" font-size="16">代价 · 风险</text>
  <text x="74" y="308" fill="#c7d8e8" font-family="sans-serif" font-size="16">需专业电工；老灯可能不兼容</text>
  <text x="74" y="336" fill="#c7d8e8" font-family="sans-serif" font-size="16">劣质驱动调光有频闪隐患</text>
  <text x="74" y="386" fill="#8fd6cd" font-family="sans-serif" font-size="17">整屋 3000-6000 元（原文）</text>
  <text x="74" y="414" fill="#7fa6c8" font-family="sans-serif" font-size="15">可调光版通常贵 30%-60%</text>

  <rect x="324" y="130" width="252" height="300" rx="14" fill="#10233c" stroke="#2f6f8f" stroke-width="2"/>
  <text x="346" y="170" fill="#4fd1c5" font-family="sans-serif" font-size="24" font-weight="bold">B 加无线模块</text>
  <text x="346" y="210" fill="#d9e8f5" font-family="sans-serif" font-size="17">灯本身可调光</text>
  <text x="346" y="238" fill="#d9e8f5" font-family="sans-serif" font-size="17">只是缺一个控制手段</text>
  <text x="346" y="278" fill="#f6ad55" font-family="sans-serif" font-size="16">代价 · 风险</text>
  <text x="346" y="308" fill="#c7d8e8" font-family="sans-serif" font-size="16">改不了灯珠一致性</text>
  <text x="346" y="336" fill="#c7d8e8" font-family="sans-serif" font-size="16">仍要确认协议与最低负载</text>
  <text x="346" y="386" fill="#8fd6cd" font-family="sans-serif" font-size="17">改动最小</text>
  <text x="346" y="414" fill="#7fa6c8" font-family="sans-serif" font-size="15">先做一间样板再批量</text>

  <rect x="596" y="130" width="252" height="300" rx="14" fill="#10233c" stroke="#2f6f8f" stroke-width="2"/>
  <text x="618" y="170" fill="#4fd1c5" font-family="sans-serif" font-size="24" font-weight="bold">C 换整灯</text>
  <text x="618" y="210" fill="#d9e8f5" font-family="sans-serif" font-size="17">一致性与可靠性最好</text>
  <text x="618" y="238" fill="#d9e8f5" font-family="sans-serif" font-size="17">避免改一半的兼容问题</text>
  <text x="618" y="278" fill="#f6ad55" font-family="sans-serif" font-size="16">代价 · 风险</text>
  <text x="618" y="308" fill="#c7d8e8" font-family="sans-serif" font-size="16">成本最高，要拆旧灯</text>
  <text x="618" y="336" fill="#c7d8e8" font-family="sans-serif" font-size="16">吊顶开孔尺寸要重核</text>
  <text x="618" y="386" fill="#8fd6cd" font-family="sans-serif" font-size="17">整屋 6000-15000 元（原文）</text>
  <text x="618" y="414" fill="#7fa6c8" font-family="sans-serif" font-size="15">灯体老化、光衰明显时选这条</text>

  <text x="52" y="480" fill="#f6ad55" font-family="sans-serif" font-size="18">灯体用了五六年、光衰色漂明显：别改了，换整灯更划算</text>
</svg>
