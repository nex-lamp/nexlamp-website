<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#0a1628"/>
  <!-- 网格装饰 -->
  <g opacity="0.1" stroke="#2478c2" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- 标题 -->
  <text x="400" y="40" fill="#7ec27e" font-size="18" font-weight="bold" text-anchor="middle">出租屋照明改造方案对比</text>

  <!-- 方案1: 磁吸轨道灯 -->
  <rect x="30" y="70" width="220" height="340" rx="8" fill="#1a2a4a" stroke="#7ec27e" stroke-width="1"/>
  <rect x="30" y="70" width="220" height="40" rx="8" fill="#7ec27e"/>
  <text x="140" y="95" fill="#0a1628" font-size="14" font-weight="bold" text-anchor="middle">方案一：磁吸轨道灯</text>

  <!-- 轨道示意 -->
  <rect x="50" y="130" width="180" height="8" rx="4" fill="#3a5a7a"/>
  <circle cx="80" cy="134" r="12" fill="#ffd700" opacity="0.8"/>
  <circle cx="140" cy="134" r="12" fill="#ffd700" opacity="0.8"/>
  <circle cx="200" cy="134" r="12" fill="#ffd700" opacity="0.8"/>
  <!-- 光线 -->
  <polygon points="80,146 70,180 90,180" fill="#ffd700" opacity="0.3"/>
  <polygon points="140,146 130,180 150,180" fill="#ffd700" opacity="0.3"/>
  <polygon points="200,146 190,180 210,180" fill="#ffd700" opacity="0.3"/>

  <text x="140" y="205" fill="#c0d0e0" font-size="12" text-anchor="middle">3M胶粘贴·不伤墙面</text>
  <text x="140" y="225" fill="#c0d0e0" font-size="12" text-anchor="middle">即插即用·灵活移动</text>
  <text x="140" y="245" fill="#c0d0e0" font-size="12" text-anchor="middle">射灯+筒灯混搭</text>
  <text x="140" y="265" fill="#c0d0e0" font-size="12" text-anchor="middle">涂鸦Zigbee控制</text>

  <rect x="60" y="290" width="160" height="30" rx="4" fill="#7ec27e" opacity="0.3"/>
  <text x="140" y="310" fill="#7ec27e" font-size="13" font-weight="bold" text-anchor="middle">预算：¥535/全屋</text>
  <text x="140" y="370" fill="#ffd700" font-size="11" text-anchor="middle">⭐ 推荐首选</text>

  <!-- 方案2: 台灯+落地灯 -->
  <rect x="280" y="70" width="220" height="340" rx="8" fill="#1a2a4a" stroke="#5b8c5a" stroke-width="1"/>
  <rect x="280" y="70" width="220" height="40" rx="8" fill="#5b8c5a"/>
  <text x="390" y="95" fill="#0a1628" font-size="14" font-weight="bold" text-anchor="middle">方案二：台灯+落地灯</text>

  <!-- 台灯示意 -->
  <rect x="310" y="140" width="30" height="40" rx="4" fill="#3a5a7a"/>
  <ellipse cx="325" cy="130" rx="20" ry="10" fill="#ffd700" opacity="0.6"/>
  <!-- 落地灯示意 -->
  <rect x="380" y="120" width="4" height="60" fill="#3a5a7a"/>
  <ellipse cx="382" cy="115" rx="25" ry="15" fill="#ffd700" opacity="0.6"/>

  <text x="390" y="205" fill="#c0d0e0" font-size="12" text-anchor="middle">零安装·买来就用</text>
  <text x="390" y="225" fill="#c0d0e0" font-size="12" text-anchor="middle">层次感灯光氛围</text>
  <text x="390" y="245" fill="#c0d0e0" font-size="12" text-anchor="middle">最适合小空间</text>
  <text x="390" y="265" fill="#c0d0e0" font-size="12" text-anchor="middle">搬迁最方便</text>

  <rect x="310" y="290" width="160" height="30" rx="4" fill="#5b8c5a" opacity="0.3"/>
  <text x="390" y="310" fill="#5b8c5a" font-size="13" font-weight="bold" text-anchor="middle">预算：¥300/全屋</text>
  <text x="390" y="370" fill="#c0d0e0" font-size="11" text-anchor="middle">适合极简改造</text>

  <!-- 方案3: 灯带贴边 -->
  <rect x="530" y="70" width="220" height="340" rx="8" fill="#1a2a4a" stroke="#ff6b6b" stroke-width="1"/>
  <rect x="530" y="70" width="220" height="40" rx="8" fill="#ff6b6b"/>
  <text x="640" y="95" fill="#0a1628" font-size="14" font-weight="bold" text-anchor="middle">方案三：灯带贴边</text>

  <!-- 橱柜示意 -->
  <rect x="560" y="130" width="160" height="40" rx="4" fill="#2a3a5a"/>
  <!-- 灯带 -->
  <rect x="560" y="170" width="160" height="4" rx="2" fill="#ff6b6b" opacity="0.8"/>
  <rect x="560" y="174" width="160" height="20" rx="0" fill="#ff6b6b" opacity="0.15"/>

  <!-- 镜边示意 -->
  <rect x="600" y="200" width="60" height="60" rx="4" fill="#2a3a5a" stroke="#ff6b6b" stroke-width="2"/>
  <rect x="600" y="200" width="60" height="4" rx="2" fill="#ff6b6b" opacity="0.8"/>
  <rect x="656" y="200" width="4" height="60" rx="2" fill="#ff6b6b" opacity="0.8"/>

  <text x="640" y="285" fill="#c0d0e0" font-size="12" text-anchor="middle">背胶粘贴·不伤家具</text>
  <text x="640" y="305" fill="#c0d0e0" font-size="12" text-anchor="middle">RGB+白光双模</text>
  <text x="640" y="325" fill="#c0d0e0" font-size="12" text-anchor="middle">厨房/镜边/书架</text>
  <text x="640" y="345" fill="#c0d0e0" font-size="12" text-anchor="middle">涂鸦Zigbee控制</text>

  <rect x="560" y="365" width="160" height="30" rx="4" fill="#ff6b6b" opacity="0.3"/>
  <text x="640" y="385" fill="#ff6b6b" font-size="13" font-weight="bold" text-anchor="middle">预算：¥100/厨房+卧室</text>

  <!-- 底部标注 -->
  <text x="400" y="470" fill="#8090a0" font-size="11" text-anchor="middle">三个方案可组合使用 · 全屋预算 ¥535-600 · 退租恢复30分钟</text>
</svg>