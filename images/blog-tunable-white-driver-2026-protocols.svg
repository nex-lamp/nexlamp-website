<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1f35"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2478c2"/>
      <stop offset="100%" style="stop-color:#7ee787"/>
    </linearGradient>
  </defs>

  <rect width="680" height="460" fill="url(#bgGrad2)"/>
  <rect width="680" height="460" fill="url(#grid2)"/>

  <!-- Terminal window -->
  <rect x="30" y="30" width="620" height="400" rx="12" fill="#0f2744" stroke="#1e4a75" stroke-width="1.5"/>
  <rect x="30" y="30" width="620" height="44" rx="12" fill="#16365a"/>
  <circle cx="58" cy="52" r="7" fill="#ff5f57"/>
  <circle cx="82" cy="52" r="7" fill="#febc2e"/>
  <circle cx="106" cy="52" r="7" fill="#28c840"/>
  <text x="340" y="58" font-family="Consolas, monospace" font-size="14" fill="#8ab4c7" text-anchor="middle">protocol-matrix.json</text>

  <!-- Title -->
  <text x="340" y="110" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#7ee787" text-anchor="middle" filter="url(#glow2)">4种调光协议对比</text>
  <text x="340" y="138" font-family="Consolas, monospace" font-size="12" fill="#5b8c5a" text-anchor="middle">// 没有最好，只有最合适</text>

  <!-- Cards -->
  <!-- TRIAC -->
  <rect x="60" y="160" width="130" height="180" rx="8" fill="#0d1f35" stroke="#2478c2" stroke-width="1.5"/>
  <text x="125" y="190" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ff8a65" text-anchor="middle">可控硅</text>
  <text x="125" y="215" font-family="Consolas, monospace" font-size="11" fill="#8ab4c7" text-anchor="middle">TRIAC</text>
  <text x="70" y="250" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✓ 直接换旧开关</text>
  <text x="70" y="275" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✗ 低亮易闪烁</text>
  <text x="70" y="300" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✗ 兼容性差</text>
  <rect x="70" y="330" width="110" height="6" rx="3" fill="#1e4a75"/>
  <rect x="70" y="330" width="55" height="6" rx="3" fill="#ff8a65"/>
  <text x="125" y="355" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ab4c7" text-anchor="middle">推荐度：老房改造</text>

  <!-- 0-10V -->
  <rect x="205" y="160" width="130" height="180" rx="8" fill="#0d1f35" stroke="#2478c2" stroke-width="1.5"/>
  <text x="270" y="190" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#ffd700" text-anchor="middle">0-10V</text>
  <text x="270" y="215" font-family="Consolas, monospace" font-size="11" fill="#8ab4c7" text-anchor="middle">ANALOG</text>
  <text x="215" y="250" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✓ 成本适中</text>
  <text x="215" y="275" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✓ 调光平滑</text>
  <text x="215" y="300" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✗ 需信号线</text>
  <rect x="215" y="330" width="110" height="6" rx="3" fill="#1e4a75"/>
  <rect x="215" y="330" width="82" height="6" rx="3" fill="#ffd700"/>
  <text x="270" y="355" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ab4c7" text-anchor="middle">推荐度：商业/无主灯</text>

  <!-- DALI -->
  <rect x="350" y="160" width="130" height="180" rx="8" fill="#0d1f35" stroke="#2478c2" stroke-width="1.5"/>
  <text x="415" y="190" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#7ee787" text-anchor="middle">DALI-2</text>
  <text x="415" y="215" font-family="Consolas, monospace" font-size="11" fill="#8ab4c7" text-anchor="middle">DIGITAL</text>
  <text x="360" y="250" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✓ 单灯寻址</text>
  <text x="360" y="275" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✓ DT8双路</text>
  <text x="360" y="300" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✗ 成本高</text>
  <rect x="360" y="330" width="110" height="6" rx="3" fill="#1e4a75"/>
  <rect x="360" y="330" width="95" height="6" rx="3" fill="#7ee787"/>
  <text x="415" y="355" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ab4c7" text-anchor="middle">推荐度：高端/酒店</text>

  <!-- Zigbee -->
  <rect x="495" y="160" width="130" height="180" rx="8" fill="#0d1f35" stroke="#2478c2" stroke-width="1.5"/>
  <text x="560" y="190" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#4fc3f7" text-anchor="middle">Zigbee</text>
  <text x="560" y="215" font-family="Consolas, monospace" font-size="11" fill="#8ab4c7" text-anchor="middle">WIRELESS</text>
  <text x="505" y="250" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✓ 免布线</text>
  <text x="505" y="275" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">✓ 场景联动</text>
  <text x="505" y="300" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#c7d4e0">△ 依赖网关</text>
  <rect x="505" y="330" width="110" height="6" rx="3" fill="#1e4a75"/>
  <rect x="505" y="330" width="90" height="6" rx="3" fill="#4fc3f7"/>
  <text x="560" y="355" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#8ab4c7" text-anchor="middle">推荐度：智能家居</text>

  <!-- Bottom insight -->
  <rect x="80" y="365" width="520" height="48" rx="6" fill="#16365a" opacity="0.8"/>
  <text x="340" y="388" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#7ee787" text-anchor="middle" font-weight="bold">2026趋势：多协议融合驱动，一个硬件兼容多种控制方式</text>
  <text x="340" y="407" font-family="Consolas, monospace" font-size="11" fill="#8ab4c7" text-anchor="middle">0-10V + DALI + Zigbee in one driver</text>

  <text x="640" y="445" font-family="Arial, sans-serif" font-size="10" fill="#3a6a8a" text-anchor="end">NEXLAMP TECHNOLOGY</text>
</svg>