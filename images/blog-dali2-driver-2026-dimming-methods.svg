<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="420" rx="16" fill="#1a1a2e"/>
  <text x="340" y="38" text-anchor="middle" fill="#e0e0e0" font-family="sans-serif" font-size="15" font-weight="500">三种调光方式对比</text>

  <!-- PWM调光 -->
  <g transform="translate(40,70)">
    <rect x="0" y="0" width="180" height="310" rx="12" fill="#0f3460" stroke="#378ADD" stroke-width="1"/>
    <text x="90" y="30" text-anchor="middle" fill="#85B7EB" font-family="sans-serif" font-size="14" font-weight="500">PWM 调光</text>
    <text x="90" y="52" text-anchor="middle" fill="#B5D4F4" font-family="sans-serif" font-size="12">快速开关控制亮度</text>
    <!-- PWM波形示意 -->
    <rect x="15" y="70" width="150" height="80" rx="6" fill="#16213e"/>
    <rect x="20" y="85" width="18" height="50" fill="#378ADD"/>
    <rect x="42" y="85" width="6" height="50" fill="#1a1a2e"/>
    <rect x="50" y="85" width="18" height="50" fill="#378ADD"/>
    <rect x="72" y="85" width="6" height="50" fill="#1a1a2e"/>
    <rect x="80" y="85" width="18" height="50" fill="#378ADD"/>
    <rect x="102" y="85" width="6" height="50" fill="#1a1a2e"/>
    <rect x="110" y="85" width="18" height="50" fill="#378ADD"/>
    <rect x="132" y="85" width="6" height="50" fill="#1a1a2e"/>
    <rect x="140" y="85" width="18" height="50" fill="#378ADD"/>
    <text x="90" y="175" text-anchor="middle" fill="#E24B4A" font-family="sans-serif" font-size="12" font-weight="500">痛点</text>
    <text x="90" y="195" text-anchor="middle" fill="#F09595" font-family="sans-serif" font-size="11">低亮度频闪明显</text>
    <text x="90" y="212" text-anchor="middle" fill="#F09595" font-family="sans-serif" font-size="11">人眼&amp;相机可见</text>
    <rect x="25" y="230" width="130" height="28" rx="6" fill="#501313"/>
    <text x="90" y="248" text-anchor="middle" fill="#F7C1C1" font-family="sans-serif" font-size="11" font-weight="500">不适合高端项目</text>
    <text x="90" y="290" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">精度: 差</text>
    <rect x="25" y="270" width="130" height="8" rx="4" fill="#16213e"/>
    <rect x="25" y="270" width="35" height="8" rx="4" fill="#E24B4A"/>
  </g>

  <!-- 模拟调光 -->
  <g transform="translate(250,70)">
    <rect x="0" y="0" width="180" height="310" rx="12" fill="#0f3460" stroke="#378ADD" stroke-width="1"/>
    <text x="90" y="30" text-anchor="middle" fill="#85B7EB" font-family="sans-serif" font-size="14" font-weight="500">0-10V 模拟调光</text>
    <text x="90" y="52" text-anchor="middle" fill="#B5D4F4" font-family="sans-serif" font-size="12">电压信号控制电流</text>
    <!-- 模拟曲线示意 -->
    <rect x="15" y="70" width="150" height="80" rx="6" fill="#16213e"/>
    <line x1="20" y2="140" y1="140" x2="150" stroke="#378ADD" stroke-width="1.5" fill="none"/>
    <path d="M20,140 L20,90 Q40,88 60,85 Q80,83 100,80 Q120,78 150,75" fill="none" stroke="#378ADD" stroke-width="2"/>
    <text x="90" y="175" text-anchor="middle" fill="#BA7517" font-family="sans-serif" font-size="12" font-weight="500">痛点</text>
    <text x="90" y="195" text-anchor="middle" fill="#FAC775" font-family="sans-serif" font-size="11">最低亮度只能到10%</text>
    <text x="90" y="212" text-anchor="middle" fill="#FAC775" font-family="sans-serif" font-size="11">调光曲线不平滑</text>
    <rect x="25" y="230" width="130" height="28" rx="6" fill="#412402"/>
    <text x="90" y="248" text-anchor="middle" fill="#FAEEDA" font-family="sans-serif" font-size="11" font-weight="500">商用项目勉强可用</text>
    <text x="90" y="290" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">精度: 中</text>
    <rect x="25" y="270" width="130" height="8" rx="4" fill="#16213e"/>
    <rect x="25" y="270" width="75" height="8" rx="4" fill="#EF9F27"/>
  </g>

  <!-- DALI-2数字调光 -->
  <g transform="translate(460,70)">
    <rect x="0" y="0" width="180" height="310" rx="12" fill="#0f3460" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="90" y="30" text-anchor="middle" fill="#5DCAA5" font-family="sans-serif" font-size="14" font-weight="500">DALI-2 数字调光</text>
    <text x="90" y="52" text-anchor="middle" fill="#9FE1CB" font-family="sans-serif" font-size="12">数字信号精确控制</text>
    <!-- DALI精确曲线示意 -->
    <rect x="15" y="70" width="150" height="80" rx="6" fill="#16213e"/>
    <path d="M20,140 L20,78 Q30,76 40,74 Q50,72 60,70 Q70,68 80,66 Q90,64 100,62 Q110,60 120,58 Q130,56 150,54" fill="none" stroke="#1D9E75" stroke-width="2"/>
    <text x="90" y="175" text-anchor="middle" fill="#1D9E75" font-family="sans-serif" font-size="12" font-weight="500">优势</text>
    <text x="90" y="195" text-anchor="middle" fill="#9FE1CB" font-family="sans-serif" font-size="11">0.1%调光丝滑无频闪</text>
    <text x="90" y="212" text-anchor="middle" fill="#9FE1CB" font-family="sans-serif" font-size="11">254级精确亮度控制</text>
    <rect x="25" y="230" width="130" height="28" rx="6" fill="#04342C"/>
    <text x="90" y="248" text-anchor="middle" fill="#E1F5EE" font-family="sans-serif" font-size="11" font-weight="500">高端项目首选方案</text>
    <text x="90" y="290" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">精度: 高</text>
    <rect x="25" y="270" width="130" height="8" rx="4" fill="#16213e"/>
    <rect x="25" y="270" width="130" height="8" rx="4" fill="#1D9E75"/>
  </g>
</svg>