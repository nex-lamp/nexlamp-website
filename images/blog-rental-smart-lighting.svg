      <text x="90" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">¥30-80/位</text>
      <text x="160" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">★☆☆</text>
      <text x="220" y="14" fill="#a0b8c0" font-family="Microsoft YaHei, sans-serif" font-size="9">老房改造/新手</text>
      <text x="330" y="14" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="9">三路独立控制·最稳定</text>
      <rect x="520" y="3" width="70" height="16" rx="8" fill="#1a3a25" stroke="#3a8a50" stroke-width="0.8"/>
      <text x="555" y="15" text-anchor="middle" fill="#5dd9a8" font-family="sans-serif" font-size="9">⭐ 推荐</text>
