<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141830"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="movGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="50%" stop-color="#cc2222"/>
      <stop offset="100%" stop-color="#991111"/>
    </linearGradient>
    <linearGradient id="gdtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a9fd8"/>
      <stop offset="50%" stop-color="#1a6fba"/>
      <stop offset="100%" stop-color="#0a4f9a"/>
    </linearGradient>
    <linearGradient id="ntcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8c5a"/>
      <stop offset="50%" stop-color="#3a6c3a"/>
      <stop offset="100%" stop-color="#2a4c2a"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ec8f8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg3)"/>
  <!-- Grid -->
  <g opacity="0.05" stroke="#7ec8f8" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="500"/>
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <!-- Title -->
  <text x="400" y="30" fill="#ffffff" font-size="16" font-family="Arial" text-anchor="middle" font-weight="bold" opacity="0.95">LED驱动电源防雷电路拓扑 — MOV + GDT + NTC 三级保护</text>
  <!-- AC Input label -->
  <text x="60" y="130" fill="#ff6b6b" font-size="12" font-family="Arial" text-anchor="start" font-weight="bold">AC 输入</text>
  <text x="60" y="145" fill="#aaaaaa" font-size="9" font-family="Arial" text-anchor="start">220V 50Hz</text>
  <!-- L and N lines -->
  <line x1="100" y1="160" x2="180" y2="160" stroke="#ff4444" stroke-width="2.5"/>
  <text x="105" y="155" fill="#ff4444" font-size="10" font-family="Arial">L</text>
  <line x1="100" y1="240" x2="180" y2="240" stroke="#3a9fd8" stroke-width="2.5"/>
  <text x="105" y="237" fill="#3a9fd8" font-size="10" font-family="Arial">N</text>
  <!-- PE line -->
  <line x1="100" y1="330" x2="680" y2="330" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="105" y="325" fill="#aaaaaa" font-size="10" font-family="Arial">PE(地)</text>
  <!-- Stage 1: MOV (差模保护) -->
  <rect x="170" y="100" rx="10" ry="10" width="160" height="270" fill="#1a2a3a" stroke="#ff4444" stroke-width="1" opacity="0.5"/>
  <text x="250" y="120" fill="#ff4444" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">第一级：差模保护</text>
  <!-- MOV symbol: circle between L-N -->
  <circle cx="250" cy="200" r="25" fill="url(#movGrad)" opacity="0.7" stroke="#ff4444" stroke-width="2" filter="url(#glow3)"/>
  <text x="250" y="195" fill="#ffffff" font-size="10" font-family="Arial" text-anchor="middle" font-weight="bold">MOV</text>
  <text x="250" y="210" fill="#ffffff" font-size="8" font-family="Arial" text-anchor="middle">压敏电阻</text>
  <!-- MOV connections -->
  <line x1="180" y1="160" x2="225" y2="160" stroke="#ff4444" stroke-width="2"/>
  <line x1="225" y1="160" x2="225" y2="175" stroke="#ff4444" stroke-width="2"/>
  <line x1="275" y1="175" x2="275" y2="240" stroke="#ff4444" stroke-width="2"/>
  <line x1="275" y1="240" x2="180" y2="240" stroke="#3a9fd8" stroke-width="2"/>
  <!-- MOV label -->
  <text x="250" y="250" fill="#aaaaaa" font-size="8" font-family="Arial" text-anchor="middle">V1mA: 470-620V</text>
  <text x="250" y="262" fill="#aaaaaa" font-size="8" font-family="Arial" text-anchor="middle">响应: 纳秒级</text>
  <!-- GDT for L-PE -->
  <rect x="230" y="275" rx="4" ry="4" width="40" height="25" fill="url(#gdtGrad)" opacity="0.6" stroke="#3a9fd8" stroke-width="1.5"/>
  <text x="250" y="290" fill="#ffffff" font-size="7" font-family="Arial" text-anchor="middle" font-weight="bold">GDT</text>
  <line x1="230" y1="288" x2="180" y2="160" stroke="#3a9fd8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="270" y1="288" x2="270" y2="330" stroke="#3a9fd8" stroke-width="1"/>
  <!-- GDT for N-PE -->
  <rect x="230" y="310" rx="4" ry="4" width="40" height="25" fill="url(#gdtGrad)" opacity="0.6" stroke="#3a9fd8" stroke-width="1.5"/>
  <text x="250" y="325" fill="#ffffff" font-size="7" font-family="Arial" text-anchor="middle" font-weight="bold">GDT</text>
  <line x1="230" y1="323" x2="180" y2="240" stroke="#3a9fd8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="270" y1="335" x2="270" y2="330" stroke="#3a9fd8" stroke-width="1"/>
  <!-- Stage 2: NTC -->
  <rect x="370" y="130" rx="10" ry="10" width="140" height="140" fill="#1a2a3a" stroke="#5b8c5a" stroke-width="1" opacity="0.5"/>
  <text x="440" y="150" fill="#5b8c5a" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">第二级：启动限流</text>
  <!-- NTC symbol -->
  <ellipse cx="440" cy="220" rx="20" ry="15" fill="url(#ntcGrad)" opacity="0.7" stroke="#5b8c5a" stroke-width="1.5"/>
  <text x="440" y="218" fill="#ffffff" font-size="9" font-family="Arial" text-anchor="middle" font-weight="bold">NTC</text>
  <text x="440" y="230" fill="#ffffff" font-size="7" font-family="Arial" text-anchor="middle">热敏电阻</text>
  <!-- NTC connections -->
  <line x1="330" y1="160" x2="370" y2="160" stroke="#ff4444" stroke-width="2"/>
  <line x1="370" y1="160" x2="420" y2="205" stroke="#ff4444" stroke-width="1.5"/>
  <line x1="460" y1="205" x2="510" y2="160" stroke="#ff4444" stroke-width="1.5"/>
  <!-- NTC label -->
  <text x="440" y="255" fill="#aaaaaa" font-size="8" font-family="Arial" text-anchor="middle">限制启动浪涌电流</text>
  <text x="440" y="267" fill="#aaaaaa" font-size="8" font-family="Arial" text-anchor="middle">30-50倍→正常水平</text>
  <!-- Stage 3: Rectifier + DC output -->
  <rect x="530" y="100" rx="10" ry="10" width="150" height="270" fill="#1a2a3a" stroke="#7ec8f8" stroke-width="1" opacity="0.5"/>
  <text x="605" y="120" fill="#7ec8f8" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">第三级：DC输出</text>
  <!-- Rectifier icon -->
  <path d="M560 150 L580 170 L560 190 L580 210 L560 230" fill="none" stroke="#7ec8f8" stroke-width="1.5"/>
  <text x="610" y="200" fill="#aaaaaa" font-size="8" font-family="Arial" text-anchor="middle">整流桥</text>
  <!-- Filter cap -->
  <rect x="570" y="240" rx="3" ry="3" width="30" height="40" fill="#7ec8f8" opacity="0.15" stroke="#7ec8f8" stroke-width="1"/>
  <text x="585" y="265" fill="#7ec8f8" font-size="7" font-family="Arial" text-anchor="middle">C滤波</text>
  <!-- DC output line -->
  <line x1="510" y1="160" x2="530" y2="160" stroke="#ff4444" stroke-width="2"/>
  <line x1="680" y1="160" x2="750" y2="160" stroke="#7ec8f8" stroke-width="2"/>
  <text x="720" y="155" fill="#7ec8f8" font-size="9" font-family="Arial">DC+</text>
  <!-- DC- line -->
  <line x1="330" y1="240" x2="530" y2="240" stroke="#3a9fd8" stroke-width="2"/>
  <line x1="680" y1="240" x2="750" y2="240" stroke="#aaaaaa" stroke-width="2"/>
  <text x="720" y="235" fill="#aaaaaa" font-size="9" font-family="Arial">DC-</text>
  <!-- LED output symbol -->
  <path d="M720 170 L750 190 L720 210" fill="none" stroke="#7ec8f8" stroke-width="2" filter="url(#glow3)"/>
  <text x="740" y="225" fill="#7ec8f8" font-size="9" font-family="Arial" text-anchor="middle">LED</text>
  <!-- Flow arrows -->
  <path d="M155 160 L170 160" stroke="#ff4444" stroke-width="2" fill="none"/>
  <text x="140" y="155" fill="#ff4444" font-size="8" font-family="Arial">→</text>
  <!-- Protection direction arrows -->
  <path d="M250 225 L250 275" stroke="#3a9fd8" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  <text x="260" y="250" fill="#3a9fd8" font-size="8" font-family="Arial" opacity="0.7">共模</text>
  <!-- Summary labels at bottom -->
  <rect x="30" y="400" rx="8" ry="8" width="230" height="75" fill="#1a2a3a" stroke="#ff4444" stroke-width="1" opacity="0.7"/>
  <circle cx="55" cy="420" r="10" fill="#ff4444" opacity="0.5"/>
  <text x="55" y="423" fill="#ffffff" font-size="8" font-family="Arial" text-anchor="middle">1</text>
  <text x="80" y="420" fill="#ff4444" font-size="10" font-family="Arial" font-weight="bold">MOV 压敏电阻</text>
  <text x="55" y="440" fill="#aaaaaa" font-size="9" font-family="Arial">差模保护(L-N)，纳秒响应</text>
  <text x="55" y="455" fill="#aaaaaa" font-size="9" font-family="Arial">每次动作后微量退化</text>
  <text x="55" y="470" fill="#ff6b6b" font-size="9" font-family="Arial">⚠️ 需配GDT做二级冗余</text>
  <rect x="280" y="400" rx="8" ry="8" width="230" height="75" fill="#1a2a3a" stroke="#3a9fd8" stroke-width="1" opacity="0.7"/>
  <circle cx="305" cy="420" r="10" fill="#3a9fd8" opacity="0.5"/>
  <text x="305" y="423" fill="#ffffff" font-size="8" font-family="Arial" text-anchor="middle">2</text>
  <text x="330" y="420" fill="#3a9fd8" font-size="10" font-family="Arial" font-weight="bold">GDT 气体放电管</text>
  <text x="305" y="440" fill="#aaaaaa" font-size="9" font-family="Arial">共模保护(L/N-PE)</text>
  <text x="305" y="455" fill="#aaaaaa" font-size="9" font-family="Arial">大能量泄放，微秒响应</text>
  <text x="305" y="470" fill="#7ec8f8" font-size="9" font-family="Arial">户外驱动必备，信号线也需</text>
  <rect x="530" y="400" rx="8" ry="8" width="230" height="75" fill="#1a2a3a" stroke="#5b8c5a" stroke-width="1" opacity="0.7"/>
  <circle cx="555" cy="420" r="10" fill="#5b8c5a" opacity="0.5"/>
  <text x="555" y="423" fill="#ffffff" font-size="8" font-family="Arial" text-anchor="middle">3</text>
  <text x="580" y="420" fill="#5b8c5a" font-size="10" font-family="Arial" font-weight="bold">NTC 热敏电阻</text>
  <text x="555" y="440" fill="#aaaaaa" font-size="9" font-family="Arial">启动浪涌电流限制</text>
  <text x="555" y="455" fill="#aaaaaa" font-size="9" font-family="Arial">防止整流桥击穿</text>
  <text x="555" y="470" fill="#5b8c5a" font-size="9" font-family="Arial">非防雷元件但影响可靠性</text>
</svg>