<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <filter id="neon3">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowD" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2478C2"/>
    </marker>
    <marker id="arrowG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7ec27e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="440" fill="url(#bgGrad3)"/>
  
  <!-- Grid -->
  <g stroke="#1a2a4a" stroke-width="0.3" opacity="0.3">
    <line x1="0" y1="55" x2="680" y2="55"/><line x1="0" y1="110" x2="680" y2="110"/>
    <line x1="0" y1="165" x2="680" y2="165"/><line x1="0" y1="220" x2="680" y2="220"/>
    <line x1="0" y1="275" x2="680" y2="275"/><line x1="0" y1="330" x2="680" y2="330"/>
    <line x1="0" y1="385" x2="680" y2="385"/>
    <line x1="170" y1="0" x2="170" y2="440"/><line x1="340" y1="0" x2="340" y2="440"/>
    <line x1="510" y1="0" x2="510" y2="440"/>
  </g>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" filter="url(#neon3)">智能照明选型决策流程图</text>
  <line x1="150" y1="43" x2="530" y2="43" stroke="#2478C2" stroke-width="1" opacity="0.6"/>

  <!-- Start Node -->
  <rect x="260" y="58" width="160" height="32" rx="16" fill="#2478C2" opacity="0.25" stroke="#2478C2" stroke-width="1"/>
  <text x="340" y="78" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">开始：选一个房间</text>

  <!-- Arrow down -->
  <line x1="340" y1="90" x2="340" y2="110" stroke="#2478C2" stroke-width="1.5" marker-end="url(#arrowD)"/>

  <!-- Q1: Need dimming? -->
  <rect x="220" y="112" width="240" height="36" rx="6" fill="#1a2540" stroke="#2478C2" stroke-width="1.2"/>
  <text x="340" y="134" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12">❓ 需要调亮度/色温吗？</text>

  <!-- YES branch -->
  <line x1="460" y1="130" x2="520" y2="130" stroke="#7ec27e" stroke-width="1.5"/>
  <line x1="520" y1="130" x2="520" y2="170" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="500" y="125" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="10">YES ✓</text>

  <!-- YES: Smart Bulb -->
  <rect x="440" y="172" width="160" height="45" rx="6" fill="#0d1b33" stroke="#7ec27e" stroke-width="1.2"/>
  <text x="520" y="190" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="12" font-weight="bold">💡 选智能灯</text>
  <text x="520" y="207" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">客厅/卧室推荐</text>

  <!-- NO branch -->
  <line x1="220" y1="130" x2="160" y2="130" stroke="#cc8833" stroke-width="1.5"/>
  <line x1="160" y1="130" x2="160" y2="170" stroke="#cc8833" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <text x="140" y="125" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="10">NO</text>

  <defs><marker id="arrowO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#cc8833"/>
  </marker></defs>

  <!-- Q2: Auto on/off? -->
  <rect x="80" y="172" width="160" height="36" rx="6" fill="#1a2540" stroke="#cc8833" stroke-width="1.2"/>
  <text x="160" y="194" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">❓ 需要人来灯亮</text>
  <text x="160" y="208" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">人走灯灭自动感应？</text>

  <!-- Q2 YES -->
  <line x1="80" y1="190" x2="45" y2="190" stroke="#7ec27e" stroke-width="1.5"/>
  <line x1="45" y1="190" x2="45" y2="235" stroke="#7ec27e" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="30" y="183" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="9">YES</text>

  <rect x="15" y="237" width="60" height="60" rx="6" fill="#0d1b33" stroke="#7ec27e" stroke-width="1"/>
  <text x="45" y="258" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="9" font-weight="bold">智能开关</text>
  <text x="45" y="274" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="8">+传感器</text>
  <text x="45" y="288" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="7">厨房/卫生间</text>

  <!-- Q2 NO -->
  <line x1="160" y1="208" x2="160" y2="240" stroke="#cc8833" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <!-- Q3: Frequent switching? -->
  <rect x="105" y="242" width="110" height="36" rx="6" fill="#1a2540" stroke="#cc8833" stroke-width="1.2"/>
  <text x="160" y="262" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">❓ 频繁开关？</text>
  <text x="160" y="276" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">还是偶尔开关？</text>

  <!-- Q3 YES: frequent -->
  <line x1="215" y1="260" x2="250" y2="260" stroke="#8866cc" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <text x="237" y="253" text-anchor="middle" fill="#8866cc" font-family="monospace" font-size="9">频繁</text>

  <defs><marker id="arrowP" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#8866cc"/>
  </marker></defs>

  <rect x="252" y="237" width="95" height="55" rx="6" fill="#0d1b33" stroke="#8866cc" stroke-width="1"/>
  <text x="299" y="258" text-anchor="middle" fill="#8866cc" font-family="monospace" font-size="9" font-weight="bold">智能开关</text>
  <text x="299" y="274" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="8">+普通灯</text>
  <text x="299" y="288" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="7">玄关/走廊</text>

  <!-- Q3 NO: occasional -->
  <line x1="160" y1="278" x2="160" y2="315" stroke="#cc8833" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <text x="142" y="300" fill="#cc8833" font-family="monospace" font-size="9">偶尔</text>

  <rect x="105" y="317" width="110" height="45" rx="6" fill="#0d1b33" stroke="#cc8833" stroke-width="1"/>
  <text x="160" y="337" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="11" font-weight="bold">普通开关+普通灯</text>
  <text x="160" y="353" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="8">阳台/储藏室 够用就好</text>

  <!-- Bottom rule -->
  <rect x="40" y="385" width="600" height="30" rx="6" fill="#331a1a" stroke="#cc3333" stroke-width="1"/>
  <text x="340" y="405" text-anchor="middle" fill="#cc3333" font-family="monospace" font-size="11" font-weight="bold" filter="url(#neon3)">⚠ 核心原则：同一线路不叠罗汉！智能开关+智能灯 = 必离线</text>

  <text x="340" y="435" text-anchor="middle" fill="#2a4a6a" font-family="monospace" font-size="8">NEXLAMP 耐利普科技 | 涂鸦Zigbee智能照明 www.nexlamp.com</text>
</svg>