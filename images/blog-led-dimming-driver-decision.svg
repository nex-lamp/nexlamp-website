<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2fff"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162d50"/>
      <stop offset="100%" stop-color="#0f1f38"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a3a"/>
      <stop offset="100%" stop-color="#0f2020"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="100%" stop-color="#1a0f28"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="520" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="680" y2="0"/><line x1="0" y1="20" x2="680" y2="20"/>
    <line x1="0" y1="40" x2="680" y2="40"/><line x1="0" y1="60" x2="680" y2="60"/>
    <line x1="0" y1="80" x2="680" y2="80"/><line x1="0" y1="100" x2="680" y2="100"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="140" x2="680" y2="140"/>
    <line x1="0" y1="160" x2="680" y2="160"/><line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="200" x2="680" y2="200"/><line x1="0" y1="220" x2="680" y2="220"/>
    <line x1="0" y1="240" x2="680" y2="240"/><line x1="0" y1="260" x2="680" y2="260"/>
    <line x1="0" y1="280" x2="680" y2="280"/><line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="320" x2="680" y2="320"/><line x1="0" y1="340" x2="680" y2="340"/>
    <line x1="0" y1="360" x2="680" y2="360"/><line x1="0" y1="380" x2="680" y2="380"/>
    <line x1="0" y1="400" x2="680" y2="400"/><line x1="0" y1="420" x2="680" y2="420"/>
    <line x1="0" y1="440" x2="680" y2="440"/><line x1="0" y1="460" x2="680" y2="460"/>
    <line x1="0" y1="480" x2="680" y2="480"/><line x1="0" y1="500" x2="680" y2="500"/>
    <line x1="0" y1="0" x2="0" y2="520"/><line x1="20" y1="0" x2="20" y2="520"/>
    <line x1="40" y1="0" x2="40" y2="520"/><line x1="60" y1="0" x2="60" y2="520"/>
    <line x1="80" y1="0" x2="80" y2="520"/><line x1="100" y1="0" x2="100" y2="520"/>
    <line x1="120" y1="0" x2="120" y2="520"/><line x1="140" y1="0" x2="140" y2="520"/>
    <line x1="160" y1="0" x2="160" y2="520"/><line x1="180" y1="0" x2="180" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/><line x1="220" y1="0" x2="220" y2="520"/>
    <line x1="240" y1="0" x2="240" y2="520"/><line x1="260" y1="0" x2="260" y2="520"/>
    <line x1="280" y1="0" x2="280" y2="520"/><line x1="300" y1="0" x2="300" y2="520"/>
    <line x1="320" y1="0" x2="320" y2="520"/><line x1="340" y1="0" x2="340" y2="520"/>
    <line x1="360" y1="0" x2="360" y2="520"/><line x1="380" y1="0" x2="380" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/><line x1="420" y1="0" x2="420" y2="520"/>
    <line x1="440" y1="0" x2="440" y2="520"/><line x1="460" y1="0" x2="460" y2="520"/>
    <line x1="480" y1="0" x2="480" y2="520"/><line x1="500" y1="0" x2="500" y2="520"/>
    <line x1="520" y1="0" x2="520" y2="520"/><line x1="540" y1="0" x2="540" y2="520"/>
    <line x1="560" y1="0" x2="560" y2="520"/><line x1="580" y1="0" x2="580" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/><line x1="620" y1="0" x2="620" y2="520"/>
    <line x1="640" y1="0" x2="640" y2="520"/><line x1="660" y1="0" x2="660" y2="520"/>
  </g>

  <!-- Title bar -->
  <rect x="40" y="15" width="600" height="40" rx="5" fill="#0d1f35" stroke="#1a4a7a" stroke-width="1"/>
  <text x="60" y="41" fill="#00d4ff" font-size="16" font-family="monospace" font-weight="bold">LED调光驱动选购决策树 &gt; Select Your Driver</text>

  <!-- Root question -->
  <rect x="180" y="75" width="320" height="44" rx="22" fill="url(#boxGrad1)" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="340" y="102" fill="#00d4ff" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">你的项目是什么类型的？</text>

  <!-- Left branch: Residential -->
  <line x1="250" y1="119" x2="120" y2="145" stroke="#00aaff" stroke-width="1.5"/>
  <line x1="430" y1="119" x2="560" y2="145" stroke="#00ff88" stroke-width="1.5"/>
  <text x="130" y="138" fill="#00aaff" font-size="11" font-family="monospace">住宅/公寓</text>
  <text x="540" y="138" fill="#00ff88" font-size="11" font-family="monospace">商业/工业</text>

  <!-- Left sub: Residential -->
  <rect x="15" y="150" width="210" height="44" rx="8" fill="url(#boxGrad1)" stroke="#00aaff" stroke-width="1"/>
  <text x="120" y="170" fill="#fff" font-size="12" font-family="monospace" text-anchor="middle">是否已装修完？</text>
  <text x="120" y="186" fill="#8ab4f8" font-size="10" font-family="monospace" text-anchor="middle">(新装修 vs 老房改造)</text>

  <!-- Left-left: Old house -->
  <line x1="80" y1="194" x2="50" y2="220" stroke="#ffaa00" stroke-width="1.5"/>
  <line x1="180" y1="194" x2="220" y2="220" stroke="#00aaff" stroke-width="1.5"/>
  <text x="35" y="213" fill="#ffaa00" font-size="9" font-family="monospace">是(老房)</text>
  <text x="220" y="213" fill="#00aaff" font-size="9" font-family="monospace">否(新装)</text>

  <rect x="5" y="225" width="130" height="60" rx="8" fill="url(#boxGrad2)" stroke="#ffaa00" stroke-width="1"/>
  <text x="70" y="248" fill="#ffaa00" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold">可控硅调光</text>
  <text x="70" y="265" fill="#8ab4f8" font-size="9" font-family="monospace" text-anchor="middle">Triac Dimming</text>
  <text x="70" y="279" fill="#5a7a9a" font-size="8" font-family="monospace" text-anchor="middle">2线 不改电线</text>

  <rect x="150" y="225" width="130" height="60" rx="8" fill="url(#boxGrad3)" stroke="#00aaff" stroke-width="1"/>
  <text x="215" y="248" fill="#00aaff" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold">Zigbee/蓝牙</text>
  <text x="215" y="265" fill="#a08cf8" font-size="9" font-family="monospace" text-anchor="middle">无线智能方案</text>
  <text x="215" y="279" fill="#5a7a9a" font-size="8" font-family="monospace" text-anchor="middle">2线+网关+APP</text>

  <!-- Left sub2: Zigbee detail -->
  <rect x="150" y="295" width="130" height="36" rx="6" fill="#0d1a30" stroke="#00aaff" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="215" y="310" fill="#8ab4f8" font-size="9" font-family="monospace" text-anchor="middle">涂鸦 | 米家 | Aqara</text>
  <text x="215" y="324" fill="#5a7a9a" font-size="8" font-family="monospace" text-anchor="middle">推荐涂鸦Zigbee方案</text>

  <!-- Right branch: Commercial -->
  <rect x="430" y="150" width="240" height="44" rx="8" fill="url(#boxGrad1)" stroke="#00ff88" stroke-width="1"/>
  <text x="550" y="170" fill="#fff" font-size="12" font-family="monospace" text-anchor="middle">是否需要单灯控制？</text>
  <text x="550" y="186" fill="#5a9a6a" font-size="10" font-family="monospace" text-anchor="middle">(独立地址寻址)</text>

  <!-- Right-right: Need individual -->
  <line x1="500" y1="194" x2="450" y2="220" stroke="#7b2fff" stroke-width="1.5"/>
  <line x1="610" y1="194" x2="630" y2="220" stroke="#00ff88" stroke-width="1.5"/>
  <text x="440" y="213" fill="#7b2fff" font-size="9" font-family="monospace">需要</text>
  <text x="630" y="213" fill="#00ff88" font-size="9" font-family="monospace">不需要</text>

  <rect x="350" y="225" width="160" height="60" rx="8" fill="url(#boxGrad3)" stroke="#7b2fff" stroke-width="1"/>
  <text x="430" y="248" fill="#7b2fff" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold">DALI-2 调光</text>
  <text x="430" y="265" fill="#a08cf8" font-size="9" font-family="monospace" text-anchor="middle">Digital Addressable</text>
  <text x="430" y="279" fill="#5a7a9a" font-size="8" font-family="monospace" text-anchor="middle">5线 0.1%深度调光</text>

  <rect x="540" y="225" width="130" height="60" rx="8" fill="url(#boxGrad2)" stroke="#00ff88" stroke-width="1"/>
  <text x="605" y="248" fill="#00ff88" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold">0-10V 调光</text>
  <text x="605" y="265" fill="#5a9a6a" font-size="9" font-family="monospace" text-anchor="middle">Analog Dimming</text>
  <text x="605" y="279" fill="#5a7a9a" font-size="8" font-family="monospace" text-anchor="middle">4线 300m距离</text>

  <!-- DALI detail -->
  <rect x="350" y="295" width="160" height="36" rx="6" fill="#0d1a30" stroke="#7b2fff" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="430" y="310" fill="#a08cf8" font-size="9" font-family="monospace" text-anchor="middle">博物馆 | 酒店 | 高端商业</text>
  <text x="430" y="324" fill="#5a7a9a" font-size="8" font-family="monospace" text-anchor="middle">NFC预配地址更省事</text>

  <!-- 0-10V detail -->
  <rect x="540" y="295" width="130" height="36" rx="6" fill="#0d1a30" stroke="#00ff88" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="605" y="310" fill="#5a9a6a" font-size="9" font-family="monospace" text-anchor="middle">办公室 | 停车场</text>
  <text x="605" y="324" fill="#5a7a9a" font-size="8" font-family="monospace" text-anchor="middle">性价比最高</text>

  <!-- Bottom summary bar -->
  <rect x="80" y="360" width="520" height="50" rx="6" fill="#0d1f35" stroke="#1a4a7a" stroke-width="1"/>
  <text x="340" y="382" fill="#00d4ff" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">⚡ 关键原则</text>
  <text x="340" y="400" fill="#8ab4f8" font-size="10" font-family="monospace" text-anchor="middle">恒流看电流(mA)  |  恒压看电压(V)  |  调光方式接口需与控制器匹配</text>

  <!-- Footer -->
  <text x="340" y="450" fill="#5a7a9a" font-size="9" font-family="monospace" text-anchor="middle">Nexlamp Technology · www.nexlamp.com · 涂鸦Zigbee智能照明方案商</text>
  <rect x="260" y="465" width="160" height="28" rx="14" fill="#0d1f35" stroke="#00d4ff" stroke-width="1"/>
  <text x="340" y="484" fill="#00d4ff" font-size="11" font-family="monospace" text-anchor="middle">扫码咨询选型方案 &gt;</text>

  <!-- Decorative terminal elements -->
  <rect x="5" y="5" width="8" height="8" rx="1" fill="#ff5555"/>
  <rect x="17" y="5" width="8" height="8" rx="1" fill="#ffaa00"/>
  <rect x="29" y="5" width="8" height="8" rx="1" fill="#00ff88"/>
  <text x="45" y="13" fill="#5a7a9a" font-size="8" font-family="monospace">决策树 v2.0</text>
</svg>