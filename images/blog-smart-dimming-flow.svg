<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff3535" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Grid -->
  <g stroke="#1a3a5c" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="20" font-weight="bold" filter="url(#glow-filter)">智能调光翻车排查流程</text>
  <!-- Flowchart: Signal Path -->
  <!-- Box 1: 调光信号 -->
  <rect x="50" y="110" width="160" height="70" rx="8" fill="#0d2137" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="130" y="140" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="13" font-weight="bold">调光信号源</text>
  <text x="130" y="160" text-anchor="middle" fill="#8ab4d4" font-family="monospace" font-size="10">APP / 旋钮 / 语音</text>
  <!-- Arrow 1 -->
  <line x1="210" y1="145" x2="260" y2="145" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow1)"/>
  <defs><marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00d4ff"/></marker></defs>
  <!-- Box 2: 协议转换 -->
  <rect x="260" y="110" width="160" height="70" rx="8" fill="#0d2137" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="340" y="140" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="13" font-weight="bold">协议匹配层</text>
  <text x="340" y="160" text-anchor="middle" fill="#d4a08a" font-family="monospace" font-size="10">Zigbee/Matter/DALI</text>
  <!-- Arrow 2 -->
  <line x1="420" y1="145" x2="470" y2="145" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs><marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff6b35"/></marker></defs>
  <!-- Box 3: LED驱动 -->
  <rect x="470" y="110" width="160" height="70" rx="8" fill="#0d2137" stroke="#00ff88" stroke-width="1.5"/>
  <text x="550" y="140" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="13" font-weight="bold">LED驱动电源</text>
  <text x="550" y="160" text-anchor="middle" fill="#8ad4a8" font-family="monospace" font-size="10">PWM/0-10V/TRIAC</text>
  <!-- Arrow 3 -->
  <line x1="630" y1="145" x2="680" y2="145" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow3)"/>
  <defs><marker id="arrow3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00ff88"/></marker></defs>
  <!-- Box 4: 灯具输出 -->
  <rect x="680" y="110" width="80" height="70" rx="8" fill="#0d2137" stroke="#ffffff" stroke-width="1.5"/>
  <text x="720" y="145" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">灯</text>
  <text x="720" y="162" text-anchor="middle" fill="#aaaaaa" font-family="monospace" font-size="10">输出</text>

  <!-- Problem Zone: Flashing -->
  <rect x="60" y="230" width="320" height="220" rx="10" fill="#1a0a0a" stroke="#ff3535" stroke-width="1" stroke-dasharray="5,3" opacity="0.8"/>
  <text x="220" y="260" text-anchor="middle" fill="#ff3535" font-family="monospace" font-size="14" font-weight="bold">⚠ 闪烁翻车区</text>
  <!-- Flash symptom -->
  <rect x="80" y="275" width="130" height="45" rx="6" fill="#2a1010" stroke="#ff6b35" stroke-width="1"/>
  <text x="145" y="295" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">低亮度闪烁</text>
  <text x="145" y="310" text-anchor="middle" fill="#996040" font-family="monospace" font-size="9">驱动最低负载不足</text>
  <!-- Fix -->
  <rect x="230" y="275" width="130" height="45" rx="6" fill="#0a2a1a" stroke="#00ff88" stroke-width="1"/>
  <text x="295" y="295" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11">加假负载/换驱动</text>
  <text x="295" y="310" text-anchor="middle" fill="#409960" font-family="monospace" font-size="9">匹配调光曲线</text>
  <line x1="210" y1="297" x2="230" y2="297" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <!-- Flash symptom 2 -->
  <rect x="80" y="335" width="130" height="45" rx="6" fill="#2a1010" stroke="#ff6b35" stroke-width="1"/>
  <text x="145" y="355" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">调光嗡嗡响</text>
  <text x="145" y="370" text-anchor="middle" fill="#996040" font-family="monospace" font-size="9">TRIAC不匹配LED</text>
  <!-- Fix 2 -->
  <rect x="230" y="335" width="130" height="45" rx="6" fill="#0a2a1a" stroke="#00ff88" stroke-width="1"/>
  <text x="295" y="355" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11">换ELV/0-10V驱动</text>
  <text x="295" y="370" text-anchor="middle" fill="#409960" font-family="monospace" font-size="9">协议必须一致</text>
  <line x1="210" y1="357" x2="230" y2="357" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <!-- Flash symptom 3 -->
  <rect x="80" y="395" width="130" height="45" rx="6" fill="#2a1010" stroke="#ff6b35" stroke-width="1"/>
  <text x="145" y="415" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11">调光范围窄</text>
  <text x="145" y="430" text-anchor="middle" fill="#996040" font-family="monospace" font-size="9">10%-100% vs 1%-100%</text>
  <rect x="230" y="395" width="130" height="45" rx="6" fill="#0a2a1a" stroke="#00ff88" stroke-width="1"/>
  <text x="295" y="415" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11">选PWM/0-10V驱动</text>
  <text x="295" y="430" text-anchor="middle" fill="#409960" font-family="monospace" font-size="9">支持1%深度调光</text>
  <line x1="210" y1="417" x2="230" y2="417" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Network Zone: Dropping -->
  <rect x="420" y="230" width="340" height="220" rx="10" fill="#0a0a1a" stroke="#00d4ff" stroke-width="1" stroke-dasharray="5,3" opacity="0.8"/>
  <text x="590" y="260" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14" font-weight="bold">📡 掉线排查区</text>
  <!-- Mesh diagram -->
  <circle cx="490" cy="310" r="12" fill="#00d4ff" opacity="0.8" filter="url(#glow-filter)"/>
  <text x="490" y="335" text-anchor="middle" fill="#8ab4d4" font-family="monospace" font-size="8">网关</text>
  <circle cx="560" cy="290" r="8" fill="#00ff88" opacity="0.6"/>
  <text x="560" y="310" text-anchor="middle" fill="#8ad4a8" font-family="monospace" font-size="7">路由</text>
  <circle cx="610" cy="320" r="8" fill="#00ff88" opacity="0.6"/>
  <circle cx="540" cy="350" r="8" fill="#ff6b35" opacity="0.6"/>
  <circle cx="660" cy="295" r="6" fill="#ff3535" opacity="0.5"/>
  <text x="660" y="313" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="7">离线!</text>
  <!-- Mesh lines -->
  <line x1="490" y1="310" x2="560" y2="290" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <line x1="490" y1="310" x2="540" y2="350" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <line x1="560" y1="290" x2="610" y2="320" stroke="#00ff88" stroke-width="0.8" opacity="0.5"/>
  <line x1="560" y1="290" x2="660" y2="295" stroke="#ff3535" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>
  <!-- Fix list -->
  <text x="450" y="385" fill="#00d4ff" font-family="monospace" font-size="10">▸ 关灯=路由断 → 规划常电节点</text>
  <text x="450" y="403" fill="#00d4ff" font-family="monospace" font-size="10">▸ 2.4G干扰 → Wi-Fi固定信道</text>
  <text x="450" y="421" fill="#00d4ff" font-family="monospace" font-size="10">▸ 网关过载 → 每60㎡一个网关</text>
  <text x="450" y="439" fill="#00d4ff" font-family="monospace" font-size="10">▸ Matter本地优先 → 断网也能调</text>
</svg>