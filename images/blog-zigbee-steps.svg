<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow1"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#7b61ff"/></linearGradient>
    <linearGradient id="okGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00e676"/><stop offset="100%" stop-color="#00c853"/></linearGradient>
  </defs>
  <rect width="680" height="420" fill="#0a1628"/>
  <g stroke="#162240" stroke-width="0.5">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="340" y1="60" x2="340" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/>
  </g>
  <text x="40" y="40" fill="#00d4ff" font-family="monospace" font-size="16" filter="url(#glow1)">┌─ Zigbee 掉线四步排查流程 ───────────────────────────────────┐</text>
  <text x="40" y="410" fill="#00d4ff" font-family="monospace" font-size="14" filter="url(#glow1)">└─ nexLAMP.com ──────────────────────────────────────────────────────┘</text>
  <!-- Step 1 -->
  <rect x="40" y="80" width="260" height="55" rx="6" fill="#0d1f3c" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="60" y="103" fill="#00d4ff" font-family="monospace" font-size="14" font-weight="700">STEP 1 检查网关</text>
  <text x="60" y="122" fill="#7a9abf" font-family="monospace" font-size="11">USB延长1m · 远离金属 · 房屋中心</text>
  <!-- Step 2 -->
  <rect x="40" y="150" width="260" height="55" rx="6" fill="#0d1f3c" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="60" y="173" fill="#00d4ff" font-family="monospace" font-size="14" font-weight="700">STEP 2 优化信道</text>
  <text x="60" y="192" fill="#7a9abf" font-family="monospace" font-size="11">避开WiFi 1/6/11 → 选ZB 15/20/25</text>
  <!-- Step 3 -->
  <rect x="40" y="220" width="260" height="55" rx="6" fill="#0d1f3c" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="60" y="243" fill="#00d4ff" font-family="monospace" font-size="14" font-weight="700">STEP 3 补路由节点</text>
  <text x="60" y="262" fill="#7a9abf" font-family="monospace" font-size="11">加零火开关 · LQI检查 · mesh覆盖</text>
  <!-- Step 4 -->
  <rect x="40" y="290" width="260" height="55" rx="6" fill="#0d1f3c" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="60" y="313" fill="#00d4ff" font-family="monospace" font-size="14" font-weight="700">STEP 4 排查干扰</text>
  <text x="60" y="332" fill="#7a9abf" font-family="monospace" font-size="11">USB3.0 · LED驱动EMI · 微波炉</text>
  <!-- Arrows -->
  <polygon points="315,107 325,107 325,147" fill="none" stroke="url(#stepGrad)" stroke-width="1.5"/>
  <polygon points="315,177 325,177 325,217" fill="none" stroke="url(#stepGrad)" stroke-width="1.5"/>
  <polygon points="315,247 325,247 325,317" fill="none" stroke="url(#stepGrad)" stroke-width="1.5"/>
  <text x="310" y="375" fill="#00d4ff" font-family="monospace" font-size="10" text-anchor="middle">⇣</text>
  <!-- Result -->
  <rect x="40" y="360" width="260" height="38" rx="6" fill="#0d1f3c" stroke="url(#okGrad)" stroke-width="2"/>
  <text x="60" y="383" fill="#00e676" font-family="monospace" font-size="14" font-weight="700" filter="url(#glow1)">✓ 网络稳定 · 灯不再掉线</text>
  <!-- Right: Tools Panel -->
  <rect x="340" y="80" width="300" height="50" rx="6" fill="#0d1f3c" stroke="#7b61ff" stroke-width="1"/>
  <text x="360" y="100" fill="#7b61ff" font-family="monospace" font-size="12" font-weight="700">🛠 排查工具箱</text>
  <text x="360" y="118" fill="#7a9abf" font-family="monospace" font-size="10">Zigbee2MQTT Map 视图 → LQI 热力图</text>
  <rect x="340" y="145" width="300" height="50" rx="6" fill="#0d1f3c" stroke="#7b61ff" stroke-width="1"/>
  <text x="360" y="165" fill="#7b61ff" font-family="monospace" font-size="12" font-weight="700">📊 信号参考值</text>
  <text x="360" y="183" fill="#7a9abf" font-family="monospace" font-size="10">LQI≥150 优 | 100-150 良 | 50-100 差 | &lt;50 断连</text>
  <rect x="340" y="210" width="300" height="50" rx="6" fill="#0d1f3c" stroke="#7b61ff" stroke-width="1"/>
  <text x="360" y="230" fill="#7b61ff" font-family="monospace" font-size="12" font-weight="700">⚙ 推荐配置</text>
  <text x="360" y="248" fill="#7a9abf" font-family="monospace" font-size="10">EFR32MG21 协调器 · channel:20 · tx_power:9</text>
  <rect x="340" y="275" width="300" height="95" rx="6" fill="#0d1f3c" stroke="#ff8a65" stroke-width="1"/>
  <text x="360" y="295" fill="#ff8a65" font-family="monospace" font-size="12" font-weight="700">⚠ 常见陷阱</text>
  <text x="360" y="315" fill="#ff8a65" font-family="monospace" font-size="10">· 网关插路由器USB口＝自杀式安装</text>
  <text x="360" y="333" fill="#ff8a65" font-family="monospace" font-size="10">· 弱电箱放网关＝金属法拉第笼</text>
  <text x="360" y="351" fill="#ff8a65" font-family="monospace" font-size="10">· 劣质LED驱动EMI＝隐形信号杀手</text>
</svg>