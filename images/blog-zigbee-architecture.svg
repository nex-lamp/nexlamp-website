<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#grad1)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="20" font-weight="bold" filter="url(#glow)">Zigbee 全屋智能照明组网架构</text>
  <line x1="250" y1="50" x2="550" y2="50" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>

  <!-- Cloud -->
  <rect x="320" y="70" width="160" height="50" rx="25" fill="#1a3a5c" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="13" filter="url(#glow)">涂鸦云 / Tuya Cloud</text>

  <!-- Down arrow -->
  <line x1="400" y1="120" x2="400" y2="150" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#00d4ff"/></marker></defs>

  <!-- Gateway -->
  <rect x="310" y="155" width="180" height="55" rx="8" fill="#0d2240" stroke="#00ff88" stroke-width="2"/>
  <text x="400" y="178" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">Zigbee 有线网关</text>
  <text x="400" y="198" text-anchor="middle" fill="#88bbff" font-family="monospace" font-size="11">Gateway (Coordinator)</text>

  <!-- Router nodes row -->
  <!-- Router 1 -->
  <rect x="50" y="265" width="160" height="55" rx="8" fill="#0d2240" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="130" y="288" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="13" font-weight="bold" filter="url(#glow)">路由节点 1</text>
  <text x="130" y="306" text-anchor="middle" fill="#8899bb" font-family="monospace" font-size="11">零火供电 中继</text>

  <!-- Router 2 -->
  <rect x="320" y="265" width="160" height="55" rx="8" fill="#0d2240" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="400" y="288" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="13" font-weight="bold" filter="url(#glow)">路由节点 2</text>
  <text x="400" y="306" text-anchor="middle" fill="#8899bb" font-family="monospace" font-size="11">智能灯泡 中继</text>

  <!-- Router 3 -->
  <rect x="590" y="265" width="160" height="55" rx="8" fill="#0d2240" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="670" y="288" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="13" font-weight="bold" filter="url(#glow)">路由节点 3</text>
  <text x="670" y="306" text-anchor="middle" fill="#8899bb" font-family="monospace" font-size="11">智能开关 中继</text>

  <!-- End devices -->
  <rect x="50" y="380" width="120" height="42" rx="6" fill="#0d2240" stroke="#cc88ff" stroke-width="1" opacity="0.8"/>
  <text x="110" y="398" text-anchor="middle" fill="#cc88ff" font-family="monospace" font-size="11">终端 传感器</text>
  <text x="110" y="413" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">电池供电</text>

  <rect x="225" y="380" width="120" height="42" rx="6" fill="#0d2240" stroke="#cc88ff" stroke-width="1" opacity="0.8"/>
  <text x="285" y="398" text-anchor="middle" fill="#cc88ff" font-family="monospace" font-size="11">终端 筒灯</text>
  <text x="285" y="413" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">单火取电</text>

  <rect x="445" y="380" width="120" height="42" rx="6" fill="#0d2240" stroke="#cc88ff" stroke-width="1" opacity="0.8"/>
  <text x="505" y="398" text-anchor="middle" fill="#cc88ff" font-family="monospace" font-size="11">终端 射灯</text>
  <text x="505" y="413" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">单火取电</text>

  <rect x="620" y="380" width="120" height="42" rx="6" fill="#0d2240" stroke="#cc88ff" stroke-width="1" opacity="0.8"/>
  <text x="680" y="398" text-anchor="middle" fill="#cc88ff" font-family="monospace" font-size="11">终端 灯带</text>
  <text x="680" y="413" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">单火取电</text>

  <!-- Connecting lines from gateway to routers -->
  <line x1="490" y1="210" x2="210" y2="265" stroke="#ffaa00" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="400" y1="210" x2="400" y2="265" stroke="#ffaa00" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="310" y1="210" x2="590" y2="265" stroke="#ffaa00" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Connecting lines from routers to end devices -->
  <line x1="130" y1="320" x2="110" y2="380" stroke="#cc88ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="160" y1="320" x2="285" y2="380" stroke="#cc88ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="380" y1="320" x2="505" y2="380" stroke="#cc88ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="630" y1="320" x2="680" y2="380" stroke="#cc88ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Legend -->
  <text x="20" y="470" fill="#00ff88" font-family="monospace" font-size="11">■ Gateway</text>
  <text x="180" y="470" fill="#ffaa00" font-family="monospace" font-size="11">■ Router (可中继)</text>
  <text x="400" y="470" fill="#cc88ff" font-family="monospace" font-size="11">■ End Device (不中继)</text>
  <text x="620" y="470" fill="#ff6666" font-family="monospace" font-size="10" opacity="0.7">⚠ 单火设备=终端，不能做中继</text>

  <!-- Terminal style corner -->
  <text x="760" y="485" text-anchor="end" fill="#334466" font-family="monospace" font-size="9">nexlamp.com</text>
</svg>