<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="pirGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e0e8f0" font-size="22" font-family="monospace" font-weight="bold">PIR vs mmWave Radar: Sensor Technology Comparison</text>

  <!-- Left side: PIR -->
  <g transform="translate(50, 80)">
    <text x="150" y="25" text-anchor="middle" fill="#ff6b6b" font-size="16" font-family="monospace" font-weight="bold">PIR (Passive Infrared)</text>
    
    <!-- PIR sensor icon -->
    <circle cx="150" cy="80" r="20" fill="#1a2a4a" stroke="#ff6b6b" stroke-width="2"/>
    <circle cx="150" cy="80" r="8" fill="#ff6b6b" opacity="0.6"/>
    
    <!-- Detection cone -->
    <path d="M 150 100 L 50 250 L 250 250 Z" fill="url(#pirGrad)" opacity="0.3"/>
    <path d="M 150 100 L 50 250 L 250 250 Z" fill="none" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    
    <!-- Person walking -->
    <g transform="translate(120, 200)">
      <circle cx="15" cy="5" r="8" fill="#ff6b6b" opacity="0.8"/>
      <rect x="10" y="13" width="10" height="20" fill="#ff6b6b" opacity="0.6" rx="2"/>
      <line x1="12" y1="33" x2="8" y2="48" stroke="#ff6b6b" stroke-width="2"/>
      <line x1="18" y1="33" x2="22" y2="48" stroke="#ff6b6b" stroke-width="2"/>
      <text x="15" y="65" text-anchor="middle" fill="#ff6b6b" font-size="10" font-family="monospace">MOVING: DETECTED</text>
    </g>
    
    <!-- Person sitting (not detected) -->
    <g transform="translate(195, 210)">
      <circle cx="10" cy="5" r="8" fill="#555" opacity="0.5"/>
      <rect x="5" y="13" width="14" height="15" fill="#555" opacity="0.4" rx="2"/>
      <line x1="7" y1="28" x2="5" y2="40" stroke="#555" stroke-width="2"/>
      <line x1="15" y1="28" x2="17" y2="40" stroke="#555" stroke-width="2"/>
      <text x="10" y="55" text-anchor="middle" fill="#666" font-size="10" font-family="monospace">STILL: IGNORED</text>
    </g>

    <!-- Features -->
    <g transform="translate(10, 300)">
      <text x="0" y="0" fill="#ff6b6b" font-size="11" font-family="monospace">[x] Detects motion only</text>
      <text x="0" y="20" fill="#ff6b6b" font-size="11" font-family="monospace">[x] False-off when still</text>
      <text x="0" y="40" fill="#ff6b6b" font-size="11" font-family="monospace">[x] Affected by temperature</text>
      <text x="0" y="60" fill="#ff6b6b" font-size="11" font-family="monospace">[x] Requires line-of-sight</text>
      <text x="0" y="80" fill="#4a9" font-size="11" font-family="monospace">[v] Low cost (~$2-5)</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="400" y1="80" x2="400" y2="450" stroke="#2a4060" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- Right side: mmWave -->
  <g transform="translate(420, 80)">
    <text x="150" y="25" text-anchor="middle" fill="#00d4ff" font-size="16" font-family="monospace" font-weight="bold">mmWave Radar (60GHz)</text>
    
    <!-- Radar sensor icon -->
    <circle cx="150" cy="80" r="20" fill="#0a1f3a" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="150" cy="80" r="8" fill="#00d4ff" opacity="0.8"/>
    
    <!-- Detection area (360) -->
    <circle cx="150" cy="180" r="80" fill="url(#radarGrad)" opacity="0.2"/>
    <circle cx="150" cy="180" r="80" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="150" cy="180" r="55" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.4"/>
    <circle cx="150" cy="180" r="30" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.3"/>
    
    <!-- Radar waves -->
    <g transform="translate(150, 80)">
      <path d="M -15 15 Q 0 40 15 15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
      <path d="M -25 15 Q 0 55 25 15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
    </g>
    
    <!-- Person sitting (detected!) -->
    <g transform="translate(135, 170)">
      <circle cx="15" cy="5" r="8" fill="#00d4ff" opacity="0.8" filter="url(#glow)"/>
      <rect x="10" y="13" width="14" height="15" fill="#00d4ff" opacity="0.6" rx="2"/>
      <line x1="12" y1="28" x2="10" y2="40" stroke="#00d4ff" stroke-width="2"/>
      <line x1="20" y1="28" x2="22" y2="40" stroke="#00d4ff" stroke-width="2"/>
      <text x="15" y="55" text-anchor="middle" fill="#00d4ff" font-size="10" font-family="monospace">STILL: DETECTED</text>
    </g>

    <!-- Breathing indicator -->
    <g transform="translate(130, 240)">
      <text x="25" y="0" text-anchor="middle" fill="#00d4ff" font-size="9" font-family="monospace" opacity="0.7">Breathing: 0.5-1.5cm chest movement</text>
      <path d="M 0 10 Q 12 5 25 10 Q 38 15 50 10" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    </g>
    
    <!-- Features -->
    <g transform="translate(10, 300)">
      <text x="0" y="0" fill="#00d4ff" font-size="11" font-family="monospace">[v] Detects presence (breathing)</text>
      <text x="0" y="20" fill="#00d4ff" font-size="11" font-family="monospace">[v] No false-off when still</text>
      <text x="0" y="40" fill="#00d4ff" font-size="11" font-family="monospace">[v] Unaffected by temperature</text>
      <text x="0" y="60" fill="#00d4ff" font-size="11" font-family="monospace">[v] Penetrates plastic/glass</text>
      <text x="0" y="80" fill="#ffcc00" font-size="11" font-family="monospace">[~] Higher cost (~$30-80)</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="465" width="800" height="35" fill="#0d1f3a" opacity="0.8"/>
  <text x="400" y="487" text-anchor="middle" fill="#5a7090" font-size="11" font-family="monospace">NEXLAMP | mmWave Radar + LED Driver Integration | 2026</text>
</svg>