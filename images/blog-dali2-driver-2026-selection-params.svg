<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" rx="16" fill="#1a1a2e"/>
  <text x="340" y="38" text-anchor="middle" fill="#e0e0e0" font-family="sans-serif" font-size="15" font-weight="500">DALI-2 驱动电源选购：四个核心参数</text>

  <!-- 参数1: 认证标识 -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="290" height="130" rx="12" fill="#042C53" stroke="#378ADD" stroke-width="1"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#378ADD"/>
    <text x="35" y="40" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="500">1</text>
    <text x="80" y="35" fill="#85B7EB" font-family="sans-serif" font-size="14" font-weight="500">认证标识</text>
    <text x="80" y="55" fill="#B5D4F4" font-family="sans-serif" font-size="11">必须看到 DALI-2 logo</text>
    <text x="15" y="80" fill="#E6F1FB" font-family="sans-serif" font-size="11">看外壳或规格书有没有 DALI-2 Version-X</text>
    <text x="15" y="98" fill="#E6F1FB" font-family="sans-serif" font-size="11">认证标识。不是"DALI compatible"</text>
    <rect x="15" y="108" width="260" height="14" rx="4" fill="#0C447C"/>
    <text x="145" y="120" text-anchor="middle" fill="#B5D4F4" font-family="sans-serif" font-size="10">⚠ "DALI兼容" ≠ DALI-2认证 — 无标准保障</text>
  </g>

  <!-- 参数2: 调光范围 -->
  <g transform="translate(350, 60)">
    <rect x="0" y="0" width="290" height="130" rx="12" fill="#04342C" stroke="#1D9E75" stroke-width="1"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#1D9E75"/>
    <text x="35" y="40" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="500">2</text>
    <text x="80" y="35" fill="#5DCAA5" font-family="sans-serif" font-size="14" font-weight="500">调光范围</text>
    <text x="80" y="55" fill="#9FE1CB" font-family="sans-serif" font-size="11">DALI-2标准最低0.1%</text>
    <text x="15" y="80" fill="#E1F5EE" font-family="sans-serif" font-size="11">要求供应商提供1%亮度下的</text>
    <text x="15" y="98" fill="#E1F5EE" font-family="sans-serif" font-size="11">调光曲线测试报告</text>
    <rect x="15" y="108" width="260" height="14" rx="4" fill="#085041"/>
    <text x="145" y="120" text-anchor="middle" fill="#9FE1CB" font-family="sans-serif" font-size="10">实测10%以下是否稳如泰山才是硬指标</text>
  </g>

  <!-- 参数3: D4i数据功能 -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="290" height="130" rx="12" fill="#4A1B0C" stroke="#D85A30" stroke-width="1"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#D85A30"/>
    <text x="35" y="40" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="500">3</text>
    <text x="80" y="35" fill="#F0997B" font-family="sans-serif" font-size="14" font-weight="500">D4i 数据功能</text>
    <text x="80" y="55" fill="#F5C4B3" font-family="sans-serif" font-size="11">驱动电源能"说话"</text>
    <text x="15" y="80" fill="#FAECE7" font-family="sans-serif" font-size="11">商用/公共建筑项目必须选D4i</text>
    <text x="15" y="98" fill="#FAECE7" font-family="sans-serif" font-size="11">能耗+故障数据自动上报</text>
    <rect x="15" y="108" width="260" height="14" rx="4" fill="#712B13"/>
    <text x="145" y="120" text-anchor="middle" fill="#F5C4B3" font-family="sans-serif" font-size="10">没有D4i → 需额外装能耗监测系统，成本翻倍</text>
  </g>

  <!-- 参数4: 响应时间 -->
  <g transform="translate(350, 210)">
    <rect x="0" y="0" width="290" height="130" rx="12" fill="#26215C" stroke="#7F77DD" stroke-width="1"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#7F77DD"/>
    <text x="35" y="40" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="500">4</text>
    <text x="80" y="35" fill="#AFA9EC" font-family="sans-serif" font-size="14" font-weight="500">响应时间</text>
    <text x="80" y="55" fill="#CECBF6" font-family="sans-serif" font-size="11">DALI-2标准 ≤50ms</text>
    <text x="15" y="80" fill="#EEEDFE" font-family="sans-serif" font-size="11">低价产品实测延迟可超200ms</text>
    <text x="15" y="98" fill="#EEEDFE" font-family="sans-serif" font-size="11">场景联动体验明显卡顿</text>
    <rect x="15" y="108" width="260" height="14" rx="4" fill="#3C3489"/>
    <text x="145" y="120" text-anchor="middle" fill="#CECBF6" font-family="sans-serif" font-size="10">参数表看 DALI response time 或实测延迟数据</text>
  </g>

  <!-- 底部提示 -->
  <rect x="40" y="350" width="600" height="36" rx="8" fill="#0f3460"/>
  <text x="340" y="372" text-anchor="middle" fill="#85B7EB" font-family="sans-serif" font-size="12" font-weight="500">四个参数全达标 = 可靠的 DALI-2 驱动电源</text>
</svg>