<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid1" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="680" height="420" fill="url(#bg1)"/>
  <rect width="680" height="420" fill="url(#grid1)"/>
  <text x="40" y="52" fill="#e2e8f0" font-size="24" font-weight="bold">灯不亮了？三步自查</text>
  <rect x="40" y="64" width="120" height="4" rx="2" fill="url(#glow1)"/>
  <text x="40" y="88" fill="#94a3b8" font-size="13">五分钟判断灯珠还是驱动坏，别急着换整灯</text>

  <!-- Step 1 -->
  <rect x="40" y="112" width="185" height="130" rx="10" fill="#112542" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="70" cy="142" r="16" fill="#0a1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="70" y="147" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">1</text>
  <text x="96" y="147" fill="#e2e8f0" font-size="15" font-weight="bold">看灯珠</text>
  <text x="56" y="176" fill="#94a3b8" font-size="12">烧坏的灯珠中间有</text>
  <text x="56" y="194" fill="#94a3b8" font-size="12">针尖大的黑点</text>
  <circle cx="180" cy="215" r="7" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
  <circle cx="180" cy="215" r="2.2" fill="#f87171"/>
  <text x="192" y="219" fill="#f87171" font-size="11">黑点=灯珠烧</text>

  <!-- Step 2 -->
  <rect x="248" y="112" width="185" height="130" rx="10" fill="#112542" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="278" cy="142" r="16" fill="#0a1628" stroke="#818cf8" stroke-width="1.5"/>
  <text x="278" y="147" fill="#818cf8" font-size="15" font-weight="bold" text-anchor="middle">2</text>
  <text x="304" y="147" fill="#e2e8f0" font-size="15" font-weight="bold">看驱动闻味道</text>
  <text x="264" y="176" fill="#94a3b8" font-size="12">小盒子鼓包/发黄/</text>
  <text x="264" y="194" fill="#94a3b8" font-size="12">焦糊味/滋滋异响</text>
  <rect x="264" y="205" width="52" height="26" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="290" y="222" fill="#fbbf24" font-size="10" text-anchor="middle">驱动器</text>
  <path d="M 322 218 q 6 -8 12 0 q 6 8 12 0" stroke="#fbbf24" fill="none" stroke-width="1.2"/>
  <text x="352" y="222" fill="#fbbf24" font-size="11">异响</text>

  <!-- Step 3 -->
  <rect x="456" y="112" width="185" height="130" rx="10" fill="#112542" stroke="#34d399" stroke-width="1.2"/>
  <circle cx="486" cy="142" r="16" fill="#0a1628" stroke="#34d399" stroke-width="1.5"/>
  <text x="486" y="147" fill="#34d399" font-size="15" font-weight="bold" text-anchor="middle">3</text>
  <text x="512" y="147" fill="#e2e8f0" font-size="15" font-weight="bold">万用表测输出</text>
  <text x="472" y="176" fill="#94a3b8" font-size="12">测输出直流电压</text>
  <text x="472" y="194" fill="#94a3b8" font-size="12">常见 12V / 24V / 36V</text>
  <text x="472" y="222" fill="#34d399" font-size="12" font-weight="bold">无输出=驱动坏</text>
  <text x="472" y="238" fill="#fbbf24" font-size="11">有输出=查灯珠线路</text>

  <!-- arrows -->
  <path d="M 228 177 L 244 177" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr1)"/>
  <path d="M 436 177 L 452 177" stroke="#818cf8" stroke-width="2" marker-end="url(#arr1)"/>
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- conclusion bar -->
  <rect x="40" y="268" width="601" height="122" rx="10" fill="#0d1f36" stroke="#1e3a5f" stroke-width="1"/>
  <text x="60" y="300" fill="#e2e8f0" font-size="15" font-weight="bold">一句话判断原则</text>
  <text x="60" y="332" fill="#f87171" font-size="14" font-weight="bold">鼓包、焦味、异响 → 驱动</text>
  <text x="60" y="358" fill="#fbbf24" font-size="14" font-weight="bold">灯珠有黑点 → 灯珠（超5颗直接换灯板）</text>
  <text x="60" y="384" fill="#34d399" font-size="14" font-weight="bold">两者都完好 → 查接线端子和墙面开关</text>
</svg>
