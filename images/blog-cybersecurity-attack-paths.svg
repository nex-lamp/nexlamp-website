<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e0e8f0" font-family="monospace" font-size="18" font-weight="bold">
    SMART LIGHTING ATTACK PATHS
  </text>
  <text x="400" y="62" text-anchor="middle" fill="#5a8ab0" font-family="monospace" font-size="11">
    // 2026 CVE Attack Surface Analysis
  </text>

  <!-- Attacker node (left) -->
  <g transform="translate(50, 220)">
    <circle cx="40" cy="40" r="35" fill="#ff3333" opacity="0.15" filter="url(#blur)"/>
    <circle cx="40" cy="40" r="28" fill="#0d1f3a" stroke="#ff4444" stroke-width="2"/>
    <!-- Skull icon -->
    <text x="40" y="48" text-anchor="middle" fill="#ff4444" font-size="20" font-family="monospace">&#9760;</text>
    <text x="40" y="90" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="10" font-weight="bold">ATTACKER</text>
  </g>

  <!-- Arrow lines from attacker to paths -->
  <g stroke="#ff4444" stroke-width="1.5" stroke-dasharray="5,3" fill="none" opacity="0.6">
    <path d="M 128,240 Q 180,140 240,120"/>
    <path d="M 128,250 Q 180,250 240,250"/>
    <path d="M 128,260 Q 180,350 240,380"/>
    <path d="M 128,270 Q 180,420 240,445"/>
  </g>

  <!-- Path 1: Protocol Sniffing -->
  <g transform="translate(250, 90)">
    <rect width="250" height="65" rx="8" fill="#0d1f3a" stroke="#ff8800" stroke-width="1.5"/>
    <rect width="250" height="65" rx="8" fill="url(#glowOrange)"/>
    <text x="125" y="22" text-anchor="middle" fill="#ff8800" font-family="monospace" font-size="12" font-weight="bold">1. PROTOCOL SNIFFING</text>
    <text x="125" y="38" text-anchor="middle" fill="#a0b8d0" font-family="monospace" font-size="9">Bluetooth cleartext config</text>
    <text x="125" y="52" text-anchor="middle" fill="#6088a0" font-family="monospace" font-size="8">CVE-2026-34126 | CVSS 7.3</text>
  </g>

  <!-- Path 2: Auth Bypass -->
  <g transform="translate(250, 220)">
    <rect width="250" height="65" rx="8" fill="#0d1f3a" stroke="#ff4444" stroke-width="1.5"/>
    <rect width="250" height="65" rx="8" fill="url(#glowRed)"/>
    <text x="125" y="22" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="12" font-weight="bold">2. AUTH BYPASS</text>
    <text x="125" y="38" text-anchor="middle" fill="#a0b8d0" font-family="monospace" font-size="9">Static nonce in SRP protocol</text>
    <text x="125" y="52" text-anchor="middle" fill="#6088a0" font-family="monospace" font-size="8">CVE-2026-3559 | CVSS 9.8</text>
  </g>

  <!-- Path 3: Botnet Hijack -->
  <g transform="translate(250, 350)">
    <rect width="250" height="65" rx="8" fill="#0d1f3a" stroke="#ffcc00" stroke-width="1.5"/>
    <rect width="250" height="65" rx="8" fill="url(#glowYellow)"/>
    <text x="125" y="22" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="12" font-weight="bold">3. BOTNET HIJACK</text>
    <text x="125" y="38" text-anchor="middle" fill="#a0b8d0" font-family="monospace" font-size="9">Default pwd &#8594; mass control</text>
    <text x="125" y="52" text-anchor="middle" fill="#6088a0" font-family="monospace" font-size="8">DDoS &#8594; Network paralysis</text>
  </g>

  <!-- Path 4: Privacy Leak -->
  <g transform="translate(250, 415)">
    <rect width="250" height="65" rx="8" fill="#0d1f3a" stroke="#00ff88" stroke-width="1.5"/>
    <rect width="250" height="65" rx="8" fill="url(#glowGreen)"/>
    <text x="125" y="22" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="12" font-weight="bold">4. PRIVACY LEAK</text>
    <text x="125" y="38" text-anchor="middle" fill="#a0b8d0" font-family="monospace" font-size="9">Schedule data &#8594; theft target</text>
    <text x="125" y="52" text-anchor="middle" fill="#6088a0" font-family="monospace" font-size="8">Plaintext storage exposure</text>
  </g>

  <!-- Arrows to target (smart home) -->
  <g stroke="#ff4444" stroke-width="1.5" stroke-dasharray="5,3" fill="none" opacity="0.4">
    <path d="M 500,122 Q 560,180 620,220"/>
    <path d="M 500,252 Q 560,250 620,250"/>
    <path d="M 500,382 Q 560,330 620,290"/>
  </g>

  <!-- Smart Home (right) -->
  <g transform="translate(620, 180)">
    <rect x="0" y="0" width="130" height="140" rx="8" fill="#0d1f3a" stroke="#3a6090" stroke-width="2"/>
    <!-- House icon -->
    <path d="M 25,55 L 65,25 L 105,55 L 105,105 L 25,105 Z" fill="none" stroke="#5a8ab0" stroke-width="2"/>
    <rect x="50" y="75" width="30" height="30" fill="none" stroke="#5a8ab0" stroke-width="1.5"/>
    <!-- Light bulb icon inside -->
    <circle cx="65" cy="50" r="8" fill="#ffcc00" opacity="0.6"/>
    <text x="65" y="130" text-anchor="middle" fill="#5a8ab0" font-family="monospace" font-size="9" font-weight="bold">SMART HOME</text>
  </g>

  <!-- Bottom status bar -->
  <rect x="0" y="490" width="800" height="10" fill="#0a1628"/>
  <text x="400" y="498" text-anchor="middle" fill="#3a5070" font-family="monospace" font-size="7">
    SOURCE: CVE-2026-34126 / CVE-2026-3559 / ZDI-26-157 | NEXLAMP SECURITY ANALYSIS
  </text>
</svg>
