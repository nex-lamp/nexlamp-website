<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%">
  <title>情绪照明三要素</title>
  <desc>情绪照明需要全彩光能力、人因光能力、场景联动能力三个支撑</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d4d" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="420" fill="#0a1628"/>
  <rect width="680" height="420" fill="url(#grid)"/>
  <text x="340" y="48" text-anchor="middle" fill="#e8f4ff" font-size="20" font-family="Microsoft YaHei, sans-serif" font-weight="500">情绪照明的三个技术底座</text>
  <text x="340" y="78" text-anchor="middle" fill="#7a9cc6" font-size="13" font-family="Microsoft YaHei, sans-serif">不是换颜色那么简单，而是光随境变的系统能力</text>
  <g transform="translate(60, 120)">
    <circle cx="80" cy="80" r="70" fill="#0f1f3a" stroke="#2478C2" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="80" cy="80" r="54" fill="none" stroke="#2478C2" stroke-width="0.5" opacity="0.4"/>
    <text x="80" y="65" text-anchor="middle" fill="#e8f4ff" font-size="15" font-family="Microsoft YaHei, sans-serif" font-weight="500">全彩光能力</text>
    <text x="80" y="90" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">多通道宽光谱</text>
    <text x="80" y="108" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">高饱和度色彩</text>
  </g>
  <g transform="translate(260, 120)">
    <circle cx="80" cy="80" r="70" fill="#0f1f3a" stroke="#7ec27e" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="80" cy="80" r="54" fill="none" stroke="#7ec27e" stroke-width="0.5" opacity="0.4"/>
    <text x="80" y="65" text-anchor="middle" fill="#e8f4ff" font-size="15" font-family="Microsoft YaHei, sans-serif" font-weight="500">人因光能力</text>
    <text x="80" y="90" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">随昼夜节律调光</text>
    <text x="80" y="108" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">主动健康光环境</text>
  </g>
  <g transform="translate(460, 120)">
    <circle cx="80" cy="80" r="70" fill="#0f1f3a" stroke="#e89f27" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="80" cy="80" r="54" fill="none" stroke="#e89f27" stroke-width="0.5" opacity="0.4"/>
    <text x="80" y="65" text-anchor="middle" fill="#e8f4ff" font-size="15" font-family="Microsoft YaHei, sans-serif" font-weight="500">场景联动能力</text>
    <text x="80" y="90" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">传感器+中控联动</text>
    <text x="80" y="108" text-anchor="middle" fill="#7a9cc6" font-size="11" font-family="Microsoft YaHei, sans-serif">自动切换光环境</text>
  </g>
  <g stroke="#1a3a5c" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 160 200 L 260 200" marker-end="url(#arrow)"/>
    <path d="M 360 200 L 460 200" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2478C2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g transform="translate(90, 300)">
    <rect x="0" y="0" width="500" height="80" rx="10" fill="#0d1c33" stroke="#1a3a5c" stroke-width="0.5"/>
    <text x="250" y="32" text-anchor="middle" fill="#e8f4ff" font-size="14" font-family="Microsoft YaHei, sans-serif" font-weight="500">共同目标：让光理解人的状态，主动营造情绪氛围</text>
    <text x="250" y="58" text-anchor="middle" fill="#7a9cc6" font-size="12" font-family="Microsoft YaHei, sans-serif">驱动电源的通道数、调光精度、协议兼容性是落地关键</text>
  </g>
</svg>