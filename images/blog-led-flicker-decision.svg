<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2744" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1f3d"/>
    </linearGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="680" height="520" fill="url(#bgGrad3)"/>
  <rect width="680" height="520" fill="url(#grid3)"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" fill="#3a9aef" font-size="14" font-family="monospace" font-weight="bold">无频闪智能灯选购决策流程</text>
  <line x1="40" y1="40" x2="640" y2="40" stroke="#1a2744" stroke-width="1"/>

  <!-- Start node -->
  <rect x="250" y="55" width="180" height="36" rx="18" fill="#1a3050" stroke="#3a9aef" stroke-width="1.5"/>
  <text x="340" y="78" text-anchor="middle" fill="#8ac0ff" font-size="11" font-family="monospace" font-weight="bold">选购智能灯</text>
  <line x1="340" y1="91" x2="340" y2="110" stroke="#3a6abf" stroke-width="1.5"/>

  <!-- Q1: 3C认证 -->
  <polygon points="340,110 440,145 340,180 240,145" fill="#0d1a30" stroke="#2a4a7a" stroke-width="1"/>
  <text x="340" y="148" text-anchor="middle" fill="#6aafff" font-size="10" font-family="monospace">有3C认证?</text>
  <text x="340" y="162" text-anchor="middle" fill="#5a8aaf" font-size="8" font-family="monospace">[强制安全认证]</text>

  <!-- Q1 No -->
  <line x1="240" y1="145" x2="140" y2="145" stroke="#ff4466" stroke-width="1.5"/>
  <text x="185" y="140" fill="#ff4466" font-size="8" font-family="monospace">否</text>
  <rect x="50" y="128" width="90" height="33" rx="16" fill="#1a1020" stroke="#ff4466" stroke-width="1"/>
  <text x="95" y="150" text-anchor="middle" fill="#ff6688" font-size="10" font-family="monospace">❌ 淘汰</text>

  <!-- Q1 Yes -->
  <line x1="340" y1="180" x2="340" y2="210" stroke="#44cc88" stroke-width="1.5"/>
  <text x="355" y="198" fill="#44cc88" font-size="8" font-family="monospace">是</text>

  <!-- Q2: 频闪检测 -->
  <polygon points="340,210 450,250 340,290 230,250" fill="#0d1a30" stroke="#2a4a7a" stroke-width="1"/>
  <text x="340" y="248" text-anchor="middle" fill="#6aafff" font-size="10" font-family="monospace">手机检测有频闪?</text>
  <text x="340" y="262" text-anchor="middle" fill="#5a8aaf" font-size="8" font-family="monospace">[快门1/1000s]</text>

  <!-- Q2 Yes - has flicker -->
  <line x1="450" y1="250" x2="540" y2="250" stroke="#ffaa44" stroke-width="1.5"/>
  <text x="498" y="245" fill="#ffaa44" font-size="8" font-family="monospace">有</text>
  <rect x="540" y="232" width="120" height="36" rx="6" fill="#1a1520" stroke="#ffaa44" stroke-width="1"/>
  <text x="600" y="253" text-anchor="middle" fill="#ffaa44" font-size="10" font-family="monospace">⚠ 低风险场景使用</text>

  <!-- Q2 No - no flicker -->
  <line x1="340" y1="290" x2="340" y2="320" stroke="#44cc88" stroke-width="1.5"/>
  <text x="355" y="308" fill="#44cc88" font-size="8" font-family="monospace">无</text>

  <!-- Q3: RA -->
  <polygon points="340,320 450,360 340,400 230,360" fill="#0d1a30" stroke="#2a4a7a" stroke-width="1"/>
  <text x="340" y="358" text-anchor="middle" fill="#6aafff" font-size="10" font-family="monospace">RA≥90 显色指数?</text>
  <text x="340" y="372" text-anchor="middle" fill="#5a8aaf" font-size="8" font-family="monospace">[色彩还原度]</text>

  <!-- Q3 No -->
  <line x1="230" y1="360" x2="140" y2="360" stroke="#ffaa44" stroke-width="1.5"/>
  <text x="180" y="355" fill="#ffaa44" font-size="8" font-family="monospace">否</text>
  <rect x="50" y="342" width="90" height="36" rx="6" fill="#1a1520" stroke="#ffaa44" stroke-width="1"/>
  <text x="95" y="364" text-anchor="middle" fill="#ffaa44" font-size="10" font-family="monospace">⚠ 非居住区</text>

  <!-- Q3 Yes -->
  <line x1="340" y1="400" x2="340" y2="430" stroke="#44cc88" stroke-width="1.5"/>
  <text x="355" y="418" fill="#44cc88" font-size="8" font-family="monospace">是</text>

  <!-- Q4: 全光谱 -->
  <polygon points="340,430 450,470 340,510 230,470" fill="#0d1a30" stroke="#2a4a7a" stroke-width="1"/>
  <text x="340" y="468" text-anchor="middle" fill="#6aafff" font-size="10" font-family="monospace">全光谱(蓝光抑制)?</text>
  <text x="340" y="482" text-anchor="middle" fill="#5a8aaf" font-size="8" font-family="monospace">[儿童房/书房优先]</text>

  <!-- Q4 No -->
  <line x1="230" y1="470" x2="140" y2="470" stroke="#66cc99" stroke-width="1.5"/>
  <text x="180" y="465" fill="#66cc99" font-size="8" font-family="monospace">否</text>
  <rect x="40" y="452" width="100" height="36" rx="6" fill="#101520" stroke="#66cc99" stroke-width="1"/>
  <text x="90" y="474" text-anchor="middle" fill="#66cc99" font-size="10" font-family="monospace">✅ 客厅/卧室</text>

  <!-- Q4 Yes -->
  <line x1="340" y1="510" x2="340" y2="540" stroke="#44cc88" stroke-width="1.5"/>
  <text x="355" y="528" fill="#44cc88" font-size="8" font-family="monospace">是</text>

  <!-- Final: Best choice -->
  <rect x="230" y="540" width="220" height="36" rx="18" fill="#0a2030" stroke="#44cc88" stroke-width="1.5" filter="url(#glow3)"/>
  <text x="340" y="563" text-anchor="middle" fill="#44cc88" font-size="11" font-family="monospace" font-weight="bold">✅ 最佳健康光环境</text>
</svg>