<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <defs>
    <linearGradient id="bgTl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="rowTl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101f38"/>
      <stop offset="1" stop-color="#132542"/>
    </linearGradient>
    <filter id="glowTl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="500" fill="url(#bgTl)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/><line x1="0" y1="480" x2="680" y2="480"/>
    <line x1="85" y1="0" x2="85" y2="500"/><line x1="170" y1="0" x2="170" y2="500"/>
    <line x1="255" y1="0" x2="255" y2="500"/><line x1="340" y1="0" x2="340" y2="500"/>
    <line x1="425" y1="0" x2="425" y2="500"/><line x1="510" y1="0" x2="510" y2="500"/>
    <line x1="595" y1="0" x2="595" y2="500"/>
  </g>

  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="23" font-weight="bold" filter="url(#glowTl)">2026 双 11 与国补时间线</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>
  <text x="34" y="80" fill="#9db8d9" font-family="sans-serif" font-size="12.5">哪笔钱能等，哪笔钱不能等 —— 先看日历</text>

  <line x1="60" y1="102" x2="60" y2="336" stroke="#3d5a80" stroke-width="2"/>

  <circle cx="60" cy="126" r="7" fill="#7ec27e" filter="url(#glowTl)"/>
  <rect x="80" y="102" width="566" height="48" rx="8" fill="#122a1e" stroke="#7ec27e" stroke-width="1.2"/>
  <text x="96" y="132" fill="#7ec27e" font-family="sans-serif" font-size="14" font-weight="bold">10.12 20:00</text>
  <text x="216" y="132" fill="#e8f4e8" font-family="sans-serif" font-size="13">京东现货开卖（不用等预售，直接下单）</text>

  <circle cx="60" cy="186" r="6" fill="#5cc8e8"/>
  <rect x="80" y="162" width="566" height="48" rx="8" fill="url(#rowTl)" stroke="#5cc8e8" stroke-width="1"/>
  <text x="96" y="192" fill="#5cc8e8" font-family="sans-serif" font-size="14" font-weight="bold">10.15 20:00</text>
  <text x="216" y="192" fill="#c8d8ea" font-family="sans-serif" font-size="13">天猫预售开启，定金交到 10.20 17:59</text>

  <circle cx="60" cy="246" r="6" fill="#5cc8e8"/>
  <rect x="80" y="222" width="566" height="48" rx="8" fill="url(#rowTl)" stroke="#3d5a80" stroke-width="1"/>
  <text x="96" y="252" fill="#5cc8e8" font-family="sans-serif" font-size="14" font-weight="bold">10.20 20:00</text>
  <text x="216" y="252" fill="#c8d8ea" font-family="sans-serif" font-size="13">尾款开付，到 10.25 结束</text>

  <circle cx="60" cy="306" r="6" fill="#e0a24a"/>
  <rect x="80" y="282" width="566" height="48" rx="8" fill="#2a1f10" stroke="#e0a24a" stroke-width="1"/>
  <text x="96" y="312" fill="#e0a24a" font-family="sans-serif" font-size="14" font-weight="bold">12.31</text>
  <text x="216" y="312" fill="#e8e0c8" font-family="sans-serif" font-size="13">国补政策执行截止，全年额度用完即止</text>

  <rect x="34" y="348" width="612" height="88" rx="8" fill="#152a4a" stroke="#7ec27e" stroke-width="1.2"/>
  <text x="52" y="372" fill="#7ec27e" font-family="sans-serif" font-size="13" font-weight="bold">国补口径（2026 年消费品以旧换新）</text>
  <text x="52" y="394" fill="#e8f4e8" font-family="sans-serif" font-size="12">第四批 625 亿元已下达 ｜ 全年 2500 亿元到位</text>
  <text x="52" y="414" fill="#c8d8ea" font-family="sans-serif" font-size="12">家电按实付价 15% 立减，单件封顶 1500 元；数码封顶 500 元</text>
  <text x="52" y="430" fill="#9db8d9" font-family="sans-serif" font-size="11">品类由地方自主确定，智能家居今年首次进入框架</text>

  <rect x="34" y="448" width="612" height="44" rx="8" fill="#2a1420" stroke="#e06666" stroke-width="1.2"/>
  <text x="52" y="476" fill="#e06666" font-family="sans-serif" font-size="12.5" font-weight="bold">提醒：设备能等，墙里的钱不能等 —— 零火线、预埋回路是硬装阶段的事</text>
</svg>
