<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d4a" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="zg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="mg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0a1628"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#00d4ff" filter="url(#glow)" font-weight="bold">智能灯协议对比 — Zigbee vs Matter vs 蓝牙 Mesh</text>
  <line x1="50" y1="58" x2="750" y2="58" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Column Headers -->
  <text x="150" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="url(#zg)" filter="url(#glow)" font-weight="bold">Zigbee</text>
  <text x="400" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="url(#mg)" filter="url(#glow)" font-weight="bold">Matter</text>
  <text x="650" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="url(#bg)" filter="url(#glow)" font-weight="bold">蓝牙 Mesh</text>

  <line x1="50" y1="100" x2="750" y2="100" stroke="#1a2d4a" stroke-width="1"/>

  <!-- Row: 稳定性 -->
  <text x="30" y="135" font-family="Consolas, monospace" font-size="13" fill="#8899aa">稳定性</text>
  <text x="150" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#00d4ff" filter="url(#glow)">★★★★★</text>
  <text x="400" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#a855f7" filter="url(#glow)">★★★★☆</text>
  <text x="650" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#22d3ee">★★★☆☆</text>
  <line x1="50" y1="150" x2="750" y2="150" stroke="#1a2d4a" stroke-width="0.5"/>

  <!-- Row: 生态兼容 -->
  <text x="30" y="180" font-family="Consolas, monospace" font-size="13" fill="#8899aa">生态兼容</text>
  <text x="150" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#00d4ff" filter="url(#glow)">★★★★★</text>
  <text x="400" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#a855f7" filter="url(#glow)">★★★★☆</text>
  <text x="650" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#22d3ee">★★☆☆☆</text>
  <line x1="50" y1="195" x2="750" y2="195" stroke="#1a2d4a" stroke-width="0.5"/>

  <!-- Row: 延迟 -->
  <text x="30" y="225" font-family="Consolas, monospace" font-size="13" fill="#8899aa">响应延迟</text>
  <text x="150" y="225" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#00d4ff" filter="url(#glow)">50-200ms</text>
  <text x="400" y="225" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#a855f7" filter="url(#glow)">30-150ms</text>
  <text x="650" y="225" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#22d3ee">100-500ms</text>
  <line x1="50" y1="240" x2="750" y2="240" stroke="#1a2d4a" stroke-width="0.5"/>

  <!-- Row: 设备上限 -->
  <text x="30" y="270" font-family="Consolas, monospace" font-size="13" fill="#8899aa">设备上限</text>
  <text x="150" y="270" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#00d4ff" filter="url(#glow)">200+</text>
  <text x="400" y="270" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#a855f7" filter="url(#glow)">250+</text>
  <text x="650" y="270" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#22d3ee">~50</text>
  <line x1="50" y1="285" x2="750" y2="285" stroke="#1a2d4a" stroke-width="0.5"/>

  <!-- Row: 成本 -->
  <text x="30" y="315" font-family="Consolas, monospace" font-size="13" fill="#8899aa">单灯成本</text>
  <text x="150" y="315" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#00d4ff" filter="url(#glow)">25-35元</text>
  <text x="400" y="315" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#a855f7" filter="url(#glow)">50-80元</text>
  <text x="650" y="315" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#22d3ee">15-25元</text>
  <line x1="50" y1="330" x2="750" y2="330" stroke="#1a2d4a" stroke-width="0.5"/>

  <!-- Bottom: recommendation bar -->
  <rect x="100" y="360" width="200" height="55" rx="8" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="200" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#00d4ff" filter="url(#glow)">✓ 推荐场景</text>
  <text x="200" y="405" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#4ad4ff">毛坯装修 · 全屋智能 · 工程</text>

  <rect x="350" y="360" width="200" height="55" rx="8" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
  <text x="450" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#a855f7" filter="url(#glow)">→ 未来之选</text>
  <text x="450" y="405" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#c084fc">Apple生态 · 跨平台需求</text>

  <rect x="600" y="360" width="150" height="55" rx="8" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.5"/>
  <text x="675" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#22d3ee">⚠ 小户型</text>
  <text x="675" y="405" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5eead4">＜20设备 · 预算有限</text>

  <!-- Footer -->
  <line x1="50" y1="440" x2="750" y2="440" stroke="#1a2d4a" stroke-width="0.5"/>
  <text x="400" y="465" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334466">nexLAMP.com | 协议对比 · 2026</text>

  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="750" cy="50" r="2" fill="#a855f7" opacity="0.5"/>
  <circle cx="50" cy="450" r="2" fill="#22d3ee" opacity="0.5"/>
  <circle cx="750" cy="450" r="2" fill="#00d4ff" opacity="0.5"/>
</svg>