<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="50" x2="200" y2="450"/>
    <line x1="400" y1="50" x2="400" y2="450"/>
    <line x1="600" y1="50" x2="600" y2="450"/>
  </g>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#5bcefa" font-size="16" font-family="Consolas,monospace" filter="url(#glow)">光源光谱分布对比 | 传统LED vs 全光谱LED vs 自然太阳光</text>

  <!-- Chart area -->
  <g transform="translate(60,60)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="360" stroke="#2a4a6a" stroke-width="1"/>
    <line x1="0" y1="360" x2="680" y2="360" stroke="#2a4a6a" stroke-width="1"/>

    <!-- X-axis: wavelength labels -->
    <text x="136" y="380" fill="#5a7a9a" font-size="10" font-family="Consolas,monospace" text-anchor="middle">400nm</text>
    <text x="272" y="380" fill="#5a7a9a" font-size="10" font-family="Consolas,monospace" text-anchor="middle">500nm</text>
    <text x="408" y="380" fill="#5a7a9a" font-size="10" font-family="Consolas,monospace" text-anchor="middle">600nm</text>
    <text x="544" y="380" fill="#5a7a9a" font-size="10" font-family="Consolas,monospace" text-anchor="middle">700nm</text>
    <text x="680" y="380" fill="#5a7a9a" font-size="10" font-family="Consolas,monospace" text-anchor="middle">800nm</text>

    <!-- Y-axis: label -->
    <text x="-8" y="365" fill="#5a7a9a" font-size="9" font-family="Consolas,monospace">0</text>

    <!-- Zone labels -->
    <text x="80" y="20" fill="#3a6a9a" font-size="8" font-family="Consolas,monospace" text-anchor="middle">紫</text>
    <text x="240" y="20" fill="#3a6a9a" font-size="8" font-family="Consolas,monospace" text-anchor="middle">蓝/青</text>
    <text x="380" y="20" fill="#3a6a9a" font-size="8" font-family="Consolas,monospace" text-anchor="middle">绿/黄</text>
    <text x="520" y="20" fill="#3a6a9a" font-size="8" font-family="Consolas,monospace" text-anchor="middle">橙</text>
    <text x="640" y="20" fill="#3a6a9a" font-size="8" font-family="Consolas,monospace" text-anchor="middle">红/深红</text>

    <!-- Traditional LED spectrum - sharp blue peak -->
    <polyline fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.7"
      points="20,330 60,310 100,200 120,60 136,20 152,60 170,200 200,280 240,300 280,320 340,330 400,340 480,345 560,348 620,350 680,352"/>
    <text x="136" y="10" fill="#ff6b6b" font-size="9" font-family="Consolas,monospace" text-anchor="middle">传统LED (蓝光峰尖锐)</text>

    <!-- Full Spectrum LED - smoother -->
    <polyline fill="none" stroke="#5bcefa" stroke-width="2.5" filter="url(#glow)"
      points="20,280 60,240 100,180 136,120 152,90 170,80 200,100 240,140 280,170 340,200 400,220 480,240 560,250 620,260 680,265"/>
    <text x="340" y="70" fill="#5bcefa" font-size="9" font-family="Consolas,monospace" text-anchor="middle" filter="url(#glow)">全光谱LED (蓝光削平, 光谱连续)</text>

    <!-- Natural Sunlight - ideal reference -->
    <polyline fill="none" stroke="#7ec27e" stroke-width="2" opacity="0.6"
      points="20,260 60,220 100,170 136,130 152,120 170,115 200,130 240,155 280,175 340,200 400,215 480,230 560,240 620,248 680,255"/>
    <text x="680" y="255" fill="#7ec27e" font-size="9" font-family="Consolas,monospace" text-anchor="end">太阳光 (参考)</text>

    <!-- 450nm blue peak marker -->
    <line x1="136" y1="360" x2="136" y2="370" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="136" y="395" fill="#ff6b6b" font-size="8" font-family="Consolas,monospace" text-anchor="middle">450nm蓝光峰</text>
  </g>

  <!-- Bottom note -->
  <text x="400" y="480" fill="#5a7a9a" font-size="9" font-family="Consolas,monospace" text-anchor="middle">全光谱通过多色荧光粉削平蓝光峰，使光谱更接近自然光连续分布</text>
</svg>