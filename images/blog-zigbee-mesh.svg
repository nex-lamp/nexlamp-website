<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="g1"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="coord"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#0a1628"/></radialGradient>
  </defs>
  <rect width="680" height="420" fill="#0a1628"/>
  <!-- Grid -->
  <g stroke="#162240" stroke-width="0.5">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/><line x1="340" y1="0" x2="340" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/><line x1="580" y1="0" x2="580" y2="420"/>
  </g>
  <text x="40" y="40" fill="#00d4ff" font-family="monospace" font-size="16" filter="url(#g2)">┌─ Zigbee Mesh 网络拓扑与故障示意图 ───────────────────────┐</text>
  <text x="40" y="410" fill="#00d4ff" font-family="monospace" font-size="14" filter="url(#g2)">└─ nexLAMP.com ───────────────────────────────────────────────────┘</text>
  <!-- Coordinator -->
  <circle cx="100" cy="240" r="24" fill="url(#coord)" filter="url(#g1)"/>
  <text x="100" y="236" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">网关</text>
  <text x="100" y="248" fill="#fff" font-family="monospace" font-size="7" text-anchor="middle">Coordinator</text>
  <text x="100" y="278" fill="#5a7a9a" font-family="monospace" font-size="9" text-anchor="middle">LQI: 255</text>
  <!-- Router 1 (good) -->
  <circle cx="260" cy="200" r="20" fill="#00e676" opacity="0.7" filter="url(#g2)"/>
  <text x="260" y="196" fill="#0a1628" font-family="monospace" font-size="8" text-anchor="middle">路由1</text>
  <text x="260" y="208" fill="#0a1628" font-family="monospace" font-size="7" text-anchor="middle">开关</text>
  <text x="260" y="228" fill="#00e676" font-family="monospace" font-size="9" text-anchor="middle">LQI: 180</text>
  <!-- Router 2 (good) -->
  <circle cx="400" cy="160" r="20" fill="#00e676" opacity="0.7" filter="url(#g2)"/>
  <text x="400" y="156" fill="#0a1628" font-family="monospace" font-size="8" text-anchor="middle">路由2</text>
  <text x="400" y="168" fill="#0a1628" font-family="monospace" font-size="7" text-anchor="middle">插座</text>
  <text x="400" y="188" fill="#00e676" font-family="monospace" font-size="9" text-anchor="middle">LQI: 165</text>
  <!-- Problem device -->
  <circle cx="560" cy="280" r="20" fill="#ff5252" opacity="0.7" filter="url(#g2)"/>
  <text x="560" y="276" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">终端1</text>
  <text x="560" y="288" fill="#fff" font-family="monospace" font-size="7" text-anchor="middle">筒灯</text>
  <text x="560" y="308" fill="#ff5252" font-family="monospace" font-size="9" text-anchor="middle">LQI: 18 ✕</text>
  <!-- Connection lines -->
  <line x1="120" y1="230" x2="242" y2="206" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="250" x2="248" y2="212" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="240" y1="210" x2="540" y2="272" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="350" y="248" fill="#ff5252" font-family="monospace" font-size="9">距离太远，LQI过低</text>
  <!-- WiFi interference zone -->
  <rect x="420" y="340" width="200" height="50" rx="6" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="1"/>
  <text x="520" y="360" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle">⚠ WiFi 干扰区</text>
  <text x="520" y="378" fill="#ff8a65" font-family="monospace" font-size="8" text-anchor="middle">CH 6 与 ZB 16-19 重叠</text>
  <!-- Legend -->
  <rect x="40" y="320" width="12" height="12" rx="2" fill="#00e676" opacity="0.7"/>
  <text x="58" y="330" fill="#5a7a9a" font-family="monospace" font-size="10">路由节点（正常）</text>
  <rect x="40" y="340" width="12" height="12" rx="2" fill="#ff5252" opacity="0.7"/>
  <text x="58" y="350" fill="#5a7a9a" font-family="monospace" font-size="10">终端设备（失联）</text>
  <line x1="40" y1="365" x2="60" y2="365" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="66" y="370" fill="#5a7a9a" font-family="monospace" font-size="10">断连链路</text>
</svg>