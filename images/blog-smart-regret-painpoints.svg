    <text x="115" y="358" fill="#a89bff" font-size="20" font-weight="bold">03 生态绑架</text>
    <text x="115" y="385" fill="#c8dcf5" font-size="14">换牌子=全屋重来，联动凑不齐</text>
    <text x="115" y="408" fill="#5a8fd0" font-size="13">root_cause: closed_protocol</text>
  </g>
  <g>
    <rect x="460" y="325" width="345" height="100" rx="8" fill="#0f2647" stroke="#ff6b81" stroke-width="1.2" opacity="0.9"/>
    <text x="480" y="358" fill="#ff8fa0" font-size="20" font-weight="bold">04 莫名自亮/频闪</text>
    <text x="480" y="385" fill="#c8dcf5" font-size="14">半夜自亮查无因，深调光眼发胀</text>
    <text x="480" y="408" fill="#5a8fd0" font-size="13">root_cause: cheap_driver</text>
  </g>
  <!-- bottom conclusion bar -->
  <rect x="95" y="455" width="710" height="76" rx="8" fill="#00e5ff" opacity="0.08"/>
  <rect x="95" y="455" width="710" height="76" rx="8" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
  <text x="450" y="487" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">结论：锅不在"智能"本身，而在方案选错了</text>
