<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a1e3a"/>
    </linearGradient>
    <linearGradient id="lightningGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8f8"/>
      <stop offset="60%" stop-color="#3a9fd8"/>
      <stop offset="100%" stop-color="#1a6fba"/>
    </linearGradient>
    <linearGradient id="surgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc2222"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#7ec8f8" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <!-- Thunder cloud -->
  <ellipse cx="160" cy="80" rx="90" ry="50" fill="#1a2a4a" opacity="0.8"/>
  <ellipse cx="120" cy="70" rx="60" ry="40" fill="#1a2a4a" opacity="0.9"/>
  <ellipse cx="200" cy="75" rx="70" ry="35" fill="#1a2a4a" opacity="0.85"/>
  <!-- Lightning bolt -->
  <path d="M160 110 L140 180 L170 175 L145 260" stroke="url(#lightningGrad)" stroke-width="4" fill="none" filter="url(#glow)" opacity="0.9"/>
  <path d="M160 110 L140 180 L170 175 L145 260" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Ground impact circle -->
  <circle cx="145" cy="260" r="20" fill="#7ec8f8" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="145" cy="260" r="8" fill="#7ec8f8" opacity="0.3"/>
  <!-- Power line -->
  <line x1="145" y1="260" x2="400" y2="260" stroke="#666" stroke-width="2"/>
  <text x="260" y="250" fill="#7ec8f8" font-size="10" font-family="Arial" text-anchor="middle" opacity="0.7">220V AC</text>
  <!-- Surge wave on power line -->
  <path d="M145 260 C180 240, 220 280, 260 260 C300 240, 340 280, 380 260 L400 260" stroke="url(#surgeGrad)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <!-- LED driver box -->
  <rect x="400" y="180" rx="8" ry="8" width="120" height="80" fill="#1a2a4a" stroke="#7ec8f8" stroke-width="1.5" opacity="0.9"/>
  <text x="460" y="215" fill="#7ec8f8" font-size="12" font-family="Arial" text-anchor="middle" font-weight="bold">LED</text>
  <text x="460" y="232" fill="#7ec8f8" font-size="10" font-family="Arial" text-anchor="middle">DRIVER</text>
  <!-- MOV inside driver -->
  <circle cx="430" cy="250" r="8" fill="#ff6b6b" opacity="0.5" stroke="#ff4444" stroke-width="1"/>
  <text x="430" y="253" fill="#ff4444" font-size="7" font-family="Arial" text-anchor="middle">MOV</text>
  <!-- GDT inside driver -->
  <rect x="458" y="243" rx="3" ry="3" width="16" height="14" fill="#3a9fd8" opacity="0.5" stroke="#7ec8f8" stroke-width="1"/>
  <text x="466" y="254" fill="#7ec8f8" font-size="7" font-family="Arial" text-anchor="middle">GDT</text>
  <!-- Damaged path arrow (surge reaching driver) -->
  <line x1="380" y1="260" x2="400" y2="230" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <path d="M400 230 L395 235 M400 230 L405 235" stroke="#ff4444" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Signal line -->
  <line x1="520" y1="220" x2="650" y2="220" stroke="#5b8c5a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="580" y="213" fill="#5b8c5a" font-size="9" font-family="Arial" text-anchor="middle" opacity="0.8">Zigbee/DALI</text>
  <!-- Smart light -->
  <rect x="650" y="180" rx="6" ry="6" width="80" height="60" fill="#1a2a4a" stroke="#5b8c5a" stroke-width="1.5" opacity="0.9"/>
  <circle cx="690" cy="200" r="10" fill="#5b8c5a" opacity="0.3"/>
  <circle cx="690" cy="200" r="5" fill="#ffffff" opacity="0.5"/>
  <text x="690" y="225" fill="#ffffff" font-size="9" font-family="Arial" text-anchor="middle">SMART</text>
  <text x="690" y="235" fill="#ffffff" font-size="9" font-family="Arial" text-anchor="middle">LIGHT</text>
  <!-- Surge on signal line -->
  <path d="M520 220 C560 210, 590 230, 620 220 L650 220" stroke="#ff6b6b" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.6"/>
  <!-- Ground path -->
  <line x1="400" y1="260" x2="400" y2="340" stroke="#666" stroke-width="1.5"/>
  <line x1="400" y1="340" x2="400" y2="360" stroke="#666" stroke-width="2.5"/>
  <text x="400" y="380" fill="#7ec8f8" font-size="9" font-family="Arial" text-anchor="middle" opacity="0.6">GND</text>
  <!-- Path labels -->
  <text x="250" y="285" fill="#ff4444" font-size="11" font-family="Arial" opacity="0.8">电源线感应浪涌 ~60%</text>
  <text x="580" y="245" fill="#ff6b6b" font-size="10" font-family="Arial" opacity="0.7">信号线窜入 ~25%</text>
  <text x="400" y="330" fill="#7ec8f8" font-size="10" font-family="Arial" text-anchor="middle" opacity="0.7">地电位反击 ~15%</text>
  <!-- Title -->
  <text x="400" y="40" fill="#ffffff" font-size="16" font-family="Arial" text-anchor="middle" font-weight="bold" opacity="0.95">雷击浪涌传播路径 — LED驱动电源3种杀伤方式</text>
  <!-- Legend -->
  <rect x="600" y="420" rx="4" ry="4" width="180" height="60" fill="#1a2a4a" stroke="#7ec8f8" stroke-width="0.5" opacity="0.7"/>
  <circle cx="618" cy="435" r="5" fill="#ff4444" opacity="0.8"/>
  <text x="630" y="438" fill="#ffffff" font-size="9" font-family="Arial">差模浪涌(L-N)</text>
  <circle cx="618" cy="455" r="5" fill="#7ec8f8" opacity="0.8"/>
  <text x="630" y="458" fill="#ffffff" font-size="9" font-family="Arial">共模浪涌(L-PE/N-PE)</text>
  <rect x="614" y="465" rx="2" ry="2" width="10" height="8" fill="#5b8c5a" opacity="0.8"/>
  <text x="630" y="472" fill="#ffffff" font-size="9" font-family="Arial">信号线感应</text>
</svg>