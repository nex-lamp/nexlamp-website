<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ec27e" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#7ec27e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7ec27e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulbFlicker" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ff6b6b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <text x="400" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#e0e6f0">调光下限与色温偏移的真相</text>
  <text x="400" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#7a8a9a">Why dimming to 1% can feel brighter than 50%</text>

  <!-- Chart area: x=duty cycle, y=brightness perception -->
  <g transform="translate(80,100)">
    <!-- Axes -->
    <line x1="0" y1="280" x2="640" y2="280" stroke="#3a4a60" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="280" stroke="#3a4a60" stroke-width="1.5"/>

    <!-- Grid -->
    <line x1="0" y1="60" x2="640" y2="60" stroke="#1f2a3d" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="140" x2="640" y2="140" stroke="#1f2a3d" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="220" x2="640" y2="220" stroke="#1f2a3d" stroke-width="0.5" stroke-dasharray="3,3"/>

    <!-- X labels -->
    <text x="0" y="300" font-family="-apple-system, sans-serif" font-size="10" fill="#7a8a9a">100%</text>
    <text x="160" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#7a8a9a">75%</text>
    <text x="320" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#7a8a9a">50%</text>
    <text x="480" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#7a8a9a">25%</text>
    <text x="620" y="300" text-anchor="end" font-family="-apple-system, sans-serif" font-size="10" fill="#7a8a9a">1%</text>
    <text x="320" y="330" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#a0b0c0" font-weight="bold">PWM 占空比 (Duty Cycle)</text>

    <!-- Y labels -->
    <text x="-10" y="285" text-anchor="end" font-family="-apple-system, sans-serif" font-size="10" fill="#7a8a9a">低</text>
    <text x="-10" y="65" text-anchor="end" font-family="-apple-system, sans-serif" font-size="10" fill="#7a8a9a">高</text>
    <text x="-30" y="140" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#a0b0c0" font-weight="bold" transform="rotate(-90,-30,140)">主观亮度感受</text>

    <!-- Curve: ideal linear -->
    <path d="M0,0 Q200,80 320,140 Q480,220 620,275" stroke="#7ec27e" stroke-width="2.5" fill="none"/>
    <!-- Curve: actual perception (steeper at low end) -->
    <path d="M0,5 Q150,55 280,90 Q450,180 620,270" stroke="#ff6b6b" stroke-width="2.5" fill="none" stroke-dasharray="6,3"/>

    <!-- Flicker zone marker -->
    <rect x="450" y="0" width="190" height="280" fill="#ff6b6b" fill-opacity="0.08"/>
    <line x1="450" y1="0" x2="450" y2="280" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="545" y="20" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#ff6b6b">⚠ 危险区</text>
    <text x="545" y="35" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#ff6b6b">PWM &lt; 3kHz 频闪</text>

    <!-- Color temperature drift zone -->
    <rect x="480" y="0" width="160" height="280" fill="#ffd93d" fill-opacity="0.06"/>
    <text x="560" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#ffd93d">色温漂移</text>
    <text x="560" y="68" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#ffd93d">+200~500K</text>

    <!-- Key points -->
    <circle cx="450" cy="207" r="5" fill="#ff6b6b"/>
    <text x="450" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#ff6b6b" font-weight="bold">10%</text>

    <circle cx="620" cy="270" r="5" fill="#ff6b6b"/>
    <text x="620" y="290" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#ff6b6b" font-weight="bold">1%</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80,440)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#7ec27e" stroke-width="2.5"/>
    <text x="38" y="4" font-family="-apple-system, sans-serif" font-size="11" fill="#a0b0c0">理想线性调光</text>
    <line x1="200" y1="0" x2="230" y2="0" stroke="#ff6b6b" stroke-width="2.5" stroke-dasharray="6,3"/>
    <text x="238" y="4" font-family="-apple-system, sans-serif" font-size="11" fill="#a0b0c0">实际人眼感受 (更刺眼)</text>
  </g>
</svg>
