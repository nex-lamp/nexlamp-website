<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0L0 0L0 20" fill="none" stroke="#1a2d4d" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="680" height="520" fill="#0a1628"/>
  <rect width="680" height="520" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="30" y="20" width="620" height="36" rx="6" fill="#111d33" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="50" cy="38" r="5" fill="#ff5f56"/>
  <circle cx="68" cy="38" r="5" fill="#ffbd2e"/>
  <circle cx="86" cy="38" r="5" fill="#27c93f"/>
  <text x="340" y="43" text-anchor="middle" fill="#7ec27e" font-family="monospace" font-size="14" font-weight="500">智能筒灯五种调光协议对比</text>

  <!-- Table header -->
  <rect x="30" y="75" width="620" height="40" rx="6" fill="#111d33" stroke="#1e3a5f" stroke-width="1"/>
  <text x="55" y="100" fill="#7ec27e" font-family="monospace" font-size="12" font-weight="500">协议</text>
  <text x="180" y="100" fill="#7ec27e" font-family="monospace" font-size="12" font-weight="500">调光能力</text>
  <text x="320" y="100" fill="#7ec27e" font-family="monospace" font-size="12" font-weight="500">布线要求</text>
  <text x="460" y="100" fill="#7ec27e" font-family="monospace" font-size="12" font-weight="500">适用场景</text>

  <!-- Row 1: Switch -->
  <rect x="30" y="120" width="620" height="55" rx="6" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1"/>
  <text x="55" y="150" fill="#c8ddf0" font-family="monospace" font-size="12">开关</text>
  <text x="180" y="150" fill="#a0c4e8" font-family="monospace" font-size="11">仅开/关</text>
  <text x="320" y="150" fill="#a0c4e8" font-family="monospace" font-size="11">常规电线</text>
  <text x="460" y="150" fill="#a0c4e8" font-family="monospace" font-size="11">预算有限 / 非智能</text>

  <!-- Row 2: TRIAC -->
  <rect x="30" y="180" width="620" height="55" rx="6" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1"/>
  <text x="55" y="210" fill="#c8ddf0" font-family="monospace" font-size="12">可控硅</text>
  <text x="180" y="210" fill="#a0c4e8" font-family="monospace" font-size="11">调亮暗</text>
  <text x="320" y="210" fill="#a0c4e8" font-family="monospace" font-size="11">无需改线</text>
  <text x="460" y="210" fill="#a0c4e8" font-family="monospace" font-size="11">老房改造 / 兼容性差</text>

  <!-- Row 3: 0-10V -->
  <rect x="30" y="240" width="620" height="55" rx="6" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1"/>
  <text x="55" y="270" fill="#c8ddf0" font-family="monospace" font-size="12">0-10V</text>
  <text x="180" y="270" fill="#a0c4e8" font-family="monospace" font-size="11">调光稳定</text>
  <text x="320" y="270" fill="#a0c4e8" font-family="monospace" font-size="11">需信号线</text>
  <text x="460" y="270" fill="#a0c4e8" font-family="monospace" font-size="11">商业空间</text>

  <!-- Row 4: DALI-2 -->
  <rect x="30" y="300" width="620" height="55" rx="6" fill="#0d1f3a" stroke="#1e4d6b" stroke-width="1"/>
  <text x="55" y="330" fill="#c8ddf0" font-family="monospace" font-size="12">DALI-2</text>
  <text x="180" y="330" fill="#e6a845" font-family="monospace" font-size="11" font-weight="500">独立寻址 / 高精度</text>
  <text x="320" y="330" fill="#a0c4e8" font-family="monospace" font-size="11">总线布线</text>
  <text x="460" y="330" fill="#a0c4e8" font-family="monospace" font-size="11">高端住宅 / 商业</text>

  <!-- Row 5: Zigbee/BLE Mesh -->
  <rect x="30" y="360" width="620" height="55" rx="6" fill="#0d1f3a" stroke="#7ec27e" stroke-width="1.5" filter="url(#glow)"/>
  <text x="55" y="390" fill="#7ec27e" font-family="monospace" font-size="12" font-weight="500">Zigbee / 蓝牙Mesh</text>
  <text x="180" y="390" fill="#7ec27e" font-family="monospace" font-size="11" font-weight="500">调光调色 / 全屋联动</text>
  <text x="320" y="390" fill="#7ec27e" font-family="monospace" font-size="11" font-weight="500">无线 / 需网关</text>
  <text x="460" y="390" fill="#7ec27e" font-family="monospace" font-size="11" font-weight="500">新装无主灯首选</text>

  <!-- Recommendation box -->
  <rect x="30" y="430" width="620" height="60" rx="8" fill="#111d33" stroke="#1e3a5f" stroke-width="1"/>
  <text x="50" y="455" fill="#7ec27e" font-family="monospace" font-size="12" filter="url(#glow)">推荐方案</text>
  <text x="50" y="475" fill="#c8ddf0" font-family="monospace" font-size="11">新装无主灯优先选涂鸦Zigbee或米家蓝牙Mesh，扩展性强，后期可加传感器、窗帘、场景面板。</text>

  <!-- Bottom note -->
  <text x="340" y="510" text-anchor="middle" fill="#5a7090" font-family="monospace" font-size="10">NEXLAMP | 耐利普科技 | 涂鸦Zigbee智能照明方案</text>
</svg>
