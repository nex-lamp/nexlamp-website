<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500">
  <defs>
    <linearGradient id="bgDe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="lgDe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102039"/>
      <stop offset="1" stop-color="#142948"/>
    </linearGradient>
    <filter id="glowDe" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="680" height="500" fill="url(#bgDe)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="60" x2="680" y2="60"/><line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/><line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="420" x2="680" y2="420"/><line x1="0" y1="480" x2="680" y2="480"/>
    <line x1="85" y1="0" x2="85" y2="500"/><line x1="170" y1="0" x2="170" y2="500"/>
    <line x1="255" y1="0" x2="255" y2="500"/><line x1="340" y1="0" x2="340" y2="500"/>
    <line x1="425" y1="0" x2="425" y2="500"/><line x1="510" y1="0" x2="510" y2="500"/>
    <line x1="595" y1="0" x2="595" y2="500"/>
  </g>

  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="23" font-weight="bold" filter="url(#glowDe)">交付房智能的三个死结</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <rect x="34" y="68" width="612" height="128" rx="10" fill="url(#lgDe)" stroke="#e06666" stroke-width="1.4"/>
  <rect x="34" y="68" width="6" height="128" rx="3" fill="#e06666"/>
  <text x="58" y="96" fill="#e06666" font-family="sans-serif" font-size="15" font-weight="bold">死结一 · 单火底盒配三合一面板</text>
  <text x="58" y="126" fill="#9db8d9" font-family="sans-serif" font-size="12.5">卡在哪：底盒只走单火线，空调 / 地暖 / 新风锁在一块三合一面板里</text>
  <text x="58" y="152" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">换面板 → 这几项一起丢远程控制</text>
  <text x="58" y="176" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">第三方接管 → 要拔原厂网关信号线，还要拆掉每个内机的原厂网关</text>

  <rect x="34" y="208" width="612" height="128" rx="10" fill="url(#lgDe)" stroke="#f0c674" stroke-width="1.4"/>
  <rect x="34" y="208" width="6" height="128" rx="3" fill="#f0c674"/>
  <text x="58" y="236" fill="#f0c674" font-family="sans-serif" font-size="15" font-weight="bold">死结二 · 协议私有或半封闭</text>
  <text x="58" y="266" fill="#9db8d9" font-family="sans-serif" font-size="12.5">卡在哪：进不了米家 / Apple Home / Matter 这套通用生态</text>
  <text x="58" y="292" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">手机多装一个 App，家人重教一遍，场景重设一遍</text>
  <text x="58" y="316" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">想加一盏灯、一个传感器，加不进去；整屋换生态等于重做</text>

  <rect x="34" y="348" width="612" height="128" rx="10" fill="url(#lgDe)" stroke="#7ec27e" stroke-width="1.4"/>
  <rect x="34" y="348" width="6" height="128" rx="3" fill="#7ec27e"/>
  <text x="58" y="376" fill="#7ec27e" font-family="sans-serif" font-size="15" font-weight="bold">死结三 · 开关管通断，调光调色看驱动</text>
  <text x="58" y="406" fill="#9db8d9" font-family="sans-serif" font-size="12.5">卡在哪：多数智能开关只做通断；灯具驱动不支持调光调色</text>
  <text x="58" y="432" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">换了贵面板也调不了色温，只能开和关</text>
  <text x="58" y="456" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">单火取电的微电流会把小功率 LED 点成关灯后微亮的“鬼火”</text>
</svg>
