<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <pattern id="grid2" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1a2a4a" stroke-width="0.4"/>
    </pattern>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="400" fill="#0a1628"/>
  <rect width="680" height="400" fill="url(#grid2)" opacity="0.2"/>

  <text x="16" y="30" fill="#00ff88" font-family="Courier New,monospace" font-size="12" filter="url(#glow2)">┌─ Zigbee Mesh Topology ──────────────────────────────────────────────┐</text>

  <!-- GateWay (Coordinator) -->
  <circle cx="340" cy="70" r="28" fill="#0d1f3c" stroke="#00d4aa" stroke-width="2.5" filter="url(#glow2)"/>
  <circle cx="340" cy="70" r="6" fill="#00d4aa" filter="url(#glow2)"/>
  <text x="340" y="112" fill="#00d4aa" font-family="Consolas,monospace" font-size="11" text-anchor="middle" font-weight="bold">Coordinator</text>
  <text x="340" y="127" fill="#556677" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">(网关/协调器)</text>

  <!-- Router layer -->
  <!-- Router 1 -->
  <circle cx="160" cy="180" r="22" fill="#0d1f3c" stroke="#4da6ff" stroke-width="2"/>
  <rect x="148" y="174" width="24" height="12" rx="3" fill="#0d1f3c" stroke="#4da6ff" stroke-width="0.8"/>
  <text x="160" y="183" fill="#4da6ff" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">⚡</text>
  <text x="160" y="216" fill="#4da6ff" font-family="Consolas,monospace" font-size="10" text-anchor="middle">Router A</text>
  <text x="160" y="230" fill="#556677" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">智能插座</text>

  <!-- Router 2 -->
  <circle cx="340" cy="180" r="22" fill="#0d1f3c" stroke="#4da6ff" stroke-width="2"/>
  <rect x="328" y="174" width="24" height="12" rx="3" fill="#0d1f3c" stroke="#4da6ff" stroke-width="0.8"/>
  <text x="340" y="183" fill="#4da6ff" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">⚡</text>
  <text x="340" y="216" fill="#4da6ff" font-family="Consolas,monospace" font-size="10" text-anchor="middle">Router B</text>
  <text x="340" y="230" fill="#556677" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">入墙开关</text>

  <!-- Router 3 -->
  <circle cx="520" cy="180" r="22" fill="#0d1f3c" stroke="#4da6ff" stroke-width="2"/>
  <rect x="508" y="174" width="24" height="12" rx="3" fill="#0d1f3c" stroke="#4da6ff" stroke-width="0.8"/>
  <text x="520" y="183" fill="#4da6ff" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">⚡</text>
  <text x="520" y="216" fill="#4da6ff" font-family="Consolas,monospace" font-size="10" text-anchor="middle">Router C</text>
  <text x="520" y="230" fill="#556677" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">智能插座</text>

  <!-- End devices layer -->
  <!-- End device 1 -->
  <circle cx="100" cy="300" r="18" fill="#0d1f3c" stroke="#8899aa" stroke-width="1.5"/>
  <text x="100" y="305" fill="#8899aa" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">💡</text>
  <text x="100" y="332" fill="#8899aa" font-family="Consolas,monospace" font-size="9" text-anchor="middle">射灯 1</text>

  <!-- End device 2 -->
  <circle cx="220" cy="300" r="18" fill="#0d1f3c" stroke="#8899aa" stroke-width="1.5"/>
  <text x="220" y="305" fill="#8899aa" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">💡</text>
  <text x="220" y="332" fill="#8899aa" font-family="Consolas,monospace" font-size="9" text-anchor="middle">筒灯 2</text>

  <!-- End device 3 (dead) -->
  <circle cx="400" cy="300" r="18" fill="#1a0a0a" stroke="#ff4444" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="400" y="305" fill="#ff4444" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" filter="url(#glowRed)">💡</text>
  <text x="400" y="332" fill="#ff4444" font-family="Consolas,monospace" font-size="9" text-anchor="middle">筒灯 3 ↓</text>
  <text x="400" y="344" fill="#ff4444" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">OFFLINE</text>

  <!-- End device 4 -->
  <circle cx="520" cy="300" r="18" fill="#0d1f3c" stroke="#8899aa" stroke-width="1.5"/>
  <text x="520" y="305" fill="#8899aa" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">💡</text>
  <text x="520" y="332" fill="#8899aa" font-family="Consolas,monospace" font-size="9" text-anchor="middle">射灯 4</text>

  <!-- End device 5 -->
  <circle cx="600" cy="300" r="18" fill="#0d1f3c" stroke="#8899aa" stroke-width="1.5"/>
  <text x="600" y="305" fill="#8899aa" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🔘</text>
  <text x="600" y="332" fill="#8899aa" font-family="Consolas,monospace" font-size="9" text-anchor="middle">无线开关</text>

  <!-- Connection lines -->
  <!-- Coordinator to Routers -->
  <line x1="326" y1="90" x2="170" y2="162" stroke="#00d4aa" stroke-width="1.5" opacity="0.6"/>
  <line x1="340" y1="98" x2="340" y2="158" stroke="#00d4aa" stroke-width="2" opacity="0.8"/>
  <line x1="354" y1="90" x2="510" y2="162" stroke="#00d4aa" stroke-width="1.5" opacity="0.6"/>

  <!-- Router to Router (Mesh) -->
  <line x1="182" y1="180" x2="318" y2="180" stroke="#1a3366" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="362" y1="180" x2="498" y2="180" stroke="#1a3366" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Router A to end devices -->
  <line x1="160" y1="202" x2="100" y2="282" stroke="#4da6ff" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="202" x2="220" y2="282" stroke="#4da6ff" stroke-width="1" opacity="0.5"/>

  <!-- Router B to end device (dead path) -->
  <line x1="340" y1="202" x2="400" y2="282" stroke="#ff4444" stroke-width="1" opacity="0.7" stroke-dasharray="3,2"/>

  <!-- Router C to end devices -->
  <line x1="520" y1="202" x2="520" y2="282" stroke="#4da6ff" stroke-width="1" opacity="0.5"/>
  <line x1="520" y1="202" x2="600" y2="282" stroke="#4da6ff" stroke-width="1" opacity="0.5"/>

  <!-- Dead device cross -->
  <line x1="388" y1="290" x2="412" y2="310" stroke="#ff4444" stroke-width="1.5" opacity="0.8"/>
  <line x1="412" y1="290" x2="388" y2="310" stroke="#ff4444" stroke-width="1.5" opacity="0.8"/>

  <!-- Legend -->
  <rect x="16" y="358" width="648" height="34" rx="4" fill="#0d1f3c" stroke="#1a2a4a" stroke-width="0.5"/>
  <circle cx="55" cy="375" r="5" fill="#00d4aa"/><text x="68" y="379" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">协调器</text>
  <rect x="140" y="371" width="10" height="8" rx="2" fill="#0d1f3c" stroke="#4da6ff" stroke-width="1"/><text x="158" y="379" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">路由节点(⚡常供电)</text>
  <circle cx="310" cy="375" r="5" fill="none" stroke="#8899aa" stroke-width="1.5"/><text x="322" y="379" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">终端设备</text>
  <circle cx="430" cy="375" r="5" fill="none" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="4,2"/><text x="442" y="379" fill="#ff4444" font-family="Arial,sans-serif" font-size="10">离线设备</text>
  <line x1="525" y1="375" x2="565" y2="375" stroke="#1a3366" stroke-width="1" stroke-dasharray="4,3"/><text x="572" y="379" fill="#8899aa" font-family="Arial,sans-serif" font-size="10">Mesh链路</text>
</svg>
