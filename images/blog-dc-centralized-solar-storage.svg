<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="680" height="420" fill="url(#bgGrad3)"/>

  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="60" x2="680" y2="60"/>
    <line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
  </g>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-family="monospace" font-size="16" fill="#00d4ff" font-weight="bold">光储直柔：LED驱动天然融入新能源生态</text>

  <!-- TOP: Traditional (3 conversions) -->
  <text x="340" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff6b6b">传统AC架构（3次转换，损耗24-35%）</text>

  <g transform="translate(0, 65)">
    <!-- Solar panel -->
    <rect x="40" y="0" width="60" height="35" rx="4" fill="#1a2a1a" stroke="#ffd700" stroke-width="1.5"/>
    <text x="70" y="15" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffd700">光伏</text>
    <text x="70" y="28" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffd700">DC</text>

    <!-- Arrow 1 -->
    <line x1="100" y1="17" x2="140" y2="17" stroke="#ff6b6b" stroke-width="2"/>
    <text x="120" y="12" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6b6b">逆变</text>
    <text x="120" y="28" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6b6b">-8~15%</text>

    <!-- Inverter -->
    <rect x="140" y="2" width="60" height="30" rx="3" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1"/>
    <text x="170" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#ff6b6b">逆变器</text>

    <!-- Arrow 2 -->
    <line x1="200" y1="17" x2="240" y2="17" stroke="#ff6b6b" stroke-width="2"/>
    <text x="220" y="12" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6b6b">AC传输</text>
    <text x="220" y="28" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6b6b">-15~20%</text>

    <!-- AC-DC Driver -->
    <rect x="240" y="2" width="60" height="30" rx="3" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1"/>
    <text x="270" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#ff6b6b">AC-DC</text>

    <!-- Arrow 3 -->
    <line x1="300" y1="17" x2="340" y2="17" stroke="#ff6b6b" stroke-width="2"/>
    <text x="320" y="12" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6b6b">整流</text>
    <text x="320" y="28" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff6b6b">-8~15%</text>

    <!-- LED -->
    <rect x="340" y="2" width="60" height="30" rx="3" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1"/>
    <text x="370" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#ff6b6b">LED</text>

    <!-- Total loss -->
    <text x="480" y="20" font-family="monospace" font-size="10" fill="#ff6b6b" font-weight="bold">总损耗: 24-35%</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="115" x2="660" y2="115" stroke="#1a3050" stroke-width="1"/>
  <text x="340" y="128" text-anchor="middle" font-family="monospace" font-size="10" fill="#666">━━ ↓ 直流架构（1次转换）━━</text>
  <line x1="20" y1="135" x2="660" y2="135" stroke="#1a3050" stroke-width="1"/>

  <!-- BOTTOM: DC architecture (1 conversion) -->
  <text x="340" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#2ed573">直流集中架构（1次转换，损耗&lt;8%）</text>

  <g transform="translate(0, 170)">
    <!-- Solar panel with glow -->
    <rect x="40" y="0" width="70" height="40" rx="4" fill="#0d2a1a" stroke="#ffd700" stroke-width="2" filter="url(#glow3)"/>
    <text x="75" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffd700" font-weight="bold">光伏阵列</text>
    <text x="75" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffd700">DC输出</text>

    <!-- Direct DC arrow (no conversion!) -->
    <line x1="110" y1="20" x2="175" y2="20" stroke="#2ed573" stroke-width="3"/>
    <text x="142" y="14" text-anchor="middle" font-family="monospace" font-size="8" fill="#2ed573" font-weight="bold">DC直供</text>
    <text x="142" y="33" text-anchor="middle" font-family="monospace" font-size="7" fill="#16a085">0%转换损耗</text>

    <!-- Central DC cabinet -->
    <rect x="175" y="-5" width="90" height="55" rx="6" fill="#0d2a1a" stroke="#2ed573" stroke-width="2" filter="url(#glow3)"/>
    <text x="220" y="12" text-anchor="middle" font-family="monospace" font-size="9" fill="#2ed573" font-weight="bold">集中配电柜</text>
    <text x="220" y="26" text-anchor="middle" font-family="monospace" font-size="7" fill="#2ed573">AC-DC整流</text>
    <text x="220" y="38" text-anchor="middle" font-family="monospace" font-size="7" fill="#2ed573">MPPT + 储能管理</text>

    <!-- Battery storage -->
    <rect x="175" y="65" width="90" height="35" rx="4" fill="#0d2a1a" stroke="#2ed573" stroke-width="1.5"/>
    <text x="220" y="80" text-anchor="middle" font-family="monospace" font-size="8" fill="#2ed573">储能电池组</text>
    <text x="220" y="93" text-anchor="middle" font-family="monospace" font-size="7" fill="#16a085">夜间/阴天续供</text>

    <!-- Battery connection -->
    <line x1="220" y1="50" x2="220" y2="65" stroke="#2ed573" stroke-width="2"/>

    <!-- DC Bus -->
    <line x1="265" y1="22" x2="340" y2="22" stroke="#2ed573" stroke-width="3"/>
    <text x="300" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#2ed573" font-weight="bold">270V DC总线</text>

    <!-- Junction point -->
    <circle cx="340" cy="22" r="4" fill="#2ed573"/>

    <!-- Branch 1: Street lighting -->
    <line x1="340" y1="22" x2="340" y2="50" stroke="#2ed573" stroke-width="2"/>
    <line x1="340" y1="50" x2="380" y2="50" stroke="#2ed573" stroke-width="2"/>
    <rect x="380" y="38" width="55" height="28" rx="3" fill="#0d2a1a" stroke="#2ed573" stroke-width="1"/>
    <text x="407" y="55" text-anchor="middle" font-family="monospace" font-size="7" fill="#2ed573">DC-DC路灯</text>
    <line x1="435" y1="52" x2="465" y2="52" stroke="#2ed573" stroke-width="1"/>
    <rect x="465" y="40" width="20" height="25" rx="2" fill="#1a2a1a" stroke="#2ed573" stroke-width="1"/>
    <text x="510" y="55" font-family="monospace" font-size="7" fill="#16a085">路灯阵列</text>

    <!-- Branch 2: 5G pole -->
    <line x1="340" y1="22" x2="340" y2="85" stroke="#2ed573" stroke-width="2"/>
    <line x1="340" y1="85" x2="380" y2="85" stroke="#2ed573" stroke-width="2"/>
    <rect x="380" y="73" width="55" height="28" rx="3" fill="#0d2a1a" stroke="#00d4ff" stroke-width="1"/>
    <text x="407" y="90" text-anchor="middle" font-family="monospace" font-size="7" fill="#00d4ff">5G微基站</text>
    <text x="465" y="90" font-family="monospace" font-size="7" fill="#16a085">+监控+气象</text>

    <!-- Branch 3: Tunnel -->
    <line x1="340" y1="22" x2="340" y2="120" stroke="#2ed573" stroke-width="2"/>
    <line x1="340" y1="120" x2="380" y2="120" stroke="#2ed573" stroke-width="2"/>
    <rect x="380" y="108" width="55" height="28" rx="3" fill="#0d2a1a" stroke="#2ed573" stroke-width="1"/>
    <text x="407" y="125" text-anchor="middle" font-family="monospace" font-size="7" fill="#2ed573">隧道照明</text>
    <text x="465" y="125" font-family="monospace" font-size="7" fill="#16a085">48V DC</text>

    <!-- Total loss -->
    <text x="570" y="22" text-anchor="middle" font-family="monospace" font-size="10" fill="#2ed573" font-weight="bold">总损耗</text>
    <text x="570" y="38" text-anchor="middle" font-family="monospace" font-size="16" fill="#2ed573" font-weight="bold">&lt;8%</text>
    <text x="570" y="52" text-anchor="middle" font-family="monospace" font-size="7" fill="#16a085">省2次转换</text>
  </g>

  <!-- Bottom: Key advantages -->
  <rect x="20" y="345" width="640" height="65" rx="6" fill="#0a1220" stroke="#1a3050" stroke-width="1"/>

  <text x="35" y="365" font-family="monospace" font-size="9" fill="#00d4ff" font-weight="bold">对LED驱动厂商的三重影响</text>

  <text x="35" y="382" font-family="monospace" font-size="8" fill="#2ed573">① 产品重构: 百万颗AC-DC → 千台集中模块 + 万颗DC-DC</text>
  <text x="35" y="397" font-family="monospace" font-size="8" fill="#2ed573">② 通信变革: 无线/独立线缆 → DC电力线载波(PLC)省30%线缆成本</text>

  <text x="400" y="382" font-family="monospace" font-size="8" fill="#2ed573">③ 能源一体化: "光储直柔"天然适配</text>
  <text x="400" y="397" font-family="monospace" font-size="8" fill="#16a085">2030年预测: 1000条隧道 · 年节电3.6亿度 · 减碳30万吨</text>
</svg>
