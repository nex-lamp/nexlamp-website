<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <!-- Background -->
  <rect width="680" height="420" fill="#0a1628"/>
  <!-- Grid lines -->
  <g stroke="#1a2a40" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="680" y2="60"/>
    <line x1="0" y1="120" x2="680" y2="120"/>
    <line x1="0" y1="180" x2="680" y2="180"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="300" x2="680" y2="300"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="85" y1="0" x2="85" y2="420"/>
    <line x1="170" y1="0" x2="170" y2="420"/>
    <line x1="255" y1="0" x2="255" y2="420"/>
    <line x1="340" y1="0" x2="340" y2="420"/>
    <line x1="425" y1="0" x2="425" y2="420"/>
    <line x1="510" y1="0" x2="510" y2="420"/>
    <line x1="595" y1="0" x2="595" y2="420"/>
  </g>
  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" fill="#7ec27e" font-family="Consolas, monospace" font-size="16" font-weight="bold">适老照明三级控制体系</text>
  <text x="340" y="52" text-anchor="middle" fill="#4a6a5a" font-family="Consolas, monospace" font-size="10">Near / Mid / Far Field Control Architecture</text>

  <!-- Near Field -->
  <rect x="30" y="80" width="180" height="280" rx="8" fill="#0d2137" stroke="#2478C2" stroke-width="2" opacity="0.9"/>
  <text x="120" y="110" text-anchor="middle" fill="#2478C2" font-family="Consolas, monospace" font-size="14" font-weight="bold">近场控制</text>
  <text x="120" y="128" text-anchor="middle" fill="#4a7aaa" font-family="Consolas, monospace" font-size="10">Near Field (0-0.5m)</text>
  <line x1="50" y1="145" x2="190" y2="145" stroke="#1a3a5a" stroke-width="1"/>
  <text x="120" y="170" text-anchor="middle" fill="#8ab4f8" font-family="Consolas, monospace" font-size="11">物理开关</text>
  <text x="120" y="190" text-anchor="middle" fill="#8ab4f8" font-family="Consolas, monospace" font-size="11">触摸面板</text>
  <text x="120" y="210" text-anchor="middle" fill="#8ab4f8" font-family="Consolas, monospace" font-size="11">床头按键</text>
  <line x1="50" y1="230" x2="190" y2="230" stroke="#1a3a5a" stroke-width="1"/>
  <text x="120" y="255" text-anchor="middle" fill="#5a8a6a" font-family="Consolas, monospace" font-size="10">可靠性: 100%</text>
  <text x="120" y="275" text-anchor="middle" fill="#5a8a6a" font-family="Consolas, monospace" font-size="10">无需网络/电力</text>
  <text x="120" y="295" text-anchor="middle" fill="#5a8a6a" font-family="Consolas, monospace" font-size="10">老人首选操作</text>
  <rect x="60" y="315" width="120" height="28" rx="4" fill="#2478C2" opacity="0.2"/>
  <text x="120" y="333" text-anchor="middle" fill="#2478C2" font-family="Consolas, monospace" font-size="10">底层保障</text>

  <!-- Mid Field -->
  <rect x="250" y="80" width="180" height="280" rx="8" fill="#0d2137" stroke="#7ec27e" stroke-width="2" opacity="0.9"/>
  <text x="340" y="110" text-anchor="middle" fill="#7ec27e" font-family="Consolas, monospace" font-size="14" font-weight="bold">中场控制</text>
  <text x="340" y="128" text-anchor="middle" fill="#5a8a5a" font-family="Consolas, monospace" font-size="10">Mid Field (0.5-5m)</text>
  <line x1="270" y1="145" x2="410" y2="145" stroke="#1a3a2a" stroke-width="1"/>
  <text x="340" y="170" text-anchor="middle" fill="#8af8aa" font-family="Consolas, monospace" font-size="11">毫米波雷达</text>
  <text x="340" y="190" text-anchor="middle" fill="#8af8aa" font-family="Consolas, monospace" font-size="11">人体感应</text>
  <text x="340" y="210" text-anchor="middle" fill="#8af8aa" font-family="Consolas, monospace" font-size="11">红外PIR</text>
  <line x1="270" y1="230" x2="410" y2="230" stroke="#1a3a2a" stroke-width="1"/>
  <text x="340" y="255" text-anchor="middle" fill="#5a8a6a" font-family="Consolas, monospace" font-size="10">自动触发</text>
  <text x="340" y="275" text-anchor="middle" fill="#5a8a6a" font-family="Consolas, monospace" font-size="10">无需操作</text>
  <text x="340" y="295" text-anchor="middle" fill="#5a8a6a" font-family="Consolas, monospace" font-size="10">安全核心层</text>
  <rect x="280" y="315" width="120" height="28" rx="4" fill="#7ec27e" opacity="0.2"/>
  <text x="340" y="333" text-anchor="middle" fill="#7ec27e" font-family="Consolas, monospace" font-size="10">安全守护</text>

  <!-- Far Field -->
  <rect x="470" y="80" width="180" height="280" rx="8" fill="#0d2137" stroke="#c27e7e" stroke-width="2" opacity="0.9"/>
  <text x="560" y="110" text-anchor="middle" fill="#c27e7e" font-family="Consolas, monospace" font-size="14" font-weight="bold">远场控制</text>
  <text x="560" y="128" text-anchor="middle" fill="#8a5a5a" font-family="Consolas, monospace" font-size="10">Far Field (&gt;5m)</text>
  <line x1="490" y1="145" x2="630" y2="145" stroke="#3a1a1a" stroke-width="1"/>
  <text x="560" y="170" text-anchor="middle" fill="#f8aa8a" font-family="Consolas, monospace" font-size="11">语音控制</text>
  <text x="560" y="190" text-anchor="middle" fill="#f8aa8a" font-family="Consolas, monospace" font-size="11">手机APP</text>
  <text x="560" y="210" text-anchor="middle" fill="#f8aa8a" font-family="Consolas, monospace" font-size="11">场景联动</text>
  <line x1="490" y1="230" x2="630" y2="230" stroke="#3a1a1a" stroke-width="1"/>
  <text x="560" y="255" text-anchor="middle" fill="#8a6a5a" font-family="Consolas, monospace" font-size="10">便利增强层</text>
  <text x="560" y="275" text-anchor="middle" fill="#8a6a5a" font-family="Consolas, monospace" font-size="10">需网络支持</text>
  <text x="560" y="295" text-anchor="middle" fill="#8a6a5a" font-family="Consolas, monospace" font-size="10">坏了不影响基础</text>
  <rect x="500" y="315" width="120" height="28" rx="4" fill="#c27e7e" opacity="0.2"/>
  <text x="560" y="333" text-anchor="middle" fill="#c27e7e" font-family="Consolas, monospace" font-size="10">锦上添花</text>

  <!-- Arrows between levels -->
  <path d="M 210 220 L 250 220" stroke="#3a5a7a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
  <path d="M 430 220 L 470 220" stroke="#5a7a3a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3a5a7a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a7a3a"/>
    </marker>
  </defs>

  <!-- Bottom note -->
  <text x="340" y="385" text-anchor="middle" fill="#3a4a5a" font-family="Consolas, monospace" font-size="10">// 近场兜底 &#8594; 中场自动化 &#8594; 远场增强：层级递进，互不替代</text>
  <text x="340" y="402" text-anchor="middle" fill="#2a3a4a" font-family="Consolas, monospace" font-size="9">Based on SILA &#36866;&#32769;&#22330;&#26223;&#29031;&#26126;&#26234;&#33021;&#21270;&#35268;&#33539; 2026-01-21</text>
</svg>