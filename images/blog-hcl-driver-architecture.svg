<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBox">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3050" stroke-width="0.3"/>
    </pattern>
  </defs>

  <rect width="680" height="480" fill="url(#bg)"/>
  <rect width="680" height="480" fill="url(#grid)"/>

  <!-- Terminal bar -->
  <rect x="0" y="0" width="680" height="28" fill="#0d1a2d" rx="4"/>
  <circle cx="16" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="14" r="5" fill="#27c93f"/>
  <text x="340" y="18" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">hcl_driver_arch.py ~ dual_channel_constant_current</text>

  <text x="340" y="52" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="16" font-weight="bold" filter="url(#glow)">HCL LED驱动电源架构 — 双路独立恒流 + 16bit PWM</text>

  <!-- AC Input -->
  <rect x="40" y="300" width="100" height="40" rx="6" fill="#0d1a2d" stroke="#4facfe" stroke-width="1"/>
  <text x="90" y="324" text-anchor="middle" fill="#4facfe" font-family="monospace" font-size="11" font-weight="bold">AC 220V</text>
  <text x="90" y="310" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">INPUT</text>

  <!-- EMI/AC-DC -->
  <rect x="170" y="295" width="110" height="50" rx="6" fill="#0d1a2d" stroke="#8ec5fc" stroke-width="1"/>
  <text x="225" y="318" text-anchor="middle" fill="#8ec5fc" font-family="monospace" font-size="10" font-weight="bold">AC-DC PFC</text>
  <text x="225" y="334" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">EMI Filter + 整流</text>

  <!-- Arrow AC->PFC -->
  <line x1="140" y1="320" x2="170" y2="320" stroke="#1a3050" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Dual CC outputs -->
  <rect x="320" y="240" width="130" height="50" rx="6" fill="#0d1a2d" stroke="#ff9f43" stroke-width="1"/>
  <text x="385" y="263" text-anchor="middle" fill="#ff9f43" font-family="monospace" font-size="10" font-weight="bold">CC Warm 2700K</text>
  <text x="385" y="279" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">纹波 &lt;5% | 16bit PWM</text>

  <rect x="320" y="330" width="130" height="50" rx="6" fill="#0d1a2d" stroke="#4facfe" stroke-width="1"/>
  <text x="385" y="353" text-anchor="middle" fill="#4facfe" font-family="monospace" font-size="10" font-weight="bold">CC Cool 6500K</text>
  <text x="385" y="369" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">纹波 &lt;5% | 16bit PWM</text>

  <!-- Arrows PFC->CC -->
  <line x1="280" y1="270" x2="320" y2="265" stroke="#1a3050" stroke-width="1.5"/>
  <line x1="280" y1="355" x2="320" y2="355" stroke="#1a3050" stroke-width="1.5"/>

  <!-- MCU Controller -->
  <rect x="370" y="160" width="140" height="50" rx="6" fill="#0d1a2d" stroke="#27c93f" stroke-width="1"/>
  <text x="440" y="183" text-anchor="middle" fill="#27c93f" font-family="monospace" font-size="10" font-weight="bold">MCU Controller</text>
  <text x="440" y="199" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">对数调光曲线 &#x2022; RTC时钟</text>

  <!-- Arrows MCU->CC -->
  <line x1="385" y1="210" x2="355" y2="240" stroke="#27c93f" stroke-width="1" opacity="0.6"/>
  <line x1="420" y1="210" x2="430" y2="240" stroke="#27c93f" stroke-width="1" opacity="0.6"/>
  <line x1="385" y1="210" x2="355" y2="300" stroke="#27c93f" stroke-width="1" opacity="0.6"/>
  <line x1="420" y1="210" x2="430" y2="300" stroke="#27c93f" stroke-width="1" opacity="0.6"/>

  <!-- Protocol Interface -->
  <rect x="530" y="160" width="115" height="50" rx="6" fill="#0d1a2d" stroke="#ffd166" stroke-width="1"/>
  <text x="587" y="183" text-anchor="middle" fill="#ffd166" font-family="monospace" font-size="10" font-weight="bold">Protocol</text>
  <text x="587" y="199" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">DALI-2 / Zigbee / 0-10V</text>

  <!-- Arrow MCU->Protocol -->
  <line x1="510" y1="185" x2="530" y2="185" stroke="#1a3050" stroke-width="1.5"/>

  <!-- Mixed Output -->
  <rect x="530" y="285" width="115" height="50" rx="6" fill="#0d1a2d" stroke="#00f2fe" stroke-width="1.5" filter="url(#glowBox)"/>
  <text x="587" y="308" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold">Mixed Output</text>
  <text x="587" y="324" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">HCL Health Light</text>

  <!-- Arrows CC->Mix -->
  <line x1="450" y1="265" x2="530" y2="295" stroke="#ff9f43" stroke-width="1" opacity="0.6"/>
  <line x1="450" y1="355" x2="530" y2="315" stroke="#4facfe" stroke-width="1" opacity="0.6"/>

  <!-- Spec Box -->
  <rect x="30" y="75" width="290" height="65" rx="6" fill="#0d1a2d" stroke="#1a3050" stroke-width="1"/>
  <text x="45" y="93" fill="#ffd166" font-family="monospace" font-size="10" font-weight="bold">HCL Driver 关键参数</text>
  <text x="45" y="110" fill="#64748b" font-family="monospace" font-size="9">&#x25B8; 色温精度: &#xB1;50K | 调光深度: 0.1%</text>
  <text x="45" y="126" fill="#64748b" font-family="monospace" font-size="9">&#x25B8; 频闪百分比: &lt;3% IEEE 1789  | CQC认证</text>

  <!-- Status -->
  <rect x="60" y="430" width="560" height="22" rx="3" fill="#0d1a2d" stroke="#1a3050" stroke-width="0.5"/>
  <text x="75" y="445" fill="#27c93f" font-family="monospace" font-size="9">&#x25CF; OUTPUT: STABLE | T_DRIVER: 38&#xB0;C | PF: 0.95 | EFF: 92.5%</text>
</svg>