<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f38"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a3350" stroke-width="1"/>
    </pattern>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="660" fill="url(#bg2)"/>
  <rect width="1200" height="660" fill="url(#grid2)"/>
  <text x="600" y="55" text-anchor="middle" fill="#e8f1fa" font-size="28" font-weight="bold" filter="url(#glow2)">病根① 双频合一：灯在两个频段之间"蹦极"</text>

  <!-- 左：双频合一（问题） -->
  <rect x="50" y="90" width="530" height="500" rx="12" fill="#0c1a2e" stroke="#ff6b6b" stroke-width="2"/>
  <text x="315" y="130" text-anchor="middle" fill="#ff8a8a" font-size="21" font-weight="bold">✕ 双频合一（默认开启）</text>
  <!-- 路由器 -->
  <rect x="225" y="160" width="180" height="70" rx="10" fill="#122741" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="315" y="202" text-anchor="middle" fill="#e8f1fa" font-size="19">路由器 · 一个WiFi名</text>
  <!-- 箭头乱跳 -->
  <path d="M255 240 C 200 300, 190 340, 170 390" fill="none" stroke="#ffb84d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr1)"/>
  <path d="M315 240 C 315 300, 305 350, 300 400" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr2)"/>
  <path d="M375 240 C 430 300, 440 340, 455 390" fill="none" stroke="#ffb84d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr1)"/>
  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ffb84d" stroke-width="2"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ff6b6b" stroke-width="2"/></marker>
  </defs>
  <rect x="80" y="400" width="190" height="56" rx="8" fill="#122741" stroke="#ffb84d" stroke-width="1.5"/>
  <text x="175" y="424" text-anchor="middle" fill="#ffd08a" font-size="16">📱 手机 → 被引到 5G</text>
  <text x="175" y="446" text-anchor="middle" fill="#8fb3d9" font-size="13">体验提升 ✓</text>
  <rect x="280" y="410" width="220" height="66" rx="8" fill="#2a1420" stroke="#ff6b6b" stroke-width="2" filter="url(#glow2)"/>
  <text x="390" y="437" text-anchor="middle" fill="#ff8a8a" font-size="16" font-weight="bold">💡 灯（只支持2.4G）</text>
  <text x="390" y="461" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">反复被踹下线 → "离线"</text>
  <text x="315" y="520" text-anchor="middle" fill="#c9daf0" font-size="16">路由器不停尝试把设备引向5G</text>
  <text x="315" y="548" text-anchor="middle" fill="#ff6b6b" font-size="17" font-weight="bold">结果：灯反复重连、频繁掉线</text>
  <text x="315" y="576" text-anchor="middle" fill="#8fb3d9" font-size="14">掉线占比最高的头号病根</text>

  <!-- 右：拆分双频（解法） -->
  <rect x="620" y="90" width="530" height="500" rx="12" fill="#0c1a2e" stroke="#4df08a" stroke-width="2"/>
  <text x="885" y="130" text-anchor="middle" fill="#8affb8" font-size="21" font-weight="bold">✓ 拆分双频（正确做法）</text>
  <rect x="795" y="160" width="180" height="70" rx="10" fill="#122741" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="885" y="202" text-anchor="middle" fill="#e8f1fa" font-size="19">路由器 · 两个WiFi名</text>
  <path d="M830 240 C 780 300, 770 330, 760 380" fill="none" stroke="#4df08a" stroke-width="2.5" marker-end="url(#arr3)"/>
  <path d="M940 240 C 990 300, 1000 330, 1010 380" fill="none" stroke="#4dc3ff" stroke-width="2.5" marker-end="url(#arr4)"/>
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4df08a" stroke-width="2"/></marker>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4dc3ff" stroke-width="2"/></marker>
  </defs>
  <rect x="650" y="390" width="230" height="66" rx="8" fill="#1a2c3a" stroke="#4dc3ff" stroke-width="1.5"/>
  <text x="765" y="417" text-anchor="middle" fill="#8ad8ff" font-size="16" font-weight="bold">📱 Home（5G）</text>
  <text x="765" y="441" text-anchor="middle" fill="#8fb3d9" font-size="14">手机 / 电脑 / 电视走高速</text>
  <rect x="905" y="390" width="220" height="66" rx="8" fill="#16301f" stroke="#4df08a" stroke-width="2" filter="url(#glow2)"/>
  <text x="1015" y="417" text-anchor="middle" fill="#8affb8" font-size="16" font-weight="bold">💡 Home-IoT（2.4G）</text>
  <text x="1015" y="441" text-anchor="middle" fill="#4df08a" font-size="14" font-weight="bold">灯 / 插座 / 传感器固定驻留</text>
  <text x="885" y="520" text-anchor="middle" fill="#c9daf0" font-size="16">各频段各司其职，互不干扰</text>
  <text x="885" y="548" text-anchor="middle" fill="#4df08a" font-size="17" font-weight="bold">结果：连接稳定，掉线率立降</text>
  <text x="885" y="576" text-anchor="middle" fill="#8fb3d9" font-size="14">操作：路由器后台关闭"双频合一"即可</text>

  <text x="600" y="635" text-anchor="middle" fill="#7ea8d8" font-size="16">设置路径：路由器管理后台 → 无线设置 → 关闭"双频合一 / 双频优选" → 智能设备只连2.4G</text>
</svg>
