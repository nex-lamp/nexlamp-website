<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2b45" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="720" fill="#0a1628"/>
  <rect width="1080" height="720" fill="url(#grid)"/>

  <text x="60" y="78" fill="#e2e8f0" font-family="sans-serif" font-size="36" font-weight="bold">两把温度尺，从来不在同一把上</text>
  <text x="60" y="118" fill="#7c8db0" font-family="sans-serif" font-size="20">手感 70℃ 就要缩手，而器件在 85℃ 内部仍属正常 —— 争论的根源就在这 15℃ 的错位</text>

  <!-- 手感轨 -->
  <text x="60" y="200" fill="#c8d6e8" font-family="sans-serif" font-size="22" font-weight="bold">你的手</text>
  <text x="60" y="226" fill="#5b6f96" font-family="sans-serif" font-size="16">皮肤痛阈决定的，与器件无关</text>

  <rect x="90" y="248" width="281" height="76" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-opacity="0.5"/>
  <rect x="371" y="248" width="113" height="76" fill="#4ea8de" fill-opacity="0.28" stroke="#4ea8de" stroke-opacity="0.6"/>
  <rect x="484" y="248" width="113" height="76" fill="#e0a052" fill-opacity="0.34" stroke="#e0a052" stroke-opacity="0.7"/>
  <rect x="597" y="248" width="393" height="76" fill="#e05252" fill-opacity="0.30" stroke="#e05252" stroke-opacity="0.7"/>
  <g font-family="sans-serif" font-size="18" fill="#e2e8f0" text-anchor="middle">
    <text x="230" y="282">温　热</text>
    <text x="230" y="306" fill="#8fa3c4" font-size="15">能一直摸着</text>
    <text x="427" y="282">微　烫</text>
    <text x="427" y="306" fill="#8fa3c4" font-size="15">能碰，别久碰</text>
    <text x="540" y="282">烫</text>
    <text x="540" y="306" fill="#8fa3c4" font-size="15">3 秒缩手</text>
    <text x="793" y="282">灼　手</text>
    <text x="793" y="306" fill="#8fa3c4" font-size="15">一碰就缩，指尖疼</text>
  </g>

  <!-- 器件轨 -->
  <text x="60" y="404" fill="#c8d6e8" font-family="sans-serif" font-size="22" font-weight="bold">里面的器件</text>
  <text x="60" y="430" fill="#5b6f96" font-family="sans-serif" font-size="16">按壳温与芯温差 10~25℃ 计</text>

  <rect x="90" y="452" width="562" height="76" fill="#3ddc97" fill-opacity="0.16" stroke="#3ddc97" stroke-opacity="0.55"/>
  <rect x="652" y="452" width="168" height="76" fill="#e0a052" fill-opacity="0.30" stroke="#e0a052" stroke-opacity="0.7"/>
  <rect x="820" y="452" width="170" height="76" fill="#e05252" fill-opacity="0.30" stroke="#e05252" stroke-opacity="0.7"/>
  <g font-family="sans-serif" font-size="18" fill="#e2e8f0" text-anchor="middle">
    <text x="371" y="486">寿命声明成立区</text>
    <text x="371" y="510" fill="#8fa3c4" font-size="15">50000h @ Tc 75℃ 就落在这里</text>
    <text x="736" y="486">超 Tc</text>
    <text x="736" y="510" fill="#8fa3c4" font-size="15">每 +10℃ 约减半</text>
    <text x="905" y="486">塑料软化</text>
    <text x="905" y="510" fill="#8fa3c4" font-size="15">保护频繁动作</text>
  </g>

  <!-- 70℃ 分界 -->
  <line x1="540" y1="200" x2="540" y2="600" stroke="#f5d06f" stroke-width="2" stroke-dasharray="7 6" filter="url(#glow)"/>
  <rect x="430" y="600" width="220" height="34" rx="17" fill="#f5d06f" fill-opacity="0.14" stroke="#f5d06f" stroke-opacity="0.6"/>
  <text x="540" y="624" fill="#f5d06f" font-family="sans-serif" font-size="17" text-anchor="middle">手感临界 ≈ 70℃，落在安全区中段</text>

  <!-- 轴 -->
  <line x1="90" y1="640" x2="990" y2="640" stroke="#3b5077" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#5b6f96" text-anchor="middle">
    <text x="90" y="666">30℃</text>
    <text x="371" y="666">55</text>
    <text x="540" y="666">70</text>
    <text x="652" y="666">80</text>
    <text x="821" y="666">95</text>
    <text x="934" y="666">105</text>
    <text x="990" y="666">110</text>
  </g>
  <text x="540" y="700" fill="#7c8db0" font-family="sans-serif" font-size="16" text-anchor="middle">壳温（℃）｜手感阈值与器件上限不在同一区间，所以"摸着很烫"永远问不出答案</text>
</svg>
