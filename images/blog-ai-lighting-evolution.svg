    <text x="115" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#22d3ee" filter="url(#glow)">SMART IoT</text>
    <text x="115" y="42" text-anchor="middle" font-size="10" fill="#94a3b8">智能物联网照明</text>
    <line x1="15" y1="52" x2="215" y2="52" stroke="#1e3a5f" stroke-width="0.5"/>
    <text x="20" y="68" font-size="9" fill="#64748b">CONTROL</text>
    <text x="140" y="68" font-size="9" fill="#22d3ee" text-anchor="end">APP / VOICE</text>
    <text x="20" y="84" font-size="9" fill="#64748b">DIMMING</text>
    <text x="140" y="84" font-size="9" fill="#22d3ee" text-anchor="end">SCHEDULED</text>
