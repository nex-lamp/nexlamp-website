<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a40" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="380" fill="#0a1628"/>
  <rect width="800" height="380" fill="url(#grid3)"/>
  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="monospace" font-size="16" fill="#64d2ff" filter="url(#glow3)">ZIGBEE DIMMING — FLICKER TROUBLESHOOTING</text>
  <text x="400" y="52" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a7fa8">Zigbee智能调光抖动 / 频闪排查流程</text>
  <!-- Flow nodes -->
  <!-- Node 1 -->
  <rect x="310" y="68" width="180" height="38" rx="6" fill="#0d2030" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="400" y="92" text-anchor="middle" font-family="monospace" font-size="12" fill="#00d4ff">发现调光时灯光抖动</text>
  <!-- Arrow down -->
  <line x1="400" y1="106" x2="400" y2="128" stroke="#4a7fa8" stroke-width="1.5"/>
  <polygon points="395,125 405,125 400,132" fill="#4a7fa8"/>
  <!-- Node 2 -->
  <rect x="270" y="132" width="260" height="38" rx="6" fill="#0d2030" stroke="#ffd666" stroke-width="1.5"/>
  <text x="400" y="156" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffd666">检查Zigbee跳数 ≤ 3跳？</text>
  <!-- Arrow YES -->
  <line x1="530" y1="151" x2="610" y2="151" stroke="#4af06f" stroke-width="1.5"/>
  <polygon points="607,146 617,151 607,156" fill="#4af06f"/>
  <text x="566" y="145" text-anchor="middle" font-family="monospace" font-size="10" fill="#4af06f">YES</text>
  <!-- Arrow NO down -->
  <line x1="400" y1="170" x2="400" y2="192" stroke="#ff4d4f" stroke-width="1.5"/>
  <polygon points="395,189 405,189 400,196" fill="#ff4d4f"/>
  <text x="415" y="185" font-family="monospace" font-size="10" fill="#ff4d4f">NO</text>
  <!-- Node 3 - left path (NO) -->
  <rect x="260" y="196" width="280" height="38" rx="6" fill="#1a0a0a" stroke="#ff7a30" stroke-width="1.5"/>
  <text x="400" y="220" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff7a30">增加中继节点 / 移近协调器</text>
  <!-- Node 3 - right path (YES) -->
  <rect x="618" y="132" width="150" height="38" rx="6" fill="#0d2030" stroke="#ffd666" stroke-width="1.5"/>
  <text x="693" y="148" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffd666">驱动支持</text>
  <text x="693" y="164" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffd666">Transition Time?</text>
  <!-- Arrow from right node -->
  <line x1="693" y1="170" x2="693" y2="240" stroke="#4a7fa8" stroke-width="1.5"/>
  <polygon points="688,237 698,237 693,244" fill="#4a7fa8"/>
  <text x="708" y="210" font-family="monospace" font-size="10" fill="#ff4d4f">NO</text>
  <!-- Fix node right -->
  <rect x="618" y="244" width="150" height="38" rx="6" fill="#1a0a0a" stroke="#ff7a30" stroke-width="1.5"/>
  <text x="693" y="260" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff7a30">更换支持渐变</text>
  <text x="693" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff7a30">曲线的驱动</text>
  <!-- Arrow from No left down -->
  <line x1="400" y1="234" x2="400" y2="256" stroke="#4a7fa8" stroke-width="1.5"/>
  <polygon points="395,253 405,253 400,260" fill="#4a7fa8"/>
  <!-- Node 4 -->
  <rect x="270" y="260" width="260" height="38" rx="6" fill="#0d2030" stroke="#ffd666" stroke-width="1.5"/>
  <text x="400" y="284" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffd666">PWM频率 ≥ 25kHz？</text>
  <!-- Arrow YES right -->
  <line x1="400" y1="298" x2="400" y2="320" stroke="#4af06f" stroke-width="1.5"/>
  <polygon points="395,317 405,317 400,324" fill="#4af06f"/>
  <!-- Final node -->
  <rect x="270" y="324" width="260" height="38" rx="6" fill="#0a2010" stroke="#4af06f" stroke-width="1.5"/>
  <text x="400" y="348" text-anchor="middle" font-family="monospace" font-size="12" fill="#4af06f" filter="url(#glow3)">✓ 调光稳定，护眼达标</text>
  <!-- Tuya recommend -->
  <rect x="30" y="290" width="200" height="50" rx="6" fill="#0d2030" stroke="#64d2ff" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="312" text-anchor="middle" font-family="monospace" font-size="10" fill="#64d2ff">推荐方案</text>
  <text x="130" y="328" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0c8e8">涂鸦Zigbee驱动内置</text>
  <text x="130" y="342" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0c8e8">渐变曲线，开箱即用</text>
  <text x="770" y="375" text-anchor="end" font-family="monospace" font-size="9" fill="#2a4a6a">nexlamp.com | 2026</text>
</svg>
