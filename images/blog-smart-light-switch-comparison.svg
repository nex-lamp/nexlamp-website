<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#06101e"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ec27e"/>
      <stop offset="100%" stop-color="#5b8c5a"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8b04a"/>
      <stop offset="100%" stop-color="#c88835"/>
    </linearGradient>
    <linearGradient id="err" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d96565"/>
      <stop offset="100%" stop-color="#a84040"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a3f" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="680" height="420" fill="url(#bg)"/>
  <rect width="680" height="420" fill="url(#grid)"/>

  <!-- Title -->
  <text x="340" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#7ec27e" font-weight="bold">智能灯 + 智能开关 4种方案对比图</text>
  <text x="340" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6a8290">SMART LIGHT + SWITCH - 4 SCHEMES COMPARISON</text>

  <!-- Card A -->
  <g transform="translate(30,90)">
    <rect width="145" height="290" rx="8" fill="#0f1e30" stroke="url(#err)" stroke-width="1.5"/>
    <text x="72" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#d96565" font-weight="bold">A 方案</text>
    <text x="72" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9fb4c4">智能灯 + 普通开关</text>
    <line x1="15" y1="62" x2="130" y2="62" stroke="#d96565" stroke-width="0.5" opacity="0.5"/>

    <!-- Diagram -->
    <circle cx="35" cy="90" r="14" fill="none" stroke="#7ec27e" stroke-width="1.5"/>
    <text x="35" y="95" text-anchor="middle" font-family="Consolas" font-size="9" fill="#7ec27e">灯</text>
    <line x1="49" y1="90" x2="75" y2="90" stroke="#9fb4c4" stroke-width="1.5"/>
    <rect x="75" y="78" width="30" height="24" fill="none" stroke="#9fb4c4" stroke-width="1.5"/>
    <text x="90" y="94" text-anchor="middle" font-family="Consolas" font-size="8" fill="#9fb4c4">开</text>

    <text x="72" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7ec27e">调光调色</text>
    <text x="72" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#d96565" font-weight="bold">X 关墙开=掉线</text>
    <text x="72" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#d96565">X 频繁重连</text>

    <rect x="20" y="220" width="105" height="50" fill="#2a1820" rx="4"/>
    <text x="72" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#d96565" font-weight="bold">不推荐</text>
    <text x="72" y="258" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#9fb4c4">坑太深，淘汰</text>
  </g>

  <!-- Card B -->
  <g transform="translate(190,90)">
    <rect width="145" height="290" rx="8" fill="#0f1e30" stroke="url(#warn)" stroke-width="1.5"/>
    <text x="72" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#e8b04a" font-weight="bold">B 方案</text>
    <text x="72" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9fb4c4">普通灯 + 智能开关</text>
    <line x1="15" y1="62" x2="130" y2="62" stroke="#e8b04a" stroke-width="0.5" opacity="0.5"/>

    <circle cx="35" cy="90" r="14" fill="none" stroke="#9fb4c4" stroke-width="1.5"/>
    <text x="35" y="95" text-anchor="middle" font-family="Consolas" font-size="9" fill="#9fb4c4">灯</text>
    <line x1="49" y1="90" x2="75" y2="90" stroke="#9fb4c4" stroke-width="1.5"/>
    <rect x="75" y="78" width="30" height="24" fill="none" stroke="#e8b04a" stroke-width="1.5"/>
    <text x="90" y="94" text-anchor="middle" font-family="Consolas" font-size="8" fill="#e8b04a">智</text>

    <text x="72" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7ec27e">远程控制</text>
    <text x="72" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#d96565">X 不能调色温</text>
    <text x="72" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#e8b04a">! 需预留零线</text>

    <rect x="20" y="220" width="105" height="50" fill="#2a2018" rx="4"/>
    <text x="72" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#e8b04a" font-weight="bold">出租房 / 简装</text>
    <text x="72" y="258" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#9fb4c4">成本低</text>
  </g>

  <!-- Card C -->
  <g transform="translate(350,90)">
    <rect width="145" height="290" rx="8" fill="#0f1e30" stroke="url(#ok)" stroke-width="1.5"/>
    <text x="72" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#7ec27e" font-weight="bold">C 方案</text>
    <text x="72" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9fb4c4">智能灯 + 凌动开关</text>
    <line x1="15" y1="62" x2="130" y2="62" stroke="#7ec27e" stroke-width="0.5" opacity="0.5"/>

    <circle cx="35" cy="90" r="14" fill="none" stroke="#7ec27e" stroke-width="1.5"/>
    <text x="35" y="95" text-anchor="middle" font-family="Consolas" font-size="9" fill="#7ec27e">灯</text>
    <line x1="49" y1="90" x2="75" y2="90" stroke="#7ec27e" stroke-width="1.5"/>
    <rect x="75" y="78" width="30" height="24" fill="none" stroke="#7ec27e" stroke-width="1.5"/>
    <text x="90" y="94" text-anchor="middle" font-family="Consolas" font-size="8" fill="#7ec27e">灵</text>

    <text x="72" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7ec27e">调光+不掉线</text>
    <text x="72" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7ec27e">关墙开=切场景</text>
    <text x="72" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#e8b04a">! 成本高</text>

    <rect x="20" y="220" width="105" height="50" fill="#1a2a1f" rx="4"/>
    <text x="72" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7ec27e" font-weight="bold">新装修/品质党</text>
    <text x="72" y="258" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#9fb4c4">最稳方案</text>
  </g>

  <!-- Card D -->
  <g transform="translate(510,90)">
    <rect width="145" height="290" rx="8" fill="#0f1e30" stroke="url(#ok)" stroke-width="1.5"/>
    <text x="72" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#7ec27e" font-weight="bold">D 方案</text>
    <text x="72" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9fb4c4">智能灯 + 无线开关</text>
    <line x1="15" y1="62" x2="130" y2="62" stroke="#7ec27e" stroke-width="0.5" opacity="0.5"/>

    <circle cx="35" cy="90" r="14" fill="none" stroke="#7ec27e" stroke-width="1.5"/>
    <text x="35" y="95" text-anchor="middle" font-family="Consolas" font-size="9" fill="#7ec27e">灯</text>
    <line x1="49" y1="90" x2="65" y2="90" stroke="#7ec27e" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="65" y1="90" x2="65" y2="60" stroke="#7ec27e" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="65" y1="60" x2="90" y2="60" stroke="#7ec27e" stroke-width="1.5" stroke-dasharray="2 2"/>
    <rect x="75" y="68" width="30" height="24" fill="none" stroke="#7ec27e" stroke-width="1.5"/>
    <text x="90" y="84" text-anchor="middle" font-family="Consolas" font-size="8" fill="#7ec27e">无</text>

    <text x="72" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7ec27e">灵活扩展</text>
    <text x="72" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7ec27e">随意贴位置</text>
    <text x="72" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#e8b04a">! 需Zigbee网关</text>

    <rect x="20" y="220" width="105" height="50" fill="#1a2a1f" rx="4"/>
    <text x="72" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7ec27e" font-weight="bold">主流方案</text>
    <text x="72" y="258" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#9fb4c4">推荐</text>
  </g>

  <!-- Bottom note -->
  <text x="340" y="400" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#6a8290">耐利普科技 NEXLAMP | 涂鸦Zigbee智能照明方案专家 | 13825496855</text>
</svg>
