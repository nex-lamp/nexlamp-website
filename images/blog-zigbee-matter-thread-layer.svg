<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#111d35"/>
    </linearGradient>
    <linearGradient id="matter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00e0b8"/>
    </linearGradient>
    <linearGradient id="zigbee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff8555"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#6db5ff"/>
    </linearGradient>
    <linearGradient id="wifi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="480" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#4a9eff">
    <line x1="0" y1="0" x2="680" y2="0" stroke-width="0.5"/><line x1="0" y1="40" x2="680" y2="40" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="680" y2="80" stroke-width="0.5"/><line x1="0" y1="120" x2="680" y2="120" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="680" y2="160" stroke-width="0.5"/><line x1="0" y1="200" x2="680" y2="200" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="680" y2="240" stroke-width="0.5"/><line x1="0" y1="280" x2="680" y2="280" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="680" y2="320" stroke-width="0.5"/><line x1="0" y1="360" x2="680" y2="360" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="680" y2="400" stroke-width="0.5"/><line x1="0" y1="440" x2="680" y2="440" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="480" stroke-width="0.5"/><line x1="40" y1="0" x2="40" y2="480" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="480" stroke-width="0.5"/><line x1="120" y1="0" x2="120" y2="480" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="480" stroke-width="0.5"/><line x1="200" y1="0" x2="200" y2="480" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="480" stroke-width="0.5"/><line x1="280" y1="0" x2="280" y2="480" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="480" stroke-width="0.5"/><line x1="360" y1="0" x2="360" y2="480" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="480" stroke-width="0.5"/><line x1="440" y1="0" x2="440" y2="480" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="480" stroke-width="0.5"/><line x1="520" y1="0" x2="520" y2="480" stroke-width="0.5"/>
    <line x1="560" y1="0" x2="560" y2="480" stroke-width="0.5"/><line x1="600" y1="0" x2="600" y2="480" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="480" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="340" y="38" text-anchor="middle" font-family="monospace" font-size="18" fill="#00d4aa" filter="url(#glow)" font-weight="bold">智能照明协议栈层级关系图</text>

  <!-- Application Layer Section -->
  <rect x="20" y="58" width="640" height="170" rx="8" fill="#0d1f3c" stroke="#00d4aa" stroke-width="1.5" opacity="0.9"/>
  <text x="40" y="82" font-family="monospace" font-size="13" fill="#00d4aa" font-weight="bold">应用层 (Application Layer) — 决定设备说什么语言</text>

  <!-- Matter Box -->
  <rect x="60" y="98" width="270" height="110" rx="6" fill="#0a1a2f" stroke="#00d4aa" stroke-width="2" filter="url(#glow)"/>
  <text x="195" y="122" text-anchor="middle" font-family="monospace" font-size="16" fill="#00d4aa" font-weight="bold">Matter</text>
  <text x="195" y="144" text-anchor="middle" font-family="monospace" font-size="11" fill="#88ccbb">跨生态"通用语言"</text>
  <text x="195" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#5a8899">Apple Home · Google Home · Alexa</text>
  <text x="195" y="186" text-anchor="middle" font-family="monospace" font-size="10" fill="#5a8899">HomeKit · SmartThings</text>

  <!-- Zigbee App Box -->
  <rect x="360" y="98" width="270" height="110" rx="6" fill="#1a0f0a" stroke="#ff6b35" stroke-width="2"/>
  <text x="495" y="122" text-anchor="middle" font-family="monospace" font-size="16" fill="#ff6b35" font-weight="bold">Zigbee</text>
  <text x="495" y="144" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc8866">完整通信方案</text>
  <text x="495" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#996655">网络层 + 应用层一体</text>
  <text x="495" y="186" text-anchor="middle" font-family="monospace" font-size="10" fill="#996655">自含ZCL（Zigbee Cluster Library）</text>

  <!-- Bridge/Arrow between layers -->
  <line x1="340" y1="235" x2="340" y2="295" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <polygon points="332,288 340,300 348,288" fill="#aaa"/>
  
  <!-- Network Layer Section -->
  <rect x="20" y="305" width="640" height="155" rx="8" fill="#0d1f3c" stroke="#4a9eff" stroke-width="1.5" opacity="0.9"/>
  <text x="40" y="329" font-family="monospace" font-size="13" fill="#4a9eff" font-weight="bold">网络层 (Network Layer) — 决定数据怎么传输</text>

  <!-- Thread Box -->
  <rect x="60" y="344" width="185" height="95" rx="6" fill="#0a1528" stroke="#4a9eff" stroke-width="2" filter="url(#glow)"/>
  <text x="152" y="368" text-anchor="middle" font-family="monospace" font-size="15" fill="#4a9eff" font-weight="bold">Thread</text>
  <text x="152" y="390" text-anchor="middle" font-family="monospace" font-size="10" fill="#7799cc">基于 802.15.4</text>
  <text x="152" y="408" text-anchor="middle" font-family="monospace" font-size="10" fill="#7799cc">原生 IPv6 Mesh</text>
  <text x="152" y="426" text-anchor="middle" font-family="monospace" font-size="10" fill="#5577aa">Matter的"推荐通道"</text>

  <!-- Zigbee Network Box -->
  <rect x="260" y="344" width="185" height="95" rx="6" fill="#1a0f0a" stroke="#ff6b35" stroke-width="2"/>
  <text x="352" y="368" text-anchor="middle" font-family="monospace" font-size="15" fill="#ff6b35" font-weight="bold">Zigbee Mesh</text>
  <text x="352" y="390" text-anchor="middle" font-family="monospace" font-size="10" fill="#cc8866">基于 802.15.4</text>
  <text x="352" y="408" text-anchor="middle" font-family="monospace" font-size="10" fill="#cc8866">自组网 Mesh</text>
  <text x="352" y="426" text-anchor="middle" font-family="monospace" font-size="10" fill="#996655">20年成熟方案</text>

  <!-- Wi-Fi Box -->
  <rect x="460" y="344" width="170" height="95" rx="6" fill="#110f1a" stroke="#a78bfa" stroke-width="2"/>
  <text x="545" y="368" text-anchor="middle" font-family="monospace" font-size="15" fill="#a78bfa" font-weight="bold">Wi-Fi</text>
  <text x="545" y="390" text-anchor="middle" font-family="monospace" font-size="10" fill="#aa99cc">802.11 标准</text>
  <text x="545" y="408" text-anchor="middle" font-family="monospace" font-size="10" fill="#aa99cc">高带宽传输</text>
  <text x="545" y="426" text-anchor="middle" font-family="monospace" font-size="10" fill="#8877aa">Matter也支持Wi-Fi直连</text>

  <!-- Key insight at bottom -->
  <text x="340" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a8899">Zigbee = 网络层 + 应用层（一体）    |    Matter = 纯应用层（需要 Thread/Wi-Fi 承载）</text>
</svg>