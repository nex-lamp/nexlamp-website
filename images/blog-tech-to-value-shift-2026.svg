<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%"><stop offset="0%" stop-color="#0d1f3c"/><stop offset="100%" stop-color="#0a1628"/></radialGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#00d4aa"/></linearGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="680" height="340" fill="url(#bg3)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#4a9eff">
    <line x1="0" y1="68" x2="680" y2="68"/><line x1="0" y1="136" x2="680" y2="136"/>
    <line x1="0" y1="204" x2="680" y2="204"/><line x1="0" y1="272" x2="680" y2="272"/>
  </g>

  <!-- Title -->
  <rect x="0" y="0" width="680" height="40" fill="#0d1a30" opacity="0.9"/>
  <text x="16" y="26" fill="#4a9eff" font-family="Consolas,monospace" font-size="13">[光亚展2026] 行业范式转移：技术驱动 → 价值驱动</text>

  <!-- Arrow -->
  <rect x="100" y="156" width="480" height="6" rx="3" fill="url(#arrowGrad)" opacity="0.8"/>
  <polygon points="590,152 610,159 590,166" fill="#00d4aa" opacity="0.8"/>

  <!-- Left side: 技术驱动 -->
  <text x="110" y="138" fill="#ff6b6b" font-family="Microsoft YaHei,sans-serif" font-size="16" filter="url(#glow3)">技术驱动（过去）</text>

  <rect x="50" y="180" width="250" height="42" rx="5" fill="#1a1030" stroke="#ff6b6b" stroke-width="1" opacity="0.7"/>
  <text x="65" y="197" fill="#8899aa" font-family="Consolas,monospace" font-size="11">❌ 比拼参数：多少流明、多少Ra</text>
  <text x="65" y="213" fill="#667788" font-family="Consolas,monospace" font-size="10">结果：参数很高，用户还是不满意</text>

  <rect x="50" y="230" width="250" height="42" rx="5" fill="#1a1030" stroke="#ff6b6b" stroke-width="1" opacity="0.7"/>
  <text x="65" y="247" fill="#8899aa" font-family="Consolas,monospace" font-size="11">❌ 人学习系统：学协议、设场景</text>
  <text x="65" y="263" fill="#667788" font-family="Consolas,monospace" font-size="10">结果：老人小孩学不会，直接放弃</text>

  <rect x="50" y="280" width="250" height="42" rx="5" fill="#1a1030" stroke="#ff6b6b" stroke-width="1" opacity="0.7"/>
  <text x="65" y="297" fill="#8899aa" font-family="Consolas,monospace" font-size="11">❌ 生态封闭：品牌绑架用户</text>
  <text x="65" y="313" fill="#667788" font-family="Consolas,monospace" font-size="10">结果：买A品牌只能用A品牌设备</text>

  <!-- Right side: 价值驱动 -->
  <text x="430" y="138" fill="#00d4aa" font-family="Microsoft YaHei,sans-serif" font-size="16" filter="url(#glow3)">价值驱动（2026）</text>

  <rect x="380" y="180" width="250" height="42" rx="5" fill="#102a20" stroke="#00d4aa" stroke-width="1" opacity="0.7"/>
  <text x="395" y="197" fill="#aaddcc" font-family="Consolas,monospace" font-size="11">✅ 关注体验：掉不掉线、好不好用</text>
  <text x="395" y="213" fill="#779988" font-family="Consolas,monospace" font-size="10">结果：全家稳定使用，零投诉</text>

  <rect x="380" y="230" width="250" height="42" rx="5" fill="#102a20" stroke="#00d4aa" stroke-width="1" opacity="0.7"/>
  <text x="395" y="247" fill="#aaddcc" font-family="Consolas,monospace" font-size="11">✅ 系统理解人：AI自动学习习惯</text>
  <text x="395" y="263" fill="#779988" font-family="Consolas,monospace" font-size="10">结果：不需要学，灯自己会调</text>

  <rect x="380" y="280" width="250" height="42" rx="5" fill="#102a20" stroke="#00d4aa" stroke-width="1" opacity="0.7"/>
  <text x="395" y="297" fill="#aaddcc" font-family="Consolas,monospace" font-size="11">✅ Matter统一：跨品牌自由选择</text>
  <text x="395" y="313" fill="#779988" font-family="Consolas,monospace" font-size="10">结果：不被任何品牌绑定</text>

  <!-- Top annotation -->
  <rect x="230" y="56" width="220" height="22" rx="11" fill="#0d1f3c" stroke="#4a9eff" stroke-width="1"/>
  <text x="340" y="71" fill="#4a9eff" font-family="Microsoft YaHei,sans-serif" font-size="10" text-anchor="middle">不是降级，是成熟 — 智能照明进入大众消费</text>
</svg>