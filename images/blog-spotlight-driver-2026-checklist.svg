<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Consolas, Monaco, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1b30"/>
    </linearGradient>
    <linearGradient id="okGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00cc66" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>

  <text x="400" y="40" text-anchor="middle" fill="#5db8e8" font-size="20" font-weight="bold">射灯驱动选购自检清单</text>
  <text x="400" y="62" text-anchor="middle" fill="#4a7a9a" font-size="11">数据来源：NEXLAMP工程经验 | 2026版</text>

  <!-- 终端窗口 -->
  <rect x="30" y="80" width="740" height="460" rx="8" fill="#0d1f38" stroke="#1a3a5a" stroke-width="1"/>
  <rect x="30" y="80" width="740" height="28" rx="8" fill="#102a48"/>
  <circle cx="48" cy="94" r="5" fill="#ff5f56"/>
  <circle cx="66" cy="94" r="5" fill="#ffbd2e"/>
  <circle cx="84" cy="94" r="5" fill="#27c93f"/>
  <text x="400" y="98" text-anchor="middle" fill="#4a7a9a" font-size="11">spotlight_driver_checklist --2026</text>

  <!-- 清单项 -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="680" height="70" rx="8" fill="#0d1a2a" stroke="#1a3a5a" stroke-width="1"/>
    <circle cx="30" cy="35" r="18" fill="#0d2a1a" stroke="#00cc66" stroke-width="2"/>
    <text x="30" y="41" text-anchor="middle" fill="#00ff88" font-size="18" font-weight="bold">1</text>
    <text x="65" y="26" fill="#00ccff" font-size="14" font-weight="bold">核对电流电压匹配</text>
    <text x="65" y="46" fill="#8899aa" font-size="11">驱动输出电流 = 灯具额定电流mA，电压范围覆盖灯具Vf±15%</text>
    <text x="65" y="60" fill="#ffaa66" font-size="10">坑：只看瓦数不看电流 → 灯珠过流早衰或亮度不足</text>
  </g>

  <g transform="translate(60, 210)">
    <rect x="0" y="0" width="680" height="70" rx="8" fill="#0d1a2a" stroke="#1a3a5a" stroke-width="1"/>
    <circle cx="30" cy="35" r="18" fill="#0d2a1a" stroke="#00cc66" stroke-width="2"/>
    <text x="30" y="41" text-anchor="middle" fill="#00ff88" font-size="18" font-weight="bold">2</text>
    <text x="65" y="26" fill="#00ccff" font-size="14" font-weight="bold">确认调光协议一致</text>
    <text x="65" y="46" fill="#8899aa" font-size="11">TRIAC/0-10V/DALI/PWM/Zigbee，控制器和驱动必须是同一种</text>
    <text x="65" y="60" fill="#ffaa66" font-size="10">坑：协议混搭 → 调光闪烁、最低亮度启亮困难</text>
  </g>

  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="680" height="70" rx="8" fill="#0d1a2a" stroke="#1a3a5a" stroke-width="1"/>
    <circle cx="30" cy="35" r="18" fill="#0d2a1a" stroke="#00cc66" stroke-width="2"/>
    <text x="30" y="41" text-anchor="middle" fill="#00ff88" font-size="18" font-weight="bold">3</text>
    <text x="65" y="26" fill="#00ccff" font-size="14" font-weight="bold">家用优先选隔离型驱动</text>
    <text x="65" y="46" fill="#8899aa" font-size="11">密闭吊顶、卧室、儿童房、潮湿区域必须隔离，耐压≥3750VAC</text>
    <text x="65" y="60" fill="#ffaa66" font-size="10">坑：非隔离驱动进吊顶 → 发热大、有触电隐患</text>
  </g>

  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="680" height="70" rx="8" fill="#0d1a2a" stroke="#1a3a5a" stroke-width="1"/>
    <circle cx="30" cy="35" r="18" fill="#0d2a1a" stroke="#00cc66" stroke-width="2"/>
    <text x="30" y="41" text-anchor="middle" fill="#00ff88" font-size="18" font-weight="bold">4</text>
    <text x="65" y="26" fill="#00ccff" font-size="14" font-weight="bold">同一空间统一品牌和批次</text>
    <text x="65" y="46" fill="#8899aa" font-size="11">同一回路用同系列驱动，保证光色一致和调光同步</text>
    <text x="65" y="60" fill="#ffaa66" font-size="10">坑：品牌混搭 → 同一面墙色温偏差、调光不同步</text>
  </g>

  <g transform="translate(60, 450)">
    <rect x="0" y="0" width="680" height="70" rx="8" fill="#0d1a2a" stroke="#1a3a5a" stroke-width="1"/>
    <circle cx="30" cy="35" r="18" fill="#0d2a1a" stroke="#00cc66" stroke-width="2"/>
    <text x="30" y="41" text-anchor="middle" fill="#00ff88" font-size="18" font-weight="bold">5</text>
    <text x="65" y="26" fill="#00ccff" font-size="14" font-weight="bold">查认证、频闪和显色指数</text>
    <text x="65" y="46" fill="#8899aa" font-size="11">3C认证打底，FI≤0.05更护眼，家用Ra≥90/商业Ra≥95</text>
    <text x="65" y="60" fill="#ffaa66" font-size="10">坑：只看光束角和芯片品牌 → 实际体验差、易眼疲劳</text>
  </g>
</svg>