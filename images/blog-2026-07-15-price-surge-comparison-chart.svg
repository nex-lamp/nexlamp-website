<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="barRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#cc3333"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa552"/>
      <stop offset="100%" stop-color="#cc7a30"/>
    </linearGradient>
    <linearGradient id="barYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="100%" stop-color="#ccb830"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6db4ff"/>
      <stop offset="100%" stop-color="#2a6dba"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.4">
    <line x1="80" y1="100" x2="750" y2="100"/>
    <line x1="80" y1="180" x2="750" y2="180"/>
    <line x1="80" y1="260" x2="750" y2="260"/>
    <line x1="80" y1="340" x2="750" y2="340"/>
    <line x1="80" y1="420" x2="750" y2="420"/>
  </g>

  <!-- Y axis -->
  <line x1="80" y1="80" x2="80" y2="420" stroke="#3a5070" stroke-width="1.5"/>
  <line x1="80" y1="420" x2="750" y2="420" stroke="#3a5070" stroke-width="1.5"/>

  <!-- Y axis labels -->
  <text x="70" y="425" text-anchor="end" fill="#708090" font-size="11">0%</text>
  <text x="70" y="345" text-anchor="end" fill="#708090" font-size="11">20%</text>
  <text x="70" y="265" text-anchor="end" fill="#708090" font-size="11">40%</text>
  <text x="70" y="185" text-anchor="end" fill="#708090" font-size="11">60%</text>
  <text x="70" y="105" text-anchor="end" fill="#708090" font-size="11">80%</text>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">各环节涨价幅度对比</text>
  <text x="400" y="55" text-anchor="middle" fill="#708090" font-size="12">从上游原材料到终端灯具的涨幅传导（2026年1-6月累计）</text>

  <!-- Bars -->
  <!-- Silver price -->
  <g filter="url(#glow3)">
    <rect x="120" y="100" width="80" height="320" rx="4" fill="url(#barRed)" opacity="0.9"/>
    <text x="160" y="95" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">+170%</text>
    <text x="160" y="445" text-anchor="middle" fill="#e0e0e0" font-size="12">银价</text>
    <text x="160" y="462" text-anchor="middle" fill="#708090" font-size="10">原材料</text>
  </g>

  <!-- Gold price -->
  <g filter="url(#glow3)">
    <rect x="240" y="256" width="80" height="164" rx="4" fill="url(#barRed)" opacity="0.8"/>
    <text x="280" y="251" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">+70%</text>
    <text x="280" y="445" text-anchor="middle" fill="#e0e0e0" font-size="12">金价</text>
    <text x="280" y="462" text-anchor="middle" fill="#708090" font-size="10">原材料</text>
  </g>

  <!-- Driver chip -->
  <g filter="url(#glow3)">
    <rect x="360" y="184" width="80" height="236" rx="4" fill="url(#barOrange)" opacity="0.9"/>
    <text x="400" y="179" text-anchor="middle" fill="#ffa552" font-size="14" font-weight="bold">+30-80%</text>
    <text x="400" y="445" text-anchor="middle" fill="#e0e0e0" font-size="12">驱动芯片</text>
    <text x="400" y="462" text-anchor="middle" fill="#708090" font-size="10">集创/富满微</text>
  </g>

  <!-- Driver power -->
  <g filter="url(#glow3)">
    <rect x="480" y="356" width="80" height="64" rx="4" fill="url(#barYellow)" opacity="0.9"/>
    <text x="520" y="351" text-anchor="middle" fill="#ffe66d" font-size="13" font-weight="bold">+5-15%</text>
    <text x="520" y="445" text-anchor="middle" fill="#e0e0e0" font-size="12">驱动电源</text>
    <text x="520" y="462" text-anchor="middle" fill="#708090" font-size="10">英飞特等</text>
  </g>

  <!-- Smart lamp -->
  <g filter="url(#glow3)">
    <rect x="600" y="376" width="80" height="44" rx="4" fill="url(#barBlue)" opacity="0.9"/>
    <text x="640" y="371" text-anchor="middle" fill="#6db4ff" font-size="13" font-weight="bold">+3-10%</text>
    <text x="640" y="445" text-anchor="middle" fill="#e0e0e0" font-size="12">智能灯具</text>
    <text x="640" y="462" text-anchor="middle" fill="#708090" font-size="10">三雄/欧瑞博</text>
  </g>

  <!-- Trend arrow -->
  <path d="M 160 85 Q 400 70 640 360" stroke="#4a9eff" stroke-width="1.5" fill="none" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="420" y="72" text-anchor="middle" fill="#4a9eff" font-size="10" opacity="0.7">涨价幅度逐级衰减 ↓</text>

  <!-- Bottom annotation -->
  <rect x="100" y="475" width="600" height="20" rx="4" fill="#0d1f3a" stroke="#1a3050" stroke-width="0.5"/>
  <text x="400" y="490" text-anchor="middle" fill="#506070" font-size="10">芯片端涨幅最大（30-80%），但传导到终端灯具时衰减至3-10% | NEXLAMP整理</text>
</svg>
