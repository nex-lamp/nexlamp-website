<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e0e8f0" font-family="monospace" font-size="16" font-weight="bold">
    SMART LIGHTING SECURITY CHECKLIST
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#5a8ab0" font-family="monospace" font-size="10">
    // 5 Actionable Steps for Buyers &#38; Users
  </text>

  <!-- Checklist Item 1 -->
  <g transform="translate(50, 80)">
    <rect width="340" height="130" rx="8" fill="#0d1f3a" stroke="#00ff88" stroke-width="1.5" opacity="0.9"/>
    <circle cx="30" cy="30" r="16" fill="#00ff88" opacity="0.2" filter="url(#glow3)"/>
    <circle cx="30" cy="30" r="13" fill="#0d1f3a" stroke="#00ff88" stroke-width="2"/>
    <path d="M 24,30 L 28,34 L 37,25" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="28" fill="#00ff88" font-family="monospace" font-size="11" font-weight="bold">[ PURCHASE ] Certification</text>
    <text x="55" y="48" fill="#a0b8d0" font-family="monospace" font-size="9">- CCC + EMC certified brands only</text>
    <text x="55" y="62" fill="#a0b8d0" font-family="monospace" font-size="9">- WPA3 encryption support</text>
    <text x="55" y="76" fill="#a0b8d0" font-family="monospace" font-size="9">- 3-year firmware update promise</text>
    <text x="55" y="96" fill="#6088a0" font-family="monospace" font-size="8" font-style="italic">NEXLAMP: CCC+EMC, OTA supported</text>
    <text x="55" y="112" fill="#3a6090" font-family="monospace" font-size="7">REJECT: no-name, uncertified, no-update</text>
  </g>

  <!-- Checklist Item 2 -->
  <g transform="translate(410, 80)">
    <rect width="340" height="130" rx="8" fill="#0d1f3a" stroke="#5a9aff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="30" cy="30" r="16" fill="#5a9aff" opacity="0.2" filter="url(#glow3)"/>
    <circle cx="30" cy="30" r="13" fill="#0d1f3a" stroke="#5a9aff" stroke-width="2"/>
    <path d="M 24,30 L 28,34 L 37,25" fill="none" stroke="#5a9aff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="28" fill="#5a9aff" font-family="monospace" font-size="11" font-weight="bold">[ PURCHASE ] Protocol Choice</text>
    <text x="55" y="48" fill="#a0b8d0" font-family="monospace" font-size="9">- Zigbee AES-128 &#62; WiFi (often)</text>
    <text x="55" y="62" fill="#a0b8d0" font-family="monospace" font-size="9">- Local gateway (Home Assistant)</text>
    <text x="55" y="76" fill="#a0b8d0" font-family="monospace" font-size="9">- Avoid cloud-only architecture</text>
    <text x="55" y="96" fill="#6088a0" font-family="monospace" font-size="8" font-style="italic">Zigbee + local hub = best security</text>
    <text x="55" y="112" fill="#3a6090" font-family="monospace" font-size="7">AVOID: BLE-only pairing, cloud-dependent</text>
  </g>

  <!-- Checklist Item 3 -->
  <g transform="translate(50, 230)">
    <rect width="340" height="110" rx="8" fill="#0d1f3a" stroke="#ffcc00" stroke-width="1.5" opacity="0.9"/>
    <circle cx="30" cy="30" r="16" fill="#ffcc00" opacity="0.2" filter="url(#glow3)"/>
    <circle cx="30" cy="30" r="13" fill="#0d1f3a" stroke="#ffcc00" stroke-width="2"/>
    <path d="M 24,30 L 28,34 L 37,25" fill="none" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="28" fill="#ffcc00" font-family="monospace" font-size="11" font-weight="bold">[ SETUP ] Change Default Password</text>
    <text x="55" y="48" fill="#a0b8d0" font-family="monospace" font-size="9">- First action after install</text>
    <text x="55" y="62" fill="#a0b8d0" font-family="monospace" font-size="9">- Min 12 chars: upper+lower+digits+symbols</text>
    <text x="55" y="76" fill="#a0b8d0" font-family="monospace" font-size="9">- Unique per device, never reuse</text>
    <text x="55" y="96" fill="#ff6666" font-family="monospace" font-size="8" font-style="italic">! admin/123456 = 5 min to hijack</text>
  </g>

  <!-- Checklist Item 4 -->
  <g transform="translate(410, 230)">
    <rect width="340" height="110" rx="8" fill="#0d1f3a" stroke="#ff8800" stroke-width="1.5" opacity="0.9"/>
    <circle cx="30" cy="30" r="16" fill="#ff8800" opacity="0.2" filter="url(#glow3)"/>
    <circle cx="30" cy="30" r="13" fill="#0d1f3a" stroke="#ff8800" stroke-width="2"/>
    <path d="M 24,30 L 28,34 L 37,25" fill="none" stroke="#ff8800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="28" fill="#ff8800" font-family="monospace" font-size="11" font-weight="bold">[ NETWORK ] IoT VLAN Isolation</text>
    <text x="55" y="48" fill="#a0b8d0" font-family="monospace" font-size="9">- Router guest network for all IoT</text>
    <text x="55" y="62" fill="#a0b8d0" font-family="monospace" font-size="9">- Separate from phone/PC network</text>
    <text x="55" y="76" fill="#a0b8d0" font-family="monospace" font-size="9">- Blocks lateral movement if breached</text>
    <text x="55" y="96" fill="#6088a0" font-family="monospace" font-size="8" font-style="italic">Even if bulb hacked &#8594; PC is safe</text>
  </g>

  <!-- Checklist Item 5 (centered, bottom) -->
  <g transform="translate(180, 360)">
    <rect width="440" height="110" rx="8" fill="#0d1f3a" stroke="#ff4444" stroke-width="1.5" opacity="0.9"/>
    <circle cx="30" cy="30" r="16" fill="#ff4444" opacity="0.2" filter="url(#glow3)"/>
    <circle cx="30" cy="30" r="13" fill="#0d1f3a" stroke="#ff4444" stroke-width="2"/>
    <path d="M 24,30 L 28,34 L 37,25" fill="none" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="28" fill="#ff4444" font-family="monospace" font-size="11" font-weight="bold">[ MAINTENANCE ] Monthly Firmware Check</text>
    <text x="55" y="48" fill="#a0b8d0" font-family="monospace" font-size="9">- Check App for updates every month</text>
    <text x="55" y="62" fill="#a0b8d0" font-family="monospace" font-size="9">- Tapo L535E &#8594; fw 1.4.1+ | Hue Bridge &#8594; latest patch</text>
    <text x="55" y="76" fill="#a0b8d0" font-family="monospace" font-size="9">- Follow vendor security advisories (CVE alerts)</text>
    <text x="55" y="96" fill="#ff6666" font-family="monospace" font-size="8" font-style="italic">! No auto-OTA on most smart bulbs = manual check required</text>
  </g>

  <!-- Footer -->
  <text x="400" y="490" text-anchor="middle" fill="#3a5070" font-family="monospace" font-size="7">
    PRINT THIS CHECKLIST | SHARE WITH FAMILY | NEXLAMP SECURITY GUIDE 2026
  </text>
</svg>
