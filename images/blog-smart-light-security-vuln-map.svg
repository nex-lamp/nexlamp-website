<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1e3a"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffaa00;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#44ff88;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3333"/>
      <stop offset="100%" style="stop-color:#ff6644"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#ff0000" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="400" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.15">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4488ff" stroke-width="0.5"/>
    </pattern>
    <rect width="680" height="400" fill="url(#grid)"/>
  </g>

  <!-- PCB Board outline -->
  <rect x="80" y="60" width="520" height="280" rx="8" fill="#0d1117" stroke="#334455" stroke-width="2" opacity="0.9"/>
  <rect x="85" y="65" width="510" height="270" rx="6" fill="none" stroke="#1a2a3a" stroke-width="1"/>

  <!-- Circuit traces -->
  <g stroke="url(#circuitGrad)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 100 200 L 160 200 L 160 140 L 220 140"/>
    <path d="M 220 140 L 280 140 L 280 200 L 340 200"/>
    <path d="M 340 200 L 340 260 L 400 260"/>
    <path d="M 400 260 L 460 260 L 460 180 L 520 180"/>
    <path d="M 100 240 L 150 240 L 150 300 L 300 300"/>
    <path d="M 520 180 L 560 180 L 560 120"/>
  </g>

  <!-- MCU chip -->
  <rect x="180" y="100" width="80" height="80" rx="4" fill="#1a2030" stroke="#44aaff" stroke-width="2" filter="url(#glow)"/>
  <text x="220" y="130" font-family="monospace" font-size="10" fill="#44aaff" text-anchor="middle">MCU</text>
  <text x="220" y="148" font-family="monospace" font-size="7" fill="#66ccff" text-anchor="middle">Zigbee</text>
  <text x="220" y="160" font-family="monospace" font-size="7" fill="#66ccff" text-anchor="middle">BLE</text>

  <!-- Debug interface - DANGER -->
  <rect x="300" y="190" width="60" height="30" rx="3" fill="#ff2222" stroke="#ff4444" stroke-width="2" filter="url(#redGlow)"/>
  <text x="330" y="210" font-family="monospace" font-size="8" fill="#ffffff" text-anchor="middle">UART</text>
  <text x="330" y="218" font-family="monospace" font-size="6" fill="#ffaaaa" text-anchor="middle">SWD</text>

  <!-- Danger indicator arrows -->
  <g filter="url(#redGlow)">
    <line x1="330" y1="170" x2="330" y2="188" stroke="#ff3333" stroke-width="2" marker-end="none"/>
    <text x="330" y="168" font-family="sans-serif" font-size="9" fill="#ff3333" text-anchor="middle">⚠ 调试口</text>
  </g>

  <!-- OTA module -->
  <rect x="420" y="160" width="100" height="60" rx="4" fill="#1a1a30" stroke="#ffaa00" stroke-width="2" filter="url(#glow)"/>
  <text x="470" y="185" font-family="monospace" font-size="9" fill="#ffaa00" text-anchor="middle">OTA</text>
  <text x="470" y="200" font-family="monospace" font-size="7" fill="#ffcc44" text-anchor="middle">升级通道</text>
  <text x="470" y="213" font-family="monospace" font-size="6" fill="#ff6644" text-anchor="middle">CRC only!</text>

  <!-- Flash memory -->
  <rect x="140" y="230" width="70" height="40" rx="3" fill="#1a2030" stroke="#44ff88" stroke-width="1.5"/>
  <text x="175" y="255" font-family="monospace" font-size="8" fill="#44ff88" text-anchor="middle">Flash</text>
  <text x="175" y="265" font-family="monospace" font-size="6" fill="#88ffcc" text-anchor="middle">密钥明文</text>

  <!-- Hacker intrusion visual -->
  <g opacity="0.8">
    <circle cx="590" y="100" r="30" fill="none" stroke="#ff3333" stroke-width="2" filter="url(#redGlow)" cx="590" cy="100"/>
    <text x="590" y="95" font-family="sans-serif" font-size="20" fill="#ff3333" text-anchor="middle" filter="url(#redGlow)">👤</text>
    <text x="590" y="115" font-family="monospace" font-size="8" fill="#ff4444" text-anchor="middle">黑客</text>
    <line x1="560" y1="100" x2="370" y2="190" stroke="#ff3333" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>
  </g>

  <!-- Attack path labels -->
  <g font-family="sans-serif" font-size="9" fill="#ff6644">
    <text x="260" y="175" text-anchor="middle">① 串口入侵</text>
    <text x="370" y="240" text-anchor="middle">② OTA注入</text>
    <text x="175" y="280" text-anchor="middle">③ 固件逆向</text>
  </g>

  <!-- Title -->
  <text x="340" y="38" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">智能灯驱动电源3大安全盲区</text>
  <text x="340" y="54" font-family="monospace" font-size="10" fill="#4488ff" text-anchor="middle">Hardware Security Vulnerabilities in LED Driver PCB</text>

  <!-- Bottom legend -->
  <g transform="translate(100, 350)">
    <rect width="12" height="12" fill="#ff2222" rx="2"/>
    <text x="18" y="11" font-family="sans-serif" font-size="9" fill="#aaaaaa">高危漏洞</text>
    <rect x="80" width="12" height="12" fill="#ffaa00" rx="2"/>
    <text x="98" y="11" font-family="sans-serif" font-size="9" fill="#aaaaaa">中危风险</text>
    <rect x="160" width="12" height="12" fill="#44ff88" rx="2"/>
    <text x="178" y="11" font-family="sans-serif" font-size="9" fill="#aaaaaa">关键组件</text>
  </g>
</svg>
