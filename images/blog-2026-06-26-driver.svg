<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1f3a"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00a844"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00e676" flood-opacity="0.3"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="monospace" font-size="22" fill="#00e5ff" font-weight="bold">LED DRIVER COMPARISON: GOOD vs BAD</text>
  <text x="400" y="65" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a7a9a">智能灯的心脏 — 驱动电源品质对比</text>

  <!-- ===== GOOD DRIVER (Left) ===== -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="340" height="380" rx="10" fill="#0d1f3c" stroke="#00e676" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="40" rx="10" fill="url(#goodGrad)"/>
    <rect x="0" y="30" width="340" height="10" fill="url(#goodGrad)"/>
    <text x="170" y="27" text-anchor="middle" font-family="monospace" font-size="16" fill="#0a1628" font-weight="bold">✅ 优质驱动电源</text>

    <!-- Components visualization -->
    <g transform="translate(20, 55)">
      <!-- PCB board -->
      <rect x="10" y="10" width="270" height="130" rx="4" fill="#1a2a3a" stroke="#2a3a5a" stroke-width="1"/>

      <!-- Quality capacitor -->
      <rect x="30" y="30" width="25" height="40" rx="3" fill="#1a3a2a" stroke="#00e676" stroke-width="1"/>
      <text x="42" y="55" text-anchor="middle" font-family="monospace" font-size="8" fill="#00e676">Ruby</text>

      <!-- Transformer -->
      <rect x="75" y="25" width="40" height="50" rx="3" fill="#1a3a2a" stroke="#00e676" stroke-width="1"/>
      <text x="95" y="55" text-anchor="middle" font-family="monospace" font-size="8" fill="#00e676">TR</text>

      <!-- Chip -->
      <rect x="135" y="30" width="35" height="25" rx="2" fill="#1a3a2a" stroke="#00e676" stroke-width="1"/>
      <text x="152" y="47" text-anchor="middle" font-family="monospace" font-size="7" fill="#00e676">IC</text>

      <!-- Inductor -->
      <rect x="190" y="25" width="30" height="30" rx="3" fill="#1a3a2a" stroke="#00e676" stroke-width="1"/>
      <text x="205" y="45" text-anchor="middle" font-family="monospace" font-size="7" fill="#00e676">L1</text>

      <!-- Quality mark -->
      <rect x="240" y="30" width="25" height="25" rx="2" fill="#1a3a2a" stroke="#00e676" stroke-width="1"/>
      <text x="252" y="47" text-anchor="middle" font-family="monospace" font-size="7" fill="#00e676">QC</text>

      <!-- Traces -->
      <line x1="55" y1="50" x2="75" y2="50" stroke="#00e676" stroke-width="1.5"/>
      <line x1="115" y1="50" x2="135" y2="50" stroke="#00e676" stroke-width="1.5"/>
      <line x1="170" y1="50" x2="190" y2="50" stroke="#00e676" stroke-width="1.5"/>
      <line x1="220" y1="50" x2="240" y2="50" stroke="#00e676" stroke-width="1.5"/>
    </g>

    <!-- Specs -->
    <g transform="translate(20, 210)">
      <text x="0" y="0" font-family="monospace" font-size="11" fill="#00e676">▶ 日系Rubycon电容</text>
      <text x="0" y="22" font-family="monospace" font-size="11" fill="#00e676">▶ 功率因数 PF ≥ 0.90</text>
      <text x="0" y="44" font-family="monospace" font-size="11" fill="#00e676">▶ 纹波电流 &lt; 5%</text>
      <text x="0" y="66" font-family="monospace" font-size="11" fill="#00e676">▶ 四重保护电路</text>
      <text x="0" y="88" font-family="monospace" font-size="11" fill="#00e676">▶ 0-100% 平滑调光</text>
      <text x="0" y="110" font-family="monospace" font-size="11" fill="#00e676">▶ 设计寿命 50000h</text>
      <text x="0" y="132" font-family="monospace" font-size="11" fill="#00e676">▶ 效率 ≥ 88%</text>
    </g>
  </g>

  <!-- VS Divider -->
  <g transform="translate(390, 270)">
    <circle cx="10" cy="10" r="22" fill="#0a1628" stroke="#ff6d00" stroke-width="2"/>
    <text x="10" y="17" text-anchor="middle" font-family="monospace" font-size="16" fill="#ff6d00" font-weight="bold">VS</text>
  </g>

  <!-- ===== BAD DRIVER (Right) ===== -->
  <g transform="translate(420, 90)">
    <rect x="0" y="0" width="340" height="380" rx="10" fill="#0d1f3c" stroke="#ff1744" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="40" rx="10" fill="url(#badGrad)"/>
    <rect x="0" y="30" width="340" height="10" fill="url(#badGrad)"/>
    <text x="170" y="27" text-anchor="middle" font-family="monospace" font-size="16" fill="#fff" font-weight="bold">❌ 劣质驱动电源</text>

    <!-- Components visualization -->
    <g transform="translate(20, 55)">
      <rect x="10" y="10" width="270" height="130" rx="4" fill="#1a2a3a" stroke="#2a3a5a" stroke-width="1"/>

      <!-- Sparse components -->
      <rect x="30" y="35" width="18" height="30" rx="2" fill="#3a2a2a" stroke="#ff1744" stroke-width="1"/>
      <text x="39" y="55" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff1744">??</text>

      <rect x="70" y="30" width="25" height="35" rx="2" fill="#3a2a2a" stroke="#ff1744" stroke-width="1"/>
      <text x="82" y="52" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff1744">??</text>

      <rect x="120" y="35" width="20" height="20" rx="2" fill="#3a2a2a" stroke="#ff1744" stroke-width="1"/>
      <text x="130" y="49" text-anchor="middle" font-family="monospace" font-size="6" fill="#ff1744">?</text>

      <!-- Missing component spaces -->
      <rect x="180" y="30" width="25" height="25" rx="2" fill="#2a1a1a" stroke="#3a2a2a" stroke-width="0.5" stroke-dasharray="3,3"/>
      <rect x="230" y="30" width="25" height="25" rx="2" fill="#2a1a1a" stroke="#3a2a2a" stroke-width="0.5" stroke-dasharray="3,3"/>

      <!-- Jumpers / solder bridges -->
      <line x1="60" y1="50" x2="70" y2="50" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="4,2"/>
      <line x1="105" y1="50" x2="120" y2="50" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="4,2"/>

      <text x="135" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff5252">缺元件 / 飞线跳线</text>
    </g>

    <!-- Specs -->
    <g transform="translate(20, 210)">
      <text x="0" y="0" font-family="monospace" font-size="11" fill="#ff5252">▶ 杂牌电容（3月鼓包）</text>
      <text x="0" y="22" font-family="monospace" font-size="11" fill="#ff5252">▶ 功率因数 PF ≤ 0.50</text>
      <text x="0" y="44" font-family="monospace" font-size="11" fill="#ff5252">▶ 纹波电流大 → 频闪</text>
      <text x="0" y="66" font-family="monospace" font-size="11" fill="#ff5252">▶ 无保护电路</text>
      <text x="0" y="88" font-family="monospace" font-size="11" fill="#ff5252">▶ 最低亮度 &gt; 30%</text>
      <text x="0" y="110" font-family="monospace" font-size="11" fill="#ff5252">▶ 设计寿命 ~5000h</text>
      <text x="0" y="132" font-family="monospace" font-size="11" fill="#ff5252">▶ 效率 ≤ 70%</text>
    </g>
  </g>

  <!-- Bottom verdict -->
  <g transform="translate(40, 480)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#5a7a9a">$ diff good-driver bad-driver</text>
    <text x="0" y="15" font-family="monospace" font-size="11" fill="#00e5ff">Lifetime: 50000h vs 5000h (10x difference)</text>
    <text x="0" y="30" font-family="monospace" font-size="11" fill="#ff6d00" font-weight="bold">Verdict: 驱动是智能灯80%的寿命和体验 — 别只看灯珠</text>
  </g>
</svg>
