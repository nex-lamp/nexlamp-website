<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.08" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <!-- Title -->
  <text x="400" y="52" fill="#00d4ff" font-family="Consolas,monospace" font-size="18" text-anchor="middle" filter="url(#neon)" font-weight="bold">GB 30255-2026  LED EFFICIENCY TIERS</text>
  <text x="400" y="78" fill="#7aa8c7" font-family="Consolas,monospace" font-size="13" text-anchor="middle">LED Indoor Lighting Energy Efficiency Standard</text>
  <!-- Tier 1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="200" height="300" rx="12" fill="#0d2137" stroke="#00d4ff" stroke-width="1.5" opacity="0.95"/>
    <rect x="60" y="110" width="200" height="40" rx="12" fill="url(#glow1)" opacity="0.3"/>
    <text x="160" y="136" fill="#00d4ff" font-family="Consolas,monospace" font-size="16" text-anchor="middle" font-weight="bold">TIER 1 / 1级</text>
    <text x="160" y="168" fill="#e0f0ff" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="bold">最高能效</text>
    <line x1="90" y1="180" x2="230" y2="180" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
    <!-- Metrics -->
    <text x="90" y="208" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">筒灯光效</text>
    <text x="230" y="208" fill="#00ff88" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥120 lm/W</text>
    <text x="90" y="236" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">球泡灯光效</text>
    <text x="230" y="236" fill="#00ff88" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥110 lm/W</text>
    <text x="90" y="264" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">灯管光效</text>
    <text x="230" y="264" fill="#00ff88" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥120 lm/W</text>
    <text x="90" y="292" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">显色指数</text>
    <text x="230" y="292" fill="#00ff88" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">Ra≥90</text>
    <!-- Star badge -->
    <circle cx="160" cy="370" r="20" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <text x="160" y="376" fill="#00d4ff" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">&#9733;</text>
  </g>
  <!-- Tier 2 -->
  <g filter="url(#shadow)">
    <rect x="300" y="110" width="200" height="300" rx="12" fill="#0d2137" stroke="#00a0cc" stroke-width="1.5" opacity="0.95"/>
    <rect x="300" y="110" width="200" height="40" rx="12" fill="url(#glow2)" opacity="0.2"/>
    <text x="400" y="136" fill="#00a0cc" font-family="Consolas,monospace" font-size="16" text-anchor="middle" font-weight="bold">TIER 2 / 2级</text>
    <text x="400" y="168" fill="#e0f0ff" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="bold">中等水平</text>
    <line x1="330" y1="180" x2="470" y2="180" stroke="#00a0cc" stroke-width="0.5" opacity="0.3"/>
    <text x="330" y="208" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">筒灯光效</text>
    <text x="470" y="208" fill="#ffaa00" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥100 lm/W</text>
    <text x="330" y="236" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">球泡灯光效</text>
    <text x="470" y="236" fill="#ffaa00" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥95 lm/W</text>
    <text x="330" y="264" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">灯管光效</text>
    <text x="470" y="264" fill="#ffaa00" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥105 lm/W</text>
    <text x="330" y="292" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">显色指数</text>
    <text x="470" y="292" fill="#ffaa00" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">Ra≥80</text>
    <circle cx="400" cy="370" r="20" fill="none" stroke="#00a0cc" stroke-width="1" opacity="0.5"/>
    <text x="400" y="376" fill="#00a0cc" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">&#9733;</text>
  </g>
  <!-- Tier 3 -->
  <g filter="url(#shadow)">
    <rect x="540" y="110" width="200" height="300" rx="12" fill="#0d2137" stroke="#ffaa00" stroke-width="1.5" opacity="0.95"/>
    <rect x="540" y="110" width="200" height="40" rx="12" fill="url(#glow3)" opacity="0.2"/>
    <text x="640" y="136" fill="#ffaa00" font-family="Consolas,monospace" font-size="16" text-anchor="middle" font-weight="bold">TIER 3 / 3级</text>
    <text x="640" y="168" fill="#e0f0ff" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="bold">准入底线</text>
    <line x1="570" y1="180" x2="710" y2="180" stroke="#ffaa00" stroke-width="0.5" opacity="0.3"/>
    <text x="570" y="208" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">筒灯光效</text>
    <text x="710" y="208" fill="#ff6644" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥85 lm/W</text>
    <text x="570" y="236" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">球泡灯光效</text>
    <text x="710" y="236" fill="#ff6644" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥80 lm/W</text>
    <text x="570" y="264" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">灯管光效</text>
    <text x="710" y="264" fill="#ff6644" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">≥90 lm/W</text>
    <text x="570" y="292" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">显色指数</text>
    <text x="710" y="292" fill="#ff6644" font-family="Consolas,monospace" font-size="13" text-anchor="end" font-weight="bold">Ra≥80</text>
    <circle cx="640" cy="370" r="20" fill="none" stroke="#ffaa00" stroke-width="1" opacity="0.5"/>
    <text x="640" y="376" fill="#ffaa00" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">&#9733;</text>
  </g>
  <!-- Arrow indicators -->
  <g opacity="0.6">
    <path d="M280 260 L290 260" stroke="#00a0cc" stroke-width="2" marker-end="none"/>
    <text x="285" y="255" fill="#4488aa" font-family="Consolas,monospace" font-size="10" text-anchor="middle">→</text>
    <path d="M520 260 L530 260" stroke="#ffaa00" stroke-width="2"/>
    <text x="525" y="255" fill="#cc8800" font-family="Consolas,monospace" font-size="10" text-anchor="middle">→</text>
  </g>
  <!-- Bottom bar -->
  <rect x="40" y="430" width="720" height="45" rx="8" fill="#0d2137" stroke="#1a3a5c" stroke-width="1"/>
  <text x="60" y="457" fill="#7aa8c7" font-family="Consolas,monospace" font-size="12">EFF 2026-03-01 | Mandatory | Indoor LED: Downlight / Bulb / Tube / Panel / Highbay</text>
</svg>