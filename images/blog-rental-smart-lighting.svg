    <!-- Row 3: Lingdong + smart bulb -->
    <g transform="translate(10, 106)">
      <text x="0" y="14" fill="#efaf5a" font-family="Microsoft YaHei, sans-serif" font-size="10">③凌动开关+智能灯</text>
      <text x="90" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">¥80-200/位</text>
      <text x="160" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">★★☆</text>
      <text x="220" y="14" fill="#a0b8c0" font-family="Microsoft YaHei, sans-serif" font-size="9">进阶玩家</text>
      <text x="330" y="14" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="9">开关不断电·兼容好</text>
      <rect x="520" y="3" width="70" height="16" rx="8" fill="#3a2a10" stroke="#8a7030" stroke-width="0.8"/>
      <text x="555" y="15" text-anchor="middle" fill="#efaf5a" font-family="sans-serif" font-size="9">✓ 进阶</text>
    </g>

    <!-- Row 4: Wireless switch -->
    <g transform="translate(10, 130)">
      <text x="0" y="14" fill="#4a9eff" font-family="Microsoft YaHei, sans-serif" font-size="10">④无线开关+智能灯</text>
      <text x="90" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">¥300-500/房</text>
      <text x="160" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">★★☆</text>
      <text x="220" y="14" fill="#a0b8c0" font-family="Microsoft YaHei, sans-serif" font-size="9">租房党</text>
      <text x="330" y="14" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="9">免改电路·可搬家带走</text>
      <rect x="520" y="3" width="70" height="16" rx="8" fill="#152540" stroke="#3068a0" stroke-width="0.8"/>
      <text x="555" y="15" text-anchor="middle" fill="#4a9eff" font-family="sans-serif" font-size="9">🏠 租房</text>
    </g>

    <!-- Row 5: Full smart home -->
    <g transform="translate(10, 154)">
      <text x="0" y="14" fill="#b080ff" font-family="Microsoft YaHei, sans-serif" font-size="10">⑤⑥全屋智能系统</text>
      <text x="90" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">¥3000-8000</text>
      <text x="160" y="14" fill="#c0d0d0" font-family="sans-serif" font-size="10">★★★</text>
      <text x="220" y="14" fill="#a0b8c0" font-family="Microsoft YaHei, sans-serif" font-size="9">新房装修/土豪</text>
      <text x="330" y="14" fill="#8090a0" font-family="Microsoft YaHei, sans-serif" font-size="9">全套联动·场景面板·传感器</text>
      <rect x="520" y="3" width="70" height="16" rx="8" fill="#201535" stroke="#6040a0" stroke-width="0.8"/>
      <text x="555" y="15" text-anchor="middle" fill="#b080ff" font-family="sans-serif" font-size="9">👑 完整</text>
    </g>
  </g>
</svg>
