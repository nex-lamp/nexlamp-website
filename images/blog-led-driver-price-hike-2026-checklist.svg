<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  
  <rect width="800" height="560" fill="url(#bgGrad3)"/>
  <rect width="800" height="560" fill="url(#grid3)"/>
  
  <!-- Terminal window -->
  <rect x="40" y="25" width="720" height="510" rx="8" fill="#0c1d2e" stroke="#2478c2" stroke-width="1.5" opacity="0.9"/>
  <rect x="40" y="25" width="720" height="36" rx="8" fill="#142a42" stroke="#2478c2" stroke-width="1.5"/>
  <circle cx="66" cy="43" r="6" fill="#ff5f56"/>
  <circle cx="88" cy="43" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="43" r="6" fill="#27c93f"/>
  <text x="400" y="49" font-family="Consolas, monospace" font-size="14" fill="#7ec27e" text-anchor="middle" font-weight="bold">root@nexlamp:~# driver_selection_checklist --2026</text>
  
  <!-- Title -->
  <text x="400" y="95" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold" filter="url(#glow3)">涨价潮下的驱动选型5大硬指标</text>
  
  <!-- Checklist items -->
  <g transform="translate(0, 120)">
    <!-- Item 1 -->
    <rect x="70" y="0" width="660" height="65" rx="6" fill="#142a42" stroke="#7ec27e" stroke-width="1.5"/>
    <circle cx="105" cy="32" r="16" fill="#7ec27e" filter="url(#glow3)"/>
    <text x="105" y="38" font-family="Consolas, monospace" font-size="16" fill="#0a1628" text-anchor="middle" font-weight="bold">1</text>
    <text x="140" y="28" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">CCC + EMC 双认证</text>
    <text x="140" y="48" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#9db8d3">2025新版GB/T 31831抬高EMC要求，大型项目验收越来越难</text>
    
    <!-- Item 2 -->
    <rect x="70" y="80" width="660" height="65" rx="6" fill="#142a42" stroke="#7ec27e" stroke-width="1.5"/>
    <circle cx="105" cy="112" r="16" fill="#7ec27e" filter="url(#glow3)"/>
    <text x="105" y="118" font-family="Consolas, monospace" font-size="16" fill="#0a1628" text-anchor="middle" font-weight="bold">2</text>
    <text x="140" y="108" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">查证书真伪和覆盖型号</text>
    <text x="140" y="128" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#9db8d3">上CQC官网验证，警惕套用证书、过期证书、型号不一致</text>
    
    <!-- Item 3 -->
    <rect x="70" y="160" width="660" height="65" rx="6" fill="#142a42" stroke="#7ec27e" stroke-width="1.5"/>
    <circle cx="105" cy="192" r="16" fill="#7ec27e" filter="url(#glow3)"/>
    <text x="105" y="198" font-family="Consolas, monospace" font-size="16" fill="#0a1628" text-anchor="middle" font-weight="bold">3</text>
    <text x="140" y="188" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">电容品牌和温度范围</text>
    <text x="140" y="208" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#9db8d3">优选NCC/Rubycon/EPCOS，105℃/5000h以上，工作温度-20℃~+60℃</text>
    
    <!-- Item 4 -->
    <rect x="70" y="240" width="660" height="65" rx="6" fill="#142a42" stroke="#7ec27e" stroke-width="1.5"/>
    <circle cx="105" cy="272" r="16" fill="#7ec27e" filter="url(#glow3)"/>
    <text x="105" y="278" font-family="Consolas, monospace" font-size="16" fill="#0a1628" text-anchor="middle" font-weight="bold">4</text>
    <text x="140" y="268" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">功率预留20%余量</text>
    <text x="140" y="288" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#9db8d3">长期满载加速老化，10W灯具建议配12W驱动，高温场景更需余量</text>
    
    <!-- Item 5 -->
    <rect x="70" y="320" width="660" height="65" rx="6" fill="#142a42" stroke="#7ec27e" stroke-width="1.5"/>
    <circle cx="105" cy="352" r="16" fill="#7ec27e" filter="url(#glow3)"/>
    <text x="105" y="358" font-family="Consolas, monospace" font-size="16" fill="#0a1628" text-anchor="middle" font-weight="bold">5</text>
    <text x="140" y="348" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">质保年限是品质信号</text>
    <text x="140" y="368" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#9db8d3">敢保3年的通常能扛5年；只保1年的实际寿命可能只有2年</text>
  </g>
  
  <!-- Bottom warning -->
  <rect x="120" y="470" width="560" height="50" rx="6" fill="#1a3a5c" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="400" y="500" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="bold">⚠ 涨价潮中假货、贴牌、缩水版驱动会泛滥，别为省几块钱买"一次性驱动"</text>
  
  <!-- Nexlamp watermark -->
  <text x="720" y="525" font-family="Consolas, monospace" font-size="11" fill="#4a6fa5" text-anchor="end">NEXLAMP © 2026</text>
</svg>