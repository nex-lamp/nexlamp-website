<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Consolas','Microsoft YaHei',monospace">
  <defs>
    <pattern id="g1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#12305a" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="640" fill="#0a1628"/>
  <rect width="900" height="640" fill="url(#g1)"/>
  <!-- terminal window -->
  <rect x="40" y="40" width="820" height="560" rx="12" fill="#0d1f3c" stroke="#1e4a8a" stroke-width="1.5"/>
  <rect x="40" y="40" width="820" height="44" rx="12" fill="#12305a"/>
  <circle cx="70" cy="62" r="7" fill="#ff5f57"/>
  <circle cx="95" cy="62" r="7" fill="#febc2e"/>
  <circle cx="120" cy="62" r="7" fill="#28c840"/>
  <text x="450" y="68" text-anchor="middle" fill="#7fb8ff" font-size="16" font-weight="bold">circadian_light_scheduler.sh — 节律光24小时调度曲线</text>

  <!-- phase bands: 0-6 sleep / 6-9 wake / 9-18 focus / 18-22 relax / 22-24 sleep -->
  <rect x="120" y="105" width="170" height="365" fill="#2a4a7a" opacity="0.22"/>
  <rect x="290" y="105" width="85" height="365" fill="#febc2e" opacity="0.10"/>
  <rect x="375" y="105" width="255" height="365" fill="#28c840" opacity="0.08"/>
  <rect x="630" y="105" width="113" height="365" fill="#ff7ac2" opacity="0.10"/>
  <rect x="743" y="105" width="57" height="365" fill="#2a4a7a" opacity="0.22"/>

  <!-- horizontal grid -->
  <line x1="120" y1="105" x2="800" y2="105" stroke="#1e4a8a" stroke-width="0.8" stroke-dasharray="4 5"/>
  <line x1="120" y1="200" x2="800" y2="200" stroke="#1e4a8a" stroke-width="0.8" stroke-dasharray="4 5"/>
  <line x1="120" y1="295" x2="800" y2="295" stroke="#1e4a8a" stroke-width="0.8" stroke-dasharray="4 5"/>
  <line x1="120" y1="390" x2="800" y2="390" stroke="#1e4a8a" stroke-width="0.8" stroke-dasharray="4 5"/>
  <line x1="120" y1="470" x2="800" y2="470" stroke="#1e4a8a" stroke-width="1.2"/>

  <!-- x axis labels (hours) -->
  <text x="120" y="496" text-anchor="middle" fill="#5a8fd0" font-size="13">0:00</text>
  <text x="290" y="496" text-anchor="middle" fill="#5a8fd0" font-size="13">6:00</text>
  <text x="375" y="496" text-anchor="middle" fill="#5a8fd0" font-size="13">9:00</text>
  <text x="470" y="496" text-anchor="middle" fill="#5a8fd0" font-size="13">12:00</text>
  <text x="630" y="496" text-anchor="middle" fill="#5a8fd0" font-size="13">18:00</text>
  <text x="743" y="496" text-anchor="middle" fill="#5a8fd0" font-size="13">22:00</text>
  <text x="800" y="496" text-anchor="middle" fill="#5a8fd0" font-size="13">24:00</text>

  <!-- phase labels -->
  <text x="205" y="120" text-anchor="middle" fill="#9fc4ef" font-size="13">🌙 睡眠</text>
  <text x="332" y="120" text-anchor="middle" fill="#f3d48a" font-size="13">唤醒</text>
  <text x="502" y="120" text-anchor="middle" fill="#9be8b2" font-size="13">专注工作</text>
  <text x="686" y="120" text-anchor="middle" fill="#f3a8d0" font-size="13">放松</text>
  <text x="771" y="120" text-anchor="middle" fill="#9fc4ef" font-size="13">🌙</text>

  <!-- y axis -->
  <text x="112" y="110" text-anchor="end" fill="#5a8fd0" font-size="12">峰值</text>
  <text x="112" y="474" text-anchor="end" fill="#5a8fd0" font-size="12">0</text>

  <!-- CCT curve (amber) polyline -->
  <polyline fill="none" stroke="#ffb020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow1)"
    points="120,452 290,452 318,335 347,245 375,155 403,128 573,128 630,200 658,290 715,380 743,434 800,452"/>
  <!-- Brightness curve (cyan) -->
  <polyline fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow1)"
    points="120,416 290,416 318,308 347,182 375,128 460,117 602,128 630,182 687,290 715,344 743,380 800,416"/>

  <!-- legend -->
  <rect x="585" y="505" width="215" height="66" rx="8" fill="#0a1628" stroke="#1e4a8a"/>
  <line x1="600" y1="525" x2="630" y2="525" stroke="#00e5ff" stroke-width="3"/>
  <text x="640" y="529" fill="#c8dcf5" font-size="13">亮度 Brightness</text>
  <line x1="600" y1="552" x2="630" y2="552" stroke="#ffb020" stroke-width="3"/>
  <text x="640" y="556" fill="#c8dcf5" font-size="13">色温 Color Temp</text>

  <text x="120" y="550" fill="#5a8fd0" font-size="13">→ 低色温+低亮度入睡 · 高色温+高亮度提神 · 恒定不变的不是节律光</text>
</svg>
