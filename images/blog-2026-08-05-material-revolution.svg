<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#141a3a"/>
    </linearGradient>
    <linearGradient id="perov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#004488"/>
    </linearGradient>
    <linearGradient id="ceram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#006622"/>
    </linearGradient>
    <linearGradient id="driver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#993300"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" font-family="Arial,sans-serif">LED材料革命 → 驱动电源需求全景图</text>

  <!-- Left: Material Innovations -->
  <text x="200" y="80" text-anchor="middle" fill="#8899aa" font-size="13" font-family="Arial,sans-serif">新材料突破</text>

  <!-- Perovskite Box -->
  <rect x="60" y="100" width="280" height="140" rx="12" fill="url(#perov)" opacity="0.12" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="200" y="130" text-anchor="middle" fill="#00d4ff" font-size="16" font-weight="bold" font-family="Arial,sans-serif" filter="url(#glow3)">钙钛矿LED</text>
  <text x="200" y="152" text-anchor="middle" fill="#aabbcc" font-size="11" font-family="Arial,sans-serif">中科大 · Nature 2026.6</text>
  <line x1="80" y1="165" x2="320" y2="165" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
  <text x="200" y="183" text-anchor="middle" fill="#ccddee" font-size="11" font-family="Arial,sans-serif">✦ 116万nit极限亮度</text>
  <text x="200" y="200" text-anchor="middle" fill="#ccddee" font-size="11" font-family="Arial,sans-serif">✦ 18万小时寿命（60年）</text>
  <text x="200" y="217" text-anchor="middle" fill="#ccddee" font-size="11" font-family="Arial,sans-serif">✦ EQE 22-45% 效率突破</text>
  <text x="200" y="234" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">量产预期: 2027-2028</text>

  <!-- Ceramic Box -->
  <rect x="460" y="100" width="280" height="140" rx="12" fill="url(#ceram)" opacity="0.12" stroke="#00e676" stroke-width="1.5"/>
  <text x="600" y="130" text-anchor="middle" fill="#00e676" font-size="16" font-weight="bold" font-family="Arial,sans-serif" filter="url(#glow3)">透明荧光陶瓷LED</text>
  <text x="600" y="152" text-anchor="middle" fill="#aabbcc" font-size="11" font-family="Arial,sans-serif">中科院 / 吉林大学</text>
  <line x1="480" y1="165" x2="720" y2="165" stroke="#00e676" stroke-width="0.5" opacity="0.3"/>
  <text x="600" y="183" text-anchor="middle" fill="#ccddee" font-size="11" font-family="Arial,sans-serif">✦ 单颗千瓦级大功率</text>
  <text x="600" y="200" text-anchor="middle" fill="#ccddee" font-size="11" font-family="Arial,sans-serif">✦ 5万小时零光衰</text>
  <text x="600" y="217" text-anchor="middle" fill="#ccddee" font-size="11" font-family="Arial,sans-serif">✦ 成本比金卤灯低50%</text>
  <text x="600" y="234" text-anchor="middle" fill="#8899aa" font-size="10" font-family="Arial,sans-serif">状态: 工程试点中</text>

  <!-- Center Arrows from both to Driver -->
  <path d="M200,260 L200,290 L400,320 L600,290 L600,260" stroke="#ff6b35" stroke-width="2" fill="none" stroke-dasharray="6,3" opacity="0.5"/>
  <polygon points="400,330 390,320 410,320" fill="#ff6b35"/>

  <!-- Center: Driver Box -->
  <rect x="230" y="330" width="340" height="150" rx="14" fill="url(#driver)" opacity="0.15" stroke="#ff6b35" stroke-width="2"/>
  <text x="400" y="362" text-anchor="middle" fill="#ff6b35" font-size="18" font-weight="bold" font-family="Arial,sans-serif" filter="url(#glow3)">驱动电源 — 核心升级需求</text>
  <line x1="260" y1="375" x2="540" y2="375" stroke="#ff6b35" stroke-width="0.5" opacity="0.3"/>

  <!-- Upgrade items -->
  <rect x="250" y="388" width="145" height="38" rx="6" fill="#ff6b35" opacity="0.12"/>
  <text x="322" y="407" text-anchor="middle" fill="#ffaa00" font-size="11" font-weight="bold" font-family="Arial,sans-serif">精度升级</text>
  <text x="322" y="421" text-anchor="middle" fill="#ccddee" font-size="10" font-family="Arial,sans-serif">±3% → ±1%</text>

  <rect x="405" y="388" width="145" height="38" rx="6" fill="#ff6b35" opacity="0.12"/>
  <text x="477" y="407" text-anchor="middle" fill="#ffaa00" font-size="11" font-weight="bold" font-family="Arial,sans-serif">功率升级</text>
  <text x="477" y="421" text-anchor="middle" fill="#ccddee" font-size="10" font-family="Arial,sans-serif">400W → kW级</text>

  <rect x="250" y="434" width="145" height="38" rx="6" fill="#ff6b35" opacity="0.12"/>
  <text x="322" y="453" text-anchor="middle" fill="#ffaa00" font-size="11" font-weight="bold" font-family="Arial,sans-serif">智能升级</text>
  <text x="322" y="467" text-anchor="middle" fill="#ccddee" font-size="10" font-family="Arial,sans-serif">温湿度传感+自保护</text>

  <rect x="405" y="434" width="145" height="38" rx="6" fill="#ff6b35" opacity="0.12"/>
  <text x="477" y="453" text-anchor="middle" fill="#ffaa00" font-size="11" font-weight="bold" font-family="Arial,sans-serif">标准先行</text>
  <text x="477" y="467" text-anchor="middle" fill="#ccddee" font-size="10" font-family="Arial,sans-serif">参与接口标准制定</text>

  <!-- Bottom note -->
  <text x="400" y="495" text-anchor="middle" fill="#556688" font-size="10" font-family="Arial,sans-serif">材料革命不是威胁 — 是驱动电源从"配件"升级为"智能节点"的跳板</text>
</svg>