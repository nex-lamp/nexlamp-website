    <g transform="translate(490,85)" opacity="0.6">
      <line x1="0" y1="0" x2="20" y2="-20" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="2,2"/>
      <text x="22" y="-20" font-size="7" fill="#a78bfa">Δ +29%</text>
    </g>
    <g transform="translate(730,110)" opacity="0.6">
      <line x1="0" y1="0" x2="20" y2="-20" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="2,2"/>
      <text x="22" y="-20" font-size="7" fill="#a78bfa">Δ +25%</text>
    </g>
