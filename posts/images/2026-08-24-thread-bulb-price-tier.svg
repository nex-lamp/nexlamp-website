<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="-apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1e3a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3050" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a6e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1e3a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4a3a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f2820" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2a5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f1240" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="680" height="440" fill="url(#bg)"/>
  <rect width="680" height="440" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="42" fill="#e8f0ff" font-size="20" font-weight="700">2026年8月 · 5款Matter over Thread灯泡分档推荐</text>
  <text x="40" y="65" fill="#7ba0d4" font-size="12">从80元入门款到500元高端款，按预算和需求挑最合适的那款</text>
  <line x1="40" y1="80" x2="640" y2="80" stroke="#1a3050" stroke-width="1"/>

  <!-- 入门档 -->
  <g transform="translate(40, 100)">
    <rect width="195" height="290" rx="10" fill="url(#blueCard)" stroke="#2478c2" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="14" y="14" width="60" height="22" rx="11" fill="#2478c2" fill-opacity="0.3"/>
    <text x="44" y="29" fill="#7bb8e8" font-size="11" font-weight="600" text-anchor="middle">入门档</text>
    <text x="14" y="58" fill="#e8f0ff" font-size="17" font-weight="700">IKEA</text>
    <text x="14" y="78" fill="#e8f0ff" font-size="14" font-weight="600">KAJPLATS</text>

    <text x="14" y="108" fill="#7bb8e8" font-size="11">价格</text>
    <text x="14" y="130" fill="#ffd285" font-size="20" font-weight="700" filter="url(#glow)">$8-15</text>
    <text x="14" y="148" fill="#7bb8e8" font-size="11">约60-110元/只</text>

    <text x="14" y="178" fill="#e8f0ff" font-size="11" font-weight="600">✓ 1个便宜，全屋铺满</text>
    <text x="14" y="198" fill="#e8f0ff" font-size="11" font-weight="600">✓ 包装盒印Matter码</text>
    <text x="14" y="218" fill="#e8f0ff" font-size="11" font-weight="600">✓ 2000Hz PWM调光</text>
    <text x="14" y="248" fill="#7ba0d4" font-size="11">✗ 只有可调白光</text>
    <text x="14" y="266" fill="#7ba0d4" font-size="11">✗ 塑料感明显</text>
    <text x="14" y="284" fill="#7ba0d4" font-size="11">✗ 需DIRIGERA中枢</text>
  </g>

  <!-- 主流档 -->
  <g transform="translate(245, 100)">
    <rect width="195" height="290" rx="10" fill="url(#greenCard)" stroke="#2d8659" stroke-width="1.5"/>
    <rect x="14" y="14" width="80" height="22" rx="11" fill="#2d8659" fill-opacity="0.4"/>
    <text x="54" y="29" fill="#7be495" font-size="11" font-weight="600" text-anchor="middle">★ 主流爆款</text>
    <text x="14" y="58" fill="#e8f0ff" font-size="17" font-weight="700">Nanoleaf</text>
    <text x="14" y="78" fill="#e8f0ff" font-size="14" font-weight="600">Essentials A19</text>

    <text x="14" y="108" fill="#7be495" font-size="11">价格</text>
    <text x="14" y="130" fill="#ffd285" font-size="20" font-weight="700" filter="url(#glow)">$12.5/只起</text>
    <text x="14" y="148" fill="#7be495" font-size="11">4只装≈360元</text>

    <text x="14" y="178" fill="#e8f0ff" font-size="11" font-weight="600">✓ Silicon Labs MG24</text>
    <text x="14" y="198" fill="#e8f0ff" font-size="11" font-weight="600">✓ 1100流明真60W</text>
    <text x="14" y="218" fill="#e8f0ff" font-size="11" font-weight="600">✓ 1600万色 + 256级</text>
    <text x="14" y="248" fill="#7be495" font-size="11">+ 4只同步延迟≤240ms</text>
    <text x="14" y="266" fill="#7be495" font-size="11">+ 每颗=Thread路由节点</text>
    <text x="14" y="284" fill="#7be495" font-size="11">+ 多平台自动Matter</text>
  </g>

  <!-- 高端档 -->
  <g transform="translate(450, 100)">
    <rect width="195" height="290" rx="10" fill="url(#purpleCard)" stroke="#8258c2" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="14" y="14" width="60" height="22" rx="11" fill="#8258c2" fill-opacity="0.4"/>
    <text x="44" y="29" fill="#c4a3e8" font-size="11" font-weight="600" text-anchor="middle">高端档</text>
    <text x="14" y="58" fill="#e8f0ff" font-size="17" font-weight="700">Nanoleaf</text>
    <text x="14" y="78" fill="#e8f0ff" font-size="14" font-weight="600">Skylight / LIFX</text>

    <text x="14" y="108" fill="#c4a3e8" font-size="11">价格</text>
    <text x="14" y="130" fill="#ffd285" font-size="20" font-weight="700" filter="url(#glow)">$200-500+</text>
    <text x="14" y="148" fill="#c4a3e8" font-size="11">约1500-3700元</text>

    <text x="14" y="178" fill="#e8f0ff" font-size="11" font-weight="600">✓ 颜值即正义</text>
    <text x="14" y="198" fill="#e8f0ff" font-size="11" font-weight="600">✓ Skylight模块化99+</text>
    <text x="14" y="218" fill="#e8f0ff" font-size="11" font-weight="600">✓ LIFX色彩天花板</text>
    <text x="14" y="248" fill="#c4a3e8" font-size="11">○ Skylight 接天花板</text>
    <text x="14" y="266" fill="#c4a3e8" font-size="11">○ LIFX 是Wi-Fi版</text>
    <text x="14" y="284" fill="#c4a3e8" font-size="11">○ 预算充裕首选</text>
  </g>

  <text x="40" y="423" fill="#5a7ba5" font-size="10">NEXLAMP · 智能照明方案10年</text>
  <text x="640" y="423" fill="#5a7ba5" font-size="10" text-anchor="end">数据来源：2026年8月实测 · RTINGS</text>
</svg>
