<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="daylight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ec5fc"/>
      <stop offset="100%" stop-color="#e0c3fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3050" stroke-width="0.3"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="680" height="420" fill="url(#bg)"/>
  <rect width="680" height="420" fill="url(#grid)"/>

  <!-- Terminal top bar -->
  <rect x="0" y="0" width="680" height="28" fill="#0d1a2d" rx="4"/>
  <circle cx="16" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="14" r="5" fill="#27c93f"/>
  <text x="340" y="18" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">human_circadian_rhythm ~ monitor.sh</text>

  <!-- Title -->
  <text x="340" y="56" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="16" font-weight="bold" filter="url(#glow)">Human Circadian Rhythm 与 智能照明节律控制</text>

  <!-- Time axis -->
  <line x1="60" y1="340" x2="620" y2="340" stroke="#1a3050" stroke-width="1"/>
  <text x="60" y="358" fill="#4facfe" font-family="monospace" font-size="10" text-anchor="middle">06:00</text>
  <text x="153" y="358" fill="#8ec5fc" font-family="monospace" font-size="10" text-anchor="middle">09:00</text>
  <text x="247" y="358" fill="#00f2fe" font-family="monospace" font-size="10" text-anchor="middle">12:00</text>
  <text x="340" y="358" fill="#ffd166" font-family="monospace" font-size="10" text-anchor="middle">15:00</text>
  <text x="433" y="358" fill="#ff9f43" font-family="monospace" font-size="10" text-anchor="middle">18:00</text>
  <text x="527" y="358" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle">21:00</text>
  <text x="620" y="358" fill="#ff4757" font-family="monospace" font-size="10" text-anchor="middle">24:00</text>

  <!-- Color temp bar -->
  <rect x="60" y="150" width="560" height="30" rx="3" fill="#0d1f3c" stroke="#1a3050" stroke-width="0.5"/>
  <rect x="60" y="150" width="187" height="30" rx="3" fill="url(#cool)" opacity="0.6"/>
  <rect x="247" y="150" width="187" height="30" fill="url(#daylight)" opacity="0.5"/>
  <rect x="433" y="150" width="187" height="30" rx="3" fill="url(#warm)" opacity="0.6"/>
  <text x="60" y="145" fill="#4facfe" font-family="monospace" font-size="9" text-anchor="middle">6500K</text>
  <text x="153" y="145" fill="#4facfe" font-family="monospace" font-size="9" text-anchor="middle">5500K</text>
  <text x="247" y="145" fill="#00f2fe" font-family="monospace" font-size="9" text-anchor="middle">4500K</text>
  <text x="340" y="145" fill="#ffd166" font-family="monospace" font-size="9" text-anchor="middle">4000K</text>
  <text x="433" y="145" fill="#ff9f43" font-family="monospace" font-size="9" text-anchor="middle">3000K</text>
  <text x="527" y="145" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">2700K</text>
  <text x="620" y="145" fill="#ff4757" font-family="monospace" font-size="9" text-anchor="middle">2200K</text>

  <!-- Melatonin curve -->
  <text x="60" y="270" fill="#ffd166" font-family="monospace" font-size="10" filter="url(#glow)">褪黑素水平</text>
  <path d="M60,280 Q153,275 247,280 Q340,290 433,260 Q480,230 527,180 Q567,140 620,120" fill="none" stroke="#ffd166" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M60,280 Q153,275 247,280 Q340,290 433,260 Q480,230 527,180 Q567,140 620,120 L620,280 Z" fill="#ffd166" opacity="0.08"/>

  <!-- Cortisol curve -->
  <text x="60" y="205" fill="#00f2fe" font-family="monospace" font-size="10" filter="url(#glow)">皮质醇水平</text>
  <path d="M60,130 Q120,100 200,108 Q300,130 400,170 Q500,210 560,240 Q590,255 620,260" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Status bar -->
  <rect x="60" y="372" width="560" height="24" rx="3" fill="#0d1a2d" stroke="#1a3050" stroke-width="0.5"/>
  <text x="75" y="388" fill="#27c93f" font-family="monospace" font-size="9">&#x25CF;</text>
  <text x="88" y="388" fill="#64748b" font-family="monospace" font-size="9">STATUS: RHYTHM_ALIGNED | IPRGC_RESPONSE: NORMAL | NEXT_CYCLE: SUNRISE_SIM @06:00</text>

  <!-- Legend -->
  <rect x="440" y="80" width="180" height="55" rx="4" fill="#0d1a2d" stroke="#1a3050" stroke-width="0.5"/>
  <line x1="448" y1="92" x2="468" y2="92" stroke="#00f2fe" stroke-width="2"/>
  <text x="475" y="96" fill="#64748b" font-family="monospace" font-size="8">Cortisol (觉醒)</text>
  <line x1="448" y1="108" x2="468" y2="108" stroke="#ffd166" stroke-width="2"/>
  <text x="475" y="112" fill="#64748b" font-family="monospace" font-size="8">Melatonin (睡眠)</text>
  <rect x="448" y="118" width="20" height="8" rx="1" fill="url(#cool)" opacity="0.6"/>
  <rect x="488" y="118" width="20" height="8" rx="1" fill="url(#daylight)" opacity="0.5"/>
  <rect x="528" y="118" width="20" height="8" rx="1" fill="url(#warm)" opacity="0.6"/>
  <text x="555" y="126" fill="#64748b" font-family="monospace" font-size="8">色温梯度</text>
</svg>