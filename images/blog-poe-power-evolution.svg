<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="bt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
    <linearGradient id="at" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00cc88"/>
      <stop offset="100%" stop-color="#009966"/>
    </linearGradient>
    <linearGradient id="af" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#886600"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00cc88"/>
      <stop offset="100%" stop-color="#006644"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#004466"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#005588"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a44" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <text x="400" y="38" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="18" font-weight="bold" filter="url(#glow)">PoE Power Evolution: From 15W to 90W</text>
  <text x="400" y="58" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="12">IEEE 802.3 Standards — PSE (Switch) &amp; PD (Device) Power Budgets</text>

  <!-- Y axis -->
  <line x1="100" y1="80" x2="100" y2="420" stroke="#1a2a44" stroke-width="1"/>
  <text x="55" y="90" fill="#8899aa" font-family="monospace" font-size="11">Watts</text>

  <!-- Y axis labels -->
  <line x1="95" y1="100" x2="100" y2="100" stroke="#1a2a44" stroke-width="1"/>
  <text x="90" y="104" text-anchor="end" fill="#8899aa" font-family="monospace" font-size="10">90</text>
  <line x1="95" y1="160" x2="100" y2="160" stroke="#1a2a44" stroke-width="0.5"/>
  <text x="90" y="164" text-anchor="end" fill="#8899aa" font-family="monospace" font-size="10">60</text>
  <line x1="95" y1="240" x2="100" y2="240" stroke="#1a2a44" stroke-width="0.5"/>
  <text x="90" y="244" text-anchor="end" fill="#8899aa" font-family="monospace" font-size="10">30</text>
  <line x1="95" y1="340" x2="100" y2="340" stroke="#1a2a44" stroke-width="0.5"/>
  <text x="90" y="344" text-anchor="end" fill="#8899aa" font-family="monospace" font-size="10">15</text>

  <!-- Bar group 1: 802.3af Type 1 -->
  <rect x="135" y="340" width="100" height="60" rx="4" fill="url(#bar1)" opacity="0.7"/>
  <rect x="135" y="340" width="100" height="60" rx="4" fill="none" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="185" y="375" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">15.4W</text>

  <line x1="240" y1="405" x2="240" y2="420" stroke="#1a2a44" stroke-width="1"/>
  <text x="240" y="415" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">12.95W PD</text>

  <!-- Bar group 2: 802.3at Type 2 -->
  <rect x="280" y="240" width="100" height="160" rx="4" fill="url(#bar2)" opacity="0.7"/>
  <rect x="280" y="240" width="100" height="160" rx="4" fill="none" stroke="#00cc88" stroke-width="1.5"/>
  <text x="330" y="335" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">30W</text>

  <line x1="385" y1="405" x2="385" y2="420" stroke="#1a2a44" stroke-width="1"/>
  <text x="385" y="415" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">25.5W PD</text>

  <!-- Bar group 3: 802.3bt Type 3 -->
  <rect x="425" y="160" width="100" height="240" rx="4" fill="url(#bar3)" opacity="0.7"/>
  <rect x="425" y="160" width="100" height="240" rx="4" fill="none" stroke="#0088cc" stroke-width="1.5"/>
  <text x="475" y="295" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">60W</text>

  <line x1="530" y1="405" x2="530" y2="420" stroke="#1a2a44" stroke-width="1"/>
  <text x="530" y="415" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">51W PD</text>

  <!-- Bar group 4: 802.3bt Type 4 -->
  <rect x="570" y="100" width="100" height="300" rx="4" fill="url(#bar4)" opacity="0.9"/>
  <rect x="570" y="100" width="100" height="300" rx="4" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <text x="620" y="265" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="bold">90W</text>
  <text x="620" y="283" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" filter="url(#glow)">&#x2728; GAME CHANGER</text>

  <line x1="675" y1="405" x2="675" y2="420" stroke="#1a2a44" stroke-width="1"/>
  <text x="675" y="415" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">71.3W PD</text>

  <!-- X axis labels -->
  <text x="185" y="450" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="11" font-weight="bold">802.3af</text>
  <text x="185" y="466" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">Type 1 (2003)</text>

  <text x="330" y="450" text-anchor="middle" fill="#00cc88" font-family="monospace" font-size="11" font-weight="bold">802.3at</text>
  <text x="330" y="466" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">Type 2 (2009)</text>

  <text x="475" y="450" text-anchor="middle" fill="#0088cc" font-family="monospace" font-size="11" font-weight="bold">802.3bt</text>
  <text x="475" y="466" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="9">Type 3 (2018)</text>

  <text x="620" y="450" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">802.3bt</text>
  <text x="620" y="466" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" filter="url(#glow)">Type 4 (2018)</text>

  <!-- Wiring -->
  <text x="135" y="490" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">2-pair power</text>
  <text x="280" y="490" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">2-pair power</text>
  <text x="425" y="490" text-anchor="middle" fill="#667788" font-family="monospace" font-size="9">4-pair power</text>
  <text x="570" y="490" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9">4-pair power (all 8 wires)</text>

</svg>