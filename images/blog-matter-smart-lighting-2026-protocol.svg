<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="680" height="420" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40" x2="680" y2="40"/><line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="200" x2="680" y2="200"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="280" x2="680" y2="280"/><line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="68" y1="0" x2="68" y2="420"/><line x1="136" y1="0" x2="136" y2="420"/>
    <line x1="204" y1="0" x2="204" y2="420"/><line x1="272" y1="0" x2="272" y2="420"/>
    <line x1="340" y1="0" x2="340" y2="420"/><line x1="408" y1="0" x2="408" y2="420"/>
    <line x1="476" y1="0" x2="476" y2="420"/><line x1="544" y1="0" x2="544" y2="420"/>
    <line x1="612" y1="0" x2="612" y2="420"/>
  </g>
  
  <!-- Title -->
  <text x="340" y="38" text-anchor="middle" fill="#e0e8ff" font-family="monospace" font-size="18" font-weight="bold" filter="url(#glow)">MATTER 协议：让不同品牌的灯互相"说话"</text>
  
  <!-- Central Matter Hub (hexagon) -->
  <polygon points="340,140 380,120 420,140 420,180 380,200 340,180" fill="#1a3050" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <text x="380" y="155" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11" font-weight="bold">MATTER</text>
  <text x="380" y="175" text-anchor="middle" fill="#80cbc4" font-family="monospace" font-size="9">统一协议层</text>
  
  <!-- Protocol nodes (left side - "before Matter") -->
  <!-- Zigbee -->
  <rect x="60" y="90" width="120" height="50" rx="8" fill="#0d2137" stroke="#ff7043" stroke-width="1.5"/>
  <text x="120" y="115" text-anchor="middle" fill="#ff7043" font-family="monospace" font-size="12" font-weight="bold">Zigbee</text>
  <text x="120" y="135" text-anchor="middle" fill="#ff7043" font-family="monospace" font-size="9" opacity="0.7">飞利浦 Hue</text>
  
  <!-- Wi-Fi + BLE -->
  <rect x="60" y="155" width="120" height="50" rx="8" fill="#0d2137" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="120" y="180" text-anchor="middle" fill="#ab47bc" font-family="monospace" font-size="12" font-weight="bold">Wi-Fi&amp;BLE</text>
  <text x="120" y="200" text-anchor="middle" fill="#ab47bc" font-family="monospace" font-size="9" opacity="0.7">小米/涂鸦</text>
  
  <!-- DALI -->
  <rect x="60" y="220" width="120" height="50" rx="8" fill="#0d2137" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="120" y="245" text-anchor="middle" fill="#ffd54f" font-family="monospace" font-size="12" font-weight="bold">DALI-2</text>
  <text x="120" y="265" text-anchor="middle" fill="#ffd54f" font-family="monospace" font-size="9" opacity="0.7">商业照明</text>
  
  <!-- Thread -->
  <rect x="60" y="285" width="120" height="50" rx="8" fill="#0d2137" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="120" y="310" text-anchor="middle" fill="#66bb6a" font-family="monospace" font-size="12" font-weight="bold">Thread</text>
  <text x="120" y="330" text-anchor="middle" fill="#66bb6a" font-family="monospace" font-size="9" opacity="0.7">宜家/Nanoleaf</text>
  
  <!-- "Before" label -->
  <text x="120" y="78" text-anchor="middle" fill="#ef5350" font-family="monospace" font-size="11">❌ 各自孤立</text>
  
  <!-- Connection lines from protocols to Matter -->
  <line x1="180" y1="115" x2="340" y2="160" stroke="#ff7043" stroke-width="1" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="180" y1="180" x2="340" y2="160" stroke="#ab47bc" stroke-width="1" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="180" y1="245" x2="340" y2="160" stroke="#ffd54f" stroke-width="1" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="180" y1="310" x2="340" y2="160" stroke="#66bb6a" stroke-width="1" opacity="0.6" stroke-dasharray="4,3"/>
  
  <!-- Connection lines from Matter to controllers (right side) -->
  <line x1="420" y1="160" x2="540" y2="115" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <line x1="420" y1="160" x2="540" y2="190" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <line x1="420" y1="160" x2="540" y2="265" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <line x1="420" y1="160" x2="540" y2="340" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Controller nodes (right side - "after Matter") -->
  <!-- Apple Home -->
  <rect x="540" y="90" width="110" height="50" rx="8" fill="#0d2137" stroke="#4fc3f7" stroke-width="1.5" filter="url(#glow)"/>
  <text x="595" y="115" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11" font-weight="bold">Apple Home</text>
  <text x="595" y="135" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9" opacity="0.7">HomePod</text>
  
  <!-- Google Home -->
  <rect x="540" y="165" width="110" height="50" rx="8" fill="#0d2137" stroke="#4fc3f7" stroke-width="1.5" filter="url(#glow)"/>
  <text x="595" y="190" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11" font-weight="bold">Google Home</text>
  <text x="595" y="210" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9" opacity="0.7">Nest Hub</text>
  
  <!-- SmartThings -->
  <rect x="540" y="240" width="110" height="50" rx="8" fill="#0d2137" stroke="#4fc3f7" stroke-width="1.5" filter="url(#glow)"/>
  <text x="595" y="265" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11" font-weight="bold">SmartThings</text>
  <text x="595" y="285" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9" opacity="0.7">Samsung</text>
  
  <!-- 米家 -->
  <rect x="540" y="315" width="110" height="50" rx="8" fill="#0d2137" stroke="#4fc3f7" stroke-width="1.5" filter="url(#glow)"/>
  <text x="595" y="340" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11" font-weight="bold">米家</text>
  <text x="595" y="360" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9" opacity="0.7">小米生态</text>
  
  <!-- "After" label -->
  <text x="595" y="78" text-anchor="middle" fill="#66bb6a" font-family="monospace" font-size="11">✅ 统一联动</text>
  
  <!-- Bottom info bar -->
  <rect x="0" y="395" width="680" height="25" fill="#0a1020"/>
  <text x="340" y="412" text-anchor="middle" fill="#546e7a" font-family="monospace" font-size="10">MATTER 1.2 | Thread + Wi-Fi + Ethernet | IP-based | CSA 标准</text>
</svg>