<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad2)"/>

  <!-- Grid -->
  <g stroke="#1a3050" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="266" y1="50" x2="266" y2="460"/>
    <line x1="533" y1="50" x2="533" y2="460"/>
  </g>

  <text x="400" y="35" text-anchor="middle" fill="#5bcefa" font-size="16" font-family="Consolas,monospace" filter="url(#glow2)">新国标频闪双指标 | PST LM &amp; SVM</text>

  <!-- PST LM Box -->
  <rect x="30" y="60" width="230" height="380" rx="8" fill="#0f2840" stroke="#2a5a8a" stroke-width="1"/>
  <rect x="30" y="60" width="230" height="36" rx="8" fill="#1a4a6a"/>
  <text x="145" y="83" text-anchor="middle" fill="#7ec27e" font-size="14" font-family="Consolas,monospace" font-weight="bold" filter="url(#glow2)">PST LM</text>

  <text x="50" y="115" fill="#5bcefa" font-size="12" font-family="Consolas,monospace">短期闪烁指标</text>
  <text x="50" y="135" fill="#5a7a9a" font-size="9" font-family="Consolas,monospace">Short-term Flicker</text>

  <text x="50" y="165" fill="#8ab4d8" font-size="10" font-family="Consolas,monospace">测量的是：</text>
  <text x="50" y="183" fill="#bcd4e8" font-size="9" font-family="Consolas,monospace">灯光的瞬时亮度波动</text>
  <text x="50" y="200" fill="#bcd4e8" font-size="9" font-family="Consolas,monospace">"灯闪得有多厉害"</text>

  <!-- PST LM gauge -->
  <rect x="50" y="230" width="190" height="20" rx="4" fill="#1a3050"/>
  <rect x="50" y="230" width="95" height="20" rx="4" fill="url(#bgGrad2)" opacity="0.8"/>
  <rect x="50" y="230" width="190" height="20" rx="4" fill="none" stroke="#2a5a8a" stroke-width="1"/>

  <text x="60" y="244" fill="#7ec27e" font-size="8" font-family="Consolas,monospace">0.0</text>
  <text x="200" y="244" fill="#ff6b6b" font-size="8" font-family="Consolas,monospace">3.0</text>

  <!-- marker -->
  <rect x="90" y="225" width="4" height="30" fill="#7ec27e" filter="url(#glow2)"/>
  <text x="92" y="270" fill="#7ec27e" font-size="9" font-family="Consolas,monospace">≤1.0 合格</text>
  <text x="92" y="284" fill="#5a7a9a" font-size="8" font-family="Consolas,monospace">优秀: ≤0.5</text>

  <!-- warning -->
  <text x="50" y="315" fill="#ffaa33" font-size="9" font-family="Consolas,monospace">⚠ 超过1.0：眼疲劳、头痛</text>
  <text x="50" y="335" fill="#ffaa33" font-size="9" font-family="Consolas,monospace">⚠ 即使肉眼看不见</text>
  <text x="50" y="355" fill="#ffaa33" font-size="9" font-family="Consolas,monospace">⚠ 长期仍损害视力</text>

  <!-- Mobile test -->
  <text x="50" y="390" fill="#7a9aba" font-size="9" font-family="Consolas,monospace">自测:手机相机对准灯</text>
  <text x="50" y="410" fill="#7a9aba" font-size="9" font-family="Consolas,monospace">看画面有无滚动黑纹</text>

  <!-- SVM Box -->
  <rect x="285" y="60" width="230" height="380" rx="8" fill="#0f2840" stroke="#2a5a8a" stroke-width="1"/>
  <rect x="285" y="60" width="230" height="36" rx="8" fill="#1a4a6a"/>
  <text x="400" y="83" text-anchor="middle" fill="#7ec27e" font-size="14" font-family="Consolas,monospace" font-weight="bold" filter="url(#glow2)">SVM</text>

  <text x="305" y="115" fill="#5bcefa" font-size="12" font-family="Consolas,monospace">频闪效应可见度</text>
  <text x="305" y="135" fill="#5a7a9a" font-size="9" font-family="Consolas,monospace">Stroboscopic Visibility</text>

  <text x="305" y="165" fill="#8ab4d8" font-size="10" font-family="Consolas,monospace">测量的是：</text>
  <text x="305" y="183" fill="#bcd4e8" font-size="9" font-family="Consolas,monospace">频闪引起的视觉伪像</text>
  <text x="305" y="200" fill="#bcd4e8" font-size="9" font-family="Consolas,monospace">"人能不能感知闪烁效果"</text>

  <!-- SVM gauge -->
  <rect x="305" y="230" width="190" height="20" rx="4" fill="#1a3050"/>
  <rect x="305" y="230" width="127" height="20" rx="4" fill="url(#bgGrad2)" opacity="0.8"/>
  <rect x="305" y="230" width="190" height="20" rx="4" fill="none" stroke="#2a5a8a" stroke-width="1"/>

  <text x="315" y="244" fill="#7ec27e" font-size="8" font-family="Consolas,monospace">0.0</text>
  <text x="455" y="244" fill="#ff6b6b" font-size="8" font-family="Consolas,monospace">2.0</text>

  <!-- marker -->
  <rect x="370" y="225" width="4" height="30" fill="#7ec27e" filter="url(#glow2)"/>
  <text x="372" y="270" fill="#7ec27e" font-size="9" font-family="Consolas,monospace">≤1.0 合格</text>
  <text x="372" y="284" fill="#5a7a9a" font-size="8" font-family="Consolas,monospace">优秀: ≤0.4</text>

  <text x="305" y="315" fill="#ffaa33" font-size="9" font-family="Consolas,monospace">⚠ 比如风扇叶片看起来</text>
  <text x="305" y="335" fill="#ffaa33" font-size="9" font-family="Consolas,monospace">⚠ 像静止或反转</text>
  <text x="305" y="355" fill="#ffaa33" font-size="9" font-family="Consolas,monospace">⚠ 工业场景尤其危险</text>

  <!-- Mobile test -->
  <text x="305" y="390" fill="#7a9aba" font-size="9" font-family="Consolas,monospace">根源:驱动电源PWM频率</text>
  <text x="305" y="410" fill="#7a9aba" font-size="9" font-family="Consolas,monospace">&lt;3kHz → 频闪严重</text>

  <!-- Right: Root cause box -->
  <rect x="540" y="60" width="230" height="380" rx="8" fill="#0f2840" stroke="#2a5a8a" stroke-width="1"/>
  <rect x="540" y="60" width="230" height="36" rx="8" fill="#1a4a6a"/>
  <text x="655" y="83" text-anchor="middle" fill="#7ec27e" font-size="14" font-family="Consolas,monospace" font-weight="bold" filter="url(#glow2)">频闪根源</text>

  <text x="560" y="120" fill="#5bcefa" font-size="11" font-family="Consolas,monospace">驱动电源是根本</text>

  <text x="560" y="155" fill="#ff6b6b" font-size="10" font-family="Consolas,monospace">✗ 低成本驱动:</text>
  <text x="560" y="178" fill="#8ab4d8" font-size="9" font-family="Consolas,monospace">  PWM调光 + 低频开关</text>
  <text x="560" y="198" fill="#8ab4d8" font-size="9" font-family="Consolas,monospace">  频率&lt;500Hz → 严重频闪</text>

  <text x="560" y="235" fill="#7ec27e" font-size="10" font-family="Consolas,monospace">✓ 优质驱动:</text>
  <text x="560" y="258" fill="#8ab4d8" font-size="9" font-family="Consolas,monospace">  高频PWM &gt;3kHz</text>
  <text x="560" y="278" fill="#8ab4d8" font-size="9" font-family="Consolas,monospace">  或无频闪恒流方案</text>
  <text x="560" y="298" fill="#8ab4d8" font-size="9" font-family="Consolas,monospace">  输出波形平滑</text>

  <text x="560" y="340" fill="#ffaa33" font-size="9" font-family="Consolas,monospace">核心建议:</text>
  <text x="560" y="365" fill="#bcd4e8" font-size="10" font-family="Consolas,monospace">买灯前问商家:</text>
  <text x="560" y="388" fill="#5bcefa" font-size="11" font-family="Consolas,monospace" filter="url(#glow2)">"PST LM &amp;</text>
  <text x="560" y="406" fill="#5bcefa" font-size="11" font-family="Consolas,monospace" filter="url(#glow2)">SVM 分别多少?"</text>

  <text x="560" y="430" fill="#5a7a9a" font-size="8" font-family="Consolas,monospace">答不上来的, 大概率不合格</text>

  <!-- Bottom bar -->
  <text x="400" y="485" fill="#5a7a9a" font-size="9" font-family="Consolas,monospace" text-anchor="middle">GB/T 31831-2025 新国标首次对 PST LM 和 SVM 设定强制限值 — 2026年选购必查</text>
</svg>