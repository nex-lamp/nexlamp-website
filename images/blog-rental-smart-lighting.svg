      <text x="25" y="15" text-anchor="middle" fill="#b0a0ff" font-family="sans-serif" font-size="8">Zigbee</text>
      <text x="25" y="27" text-anchor="middle" fill="#8070b0" font-family="sans-serif" font-size="8">网关</text>
    </g>
