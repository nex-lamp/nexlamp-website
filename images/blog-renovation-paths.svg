<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">旧房智能照明改造三种路径对比</text>
  
  <!-- Path 1: Smart Bulb -->
  <g transform="translate(145,200)">
    <rect x="-100" y="-60" width="200" height="220" rx="12" fill="#0f1535" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="-30" text-anchor="middle" fill="#00d4ff" font-family="Arial,sans-serif" font-size="16" font-weight="bold">路径一：智能灯泡</text>
    <!-- Bulb icon -->
    <circle cx="0" cy="30" r="28" fill="none" stroke="#ffd700" stroke-width="2" filter="url(#glow)"/>
    <path d="M-12,50 L-12,65 L12,65 L12,50" fill="none" stroke="#ffd700" stroke-width="2"/>
    <line x1="-8" y1="55" x2="8" y2="55" stroke="#ffd700" stroke-width="1"/>
    <line x1="-8" y1="60" x2="8" y2="60" stroke="#ffd700" stroke-width="1"/>
    <!-- Wi-Fi waves -->
    <path d="M-8,10 Q0,-5 8,10" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
    <path d="M-14,15 Q0,-10 14,15" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    
    <text x="0" y="95" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="12">✓ 零施工，5分钟搞定</text>
    <text x="0" y="115" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="12">✗ 墙面开关断电失效</text>
    <text x="0" y="135" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="12">💰 30-80元/灯</text>
  </g>
  
  <!-- Arrow between 1 and 2 -->
  <line x1="260" y1="200" x2="290" y2="200" stroke="#2a3050" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Path 2: Wireless Switch -->
  <g transform="translate(400,200)">
    <rect x="-100" y="-60" width="200" height="220" rx="12" fill="#0f1535" stroke="#7c4dff" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="-30" text-anchor="middle" fill="#7c4dff" font-family="Arial,sans-serif" font-size="16" font-weight="bold">路径二：无线开关</text>
    <!-- Switch icon -->
    <rect x="-25" y="5" width="50" height="60" rx="6" fill="none" stroke="#7c4dff" stroke-width="2"/>
    <circle cx="0" cy="30" r="8" fill="#7c4dff" opacity="0.6"/>
    <!-- Signal waves -->
    <path d="M30,20 Q40,30 30,40" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
    <path d="M35,15 Q50,30 35,45" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
    
    <text x="0" y="95" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="12">✓ 不怕关开关断电</text>
    <text x="0" y="115" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="12">✓ 灵活粘贴位置</text>
    <text x="0" y="135" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="12">💰 60-150元/组</text>
  </g>
  
  <!-- Arrow between 2 and 3 -->
  <line x1="515" y1="200" x2="545" y2="200" stroke="#2a3050" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Path 3: Smart Switch -->
  <g transform="translate(655,200)">
    <rect x="-100" y="-60" width="200" height="220" rx="12" fill="#0f1535" stroke="#00e676" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="-30" text-anchor="middle" fill="#00e676" font-family="Arial,sans-serif" font-size="16" font-weight="bold">路径三：智能开关</text>
    <!-- Smart switch icon -->
    <rect x="-30" y="5" width="60" height="60" rx="8" fill="none" stroke="#00e676" stroke-width="2"/>
    <rect x="-20" y="15" width="18" height="18" rx="3" fill="#00e676" opacity="0.3" stroke="#00e676" stroke-width="1"/>
    <rect x="2" y="15" width="18" height="18" rx="3" fill="#00e676" opacity="0.6" stroke="#00e676" stroke-width="1"/>
    <rect x="-20" y="37" width="18" height="18" rx="3" fill="#00e676" opacity="0.5" stroke="#00e676" stroke-width="1"/>
    <rect x="2" y="37" width="18" height="18" rx="3" fill="#00e676" opacity="0.2" stroke="#00e676" stroke-width="1"/>
    
    <text x="0" y="95" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="12">✓ 最接近原生体验</text>
    <text x="0" y="115" text-anchor="middle" fill="#8892b0" font-family="Arial,sans-serif" font-size="12">✓ 多路场景控制</text>
    <text x="0" y="135" text-anchor="middle" fill="#ffd700" font-family="Arial,sans-serif" font-size="12">⚠ 需确认底盒条件</text>
  </g>
  
  <!-- Bottom recommendation bar -->
  <rect x="50" y="445" width="700" height="36" rx="8" fill="#1a2540" stroke="#00d4ff" stroke-width="0.5"/>
  <text x="400" y="468" text-anchor="middle" fill="#00d4ff" font-family="Arial,sans-serif" font-size="13">💡 建议：卧室先用智能灯泡体验 → 无线开关解决断电问题 → 全屋换智能开关</text>
</svg>