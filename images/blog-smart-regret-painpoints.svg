  <rect x="60" y="55" width="780" height="44" rx="12" fill="#12305a"/>
  <circle cx="90" cy="77" r="7" fill="#ff5f57"/>
  <circle cx="115" cy="77" r="7" fill="#febc2e"/>
  <circle cx="140" cy="77" r="7" fill="#28c840"/>
  <text x="450" y="83" text-anchor="middle" fill="#7fb8ff" font-size="17" font-weight="bold">user_complaints.log — 2026.09</text>
