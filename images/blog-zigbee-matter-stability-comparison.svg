<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#111d35"/>
    </linearGradient>
    <linearGradient id="barZig1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#008866"/>
    </linearGradient>
    <linearGradient id="barZig2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#008866"/>
    </linearGradient>
    <linearGradient id="barMat1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#883311"/>
    </linearGradient>
    <linearGradient id="barMat2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#883311"/>
    </linearGradient>
    <linearGradient id="barZig3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#008866"/>
    </linearGradient>
    <linearGradient id="barMat3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#883311"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="460" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#4a9eff">
    <line x1="0" y1="40" x2="680" y2="40"/><line x1="0" y1="80" x2="680" y2="80"/>
    <line x1="0" y1="120" x2="680" y2="120"/><line x1="0" y1="160" x2="680" y2="160"/>
    <line x1="0" y1="200" x2="680" y2="200"/><line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="280" x2="680" y2="280"/><line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="360" x2="680" y2="360"/><line x1="0" y1="400" x2="680" y2="400"/>
    <line x1="40" y1="0" x2="40" y2="460"/><line x1="80" y1="0" x2="80" y2="460"/>
    <line x1="160" y1="0" x2="160" y2="460"/><line x1="240" y1="0" x2="240" y2="460"/>
    <line x1="320" y1="0" x2="320" y2="460"/><line x1="400" y1="0" x2="400" y2="460"/>
    <line x1="480" y1="0" x2="480" y2="460"/><line x1="560" y1="0" x2="560" y2="460"/>
    <line x1="640" y1="0" x2="640" y2="460"/>
  </g>

  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" font-family="monospace" font-size="18" fill="#00d4aa" filter="url(#glow)" font-weight="bold">Zigbee vs Matter 组网稳定性对比 (2026 Q1 CSA测试数据)</text>

  <!-- Chart Area -->
  <!-- Metric 1: 设备自愈成功率 -->
  <text x="25" y="85" font-family="monospace" font-size="13" fill="#7799cc" font-weight="bold">设备自愈成功率</text>
  
  <!-- Zigbee bar 98.7% -->
  <rect x="180" y="70" width="440" height="36" rx="4" fill="#0a1a2f" stroke="#008866" stroke-width="0.5"/>
  <rect x="180" y="70" width="434.3" height="36" rx="4" fill="url(#barZig1)" opacity="0.85"/>
  <text x="626" y="93" text-anchor="middle" font-family="monospace" font-size="14" fill="#00d4aa" font-weight="bold">98.7%</text>
  <text x="155" y="93" text-anchor="end" font-family="monospace" font-size="12" fill="#00d4aa">Zigbee</text>

  <!-- Matter bar 91.2% -->
  <rect x="180" y="116" width="440" height="30" rx="4" fill="#1a0f0a" stroke="#883311" stroke-width="0.5"/>
  <rect x="180" y="116" width="401.3" height="30" rx="4" fill="url(#barMat1)" opacity="0.85"/>
  <text x="626" y="136" text-anchor="middle" font-family="monospace" font-size="14" fill="#ff6b35" font-weight="bold">91.2%</text>
  <text x="155" y="136" text-anchor="end" font-family="monospace" font-size="12" fill="#ff6b35">Matter</text>

  <!-- Metric 2: 100设备组网延迟 -->
  <text x="25" y="195" font-family="monospace" font-size="13" fill="#7799cc" font-weight="bold">100设备组网延迟</text>
  
  <rect x="180" y="180" width="440" height="36" rx="4" fill="#0a1a2f" stroke="#008866" stroke-width="0.5"/>
  <rect x="180" y="180" width="96" height="36" rx="4" fill="url(#barZig2)" opacity="0.85"/>
  <text x="282" y="203" text-anchor="middle" font-family="monospace" font-size="14" fill="#00d4aa" font-weight="bold">45ms</text>
  <text x="155" y="203" text-anchor="end" font-family="monospace" font-size="12" fill="#00d4aa">Zigbee</text>

  <rect x="180" y="226" width="440" height="30" rx="4" fill="#1a0f0a" stroke="#883311" stroke-width="0.5"/>
  <rect x="180" y="226" width="160" height="30" rx="4" fill="url(#barMat2)" opacity="0.85"/>
  <text x="346" y="246" text-anchor="middle" font-family="monospace" font-size="14" fill="#ff6b35" font-weight="bold">75ms</text>
  <text x="155" y="246" text-anchor="end" font-family="monospace" font-size="12" fill="#ff6b35">Matter</text>

  <!-- Metric 3: 跨Vendor互操作成功率 -->
  <text x="25" y="310" font-family="monospace" font-size="13" fill="#7799cc" font-weight="bold">跨品牌互操作成功率</text>
  
  <rect x="180" y="295" width="440" height="36" rx="4" fill="#0a1a2f" stroke="#008866" stroke-width="0.5"/>
  <rect x="180" y="295" width="424" height="36" rx="4" fill="url(#barZig3)" opacity="0.85"/>
  <text x="626" y="318" text-anchor="middle" font-family="monospace" font-size="14" fill="#00d4aa" font-weight="bold">96.4%</text>
  <text x="155" y="318" text-anchor="end" font-family="monospace" font-size="12" fill="#00d4aa">Zigbee</text>

  <rect x="180" y="341" width="440" height="30" rx="4" fill="#1a0f0a" stroke="#883311" stroke-width="0.5"/>
  <rect x="180" y="341" width="374" height="30" rx="4" fill="url(#barMat3)" opacity="0.85"/>
  <text x="626" y="361" text-anchor="middle" font-family="monospace" font-size="14" fill="#ff6b35" font-weight="bold">85.1%</text>
  <text x="155" y="361" text-anchor="end" font-family="monospace" font-size="12" fill="#ff6b35">Matter</text>

  <!-- Legend -->
  <rect x="170" y="402" width="16" height="14" rx="2" fill="#00d4aa"/>
  <text x="192" y="414" font-family="monospace" font-size="12" fill="#88aa99">Zigbee 3.0</text>
  <rect x="300" y="402" width="16" height="14" rx="2" fill="#ff6b35"/>
  <text x="322" y="414" font-family="monospace" font-size="12" fill="#cc9988">Matter over Thread</text>

  <!-- Source note -->
  <text x="340" y="442" text-anchor="middle" font-family="monospace" font-size="10" fill="#556677">数据来源：CSA连接标准联盟 2026 Q1 互操作性测试报告</text>
</svg>