<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Consolas','Microsoft YaHei',monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f2035"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e3a5f" stroke-width="0.3" opacity="0.5"/>
    </pattern>
    <pattern id="gridFine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1e3a5f" stroke-width="0.15" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="900" height="480" rx="8" fill="url(#bgGrad)"/>
  <rect width="900" height="480" rx="8" fill="url(#gridFine)"/>
  <rect width="900" height="480" rx="8" fill="url(#grid)"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="52" rx="8" fill="#0d1b2a" opacity="0.8"/>
  <rect x="0" y="48" width="900" height="4" fill="#22d3ee" opacity="0.3"/>
  <text x="450" y="33" text-anchor="middle" font-size="16" font-weight="bold" fill="#e2e8f0" letter-spacing="2">照明技术演进模型 · LIGHTING EVOLUTION MODEL</text>
