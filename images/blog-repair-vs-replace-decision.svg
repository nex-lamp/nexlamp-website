<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0e1f38"/>
    </linearGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5cc8e8"/>
    </marker>
  </defs>
  <rect width="680" height="620" fill="url(#bg3)"/>
  <g stroke="#1b3355" stroke-width="1">
    <line x1="0" y1="68" x2="680" y2="68"/><line x1="0" y1="136" x2="680" y2="136"/>
    <line x1="0" y1="204" x2="680" y2="204"/><line x1="0" y1="272" x2="680" y2="272"/>
    <line x1="0" y1="340" x2="680" y2="340"/><line x1="0" y1="408" x2="680" y2="408"/>
    <line x1="0" y1="476" x2="680" y2="476"/><line x1="0" y1="544" x2="680" y2="544"/>
    <line x1="97" y1="0" x2="97" y2="620"/><line x1="194" y1="0" x2="194" y2="620"/>
    <line x1="291" y1="0" x2="291" y2="620"/><line x1="388" y1="0" x2="388" y2="620"/>
    <line x1="485" y1="0" x2="485" y2="620"/><line x1="582" y1="0" x2="582" y2="620"/>
  </g>
  <text x="34" y="44" fill="#7ec27e" font-family="sans-serif" font-size="24" font-weight="bold" filter="url(#glow3)">修还是换 · 三步决策流程</text>
  <text x="646" y="44" fill="#3d5a80" font-family="sans-serif" font-size="12" text-anchor="end">NEXLAMP</text>

  <!-- Step 1 -->
  <rect x="140" y="70" width="400" height="66" rx="10" fill="#12233f" stroke="#5cc8e8" stroke-width="1.5"/>
  <rect x="156" y="84" width="72" height="26" rx="6" fill="#5cc8e8" opacity="0.18"/>
  <text x="192" y="102" fill="#5cc8e8" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">第一步</text>
  <text x="244" y="102" fill="#e8f4e8" font-family="sans-serif" font-size="16" font-weight="bold">先排除软件问题</text>
  <text x="156" y="126" fill="#9db8d9" font-family="sans-serif" font-size="12.5">约 40% 的"故障"只是断网/改WiFi密码/没重新配网</text>

  <line x1="340" y1="136" x2="340" y2="156" stroke="#5cc8e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="140" y="160" width="400" height="66" rx="10" fill="#12233f" stroke="#7ec27e" stroke-width="1.5"/>
  <rect x="156" y="174" width="72" height="26" rx="6" fill="#7ec27e" opacity="0.18"/>
  <text x="192" y="192" fill="#7ec27e" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">第二步</text>
  <text x="244" y="192" fill="#e8f4e8" font-family="sans-serif" font-size="16" font-weight="bold">确认硬件坏了 → 自救</text>
  <text x="156" y="216" fill="#9db8d9" font-family="sans-serif" font-size="12.5">会烙铁：焊电容 3-7 元 ｜ 不敢焊：换驱动十几元</text>

  <line x1="340" y1="226" x2="340" y2="246" stroke="#5cc8e8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="140" y="250" width="400" height="80" rx="10" fill="#12233f" stroke="#e86a6a" stroke-width="1.5"/>
  <rect x="156" y="264" width="72" height="26" rx="6" fill="#e86a6a" opacity="0.18"/>
  <text x="192" y="282" fill="#e86a6a" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">第三步</text>
  <text x="244" y="282" fill="#e8f4e8" font-family="sans-serif" font-size="16" font-weight="bold">命中红线 → 直接换新</text>
  <text x="156" y="306" fill="#9db8d9" font-family="sans-serif" font-size="12.5">· 灯价低于 300 元且维修报价超 150 元</text>
  <text x="156" y="324" fill="#9db8d9" font-family="sans-serif" font-size="12.5">· 灯龄超 8 年 ｜ 灯珠大面积烧黑</text>

  <!-- side branch: driver matching -->
  <line x1="540" y1="193" x2="586" y2="193" stroke="#7ec27e" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="448" y="352" width="232" height="130" rx="10" fill="#0d1c33" stroke="#7ec27e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="464" y="378" fill="#7ec27e" font-family="sans-serif" font-size="14" font-weight="bold">换驱动认准 3 参数</text>
  <text x="464" y="404" fill="#e8f4e8" font-family="sans-serif" font-size="13">① 输出电压（12/24/36V）</text>
  <text x="464" y="426" fill="#e8f4e8" font-family="sans-serif" font-size="13">② 输出电流（mA）</text>
  <text x="464" y="448" fill="#e8f4e8" font-family="sans-serif" font-size="13">③ 功率 + 协议一致</text>
  <text x="464" y="472" fill="#9db8d9" font-family="sans-serif" font-size="11.5">涂鸦灯就换涂鸦Zigbee驱动</text>

  <!-- buying tips -->
  <rect x="34" y="502" width="612" height="98" rx="10" fill="#0d1c33" stroke="#2a4a75" stroke-width="1.5"/>
  <text x="56" y="530" fill="#7ec27e" font-family="sans-serif" font-size="15" font-weight="bold">买下一盏灯时，把这篇反过来用</text>
  <text x="56" y="556" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">① 问驱动方案与电容品质 ② 问灯罩/驱动是否易拆装（省约30%维修成本）</text>
  <text x="56" y="578" fill="#e8f4e8" font-family="sans-serif" font-size="12.5">③ 驱动敢保5年的才有底气 ④ 认准 3C 认证 —— 坏的不是灯珠，是驱动</text>
</svg>
