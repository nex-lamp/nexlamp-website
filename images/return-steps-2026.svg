<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="760" fill="url(#bg3)"/>
  <g stroke="#12305a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="95" x2="1080" y2="95"/><line x1="0" y1="190" x2="1080" y2="190"/>
    <line x1="0" y1="285" x2="1080" y2="285"/><line x1="0" y1="380" x2="1080" y2="380"/>
    <line x1="0" y1="475" x2="1080" y2="475"/><line x1="0" y1="570" x2="1080" y2="570"/>
    <line x1="0" y1="665" x2="1080" y2="665"/>
    <line x1="180" y1="0" x2="180" y2="760"/><line x1="360" y1="0" x2="360" y2="760"/>
    <line x1="540" y1="0" x2="540" y2="760"/><line x1="720" y1="0" x2="720" y2="760"/>
    <line x1="900" y1="0" x2="900" y2="760"/>
  </g>
  <text x="540" y="54" text-anchor="middle" font-size="28" font-weight="bold" fill="#e8f1ff">双11 收灯四步防护 + 三级维权路径</text>
  <text x="540" y="84" text-anchor="middle" font-size="15" fill="#7aa5d8">证据留前面，条款亮后面 · 十分钟成本换掉一个月扯皮</text>

  <!-- 四步防护 -->
  <g>
    <rect x="30" y="120" width="235" height="180" rx="12" fill="#101f38" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="147" y="152" text-anchor="middle" font-size="16" fill="#38bdf8" font-weight="bold">① 签收前</text>
    <text x="147" y="186" text-anchor="middle" font-size="13" fill="#cfe0f5">外包装完好再签</text>
    <text x="147" y="212" text-anchor="middle" font-size="13" fill="#cfe0f5">破损当场拒收或拍照</text>
    <text x="147" y="252" text-anchor="middle" font-size="12" fill="#7aa5d8">运输段责任签收后难举证</text>

    <rect x="295" y="120" width="235" height="180" rx="12" fill="#101f38" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="412" y="152" text-anchor="middle" font-size="16" fill="#38bdf8" font-weight="bold">② 开箱时</text>
    <text x="412" y="186" text-anchor="middle" font-size="13" fill="#cfe0f5">全程录像</text>
    <text x="412" y="212" text-anchor="middle" font-size="13" fill="#cfe0f5">包装拍到配件到本体</text>
    <text x="412" y="252" text-anchor="middle" font-size="12" fill="#7aa5d8">市监局双11 提示标准动作</text>

    <rect x="560" y="120" width="235" height="180" rx="12" fill="#101f38" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="677" y="152" text-anchor="middle" font-size="16" fill="#38bdf8" font-weight="bold">③ 安装时</text>
    <text x="677" y="186" text-anchor="middle" font-size="13" fill="#cfe0f5">通电验收后再放师傅走</text>
    <text x="677" y="212" text-anchor="middle" font-size="13" fill="#cfe0f5">试每个色段、每档亮度</text>
    <text x="677" y="252" text-anchor="middle" font-size="12" fill="#7aa5d8">"自己手机上试试"是隐患</text>

    <rect x="825" y="120" width="235" height="180" rx="12" fill="#101f38" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="942" y="152" text-anchor="middle" font-size="16" fill="#fbbf24" font-weight="bold">④ 确认收货</text>
    <text x="942" y="186" text-anchor="middle" font-size="13" fill="#cfe0f5">全屋逐个点亮过关</text>
    <text x="942" y="212" text-anchor="middle" font-size="13" fill="#cfe0f5">再点"确认收货"</text>
    <text x="942" y="252" text-anchor="middle" font-size="12" fill="#7aa5d8">七日从签收次日起算</text>

    <line x1="268" y1="210" x2="290" y2="210" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="290,204 300,210 290,216" fill="#38bdf8"/>
    <line x1="533" y1="210" x2="555" y2="210" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="555,204 565,210 555,216" fill="#38bdf8"/>
    <line x1="798" y1="210" x2="820" y2="210" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="820,204 830,210 820,216" fill="#38bdf8"/>
  </g>

  <!-- 三级维权 -->
  <g>
    <text x="60" y="370" font-size="18" fill="#e8f1ff" font-weight="bold">真要维权，按三级走：</text>
    <rect x="60" y="400" width="960" height="92" rx="12" fill="#0e1830" stroke="#34d399" stroke-width="1.5"/>
    <text x="90" y="438" font-size="16" fill="#34d399" font-weight="bold">第一级 · 平台介入</text>
    <text x="90" y="470" font-size="13" fill="#cfe0f5">申请退货选"质量问题"，附开箱录像、故障照片、聊天记录 — 多数纠纷止于此</text>
    <text x="960" y="438" text-anchor="end" font-size="12" fill="#7aa5d8">成功率最高</text>

    <rect x="60" y="512" width="960" height="92" rx="12" fill="#0e1830" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="90" y="550" font-size="16" fill="#a78bfa" font-weight="bold">第二级 · 行政投诉</text>
    <text x="90" y="582" font-size="13" fill="#cfe0f5">拨 12315 / 全国 12315 平台提交 / "消协 315" 小程序</text>

    <rect x="60" y="624" width="960" height="92" rx="12" fill="#0e1830" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="90" y="662" font-size="16" fill="#fbbf24" font-weight="bold">第三级 · 诉讼</text>
    <text x="90" y="694" font-size="13" fill="#cfe0f5">金额大、争议大时：六个月举证责任倒置在手，起诉成本比想象中低</text>

    <line x1="540" y1="492" x2="540" y2="506" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="534,506 540,516 546,506" fill="#38bdf8"/>
    <line x1="540" y1="604" x2="540" y2="618" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="534,618 540,628 546,618" fill="#38bdf8"/>
  </g>
</svg>
